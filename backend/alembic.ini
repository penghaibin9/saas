# Alembic config. Keep this file ASCII-only: configparser reads it with the
# system locale encoding, which breaks on GBK/Windows if non-ASCII bytes appear.
# The DB URL is taken from env var DATABASE_URL (see alembic/env.py); the value
# below is only a placeholder default.
# MySQL-only baseline (2026-07-07): default dialect is MySQL (utf8mb4).
# sqlite = legacy demo only; postgresql = legacy compatibility only.
# Always set DATABASE_URL to your real MySQL URL before running migrations.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = mysql+pymysql://saas_user:@127.0.0.1:3306/student_lifecycle_dev?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
