[pytest]
# 让 `pytest`（控制台脚本）与 `python -m pytest` 一样能导入 backend/ 下的 app 包。
# CI 用裸 pytest 运行，不加 CWD 到 sys.path，缺此项会 ModuleNotFoundError: No module named 'app'。
pythonpath = .
testpaths = tests
# 仅适配显式使用 graduation_client 的旧毕设回归；通用 client 仍为原生 TestClient。
# fresh MySQL 毕设用例额外重放规范 SCHOOL_ADMIN 发布模板，生产 runtime 仍保持模板缺失 fail-closed。
# W7 submit adapter 只为 pre-W7 HTTP fixture 补当前 review.version + 已冻结 FileVersion；不创建证据、不放宽生产鉴权。
addopts = -p tests.graduation_legacy_contract_plugin -p tests.graduation_legacy_rule_plugin -p tests.graduation_legacy_review_archive_plugin -p tests.graduation_legacy_review_submit_plugin -p tests.graduation_authority_baseline_plugin
