[pytest]
# 让 `pytest`（控制台脚本）与 `python -m pytest` 一样能导入 backend/ 下的 app 包。
# CI 用裸 pytest 运行，不加 CWD 到 sys.path，缺此项会 ModuleNotFoundError: No module named 'app'。
pythonpath = .
testpaths = tests
# 仅适配显式使用 graduation_client 的旧毕设回归；通用 client 仍为原生 TestClient。
addopts = -p tests.graduation_legacy_contract_plugin -p tests.graduation_legacy_rule_plugin -p tests.graduation_legacy_review_archive_plugin
