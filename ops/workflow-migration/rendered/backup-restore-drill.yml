name: Backup restore drill

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/backup/**'
      - 'deploy/systemd/school-lifecycle-backup.*'
      - 'deploy/env/backup.env.example'
      - '.github/workflows/backup-restore-drill.yml'
  schedule:
    # Weekly isolated restore proof; never connects to production.
    - cron: '45 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-drill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  restore-drill:
    name: Verified backup -> isolated MySQL -> readiness/login/isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: backup_source
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      APP_ENV: test
      DEPLOYMENT_MODE: local
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: backup_source
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/backup_source?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/backup_source?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/13
      REDIS_KEY_PREFIX: backup-restore-drill
      JWT_SECRET: backup-restore-drill-secret-at-least-32-bytes
      MOCK_LOGIN_ENABLED: 'false'
      INTERNAL_OPS_TOKEN: backup-restore-drill-ops-token-20260807
      SCHEDULER_MODE: external
      BACKUP_DIR: /tmp/school-lifecycle-backup-drill
      KEEP_DAYS: '2'
      UPLOAD_DIR: /tmp/nonexistent-upload-dir
      BACKUP_REQUIRE_OFFSITE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install MySQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install cryptography
      - name: Build source database through the real migration chain
        working-directory: backend
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"
          alembic upgrade head
          alembic current
          python scripts/_seed_login_accounts_only.py
      - name: Produce and verify backup with the production scripts
        run: |
          bash deploy/backup/backup-runner.sh
          BACKUP_FILE="$(find "$BACKUP_DIR" -maxdepth 1 -type f -name 'db_backup_source_*.sql.gz' | sort | tail -n1)"
          test -n "$BACKUP_FILE"
          test -f "${BACKUP_FILE}.sha256"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
      - name: Restore only into a disposable local drill database
        run: bash deploy/backup/restore-drill.sh "$BACKUP_FILE" backup_restore_drill
      - name: Verify Alembic state on restored database
        working-directory: backend
        env:
          DB_NAME: backup_restore_drill
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/backup_restore_drill?charset=utf8mb4
          TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/backup_restore_drill?charset=utf8mb4
        run: alembic current
      - name: Start backend from restored database
        env:
          DB_NAME: backup_restore_drill
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/backup_restore_drill?charset=utf8mb4
          TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/backup_restore_drill?charset=utf8mb4
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/restore-drill-backend.log 2>&1 &
          echo $! > /tmp/restore-drill-backend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/restore-drill-backend.log
          exit 1
      - name: Verify readiness, real login and tenant isolation after restore
        run: |
          curl -fsS -H "X-Ops-Token: $INTERNAL_OPS_TOKEN" http://127.0.0.1:8000/health/ready > /tmp/ready.json
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          def post(payload):
              req = urllib.request.Request(
                  'http://127.0.0.1:8000/api/v1/auth/login',
                  data=json.dumps(payload).encode(),
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=10) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  try:
                      payload = json.loads(body)
                  except json.JSONDecodeError:
                      payload = {'raw': body}
                  return exc.code, payload

          status, good = post({
              'tenantCode': 'demo-school', 'loginName': 'admin', 'password': '123456', 'clientType': 'PC'
          })
          assert status == 200 and good.get('code') == 0, (status, good)

          bad_status, bad = post({
              'tenantCode': 'sandbox-school', 'loginName': 'admin', 'password': '123456', 'clientType': 'PC'
          })
          assert bad_status >= 400 or bad.get('code') != 0, (bad_status, bad)
          print('restore_login=ok cross_tenant_login=blocked')
          PY
      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backup-restore-drill-${{ github.run_id }}
          path: |
            /tmp/ready.json
            /tmp/restore-drill-backend.log
            /tmp/school-lifecycle-backup-drill/*.sha256
          if-no-files-found: warn
          retention-days: 14
