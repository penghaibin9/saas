# Internal HTTP gateway. Bind its host port to loopback and terminate HTTPS in
# the host gateway. The outer gateway must replace X-Forwarded-Prefix/Proto.
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;
    server_tokens off;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location = /health/ready { proxy_pass http://backend:8000/health/ready; access_log off; }
    location ~ ^/(?:student/|enterprise/|mobile/)?assets/.*\.mjs$ {
        root /usr/share/nginx/html;
        types { application/javascript mjs; }
        try_files $uri /admin$uri =404;
    }
    location /student/ { root /usr/share/nginx/html; try_files $uri $uri/ /student/index.html; }
    location /enterprise/ { root /usr/share/nginx/html; try_files $uri $uri/ /enterprise/index.html; }
    location = /mobile { return 301 $http_x_forwarded_prefix/mobile/; }
    location /mobile/ { root /usr/share/nginx/html; try_files $uri $uri/ /mobile/index.html; }
    location / { root /usr/share/nginx/html/admin; try_files $uri $uri/ /index.html; }
}
