# Private container network only. These limits match the 20 MiB upload contract.
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
User clamav
Foreground yes
StreamMaxLength 25M
MaxScanSize 100M
MaxFileSize 25M
MaxRecursion 16
MaxFiles 200
MaxThreads 2
MaxQueue 8
ReadTimeout 30
CommandReadTimeout 10
ScanArchive yes
AlertExceedsMax yes
AlertEncrypted yes
