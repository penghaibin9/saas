const scenarios=[{"key":"leave","name":"请假 → 返校","module":"sa-leave","summary":"短假示例 · 4 小时事假 · 同一申请贯穿四端","nodes":{"draft":{"label":"待提交","actor":"学生本人","help":"学生 PC 与小程序都可发起本人申请。"},"review":{"label":"辅导员审批","actor":"辅导员","help":"本例 4 小时，辅导员为终审节点；长假会按当前代码进入更高节点。"},"returned":{"label":"退回补充","actor":"学生本人","help":"保留原单据；修改后重新提交。"},"rejected":{"label":"已驳回","actor":"办理结束","help":"原申请结束；如仍需请假，应重新申请。"},"approved":{"label":"已通过 · 待返校","actor":"学生本人","help":"已通过的申请可发起续假或提交销假。"},"extension":{"label":"续假审核中","actor":"辅导员","help":"续假通过才更新结束时间；不通过保留原假期。"},"cancel":{"label":"返校待确认","actor":"辅导员","help":"学生已提交销假，尚未完成老师确认。"},"closed":{"label":"已销假","actor":"办理结束","help":"原单据进入台账，学生可查看完成记录。"}},"actions":[{"from":"draft","to":"review","role":"student","label":"提交申请","note":""},{"from":"review","to":"approved","role":"teacher","label":"通过申请","note":""},{"from":"review","to":"returned","role":"teacher","label":"退回补充","note":"示例原因：请补充具体离校事由。"},{"from":"review","to":"rejected","role":"teacher","label":"驳回申请","note":"示例原因：申请事项不符合当前条件。"},{"from":"returned","to":"review","role":"student","label":"补充后重新提交","note":""},{"from":"approved","to":"extension","role":"student","label":"申请续假","note":""},{"from":"extension","to":"approved","role":"teacher","label":"通过续假","note":""},{"from":"extension","to":"approved","role":"teacher","label":"不予续假","note":"保留原请假结束时间。"},{"from":"approved","to":"cancel","role":"student","label":"提交销假","note":""},{"from":"cancel","to":"approved","role":"teacher","label":"退回销假","note":"示例原因：请核对实际返校时间。"},{"from":"cancel","to":"closed","role":"teacher","label":"确认返校","note":""}],"handoff":"逾期未销假进入老师的逾期处置，可联系家校或转风险；本例不自动制造逾期。"},{"key":"dorm","name":"调宿 → 床位交接","module":"sa-dorm","summary":"调宿示例 · 3 栋 206 → 3 栋 208","nodes":{"draft":{"label":"待提交","actor":"学生本人","help":"只显示本人开放范围内的床位。"},"counselor":{"label":"辅导员审核","actor":"辅导员","help":"核对调宿理由与学生情况。"},"manager":{"label":"宿管审核","actor":"宿管","help":"核对目标床位，执行时再次检查占用冲突。"},"moved":{"label":"调宿完成","actor":"办理结束","help":"旧床释放、新 已满足 · 不演示银行支付","nodes":{"draft":{"label":"待提交","actor":"学生本人","help":"选择开放项目批次，阅读要求并提交本人申请。"},"counselor":{"label":"辅导员审核","actor":"辅导员","help":"按当前节点核验申请。"},"college":{"label":"学院审核","actor":"学院学工","help":"复核资格、额度与材料。"},"school":{"label":"学校审核","actor":"学工处","help":"审核拟资助名单。"},"publicity":{"label":"公示中","actor":"公示经办人员","help":"异议与申诉处理后才能按规则确认。"},"granted":{"label":"已获资助","actor":"发放经办人","help":"获资助并不等于已经到账。"},"prepared":{"label":"待发放登记","actor":"发放经办人","help":"已生成发放台账，核实执行结果后登记。"},"issued":{"label":"已登记发放","actor":"办理结束","help":"这里只证明发放记录，不能证明银行到账。"},"failed":{"label":"发放登记失败","actor":"发放经办人","help":"保留失败原因，核实后继续处理。"},"returned":{"label":"待补充重提","actor":"学生本人","help":"学生在任一本人渠道打开原申请补充。"}},"actions":[{"from":"draft","to":"counselor","role":"student","label":"提交奖助申请","note":""},{"from":"counselor","to":"college","role":"teacher","label":"辅导员通过","note":""},{"from":"counselor","to":"returned","role":"teacher","label":"退回补充","note":"示例原因：请补充项目申请说明。"},{"from":"returned","to":"counselor","role":"student","label":"补充后重提","note":""},{"from":"college","to":"school","role":"teacher","label":"学院通过","note":""},{"from":"school","to":"publicity","role":"teacher","label":"学校通过","note":""},{"from":"publicity","to":"granted","role":"teacher","label":"确认公示结束","note":"演练前提：公示期及适用申诉门槛已满足。"},{"from":"granted","to":"prepared","role":"teacher","label":"生成发放台账","note":""},{"from":"prepared","to":"issued","role":"teacher","label":"登记已发放","note":""},{"from":"prepared","to":"failed","role":"teacher","label":"登记发放失败","note":""}],"handoff":"困难认定提供资格依据；发放台账提供执行记录；文件任务与成长档案引用各自确认结果。失败重办政策本例未模拟。"},{"key":"activity","name":"报名 → 积分","module":"sa-activities","summary":"校园志愿服务示例 · 活动已发布且开放报名","nodes":{"draft":{"label":"可报名","actor":"学生本人","help":"核对活动时间、地点与要求。"},"enrolled":{"label":"已报名","actor":"学生本人","help":"按活动开放时间使用有效签到凭证。"},"checked":{"label":"已签到","actor":"活动负责人","help":"签到只记录参加情况，积分尚未入账。"},"finished":{"label":"活动已结束","actor":"活动负责人","help":"复核实际名单和成果后确认。"},"credited":{"label":"积分已入账","actor":"学生本人","help":"本人可以查看记录，缺记或错记可申诉。"},"appeal":{"label":"积分申诉待复核","actor":"认定人员","help":"核对来源和主张数值。"},"adjusted":{"label":"申诉已处理","actor":"办理结束","help":"更正追加流水，保留原积分记录。"}},"actions":[{"from":"draft","to":"enrolled","role":"student","label":"报名活动","note":""},{"from":"enrolled","to":"checked","role":"student","label":"使用有效凭证签到","note":"仅演练有效凭证结果，不生成真实签到码。"},{"from":"checked","to":"finished","role":"teacher","label":"登记活动结束","note":""},{"from":"finished","to":"credited","role":"teacher","label":"确认名单与积分","note":""},{"from":"credited","to":"appeal","role":"student","label":"提交错记申诉","note":""},{"from":"appeal","to":"adjusted","role":"teacher","label":"复核并追加更正","note":""}],"handoff":"确认积分 → 成长档案。撤销确认用冲正记录，不能直接删除历史流水。"},{"key":"material","name":"缺项 → 补交 → 审核","module":"sa-profile","summary":"材料补交示例 · 同一材料要求与文件版本","nodes":{"draft":{"label":"待补交","actor":"学生本人","help":"从本人缺项清单进入，知道补什么以及截止时间。"},"submitted":{"label":"已补交待审核","actor":"材料审核人员","help":"提交绑定稳定文件标识和版本，不保存临时下载链接。"},"returned":{"label":"材料退回","actor":"学生本人","help":"保留旧版本和退回原因，上传新版本再次提交。"},"accepted":{"label":"材料审核通过","actor":"办理结束","help":"仅完成该项材料；归档仍需包完整、审核和封存。"}},"actions":[{"from":"draft","to":"submitted","role":"student","label":"提交新版本材料","note":"使用内置示例材料，不上传本机文件。"},{"from":"submitted","to":"returned","role":"teacher","label":"退回材料","note":"示例原因：图片内容不清晰，请补交清晰版本。"},{"from":"returned","to":"submitted","role":"student","label":"补交清晰版本","note":""},{"from":"submitted","to":"accepted","role":"teacher","label":"审核通过","note":""}],"handoff":"材料通过 → 更新缺项清单 → 档案包预检。材料通过不等于档案已封存。"}];
function availableActions(scenario,state,role){return scenario.actions.filter(a=>a.from===state&&a.role===role);}
function transition(scenario,record,actionIndex,role,expectedVersion){
 if(record.version!==expectedVersion)return {ok:false,code:'STALE'};
 const action=scenario.actions[actionIndex];
 if(!action||action.from!==record.state||action.role!==role)return {ok:false,code:'FORBIDDEN'};
 return {ok:true,record:{state:action.to,version:record.version+1,history:[...record.history,{label:action.label,role,note:action.note,state:action.to}]}};
}
const el=id=>document.getElementById(id),esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ends=[['student-pc','学生 PC','student'],['student-mini','学生小程序','student'],['teacher-pc','教师 PC','teacher'],['teacher-mini','教师小程序','teacher']];
const params=new URLSearchParams(location.search);let scenario=scenarios.find(s=>s.key===params.get('scenario'))||scenarios[0],end=ends.find(e=>e[0]===params.get('end'))||ends[0],pending=null,record,stale=false,persistent=true;
if(params.get('theme')==='sage')document.body.classList.add('sage');
const storageKey=()=>`affairs-design-rehearsal-v1:${scenario.key}`;
const emptyRecord=()=>({state:'draft',version:1,history:[]});
function readRecord(){try{const value=JSON.parse(localStorage.getItem(storageKey()));if(value&&scenario.nodes[value.state]&&Number.isInteger(value.version)&&Array.isArray(value.history))return {state:value.state,version:value.version,history:value.history.filter(item=>scenario.actions.some(a=>a.label===item.label&&a.to===item.state&&a.role===item.role)).slice(-40).map(item=>({label:item.label,state:item.state,role:item.role,note:scenario.actions.find(a=>a.label===item.label&&a.to===item.state)?.note||''}))};}catch{persistent=false;}return record||emptyRecord();}
function saveRecord(value){record=value;try{localStorage.setItem(storageKey(),JSON.stringify(value));}catch{persistent=false;}}
function showNotice(text){el('notice-text').textContent=text;el('notice').hidden=false;}
function refresh(){record=readRecord();stale=false;el('notice').hidden=true;render();}
function render(){
 const node=scenario.nodes[record.state],actions=availableActions(scenario,record.state,end[2]).sort((a,b)=>Number(/退回|驳回|不予|失败/.test(a.label))-Number(/退回|驳回|不予|失败/.test(b.label)));
 el('scenarios').innerHTML='<h2>核心流转样板 · 6 条</h2>'+scenarios.map(s=>`<button class="scenario" data-scenario="${s.key}" aria-current="${s===scenario}">${s.name}</button>`).join('');
 el('title').textContent=scenario.name;el('summary').textContent=scenario.summary;
 el('ends').innerHTML=ends.map(e=>`<button data-end="${e[0]}" aria-pressed="${e===end}">${e[1]}</button>`).join('');
 el('device').classList.toggle('mobile',end[0].endsWith('mini'));
 const history=record.history.filter(item=>end[2]==='teacher'||item.role==='student'||['returned','rejected','approved','closed','moved','confirmed','granted','issued','failed','credited','adjusted','accepted'].includes(item.state));
 el('device').innerHTML=`<div class="device-header"><strong>${end[2]==='student'?'我的办理':'当前待办'}</strong><span>${end[1]} · ${end[2]==='student'?'仅本人':esc(node.actor==='学生本人'||node.actor==='办理结束'?'已办查询':node.actor)}</span></div><div class="status-card"><small>示例单据 · 20260905-001</small><h2>${esc(node.label)}</h2><p>${esc(node.help)}</p></div><div class="card-body"><dl class="facts"><dt>办理事项</dt><dd>${scenario.name}</dd><dt>申请人</dt><dd>示例同学 · 计算机 2401</dd><dt>下一办理人</dt><dd>${esc(node.actor)}</dd></dl><div class="section-label">${end[2]==='student'?'本人可见进度':'处理记录'}</div><ol class="steps">${history.length?history.map(item=>`<li>${esc(item.label)}<small>${item.role==='student'?'学生本人':'当前节点经办人员'} · ${esc(scenario.nodes[item.state].label)}${item.note?'<br>'+esc(item.note):''}</small></li>`).join(''):'<li>已进入办理页面<small>尚未提交示例单据</small></li>'}</ol></div><div class="actions">${actions.length?actions.map((a,i)=>`<button class="${i===0?'primary':''}" data-action="${scenario.actions.indexOf(a)}">${esc(a.label)}</button>`).join(''):`<p>${node.actor==='办理结束'?'本次办理已结束，可在记录中查询。':`等待${esc(node.actor)}处理；本端无需重复提交。`}</p>`}</div>`;
 el('side').innerHTML=`<section><h2>同一笔业务，换端继续</h2><p>切换上方端口，查看学生和老师各自能做什么。端口变化保留这笔示例单据。</p><div class="reference"><a href="学生PC-同壳设计.html?theme=${params.get('theme')==='sage'?'sage':'dark'}">打开学生 PC 同壳</a><a href="C-自定义快捷栏.html?theme=${params.get('theme')==='sage'?'sage':'dark'}">打开教师 PC 同壳</a></div><h3>后续业务衔接</h3><div class="handoff">${esc(scenario.handoff)}</div></section><section><h3>并发与恢复演练</h3><p>模拟另一端先处理，再尝试当前页的旧操作。应提示更新详情，不能重复提交。</p><button class="plain" id="simulate" ${scenario.actions.some(a=>a.from===record.state)?'':'disabled'}>模拟另一端先处理</button><p>${persistent?'仅保存内置示例状态，不保存真实表单信息。':'浏览器存储不可用，演练仅保留在本页。'}</p></section><div class="summary-grid">${ends.map(e=>`<div class="end-summary ${e===end?'active':''}"><strong>${e[1]}</strong>${e[2]===end[2]?'相同身份 · 同一单据':'独立身份 · 接续办理'}</div>`).join('')}</div>`;
 historyUrl();
}
function historyUrl(){history.replaceState(null,'',`?scenario=${scenario.key}&end=${end[0]}&theme=${document.body.classList.contains('sage')?'sage':'dark'}`);}
async function locked(task){return navigator.locks? navigator.locks.request('affairs-design-rehearsal',task):task();}
document.addEventListener('click',async event=>{const button=event.target.closest('button');if(!button)return;
 if(button.dataset.scenario){scenario=scenarios.find(s=>s.key===button.dataset.scenario);record=null;refresh();}
 if(button.dataset.end){end=ends.find(e=>e[0]===button.dataset.end);refresh();}
 if(button.dataset.action!==undefined){pending={index:Number(button.dataset.action),version:record.version,role:end[2]};const a=scenario.actions[pending.index];el('confirm-title').textContent=a.label;el('confirm-copy').textContent=`${a.note||'请核对当前单据与办理节点。'} 确认后仅更新本浏览器的内置示例。`;el('confirm').showModal();}
 if(button.id==='simulate'){await locked(()=>{const latest=readRecord(),index=scenario.actions.findIndex(a=>a.from===latest.state);if(index<0)return;const result=transition(scenario,latest,index,scenario.actions[index].role,latest.version);if(result.ok){const visible=record;saveRecord(result.record);record=visible;stale=true;showNotice('另一端已处理。当前详情保留旧状态，继续旧操作会触发冲突提示。');}});}
});
el('cancel').onclick=()=>el('confirm').close();
el('commit').onclick=async()=>{if(!pending)return;const command=pending;await locked(()=>{const result=transition(scenario,readRecord(),command.index,command.role,command.version);el('confirm').close();if(!result.ok){stale=true;showNotice(result.code==='STALE'?'此事项已被另一端更新，未重复提交。请更新详情后继续。':'当前身份或状态不能执行此操作，请更新详情。');return;}saveRecord(result.record);stale=false;el('notice').hidden=true;render();});};
el('confirm').addEventListener('close',()=>{pending=null;});el('refresh').onclick=refresh;
el('reset').onclick=async()=>{await locked(()=>{saveRecord({...emptyRecord(),version:readRecord().version+1});refresh();});};
window.addEventListener('storage',event=>{if(event.key===storageKey()){stale=true;showNotice('此示例单据在另一个标签页有更新，请更新当前详情。');}});
refresh();
</script></body></html>
