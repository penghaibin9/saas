 if(view==='channels'){renderChannels();return;}if(view==='modules')renderModules();else if(view==='templates')renderTemplates();else if(view==='handoffs')renderHandoffs();else renderEvidence();
}
function renderModules(){
 const modules=design.modules.filter(flow=>JSON.stringify([flow.label,flow.sourceLabel,flow.pages.map(page=>page.label),flow.goal,flow.branches]).includes(query));
 if(!modules.length){qs('content').innerHTML='<div class="empty">没有匹配的业务，请换个关键词。</div>';return;}
 if(!modules.some(flow=>flow.key===selected))selected=modules[0].key;
 const flow=design.modules.find(flow=>flow.key===selected);let category='';
 qs('content').innerHTML=`<div class="catalog"><nav class="module-directory" aria-label="学工业务模块">${modules.map(item=>{const heading=category!==item.category?`<h3>${esc(item.category)}</h3>`:'';category=item.category;return heading+`<button class="module-link" data-flow="${item.key}" aria-current="${item.key===selected}">${esc(item.label)}<small>${item.pages.length} 页</small></button>`;}).join('')}</nav><article class="detail"><div class="detail-lead"><h2>${esc(flow.label)}</h2><a href="${preview(flow)}">查看页面设计 →</a></div><p>${esc(flow.goal)}<br>办理角色：${esc(flow.owner)}</p><span class="badge">流程由现有代码归纳</span><ol class="step-list">${flow.steps.map(step=>{const [who,what]=step.split('｜');return `<li><strong>${esc(who)}</strong>${esc(what)}</li>`;}).join('')}</ol><div class="two-col"><section><h3>分支与异常</h3><ul>${flow.branches.map(text=>`<li>${esc(text)}</li>`).join('')}</ul></section><section><h3>上下游衔接</h3><ul>${flow.handoffs.map(text=>`<li>${esc(text)}</li>`).join('')}</ul><div class="focus-note"><strong>界面设计建议</strong><br>${esc(flow.focus)}</div></section></div><h3>三级页面：按办事顺序排列</h3><div class="page-links">${flow.pages.map(page=>`<a class="page-link" href="${preview(flow,page)}">${esc(page.label)}<small>${esc(page.phase)} · ${typeNames[page.template]}</small></a>`).join('')}</div><details><summary>查看原入口、路由与代码依据</summary><div class="table-wrap"><table class="matrix"><thead><tr><th>新名称</th><th>原名称</th><th>现有路由</th></tr></thead><tbody>${flow.pages.map(page=>`<tr><td>${esc(page.label)}</td><td>${esc(page.sourceLabel)}</td><td><code>${esc(page.path)}</code></td></tr>`).join('')}</tbody></table></div>${flow.evidence.map(ref=>`<p><code>${esc(ref.file)}:${ref.line} · ${esc(ref.symbol)}</code></p>`).join('')}</details></article></div>`;
}
const templates=[
 ['待办审批','申请审核、评议、申诉、公示确认',['顶部：身份、范围、批次；当前待办数量可点筛选。','左侧列表：学生、事项、时间、当前节点、超时情况。','右侧处理：原始信息、材料、节点时间线与审批意见。','主按钮说明真实动作；退回重提与驳回分开。'],'表单不因失败关闭；版本冲突提示刷新并保留意见，重新校验后才可再次提交。'],
 ['在办跟进','销假续假、谈话家校、调宿退宿',['顶部按“待处理 / 办理中 / 已结束”筛选，不另占大标题区。','列表显示责任人、截止时间、下一动作。','详情呈现处理记录、当前进度和来源单据。','页内继续下一步，完成后原筛选位置保留。'],'办理中不冒充完成；回执、执行结果或确认缺失时保持待跟进。'],
 ['案件详情','风险、处分、心理转介',['学生与事项摘要常驻；敏感内容按授权查看。','事实材料、处理过程、关联任务使用页内分区。','操作随状态和责任关系变化，固定放在详情底部。','移交时显示接收对象、未结任务与时限。'],'没有依据不结案；重开、撤销、解除保留历史，不能直接覆盖原结论。'],
 ['名单与台账','学生、困难库、资助记录、积分',['紧凑筛选条；表格列宽优先留给姓名、状态与责任信息。','统计数字点击后带条件回到列表。','单条详情用页签或侧区；跨业务跳转保留来源。','批量操作仅对明确选中项生效，显示选中范围。'],'列表空与加载失败分开；导出范围与当前筛选一致，敏感列另校验。'],
 ['批次与资源','认定批次、资助项目、迎新、床位分配',['配置基本信息，再选择范围与规则。','先预检：名单缺项、规则冲突、资源冲突可逐项定位。','确认发布时呈现影响人数与生效范围。','发布后使用版本或专用变更流程。'],'没有学生、资源冲突、身份冲突不可虚假发布；保留问题清单与修复入口。'],
 ['统计与归档','模块统计、归档批次、档案包',['统一筛选学期、学院、班级与业务状态。','归档显示学生包完整度和缺项清单。','任务提交后显示排队、生成中、失败、可下载。','结果可返回查找；下载与材料查阅受控。'],'任务创建与文件生成分开；未生成完成阻止封存，已封存版本只读。']
];
function renderTemplates(){qs('content').innerHTML=`<div class="cards">${templates.map(([name,uses,items,error])=>`<section class="card"><span class="badge">统一页面规范 · 设计建议</span><h2>${name}</h2><p>${uses}</p><ol>${items.map(text=>`<li>${text}</li>`).join('')}</ol><p><strong>异常与恢复</strong><br>${error}</p></section>`).join('')}<section class="card full"><h2>外壳保持统一，工作内容保留状态</h2><p>目录找业务 · 页签回到已打开页面 · 快捷栏放个人常用 · 搜索跨模块直达。默认使用完整业务名，可固定两字窄栏；完整名称在悬停、展开和搜索中可见。页面切换保留筛选、滚动及未提交意见；关闭前提醒，误关后可恢复。新身份重新请求权限与数据，不能沿用旧身份业务缓存。</p><p>列表、审批、详情、批次、统计都应分别验证正常、加载、空数据、失败、无权限和只读状态。现阶段请假样板演示切页保留与关闭防丢；正式跨身份与跨端持久化仍需接入和验证。</p></section></div>`;}
const handoffs=[['迎新 → 主档','学院最终确认后关联学生与账号，并写入在读阶段。','现有代码','先核验报到资格和身份冲突；不再重复导入新学生。'],['主档与责任 → 日常业务','学生、班级、辅导员归属供请假、风险、谈话定位。','现有代码 + 统一交互建议','责任交接后重新验证在办事项归属；不能把菜单可见当作数据授权。'],['住宿异常 → 风险','检查异常生成宿舍异常和风险来源记录。','现有代码','关闭风险与完成住宿整改分别确认，详情保留相互入口。'],['心理危机 → 风险','转介危机升级到风险处置中枢。','现有代码','只传递授权摘要；心理明细不向普通学工列表扩散。'],['困难认定 → 奖助','确认认定结果参与项目资格预检和正式申请校验。','现有代码','认定通过不保证所有奖助项目通过；仍有项目条件和批次限制。'],['资助获批 → 发放登记','获资助名单生成发放台账，再登记发放或失败。','现有代码','当前登记不等于银行支付回执；禁止用“到账成功”误导。'],['活动确认 → 积分','确认名单形成积分；撤销确认或申诉通过追加更正流水。','现有代码','保留原账，避免重复计分与人工覆盖。'],['业务结果 → 画像与档案','部分终态写成长事件，归档流程形成受控材料版本。','现有代码 + 统一入口建议','业务关闭、材料生成、档案归档是三个不同结果。']];
function renderHandoffs(){qs('content').innerHTML=`<section class="detail"><h2>跨业务衔接，保留唯一事实来源</h2><p>箭头表示业务依赖与衔接，不表示本轮已完成接口联调。新建议必须通过正式权限、状态和接口验证。</p><div class="table-wrap"><table class="matrix"><thead><tr><th>衔接</th><th>传递什么</th><th>依据</th><th>页面上必须说清</th></tr></thead><tbody>${handoffs.map(row=>`<tr>${row.map(cell=>`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;}
function renderEvidence(){qs('content').innerHTML=`<div class="cards"><section class="card full"><h2>代码基线与设计边界</h2><p>基线：<code>${design.baseline}</code>。已逐项映射 14 个模块、88 个可见三级入口；隐藏的学生详情维持从具体学生进入。流程参考服务函数、真实路由和页面 API；本轮没有执行正式数据库或权限验收。</p><p>旧专题文档存在与代码不一致之处，例如“续假按总时长重走多级审批”与当前续假服务不同。此设计优先表达代码事实，政策和制度参数化列为差异，不能静默改变业务。</p></section><section class="card"><h2>需要在正式重构时核验</h2><ol><li>请假阈值目前为固定 3 / 7 天，尚未读规则中心。</li><li>资助发放是登记能力，不能推断已有银行回执。</li><li>党/团发展阶段需分别核验，不能套用同一套名称。</li><li>页签草稿目前只在内存，刷新前提醒；账号保存与跨端恢复另接服务。</li><li>现有 UI 统一错误文案、隐私权限与任务失败重试仍需逐页验收。</li></ol></section><section class="card"><h2>菜单改造约定</h2><p>保留业务边界，14 个二级模块按日常办理、学生支持、成长管理、基础与周期排列。三级按办理中、结果查询、设置分段，稳定业务标识与原路由保持映射。</p><p>菜单名称、排列和页面组合属于设计建议；审批状态、权限与事实结果以服务端为准。</p></section><section class="card"><h2>资料使用范围</h2><p>学校官网只用于理解真实办事场景；没有把某校的审批天数、公示天数或专业权限作为本系统规则。本稿为界面与流程设计，不是生产级施工包或上线证明。</p></section><section class="card full"><h2>实际打开的学校来源</h2>${design.sources.map(source=>`<div class="source"><a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${source.id} · ${esc(source.publisher)}：${esc(source.title)}</a><p>${esc(source.lesson)}</p><small>原发布 ${source.date} · 查阅 ${design.date} · ${esc(source.location)}</small></div>`).join('')}<p>中山大学住宿指引本次返回 403，西南石油大学页面未能打开，未作为正文设计证据。</p></section></div>`;}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.flow){selected=button.dataset.flow;view='modules';query='';qs('flow-search').value='';render();}if(button.dataset.view){view=button.dataset.view;render();}});
qs('flow-search').oninput=event=>{query=event.target.value.trim();renderModules();};
qs('toggle-theme').onclick=()=>{const light=document.body.classList.toggle('light');qs('toggle-theme').textContent=light?'切换曜石黑':'切换护眼绿';qs('back-shell').href=`C-自定义快捷栏.html?theme=${light?'sage':'dark'}#center=student-affairs&module=0&page=0`;render();};
function renderChannels(){qs('content').innerHTML=`<section class="detail"><div class="detail-lead"><h2>四端共用一条业务流程</h2><a href="学工四端联动.html">进入流转演练 →</a></div><p>两个 PC 共用你选定的 UI 壳。学生与老师的菜单、数据和动作各自独立；微信小程序分别提供学生入口和教师入口。下表为基于已定位代码的目标职责，不等同于四端全部联调通过。</p><div class="page-links"><a class="page-link" href="学生PC-同壳设计.html?theme=dark#center=student-affairs&module=0&page=0">学生 PC 同壳设计<small>本人申请 · 待补材料 · 办理记录</small></a><a class="page-link" href="C-自定义快捷栏.html?theme=dark#center=student-affairs&module=0&page=0">教师 PC 工作区<small>待办 · 审核 · 跟进 · 台账</small></a><a class="page-link" href="学工四端联动.html">四端流转演练<small>切换端口 · 退回重提 · 冲突提示</small></a></div><h3>14 个模块的四端分工</h3><div class="table-wrap"><table class="matrix"><thead><tr><th>核心业务</th><th>学生 PC</th><th>学生小程序</th><th>教师 PC</th><th>教师小程序</th><th>必须区分的边界</th></tr></thead><tbody>${design.channels.map(row=>`<tr><td>${esc(design.modules.find(m=>m.key===row.key).label)}</td>${['studentPc','studentMini','teacherPc','teacherMini','boundary'].map(key=>`<td>${esc(row[key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h3>跨端交互契约</h3><div class="two-col">${design.fourEndRules.map(([label,text])=>`<section><h3>${label}</h3><p>${text}</p></section>`).join('')}</div><details><summary>已定位的四端代码锚点（${design.channelAnchors.length} 处）</summary>${design.channelAnchors.map(ref=>`<p>${esc(ref.meaning)}<br><code>${esc(ref.file)}:${ref.line}</code></p>`).join('')}</details></section>`;}

render();
</script></body></html>
