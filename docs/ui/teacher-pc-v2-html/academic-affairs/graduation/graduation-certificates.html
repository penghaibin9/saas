<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>毕业证书管理 V2</title><!-- route: /admin/academic-affairs/certificates; routeName: aa-certificates; permission: academicAffairs.graduationCert.view; roles: 证书管理员; states: ready,loading,empty,error,unauthorized,long-data,number-pending,print-pending,in-stock,signed,lost,void; boundary: certificate processing reads published graduation result and does not replace audit; data: neutral placeholder --><link rel='stylesheet' href='../../shared/v2-tokens.css'/><link rel='stylesheet' href='../../shared/v2-shell.css'/><link rel='stylesheet' href='../../shared/v2-components.css'/><link rel='stylesheet' href='../../shared/v2-workflows.css'/><link rel='stylesheet' href='../../shared/v2-makeup-workbench.css'/><link rel='stylesheet' href='../../shared/v2-graduation-workbench.css'/></head><body><script>window.V2_PAGE={active:'certificates',permission:'academicAffairs.graduationCert.view'};</script><script src='../../shared/v2-graduation-workbench.js'></script><script>(function(){const root=document.querySelector('[data-prototype-state="long"]');if(!root)return;const refs=['data-open','data-close','aria-controls','aria-labelledby','aria-describedby','aria-owns','aria-activedescendant','for','list'],ids=new Map();root.querySelectorAll('[id]').forEach(el=>{const old=el.id,next=old.endsWith('-long')?old:`${old}-long`;ids.set(old,next);el.id=next});root.querySelectorAll('*').forEach(el=>{refs.forEach(attr=>{const value=el.getAttribute(attr);if(value)el.setAttribute(attr,value.split(/\s+/).map(x=>ids.get(x)||x).join(' '))});const href=el.getAttribute('href');if(href&&href[0]==='#'&&ids.has(href.slice(1)))el.setAttribute('href','#'+ids.get(href.slice(1)))})})();</script></body></html>
