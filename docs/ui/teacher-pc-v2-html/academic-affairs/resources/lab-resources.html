<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>实训室资源 V2</title><!-- route: /admin/academic-affairs/resources/labs; routeName: aa-resource-labs; permission: academicAffairs.lab.view; roles: 实训室管理员,教务处; states: ready,loading,empty,error,unauthorized,long-data,open,restricted,maintenance,disabled; boundary: lab availability depends on safety, equipment and maintenance; data: neutral placeholder --><link rel='stylesheet' href='../../shared/v2-tokens.css'/><link rel='stylesheet' href='../../shared/v2-shell.css'/><link rel='stylesheet' href='../../shared/v2-components.css'/><link rel='stylesheet' href='../../shared/v2-workflows.css'/><link rel='stylesheet' href='../../shared/v2-makeup-workbench.css'/><link rel='stylesheet' href='../../shared/v2-resource-workbench.css'/></head><body><script>window.V2_PAGE={active:'labs',permission:'academicAffairs.lab.view'};</script><script src='../../shared/v2-resource-workbench.js'></script><script>(function(){const root=document.querySelector('[data-prototype-state="long"]');if(!root)return;const refs=['data-open','data-close','aria-controls','aria-labelledby','aria-describedby','aria-owns','aria-activedescendant','for','list'],ids=new Map();root.querySelectorAll('[id]').forEach(el=>{const old=el.id,next=old.endsWith('-long')?old:`${old}-long`;ids.set(old,next);el.id=next});root.querySelectorAll('*').forEach(el=>{refs.forEach(attr=>{const value=el.getAttribute(attr);if(value)el.setAttribute(attr,value.split(/\s+/).map(x=>ids.get(x)||x).join(' '))});const href=el.getAttribute('href');if(href&&href[0]==='#'&&ids.has(href.slice(1)))el.setAttribute('href','#'+ids.get(href.slice(1)))})})();</script></body></html>
