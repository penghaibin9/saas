    client: backend
    route: /graduation-audit-batches/{batchId}/archive
    page: backend/app/modules/academic_affairs/routers/graduation_core_router.py
    action: archive
    fileCategory: GRADUATION_QUALIFICATION_ARCHIVE
    api: POST /api/v1/academic-affairs/graduation-audit-batches/{batchId}/archive
    backendService: backend/app/modules/academic_affairs/routers/graduation_core_router.py -> academic_affairs_graduation_service.archive_batch
    storageMode: canonical-graduation-immutable-archive
    authMode: authenticated+academicAffairs.graduation.manage
    dataScope: tenant+graduation-audit-batch
