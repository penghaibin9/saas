    scanGated: true
    preview: false
    download: false
    import: false
    export: false
    archive: true
    status: active
    risk: P0
    targetPhase: '10'
    notes: D9-S1a Move Only 后文件能力扫描源路径从 legacy academic_affairs.py 切换到 graduation_core_router.py；仅同步 inventory owner，不新增文件或归档事实链。
