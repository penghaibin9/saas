entries:
  - module: academic-affairs
    client: backend
    route: backend/app/modules/academic_affairs/routers/course_selection_router.py
    page: backend/app/modules/academic_affairs/routers/course_selection_router.py
    action: selection-business-archive-state
    fileCategory: BUSINESS_STATE_ARCHIVE_NO_FILE_IO
    api: POST /api/v1/academic-affairs/selection/batches/{batchId}/archive; GET /api/v1/academic-affairs/selection/archive; GET /api/v1/academic-affairs/selection/archive/{batchId}
    backendService: backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py
    storageMode: DATABASE_ONLY_NO_FILE_IO
    authMode: academicAffairs.selection.manage+tenant-scope
    dataScope: tenant+selection-batch+selection-records
    versioned: false
    scanGated: true
    preview: false
    download: false
    import: false
    export: false
    archive: false
    status: active
    risk: P1
    targetPhase: '10'
    notes: D6-S 仅迁移选课业务归档 HTTP owner；路径中的 archive 表示数据库业务状态归档，不产生文件、不读写文件对象。真实 XLSX 导出仍由 academic_export_compat_router 的 ExportJob 边界持有。
