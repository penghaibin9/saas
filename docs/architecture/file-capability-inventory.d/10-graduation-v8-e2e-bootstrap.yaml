entries:
  - module: graduation
    client: backend
    route: test-tooling://graduation-v8/identity-import-bootstrap
    page: backend/scripts/e2e_bootstrap_graduation_accounts.py
    action: seed-graduation-v8-e2e-identities
    fileCategory: E2E_IDENTITY_IMPORT_XLSX
    api: GET /api/v1/system/identity-import/template; POST /api/v1/system/identity-import/validate-file; POST /api/v1/system/identity-import/execute
