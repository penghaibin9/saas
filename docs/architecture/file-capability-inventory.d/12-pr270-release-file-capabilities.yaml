version: file-capability-inventory/v1
entries:
  - module: system-management
    client: backend
    route: /api/v1/system/phone-bindings/batch-confirm
    page: backend/app/modules/system_admin/services/phone_governance_service.py
    action: export-masked-phone-ledger-xlsx
    fileCategory: PHONE_MASKED_LEDGER_XLSX
    api: POST /api/v1/system/phone-bindings/batch-preview; POST /api/v1/system/phone-bindings/batch-confirm
    backendService: backend/app/modules/system_admin/services/phone_governance_service.py
    storageMode: canonical-generated-file+export-job
    authMode: tenant-authenticated+systemAdmin.phone.view+frozen-preview
    dataScope: tenant+preview-frozen-user-set
    versioned: true
    scanGated: false
    preview: false
    download: true
    import: false
    export: true
    archive: false
    status: active
    risk: P1
    targetPhase: '10'
    notes: 手机号治理批量 EXPORT 在服务端生成脱敏 XLSX，经统一 generated-file/export-job 落账；确认命令只能消费当前办理人、当前租户且目标摘要未漂移的冻结预览，不导出明文手机号。

  - module: website-news
    client: backend
    route: /api/v1/platform/website-news/packages
    page: backend/app/services/website_news/package.py
    action: ingest-bounded-news-package-zip
    fileCategory: WEBSITE_NEWS_PACKAGE_ZIP
    api: POST /api/v1/platform/website-news/packages
    backendService: backend/app/services/website_news/package.py
    storageMode: bounded-in-memory-zip+normalized-db-media
    authMode: platform-root
    dataScope: platform-content
    versioned: true
    scanGated: false
    preview: false
    download: false
    import: true
    export: false
    archive: false
    status: active
    risk: P0
    targetPhase: '10'
    notes: 官网新闻资源包只做有界 ZIP 内存解析；禁止路径落盘与源 URL 抓取，限制压缩包/展开体积/文件数，JSON 严格解析，图片解码后重编码再进入正式内容审核流程。
