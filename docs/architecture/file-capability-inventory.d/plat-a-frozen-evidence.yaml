    backendService: backend/app/modules/platform_integrity/package_inventory.py::PRODUCTION_PACKAGE_PATHS
    storageMode: none
    authMode: none-inventory-only
    dataScope: none-inventory-only
    versioned: false
    scanGated: false
    preview: false
    download: false
    import: false
    export: false
    archive: false
    status: active
    risk: P3
    targetPhase: '0'
