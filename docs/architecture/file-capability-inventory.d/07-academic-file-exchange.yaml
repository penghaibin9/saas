entries:
  - module: academic-affairs
    client: backend
    route: /api/v1/academic-affairs/file-exchange/roster/import-jobs
    page: backend/app/modules/academic_affairs/routers/academic_file_exchange_router.py
    action: upload+import
    fileCategory: XLSX_IMPORT
    api: POST /api/v1/academic-affairs/file-exchange/roster/import-jobs
    backendService: backend/app/modules/academic_affairs/services/academic_file_exchange_service.py::create_roster_import_job
    storageMode: configurable
    authMode: authenticated+academicAffairs.roster.import
    dataScope: tenant+operator+academic-roster
    versioned: true
    scanGated: true
    preview: false
    download: false
    import: true
    export: false
    archive: false
    status: active
    risk: P0
    targetPhase: '7'
    notes: 原始 XLSX 固化为不可变 FileObject；确认仅接收 jobId+expectedVersion，并重新读取同一文件预检。
  - module: academic-affairs
    client: backend
    route: /api/v1/academic-affairs/file-exchange/roster/export-jobs
    page: backend/app/modules/academic_affairs/routers/academic_file_exchange_router.py
    action: export+download
    fileCategory: XLSX_EXPORT
    api: POST /api/v1/academic-affairs/file-exchange/roster/export-jobs
    backendService: backend/app/modules/academic_affairs/services/academic_file_exchange_service.py::create_roster_export_job
    storageMode: configurable-export-zone
    authMode: authenticated+academicAffairs.roster.export+one-time-ticket
    dataScope: tenant+operator+academic-roster
    versioned: true
    scanGated: false
    preview: false
    download: true
    import: false
    export: true
    archive: false
    status: active
    risk: P0
    targetPhase: '7'
    notes: 名册导出进入 FileObject+ExportJob，支持有效期、撤销和一次性下载票据。
  - module: academic-affairs
    client: backend
    route: /api/v1/academic-affairs/file-exchange/jobs
    page: backend/app/modules/academic_affairs/routers/academic_file_exchange_router.py
    action: import+export
    fileCategory: DATA_EXCHANGE_JOB
    api: GET /api/v1/academic-affairs/file-exchange/jobs
    backendService: backend/app/modules/academic_affairs/services/academic_file_exchange_service.py::list_academic_jobs
    storageMode: metadata
    authMode: authenticated+academic-import-or-export-permission
    dataScope: tenant+operator
    versioned: true
    scanGated: true
    preview: false
    download: true
    import: true
    export: true
    archive: false
    status: active
    risk: P1
    targetPhase: '7'
    notes: 教务任务中心只展示当前操作者与当前租户任务，不混入系统管理或其它模块任务。
