entries:
  - module: shared-platform
    client: backend
    route: /commercial/module-offboarding/{job_id}/export
    page: backend/app/modules/platform/routers/module_commerce_router.py
    action: bind-validate-final-module-export-evidence
    fileCategory: MODULE_OFFBOARDING_FINAL_EXPORT_EVIDENCE
    api: POST /api/v1/platform/commercial/module-offboarding/{job_id}/export
    backendService: backend/app/services/module_commerce_lifecycle_service.py
    storageMode: EXISTING_EXPORTJOB_MANIFEST_FILEOBJECT_REFERENCES_ONLY
    authMode: platform.commercial.manage+tenant-module-generation-scope
    dataScope: target-tenant+module+generation+scopeHash+verified-export-job+manifest
    versioned: true
    scanGated: true
    preview: false
    download: false
    import: false
    export: true
    archive: true
    status: active
    risk: P0
    targetPhase: '10'
    notes: M5 只绑定并核验既有 ExportJob、ArchiveManifest、ManifestItem、FileObject 与实际存储对象；本接口不接受手填 SHA，不生成第二套文件真值，不下载文件，也不授权物理销毁。scopeHash、module generation 与 expectedVersion 不一致时必须拒绝。
