<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>教务基础 · 三级菜单优化设计</title>
<style>
:root{--blue:#285ac1;--ink:#172b46;--muted:#65758c;--line:#e2e8f0;--bg:#f4f7fb;--soft:#edf3ff;--green:#19725a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Microsoft YaHei","PingFang SC",sans-serif}button,input,select{font:inherit}button,a,input,select,summary{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #89aef9}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}button{border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:8px 13px;transition:background .15s}button:hover:not(:disabled){background:var(--soft);border-color:#adc4f1}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover:not(:disabled){background:#204da9}.text{border:0;background:transparent;color:var(--blue);padding:5px 3px}.quiet{color:var(--muted)}small{font-size:12px;color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:25px;letter-spacing:-.5px}h2{font-size:17px}h3{font-size:14px}.top{height:66px;background:white;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:17px;font-weight:700;letter-spacing:.3px}.top-right{display:flex;align-items:center;gap:22px}.prototype{font-size:12px;background:#fff6dd;color:#86631d;border:1px solid #eddbab;padding:4px 9px;border-radius:5px}.global{height:49px;background:white;padding-left:28px;display:flex;gap:30px;align-items:center;border-bottom:1px solid var(--line);color:var(--muted)}.global strong{color:var(--blue);height:49px;display:flex;align-items:center;border-bottom:3px solid var(--blue)}.shell{display:grid;grid-template-columns:154px 218px minmax(0,1fr);min-height:calc(100vh - 115px)}.secondary{padding:22px 12px;border-right:1px solid var(--line);background:#eef3f9}.secondary b{display:block;font-size:12px;color:var(--muted);padding:0 12px 16px}.secondary div{padding:12px;border-radius:7px;margin-bottom:4px;color:#586b84}.secondary .chosen{background:#dee9fc;color:#2455b4;font-weight:700}.third{background:white;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:20px}.third h2{font-size:18px}.third input{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:12px}.group-title{display:flex;align-items:center;justify-content:space-between;color:#7a899b;font-size:11px;letter-spacing:1px;margin:0 9px 7px}.menu{display:flex;flex-direction:column;gap:4px}.menu button{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;border:0;padding:11px 12px;background:transparent;border-radius:6px;font-size:13px}.menu button.active{background:var(--soft);box-shadow:inset 3px 0 var(--blue);color:var(--blue);font-weight:700}.menu button small{font-size:10px;letter-spacing:0}.menu-note{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0;font-size:12px;line-height:1.9;color:var(--muted)}main{padding:24px 30px 35px;min-width:0;max-width:1640px;width:100%;margin:auto}.crumb{font-size:12px;color:var(--muted);margin-bottom:18px}.page-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.page-head p{color:var(--muted);margin-top:5px;font-size:13px}.lead{display:flex;align-items:center;justify-content:space-between;gap:20px;background:white;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:9px;padding:20px 24px;margin-bottom:22px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);margin-bottom:5px}.lead h2{font-size:20px}.lead p{color:var(--muted);font-size:12px;margin-top:5px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;font-size:11px;white-space:nowrap;padding:3px 9px;border-radius:5px;background:#eaf6f0;color:var(--green)}.pill.gray{background:#f0f3f7;color:#69778b}.pill.amber{background:#fff6e4;color:#8d6420}.layout{display:grid;grid-template-columns:minmax(0,1fr) 228px;gap:20px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:9px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);gap:12px}.filters{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:15px 20px}.filters input,.filters select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-width:100%;background:white;color:var(--ink)}.filters input{width:220px}.filters label{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px;font-size:12px}th{text-align:left;font-size:11px;font-weight:500;white-space:nowrap;background:#f7f9fc;color:#65758c;padding:12px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}td{padding:17px 18px;border-bottom:1px solid #edf0f5;vertical-align:middle}td strong{font-size:13px;display:block}td small{display:block;font-size:11px;margin-top:3px}tbody tr:hover{background:#fafcff}.row-actions{display:flex;gap:8px;white-space:nowrap}.table-bottom{padding:13px 20px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.note{padding:13px 18px;font-size:12px;line-height:1.8;background:#f6f9ff;color:#597293;border-top:1px solid var(--line)}.side{background:white;border:1px solid var(--line);border-radius:9px;padding:20px}.side h3{margin-bottom:16px}.step{display:flex;gap:11px;padding:0 0 20px;position:relative}.step:last-child{padding-bottom:0}.number{border:1px solid #d6e0ef;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;flex-shrink:0;font-size:11px;color:var(--blue);background:#f2f6fd}.step strong{font-size:12px}.step p{font-size:11px;color:var(--muted);margin-top:3px}.side-note{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.return{margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{background:white;border:1px solid var(--line);border-radius:8px;padding:20px}.stat b{font-size:27px;display:block;margin-top:5px}.calendar{padding:18px;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:72px;border:1px solid var(--line);border-radius:4px;padding:7px;font-size:11px}.day small{display:block;font-size:10px;margin-top:6px;color:var(--blue)}.week{font-size:11px;text-align:center;color:var(--muted);padding-bottom:6px}.empty{text-align:center;padding:50px 18px;color:var(--muted)}details{font-size:12px}summary{cursor:pointer;color:var(--blue)}.mobile-menu{display:none}.footer{margin-top:22px;display:flex;justify-content:space-between;gap:15px;font-size:11px;color:#8491a2}dialog{width:min(520px,calc(100vw - 32px));border:1px solid var(--line);border-radius:12px;padding:0;color:var(--ink);box-shadow:0 22px 100px #172b4633}dialog::backdrop{background:#172b4655}.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-body{padding:22px 24px}.modal-body p{margin-bottom:14px;color:var(--muted)}.modal-body label{display:block;font-size:12px;margin-bottom:16px}.modal-body input{width:100%;margin-top:7px;border:1px solid var(--line);padding:10px;border-radius:6px}.modal-footer{padding:16px 24px;background:#f7f9fc;display:flex;justify-content:flex-end;gap:8px}.error{color:#b13b3b!important;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;background:#172b46;color:white;border-radius:8px;box-shadow:0 8px 30px #172b4620;z-index:10;font-size:13px}.toast:empty{display:none}
@media(min-width:1600px){main{padding:32px 40px}}@media(max-width:1250px){.secondary{display:none}.shell{grid-template-columns:205px minmax(0,1fr)}.layout{grid-template-columns:1fr}.side{display:none}}@media(max-width:760px){.top{padding:12px 16px;height:auto}.brand{font-size:14px}.top-right>span:not(.prototype){display:none}.global{padding-left:16px;gap:20px;font-size:12px;overflow:auto;white-space:nowrap}.shell{display:block}.third{display:none}.third.open{display:flex;border-bottom:1px solid var(--line)}main{padding:18px 14px}.mobile-menu{display:block}.lead{align-items:flex-start;flex-direction:column;padding:18px}.page-head{align-items:flex-start}h1{font-size:22px}.filters input{width:100%}.filters{padding:12px}.stats{gap:8px}.stat{padding:12px}.stat b{font-size:22px}.footer{flex-direction:column}.calendar{padding:8px;gap:2px}.day{padding:3px;min-height:60px}.day small{font-size:9px}}
</style></head>
<body>
<header class="top"><div class="brand">高校学生全生命周期管理平台</div><div class="top-right"><span class="prototype">交互设计演示 · 虚构数据</span><span class="quiet">学校管理员</span></div></header>
<div class="global" aria-label="中心位置"><span>学工中心</span><strong>教务中心</strong><span>毕业设计中心</span><span>岗位实习中心</span><span>系统管理</span></div>
<div class="shell"><aside class="secondary" aria-label="二级菜单位置"><b>教务中心</b><div>教务总览</div><div class="chosen">教务基础</div><div>学籍管理</div><div>培养与课程</div><div>开课管理</div><div>排课与课表</div><div>日常教学</div><div>成绩管理</div></aside>
<aside class="third" id="third"><div><h2>教务基础</h2><small>先准备基础，再开展教学</small></div><input id="menuSearch" aria-label="搜索三级菜单" placeholder="搜索本组业务"><nav id="menus" aria-label="教务基础三级菜单"></nav><div class="menu-note">同一对象，连续办理<br>从学院到专业、班级，自动带入筛选条件。</div></aside>
<main><div class="crumb">教务中心 / 教务基础 / <span id="crumb"></span></div><button class="mobile-menu" id="menuToggle" aria-expanded="false" aria-controls="third">选择业务菜单</button><div id="screen"></div><footer class="footer"><span>依据现有十个菜单、真实路由与静态审计设计</span><span>仅演示交互，刷新恢复示例数据</span></footer></main></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="modal-head"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="关闭弹窗">关闭</button></div><div id="dialogContent"></div></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const groups=[['学期与作息',[['terms','学期管理'],['calendar','校历管理'],['slots','作息时间']]],['学院与班级',[['college','学院管理'],['major','专业管理'],['grade','年级管理'],['class','行政班管理'],['teaching','教学班管理']]],['核对与统计',[['check','组织核对'],['stats','组织统计']]]];
const titles=Object.fromEntries(groups.flatMap(g=>g[1]));
const routes={terms:'/admin/academic-affairs/terms',calendar:'/admin/academic-affairs/calendar',slots:'/admin/academic-affairs/time-slots',...Object.fromEntries(['college','major','grade','class','teaching','stats'].map(k=>[k,'/admin/academic-affairs/orgs?tab='+k])),check:'/admin/academic-affairs/orgs?tab=tree'};
const terms=[{name:'2026—2027 学年第一学期',range:'2026-09-01 至 2027-01-15',weeks:'18 周',status:'已发布',current:true},{name:'2025—2026 学年第二学期',range:'2026-02-23 至 2026-07-10',weeks:'18 周',status:'已归档'},{name:'2025—2026 学年第一学期',range:'2025-09-01 至 2026-01-16',weeks:'18 周',status:'已归档'}];
const colleges=[['信息工程学院','C01'],['智能制造学院','C02'],['经济管理学院','C03']];
const majors=[['软件技术','信息工程学院'],['大数据技术','信息工程学院'],['机电一体化技术','智能制造学院'],['电子商务','经济管理学院']];
const classes=majors.flatMap((m,i)=>[1,2].map(n=>({name:m[0]+'260'+n+'班',major:m[0],college:m[1],count:40+i+n})));
let state={page:'terms',filter:'',keyword:'',term:0},trail=[],timer;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function button(label,action,arg='',kind='text'){return `<button class="${kind}" data-action="${action}" data-arg="${esc(arg)}">${label}</button>`}
function badge(s){return `<span class="pill ${s==='已归档'?'gray':s==='草稿'||s==='需核对'?'amber':''}">${esc(s)}</span>`}
function notify(s){$('toast').textContent=s;clearTimeout(timer);timer=setTimeout(()=>$('toast').textContent='',3500)}
function go(page,filter=''){trail.push({...state});state={...state,page,filter,keyword:''};render();$('third').classList.remove('open');$('menuToggle').setAttribute('aria-expanded','false');$('pageTitle').focus()}
function nav(){let q=$('menuSearch').value.trim();$('menus').innerHTML=groups.map(([label,items],i)=>{let shown=items.filter(x=>x[1].includes(q));return shown.length?`<div style="margin-bottom:24px"><div class="group-title"><span>0${i+1} · ${label}</span><span>${items.length}</span></div><div class="menu">${shown.map(([k,n])=>`<button data-action="nav" data-arg="${k}" class="${state.page===k?'active':''}" ${state.page===k?'aria-current="page"':''}><span>${n}</span>${state.page===k?'<small>当前</small>':''}</button>`).join('')}</div></div>`:''}).join('')||'<p class="quiet">没有匹配的菜单</p>'}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join(''):`<tr><td colspan="${headers.length}"><div class="empty">没有符合条件的记录<br>${button('清除筛选','reset')}</div></td></tr>`}</tbody></table></div><div class="table-bottom"><span>共 ${rows.length} 条示例记录</span><span>已显示全部</span></div>`}
function filters(options=[],placeholder='搜索名称'){return `<form class="filters" id="filterForm">${options.length?`<label>筛选 <select id="filter"><option value="">全部</option>${options.map(o=>`<option ${o===state.filter?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`:''}<input id="keyword" aria-label="${placeholder}" placeholder="${placeholder}" value="${esc(state.keyword)}"><button type="submit">查询</button>${button('重置','reset')}</form>`}
function panel(title,content,count=''){return `<section class="panel"><div class="panel-head"><h2>${title}</h2><small>${count}</small></div>${content}</section>`}
function guide(){return `<aside class="side"><h3>基础准备顺序</h3>${[['确认学期','确定学年、日期与教学周','terms'],['核对校历与作息','确认节假日、补课与上课钟点','calendar'],['建立教学组织','学院、专业、行政班逐级维护','college'],['核对后开展教学','先处理引用，再进入教学任务','check']].map((s,i)=>`<div class="step"><span class="number">${i+1}</span><div>${button(s[0],'nav',s[2])}<p>${s[1]}</p></div></div>`).join('')}<div class="side-note">发布学期与启用为当前学期分开办理；启用权限以学校现有设置为准。</div></aside>`}
function render(){nav();$('crumb').textContent=titles[state.page];let p=state.page,subtitle={terms:'维护正式学期，带着所选学期继续核对校历。',calendar:'查看当前选择的学期，按状态维护或查阅校历。',slots:'查看每日节次与钟点，按生效日期维护季节作息。',college:'从学院开始，直接进入下属专业。',major:'按学院维护专业，再进入对应行政班。',grade:'先看年级规模，需要时展开关联专业。',class:'按专业查看班级与学生，创建时自动带入所属专业。',teaching:'教学班来自教学任务，任课与名单回到来源办理。',check:'变更前检查引用，找到具体对象继续处理。',stats:'查看组织规模，点击数量进入同范围明细。'}[p];let action=['terms','college','major','class'].includes(p)?button('新建'+(p==='terms'?'学期':{college:'学院',major:'专业',class:'行政班'}[p]),'create','','primary'):p==='slots'?button('新增节次','create','','primary'):'';
let html=`<div class="page-head"><div><h1 id="pageTitle" tabindex="-1">${titles[p]}</h1><p>${subtitle}</p></div>${action}</div>`;if(trail.length)html+=`<div class="return">${button('返回上一办理位置','back')}<small>保留原筛选条件</small></div>`;
let content='';
if(p==='terms'){html+=`<section class="lead"><div><div class="eyebrow">全校当前学期</div><h2>${terms[0].name}</h2><p>${terms[0].range} · ${terms[0].weeks}</p></div><div class="actions">${badge('已启用')}${button('查看本学期校历','calendar','0')}${button('核对作息时间','nav','slots','primary')}</div></section>`;const rows=terms.map((t,i)=>({...t,i})).filter(t=>(!state.filter||t.status===state.filter)&&t.name.includes(state.keyword));content=panel('学期台账',filters(['草稿','已发布','已归档'],'搜索学年学期')+table(['学年学期','起止日期 / 教学周','学期状态','下一步'],rows.map(t=>[`<strong>${esc(t.name)}</strong><small>${t.current?'全校当前学期':'历史或待准备学期'}</small>`,`${esc(t.range)}<small>${t.weeks}</small>`,badge(t.status),`<div class="row-actions">${button('查看详情','termDetail',t.i)}${button('查看校历','calendar',t.i)}</div>`]))+`<div class="note">学期发布后，由学校统一启用。${button('查看启用说明','governance')}</div>`)}
else if(p==='calendar'){let t=terms[state.term];html+=`<section class="lead"><div><div class="eyebrow">正在查看</div><h2>${esc(t.name)}</h2><p>${t.range}</p></div><div class="actions">${badge(t.status)}${button('核对作息时间','nav','slots')}</div></section>`;content=panel('教学月历 · 示例',`<div class="note">${t.status==='草稿'?'草稿可继续配置；本原型仅展示办理方向。':`本学期${t.status}，校历事件只读。变更请按学校现有流程办理。`}</div><div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="week">周${x}</div>`).join('')}${Array.from({length:28},(_,i)=>`<div class="day">${i+1}<small>${i%7<5?'教学安排':'休息日'}</small></div>`).join('')}</div><div class="note">以上月历为布局示例，不作为学校正式校历。${button('查看学期详情','termDetail',state.term)}</div>`)}
else if(p==='slots'){content=panel('每日作息',table(['节次','开始 / 结束','引用情况','操作'],[['第 1 节','08:20 — 09:05',badge('已有引用'),button('维护上课时间段','band','第 1 节')+'<small>已有引用，不能改号、停用或删除</small>'],['第 2 节','09:15 — 10:00',badge('已有引用'),button('维护上课时间段','band','第 2 节')+'<small>已有引用，不能改号、停用或删除</small>'],['第 3 节','10:20 — 11:05',badge('已有引用'),button('维护上课时间段','band','第 3 节')+'<small>已有引用，不能改号、停用或删除</small>']])+`<div class="note">夏令、冬令作息使用生效日期管理，保留节次编号与既有课表关系。</div>`)}
else if(p==='college'){let list=colleges.filter(c=>c[0].includes(state.keyword));content=panel('学院列表',filters([], '搜索学院名称')+table(['学院名称','学院编码','下属专业','操作'],list.map(c=>[esc(c[0]),c[1],button(`查看 ${majors.filter(m=>m[1]===c[0]).length} 个专业`,'majors',c[0]),button('查看引用','check',c[0])]))) }
else if(p==='major'){let list=majors.filter(m=>(!state.filter||m[1]===state.filter)&&m[0].includes(state.keyword));content=panel('专业列表',filters(colleges.map(c=>c[0]),'搜索专业名称')+table(['专业名称','所属学院','行政班','操作'],list.map(m=>[esc(m[0]),esc(m[1]),button(`查看 ${classes.filter(c=>c.major===m[0]).length} 个班`,'classes',m[0]),button('查看引用','check',m[0])]))) }
else if(p==='grade'){content=panel('年级规模',table(['年级','关联专业','行政班','示例学生数'],[['2026 级',`<details><summary>展开专业明细</summary><p>${majors.map(m=>esc(m[0])).join('、')}</p></details>`,button(String(classes.length)+' 个班','nav','class'),String(classes.reduce((a,c)=>a+c.count,0))]]))}
else if(p==='class'){let list=classes.filter(c=>(!state.filter||c.major===state.filter)&&c.name.includes(state.keyword));content=panel('行政班列表',filters(majors.map(m=>m[0]),'搜索班级名称')+table(['班级名称','所属专业','年级','人数','操作'],list.map(c=>[esc(c.name),esc(c.major),'2026 级',String(c.count),button('查看班级','classDetail',c.name)]))) }
else if(p==='teaching'){content=panel('教学班列表',table(['教学班','课程','名单状态','维护入口'],[['软件技术2601班 · 程序设计','程序设计基础',badge('名单已锁定'),button('查看来源说明','task')],['大数据技术2601班 · 数据库','数据库基础',badge('需核对'),button('查看来源说明','task')]])+`<div class="note">本页负责查阅。任课关系和正式名单在对应教学任务中维护，避免重复建班。</div>`)}
else if(p==='check'){let list=[...colleges.map(c=>[c[0],'学院']),...majors.map(m=>[m[0],'专业'])].filter(x=>x[0].includes(state.keyword||state.filter));content=panel('组织变更前核对',filters([],'搜索需要核对的组织')+table(['核对对象','类型','结论','下一步'],list.map(x=>[esc(x[0]),x[1],badge('需核对'),button('查看引用说明','references',x[0])]))+`<div class="note">这里的结果仅演示状态呈现；实际核对必须读取学生、教学任务与培养方案的正式引用。</div>`)}
else{html+=`<div class="stats">${[['学院',colleges.length,'college'],['专业',majors.length,'major'],['行政班',classes.length,'class']].map(s=>`<div class="stat"><small>${s[0]}规模</small><b>${s[1]}</b>${button('查看明细','nav',s[2])}</div>`).join('')}</div>`;content=panel('学院组织规模',table(['学院','专业','行政班'],colleges.map(c=>[esc(c[0]),button(majors.filter(m=>m[1]===c[0]).length+' 个专业','majors',c[0]),String(classes.filter(x=>x.college===c[0]).length)])))}
$('screen').innerHTML=html+`<div class="layout">${content}${guide()}</div><details style="margin-top:20px"><summary>实施人员使用 · 对应现有入口</summary><p style="padding:10px 0;overflow-wrap:anywhere">${routes[p]}<br>当前为独立设计文件，按钮演示不调用正式接口。</p></details>`}
function modal(title,body){$('dialogTitle').textContent=title;$('dialogContent').innerHTML=body;$('dialog').showModal()}
function info(title,body){modal(title,`<div class="modal-body">${body}</div><div class="modal-footer">${button('知道了','close','','primary')}</div>`)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,v=b.dataset.arg;
if(a==='nav')go(v);if(a==='back'&&trail.length){state=trail.pop();render()}if(a==='reset'){state.filter='';state.keyword='';render()}if(a==='calendar'){state.term=Number(v);go('calendar')}if(a==='majors')go('major',v);if(a==='classes')go('class',v);if(a==='check')go('check',v);if(a==='close')$('dialog').close();
if(a==='termDetail'){let t=terms[Number(v)];info('学期详情',`<h3>${esc(t.name)}</h3><p>${esc(t.range)} · ${t.weeks}</p><p>学期状态：${t.status}。${t.current?'此学期为全校当前学期。':'查看此对象不会切换全校当前学期。'}</p><p>下一步：${t.status==='草稿'?'完善日期、教学周和校历，再由有权限的岗位发布。':'核对正式校历与作息；历史记录保留只读。'}</p>`)}
if(a==='governance')info('发布后如何启用',`<p>发布确认学期定义；启用决定全校当前使用哪个学期。</p><p>由具备学校设置权限的人员在现有“学年学期与业务日历”中办理。本设计不合并权限或自动切换学期。</p>`);
if(a==='band')info(v+' · 上课时间段',`<p>节次编号与课表关联，季节作息通过时间段维护。</p><p>正式表单需填写：适用校区、生效起止日期、开始与结束时间；保存前校验时间重叠。</p><p>本演示不提交作息变更。</p>`);
if(a==='task')info('回到教学任务办理',`<p>正式系统从此处进入对应教学任务对象，继续维护任课关系、学生名单与名单版本。</p><p>本设计范围为教务基础三级菜单，因此此处展示跨模块交接说明。</p>`);
if(a==='classDetail'){let c=classes.find(x=>x.name===v);info('班级详情',`<h3>${esc(c.name)}</h3><p>${esc(c.college)} / ${esc(c.major)} / 2026 级</p><p>示例学生数：${c.count} 人。正式系统通过现有“学生”入口查阅名册。</p><p>本原型不包含学生个人信息。</p>`)}
if(a==='references')info('引用核对 · '+v,`<p>核对学生归属、未归档教学任务、生效培养方案后，再判断能否调整组织。</p><p>有引用不等于组织异常；它表示停用或删除前必须先处理业务关系。</p><p>示例状态用于展示流程，不能作为真实操作依据。</p>`);
if(a==='create'){let label={terms:'学期',college:'学院',major:'专业',class:'行政班',slots:'节次'}[state.page];modal('新建'+label+' · 演示',`<form id="createForm"><div class="modal-body"><p>试填表单，体验父级自动带入。数据仅保存在本次页面演示中。</p>${state.filter?`<label>已选范围<input value="${esc(state.filter)}" readonly></label>`:''}<label>${label}名称<input name="name" required maxlength="60" placeholder="填写示例名称"></label><p class="error" id="formError" role="alert"></p><small>真实日期、学制、审批和作息规则按学校确认内容填写。</small></div><div class="modal-footer"><button type="button" data-action="close">取消</button><button class="primary" type="submit">${state.page==='terms'?'保存演示草稿':'确认表单演示'}</button></div></form>`)} });
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='filterForm'){state.filter=$('filter')?$('filter').value:state.filter;state.keyword=$('keyword').value.trim();render()}if(e.target.id==='createForm'){let name=new FormData(e.target).get('name').trim();if(!name){$('formError').textContent='请填写名称，已填内容会保留。';return}if(state.page==='terms'){if(terms.some(t=>t.name===name)){$('formError').textContent='该学期名称已存在，请修改后重试。';return}terms.push({name,range:'日期待学校确认',weeks:'待配置',status:'草稿'});state.filter='';state.keyword=''}$('dialog').close();render();notify(state.page==='terms'?'演示草稿已加入列表，刷新后恢复示例数据':'表单交互演示完成，未保存至正式系统')}});
$('closeDialog').onclick=()=>$('dialog').close();$('menuSearch').oninput=nav;$('menuToggle').onclick=()=>{let open=$('third').classList.toggle('open');$('menuToggle').setAttribute('aria-expanded',String(open))};
render();
</script></body></html>
