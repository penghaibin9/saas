# Retired school-owned publisher. Kept to fail clearly for old launch commands.
# Active replacement: website/backend/website_app/worker.py and website/deploy/.
services:
  website-news-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.website_news_worker"]
    restart: "no"
    profiles: ["website-news"]
    network_mode: none
