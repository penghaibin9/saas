# =============================================================================
# 生产安全合同 · 安全响应头（唯一事实源）
# -----------------------------------------------------------------------------
# ⚠ Nginx add_header 继承陷阱：
#   只要一个 location 里写了**任意一条** add_header，它就会丢弃从 server{} /
#   http{} 继承来的**全部** add_header。所以每个自己写了 add_header 的 location
#   （典型是加 Cache-Control 的 index.html 与静态资源）都必须再 include 本文件，
#   否则 CSP 等安全头在那些响应上直接消失 —— 而 HTML 文档正是 CSP 最该生效的地方。
#
# 门禁：scripts/check/check-nginx-security-contract.py 会检查这一点。
# =============================================================================
add_header X-Frame-Options        "SAMEORIGIN"                      always;
add_header X-Content-Type-Options "nosniff"                         always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection       "1; mode=block"                   always;
add_header Content-Security-Policy $csp_header                      always;
