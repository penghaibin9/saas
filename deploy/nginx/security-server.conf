# =============================================================================
# 生产安全合同 · server{} 段（唯一事实源）
# -----------------------------------------------------------------------------
# 每个对外 server{} 都必须 include 本文件。配套 security-http.conf 提供 map 与
# limit_req_zone（那些指令只能写在 http{} 里）。
#
# 门禁：scripts/check/check-nginx-security-contract.py（CI 会跑）
# =============================================================================

# ── 安全响应头 ────────────────────────────────────────────────────────────
# 注意：任何自己写了 add_header 的 location 必须再 include 一次 security-headers.conf，
# 否则会把这里的头全部丢掉（Nginx add_header 不是叠加而是覆盖整层）。
include /etc/nginx/conf.d/security-headers.conf;

# ── 请求体上限（与后端 50MB 上传限制一致）────────────────────────────────
client_max_body_size 50m;

# ── 全站兜底限流 ──────────────────────────────────────────────────────────
# /api/ 里可再叠加更严格的规则；这里保证任何 server 至少有一层。
limit_conn per_ip_conn 50;
limit_req  zone=write_limit burst=60 nodelay;
limit_req  zone=auth_limit  burst=10 nodelay;

# ── 禁止绕过后端直读上传/导出目录 ────────────────────────────────────────
# 学生证件、成绩单、导出表都落在这两个目录；必须走后端鉴权，不能靠"路径猜不到"。
location ^~ /uploads/ {
    return 404;
}
location ^~ /exports/ {
    return 404;
}

# ── 隐藏文件与备份文件 ────────────────────────────────────────────────────
location ~ /\.(?!well-known) {
    deny all;
}
location ~* \.(bak|old|orig|save|swp|sql|log)$ {
    deny all;
}
