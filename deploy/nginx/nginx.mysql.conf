# =============================================================================
# deploy/nginx/nginx.mysql.conf —— MySQL 版部署 · Docker Nginx 主配置（可上服务器公网）
# -----------------------------------------------------------------------------
# 配合 deploy/docker/docker-compose.mysql.yml，整体挂载替换 /etc/nginx/nginx.conf。
# 单一对外站点（80 端口，绑服务器公网 IP/域名）：
#   /          → PC 管理端静态站点（frontend/dist，Vue3+Vite history 路由）
#   /miniapp/  → miniapp H5 静态站点（miniapp/dist/build/h5）
#   /api/      → 反向代理到 backend:8000（FastAPI，路径含 /api/v1）
#   /uploads/  → 直接读服务器磁盘上的上传目录（与 backend 同一 volume，只读）
#   /exports/  → 直接读服务器磁盘上的导出目录（与 backend 同一 volume，只读）
#
# ★ miniapp 子路径托管：H5 需以 base=/miniapp/ 构建（vite base 或 uni h5.router.base），
#   否则其内部绝对资源路径会 404。若不便改 base，可改用「独立端口/子域名」托管（见文末备选）。
#
# 语法自检 + 重载（容器内）：
#   docker compose -f deploy/docker/docker-compose.mysql.yml exec nginx nginx -t
#   docker compose -f deploy/docker/docker-compose.mysql.yml exec nginx nginx -s reload
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    # 生产安全合同（唯一事实源）：CSP、限流分区。
    # 门禁见 scripts/check/check-nginx-security-contract.py
    include /etc/nginx/conf.d/security-http.conf;
    server_tokens   off;
    client_max_body_size 50m;   # 与后端文件上传 50MB 限制一致

    # ── gzip 压缩 ──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    upstream backend_api {
        server backend:8000;
        keepalive 128;
    }

    server {
        listen       80;
        server_name  _;            # 绑服务器 IP/域名；有域名可改成实际域名

        # 安全响应头 / 请求体上限 / 兜底限流 / uploads-exports 封禁：
        # 统一走安全合同片段，不在此处各写一份。
        include /etc/nginx/conf.d/security-server.conf;

        # ── /api/ 反向代理到后端（FastAPI，含 /api/v1）──
        location /api/ {
            limit_conn per_ip_conn 50;
            limit_req zone=write_limit burst=60 nodelay;
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # ── miniapp H5 子路径（需以 base=/miniapp/ 构建）──
        location ^~ /miniapp/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /miniapp/index.html;   # history fallback
        }

        # ── PC 管理端（根路径，history 路由兜底）──
        location / {
            root  /usr/share/nginx/html/pc;
            index index.html;
            try_files $uri $uri/ /index.html;           # history fallback，刷新子页不 404
        }

        # index.html 不缓存（发版即刻生效）
        location = /index.html {
            root /usr/share/nginx/html/pc;
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 带哈希的静态资源长缓存
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
            root /usr/share/nginx/html/pc;
            try_files $uri =404;
            expires 1y;
            include /etc/nginx/conf.d/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }
    }

    # =========================================================================
    # 备选：若不便把 miniapp 以 base=/miniapp/ 构建，可改用「独立端口」托管：
    #   再加一个 server { listen 8080; root .../miniapp; try_files ... /index.html; }
    #   并放开安全组 8080 端口。二选一，不要与上面的 /miniapp/ 子路径同时用。
    # =========================================================================
}
