# =============================================================================
# 生产安全合同 · http{} 段（唯一事实源）
# -----------------------------------------------------------------------------
# 所有部署方式（Docker / systemd / 手工 HTTPS / 各端子站）都必须 include 本文件，
# 安全等级不得取决于当初复制了哪份模板。
#
# 用法：在 nginx.conf 的 http { ... } 内加：
#     include /etc/nginx/conf.d/security-http.conf;
# 再在每个 server { ... } 内加：
#     include /etc/nginx/conf.d/security-server.conf;
#
# 门禁：scripts/check/check-nginx-security-contract.py（CI 会跑）
# =============================================================================

# ── CSP（全站）────────────────────────────────────────────────────────────
# 不含 'unsafe-eval'：允许 eval 基本让 CSP 失去防 XSS 的意义，而本项目前端
# 构建产物不需要它。若某个页面报 eval 相关错误，正确做法是修那段代码/构建配置，
# 不是把 'unsafe-eval' 加回来。
# 'unsafe-inline' 暂时保留（Vite 产物内联样式与少量内联脚本），下一步改 nonce/hash。
map $sent_http_content_type $csp_header {
    default "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

# ── 限流分区 ──────────────────────────────────────────────────────────────
# 只读请求不限流（避免正常翻页被误伤），写操作与登录分别限。
map $request_method $write_limit_key {
    default        $binary_remote_addr;
    GET            "";
    HEAD           "";
    OPTIONS        "";
}

map $request_uri $auth_limit_key {
    default                        "";
    ~*^/api/v1/auth/               $binary_remote_addr;
    ~*^/api/v1/authz/login         $binary_remote_addr;
    ~*^/api/v1/authz/password      $binary_remote_addr;
}

limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
limit_req_zone  $write_limit_key    zone=write_limit:10m rate=30r/s;
limit_req_zone  $auth_limit_key     zone=auth_limit:10m  rate=5r/s;
