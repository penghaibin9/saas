# =============================================================================
# deploy/nginx/nginx.conf —— 本地部署预演 · Docker Nginx 主配置（P5 部署准备）
# -----------------------------------------------------------------------------
# 用途：配合 deploy/docker/docker-compose.local.yml，整体挂载替换官方 nginx 镜像的
#      /etc/nginx/nginx.conf。与 deploy/nginx/pc-frontend.conf.example、
#      miniapp-h5.conf.example（传统「宿主机装 Nginx + conf.d 站点片段」模式）是
#      两种不同部署形态的配置，二选一，不要混用；本文件专供 Docker Compose 预演使用。
#
# 两个站点用「不同端口」区分（本地没有域名时最简单，见 docs/deploy/07 第 4 节 方式B）：
#   :80    → PC 管理端静态站点（frontend/dist）
#   :8080  → miniapp H5 静态站点（miniapp/dist/build/h5）
# 两个站点都把 /api/ 反向代理给 backend 服务（docker 网络内用服务名 backend:8000）。
#
# 改完配置后先测语法再重载（容器内）：
#   docker compose -f deploy/docker/docker-compose.local.yml exec nginx nginx -t
#   docker compose -f deploy/docker/docker-compose.local.yml exec nginx nginx -s reload
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # 隐藏 Nginx 版本号（基础安全）
    server_tokens off;

    # ── gzip 压缩（全局，两个站点共用）──
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # =========================================================================
    # 站点 1：PC 管理端前端（frontend/dist，Vue3 + Vite，history 路由模式）
    # =========================================================================
    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html/pc;
        index  index.html;

        # ① 前端路由兜底（history 模式必需）：刷新子页面不 404
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ② index.html 不缓存：发版后立即拿到最新入口
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ③ 静态资源长缓存：文件名带哈希，可安全缓存一年
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ④ 基础安全响应头
        add_header X-Frame-Options            "SAMEORIGIN"                        always;
        add_header X-Content-Type-Options     "nosniff"                           always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"   always;
        add_header X-XSS-Protection           "1; mode=block"                     always;

        # ⑤ 公网健康检查（生产仅 status=UP，无内部细节）
        location = /health {
            proxy_pass http://backend:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ⑥ 运维就绪/指标：仅内网；外网依赖后端 INTERNAL_OPS_TOKEN
        location = /health/ready {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://backend:8000/health/ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Ops-Token $http_x_ops_token;
        }
        location = /internal/metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://backend:8000/internal/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Ops-Token $http_x_ops_token;
        }
        location = /health/metrics {
            return 404;
        }

        # ⑦ /api/ 反向代理给 backend（docker 网络内服务名 backend，端口 8000）
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # =========================================================================
    # 站点 2：miniapp H5（miniapp/dist/build/h5，uni-app，hash 路由模式）
    # =========================================================================
    server {
        listen       8080;
        server_name  localhost;

        root   /usr/share/nginx/html/miniapp;
        index  index.html;

        # ① 路由兜底（hash 模式其实不强依赖，但保留以统一两站点行为、兼容后续切 history）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ② index.html 不缓存
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ③ 静态资源长缓存
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ④ 基础安全响应头
        add_header X-Frame-Options            "SAMEORIGIN"                        always;
        add_header X-Content-Type-Options     "nosniff"                           always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"   always;
        add_header X-XSS-Protection           "1; mode=block"                     always;

        # ⑤ /api/ 反向代理给 backend（同上）
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
