# Standalone website virtual host. Never include this inside the student server.
# The front gateway owns TLS and domain routing; this service binds to loopback.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ /\. { deny all; }
    location = /api { return 404; }
    location /api/ {
        proxy_pass http://website-api:8012;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /news {
        proxy_pass http://website-api:8012;
        proxy_set_header Host $http_host;
    }
    location /news/ {
        proxy_pass http://website-api:8012;
        proxy_set_header Host $http_host;
    }
    location = /manage {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control no-store always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /manage/index.html =404;
    }
    location /manage/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control no-store always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /manage/index.html =404;
    }
    location /website-assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control no-cache;
        try_files $uri/index.html $uri =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
