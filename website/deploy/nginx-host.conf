# Linux host candidate, paired with the website systemd units.
# The TLS gateway must REPLACE X-Forwarded-For with the actual client address.
# Keep this service loopback-only; never expose its listener directly.
server {
    listen 127.0.0.1:8088;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    server_name _;
    root /opt/yueke-website/current/frontend/dist;
    server_tokens off;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ /\. { deny all; }
    location = /api { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /news {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $http_host;
    }
    location /news/ {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $http_host;
    }
    location = /manage {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control no-store always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /manage/index.html =404;
    }
    location /manage/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control no-store always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /manage/index.html =404;
    }
    location /website-assets/ {
        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css application/javascript image/svg+xml;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /official-site/company-shell.css {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control no-cache;
        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css application/javascript image/svg+xml;
        try_files $uri =404;
    }
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control no-cache;
        try_files $uri/index.html $uri =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
