# Local review candidate only. Do not replace an existing production gateway.
# Bind loopback for review. Resolve school_existing from the actual running gateway
# before deployment; port 1 intentionally cannot serve school traffic.
upstream website_existing { server 127.0.0.1:8088; }
upstream school_existing { server 127.0.0.1:1; }
map $host $website_canonical_redirect { default 0; hnyueke.com 1; }
map $host $website_fallback { default website_existing; hnyueke.com school_existing; }
map $http_upgrade $school_connection { default upgrade; '' close; }
server {
    listen 127.0.0.1:5290;
    server_name www.hnyueke.com hnyueke.com;
    client_max_body_size 26m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Canonical redirect applies only to confirmed PUBLIC website paths.
    location = / {
        if ($website_canonical_redirect) { return 301 https://www.hnyueke.com$request_uri; }
        proxy_pass http://website_existing;
    }
    location ~ ^/(?:products|solutions|services)(?:/|$) {
        if ($website_canonical_redirect) { return 301 https://www.hnyueke.com$request_uri; }
        proxy_pass http://website_existing;
    }
    location ~ ^/(?:platform|about|privacy|terms|support|contact)/?$ {
        if ($website_canonical_redirect) { return 301 https://www.hnyueke.com$request_uri; }
        proxy_pass http://website_existing;
    }
    location ~ ^/news(?:/|$) {
        if ($website_canonical_redirect) { return 301 https://www.hnyueke.com$request_uri; }
        proxy_pass http://website_existing;
    }
    location ~ ^/(?:website-assets|official-site)(?:/|$) { proxy_pass http://website_existing; }
    location ~ ^/(?:robots\.txt|sitemap\.xml|sitemap-pages\.xml)$ { proxy_pass http://website_existing; }
    location ~ ^/manage(?:/|$) { proxy_pass http://website_existing; }
    location ~ ^/api/manage/news(?:/|$) { proxy_pass http://website_existing; }
    location = /api/auth/login { proxy_pass http://website_existing; }
    location = /api/auth/logout { proxy_pass http://website_existing; }
    location = /api/auth/session { proxy_pass http://website_existing; }
    location = /api/health { proxy_pass http://website_existing; }
    location = /api/news/latest { proxy_pass http://website_existing; }
    location = /api/notification/website-lead { proxy_pass http://website_existing; }
    location = /api/notification/website-wechat-signature { proxy_pass http://website_existing; }

    # Retired school website writes never alias to new website identities.
    location ~ ^/api/v1/(?:platform/website-news|website-news)(?:/|$) { return 404; }
    location = /api/v1/notification/website-lead { return 404; }
    location = /api/v1/notification/website-wechat-signature { return 404; }
    location /api/v1/ {
        proxy_pass http://school_existing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $school_connection;
    }
    location ^~ /assets/ { proxy_pass http://school_existing; }
    location ~ ^/(?:login|platform-login|workbench|admin|teacher|portal|enterprise|miniapp|help)(?:/|$) { proxy_pass http://school_existing; }
    # Unknown www paths use the website's real 404. Bare-host unknown paths retain
    # the existing school gateway responsibility and are never host-wide redirects.
    location / {
        proxy_pass http://$website_fallback;
    }
}
