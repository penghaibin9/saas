<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>业务流程演练手册 · 实习/毕设管理平台</title>
<style>
  :root{--p:#2563eb;--g:#16a34a;--o:#ea580c;--pu:#7c3aed;--bg:#f3f4f6;--card:#fff;--bd:#e5e7eb;--t1:#111827;--t2:#6b7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);line-height:1.6;padding-bottom:60px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}
  header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:26px 0 20px}
  header h1{font-size:24px;margin-bottom:6px}
  header p{opacity:.9;font-size:14px}
  /* 信息条 */
  .infobar{background:#fff;border-radius:12px;padding:16px;margin-top:-14px;box-shadow:0 4px 16px rgba(0,0,0,.08);position:relative;z-index:2}
  .infobar h3{font-size:13px;color:var(--t2);margin-bottom:10px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--p);background:#eff6ff}
  .chip b{color:var(--p)}
  .chip .cp{font-size:11px;color:var(--t2)}
  /* 图例 */
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--t2);align-items:center;margin-top:6px}
  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
  .b-pc{background:#e0e7ff;color:#3730a3}.b-m{background:#dcfce7;color:#166534}
  .r-admin{background:#dbeafe;color:#1e40af}.r-teacher{background:#dcfce7;color:#166534}
  .r-stu{background:#ffedd5;color:#9a3412}.r-ent{background:#ede9fe;color:#6d28d9}
  /* tab */
  .tabs{display:flex;gap:8px;margin:22px 0 14px;flex-wrap:wrap}
  .tab{padding:9px 18px;border-radius:10px;border:1px solid var(--bd);background:#fff;cursor:pointer;font-weight:600;font-size:14px}
  .tab.active{background:var(--p);color:#fff;border-color:var(--p)}
  /* 步骤卡 */
  .flow{display:none}.flow.active{display:block}
  .flow-desc{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:12px 14px;font-size:13px;color:#1e40af;margin-bottom:16px}
  .step{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px;position:relative;border-left:4px solid var(--bd)}
  .step.handoff{border-left-color:var(--o);background:#fffbeb}
  .step-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .step-no{width:26px;height:26px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
  .step-title{font-weight:600;font-size:15px}
  .step-path{font-size:12px;color:var(--t2);margin:2px 0 8px}
  .step-path code{background:var(--bg);padding:1px 6px;border-radius:4px;color:var(--p);font-size:12px}
  .step-act{font-size:13px;color:#374151;margin-bottom:10px}
  .handoff-tag{background:var(--o);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
  /* 字段表 */
  .fields{display:grid;grid-template-columns:1fr;gap:6px}
  .field{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px}
  .field .k{color:var(--t2);min-width:96px;flex-shrink:0}
  .field .v{flex:1;color:var(--t1);word-break:break-all;font-family:"SF Mono",Consolas,monospace;font-size:12.5px}
  .field .copy{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--p);flex-shrink:0}
  .field .copy:hover{background:var(--p);color:#fff;border-color:var(--p)}
  .field .copy.done{background:var(--g);color:#fff;border-color:var(--g)}
  .copyall{margin-top:8px;font-size:12px;color:var(--p);cursor:pointer;display:inline-block}
  .note{font-size:12px;color:var(--t2);margin-top:8px;padding-left:8px;border-left:2px solid var(--bd)}
  /* toast */
  #toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:600px){.field .k{min-width:72px}header h1{font-size:20px}}
</style>
</head>

// ============ 渲染 ============
function chip(text,copyVal,sub){return `<div class="chip" onclick="copy('${copyVal.replace(/'/g,"\\'")}',this)">${text}${sub?` <span class="cp">${sub}</span>`:''} <span class="cp">⧉</span></div>;`.replace(/;$/,'');}

function render(){
  document.getElementById('accounts').innerHTML=ACCOUNTS.map(a=>
    `<div class="chip" onclick="copy('${a.u}',this)">${rbadge(a.r)} <b>${a.u}</b> <span class="cp">⧉复制</span></div>`).join('');
  document.getElementById('urls').innerHTML=URLS.map(u=>
    `<div class="chip" onclick="copy('${u.v}',this)">${u.n} <span class="cp">⧉</span></div>`).join('');

  document.getElementById('tabs').innerHTML=FLOWS.map((f,i)=>
    `<div class="tab ${i===0?'active':''}" onclick="switchTab(${i})">${f.title}</div>`).join('');

  document.getElementById('flows').innerHTML=FLOWS.map((f,i)=>`
    <div class="flow ${i===0?'active':''}" id="flow-${i}">
      <div class="flow-desc">${f.desc}</div>
      ${f.steps.map(s=>stepCard(s)).join('')}
    </div>`).join('');
}
function stepCard(s){
  const fieldsHtml=s.fields&&s.fields.length?`
    <div class="fields">${s.fields.map(([k,v])=>`
      <div class="field"><span class="k">${k}</span><span class="v">${v}</span>
        <button class="copy" onclick="copy('${String(v).replace(/'/g,"\\'")}',this)">复制</button></div>`).join('')}
    </div>
    <span class="copyall" onclick='copyAll(${JSON.stringify(s.fields)},this)'>⧉ 复制本步全部字段</span>`:'';
  return `<div class="step ${s.handoff?'handoff':''}">
    <div class="step-head">
      <span class="step-no">${s.no}</span>
      ${rbadge(s.role)} ${badge(s.end)}
      ${s.handoff?`<span class="handoff-tag">🔄 ${s.handoff}</span>`:''}
    </div>
    <div class="step-path">📍 ${s.page.replace(/›/g,'<span style="color:#9ca3af">›</span>')}</div>
    <div class="step-act">${s.act}</div>
    ${fieldsHtml}
    ${s.note?`<div class="note">${s.note}</div>`:''}
  </div>`;
}
function switchTab(i){
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',i===j));
  document.querySelectorAll('.flow').forEach((f,j)=>f.classList.toggle('active',i===j));
  window.scrollTo({top:0,behavior:'smooth'});
}
function copy(text,el){
  const done=()=>{toast('已复制：'+(text.length>30?text.slice(0,30)+'…':text));if(el&&el.classList){const o=el.textContent;el.classList.add('done');el.textContent='✓';setTimeout(()=>{el.classList.remove('done');el.textContent=o},900);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));}
  else fallback(text,done);
}
function copyAll(fields,el){
  const text=fields.map(([k,v])=>`${k}：${v}`).join('\n');
  copy(text);
}
function fallback(text,cb){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb&&cb();}catch(e){}document.body.removeChild(ta);}
let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
render();
</script>
</body>
</html>
