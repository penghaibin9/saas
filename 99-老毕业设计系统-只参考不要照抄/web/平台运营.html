<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SaaS 平台运营控制台</title>
<style>
:root{--brand:#0F2456;--blue:#0EA5E9;--teal:#0D9488;--green:#16A34A;--orange:#F97316;--red:#DC2626;--bg:#F2F4F8;--card:#fff;--border:#E8EDF3;--t1:#0F172A;--t2:#5B6B82;--t3:#9AA7B8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Noto Sans SC',Segoe UI,sans-serif;background:var(--bg);color:var(--t1);font-size:14px}
.hd{background:var(--brand);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
.hd .t{font-size:17px;font-weight:700}
.hd .meta{font-size:12px;color:#cbd5e1;display:flex;gap:16px;align-items:center}
.btn{border:none;border-radius:7px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600}
.btn-pri{background:var(--blue);color:#fff}.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--t1)}
.btn-xs{padding:3px 9px;font-size:12px;border-radius:6px}
.btn-danger{background:#fff;border:1px solid #FCA5A5;color:var(--red)}.btn-ok{background:#fff;border:1px solid #86EFAC;color:var(--green)}
.wrap{max-width:1280px;margin:18px auto;padding:0 18px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #eef2f7;font-size:13px;vertical-align:middle}
th{background:#f8fafc;color:var(--t2);font-weight:600;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.tag-on{background:#dcfce7;color:#15803d}.tag-off{background:#fee2e2;color:#b91c1c}.tag-exp{background:#ffedd5;color:#c2410c}
.muted{color:var(--t3)}
.over{color:var(--red);font-weight:700}
.acts{display:flex;gap:5px;flex-wrap:wrap}
select,input{border:1px solid #cbd5e1;border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit}
/* 浮层 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50}
.mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:440px;max-width:94vw;max-height:90vh;overflow:auto;padding:22px}
.modal h3{margin-bottom:14px;color:var(--brand)}
.fld{margin-bottom:11px}.fld label{display:block;font-size:12px;color:var(--t2);margin-bottom:4px}
.fld input,.fld select{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#0F2456,#0b1733);display:flex;align-items:center;justify-content:center;z-index:80}
.login.hide{display:none}
.login-box{background:#fff;border-radius:16px;padding:30px;width:360px}
.login-box h2{color:var(--brand);font-size:18px;margin-bottom:6px}.login-box p{color:var(--t2);font-size:12px;margin-bottom:16px}
.login-box input{width:100%;margin-bottom:12px;padding:11px}
.err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--brand);color:#fff;padding:11px 16px;border-radius:10px;z-index:99;max-width:360px;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none}
.empty{padding:40px;text-align:center;color:var(--t3)}
.kv{font-size:12px;color:var(--t2)}.kv b{color:var(--t1)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--border);background:#fff;color:var(--t2);border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.ttl{padding:11px 14px;font-weight:700;color:var(--brand);border-bottom:1px solid var(--border);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px}
.kpi .n{font-size:26px;font-weight:800;color:var(--brand)}.kpi .l{font-size:12px;color:var(--t2);margin-top:4px}
.bdg{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.bdg-ok{background:#dcfce7;color:#15803d}.bdg-warn{background:#fef3c7;color:#b45309}.bdg-over{background:#fee2e2;color:#b91c1c}
.bar2{height:6px;border-radius:4px;background:#eef2f7;overflow:hidden;margin-top:3px}.bar2 i{display:block;height:100%;background:var(--blue)}
</style>
</head>
<body>
<div class="hd">
  <div class="t">🛰️ SaaS 平台运营控制台</div>
  <div class="meta">
    <span id="m-mode">—</span><span id="m-pool">—</span>
    <button class="btn btn-ghost btn-xs" onclick="logout()">退出</button>
  </div>
</div>

<div class="wrap">
  <div class="tabs" id="tabs">
    <button class="tab active" data-v="tenants" onclick="switchView('tenants')">🏫 租户管理</button>
    <button class="tab" data-v="billing" onclick="switchView('billing')">💰 计费对账</button>
    <button class="tab" data-v="supervision" onclick="switchView('supervision')">🛰️ 跨校监管驾驶舱</button>
  </div>

  <!-- 视图：租户管理 -->
  <section id="view-tenants">
    <div class="bar">
      <div class="kv">共 <b id="cnt">0</b> 所学校（租户）</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="loadAll()">刷新</button>
        <button class="btn btn-pri" onclick="openProvision()">+ 开通学校</button>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr>
          <th>标识/学校</th><th>套餐</th><th>学生配额</th><th>AI配额</th><th>到期</th><th>状态</th><th>操作</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </section>

  <!-- 视图：计费对账 -->
  <section id="view-billing" style="display:none">
    <div class="bar">
      <div class="kv" id="bill-sum">用量 vs 配额对账 + 年/月经常性收入</div>
      <button class="btn btn-pri" onclick="refreshBilling()">聚合最新用量并对账</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>学校</th><th>套餐/年费</th><th>学生</th><th>存储</th><th>AI</th><th>对账</th></tr></thead>
        <tbody id="bill-body"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </section>

  <!-- 视图：跨校监管 -->
  <section id="view-supervision" style="display:none">
    <div class="bar">
      <div class="kv" id="sup-sum">监管局口径：跨所有在用学校的实习规模与风险总账</div>
      <button class="btn btn-ghost" onclick="loadSupervision()">刷新</button>
    </div>
    <div id="sup-cards" class="kpis"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
      <div class="card"><div class="ttl">⚠️ 全局风险总账（跨校求和）</div><table><tbody id="sup-radar"></tbody></table></div>
      <div class="card"><div class="ttl">🏴 风险最高学校榜（督导优先）</div><table><thead><tr><th>学校</th><th>实习生</th><th>风险合计</th></tr></thead><tbody id="sup-rank"></tbody></table></div>
    </div>
  </section>
</div>

<!-- 开通学校 -->
<div class="mask" id="m-prov"><div class="modal">
  <h3>开通学校（新建租户）</h3>
  <div class="row2">
    <div class="fld"><label>标识 code（小写字母数字，子域名用）*</label><input id="p-code" placeholder="如 hnsh"></div>
    <div class="fld"><label>学校名称 *</label><input id="p-name" placeholder="如 湖南某职业学院"></div>
  </div>
  <div class="row2">
    <div class="fld"><label>套餐</label><select id="p-plan"></select></div>
    <div class="fld"><label>服务到期日</label><input id="p-expire" type="date"></div>
  </div>
  <div class="row2">
    <div class="fld"><label>区域</label><input id="p-region" placeholder="如 湖南"></div>
    <div class="fld"><label>管理员账号</label><input id="p-admin" value="admin"></div>
  </div>
  <div class="row2">
    <div class="fld"><label>联系人</label><input id="p-cname"></div>
    <div class="fld"><label>联系电话</label><input id="p-cphone"></div>
  </div>
  <div class="err" id="p-err"></div>
  <div class="mfoot"><button class="btn btn-ghost" onclick="closeM('m-prov')">取消</button><button class="btn btn-pri" id="p-go" onclick="doProvision()">开通</button></div>
</div></div>

<!-- 配额 -->
<div class="mask" id="m-quota"><div class="modal">
  <h3>设置配额 · <span id="q-code"></span></h3>
  <div class="fld"><label>学生数上限</label><input id="q-stu" type="number" min="0"></div>
  <div class="fld"><label>存储上限(MB)</label><input id="q-sto" type="number" min="0"></div>
  <div class="fld"><label>AI 月调用上限</label><input id="q-ai" type="number" min="0"></div>
  <div class="err" id="q-err"></div>
  <div class="mfoot"><button class="btn btn-ghost" onclick="closeM('m-quota')">取消</button><button class="btn btn-pri" onclick="saveQuota()">保存</button></div>
</div></div>

<!-- 详情 -->
<div class="mask" id="m-detail"><div class="modal">
  <h3>租户详情 · <span id="d-code"></span></h3>
  <div id="d-body"></div>
  <div class="mfoot"><button class="btn btn-ghost" onclick="closeM('m-detail')">关闭</button></div>
</div></div>

<!-- 登录（输入平台令牌） -->
<div class="login" id="login">
  <div class="login-box">
    <h2>平台运营登录</h2>
    <p>请输入平台运营令牌（PLATFORM_ADMIN_TOKEN）</p>
    <input id="lg-token" type="password" placeholder="平台令牌" autocomplete="off">
    <button class="btn btn-pri" style="width:100%;padding:11px" onclick="doLogin()">进入控制台</button>
    <div class="err" id="lg-err"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = (location.protocol==='file:'||!location.host) ? 'http://localhost:3000/api/platform' : (location.origin + '/api/platform');
let _tok = localStorage.getItem('ptoken') || '';
let _plans = [];
let _tenants = [];

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
function closeM(id){document.getElementById(id).classList.remove('show');}
function showM(id){document.getElementById(id).classList.add('show');}

async function api(method, path, body){
  const r = await fetch(API+path,{method,headers:{Authorization:'Bearer '+_tok,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){ logout(); throw new Error('令牌无效，请重新登录'); }
  let j; try{ j=await r.json(); }catch{ throw new Error('返回异常'); }
  if(!j.success) throw new Error(j.message||('HTTP '+r.status));
  return j.data;
}

// ── 登录 ──
function showLogin(){ document.getElementById('login').classList.remove('hide'); }
function hideLogin(){ document.getElementById('login').classList.add('hide'); }
async function doLogin(){
  const tk=document.getElementById('lg-token').value.trim();
  const err=document.getElementById('lg-err'); err.textContent='';
  if(!tk){ err.textContent='请输入令牌'; return; }
  _tok=tk;
  try{ await api('GET','/pool-stats'); localStorage.setItem('ptoken',_tok); hideLogin(); start(); }
  catch(e){ _tok=''; err.textContent='登录失败：'+e.message; }
}
function logout(){ _tok=''; localStorage.removeItem('ptoken'); showLogin(); }
document.getElementById('lg-token').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// ── 主体 ──
async function loadStats(){
  try{ const s=await api('GET','/pool-stats');
    document.getElementById('m-mode').textContent='模式：'+(s.mode==='multi'?'SaaS多租户':'单库');
    document.getElementById('m-pool').textContent='连接池：'+s.cached+' 个 · 单库'+s.connectionLimit+'连接';
  }catch(e){}
}
async function loadPlans(){
  try{ _plans=await api('GET','/plans'); }catch(e){ _plans=[]; }
  const opt=_plans.map(p=>`<option value="${esc(p.code)}">${esc(p.name)}（${p.max_students}生/${p.ai_monthly_quota}AI）</option>`).join('');
  document.getElementById('p-plan').innerHTML=opt;
}
async function loadTenants(){
  const tb=document.getElementById('tbody');
  try{
    const d=await api('GET','/tenants');
    const list=d.tenants||[];
    _tenants=list;
    document.getElementById('cnt').textContent=list.length;
    if(!list.length){ tb.innerHTML='<tr><td colspan="7" class="empty">暂无学校。点击右上「开通学校」新增（需 multi 模式）。</td></tr>'; return; }
    tb.innerHTML=list.map(t=>{
      const u=t.usage||{};
      const stu = `${u.students!=null?u.students:'—'} / ${t.max_students||'∞'}`;
      const stuCls = t.over_student?'over':'';
      const ai = `${u.ai_calls!=null?u.ai_calls:'—'} / ${t.ai_monthly_quota||'∞'}`;
      const exp = t.expire_date?esc(String(t.expire_date).slice(0,10)):'—';
      const st = t.status!==1?'<span class="tag tag-off">停用</span>':(t.expired?'<span class="tag tag-exp">已过期</span>':'<span class="tag tag-on">正常</span>');
      const planSel=_plans.map(p=>`<option value="${esc(p.code)}" ${p.code===t.plan?'selected':''}>${esc(p.name)}</option>`).join('');
      return `<tr>
        <td><b>${esc(t.code)}</b><div class="muted">${esc(t.name)}</div></td>
        <td><select onchange="changePlan('${esc(t.code)}',this.value)">${planSel}</select></td>
        <td class="${stuCls}">${stu}</td>
        <td>${ai}</td>
        <td>${exp}</td>
        <td>${st}</td>
        <td><div class="acts">
          <button class="btn btn-ghost btn-xs" onclick="openQuota('${esc(t.code)}')">配额</button>
          <button class="btn btn-ghost btn-xs" onclick="renew('${esc(t.code)}')">续费</button>
          <button class="btn btn-ghost btn-xs" onclick="refreshUsage('${esc(t.code)}')">用量</button>
          <button class="btn btn-ghost btn-xs" onclick="detail('${esc(t.code)}')">详情</button>
          ${t.status===1?`<button class="btn btn-danger btn-xs" onclick="suspend('${esc(t.code)}')">停服</button>`:`<button class="btn btn-ok btn-xs" onclick="resume('${esc(t.code)}')">恢复</button>`}
        </div></td>
      </tr>`;
    }).join('');
  }catch(e){ tb.innerHTML=`<tr><td colspan="7" class="empty">加载失败：${esc(e.message)}</td></tr>`; }
}
function loadAll(){ loadStats(); loadTenants(); }

// ── 开通 ──
function openProvision(){ ['p-code','p-name','p-expire','p-region','p-cname','p-cphone'].forEach(i=>document.getElementById(i).value=''); document.getElementById('p-admin').value='admin'; document.getElementById('p-err').textContent=''; showM('m-prov'); }
async function doProvision(){
  const body={ code:document.getElementById('p-code').value.trim(), name:document.getElementById('p-name').value.trim(),
    plan:document.getElementById('p-plan').value, expire_date:document.getElementById('p-expire').value||null,
    region:document.getElementById('p-region').value.trim()||null, adminUser:document.getElementById('p-admin').value.trim()||'admin',
    contact_name:document.getElementById('p-cname').value.trim()||null, contact_phone:document.getElementById('p-cphone').value.trim()||null };
  const err=document.getElementById('p-err'); err.textContent='';
  const btn=document.getElementById('p-go'); btn.disabled=true; btn.textContent='开通中（建库+迁移，约 30 秒）…';
  try{
    const d=await api('POST','/tenants',body);
    closeM('m-prov');
    alert(`✅ 开通成功！\n学校：${d.name}\n标识：${d.code}\n数据库：${d.db_name}\n管理员：${d.adminUser} / ${d.adminPass}\n（请记录初始密码，管理员首登需改密）`);
    loadAll();
  }catch(e){ err.textContent='开通失败：'+e.message; }
  finally{ btn.disabled=false; btn.textContent='开通'; }
}

// ── 行操作 ──
async function changePlan(code,plan){ try{ await api('PUT','/tenants/'+code+'/plan',{plan}); toast('套餐已更新为 '+plan); loadTenants(); }catch(e){ toast(e.message); } }
let _qCode='';
function openQuota(code){ const t=_tenants.find(x=>x.code===code); if(!t)return; _qCode=code; document.getElementById('q-code').textContent=code; document.getElementById('q-stu').value=t.max_students||''; document.getElementById('q-sto').value=t.max_storage_mb||''; document.getElementById('q-ai').value=t.ai_monthly_quota||''; document.getElementById('q-err').textContent=''; showM('m-quota'); }
async function saveQuota(){ try{ await api('PUT','/tenants/'+_qCode+'/quota',{ max_students:+document.getElementById('q-stu').value||0, max_storage_mb:+document.getElementById('q-sto').value||0, ai_monthly_quota:+document.getElementById('q-ai').value||0 }); closeM('m-quota'); toast('配额已保存'); loadTenants(); }catch(e){ document.getElementById('q-err').textContent=e.message; } }
async function renew(code){ const d=prompt('续费到期日（YYYY-MM-DD）：'); if(!d)return; try{ await api('PUT','/tenants/'+code+'/renew',{expire_date:d}); toast('已续费至 '+d); loadTenants(); }catch(e){ toast(e.message); } }
async function refreshUsage(code){ try{ const u=await api('POST','/tenants/'+code+'/refresh-usage'); toast(`用量已刷新：学生 ${u.students}，AI ${u.ai_calls}${u.over_student?'（学生超配额！）':''}`); loadTenants(); }catch(e){ toast(e.message); } }
async function suspend(code){ if(!confirm('确定停服 '+code+'？该校将无法登录使用。'))return; try{ await api('POST','/tenants/'+code+'/suspend'); toast('已停服'); loadTenants(); }catch(e){ toast(e.message); } }
async function resume(code){ try{ await api('POST','/tenants/'+code+'/resume'); toast('已恢复'); loadTenants(); }catch(e){ toast(e.message); } }
async function detail(code){
  try{
    const t=await api('GET','/tenants/'+code);
    const ev=(t.events||[]).map(e=>`<tr><td>${esc(e.type)}</td><td class="muted">${esc(String(e.created_at).replace('T',' ').slice(0,19))}</td><td class="muted">${esc(e.operator||'')}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">无</td></tr>';
    document.getElementById('d-code').textContent=code;
    document.getElementById('d-body').innerHTML=`
      <div class="kv" style="line-height:1.9">
        <div>学校：<b>${esc(t.name)}</b></div>
        <div>数据库：<b>${esc(t.db_name)}</b></div>
        <div>套餐：<b>${esc(t.plan)}</b> · 学生上限 <b>${t.max_students||'∞'}</b> · AI <b>${t.ai_monthly_quota||'∞'}</b></div>
        <div>到期：<b>${t.expire_date?esc(String(t.expire_date).slice(0,10)):'—'}</b> · 状态：<b>${t.status===1?'正常':'停用'}</b></div>
      </div>
      <h3 style="font-size:14px;margin:14px 0 6px">操作记录</h3>
      <table><thead><tr><th>事件</th><th>时间</th><th>操作人</th></tr></thead><tbody>${ev}</tbody></table>`;
    showM('m-detail');
  }catch(e){ toast(e.message); }
}

// ── 视图切换 ──
let _curView='tenants';
function switchView(v){
  _curView=v;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  ['tenants','billing','supervision'].forEach(x=>{ document.getElementById('view-'+x).style.display = (x===v?'':'none'); });
  if(v==='billing') loadBilling();
  if(v==='supervision') loadSupervision();
}

// ── 计费对账 ──
function pctBar(d){ const pct=Math.min(100,d.pct||0); const cls=d.over?'#DC2626':(pct>=90?'#F97316':'#0EA5E9');
  return `${d.used} / ${d.cap||'∞'} <span class="muted">(${d.pct||0}%)</span><div class="bar2"><i style="width:${pct}%;background:${cls}"></i></div>`; }
async function loadBilling(){
  const tb=document.getElementById('bill-body');
  try{
    const d=await api('GET','/billing');
    const s=d.summary;
    document.getElementById('bill-sum').innerHTML=`周期 <b>${esc(d.period)}</b> · 在用 <b>${s.active}</b>/${s.tenants} 校 · 超配额 <b class="${s.over_quota?'over':''}">${s.over_quota}</b> 校 · ARR <b>¥${(s.arr||0).toLocaleString()}</b> · MRR <b>¥${(s.mrr||0).toLocaleString()}</b>`;
    if(!d.rows.length){ tb.innerHTML='<tr><td colspan="6" class="empty">暂无数据</td></tr>'; return; }
    tb.innerHTML=d.rows.map(r=>{
      const rc=r.reconcile, badge={ok:'bdg-ok',warn:'bdg-warn',over:'bdg-over'}[rc.status]||'bdg-ok';
      const label={ok:'正常',warn:'临界',over:'超配额'}[rc.status]||rc.status;
      return `<tr>
        <td><b>${esc(r.code)}</b><div class="muted">${esc(r.name)}</div></td>
        <td>${esc(r.plan)}<div class="muted">¥${(r.price_year||0).toLocaleString()}/年</div></td>
        <td style="min-width:130px">${pctBar(rc.dims.students)}</td>
        <td style="min-width:130px">${pctBar(rc.dims.storage)}</td>
        <td style="min-width:130px">${pctBar(rc.dims.ai)}</td>
        <td><span class="bdg ${badge}">${label}</span></td>
      </tr>`;
    }).join('');
  }catch(e){ tb.innerHTML=`<tr><td colspan="6" class="empty">加载失败：${esc(e.message)}</td></tr>`; }
}
async function refreshBilling(){ try{ const r=await api('POST','/billing/refresh'); toast(`已聚合 ${r.count} 校用量`); loadBilling(); }catch(e){ toast(e.message); } }

// ── 跨校监管驾驶舱 ──
async function loadSupervision(){
  try{
    const d=await api('GET','/supervision'); const t=d.totals;
    document.getElementById('sup-cards').innerHTML=[
      ['在用学校',t.ok+' / '+t.schools],['实习生总数',t.interns],['在岗实习',t.active_interns],['风险事项合计',t.risk_total],
    ].map(([l,n])=>`<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
    document.getElementById('sup-radar').innerHTML=(d.radar||[]).map(x=>`<tr><td>${esc(x.label)}</td><td style="text-align:right"><b class="${x.value>0?'over':''}">${x.value}</b></td></tr>`).join('')||'<tr><td class="muted">无</td></tr>';
    document.getElementById('sup-rank').innerHTML=(d.ranking||[]).map(x=>`<tr><td><b>${esc(x.code)}</b> <span class="muted">${esc(x.name||'')}</span></td><td>${x.interns}</td><td class="${x.risk_total>0?'over':''}">${x.risk_total}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">无</td></tr>';
  }catch(e){ toast('监管数据加载失败：'+e.message); }
}

function start(){ loadStats(); loadPlans().then(loadTenants); }
if(_tok){ hideLogin(); start(); } else { showLogin(); }
</script>
