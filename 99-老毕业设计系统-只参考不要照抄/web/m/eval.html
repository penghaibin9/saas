<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>企业导师评价</title>
<style>
:root{--p:#0EA5E9;--bg:#F2F4F8;--line:#E5E9F0;--t1:#1A2233;--t2:#6B7790;--g:#16A34A}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{background:linear-gradient(135deg,#0F2456,#0EA5E9);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px}
.top h1{margin:0 0 6px;font-size:19px}.top p{margin:0;opacity:.9;font-size:13px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
label{display:block;font-size:13px;color:var(--t2);margin:12px 0 6px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;font-family:inherit}
textarea{min-height:90px;resize:vertical}
.stars{display:flex;gap:8px;font-size:30px;cursor:pointer}
.stars span{filter:grayscale(1);opacity:.4;transition:.1s}.stars span.on{filter:none;opacity:1}
.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}
.row:last-child{border:none}.row .l{font-size:14px}
.btn{width:100%;border:none;background:var(--p);color:#fff;font-size:16px;font-weight:600;padding:14px;border-radius:12px;margin-top:8px}
.btn:disabled{opacity:.5}
.msg{text-align:center;padding:40px 16px;color:var(--t2)}
.done{text-align:center;padding:50px 16px}.done .i{font-size:54px}.done h2{margin:12px 0 4px}
.kv{font-size:14px;color:var(--t2);margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">加载中…</div></div>
<script>
const API='/api';
const token=new URLSearchParams(location.search).get('token')||'';
const app=document.getElementById('app');
const DIMS=[['score_overall','综合表现'],['score_attitude','工作态度'],['score_skill','专业能力'],['score_discipline','纪律性']];
const stars={};
function render(d){
  if(d.status===1){ done(d); return; }
  app.innerHTML=`
    <div class="top"><h1>企业导师评价</h1><p>请您对实习学生的表现作出客观评价，感谢配合</p></div>
    <div class="card">
      <div class="kv">实习学生：<b style="color:var(--t1)">${d.student_name||'-'}</b></div>
      <div class="kv">实习单位：${d.enterprise_name||'-'}</div>
    </div>
    <div class="card">
      <label>评委（企业导师）姓名</label><input id="mentor_name" value="${d.mentor_name||''}" placeholder="请输入您的姓名">
      <label>职务</label><input id="mentor_title" placeholder="如：技术主管">
      ${DIMS.map(x=>`<label>${x[1]}</label><div class="stars" data-k="${x[0]}">${[1,2,3,4,5].map(i=>`<span data-v="${i}">★</span>`).join('')}</div>`).join('')}
      <label>评语</label><textarea id="comment" placeholder="对该生实习期间表现的总体评价与建议"></textarea>
      <button class="btn" id="sub">提交评价</button>
    </div>`;
  document.querySelectorAll('.stars').forEach(box=>{
    const k=box.dataset.k; stars[k]=0;
    box.querySelectorAll('span').forEach(s=>{
      s.onclick=()=>{ const v=Number(s.dataset.v); stars[k]=v;
        box.querySelectorAll('span').forEach(x=>x.classList.toggle('on',Number(x.dataset.v)<=v)); };
    });
  });
  document.getElementById('sub').onclick=submit;
}
function done(d){
  app.innerHTML=`<div class="card done"><div class="i">✅</div><h2>评价已提交</h2><p style="color:var(--t2)">感谢您对${d.student_name||'该生'}的评价反馈</p></div>`;
}
async function submit(){
  const btn=document.getElementById('sub'); btn.disabled=true; btn.textContent='提交中…';
  const body={ mentor_name:val('mentor_name'), mentor_title:val('mentor_title'), comment:val('comment') };
  DIMS.forEach(x=>body[x[0]]=stars[x[0]]||null);
  if(!body.mentor_name){ alert('请填写您的姓名'); btn.disabled=false; btn.textContent='提交评价'; return; }
  if(!body.score_overall){ alert('请至少为“综合表现”评分'); btn.disabled=false; btn.textContent='提交评价'; return; }
  try{
    const r=await fetch(API+'/public/enterprise-eval/'+token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(j.success){ done({student_name:''}); }
    else { alert(j.message||'提交失败'); btn.disabled=false; btn.textContent='提交评价'; }
  }catch(e){ alert('网络错误，请重试'); btn.disabled=false; btn.textContent='提交评价'; }
}
function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }
(async()=>{
  if(!token){ app.innerHTML='<div class="msg">链接无效（缺少 token）</div>'; return; }
  try{
    const r=await fetch(API+'/public/enterprise-eval/'+token);
    const j=await r.json();
    if(!j.success){ app.innerHTML='<div class="msg">'+(j.message||'链接无效或已失效')+'</div>'; return; }
    render(j.data);
  }catch(e){ app.innerHTML='<div class="msg">加载失败，请稍后重试</div>'; }
})();
</script>
</body>
</html>
