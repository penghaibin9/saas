<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>企业工作台 · 实习管理</title>
<style>
:root{--blue:#0EA5E9;--teal:#0D9488;--green:#16A34A;--red:#DC2626;--bg:#F2F4F8;--card:#fff;--brand:#0F2456;--border:#E8EDF3;--t1:#0F172A;--t2:#5B6B82;--t3:#9AA7B8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:#dfe4ec;color:var(--t1);font-size:15px}
#phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media(min-width:480px){#phone{margin:16px auto;min-height:calc(100vh - 32px);border-radius:28px;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.12)}}
#login{position:absolute;inset:0;background:linear-gradient(160deg,#0F2456,#1B3A7A 60%,#0EA5E9);display:flex;flex-direction:column;justify-content:center;padding:32px 28px;color:#fff;z-index:30}
#login h1{font-size:22px;margin-bottom:6px}#login p{font-size:13px;opacity:.7;margin-bottom:24px}
#login input{width:100%;padding:13px 14px;border:0;border-radius:12px;margin-bottom:12px;font-size:15px}
#login button{width:100%;padding:14px;border:0;border-radius:12px;background:#fff;color:#0F2456;font-size:16px;font-weight:700;margin-top:4px}
#loginErr{color:#FECACA;font-size:12px;min-height:18px;margin-bottom:6px}
.login-hint{margin-top:16px;font-size:12px;opacity:.65;line-height:1.8}
.link-a{color:#BAE6FD;text-decoration:none;font-size:13px;display:inline-block;margin-top:12px}
.top{background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.top .ttl{font-size:17px;font-weight:600}
.top .out{background:none;border:0;color:rgba(255,255,255,.85);font-size:13px}
.body{flex:1;overflow-y:auto;padding:14px 14px 80px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(15,23,42,.04)}
.hello{background:linear-gradient(135deg,#0EA5E9,#0D9488);color:#fff}
.hello .n{font-size:19px;font-weight:700}.hello .s{font-size:12px;opacity:.85;margin-top:4px}
.seg{display:flex;background:#EEF2F6;border-radius:10px;padding:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;min-width:56px;border:0;background:none;padding:8px 4px;border-radius:8px;font-size:12px;color:var(--t2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--t1);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--card);border-radius:14px;padding:14px;text-align:center}
.metric .v{font-size:20px;font-weight:700}.metric .l{font-size:11px;color:var(--t3);margin-top:3px}
.row{display:flex;justify-content:space-between;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row .m{font-size:14px;font-weight:500}.row .d{font-size:12px;color:var(--t3);margin-top:2px}
.sec-t{font-size:13px;color:var(--t3);margin:6px 2px 8px}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px}
.tag-g{background:#DCFCE7;color:#16A34A}.tag-y{background:#FEF9C3;color:#A16207}.tag-r{background:#FEE2E2;color:#DC2626}.tag-m{background:#EEF2F6;color:#64748B}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;margin-top:10px}
.btn-o{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn-sm{display:inline-block;width:auto;padding:6px 14px;font-size:13px;margin:8px 6px 0 0}
.btn-r{background:#fff;color:var(--red);border:1px solid #FCA5A5}
.empty{text-align:center;color:var(--t3);padding:34px 0;font-size:13px}
.sheet-mask{position:absolute;inset:0;background:rgba(15,23,42,.45);z-index:40;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:86%;overflow-y:auto}
.sheet h3{font-size:16px;margin-bottom:14px;text-align:center}
.sheet label{display:block;font-size:12px;color:var(--t2);margin:10px 0 4px}
.sheet input,.sheet textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;background:#F8FAFC}
.sheet textarea{min-height:90px;resize:vertical}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,23,42,.85);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:60}
.warn{background:#FEF9C3;border-radius:12px;padding:12px;font-size:13px;color:#854D0E;margin-bottom:12px}
</style>
</head>
<body>
<div id="phone">
  <div id="login">
    <h1>企业工作台</h1>
    <p>岗位发布 · 录用确认 · 实习生管理</p>
    <div id="loginErr"></div>
    <input id="u" placeholder="企业账号" />
    <input id="p" type="password" placeholder="密码" />
    <button onclick="doLogin()">登 录</button>
    <a class="link-a" href="javascript:void(0)" onclick="showRegister()">还没有账号？企业入驻注册 ›</a>
    <div class="login-hint">审核通过后可发布岗位、确认录用、查看实习生打卡</div>
  </div>
  <div id="app" style="display:none;flex:1;flex-direction:column;min-height:0">
    <div class="top">
      <div class="ttl" id="title">企业工作台</div>
      <button class="out" onclick="logout()">退出</button>
    </div>
    <div class="body" id="body"></div>
  </div>
</div>
<script>
const API='/api';
let TOKEN=localStorage.getItem('ent_token')||'';
let USER=JSON.parse(localStorage.getItem('ent_user')||'null');
let ENT=null, TAB='dash';

async function api(path,{method='GET',body}={}){
  const headers={}; if(body) headers['Content-Type']='application/json';
  if(TOKEN) headers['Authorization']='Bearer '+TOKEN;
  const res=await fetch(API+path,{method,headers,body:body?JSON.stringify(body):undefined});
  let json=null; try{json=await res.json();}catch{}
  if(res.status===401){toast('登录已过期');logout();throw new Error('登录已过期');}
  return {status:res.status,json};
}
const get=async p=>{const r=await api(p);return r.json&&r.json.data;};
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('phone').appendChild(t);setTimeout(()=>t.remove(),1600);}

async function doLogin(){
  const u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
  const e=document.getElementById('loginErr'); e.textContent='';
  if(!u||!p){e.textContent='请输入账号密码';return;}
  try{
    const r=await api('/users/login',{method:'POST',body:{username:u,password:p}});
    if(!(r.json&&r.json.success)){e.textContent=(r.json&&r.json.message)||'登录失败';return;}
    if(r.json.data.user.role!==5){e.textContent='请使用企业导师账号登录';return;}
    TOKEN=r.json.data.token; USER=r.json.data.user;
    localStorage.setItem('ent_token',TOKEN); localStorage.setItem('ent_user',JSON.stringify(USER));
    boot();
  }catch(err){e.textContent=err.message;}
}
function logout(){
  TOKEN='';USER=null; ENT=null;
  localStorage.removeItem('ent_token'); localStorage.removeItem('ent_user');
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
}
function tag(t,c){return `<span class="tag ${c}">${t}</span>`;}
const POS_ST={0:['待审核','tag-y'],1:['已上架','tag-g'],2:['已下架','tag-m']};
const fmtTime=s=>s?new Date(s).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';

function showRegister(){
  const m=document.createElement('div'); m.className='sheet-mask';
  m.innerHTML=`<div class="sheet"><h3>企业入驻注册</h3>
    <label>企业名称 *</label><input id="r_name">
    <label>联系人 *</label><input id="r_contact">
    <label>联系电话 *</label><input id="r_phone">
    <label>行业</label><input id="r_industry" placeholder="如：石油化工">
    <label>登录账号 *</label><input id="r_user">
    <label>登录密码 *（≥6位）</label><input id="r_pwd" type="password">
    <div id="rErr" style="color:var(--red);font-size:12px;margin-top:8px"></div>
    <button class="btn" id="rOk">提交入驻申请</button>
    <button class="btn btn-o" onclick="this.closest('.sheet-mask').remove()">取消</button></div>`;
  document.getElementById('phone').appendChild(m);
  m.querySelector('#rOk').onclick=async()=>{
    const err=m.querySelector('#rErr'); err.textContent='';
    const body={
      enterprise_name:m.querySelector('#r_name').value.trim(),
      contact_name:m.querySelector('#r_contact').value.trim(),
      contact_phone:m.querySelector('#r_phone').value.trim(),
      industry:m.querySelector('#r_industry').value.trim(),
      username:m.querySelector('#r_user').value.trim(),
      password:m.querySelector('#r_pwd').value
    };
    if(!body.enterprise_name||!body.contact_name||!body.contact_phone||!body.username||!body.password){
      err.textContent='请填写必填项'; return;
    }
    try{
      const r=await api('/public/enterprise-register',{method:'POST',body});
      if(r.json&&r.json.success){ m.remove(); toast(r.json.message||'已提交'); }
      else err.textContent=(r.json&&r.json.message)||'提交失败';
    }catch(e2){err.textContent=e2.message;}
  };
}

async function boot(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  await renderMain();
}
async function renderMain(){
  const el=document.getElementById('body');
  el.innerHTML='<div class="empty">加载中…</div>';
  try{
    const [ent,dash,pos,apps,interns,cks]=await Promise.all([
      get('/enterprise-portal/me'), get('/enterprise-portal/dashboard'),
      get('/enterprise-portal/positions?page_size=50'),
      get('/enterprise-portal/applications?status=3&page_size=50'),
      get('/enterprise-portal/interns?page_size=50'),
      get('/enterprise-portal/checkins?page_size=30')
    ]);
    ENT=ent;
    window._cache={pos:(pos&&pos.list)||[],apps:(apps&&apps.list)||[],interns:(interns&&interns.list)||[],cks:(cks&&cks.list)||[],dash:dash||{}};
    draw(el);
  }catch(e){el.innerHTML=`<div class="empty">⚠️ ${e.message||'加载失败'}<br><button class="btn btn-o" style="width:auto;margin-top:12px" onclick="renderMain()">重试</button></div>`;}
}
function setTab(t){TAB=t; draw(document.getElementById('body'));}
function draw(el){
  const d=window._cache.dash||{};
  const audit=ENT&&ENT.audit_status;
  const auditText=audit===1?'已通过':audit===2?'已驳回':'待审核';
  el.innerHTML=`
    <div class="card hello"><div class="n">${ENT&&ENT.name||'企业工作台'}</div><div class="s">审核：${auditText} · 企业导师端</div></div>
    ${audit!==1?'<div class="warn">企业尚未通过审核，岗位需学校审核通过后才能上架。</div>':''}
    <div class="seg">
      <button class="${TAB==='dash'?'on':''}" onclick="setTab('dash')">概览</button>
      <button class="${TAB==='pos'?'on':''}" onclick="setTab('pos')">岗位</button>
      <button class="${TAB==='app'?'on':''}" onclick="setTab('app')">申请</button>
      <button class="${TAB==='stu'?'on':''}" onclick="setTab('stu')">实习生</button>
      <button class="${TAB==='ck'?'on':''}" onclick="setTab('ck')">打卡</button>
    </div>
    ${TAB==='dash'?`
      <div class="grid3">
        <div class="metric"><div class="v">${d.positionsActive||0}<small>/${d.positions||0}</small></div><div class="l">在架岗位</div></div>
        <div class="metric"><div class="v">${d.pendingApplications||0}</div><div class="l">待确认</div></div>
        <div class="metric"><div class="v">${d.internCount||0}</div><div class="l">在册实习</div></div>
        <div class="metric"><div class="v">${d.todayCheckins||0}</div><div class="l">今日打卡</div></div>
      </div>`:''}
    ${TAB==='pos'?`
      <button class="btn" onclick="showPosForm()">＋ 发布岗位</button>
      <div class="card">${(window._cache.pos||[]).length?(window._cache.pos||[]).map(p=>{
        const st=POS_ST[p.status]||['','tag-m'];
        return `<div class="row"><div><div class="m">${p.title}</div><div class="d">${p.salary||'面议'}${p.headcount?' · 招'+p.headcount+'人':''}</div></div>${tag(st[0],st[1])}</div>`;
      }).join(''):'<div class="empty">暂无岗位</div>'}</div>`:''}
    ${TAB==='app'?`
      <div class="card">${(window._cache.apps||[]).length?(window._cache.apps||[]).map(a=>`
        <div class="row" style="flex-direction:column;align-items:stretch">
          <div><div class="m">${a.student_name||'学生'} · ${a.position_title||'岗位'}</div><div class="d">${a.student_eeid||''} · ${fmtTime(a.apply_time)}</div></div>
          <div><button class="btn btn-sm" onclick="confirmHire(${a.id},true)">录用</button><button class="btn btn-sm btn-r" onclick="confirmHire(${a.id},false)">不录用</button></div>
        </div>`).join(''):'<div class="empty">暂无待确认申请</div>'}</div>`:''}
    ${TAB==='stu'?`
      <div class="card">${(window._cache.interns||[]).length?(window._cache.interns||[]).map(s=>`
        <div class="row"><div><div class="m">${s.student_name||'学生'}</div><div class="d">${s.student_eeid||''} · 指导：${s.teacher_name||'-'}</div><div class="d">${s.position_title||''}</div></div></div>`).join(''):'<div class="empty">暂无在册实习生</div>'}</div>`:''}
    ${TAB==='ck'?`
      <div class="sec-t">今日打卡（只读）</div>
      <div class="card">${(window._cache.cks||[]).length?(window._cache.cks||[]).map(c=>`
        <div class="row"><div><div class="m">${c.student_name||'学生'}</div><div class="d">${fmtTime(c.checkin_time)}${c.address?' · '+c.address:''}</div></div>${c.within_range?tag('有效','tag-g'):tag('超范围','tag-r')}</div>`).join(''):'<div class="empty">今日暂无打卡</div>'}</div>`:''}
  `;
}
function showPosForm(){
  const m=document.createElement('div'); m.className='sheet-mask';
  m.innerHTML=`<div class="sheet"><h3>发布岗位</h3>
    <label>岗位名称 *</label><input id="p_title">
    <label>岗位描述</label><textarea id="p_desc"></textarea>
    <label>薪资说明</label><input id="p_sal" placeholder="如：3000元/月">
    <label>招聘人数</label><input id="p_head" type="number" value="1">
    <div id="pErr" style="color:var(--red);font-size:12px"></div>
    <button class="btn" id="pOk">提交审核</button>
    <button class="btn btn-o" onclick="this.closest('.sheet-mask').remove()">取消</button></div>`;
  document.getElementById('phone').appendChild(m);
  m.querySelector('#pOk').onclick=async()=>{
    const err=m.querySelector('#pErr'); err.textContent='';
    const title=m.querySelector('#p_title').value.trim();
    if(!title){err.textContent='请填写岗位名称';return;}
    try{
      const r=await api('/enterprise-portal/positions',{method:'POST',body:{
        title, description:m.querySelector('#p_desc').value.trim(),
        salary:m.querySelector('#p_sal').value.trim(), headcount:Number(m.querySelector('#p_head').value)||1
      }});
      if(r.json&&r.json.success){m.remove();toast(r.json.message||'已提交');renderMain();}
      else err.textContent=(r.json&&r.json.message)||'提交失败';
    }catch(e){err.textContent=e.message;}
  };
}
async function confirmHire(id,hired){
  if(!confirm(hired?'确定录用该学生？':'确定标记为不录用？')) return;
  try{
    const r=await api('/enterprise-portal/applications/'+id+'/confirm',{method:'PUT',body:{hired}});
    toast((r.json&&r.json.message)||'已操作');
    renderMain();
  }catch(e){toast(e.message);}
}
if(TOKEN&&USER&&USER.role===5) boot();
</script>
</body>
</html>
