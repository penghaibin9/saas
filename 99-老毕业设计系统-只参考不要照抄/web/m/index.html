<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<title>实习管理 · 移动端</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0F2456" />
<script>
/* PWA：注册 Service Worker，支持离线打开与弱网离线打卡（失败入队、联网重放） */
window.__checkinOfflineQueue = 0;
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'checkin-queue') {
      window.__checkinOfflineQueue = e.data.remain;
      window.dispatchEvent(new CustomEvent('checkin-queue', { detail: e.data.remain }));
    }
  });
  window.addEventListener('online', () => {
    if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ type: 'replay-checkin' });
  });
}
</script>
<style>
:root{--blue:#0EA5E9;--teal:#0D9488;--orange:#F97316;--green:#16A34A;--red:#DC2626;--purple:#7C3AED;
--bg:#F2F4F8;--card:#fff;--brand:#0F2456;--border:#E8EDF3;--t1:#0F172A;--t2:#5B6B82;--t3:#9AA7B8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",sans-serif;background:#dfe4ec;color:var(--t1);font-size:15px;overscroll-behavior:none}
/* 手机外框：桌面居中显示，手机上铺满 */
#phone{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.12)}
@media(min-width:480px){#phone{margin:16px auto;min-height:calc(100vh - 32px);border-radius:28px;overflow:hidden}}
/* 登录 */
#login{position:absolute;inset:0;background:linear-gradient(160deg,#0F2456,#1B3A7A 60%,#0EA5E9);display:flex;flex-direction:column;justify-content:center;padding:32px 28px;color:#fff;z-index:30}
#login h1{font-size:22px;margin-bottom:6px}#login p{font-size:13px;opacity:.7;margin-bottom:30px}
#login input{width:100%;padding:13px 14px;border:0;border-radius:12px;margin-bottom:12px;font-size:15px}
#login button{width:100%;min-height:48px;padding:14px;border:0;border-radius:12px;background:#fff;color:#0F2456;font-size:16px;font-weight:700}
#loginErr{color:#FECACA;font-size:12px;min-height:18px;margin-bottom:6px}
.login-hint{margin-top:16px;font-size:12px;opacity:.65;line-height:1.8}
.demo-roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.demo-roles button{min-height:42px;padding:9px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:13px}.demo-roles button:active{background:rgba(255,255,255,.25)}
.network-bar{display:none;padding:7px 14px;background:#FFF7ED;color:#9A3412;border-bottom:1px solid #FED7AA;font-size:12px;text-align:center}.network-bar.show{display:block}.network-bar.online{background:#F0FDF4;color:#166534;border-color:#BBF7D0}
/* 顶栏 */
.top{background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.top .ttl{font-size:17px;font-weight:600}
.top .back{font-size:20px;background:none;border:0;color:#fff;width:28px;text-align:left}
.top .bell{position:relative;background:none;border:0;color:#fff;font-size:18px}
.dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--red);border-radius:50%}
/* 内容 */
.body{flex:1;overflow-y:auto;padding:14px 14px 80px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(15,23,42,.04)}
.hello{background:linear-gradient(135deg,#0EA5E9,#0D9488);color:#fff}
.hello .n{font-size:19px;font-weight:700}.hello .s{font-size:12px;opacity:.85;margin-top:4px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.metric{background:var(--card);border-radius:14px;padding:14px 8px;text-align:center}
.metric .v{font-size:20px;font-weight:700}.metric .l{font-size:11px;color:var(--t3);margin-top:3px}
.metric small{color:var(--t3);font-weight:400;font-size:12px}
.qa{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;text-align:center}
.qa a{display:block;padding:12px 4px;background:var(--card);border-radius:12px;font-size:12px;color:var(--t2);text-decoration:none}
.qa .qi{font-size:22px;display:block;margin-bottom:5px}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.fgrid a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;border-radius:14px;text-decoration:none;position:relative;-webkit-tap-highlight-color:transparent}
.fgrid a:active{background:var(--bg)}
.fgrid .ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px}
.fgrid .tl{font-size:11px;color:var(--t2);text-align:center;line-height:1.25}
.fgrid .nb{position:absolute;top:6px;right:14px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:600;box-shadow:0 0 0 2px #fff}
.ic-b{background:#E0F2FE}.ic-g{background:#DCFCE7}.ic-o{background:#FFEDD5}.ic-p{background:#EDE9FE}.ic-t{background:#CCFBF1}.ic-y{background:#FEF9C3}.ic-r{background:#FEE2E2}.ic-m{background:#EEF2F6}
.hello-top{display:flex;justify-content:space-between;align-items:flex-start}
.hello .bell{position:relative;font-size:20px;text-decoration:none;line-height:1}
.hello .bell .nb{position:absolute;top:-6px;right:-8px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:#fff;color:var(--red);font-size:10px;line-height:16px;text-align:center;font-weight:700}
.prog-card{padding:14px 16px}
.prog-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.prog-row:first-child{margin-top:0}
.prog-row .pl{font-size:12px;color:var(--t2);width:34px}
.prog-bar{flex:1;height:8px;border-radius:6px;background:var(--bg);overflow:hidden}
.prog-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#0EA5E9,#0D9488)}
.prog-row .pv{font-size:12px;color:var(--t3);width:46px;text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row .m{font-size:14px}.row .d{font-size:12px;color:var(--t3);margin-top:2px}
.sec-t{font-size:13px;color:var(--t3);margin:6px 2px 8px}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px}
.tag-g{background:#DCFCE7;color:#16A34A}.tag-y{background:#FEF9C3;color:#A16207}.tag-r{background:#FEE2E2;color:#DC2626}.tag-b{background:#E0F2FE;color:#0284C7}.tag-m{background:#EEF2F6;color:#64748B}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;margin-top:10px}
.btn-o{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn-sm{display:inline-block;width:auto;padding:6px 14px;font-size:13px;margin:0 0 0 8px}
.btn-r{background:#fff;color:var(--red);border:1px solid #FCA5A5}
.empty{text-align:center;color:var(--t3);padding:34px 0;font-size:13px}
/* 大打卡按钮 */
.punch{width:170px;height:170px;border-radius:50%;margin:18px auto;background:linear-gradient(135deg,#0EA5E9,#0D9488);color:#fff;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(14,165,233,.4)}
.punch .big{font-size:20px;font-weight:700}.punch .sm{font-size:12px;opacity:.9;margin-top:4px}
.punch.done{background:linear-gradient(135deg,#16A34A,#0D9488)}
/* 底部 tab */
.tabbar{position:sticky;bottom:0;display:flex;background:#fff;border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;min-height:54px;background:none;border:0;padding:8px 0 9px;color:var(--t3);font-size:11px;touch-action:manipulation}
.tabbar button .ti{font-size:21px;display:block;margin-bottom:2px}
.tabbar button.on{color:var(--blue)}
/* 底部弹层表单 */
.sheet-mask{position:absolute;inset:0;background:rgba(15,23,42,.45);z-index:40;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:86%;overflow-y:auto}
.sheet h3{font-size:16px;margin-bottom:14px;text-align:center}
.sheet label{display:block;font-size:12px;color:var(--t2);margin:10px 0 4px}
.sheet input,.sheet textarea,.sheet select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;background:#F8FAFC}
.sheet textarea{min-height:90px;resize:vertical}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,23,42,.85);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:60;max-width:80%;text-align:center}
.seg{display:flex;background:#EEF2F6;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:13px;color:var(--t2)}
.seg button.on{background:#fff;color:var(--t1);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
#cmap{height:190px;border-radius:14px;overflow:hidden;margin-bottom:12px;z-index:1}
.map-fallback{height:150px;border-radius:14px;background:#EEF2F6;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--t3);font-size:13px;margin-bottom:12px}
.tapable:active{background:#F4F7FA}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.kv:last-child{border-bottom:0}.kv .k{color:var(--t3)}
.detail-body{font-size:14px;line-height:1.7;white-space:pre-wrap;background:#F8FAFC;border-radius:10px;padding:12px;margin-top:6px}
.dist-ok{color:var(--green);font-weight:700}.dist-no{color:var(--red);font-weight:700}
.leaflet-control-attribution{font-size:9px}
/* 骨架屏 */
.sk{background:linear-gradient(90deg,#eef2f6 25%,#e3e9f0 37%,#eef2f6 63%);background-size:400% 100%;animation:skl 1.3s ease infinite;border-radius:8px}
@keyframes skl{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.sk-line{height:13px;margin:8px 0}
/* 页面淡入 */
.body>*{animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* 空状态 */
.empty .ei{font-size:40px;display:block;margin-bottom:8px;opacity:.5}
/* 加载失败重试 */
.retry{text-align:center;padding:40px 16px;color:var(--t3)}
.retry .ei{font-size:40px;display:block;margin-bottom:10px}
.retry button{margin-top:14px;padding:9px 22px;border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:20px;font-size:14px}
/* tab 角标 */
.tabbar button{position:relative}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;line-height:16px;padding:0 4px;background:var(--red);color:#fff;font-size:10px;border-radius:8px;text-align:center}
/* 下拉刷新提示 */
.ptr{text-align:center;font-size:12px;color:var(--t3);padding:6px 0;height:0;overflow:hidden;transition:height .2s}
.ptr.on{height:26px}
/* 链接按钮行 */
.link-a{color:var(--blue);text-decoration:none}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.btn[disabled]{opacity:.6}
.btn,.qa a,.fgrid a,.row.tapable,.top button{touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid rgba(14,165,233,.35);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.fld-err{color:var(--red);font-size:11px;margin-top:3px;min-height:14px}
.gd-pill{display:inline-block;padding:3px 10px;border-radius:10px;background:#EEF2F6;color:var(--t2);font-size:12px;margin:0 6px 6px 0}
</style>
</head>
<body>
<div id="phone">
  <div id="login">
    <h1>实习管理平台</h1>
    <p>移动端 · 学生 / 教师 / 企业</p>
    <div id="loginErr" role="alert" aria-live="polite"></div>
    <label for="u" style="position:absolute;left:-9999px">账号</label><input id="u" placeholder="账号 / 工号 / 学号" autocomplete="username" aria-required="true" />
    <label for="p" style="position:absolute;left:-9999px">密码</label><input id="p" type="password" placeholder="请输入密码" autocomplete="current-password" aria-required="true" />
    <button id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="demo-roles" aria-label="演示账号快速填充"><button type="button" onclick="fillDemo('demo_stu1')">学生演示账号</button><button type="button" onclick="fillDemo('demo_teacher')">教师演示账号</button></div>
    <button type="button" onclick="clearLoginCache()" style="margin-top:10px;background:rgba(255,255,255,.15);color:#fff;font-size:14px">清除本地登录缓存</button>
    <div class="login-hint">演示账号（密码均为 <b>demo1234</b>）：<br>学生 demo_stu1 · 教师 demo_teacher<br>管理员请用 PC 端 demo_admin<br><a class="link-a" href="enterprise.html">企业工作台 / 入驻 ›</a></div>
  </div>

  <div id="app" style="display:none;flex:1;flex-direction:column;min-height:0">
    <div class="top">
      <button class="back" id="backBtn" style="visibility:hidden" onclick="goBack()">‹</button>
      <div class="ttl" id="title">首页</div>
      <button class="bell" onclick="render('notifications')">🔔<span class="dot" id="bellDot" style="display:none"></span></button>
    </div>
    <div class="network-bar" id="networkBar" role="status" aria-live="polite"></div>
    <div class="body" id="body"></div>
    <div class="tabbar" id="tabbar"></div>
  </div>
</div>

<script>
const API = '/api';
let TOKEN = localStorage.getItem('m_token') || '';
let USER = JSON.parse(localStorage.getItem('m_user') || 'null');
let mineData = {};

function updateNetworkState(isOnline, restored=false){
  const bar=document.getElementById('networkBar'); if(!bar)return;
  bar.className='network-bar show'+(isOnline?' online':'');
  bar.textContent=isOnline?(restored?'网络已恢复，正在同步待处理数据…':'网络连接正常'):'当前处于离线状态；打卡会暂存，其他数据将在联网后刷新';
  clearTimeout(updateNetworkState._timer);
  if(isOnline) updateNetworkState._timer=setTimeout(()=>bar.classList.remove('show'),restored?2600:800);
}
window.addEventListener('offline',()=>updateNetworkState(false));
window.addEventListener('online',()=>{updateNetworkState(true,true);if(curKey)render(curKey);});

const AUTH_EXEMPT = ['/users/login', '/users/register'];
function isAuthExempt(path) { return AUTH_EXEMPT.some(p => path === p || path.startsWith(p + '?')); }

async function api(path, { method='GET', body, on401='logout' } = {}) {
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  let res;
  try {
    res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    throw new Error('网络连接失败，请检查网络后重试');
  }
  let json = null; try { json = await res.json(); } catch {}
  if (res.status === 401 && !isAuthExempt(path)) {
    if (on401 === 'return') return { status: 401, json };
    toast('登录已过期，请重新登录'); logout(); throw new Error('登录已过期');
  }
  if (res.status === 403 && json && json.data && json.data.code === 'MUST_CHANGE_PASSWORD') {
    forceChangePwd(); throw new Error('请先修改初始密码');
  }
  return { status: res.status, json };
}
const get = async p => { const r = await api(p); return r.json && r.json.data; };
// multipart 上传（用于含附件的周报/成果/报告）。不手动设 Content-Type，交给浏览器带 boundary
async function apiUpload(path, formData, method='POST'){
  const headers = {}; if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  let res;
  try { res = await fetch(API + path, { method, headers, body: formData }); }
  catch(e){ throw new Error('网络连接失败，请检查网络后重试'); }
  let json = null; try { json = await res.json(); } catch {}
  if (res.status === 401) { toast('登录已过期，请重新登录'); logout(); throw new Error('登录已过期'); }
  return { status: res.status, json };
}
async function openProtectedFile(url) {
  let preview = null;
  try {
    const target = new URL(url, location.href);
    if (!['http:', 'https:'].includes(target.protocol)) { toast('已阻止不安全的附件链接'); return; }
    const isLocalProtected = target.origin === location.origin &&
      (target.pathname.startsWith('/uploads/') || target.pathname.startsWith('/api/'));
    if (!isLocalProtected) { window.open(target.href, '_blank', 'noopener'); return; }
    preview = window.open('about:blank', '_blank');
    if (preview) preview.opener = null;
    const res = await fetch(target.href, { headers: TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {} });
    if (res.status === 401) { if (preview) preview.close(); toast('登录已过期'); logout(); return; }
    if (res.status === 403) { if (preview) preview.close(); toast('无权访问该附件'); return; }
    if (!res.ok) { if (preview) preview.close(); toast('附件打开失败'); return; }
    const objectUrl = URL.createObjectURL(await res.blob());
    if (preview) preview.location.href = objectUrl;
    else toast('浏览器阻止了预览窗口，请允许本站弹窗后重试');
    setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
  } catch (e) { if (preview) preview.close(); toast('附件打开失败'); }
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.getElementById('phone').appendChild(t); setTimeout(()=>t.remove(),1600); }

async function doLogin(){
  const u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
  const e=document.getElementById('loginErr'); e.textContent='';
  if(!u||!p){e.textContent='请输入账号密码';return;}
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.innerHTML='<span class="spin" style="border-color:rgba(15,36,86,.2);border-top-color:#0F2456"></span> 正在登录';
  try{
    const r=await api('/users/login',{method:'POST',body:{username:u,password:p}});
    if(r.status===429){e.textContent=(r.json&&r.json.message)||'登录过于频繁，请稍后再试';return;}
    if(!(r.json&&r.json.success)){e.textContent=(r.json&&r.json.message)||(r.status===401?'用户名或密码错误':'登录失败');return;}
    if(r.json.data.user.role===5){
      localStorage.setItem('ent_token',r.json.data.token);
      localStorage.setItem('ent_user',JSON.stringify(r.json.data.user));
      location.href='enterprise.html'; return;
    }
    if(r.json.data.user.role<3){ e.textContent='移动端面向学生/教师，请用学生或教师账号'; return; }
    TOKEN=r.json.data.token; USER=r.json.data.user;
    localStorage.setItem('m_token',TOKEN); localStorage.setItem('m_user',JSON.stringify(USER));
    if(r.json.data.mustChangePassword){ document.getElementById('login').style.display='none'; forceChangePwd(); return; }
    boot();
  }catch(err){e.textContent=err.message;}
  finally{btn.disabled=false;btn.textContent='登 录';}
}
function fillDemo(username){ document.getElementById('u').value=username; document.getElementById('p').value='demo1234'; document.getElementById('p').focus(); }
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
/* 首次登录强制修改初始密码（后端 mustChangePassword / 403 拦截） */
function forceChangePwd(){
  if(document.querySelector('.sheet-mask[data-force]')) return;
  const m=document.createElement('div'); m.className='sheet-mask'; m.dataset.force='1';
  m.innerHTML=`<div class="sheet"><h3>首次登录 · 修改初始密码</h3>
    <p style="font-size:12px;color:var(--t2);margin-bottom:6px">为了账号安全，请先设置新密码（需≥6位且含字母和数字）</p>
    <label>原密码</label><input id="fop" type="password" placeholder="初始密码">
    <label>新密码</label><input id="fnp" type="password" placeholder="新密码">
    <label>确认新密码</label><input id="fnp2" type="password" placeholder="再次输入新密码">
    <div class="fld-err" id="fcErr"></div>
    <button class="btn" id="fcok">提交并进入</button></div>`;
  document.getElementById('phone').appendChild(m);
  m.querySelector('#fcok').onclick=async()=>{
    const op=m.querySelector('#fop').value, np=m.querySelector('#fnp').value, np2=m.querySelector('#fnp2').value;
    const err=m.querySelector('#fcErr'); err.textContent='';
    if(!op||!np){ err.textContent='请填写完整'; return; }
    if(np!==np2){ err.textContent='两次输入的新密码不一致'; return; }
    if(np.length<6||!/[a-zA-Z]/.test(np)||!/[0-9]/.test(np)){ err.textContent='新密码需≥6位且含字母和数字'; return; }
    const btn=m.querySelector('#fcok'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
    try{
      const r=await api('/users/change-password',{method:'PUT',body:{oldPassword:op,newPassword:np}});
      if(!(r.json&&r.json.success)){ err.textContent=(r.json&&r.json.message)||'修改失败'; btn.disabled=false; btn.textContent='提交并进入'; return; }
      if(r.json.data&&r.json.data.token){ TOKEN=r.json.data.token; localStorage.setItem('m_token',TOKEN); }
      if(USER){ USER.mustChangePassword=false; localStorage.setItem('m_user',JSON.stringify(USER)); }
      m.remove(); toast('密码已修改 ✓'); boot();
    }catch(e2){ err.textContent=e2.message; btn.disabled=false; btn.textContent='提交并进入'; }
  };
}

async function tryRestoreSession(){
  if(!TOKEN||!USER) return;
  try{
    const r=await api('/users/profile',{on401:'return'});
    if(r.status===401||!(r.json&&r.json.success)){ logout(); return; }
    USER=r.json.data;
    localStorage.setItem('m_user',JSON.stringify(USER));
    if(USER.role===5){ location.href='enterprise.html'; return; }
    if(USER.role<3){ logout(); document.getElementById('loginErr').textContent='移动端面向学生/教师，请换账号'; return; }
    boot();
  }catch{ logout(); }
}

function haversine(la1,lo1,la2,lo2){const R=6371000,t=d=>d*Math.PI/180;const dLa=t(la2-la1),dLo=t(lo2-lo1);const a=Math.sin(dLa/2)**2+Math.cos(t(la1))*Math.cos(t(la2))*Math.sin(dLo/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));}

// 给打卡照片叠加时间+定位水印，返回 Blob
function watermarkPhoto(file, lines){
  return new Promise((resolve)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=function(){
      try{
        const max=1080; let w=img.width,h=img.height;
        if(w>max){ h=Math.round(h*max/w); w=max; }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        const fs=Math.max(14,Math.round(w/34));
        ctx.font=`bold ${fs}px sans-serif`; ctx.textBaseline='bottom';
        const pad=Math.round(fs*0.6); let y=h-pad;
        const barH=lines.length*(fs+6)+pad;
        ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,h-barH,w,barH);
        ctx.fillStyle='#fff';
        for(let i=lines.length-1;i>=0;i--){ ctx.fillText(lines[i],pad,y); y-=(fs+6); }
        cv.toBlob(b=>resolve(b||file),'image/jpeg',0.85);
      }catch(_){ resolve(file); }
      finally{ URL.revokeObjectURL(url); }
    };
    img.onerror=function(){ resolve(file); };
    img.src=url;
  });
}

async function _submitAchResubmit(id,btn){
  const m=btn.closest('.sheet-mask');
  const err=m.querySelector('#reAchErr'); err.textContent='';
  const title=m.querySelector('#reAchTitle').value.trim();
  if(!title){err.textContent='请填写标题';return;}
  btn.disabled=true;
  try{
    const body={title,type:m.querySelector('#reAchType').value};
    const desc=m.querySelector('#reAchDesc').value.trim(); if(desc) body.description=desc;
    const link=m.querySelector('#reAchLink').value.trim(); if(link) body.link=link;
    const r=await api('/gd-achievements/'+id,{method:'PUT',body});
    if(!(r.json&&r.json.success)){err.textContent=(r.json&&r.json.message)||'提交失败';btn.disabled=false;return;}
    toast('已重新提交 ✓'); m.remove(); render('achievements');
  }catch(e){err.textContent=e.message;btn.disabled=false;}
}
function confirmSheet(msg, onOk){
  const m=document.createElement('div'); m.className='sheet-mask';
  m.innerHTML=`<div class="sheet">
    <div style="text-align:center;font-size:15px;font-weight:600;color:var(--t1);margin-bottom:8px">确认操作</div>
    <div style="text-align:center;font-size:13px;color:var(--t2);margin-bottom:20px;line-height:1.6">${msg}</div>
    <button class="btn btn-r" id="_cfOk">确认</button>
    <button class="btn btn-o" style="margin-top:8px" onclick="this.closest('.sheet-mask').remove()">取消</button>
  </div>`;
  document.getElementById('phone').appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  m.querySelector('#_cfOk').onclick=()=>{m.remove(); onOk();};
}

async function _submitReport(btn){
  const m=btn.closest('.sheet-mask');
  const title=m.querySelector('#rpTitle').value.trim();
  const err=m.querySelector('#rpErr'); err.textContent='';
  if(!title){err.textContent='请填写报告标题';return;}
  const s1=m.querySelector('#rpSec1').value.trim(),s2=m.querySelector('#rpSec2').value.trim(),s3=m.querySelector('#rpSec3').value.trim(),s4=m.querySelector('#rpSec4').value.trim();
  const content=[s1&&'一、实习单位与岗位介绍\n'+s1,s2&&'二、主要工作内容与成果\n'+s2,s3&&'三、实习收获与体会\n'+s3,s4&&'四、不足与改进方向\n'+s4].filter(Boolean).join('\n\n');
  btn.disabled=true;
  try{
    const fd=new FormData();
    fd.append('application_id', m.querySelector('#rpApp').value);
    fd.append('title', title); fd.append('content', content);
    const f=m.querySelector('#rpFile').files[0]; if(f) fd.append('file', f);
    const c=await apiUpload('/reports', fd);
    if(!(c.json&&c.json.success)){err.textContent=(c.json&&c.json.message)||'创建失败';btn.disabled=false;return;}
    await api('/reports/'+c.json.data.id+'/submit',{method:'PUT'}); toast('报告已提交 ✓'); m.remove(); render('reports');
  }catch(e){err.textContent=e.message;btn.disabled=false;}
}

async function mApplyTopicPool(id, title){
  // 检查是否已有分配到的课题
  const existing=Object.values(_cache.topics||{}).find(t=>t.status===1);
  if(existing){ toast('你已有确定的毕设选题，无需再选'); return; }
  // 获取当前开放的志愿轮次
  const rd=await get('/benchmark/topic-rounds').catch(()=>null);
  const rounds=(rd&&rd.list)||[];
  const activeRound=rounds.find(r=>r.status===1);
  if(!activeRound){
    const m=document.createElement('div'); m.className='sheet-mask';
    m.innerHTML=`<div class="sheet"><h3>暂无开放轮次</h3>
      <div style="background:#FFF7ED;border-radius:10px;padding:14px;font-size:13px;color:#92400e;line-height:1.7;margin-bottom:16px">
        📋 当前没有正在进行的选题轮次。<br>请等待院校/分院管理员开放新的选题轮次后再提交志愿。
      </div>
      ${rounds.length?`<div style="font-size:12px;color:var(--t3)">历史轮次：${rounds.map(r=>`${r.name}（${['未开始','进行中','已结束'][r.status]||''}）`).join('、')}</div>`:''}
      <button class="btn btn-o" onclick="this.closest('.sheet-mask').remove()" style="margin-top:14px">知道了</button>
    </div>`;
    document.getElementById('phone').appendChild(m);
    m.onclick=e=>{if(e.target===m)m.remove();};
    return;
  }
  // 检查是否已提交过该轮次的志愿
  const prevChoices=await get('/benchmark/topic-rounds/'+activeRound.id+'/choices').catch(()=>null);
  const myChoices=((prevChoices&&prevChoices.list)||[]).filter(c=>c.student_id===USER.id);
  const already=myChoices.find(c=>c.pool_id===id);
  if(already){ toast('已报名此课题，等待轮次结束后分配'); return; }
  if(myChoices.length>=(activeRound.max_choices||3)){
    toast(`本轮最多可选 ${activeRound.max_choices||3} 个志愿，请先撤销已有志愿`); return;
  }
  const priority=myChoices.length+1;
  // 合并旧志愿 + 新志愿重新提交（submitChoices 会先清空再插入）
  const newChoices=[...myChoices.map(c=>({pool_id:c.pool_id,priority:c.priority})),{pool_id:id,priority}];
  confirmSheet(
    `确认报名课题「${title}」？\n\n当前轮次：${activeRound.name}\n本次为第 ${priority} 志愿（最多 ${activeRound.max_choices||3} 个志愿）\n\n系统将在轮次结束后自动匹配，请耐心等待结果。`,
    async()=>{
      const r=await api('/benchmark/topic-choices',{method:'POST',body:{round_id:activeRound.id,choices:newChoices}});
      if(r.json&&r.json.success){ toast('志愿提交成功 ✓ 等待分配'); render('topics'); }
      else toast((r.json&&r.json.message)||'提交失败，请重试');
    });
}

     ${c.teacher_opinion?`<div style="margin:10px 0 4px;font-size:12px;color:var(--t3)">教师审批意见</div><div class="detail-body">${c.teacher_opinion}</div>`:''}
     ${c.admin_opinion?`<div style="margin:10px 0 4px;font-size:12px;color:var(--t3)">管理员审批意见</div><div class="detail-body">${c.admin_opinion}</div>`:''}
     ${c.status===3?`<div style="background:#FFF1F2;border-left:3px solid var(--red);padding:10px 12px;border-radius:6px;margin-top:10px;font-size:13px">❌ 申请已驳回，如有疑问请联系指导教师或管理员重新沟通</div>`:''}
     ${c.status===2?`<div style="background:#F0FDF4;border-left:3px solid var(--green);padding:10px 12px;border-radius:6px;margin-top:10px;font-size:13px">✅ 已执行：${c.change_type==='terminate'?'实习已终止，请完善档案材料':'已换至新实习单位，请留意新单位打卡范围'}</div>`:''}
     ${actions}`);
}
function asgChangeTeacherReview(id, agree){
  closeSheet();
  if(agree){
    const m=document.createElement('div'); m.className='sheet-mask';
    m.innerHTML=`<div class="sheet">
      <h3>通过换岗/终止申请</h3>
      <div style="background:#F0FDF4;border-left:3px solid var(--green);padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:13px">通过后将提交管理员进行终审执行</div>
      <label>审批意见（选填）</label>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">
        ${['情况属实，同意申请','已与企业导师核实，情况确认，同意转交管理员审批','学生申请原因合理，予以支持'].map(t=>`<button type="button" style="padding:5px 8px;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;font-size:11px;color:#065f46" onclick="appendText('_acTOp',this.textContent)">${t}</button>`).join('')}
      </div>
      <textarea id="_acTOp" rows="2" placeholder="填写意见或直接跳过"></textarea>
      <button class="btn" style="margin-top:10px" onclick="_submitAcTeacher(${id},true,this)">确认通过</button>
      <button class="btn btn-o" style="margin-top:8px" onclick="this.closest('.sheet-mask').remove()">取消</button>
    </div>`;
    document.getElementById('phone').appendChild(m);
    m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  } else {
    sheetReject('驳回换岗/终止申请',
      ['换岗原因不充分，请与现企业导师先行沟通协调',
       '终止实习理由不足，请提供书面证明材料后重新申请',
       '当前实习阶段任务未完成，暂不批准换岗',
       '学业情况不符合换岗条件，请完成当前阶段任务后再申请',
       '新单位资质未经学校认定，暂不批准换岗申请'],
      async reason=>{
        const r=await api('/assignment-changes/'+id+'/teacher-review',{method:'PUT',body:{approve:false,opinion:reason}});
        if(!(r.json&&r.json.success)) throw new Error((r.json&&r.json.message)||'操作失败');
        toast('已驳回申请'); render('asgchange');
      });
  }
}
async function _submitAcTeacher(id, approve, btn){
  btn.disabled=true;
  try{
    const opinion=(document.getElementById('_acTOp')||{}).value||'';
    const r=await api('/assignment-changes/'+id+'/teacher-review',{method:'PUT',body:{approve,opinion:opinion.trim()||undefined}});
    toast(r.json&&r.json.success?'审批成功 ✓':(r.json&&r.json.message)||'操作失败');
    if(r.json&&r.json.success){btn.closest('.sheet-mask').remove(); render('asgchange');}
    else btn.disabled=false;
  }catch(e){toast(e.message||'操作失败','error');btn.disabled=false;}
}
function asgChangeAdminReview(id, agree){
  closeSheet();
  const c=(_cache.asgchanges||{})[id];
  const typeTxt=c&&c.change_type==='terminate'?'终止实习':'换岗';
  if(agree){
    const m=document.createElement('div'); m.className='sheet-mask';
    m.innerHTML=`<div class="sheet">
      <h3>批准${typeTxt}申请</h3>
      <div style="background:#FFF7ED;border-left:3px solid var(--orange);padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:13px">⚠️ 批准后将立即执行${typeTxt}，${c&&c.change_type==='terminate'?'实习分配将终止':'实习单位将立即更新'}，操作不可撤销</div>
      <label>审批意见（选填）</label>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">
        ${['材料核实完毕，同意执行','经审核，情况属实，批准申请','已与相关各方确认，同意变更'].map(t=>`<button type="button" style="padding:5px 8px;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;font-size:11px;color:#065f46" onclick="appendText('_acAOp',this.textContent)">${t}</button>`).join('')}
      </div>
      <textarea id="_acAOp" rows="2" placeholder="填写意见或直接跳过"></textarea>
      <button class="btn" style="margin-top:10px" onclick="_submitAcAdmin(${id},true,this)">确认批准并执行</button>
      <button class="btn btn-o" style="margin-top:8px" onclick="this.closest('.sheet-mask').remove()">取消</button>
    </div>`;
    document.getElementById('phone').appendChild(m);
    m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  } else {
    sheetReject('驳回换岗/终止申请',
      ['材料不完整，请补充相关证明文件后重新申请',
       '不符合学校换岗政策要求，建议维持原实习安排',
       '新实习单位未在合作企业库中，暂不批准换岗',
       '终止申请理由不充分，请学生补充书面说明',
       '审批流程存在异常，需进一步核查后处理'],
      async reason=>{
        const r=await api('/assignment-changes/'+id+'/admin-review',{method:'PUT',body:{approve:false,opinion:reason}});
        if(!(r.json&&r.json.success)) throw new Error((r.json&&r.json.message)||'操作失败');
        toast('已驳回申请'); render('asgchange');
      });
  }
}
async function _submitAcAdmin(id, approve, btn){
  btn.disabled=true;
  try{
    const opinion=(document.getElementById('_acAOp')||{}).value||'';
    const r=await api('/assignment-changes/'+id+'/admin-review',{method:'PUT',body:{approve,opinion:opinion.trim()||undefined}});
    toast(r.json&&r.json.success?'操作成功 ✓':(r.json&&r.json.message)||'操作失败');
    if(r.json&&r.json.success){btn.closest('.sheet-mask').remove(); render('asgchange');}
    else btn.disabled=false;
  }catch(e){toast(e.message||'操作失败','error');btn.disabled=false;}
}

tryRestoreSession();
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
