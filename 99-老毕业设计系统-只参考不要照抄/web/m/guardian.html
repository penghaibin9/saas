<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>家长知情同意书 · 在线签署</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Noto Sans SC',Segoe UI,sans-serif;background:#eef1f6;color:#0F172A;font-size:15px}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}
.hd{background:#0F2456;color:#fff;padding:18px 16px;font-size:17px;font-weight:600}
.bd{padding:16px;flex:1}
.card{background:#F8FAFC;border:1px solid #E8EDF3;border-radius:12px;padding:14px;margin-bottom:14px}
.label{color:#5B6B82;font-size:13px;margin-bottom:4px}
.val{font-weight:600;margin-bottom:10px}
.content{white-space:pre-wrap;line-height:1.7;color:#334155;font-size:14px}
input,textarea{width:100%;border:1px solid #CBD5E1;border-radius:8px;padding:10px;font-size:15px;margin-top:6px;font-family:inherit}
.row{margin-bottom:12px}
.btn{display:block;width:100%;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:600;margin-top:10px;cursor:pointer}
.primary{background:#0EA5E9;color:#fff}
.ghost{background:#fff;color:#DC2626;border:1px solid #FCA5A5}
.tip{text-align:center;color:#64748B;padding:40px 16px;line-height:1.7}
.ok{text-align:center;padding:50px 16px}
.ok .ico{font-size:56px}
.ok .t{font-size:18px;font-weight:600;margin-top:12px;color:#16A34A}
.muted{color:#94A3B8;font-size:12px;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div class="hd">家长知情同意书 · 在线签署</div>
  <div class="bd" id="bd"><div class="tip">加载中…</div></div>
</div>
<script>
const API = location.origin + '/api/public/guardian/';
const token = new URLSearchParams(location.search).get('token') || '';
const bd = document.getElementById('bd');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function load(){
  if(!token){ bd.innerHTML='<div class="tip">链接无效（缺少令牌）</div>'; return; }
  try{
    const r = await fetch(API+encodeURIComponent(token));
    const j = await r.json();
    if(!j.success){ bd.innerHTML='<div class="tip">'+esc(j.message||'链接无效或已失效')+'</div>'; return; }
    const d = j.data;
    if(d.signStatus===1){ done('✅','您已于本知情同意书签署，感谢配合。'); return; }
    if(d.signStatus===2){ done('🚫','您已提交不同意意见，如需更改请联系学校。'); return; }
    if(d.expired){ bd.innerHTML='<div class="tip">签署链接已过期，请联系学校重新发起。</div>'; return; }
    render(d);
  }catch(e){ bd.innerHTML='<div class="tip">网络异常，请稍后重试</div>'; }
}
function render(d){
  bd.innerHTML = `
    <div class="card">
      <div class="label">学生</div><div class="val">${esc(d.studentName)}（学号 ${esc(d.studentEeid||'-')}）</div>
      <div class="label">${esc(d.title)}</div>
      <div class="content">${esc(d.content)}</div>
    </div>
    <div class="card">
      <div class="row"><div class="label">签署人姓名 *</div><input id="sn" placeholder="请输入家长/监护人姓名" /></div>
      <div class="row"><div class="label">与学生关系</div><input id="rel" placeholder="如：父亲 / 母亲 / 监护人" /></div>
      <div class="row"><div class="label">联系电话</div><input id="ph" inputmode="numeric" placeholder="选填" /></div>
      <button class="btn primary" id="agree">我已阅读并同意</button>
      <button class="btn ghost" id="reject">不同意</button>
      <div class="muted">提交即代表您本人确认，系统将记录签署时间与设备信息以备核查。</div>
    </div>`;
  document.getElementById('agree').onclick = ()=>submit(true);
  document.getElementById('reject').onclick = ()=>submit(false);
}
async function submit(agree){
  const sign_name=(document.getElementById('sn')||{}).value;
  const relation=(document.getElementById('rel')||{}).value;
  const guardian_phone=(document.getElementById('ph')||{}).value;
  if(agree && !(sign_name||'').trim()){ alert('请填写签署人姓名'); return; }
  let reject_reason='';
  if(!agree){ reject_reason = prompt('请简要说明不同意的原因（选填）')||''; }
  try{
    const r = await fetch(API+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({agree, sign_name, relation, guardian_phone, guardian_name:sign_name, reject_reason})});
    const j = await r.json();
    if(j.success){ done(agree?'✅':'🚫', j.message||'已提交'); }
    else alert(j.message||'提交失败');
  }catch(e){ alert('网络异常，请重试'); }
}
function done(ico,t){ bd.innerHTML=`<div class="ok"><div class="ico">${ico}</div><div class="t">${esc(t)}</div></div>`; }
load();
</script>
</body>
</html>
