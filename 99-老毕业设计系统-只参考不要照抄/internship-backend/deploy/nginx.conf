# 反向代理 + 静态托管。HTTPS：建议用 certbot 签发后将 80 端口 301 跳转到 443
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API 反向代理
    location /api/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传材料必须回源由应用校验 Bearer token；严禁 alias 匿名直出。
    location /uploads/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store" always;
    }

    # 公开销售演示入口由 Nginx 直接托管，避免 SPA fallback 回到管理平台。
    location = /demo {
        alias /srv/frontend/演示UI.html;
        add_header Cache-Control "no-store" always;
    }

    # PC 管理端（管理平台.html 同目录托管，API 自动走同源）
    location / {
        root /srv/frontend;
        index 管理平台.html index.html;
        try_files $uri $uri/ /管理平台.html;
    }
}
