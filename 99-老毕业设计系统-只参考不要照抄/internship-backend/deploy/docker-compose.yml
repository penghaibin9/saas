# 毕业设计及实习管理平台 - 生产部署
# 用法：在 internship-backend 目录执行
#   cp .env.example .env   # 修改 DB_PASSWORD / JWT_SECRET 为强随机值
#   docker compose -f deploy/docker-compose.yml up -d
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在.env设置DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-internship_management}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_connections=500
    volumes:
      - db_data:/var/lib/mysql
      - ./backup:/backup
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    env_file: ../.env
    environment:
      DB_HOST: db
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      # 启用 HTTPS 时放开 443 并挂载证书
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../web:/srv/frontend:ro   # PC 前端目录（管理平台/数据大屏）
    depends_on:
      - app

volumes:
  db_data:
  uploads:
