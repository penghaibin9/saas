name: Academic D Current Main Merge Review

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/app/modules/academic_affairs/services/student_program_resolution_service.py"
      - "backend/app/modules/academic_affairs/services/academic_affairs_program_activation_service.py"
      - "backend/app/modules/academic_affairs/services/academic_affairs_graduation_service.py"
      - "backend/app/modules/academic_affairs/services/academic_affairs_graduation_immutable_service.py"
      - "frontend/src/modules/academicAffairs/views/AaArchiveConsoleView.vue"
      - "frontend/src/modules/academicAffairs/views/AaGraduationBatchView.vue"
      - "frontend/src/modules/academicAffairs/views/AaGraduationResultView.vue"
      - "frontend/src/modules/academicAffairs/views/AaGraduationAuditConsoleView.vue"
      - "frontend/src/modules/academicAffairs/views/AaEvaluationConsoleView.vue"
      - "student-portal/src/views/academic/StudentGraduationAuditView.vue"
      - "frontend/tests/pr147-merge-review-ui-contract.test.mjs"
      - "frontend/tests/pr147-pagination-control-contract.test.mjs"
      - "frontend/tests/stage-d-archive-precheck-contract.test.mjs"
      - "frontend/tests/stage-d-graduation-audit-console-contract.test.mjs"
      - "frontend/tests/stage-d-evaluation-console-production-contract.test.mjs"
      - "student-portal/tests/academic-d-w5-graduation-truth.test.mjs"
      - ".github/workflows/academic-d-current-main-merge-review.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: academic-d-current-main-merge-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  current-main-merge-review:
    name: Current main + D focused merge contract
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout GitHub synthetic merge commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Prove checkout is current base plus exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          MERGE_BASE_PARENT="$(git rev-parse HEAD^1)"
          MERGE_HEAD_PARENT="$(git rev-parse HEAD^2)"
          test "$MERGE_BASE_PARENT" = "${{ github.event.pull_request.base.sha }}"
          test "$MERGE_HEAD_PARENT" = "${{ github.event.pull_request.head.sha }}"
          {
            echo "mergeSha=$(git rev-parse HEAD)"
            echo "baseSha=$MERGE_BASE_PARENT"
            echo "headSha=$MERGE_HEAD_PARENT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run focused merged-tree UI source contracts
        run: |
          set -euo pipefail
          node --test \
            frontend/tests/pr147-merge-review-ui-contract.test.mjs \
            frontend/tests/pr147-pagination-control-contract.test.mjs \
            frontend/tests/stage-d-archive-precheck-contract.test.mjs \
            frontend/tests/stage-d-graduation-audit-console-contract.test.mjs \
            frontend/tests/stage-d-evaluation-console-production-contract.test.mjs \
            student-portal/tests/academic-d-w5-graduation-truth.test.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install frozen backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run current-main Program x Graduation focused contracts
        working-directory: backend
        env:
          APP_ENV: test
          DEPLOYMENT_MODE: development
          DEBUG: "false"
          DB_ENABLED: "false"
          FIELD_ENCRYPTION_KEY: academic-d-current-main-merge-review-field-key
          JWT_SECRET: academic-d-current-main-merge-review-jwt-secret
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_aa_graduation_program_resolution.py \
            tests/test_aa_graduation_program_history.py \
            tests/test_aa_graduation_overall_policy.py \
            tests/test_stage_d_integration_contract.py \
            -p no:warnings
