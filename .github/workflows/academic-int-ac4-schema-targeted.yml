name: Academic INT A-C4 Schema Targeted

on:
  push:
    branches:
      - integration/academic-school-gold
    paths:
      - .github/workflows/academic-int-ac4-schema-targeted.yml

permissions:
  contents: write

concurrency:
  group: academic-int-ac4-schema
  cancel-in-progress: false

jobs:
  ac4-schema-mysql:
    name: A-C4 full shared schema / fresh MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: int_ac4_root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pint_ac4_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CI: 'true'
      APP_ENV: test
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:int_ac4_root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:int_ac4_root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: int_ac4_root
      DB_NAME: student_lifecycle_test
      JWT_SECRET: academic-int-ac4-targeted-not-production
      JWT_SECRET_KEY: academic-int-ac4-targeted-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
    steps:
      - name: Checkout exact INT trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert INT is still a workflow-only child of current main
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 457dc8821876b8e1b67e0fb5911a9eec33e37616 HEAD
          python - <<'PY'
          import subprocess
          files = subprocess.check_output([
              'git', 'diff', '--name-only',
              '457dc8821876b8e1b67e0fb5911a9eec33e37616..HEAD',
          ], text=True).splitlines()
          print('INT pre-code delta=', files)
          assert files == ['.github/workflows/academic-int-ac4-schema-targeted.yml']
          PY
          grep -F 'revision = "20260816_internship_e_m8"' backend/alembic/versions/20260816_internship_e_m8_application_campaign_scope.py
          matches="$(grep -R --include='*.py' -F 'down_revision = "20260816_internship_e_m8"' backend/alembic/versions || true)"
          test -z "$matches"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Materialize complete A-C4 shared model migration and contract
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path('backend/app/models/academic_affairs.py')
          text = model.read_text(encoding='utf-8')
          old_import = 'from sqlalchemy import (BigInteger, Boolean, DateTime, Integer, Numeric, String,\n                        Text, UniqueConstraint)'
          new_import = 'from sqlalchemy import (BigInteger, Boolean, CheckConstraint, DateTime, Integer, Numeric, String,\n                        Text, UniqueConstraint)'
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import, 1)

          program_course_anchor = '''    open_term_no: Mapped[int | None] = mapped_column(Integer, comment="第几学期开课")\n    module: Mapped[str | None] = mapped_column(String(50), comment="课程模块 公共/专业/实践…")\n    credit_snapshot: Mapped[float | None] = mapped_column(Numeric(4, 1), comment="方案课程学分快照(支持0.5步长)")\n\n\nclass AaProgramBinding'''
          program_course_replacement = '''    open_term_no: Mapped[int | None] = mapped_column(Integer, comment="第几学期开课")\n    module: Mapped[str | None] = mapped_column(String(50), comment="课程模块 公共/专业/实践…")\n    credit_snapshot: Mapped[float | None] = mapped_column(Numeric(4, 1), comment="方案课程学分快照(支持0.5步长)")\n    formation_mode: Mapped[str | None] = mapped_column(\n        String(20),\n        comment="INT A-C4: ADMIN_FIXED/SELECTABLE/MERGED/RETAKE/LAYERED; legacy unresolved stays NULL",\n    )\n\n    __table_args__ = (\n        CheckConstraint(\n            "formation_mode IS NULL OR formation_mode IN ('ADMIN_FIXED','SELECTABLE','MERGED','RETAKE','LAYERED')",\n            name="ck_aa_program_course_formation_mode",\n        ),\n    )\n\n\nclass AaProgramBinding'''
          assert text.count(program_course_anchor) == 1
          text = text.replace(program_course_anchor, program_course_replacement, 1)

          batch_anchor = '''    college_id: Mapped[int | None] = mapped_column(BigInteger, index=True)\n    generate_at: Mapped[datetime | None] = mapped_column(DateTime)\n    status: Mapped[str] = mapped_column(String(50), nullable=False, default="DRAFT", index=True)\n    workflow_instance_id: Mapped[int | None] = mapped_column(BigInteger, index=True)\n\n\nclass AaTeachingTask'''
          batch_replacement = '''    college_id: Mapped[int | None] = mapped_column(BigInteger, index=True)\n    editable_scope_key: Mapped[str | None] = mapped_column(\n        String(64),\n        comment="INT A-C4: live DRAFT/RETURNED scope key; non-editable/deleted rows must release to NULL",\n    )\n    generate_at: Mapped[datetime | None] = mapped_column(DateTime)\n    status: Mapped[str] = mapped_column(String(50), nullable=False, default="DRAFT", index=True)\n    workflow_instance_id: Mapped[int | None] = mapped_column(BigInteger, index=True)\n\n    __table_args__ = (\n        UniqueConstraint("tenant_id", "editable_scope_key", name="uk_aa_task_batch_editable_scope"),\n    )\n\n\nclass AaTeachingTask'''
          assert text.count(batch_anchor) == 1
          text = text.replace(batch_anchor, batch_replacement, 1)

          task_anchor = '''    class_id: Mapped[int | None] = mapped_column(BigInteger, index=True)\n    teaching_class_code: Mapped[str | None] = mapped_column(String(50), comment="教学班代码")'''
          task_replacement = '''    class_id: Mapped[int | None] = mapped_column(BigInteger, index=True)\n    formation_mode: Mapped[str | None] = mapped_column(\n        String(20),\n        comment="INT A-C4: ADMIN_FIXED/SELECTABLE/MERGED/RETAKE/LAYERED; legacy unresolved stays NULL",\n    )\n    teaching_class_code: Mapped[str | None] = mapped_column(String(50), comment="教学班代码")'''
          assert text.count(task_anchor) == 1
          text = text.replace(task_anchor, task_replacement, 1)

          task_tail = '''    reject_reason: Mapped[str | None] = mapped_column(String(500))\n    status: Mapped[str] = mapped_column(String(50), nullable=False, default="PENDING_ASSIGN", index=True)\n\n\n# ═══════════ 课表组'''
          task_tail_replacement = '''    reject_reason: Mapped[str | None] = mapped_column(String(500))\n    status: Mapped[str] = mapped_column(String(50), nullable=False, default="PENDING_ASSIGN", index=True)\n\n    __table_args__ = (\n        CheckConstraint(\n            "formation_mode IS NULL OR formation_mode IN ('ADMIN_FIXED','SELECTABLE','MERGED','RETAKE','LAYERED')",\n            name="ck_aa_teaching_task_formation_mode",\n        ),\n    )\n\n\n# ═══════════ 课表组'''
          assert text.count(task_tail) == 1
          text = text.replace(task_tail, task_tail_replacement, 1)
          model.write_text(text, encoding='utf-8')

          migration = Path('backend/alembic/versions/20260816_academic_int_ac4_schema.py')
          migration.write_text('''"""Academic INT A-C4 shared authority schema.\n\nRevision ID: 20260816_acad_int_ac4\nRevises: 20260816_internship_e_m8\n\nAdditive and deliberately non-guessing:\n- legacy ProgramCourse and TeachingTask formation remain NULL unless explicit provenance exists;\n- existing TeachingTaskBatch rows keep editable_scope_key NULL until explicit reconciliation;\n- MySQL UNIQUE NULL semantics preserve history while future live writers reserve one scope.\n"""\nfrom __future__ import annotations\n\nimport sqlalchemy as sa\nfrom alembic import op\n\nrevision = "20260816_acad_int_ac4"\ndown_revision = "20260816_internship_e_m8"\nbranch_labels = None\ndepends_on = None\n\nFORMATION_CHECK = "formation_mode IS NULL OR formation_mode IN ('ADMIN_FIXED','SELECTABLE','MERGED','RETAKE','LAYERED')"\n\n\ndef _require_mysql() -> None:\n    if op.get_bind().dialect.name != "mysql":\n        raise RuntimeError("20260816_acad_int_ac4 requires MySQL")\n\n\ndef upgrade() -> None:\n    _require_mysql()\n    op.add_column(\n        "t_aa_program_course",\n        sa.Column(\n            "formation_mode", sa.String(length=20), nullable=True,\n            comment="ADMIN_FIXED/SELECTABLE/MERGED/RETAKE/LAYERED; unresolved legacy stays NULL",\n        ),\n    )\n    op.create_check_constraint(\n        "ck_aa_program_course_formation_mode",\n        "t_aa_program_course",\n        FORMATION_CHECK,\n    )\n\n    op.add_column(\n        "t_aa_teaching_task_batch",\n        sa.Column(\n            "editable_scope_key", sa.String(length=64), nullable=True,\n            comment="INT A-C4 live editable scope key; history/non-editable rows stay NULL",\n        ),\n    )\n    op.create_unique_constraint(\n        "uk_aa_task_batch_editable_scope",\n        "t_aa_teaching_task_batch",\n        ["tenant_id", "editable_scope_key"],\n    )\n\n    op.add_column(\n        "t_aa_teaching_task",\n        sa.Column(\n            "formation_mode", sa.String(length=20), nullable=True,\n            comment="ADMIN_FIXED/SELECTABLE/MERGED/RETAKE/LAYERED; unresolved legacy stays NULL",\n        ),\n    )\n    op.create_check_constraint(\n        "ck_aa_teaching_task_formation_mode",\n        "t_aa_teaching_task",\n        FORMATION_CHECK,\n    )\n\n\ndef downgrade() -> None:\n    _require_mysql()\n    op.drop_constraint(\n        "ck_aa_teaching_task_formation_mode",\n        "t_aa_teaching_task",\n        type_="check",\n    )\n    op.drop_column("t_aa_teaching_task", "formation_mode")\n    op.drop_constraint(\n        "uk_aa_task_batch_editable_scope",\n        "t_aa_teaching_task_batch",\n        type_="unique",\n    )\n    op.drop_column("t_aa_teaching_task_batch", "editable_scope_key")\n    op.drop_constraint(\n        "ck_aa_program_course_formation_mode",\n        "t_aa_program_course",\n        type_="check",\n    )\n    op.drop_column("t_aa_program_course", "formation_mode")\n''', encoding='utf-8')

          test = Path('backend/tests/test_academic_int_ac4_schema_mysql.py')
          test.write_text('''"""INT A-C4 shared schema: real MySQL constraints and no guessed legacy backfill."""\nfrom __future__ import annotations\n\nfrom pathlib import Path\n\nimport pytest\nfrom sqlalchemy import inspect\nfrom sqlalchemy.exc import IntegrityError, OperationalError\n\nfrom app.db.session import get_sessionmaker\nfrom app.models import AaProgramCourse, AaTeachingTask, AaTeachingTaskBatch\n\nMODES = {"ADMIN_FIXED", "SELECTABLE", "MERGED", "RETAKE", "LAYERED"}\n\n\ndef _mysql_code(exc: Exception) -> int | None:\n    original = getattr(exc, "orig", None)\n    args = getattr(original, "args", ())\n    return int(args[0]) if args and isinstance(args[0], int) else None\n\n\ndef _batch(*, tenant_id: int, term_id: int, key: str | None, name: str):\n    return AaTeachingTaskBatch(\n        tenant_id=tenant_id, term_id=term_id, batch_name=name, college_id=None,\n        editable_scope_key=key, status="DRAFT",\n    )\n\n\ndef _task(*, tenant_id: int, batch_id: int, course_id: int, mode: str | None):\n    return AaTeachingTask(\n        tenant_id=tenant_id, batch_id=batch_id, course_id=course_id,\n        course_code=f"INT-{course_id}", course_name=f"INT course {course_id}",\n        formation_mode=mode, is_merged=mode == "MERGED", no_auto_schedule=False,\n        status="READY",\n    )\n\n\ndef _program_course(*, tenant_id: int, program_id: int, label: str, mode: str | None):\n    return AaProgramCourse(\n        tenant_id=tenant_id, program_id=program_id, course_name=label,\n        open_term_no=1, formation_mode=mode,\n    )\n\n\ndef test_int_ac4_model_and_migration_contract_is_complete_additive_and_non_guessing():\n    assert AaProgramCourse.__table__.c.formation_mode.type.length == 20\n    assert AaProgramCourse.__table__.c.formation_mode.nullable is True\n    assert AaTeachingTaskBatch.__table__.c.editable_scope_key.type.length == 64\n    assert AaTeachingTaskBatch.__table__.c.editable_scope_key.nullable is True\n    assert AaTeachingTask.__table__.c.formation_mode.type.length == 20\n    assert AaTeachingTask.__table__.c.formation_mode.nullable is True\n\n    program_checks = {c.name: str(c.sqltext) for c in AaProgramCourse.__table__.constraints if c.name}\n    task_checks = {c.name: str(c.sqltext) for c in AaTeachingTask.__table__.constraints if c.name}\n    for name, checks in (("ck_aa_program_course_formation_mode", program_checks), ("ck_aa_teaching_task_formation_mode", task_checks)):\n        assert name in checks\n        for mode in MODES:\n            assert mode in checks[name]\n\n    batch_unique = {c.name: tuple(c.columns.keys()) for c in AaTeachingTaskBatch.__table__.constraints if c.name}\n    assert batch_unique["uk_aa_task_batch_editable_scope"] == ("tenant_id", "editable_scope_key")\n\n    source = Path("alembic/versions/20260816_academic_int_ac4_schema.py").read_text(encoding="utf-8")\n    upper = source.upper()\n    assert 'down_revision = "20260816_internship_e_m8"' in source\n    assert "UPDATE T_AA_PROGRAM_COURSE" not in upper\n    assert "UPDATE T_AA_TEACHING_TASK" not in upper\n    assert "UPDATE T_AA_TEACHING_TASK_BATCH" not in upper\n    assert "ADMIN_FIXED" in source and "editable_scope_key" in source\n\n\ndef test_int_ac4_mysql_enforces_scope_unique_and_both_formation_vocabularies(db_mode):\n    db = get_sessionmaker()()\n    try:\n        inspector = inspect(db.bind)\n        pc_columns = {c["name"]: c for c in inspector.get_columns("t_aa_program_course")}\n        batch_columns = {c["name"]: c for c in inspector.get_columns("t_aa_teaching_task_batch")}\n        task_columns = {c["name"]: c for c in inspector.get_columns("t_aa_teaching_task")}\n        assert pc_columns["formation_mode"]["type"].length == 20\n        assert pc_columns["formation_mode"]["nullable"] is True\n        assert batch_columns["editable_scope_key"]["type"].length == 64\n        assert batch_columns["editable_scope_key"]["nullable"] is True\n        assert task_columns["formation_mode"]["type"].length == 20\n        assert task_columns["formation_mode"]["nullable"] is True\n\n        uniques = {u["name"]: tuple(u["column_names"]) for u in inspector.get_unique_constraints("t_aa_teaching_task_batch")}\n        assert uniques["uk_aa_task_batch_editable_scope"] == ("tenant_id", "editable_scope_key")\n        pc_checks = {c["name"]: c["sqltext"] for c in inspector.get_check_constraints("t_aa_program_course")}\n        task_checks = {c["name"]: c["sqltext"] for c in inspector.get_check_constraints("t_aa_teaching_task")}\n        assert "ck_aa_program_course_formation_mode" in pc_checks\n        assert "ck_aa_teaching_task_formation_mode" in task_checks\n\n        tenant = 1000000000000008811\n        key = "V1:TERM:202601:SCHOOL"\n        first = _batch(tenant_id=tenant, term_id=202601, key=key, name="INT A-C4 1")\n        db.add(first)\n        db.commit()\n        db.refresh(first)\n\n        db.add(_batch(tenant_id=tenant, term_id=202601, key=key, name="INT A-C4 duplicate"))\n        with pytest.raises(IntegrityError) as duplicate:\n            db.commit()\n        assert _mysql_code(duplicate.value) == 1062\n        db.rollback()\n\n        db.add_all([\n            _batch(tenant_id=tenant, term_id=202601, key=None, name="INT history 1"),\n            _batch(tenant_id=tenant, term_id=202601, key=None, name="INT history 2"),\n        ])\n        db.commit()\n\n        db.add_all([\n            _program_course(tenant_id=tenant, program_id=88001, label="explicit SELECTABLE", mode="SELECTABLE"),\n            _program_course(tenant_id=tenant, program_id=88001, label="legacy unknown", mode=None),\n            _task(tenant_id=tenant, batch_id=first.id, course_id=99101, mode="SELECTABLE"),\n            _task(tenant_id=tenant, batch_id=first.id, course_id=99102, mode=None),\n        ])\n        db.commit()\n\n        db.add(_program_course(tenant_id=tenant, program_id=88001, label="invalid", mode="ELECTIVE"))\n        with pytest.raises(OperationalError) as invalid_program:\n            db.commit()\n        assert _mysql_code(invalid_program.value) == 3819\n        db.rollback()\n\n        db.add(_task(tenant_id=tenant, batch_id=first.id, course_id=99103, mode="ELECTIVE"))\n        with pytest.raises(OperationalError) as invalid_task:\n            db.commit()\n        assert _mysql_code(invalid_task.value) == 3819\n        db.rollback()\n    finally:\n        db.close()\n''', encoding='utf-8')
          PY

      - name: Audit exact generated scope
        run: |
          python -m py_compile \
            backend/app/models/academic_affairs.py \
            backend/alembic/versions/20260816_academic_int_ac4_schema.py \
            backend/tests/test_academic_int_ac4_schema_mysql.py
          git diff --check
          python - <<'PY'
          import subprocess
          expected = sorted([
              'backend/app/models/academic_affairs.py',
              'backend/alembic/versions/20260816_academic_int_ac4_schema.py',
              'backend/tests/test_academic_int_ac4_schema_mysql.py',
          ])
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z']).decode('utf-8')
          actual = sorted(record[3:] for record in raw.split('\0') if record)
          print('generated scope=', actual)
          assert actual == expected
          PY

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Fresh MySQL upgrade downgrade upgrade
        working-directory: backend
        run: |
          alembic upgrade head
          test "$(alembic heads | tr -d '\r')" = "20260816_acad_int_ac4 (head)"
          alembic downgrade 20260816_internship_e_m8
          alembic upgrade head
          test "$(alembic heads | tr -d '\r')" = "20260816_acad_int_ac4 (head)"

      - name: Run only complete A-C4 shared schema contracts
        working-directory: backend
        run: |
          pytest -q tests/test_academic_int_ac4_schema_mysql.py --maxfail=1 --junitxml=/tmp/ac4-junit.xml

      - name: Atomic fast-forward INT only after green
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/models/academic_affairs.py \
            backend/alembic/versions/20260816_academic_int_ac4_schema.py \
            backend/tests/test_academic_int_ac4_schema_mysql.py
          git diff --cached --check
          git commit -m "feat(academic-int): add complete A-C4 authority schema"
          git fetch origin integration/academic-school-gold
          test "$(git rev-parse origin/integration/academic-school-gold)" = "$GITHUB_SHA"
          git push origin HEAD:integration/academic-school-gold

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-int-ac4-${{ github.run_id }}
          path: /tmp/ac4-junit.xml
          if-no-files-found: warn
          retention-days: 14
