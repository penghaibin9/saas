name: Control Plane Targeted

on:
  push:
    branches:
      - integration/control-plane-option-b-20260815
    paths:
      - 'backend/app/api/v1/system.py'
      - 'backend/app/api/v1/platform.py'
      - 'backend/app/modules/system_admin/**'
      - 'backend/app/modules/platform/**'
      - 'backend/app/core/permissions.py'
      - 'backend/app/core/permission_catalog.py'
      - 'backend/app/models/rbac.py'
      - 'backend/app/models/permission_governance.py'
      - 'backend/app/services/security_change_service.py'
      - 'frontend/src/modules/system/**'
      - 'frontend/src/modules/platform/**'
      - 'shared/contracts/**'
      - 'scripts/check/check-control-plane-*.py'
      - 'scripts/check/check-permission-catalog.py'
      - 'backend/tests/test_control_plane_*'
      - 'backend/tests/test_permission_catalog_contract.py'
      - '.github/workflows/control-plane-targeted.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/app/api/v1/system.py'
      - 'backend/app/api/v1/platform.py'
      - 'backend/app/modules/system_admin/**'
      - 'backend/app/modules/platform/**'
      - 'backend/app/core/permissions.py'
      - 'backend/app/core/permission_catalog.py'
      - 'backend/app/models/rbac.py'
      - 'backend/app/models/permission_governance.py'
      - 'backend/app/services/security_change_service.py'
      - 'frontend/src/modules/system/**'
      - 'frontend/src/modules/platform/**'
      - 'shared/contracts/**'
      - 'scripts/check/check-control-plane-*.py'
      - 'scripts/check/check-permission-catalog.py'
      - 'backend/tests/test_control_plane_*'
      - 'backend/tests/test_permission_catalog_contract.py'
      - '.github/workflows/control-plane-targeted.yml'

permissions:
  contents: read

concurrency:
  group: control-plane-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: S0 byte-identical move gate
        run: python scripts/check/check-control-plane-move.py
      - name: G0 inventory artifact
        run: python scripts/check/check-control-plane-g0.py --write artifacts/control-plane/g0.json
      - name: Permission Catalog reconciliation
        run: python scripts/check/check-permission-catalog.py --write artifacts/control-plane/permission-catalog.json
      - name: B0-B7 Python syntax gate
        run: |
          python -m compileall -q \
            backend/app/modules/system_admin \
            backend/app/modules/platform \
            backend/app/core/permission_catalog.py \
            backend/app/core/effective_access.py \
            backend/app/services/security_change_service.py
      - name: B6/B7 frontend workspace contracts
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('backend/tests/test_control_plane_frontend_workspaces.py')
          for name, fn in sorted(ns.items()):
              if name.startswith('test_') and callable(fn):
                  fn()
          PY
      - name: Upload Control Plane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-contracts-${{ github.sha }}
          path: artifacts/control-plane/*.json
          if-no-files-found: error
          retention-days: 14
