name: Control Plane Targeted

on:
  push:
    branches:
      - integration/control-plane-option-b-20260815
    paths:
      - 'backend/app/api/v1/system.py'
      - 'backend/app/api/v1/platform.py'
      - 'backend/app/api/v1/route_registration.py'
      - 'backend/app/modules/system_admin/**'
      - 'backend/app/modules/platform/**'
      - 'backend/app/core/permissions.py'
      - 'backend/app/core/permission_catalog.py'
      - 'backend/app/core/effective_access.py'
      - 'backend/app/models/rbac.py'
      - 'backend/app/models/permission_governance.py'
      - 'backend/app/models/data_exchange.py'
      - 'backend/app/services/security_change_service.py'
      - 'backend/app/services/permission_bundle_service.py'
      - 'backend/app/services/identity_import_service.py'
      - 'backend/app/services/identity_import_scan_orchestrator.py'
      - 'backend/app/services/identity_import_staging_service.py'
      - 'backend/app/services/data_exchange_confirm_service.py'
      - 'backend/app/services/data_exchange_cleanup_service.py'
      - 'backend/alembic/versions/20260815_control_plane_*.py'
      - 'frontend/src/modules/system/**'
      - 'frontend/src/modules/platform/**'
      - 'shared/contracts/**'
      - 'scripts/check/check-control-plane-*.py'
      - 'scripts/check/check-permission-catalog.py'
      - 'backend/tests/test_control_plane_*'
      - 'backend/tests/test_permission_catalog_contract.py'
      - '.github/workflows/control-plane-targeted.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/app/api/v1/system.py'
      - 'backend/app/api/v1/platform.py'
      - 'backend/app/api/v1/route_registration.py'
      - 'backend/app/modules/system_admin/**'
      - 'backend/app/modules/platform/**'
      - 'backend/app/core/permissions.py'
      - 'backend/app/core/permission_catalog.py'
      - 'backend/app/core/effective_access.py'
      - 'backend/app/models/rbac.py'
      - 'backend/app/models/permission_governance.py'
      - 'backend/app/models/data_exchange.py'
      - 'backend/app/services/security_change_service.py'
      - 'backend/app/services/permission_bundle_service.py'
      - 'backend/app/services/identity_import_service.py'
      - 'backend/app/services/identity_import_scan_orchestrator.py'
      - 'backend/app/services/identity_import_staging_service.py'
      - 'backend/app/services/data_exchange_confirm_service.py'
      - 'backend/app/services/data_exchange_cleanup_service.py'
      - 'backend/alembic/versions/20260815_control_plane_*.py'
      - 'frontend/src/modules/system/**'
      - 'frontend/src/modules/platform/**'
      - 'shared/contracts/**'
      - 'scripts/check/check-control-plane-*.py'
      - 'scripts/check/check-permission-catalog.py'
      - 'backend/tests/test_control_plane_*'
      - 'backend/tests/test_permission_catalog_contract.py'
      - '.github/workflows/control-plane-targeted.yml'

permissions:
  contents: read

concurrency:
  group: control-plane-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact branch HEAD assertion
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EXPECTED="${{ github.event.pull_request.head.sha }}"
          else
            EXPECTED="${{ github.sha }}"
          fi
          echo "actual=$ACTUAL"
          echo "expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: S0 byte-identical move gate
        run: python scripts/check/check-control-plane-move.py
      - name: G0 inventory artifact
        run: python scripts/check/check-control-plane-g0.py --write artifacts/control-plane/g0.json
      - name: Permission Catalog reconciliation
        run: python scripts/check/check-permission-catalog.py --write artifacts/control-plane/permission-catalog.json
      - name: B0-I4 Python syntax gate
        run: |
          python -m compileall -q \
            backend/app/api/v1/route_registration.py \
            backend/app/modules/system_admin \
            backend/app/modules/platform \
            backend/app/core/permission_catalog.py \
            backend/app/core/effective_access.py \
            backend/app/models/data_exchange.py \
            backend/app/services/security_change_service.py \
            backend/app/services/permission_bundle_service.py \
            backend/app/services/identity_import_service.py \
            backend/app/services/identity_import_scan_orchestrator.py \
            backend/app/services/identity_import_staging_service.py \
            backend/app/services/data_exchange_confirm_service.py \
            backend/app/services/data_exchange_cleanup_service.py \
            backend/alembic/versions/20260815_control_plane_role_governance.py \
            backend/alembic/versions/20260815_control_plane_identity_staging.py
      - name: B1/B5 canonical schema source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          migration = Path('backend/alembic/versions/20260815_control_plane_role_governance.py').read_text(encoding='utf-8')
          model = Path('backend/app/models/permission_governance.py').read_text(encoding='utf-8')
          route = Path('backend/app/api/v1/route_registration.py').read_text(encoding='utf-8')
          required_migration = [
              '20260815_ctrl_role_gov', 't_role_template_permission',
              '_preaudit_custom_role_sources', 'uk_custom_role_source_role',
          ]
          required_model = [
              'class RoleTemplatePermission', 'role_id: Mapped[int]',
              'publish_status: Mapped[str]', 'previous_template_id: Mapped[int | None]',
          ]
          for token in required_migration:
              assert token in migration, token
          for token in required_model:
              assert token in model, token
          assert 'from app.modules.system_admin.routers import system_i4_router' in route
          assert 'from app.modules.platform.routers import platform_router' in route
          assert 't_role_template_v2' not in migration + model
          print('S0-06/B1/B5 source contract OK')
          PY
      - name: I3 normalized staging source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          model = Path('backend/app/models/data_exchange.py').read_text(encoding='utf-8')
          staging = Path('backend/app/services/identity_import_staging_service.py').read_text(encoding='utf-8')
          orchestrator = Path('backend/app/services/identity_import_scan_orchestrator.py').read_text(encoding='utf-8')
          migration = Path('backend/alembic/versions/20260815_control_plane_identity_staging.py').read_text(encoding='utf-8')
          assert 'class IdentityImportStagingRow' in model
          assert 'MAX_STAGING_ROWS = 20_000' in staging
          assert 'STAGING_CHUNK_SIZE = 500' in staging
          assert 'class StagingRowSequence' in staging
          assert '.limit(self.chunk_size)' in staging
          assert 'parse_identity_xlsx_path' not in orchestrator
          assert 'create_batch(' not in orchestrator
          assert 'stage_identity_xlsx(' in orchestrator
          assert 'down_revision = "20260815_ctrl_role_gov"' in migration
          print('I3 normalized staging source contract OK')
          PY
      - name: I4 identity confirm source contract
        working-directory: backend
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('tests/test_control_plane_identity_import_contract.py')
          for name, fn in sorted(ns.items()):
              if name.startswith('test_') and callable(fn):
                  fn()
          PY
      - name: B6/B7 frontend workspace contracts
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('backend/tests/test_control_plane_frontend_workspaces.py')
          for name, fn in sorted(ns.items()):
              if name.startswith('test_') and callable(fn):
                  fn()
          PY
      - name: I4 pre-I3 20K preflight contracts
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('backend/tests/test_control_plane_i4_preflight.py')
          for name, fn in sorted(ns.items()):
              if name.startswith('test_') and callable(fn):
                  fn()
          PY
      - name: Upload Control Plane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-contracts-${{ github.sha }}
          path: artifacts/control-plane/*.json
          if-no-files-found: error
          retention-days: 14
