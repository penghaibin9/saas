name: Academic C W2 Teacher Today Targeted

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/app/modules/academic_affairs/services/academic_affairs_teacher_today_service.py'
      - 'backend/app/modules/academic_affairs/services/mobile_academic_affairs_public_service.py'
      - 'backend/tests/test_aa_teacher_today_scopehead_contract.py'
      - 'backend/tests/test_aa_teacher_today_public_wiring_contract.py'
      - 'backend/tests/test_aa_teacher_today_visibility_contract.py'
      - '.github/workflows/academic-c-w2-teacher-today.yml'
  push:
    branches:
      - agent/academic-c-teaching-execution
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-c-w2-teacher-today-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teacher-today-targeted:
    name: C-W2 ScopeHead / calendar / attendance deep-link
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      JWT_SECRET: academic-c-w2-secret-at-least-32-bytes
      DB_ENABLED: 'true'
      MOCK_LOGIN_ENABLED: 'true'
      FAST_TEST_SCHEMA: '1'
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install cryptography

      - name: Compile Teacher Today projection
        working-directory: backend
        run: |
          python -m py_compile \
            app/modules/academic_affairs/services/academic_affairs_teacher_today_service.py \
            app/modules/academic_affairs/services/mobile_academic_affairs_public_service.py

      - name: Teacher Today exact contract on MySQL
        working-directory: backend
        run: |
          pytest -q \
            tests/test_aa_teacher_today_scopehead_contract.py \
            tests/test_aa_teacher_today_public_wiring_contract.py \
            tests/test_aa_teacher_today_visibility_contract.py \
            -p no:warnings --durations=20

      - name: Prove read projection reuses C-C1 truth
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('app/modules/academic_affairs/services/academic_affairs_teacher_today_service.py').read_text(encoding='utf-8')
          public = Path('app/modules/academic_affairs/services/mobile_academic_affairs_public_service.py').read_text(encoding='utf-8')
          required = [
              'formal_schedule_patterns_for_tasks',
              'attendanceExecutable',
              'attendanceRoute',
              'scheduleItemId',
              'calendarSource',
              'SWAP_SOURCE',
              'HOLIDAY',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit('Teacher Today contract drift: ' + ', '.join(missing))
          forbidden = [
              'lock_scope_head(',
              'create_batch(',
              'UnifiedTodo(',
              'AaAttendanceSession(',
          ]
          found = [value for value in forbidden if value in text]
          if found:
              raise SystemExit('Teacher Today created/rewrote Authority: ' + ', '.join(found))
          if 'teacher_today.teacher_today_projection(user)' not in public:
              raise SystemExit('mobile public teacher schedule is not wired to Teacher Today')
          print('C-W2 Teacher Today read-only contract=OK')
          PY
