name: Graduation defense Browser First audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/graduation-defense-browser-audit-pr.yml'
      - 'e2e/specs/graduation-final-browser-audit.spec.mjs'
      - 'e2e/specs/graduation-review-browser-audit.spec.mjs'
      - 'e2e/specs/graduation-defense-browser-audit.spec.mjs'
      - 'e2e/specs/graduation-grade-browser-audit.spec.mjs'
      - 'e2e/scripts/graduation-review-db-audit.py'
      - 'e2e/scripts/graduation-defense-db-audit.py'
      - 'e2e/scripts/graduation-grade-db-audit.py'
      - 'e2e/scripts/graduation-specialist-accounts.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graduation-defense-browser-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  defense-browser-audit:
    name: exact SHA final-review-defense-grade / Chromium / MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/12
      REDIS_KEY_PREFIX: graduation-defense-audit-20260823
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: graduation-defense-audit-only-not-production
      JWT_SECRET_KEY: graduation-defense-audit-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_EXPECTED_SHA: ba09b121576e6f025cf60b67d23570937d7af7fa

    steps:
      - name: Checkout product exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ba09b121576e6f025cf60b67d23570937d7af7fa
          fetch-depth: 0

      - name: Assert exact product HEAD
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "PRODUCT_EXACT_HEAD=$actual"
          test "$actual" = "ba09b121576e6f025cf60b67d23570937d7af7fa"

      - name: Checkout audit harness only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: audit-harness
          sparse-checkout: |
            e2e/specs/graduation-final-browser-audit.spec.mjs
            e2e/specs/graduation-review-browser-audit.spec.mjs
            e2e/specs/graduation-defense-browser-audit.spec.mjs
            e2e/specs/graduation-grade-browser-audit.spec.mjs
            e2e/scripts/graduation-review-db-audit.py
            e2e/scripts/graduation-defense-db-audit.py
            e2e/scripts/graduation-grade-db-audit.py
            e2e/scripts/graduation-specialist-accounts.py
          sparse-checkout-cone-mode: false

      - name: Inject only audit harness into exact product tree
        run: |
          set -euo pipefail
          cp audit-harness/e2e/specs/graduation-final-browser-audit.spec.mjs e2e/specs/
          cp audit-harness/e2e/specs/graduation-review-browser-audit.spec.mjs e2e/specs/
          cp audit-harness/e2e/specs/graduation-defense-browser-audit.spec.mjs e2e/specs/
          cp audit-harness/e2e/specs/graduation-grade-browser-audit.spec.mjs e2e/specs/
          mkdir -p e2e/scripts
          cp audit-harness/e2e/scripts/graduation-review-db-audit.py e2e/scripts/
          cp audit-harness/e2e/scripts/graduation-defense-db-audit.py e2e/scripts/
          cp audit-harness/e2e/scripts/graduation-grade-db-audit.py e2e/scripts/
          cp audit-harness/e2e/scripts/graduation-specialist-accounts.py e2e/scripts/
          rm -rf audit-harness
          grep -rl '63195a6dc9d25fa3805563910fb699ec163b552a' e2e/scripts | xargs -r sed -i 's/63195a6dc9d25fa3805563910fb699ec163b552a/ba09b121576e6f025cf60b67d23570937d7af7fa/g'
          test "$(git rev-parse HEAD)" = "ba09b121576e6f025cf60b67d23570937d7af7fa"
          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^e2e/' || true)"
          test -z "$bad"
          git status --short

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json

      - name: Install backend, migrate MySQL, seed IAM and tenants
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          alembic heads
          alembic upgrade head
          alembic current
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs e2e/test-results
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Bootstrap graduation accounts through real HTTP import
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py
          python ../e2e/scripts/graduation-specialist-accounts.py

      - name: Start staff PC
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend.pid

      - name: Start student PC
        env:
          VITE_BASE: /portal/
          VITE_API_BASE_URL: /
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd student-portal
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-portal.log 2>&1 &
          echo $! > ../e2e/runtime-logs/student-portal.pid

      - name: Wait for browser apps
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login; do
            ok=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              cat e2e/runtime-logs/*.log || true
              exit 1
            fi
          done

      - name: Apply isolated audit prefix and remove redundant same-role relogins
        run: |
          python - <<'PY'
          from pathlib import Path
          edits = {
            'e2e/lib/api-fixture.mjs': [
              ('`PW-E2E-${runId}`', '`E2E-AUDIT-20260823-${runId}`'),
              ('`Playwright 毕设交互测试 ${runId}`', '`E2E-AUDIT-20260823 毕设批次 ${runId}`'),
              ('`Playwright 交互测试课题 ${runId}`', '`E2E-AUDIT-20260823 课题 ${runId}`'),
            ],
            'e2e/pages/graduation.page.mjs': [
              ('`Playwright 背景 ${suffix}：验证真实浏览器交互和数据持久化。`', '`E2E-AUDIT-20260823 背景 ${suffix}：验证真实浏览器交互和数据持久化。`'),
              ('`Playwright 计划 ${suffix}：学生提交、导师审核、管理员复核。`', '`E2E-AUDIT-20260823 计划 ${suffix}：学生提交、导师审核、管理员复核。`'),
              ('`Playwright 成果 ${suffix}：保留完整证据链。`', '`E2E-AUDIT-20260823 成果 ${suffix}：保留完整证据链。`'),
            ],
            'e2e/specs/graduation-final-browser-audit.spec.mjs': [
              (
                "async function submitStudentFinal(page, fixture, marker) {\n  await new StudentLoginPage(page, config.studentBaseUrl).login(config.student)",
                "async function submitStudentFinal(page, fixture, marker, { login = true } = {}) {\n  if (login) await new StudentLoginPage(page, config.studentBaseUrl).login(config.student)",
              ),
              ('const second = await submitStudentFinal(page, fixture, \'draft-v2\')', 'const second = await submitStudentFinal(page, fixture, \'draft-v2\', { login: false })'),
              ('const finalSubmit = await submitStudentFinal(page, fixture, \'final-v1\')', 'const finalSubmit = await submitStudentFinal(page, fixture, \'final-v1\', { login: false })'),
            ],
          }
          for raw, replacements in edits.items():
            path = Path(raw)
            text = path.read_text(encoding='utf-8')
            for old, new in replacements:
              assert old in text, (raw, old)
              text = text.replace(old, new)
            path.write_text(text, encoding='utf-8')
          PY
          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^e2e/' || true)"
          test -z "$bad"

      - name: Install Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Real browser final + plagiarism prerequisite
        id: finalpw
        continue-on-error: true
        working-directory: e2e
        run: |
          set +e
          npx playwright test specs/graduation-final-browser-audit.spec.mjs
          rc=$?
          test -f test-results/junit.xml && cp test-results/junit.xml test-results/graduation-final-prerequisite-junit.xml
          exit $rc

      - name: Real browser independent review prerequisite
        id: reviewpw
        if: always()
        continue-on-error: true
        working-directory: e2e
        run: |
          set +e
          npx playwright test specs/graduation-review-browser-audit.spec.mjs
          rc=$?
          test -f test-results/junit.xml && cp test-results/junit.xml test-results/graduation-review-junit.xml
          exit $rc

      - name: Direct MySQL review prerequisite verification
        id: reviewdb
        if: always()
        continue-on-error: true
        working-directory: e2e
        run: python scripts/graduation-review-db-audit.py

      - name: Real browser defense grouping, scoring, confirmation and second defense
        id: defensepw
        if: always()
        continue-on-error: true
        working-directory: e2e
        run: |
          set +e
          npx playwright test specs/graduation-defense-browser-audit.spec.mjs
          rc=$?
          test -f test-results/junit.xml && cp test-results/junit.xml test-results/graduation-defense-junit.xml
          exit $rc

      - name: Direct MySQL defense and audit verification
        id: defensedb
        if: always()
        continue-on-error: true
        working-directory: e2e
        run: python scripts/graduation-defense-db-audit.py

      - name: Real browser grade calculation, review, publish, appeal and withdrawal
        id: gradepw
        if: always()
        continue-on-error: true
        working-directory: e2e
        run: |
          set +e
          npx playwright test specs/graduation-grade-browser-audit.spec.mjs
          rc=$?
          test -f test-results/junit.xml && cp test-results/junit.xml test-results/graduation-grade-junit.xml
          exit $rc

      - name: Direct MySQL grade and appeal audit verification
        id: gradedb
        if: always()
        continue-on-error: true
        working-directory: e2e
        run: python scripts/graduation-grade-db-audit.py

      - name: Enforce JUnit and direct MySQL evidence gates
        if: always()
        working-directory: e2e
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = [
              'graduation-final-prerequisite-junit.xml',
              'graduation-review-junit.xml',
              'graduation-defense-junit.xml',
              'graduation-grade-junit.xml',
          ]
          for name in files:
              path = Path('test-results') / name
              assert path.exists(), f'missing junit: {name}'
              root = ET.parse(path).getroot()
              tests = int(root.attrib.get('tests', 0))
              failures = int(root.attrib.get('failures', 0))
              errors = int(root.attrib.get('errors', 0))
              skipped = int(root.attrib.get('skipped', 0))
              print(name, {'tests': tests, 'failures': failures, 'errors': errors, 'skipped': skipped})
              assert tests > 0, name
              assert failures == 0 and errors == 0 and skipped == 0, name
          PY
          python scripts/graduation-review-db-audit.py
          python scripts/graduation-defense-db-audit.py
          python scripts/graduation-grade-db-audit.py

      - name: Upload defense and grade audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graduation-defense-browser-audit-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
