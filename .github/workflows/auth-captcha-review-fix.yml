name: Auth Captcha Review Hardening

on:
  push:
    branches: ["feat/adaptive-login-captcha-20260805"]
    paths:
      - ".github/workflows/auth-captcha-review-fix.yml"

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-login-captcha-20260805

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Apply second-review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {text.count(old)} for {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "backend/app/services/auth_challenge_service.py",
              '''def _is_strict_env() -> bool:\n    return settings.APP_ENV in {"production", "staging"} or settings.DEPLOYMENT_MODE == "production"\n''',
              '''def _is_strict_env() -> bool:\n    app_env = str(settings.APP_ENV or "").strip().lower()\n    deployment_mode = str(settings.DEPLOYMENT_MODE or "").strip().lower()\n    return app_env in {"production", "staging"} or deployment_mode in {"production", "staging"}\n''',
          )
          replace_once(
              "backend/app/services/auth_challenge_service.py",
              '''    login_name: str | None = None,\n    client_nonce: str | None = None,\n) -> None:\n''',
              '''    login_name: str | None = None,\n    client_nonce: str | None = None,\n    client_type: str | None = None,\n) -> None:\n''',
          )
          replace_once(
              "backend/app/services/auth_challenge_service.py",
              '''    expected_nonce = payload.get("nonce") or ""\n    if expected_nonce and not hmac.compare_digest(expected_nonce, _nonce_hash(client_nonce)):\n        raise AppException("CAPTCHA_INVALID", "验证码无效，请刷新后重试", details=details, http_status=401)\n    actual = _digest(f"answer\\n{captcha_id}\\n{str(captcha_code).strip()}")\n''',
              '''    expected_nonce = payload.get("nonce") or ""\n    if expected_nonce and not hmac.compare_digest(expected_nonce, _nonce_hash(client_nonce)):\n        raise AppException("CAPTCHA_INVALID", "验证码无效，请刷新后重试", details=details, http_status=401)\n    expected_client_type = str(payload.get("clientType") or "").strip().upper()\n    actual_client_type = str(client_type or "").strip().upper()\n    if expected_client_type and not hmac.compare_digest(expected_client_type, actual_client_type):\n        raise AppException("CAPTCHA_INVALID", "验证码无效，请刷新后重试", details=details, http_status=401)\n    actual = _digest(f"answer\\n{captcha_id}\\n{str(captcha_code).strip()}")\n''',
          )
          replace_once(
              "backend/app/services/auth_challenge_service.py",
              '''    captcha_code: str | None,\n    client_nonce: str | None,\n) -> None:\n''',
              '''    captcha_code: str | None,\n    client_nonce: str | None,\n    client_type: str | None = None,\n) -> None:\n''',
          )
          replace_once(
              "backend/app/services/auth_challenge_service.py",
              '''    verify_captcha(captcha_id, captcha_code, scene, tenant_code, login_name, client_nonce)\n''',
              '''    verify_captcha(captcha_id, captcha_code, scene, tenant_code, login_name, client_nonce, client_type)\n''',
          )

          replace_once(
              "backend/app/api/v1/auth.py",
              '''    captcha_svc.enforce_login_captcha(scene, body.tenantCode, body.loginName, body.captchaId,\n                                      body.captchaCode, body.clientNonce)\n''',
              '''    captcha_svc.enforce_login_captcha(scene, body.tenantCode, body.loginName, body.captchaId,\n                                      body.captchaCode, body.clientNonce, body.clientType)\n''',
          )
          replace_once(
              "backend/app/api/v1/auth.py",
              '''    clientNonce: str | None = Field(None, max_length=128)\n\n\n@router.post("/wx-bind", summary="微信绑定校园账号（首次；绑定后 openid 免密登录）")\n''',
              '''    clientNonce: str | None = Field(None, max_length=128)\n    clientType: str = Field("MP", max_length=40, description="STUDENT_MINI / TEACHER_MINI / MP")\n\n\n@router.post("/wx-bind", summary="微信绑定校园账号（首次；绑定后 openid 免密登录）")\n''',
          )
          replace_once(
              "backend/app/api/v1/auth.py",
              '''    captcha_svc.enforce_login_captcha(captcha_svc.WX_BIND, body.tenantCode, body.loginName,\n                                      body.captchaId, body.captchaCode, body.clientNonce)\n''',
              '''    captcha_svc.enforce_login_captcha(captcha_svc.WX_BIND, body.tenantCode, body.loginName,\n                                      body.captchaId, body.captchaCode, body.clientNonce, body.clientType)\n''',
          )

          replace_once(
              "miniapp/src/components/login/MiniLoginAuthPanel.vue",
              '''          password: this.bindForm.password,\n          captchaId: this.bindCaptcha.id || undefined, captchaCode: this.bindCaptcha.code || undefined, clientNonce: this.bindCaptcha.nonce\n''',
              '''          password: this.bindForm.password,\n          clientType: this.isTeacher ? 'TEACHER_MINI' : 'STUDENT_MINI',\n          captchaId: this.bindCaptcha.id || undefined, captchaCode: this.bindCaptcha.code || undefined, clientNonce: this.bindCaptcha.nonce\n''',
          )

          replace_once(
              "backend/app/services/auth_service_db.py",
              '''                raise AppException('CAPTCHA_REQUIRED', '账号、学校编码或密码不正确，请输入验证码后继续',\n                                   details={'captchaRequired': True, 'scene': 'PASSWORD_LOGIN'}, http_status=401)\n''',
              '''                captcha_scene = 'PLATFORM_LOGIN' if platform_client else 'PASSWORD_LOGIN'\n                raise AppException('CAPTCHA_REQUIRED', '账号、学校编码或密码不正确，请输入验证码后继续',\n                                   details={'captchaRequired': True, 'scene': captcha_scene}, http_status=401)\n''',
          )

          tests = Path("backend/tests/test_auth_challenge_service.py")
          text = tests.read_text(encoding="utf-8")
          marker = "\ndef test_guardian_verification_sms_login_is_permanently_disabled():\n"
          addition = '''\n\ndef test_captcha_is_bound_to_client_type():\n    data = svc.issue_captcha(svc.PASSWORD_LOGIN, "school", "teacher", "nonce", "PC")\n    with pytest.raises(AppException) as exc:\n        svc.verify_captcha(\n            data["captchaId"], data["devCode"], svc.PASSWORD_LOGIN,\n            "school", "teacher", "nonce", "TEACHER_MINI",\n        )\n    assert exc.value.code == "CAPTCHA_INVALID"\n\n'''
          if addition.strip() in text:
              raise SystemExit("client type regression test already exists")
          if marker not in text:
              raise SystemExit("guardian test marker not found")
          tests.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")

          fail_tests = Path("backend/tests/test_auth_captcha_redis_fail_closed.py")
          text = fail_tests.read_text(encoding="utf-8")
          addition = '''\n\ndef test_staging_deployment_mode_is_strict_even_when_app_env_is_development(monkeypatch):\n    monkeypatch.setattr(settings, "APP_ENV", "development")\n    monkeypatch.setattr(settings, "DEPLOYMENT_MODE", "staging")\n    monkeypatch.setattr(svc, "get_redis", lambda: None)\n\n    with pytest.raises(AppException) as exc:\n        svc.captcha_required(svc.PASSWORD_LOGIN, "school", "teacher")\n\n    assert exc.value.code == "AUTH_STORE_UNAVAILABLE"\n    assert exc.value.http_status == 503\n'''
          if addition.strip() in text:
              raise SystemExit("staging strict regression test already exists")
          fail_tests.write_text(text.rstrip() + addition + "\n", encoding="utf-8")

          e2e = Path("scripts/e2e/auth_login_redis_click.py")
          text = e2e.read_text(encoding="utf-8")
          replace = '''        page = browser.new_page(viewport={"width": 1440, "height": 1000})\n        try:\n'''
          replacement = '''        page = browser.new_page(viewport={"width": 1440, "height": 1000})\n        browser_errors: list[str] = []\n        api_failures: list[str] = []\n        page.on("pageerror", lambda error: browser_errors.append(str(error)))\n        page.on(\n            "console",\n            lambda message: browser_errors.append(f"console:{message.type}:{message.text}")\n            if message.type == "error" else None,\n        )\n        page.on(\n            "response",\n            lambda response: api_failures.append(f"{response.status} {response.request.method} {response.url}")\n            if "/api/" in response.url and response.status >= 500 else None,\n        )\n        try:\n'''
          if text.count(replace) != 1:
              raise SystemExit("E2E browser setup marker mismatch")
          text = text.replace(replace, replacement, 1)
          replace = '''            page.wait_for_url("**/workbench**", timeout=15_000)\n            token = page.evaluate("sessionStorage.getItem('gx_pc_token_v1') || ''")\n'''
          replacement = '''            page.wait_for_url("**/workbench**", timeout=15_000)\n            expect(page.get_by_text("正在加载工作台…", exact=True)).to_be_hidden(timeout=20_000)\n            expect(page.locator(".wb-v2")).to_be_visible(timeout=20_000)\n            expect(page.get_by_text("工作台数据暂时未能加载", exact=True)).to_have_count(0)\n            expect(page.get_by_text("无法加载工作台数据", exact=True)).to_have_count(0)\n            page.wait_for_timeout(1_000)\n            if api_failures:\n                raise AssertionError(f"登录后出现服务端 5xx：{api_failures!r}")\n            if browser_errors:\n                raise AssertionError(f"登录后出现浏览器错误：{browser_errors!r}")\n\n            token = page.evaluate("sessionStorage.getItem('gx_pc_token_v1') || ''")\n'''
          if text.count(replace) != 1:
              raise SystemExit("E2E workbench marker mismatch")
          text = text.replace(replace, replacement, 1)
          replace = '''                "tokenStored": True,\n                "screenshot": str(screenshot),\n'''
          replacement = '''                "tokenStored": True,\n                "workbenchReady": True,\n                "browserErrors": browser_errors,\n                "api5xx": api_failures,\n                "screenshot": str(screenshot),\n'''
          if text.count(replace) != 1:
              raise SystemExit("E2E result marker mismatch")
          e2e.write_text(text.replace(replace, replacement, 1), encoding="utf-8")

          workflow = Path(".github/workflows/auth-login-redis-e2e.yml")
          text = workflow.read_text(encoding="utf-8")
          needle = '      - "scripts/e2e/auth_login_redis_click.py"\n'
          addition = '      - "miniapp/src/components/login/MiniLoginAuthPanel.vue"\n'
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f"expected two workflow path markers, found {count}")
          workflow.write_text(text.replace(needle, needle + addition), encoding="utf-8")
          PY

      - name: Install and run focused checks
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd backend
          pytest tests/test_auth_challenge_service.py tests/test_auth_captcha_redis_fail_closed.py -q -p no:warnings
          cd ../miniapp
          npm ci
          npm run build:h5
          npm run build:mp-weixin
          cd ..
          git diff --check

      - name: Commit reviewed fixes and remove runner
        run: |
          rm .github/workflows/auth-captcha-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/services/auth_challenge_service.py \
            backend/app/api/v1/auth.py \
            backend/app/services/auth_service_db.py \
            backend/tests/test_auth_challenge_service.py \
            backend/tests/test_auth_captcha_redis_fail_closed.py \
            miniapp/src/components/login/MiniLoginAuthPanel.vue \
            scripts/e2e/auth_login_redis_click.py \
            .github/workflows/auth-login-redis-e2e.yml \
            .github/workflows/auth-captcha-review-fix.yml
          git diff --cached --check
          git commit -m "fix(auth): close captcha review gaps"
          git push origin HEAD:feat/adaptive-login-captcha-20260805
