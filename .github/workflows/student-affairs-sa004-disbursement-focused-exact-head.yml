name: Student Affairs SA-004 Disbursement Focused exact-head

on:
  workflow_dispatch:
  push:
    branches:
      - audit/student-affairs-v31-final-runner-20260827
    paths:
      - '.github/workflows/student-affairs-sa004-disbursement-focused-exact-head.yml'

permissions:
  contents: read

concurrency:
  group: student-affairs-sa004-disbursement-focused
  cancel-in-progress: true

env:
  CI: 'true'
  APP_ENV: test
  DEPLOYMENT_MODE: local
  DB_ENABLED: 'true'
  DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_sa004_disbursement?charset=utf8mb4
  TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_sa004_disbursement?charset=utf8mb4
  DB_HOST: 127.0.0.1
  DB_PORT: '3306'
  DB_USER: root
  DB_PASSWORD: e2e_root
  DB_NAME: student_lifecycle_sa004_disbursement
  JWT_SECRET: student-affairs-sa004-disbursement-focused-secret-at-least-32-bytes
  JWT_SECRET_KEY: student-affairs-sa004-disbursement-focused-secret-at-least-32-bytes
  PYTHONPATH: .
  SMS_ENABLED: 'false'
  SCHEDULER_MODE: external
  FAST_TEST_SCHEMA: '1'
  E2E_TARGET_SHA: c8e7f05d41bc28c379631b0b8daa3ef6302c7374

jobs:
  focused-disbursement:
    name: SA-004 disbursement / retry / XLSX focused contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_sa004_disbursement
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout immutable runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: runner
          fetch-depth: 1

      - name: Checkout immutable product exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.E2E_TARGET_SHA }}
          path: app
          fetch-depth: 1

      - name: Assert immutable exact heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"
          test "$(git -C runner rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C app status --porcelain)"
          echo "product_exact_head=$E2E_TARGET_SHA"
          echo "runner_exact_head=$GITHUB_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install backend and migrate real MySQL
        working-directory: app/backend
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade head
          alembic current

      - name: Run only affected SA-004 disbursement contract
        working-directory: app/backend
        shell: bash
        env:
          MOCK_LOGIN_ENABLED: 'false'
        run: |
          set -euo pipefail
          mkdir -p test-results
          pytest -q -p no:warnings --durations=20 \
            tests/test_affairs_funding_disbursement.py::test_disbursement_full_flow \
            --junitxml=test-results/sa004-disbursement.xml \
            2>&1 | tee test-results/sa004-disbursement.log

      - name: Reassert immutable product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"
          test "$(git -C runner rev-parse HEAD)" = "$GITHUB_SHA"
          git -C app diff --exit-code
          git -C app diff --cached --exit-code

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-affairs-sa004-disbursement-focused-${{ env.E2E_TARGET_SHA }}-${{ github.run_id }}
          path: |
            app/backend/test-results/sa004-disbursement.xml
            app/backend/test-results/sa004-disbursement.log
          if-no-files-found: warn
          retention-days: 7
