name: Backup restore drill

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/backup/**'
      - 'deploy/systemd/school-lifecycle-backup.*'
      - 'deploy/env/backup.env.example'
      - '.github/workflows/backup-restore-drill.yml'
  schedule:
    # Weekly isolated restore proof; never connects to production.
    - cron: '45 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-drill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  restore-drill:
    name: Verified backup -> offsite readback -> isolated MySQL -> readiness/login/isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: backup_source
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      APP_ENV: test
      DEPLOYMENT_MODE: local
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: backup_source
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/backup_source?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/backup_source?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/13
      REDIS_KEY_PREFIX: backup-restore-drill
      JWT_SECRET: backup-restore-drill-secret-at-least-32-bytes
      MOCK_LOGIN_ENABLED: 'false'
      INTERNAL_OPS_TOKEN: backup-restore-drill-ops-token-20260807
      SCHEDULER_MODE: external
      BACKUP_DIR: /tmp/school-lifecycle-backup-drill
      KEEP_DAYS: '2'
      UPLOAD_DIR: /tmp/school-lifecycle-upload-drill
      REQUIRE_UPLOAD_BACKUP: '1'
      BACKUP_REQUIRE_OFFSITE: 'true'
      BACKUP_RCLONE_REMOTE: /tmp/school-lifecycle-offsite-drill
      # Local filesystem remote is a CI transport fixture, not a claim of cloud immutability.
      BACKUP_REQUIRE_IMMUTABLE_REMOTE: 'false'
      MAX_BACKUP_AGE_SECONDS: '3600'
      MAX_RESTORE_SECONDS: '900'
      REQUIRED_RESTORE_TABLES: alembic_version,t_tenant,t_import_job,t_export_job
      MIN_RESTORE_INDEXES: '10'
      MIN_RESTORE_FOREIGN_KEYS: '1'
      RESTORE_EVIDENCE_FILE: /tmp/restore-drill-evidence.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install MySQL client, rclone and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client rclone
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Validate backup shell syntax
        run: |
          bash -n deploy/backup/backup-mysql.sh
          bash -n deploy/backup/backup-runner.sh
          bash -n deploy/backup/restore-drill.sh
      - name: Build source database through the real migration chain
        working-directory: backend
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"
          alembic upgrade head
          alembic current
          python scripts/_seed_login_accounts_only.py
          EXPECTED="$(mysql -h 127.0.0.1 -uroot -proot -Nse 'SELECT version_num FROM backup_source.alembic_version LIMIT 1')"
          test -n "$EXPECTED"
          echo "EXPECTED_ALEMBIC_VERSION=$EXPECTED" >> "$GITHUB_ENV"
      - name: Prove required upload backup fails closed
        run: |
          set -euo pipefail
          rm -rf /tmp/required-upload-missing "$BACKUP_DIR"
          if UPLOAD_DIR=/tmp/required-upload-missing REQUIRE_UPLOAD_BACKUP=1 bash deploy/backup/backup-mysql.sh; then
            echo '::error::database backup unexpectedly succeeded while required uploads were missing'
            exit 1
          fi
          rm -rf "$BACKUP_DIR"
          echo 'Fail-closed upload contract verified.'
      - name: Prove production runner rejects local-only success
        run: |
          set -euo pipefail
          mkdir -p "$UPLOAD_DIR"
          printf 'restore-drill-upload-sentinel\n' > "$UPLOAD_DIR/sentinel.txt"
          if BACKUP_RCLONE_REMOTE= bash deploy/backup/backup-runner.sh; then
            echo '::error::backup runner unexpectedly succeeded without an offsite destination'
            exit 1
          fi
          echo 'Fail-closed offsite contract verified.'
      - name: Produce and verify local plus offsite backup with production scripts
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR" "$BACKUP_RCLONE_REMOTE"
          mkdir -p "$BACKUP_DIR" "$BACKUP_RCLONE_REMOTE" "$UPLOAD_DIR"
          test -f "$UPLOAD_DIR/sentinel.txt"
          bash deploy/backup/backup-runner.sh
          BACKUP_FILE="$(find "$BACKUP_DIR" -maxdepth 1 -type f -name 'db_backup_source_*.sql.gz' | sort | tail -n1)"
          UPLOAD_FILE="$(find "$BACKUP_DIR" -maxdepth 1 -type f -name 'uploads_*.tar.gz' | sort | tail -n1)"
          test -n "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          test -f "${BACKUP_FILE}.sha256"
          test -n "$UPLOAD_FILE"
          test -s "$UPLOAD_FILE"
          test -f "${UPLOAD_FILE}.sha256"
          OFFSITE_FILE="$BACKUP_RCLONE_REMOTE/$(basename "$BACKUP_FILE")"
          OFFSITE_UPLOAD="$BACKUP_RCLONE_REMOTE/$(basename "$UPLOAD_FILE")"
          test -s "$OFFSITE_FILE"
          test -f "${OFFSITE_FILE}.sha256"
          test -s "$OFFSITE_UPLOAD"
          test -f "${OFFSITE_UPLOAD}.sha256"
          cmp -s "$BACKUP_FILE" "$OFFSITE_FILE"
          cmp -s "${BACKUP_FILE}.sha256" "${OFFSITE_FILE}.sha256"
          cmp -s "$UPLOAD_FILE" "$OFFSITE_UPLOAD"
          cmp -s "${UPLOAD_FILE}.sha256" "${OFFSITE_UPLOAD}.sha256"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          echo "OFFSITE_FILE=$OFFSITE_FILE" >> "$GITHUB_ENV"
      - name: Restore only into a disposable local drill database
        run: bash deploy/backup/restore-drill.sh "$BACKUP_FILE" backup_restore_drill
      - name: Verify Alembic state on restored database
        working-directory: backend
        env:
          DB_NAME: backup_restore_drill
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/backup_restore_drill?charset=utf8mb4
          TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/backup_restore_drill?charset=utf8mb4
        run: |
          alembic current
          test "$(mysql -h 127.0.0.1 -uroot -proot -Nse 'SELECT version_num FROM backup_restore_drill.alembic_version LIMIT 1')" = "$EXPECTED_ALEMBIC_VERSION"
      - name: Start backend from restored database
        env:
          DB_NAME: backup_restore_drill
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/backup_restore_drill?charset=utf8mb4
          TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/backup_restore_drill?charset=utf8mb4
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/restore-drill-backend.log 2>&1 &
          echo $! > /tmp/restore-drill-backend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/restore-drill-backend.log
          exit 1
      - name: Verify readiness, real login and tenant isolation after restore
        run: |
          curl -fsS -H "X-Ops-Token: $INTERNAL_OPS_TOKEN" http://127.0.0.1:8000/health/ready > /tmp/ready.json
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          def post(payload):
              req = urllib.request.Request(
                  'http://127.0.0.1:8000/api/v1/auth/login',
                  data=json.dumps(payload).encode(),
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=10) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  try:
                      payload = json.loads(body)
                  except json.JSONDecodeError:
                      payload = {'raw': body}
                  return exc.code, payload

          status, good = post({
              'tenantCode': 'demo-school', 'loginName': 'admin', 'password': '123456', 'clientType': 'PC'
          })
          assert status == 200 and good.get('code') == 0, (status, good)

          bad_status, bad = post({
              'tenantCode': 'sandbox-school', 'loginName': 'admin', 'password': '123456', 'clientType': 'PC'
          })
          assert bad_status >= 400 or bad.get('code') != 0, (bad_status, bad)
          print('restore_login=ok cross_tenant_login=blocked')
          PY
      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backup-restore-drill-${{ github.run_id }}
          path: |
            /tmp/ready.json
            /tmp/restore-drill-evidence.txt
            /tmp/restore-drill-backend.log
            /tmp/school-lifecycle-backup-drill/*.sha256
            /tmp/school-lifecycle-offsite-drill/*.sha256
          if-no-files-found: warn
          retention-days: 14
