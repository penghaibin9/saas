name: Academic file exchange center

on:
  pull_request:
    paths:
      - 'backend/app/modules/academic_affairs/routers/academic_file_exchange_router.py'
      - 'backend/app/modules/academic_affairs/routers/academic_export_compat_router.py'
      - 'backend/app/modules/academic_affairs/routers/academic_affairs_bundle.py'
      - 'backend/app/modules/academic_affairs/services/academic_file_exchange_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_export_compat_service.py'
      - 'backend/app/services/data_exchange_confirm_service.py'
      - 'backend/tests/test_academic_file_exchange_center.py'
      - 'backend/tests/test_academic_export_compat.py'
      - 'frontend/src/modules/academicAffairs/api/academic-file-exchange.api.js'
      - 'frontend/src/modules/academicAffairs/views/AaRosterImportExportView.vue'
      - 'docs/architecture/file-capability-inventory.d/07-academic-file-exchange.yaml'
      - '.github/workflows/academic-file-exchange-center.yml'
  push:
    branches:
      - audit/file-capability-inventory
    paths:
      - 'backend/app/modules/academic_affairs/routers/academic_file_exchange_router.py'
      - 'backend/app/modules/academic_affairs/routers/academic_export_compat_router.py'
      - 'backend/app/modules/academic_affairs/routers/academic_affairs_bundle.py'
      - 'backend/app/modules/academic_affairs/services/academic_file_exchange_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_export_compat_service.py'
      - 'backend/app/services/data_exchange_confirm_service.py'
      - 'backend/tests/test_academic_file_exchange_center.py'
      - 'backend/tests/test_academic_export_compat.py'
      - 'frontend/src/modules/academicAffairs/api/academic-file-exchange.api.js'
      - 'frontend/src/modules/academicAffairs/views/AaRosterImportExportView.vue'
      - 'docs/architecture/file-capability-inventory.d/07-academic-file-exchange.yaml'
      - '.github/workflows/academic-file-exchange-center.yml'

concurrency:
  group: academic-file-exchange-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-authoritative-jobs:
    name: MySQL 权威导入 + 全域导出任务生命周期 + PC 合同
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      APP_ENV: test
      SECRET_KEY: stage7-academic-file-exchange-ci-secret
      FILE_SCAN_ENABLED: 'false'
      FILE_SCAN_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify Alembic single head and upgrade MySQL
        working-directory: backend
        run: |
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
      - name: Compile stage 7 backend
        working-directory: backend
        run: |
          python -m py_compile \
            app/modules/academic_affairs/routers/academic_file_exchange_router.py \
            app/modules/academic_affairs/routers/academic_export_compat_router.py \
            app/modules/academic_affairs/routers/academic_affairs_bundle.py \
            app/modules/academic_affairs/services/academic_file_exchange_service.py \
            app/modules/academic_affairs/services/academic_export_compat_service.py \
            app/services/data_exchange_confirm_service.py
      - name: Authoritative job contract tests
        working-directory: backend
        run: >-
          pytest tests/test_academic_file_exchange_center.py
          tests/test_academic_export_compat.py
          tests/test_data_exchange_job_center.py
          -q -p no:warnings
      - name: Teacher PC lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Freeze authority, task backing and compatibility order
        run: |
          grep -q 'ConfigDict(extra="forbid")' backend/app/modules/academic_affairs/routers/academic_file_exchange_router.py
          grep -q 'authority.*SOURCE_FILE_OBJECT' backend/app/modules/academic_affairs/services/academic_file_exchange_service.py
          grep -q 'rowDigest' backend/app/modules/academic_affairs/services/academic_file_exchange_service.py
          ! grep -n 'source_snapshot_json={[^}]*"rows"' backend/app/modules/academic_affairs/services/academic_file_exchange_service.py
          grep -q 'ExportJob(' backend/app/modules/academic_affairs/services/academic_file_exchange_service.py
          grep -q 'ExportJob(' backend/app/modules/academic_affairs/services/academic_export_compat_service.py
          grep -q 'X-Export-Job-Id' backend/app/modules/academic_affairs/services/academic_export_compat_service.py
          grep -q 'compat_module.router' backend/app/modules/academic_affairs/routers/academic_affairs_bundle.py
          grep -q 'ACADEMIC_ARCHIVE_ALL' backend/app/modules/academic_affairs/routers/academic_export_compat_router.py
          grep -q 'confirmImport(' frontend/src/modules/academicAffairs/views/AaRosterImportExportView.vue
          grep -q 'this.currentImportJob.id' frontend/src/modules/academicAffairs/views/AaRosterImportExportView.vue
          grep -q 'this.currentImportJob.version' frontend/src/modules/academicAffairs/views/AaRosterImportExportView.vue
          ! grep -q 'rosterImportConfirm(rows)' frontend/src/modules/academicAffairs/views/AaRosterImportExportView.vue
          ! grep -q 'URL.createObjectURL(res.data)' frontend/src/modules/academicAffairs/views/AaRosterImportExportView.vue
