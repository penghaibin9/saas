name: PR264 final contract repair verification
on:
  push:
    branches: [codex/academic-affairs-delivery-20260907]
    paths: [.github/workflows/pr264-final-contract-repair.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'penghaibin9/saas' && github.ref == 'refs/heads/codex/academic-affairs-delivery-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.patch.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare reviewed patch objects without advancing a branch
        id: patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, ast, json, os, urllib.request
          R = Path.cwd()
          expected = {
              'backend/tests/test_org_master_governance.py': '8bbbe177ae64c7e4b181ba098472b650fb072733',
              'backend/app/modules/academic_affairs/services/academic_affairs_org_service.py': 'f7f8bfaddbdcf5dc7468dca4be3a2c3b573c514c',
              'backend/app/modules/academic_affairs/services/academic_affairs_org_adjustment_storage.py': '5c95f2807ae8f5c84e4ee55d57ba5233df91b7ee',
              'backend/tests/test_aa_org_adjustment_expand_contract.py': '31f16dfcc7fd62ebd13d5c66c05d815d46accc6d',
          }
          def git(*args): return subprocess.check_output(['git', *args]).decode().strip()
          assert git('rev-parse', 'HEAD^') == '260052df61baf54cb85c857087431190aed0d012'
          for name, sha in expected.items(): assert git('hash-object', name) == sha, name
          p=R/'backend/app/modules/academic_affairs/services/academic_affairs_org_adjustment_storage.py'
          s=p.read_text();anchor='def scope_json(row) -> str:\n'
          new='''def legacy_scope_projection(source_ids: list[int], college_by_class: dict[int, int]) -> str:
              """Preserve every involved college in the N-1 read-authorization projection.
          
              V2 states prohibit N-1 writes, but N-1 list visibility still reads this column.
              An empty or truncated-college projection would broaden that visibility. Keep
              one real source class per college, or reject an unrepresentable request.
              """
              raw = json.dumps(source_ids)
              if not source_ids:
                  raise AppException("VALIDATION_ERROR", "来源班级至少选择1个")
              if len(raw) <= 500:
                  return raw
              representatives: dict[int, int] = {}
              for class_id in source_ids:
                  college_id = college_by_class.get(class_id)
                  if college_id is None:
                      raise AppException("DATA_CONFLICT", "调整范围缺少学院归属，请重新核对", http_status=409)
                  representatives.setdefault(college_id, class_id)
              projection = json.dumps(list(representatives.values()))
              if len(projection) > 500:
                  raise AppException(
                      "VALIDATION_ERROR", "本次调整涉及学院过多，请按学院分批办理",
                      details={"reason": "LEGACY_SCOPE_PROJECTION_TOO_LARGE", "recoveryAction": "SPLIT_BY_COLLEGE"},
                  )
              return projection
          
          
          '''
          assert s.count(anchor)==1;p.write_text(s.replace(anchor,new+anchor))
          p=R/'backend/app/modules/academic_affairs/services/academic_affairs_org_service.py';s=p.read_text()
          s=s.replace('    read_check as _read_adjustment_check,\n','    read_check as _read_adjustment_check,\n    legacy_scope_projection as _legacy_adjustment_scope,\n')
          a=s.index('def create_class_adjustment(');b=s.index('\ndef _require_adjustment_version(',a);section=s[a:b]
          for old,new in [
           ('        colleges: set[int] = set()\n','        colleges: set[int] = set()\n        class_colleges: dict[int, int] = {}\n'),
           ('            colleges.add(cg)\n','            colleges.add(cg)\n            class_colleges[cid] = cg\n'),
           ('from_class_ids="[]" if expanded else source_json,','from_class_ids=_legacy_adjustment_scope(from_ids, class_colleges),')]:
              assert section.count(old)==1,old;section=section.replace(old,new)
          s=s[:a]+section+s[b:];p.write_text(s)
          p=R/'backend/tests/test_org_master_governance.py';s=p.read_text();a=s.index('    src = (',s.index('def test_academic_org_service_uses_org_master'));b=s.index('\n\ndef test_mysql_college_major_class_via_org_master',a)
          s=s[:a]+'''    import ast
              for writer in (svc.create_college, svc.update_college, svc.create_major,
                             svc.update_major, svc.create_class, svc.update_class):
                  src = inspect.getsource(writer)
                  tree = ast.parse(src)
                  calls = [node for node in ast.walk(tree) if isinstance(node, ast.Call)]
                  names = [ast.unparse(node.func) for node in calls]
                  assert "org_master_service" in src, writer.__name__
                  assert names.count("apply_org_node_in_session") == 1, writer.__name__
                  assert "save_org_node" not in names, "an independently committing writer breaks atomicity"
                  assert names.count("db.commit") == 1, writer.__name__
                  apply = next(node for node in calls if ast.unparse(node.func) == "apply_org_node_in_session")
                  assert apply.args and ast.unparse(apply.args[0]) == "db"
                  assert not any(kw.arg == "commit" and ast.unparse(kw.value) != "False" for kw in apply.keywords)
          ''' +s[b:]
          old='''    conflict = client.put(
                  f"{AA_ORGS}/colleges/{col_id}",'''
          new='''    # A negative expectedVersion tests schema validation, not optimistic locking.
              # Advance through a valid writer, then replay the earlier nonnegative version.
              advanced = client.put(
                  f"{AA_ORGS}/colleges/{col_id}", headers=hdr,
                  json={"collegeName": "已更新的父级学院", "code": "GOV_COL_DIS", "expectedVersion": ver},
              )
              assert advanced.status_code == 200, advanced.text
              current_version = advanced.json()["data"]["version"]
              assert current_version > ver
          
              conflict = client.put(
                  f"{AA_ORGS}/colleges/{col_id}",'''
          assert s.count(old)==1;s=s.replace(old,new).replace('"expectedVersion": ver - 1 if ver > 0 else -1,','"expectedVersion": ver,')
          old='''    assert conflict.status_code in (400, 409, 422)
              msg = conflict.json().get("message") or conflict.text
              assert any(x in msg for x in ("冲突", "修改", "刷新", "version", "Version"))'''
          new='''    assert conflict.status_code == 409, conflict.text
              result = conflict.json()
              assert result["bizCode"] == "DATA_CONFLICT"
              assert result["details"]["reason"] == "VERSION_CONFLICT"
              assert result["details"]["expectedVersion"] == ver
              assert result["details"]["currentVersion"] == current_version
              assert result["details"]["recoveryAction"] == "REFRESH_AND_REVIEW"
              with get_sessionmaker()() as db:
                  persisted = db.get(College, col_id)
                  assert persisted.college_name == "已更新的父级学院"
                  assert persisted.version == current_version'''
          assert s.count(old)==1;s=s.replace(old,new)
          s += '''
          
          
          def test_mysql_class_creation_rolls_back_when_security_audit_fails(client, db_mode, monkeypatch):
              """A late security-audit failure must not leave either a class or its domain audit."""
              from sqlalchemy import func, select
              from app.core.exceptions import AppException
              from app.db.session import get_sessionmaker
              from app.models import AffairsAuditTrail, SchoolClass
              from app.services import db_service
              from test_aa_orgs_tier1_r2 import _seed_scoped
          
              ids = _seed_scoped(db_mode)
              hdr = _hdr(client)
              with get_sessionmaker()() as db:
                  before = db.scalar(select(func.count()).select_from(AffairsAuditTrail).where(
                      AffairsAuditTrail.tenant_id == TID, AffairsAuditTrail.biz_type == "AA_ORG_CLASS"))
              original = db_service.audit_insert_in_session
          
              def fail_class_audit(db, action, resource, *args, **kwargs):
                  if action == "ORG_NODE_SAVE" and str(resource).startswith("CLASS:"):
                      raise AppException("DATA_CONFLICT", "验收注入：安全审计不可写")
                  return original(db, action, resource, *args, **kwargs)
          
              monkeypatch.setattr(db_service, "audit_insert_in_session", fail_class_audit)
              response = client.post(f"{AA_ORGS}/classes", headers=hdr, json={
                  "majorId": str(ids["majSw"]), "className": "事务回滚验收班", "classCode": "GOV_ATOMIC_CLS",
              })
              assert response.status_code == 409, response.text
              with get_sessionmaker()() as db:
                  assert db.scalar(select(func.count()).select_from(SchoolClass).where(
                      SchoolClass.tenant_id == TID, SchoolClass.class_code == "GOV_ATOMIC_CLS")) == 0
                  after = db.scalar(select(func.count()).select_from(AffairsAuditTrail).where(
                      AffairsAuditTrail.tenant_id == TID, AffairsAuditTrail.biz_type == "AA_ORG_CLASS"))
                  assert after == before
          '''
          p.write_text(s)
          p=R/'backend/tests/test_aa_org_adjustment_expand_contract.py';s=p.read_text()
          s=s.replace('        assert len(persisted.from_class_ids) <= 500\n','        assert len(persisted.from_class_ids) <= 500\n        assert json.loads(persisted.from_class_ids) == [sources[0]]\n')
          s+='''
          
          
          def test_legacy_scope_projection_covers_every_involved_college():
              sources = [900000000000006000 + index for index in range(40)]
              colleges = {cid: 100 + index % 3 for index, cid in enumerate(sources)}
              projection = storage.legacy_scope_projection(sources, colleges)
              representatives = json.loads(projection)
              assert len(projection) <= 500 and representatives
              assert set(representatives).issubset(sources)
              assert {colleges[cid] for cid in representatives} == set(colleges.values())
          
          
          def test_legacy_scope_projection_rejects_unrepresentable_scope_instead_of_dropping_colleges():
              sources = [900000000000007000 + index for index in range(40)]
              with pytest.raises(AppException) as error:
                  storage.legacy_scope_projection(sources, {cid: index + 1 for index, cid in enumerate(sources)})
              assert error.value.details["reason"] == "LEGACY_SCOPE_PROJECTION_TOO_LARGE"
          
          
          def test_expanded_request_preserves_college_visibility_in_n_and_n_minus_one(client, db_mode):
              from sqlalchemy import select
              from app.db.session import get_sessionmaker
              from app.models import AaClassAdjustmentRequest, Major, SchoolClass
              from test_aa_org_adjustment_roundtrip import _create
              from test_aa_orgs import BASE, TID, _hdr
              from test_aa_orgs_tier1_r2 import _seed_scoped
          
              ids = _seed_scoped(db_mode)
              admin = _hdr(client, 'school_admin01')
              sources = [900000000000008000 + index for index in range(30)]
              with get_sessionmaker()() as db:
                  db.add_all([SchoolClass(id=cid, tenant_id=TID,
                      major_id=ids['majSw'] if index % 2 else ids['majWl'],
                      class_name=f'跨学院兼容验收{index}', class_status='NORMAL', status='ACTIVE')
                      for index, cid in enumerate(sources)])
                  db.commit()
              created = _create(client, admin, sources)
              assert len(created['fromClassIds']) == 30
              with get_sessionmaker()() as db:
                  persisted = db.scalar(select(AaClassAdjustmentRequest).where(
                      AaClassAdjustmentRequest.tenant_id == TID,
                      AaClassAdjustmentRequest.id == int(created['id'])))
                  assert persisted.status == 'V2_DRAFT'  # N-1 cannot precheck/execute/cancel.
                  legacy_ids = json.loads(persisted.from_class_ids)
                  legacy_colleges = set(db.scalars(select(Major.college_id).join(
                      SchoolClass, SchoolClass.major_id == Major.id).where(
                      SchoolClass.tenant_id == TID, Major.tenant_id == TID,
                      SchoolClass.id.in_(legacy_ids))).all())
                  # Exact N-1 visibility predicate at main b9ef56f: reject nonempty colleges
                  # outside the caller's allowed set. An empty projection would fail open.
                  assert legacy_colleges == {ids['colSw'], ids['colWl']}
                  assert legacy_colleges and not legacy_colleges.issubset({ids['colSw']})
              college = _hdr(client, 'college_admin01')
              visible = client.get(f'{BASE}/class-adjustment-requests', headers=college)
              assert visible.status_code == 200, visible.text
              assert created['id'] not in {item['id'] for item in visible.json()['data']['items']}
          '''
          p.write_text(s)
          target = {
              'backend/tests/test_org_master_governance.py': 'fbfab973ddcd6ffb8b8e3bc9683edd9536084467',
              'backend/tests/test_aa_org_adjustment_expand_contract.py': 'b60fea8c83a223fe6f8a9d7092f1569ade766a16',
              'backend/app/modules/academic_affairs/services/academic_affairs_org_service.py': 'c032de29856bc0066ebb97d72787f33e598cfbba',
              'backend/app/modules/academic_affairs/services/academic_affairs_org_adjustment_storage.py': '27de3e3df9304bf87e67890885401f0d018139d5',
          }
          for name, sha in target.items():
              ast.parse((R/name).read_text(), filename=name)
              assert git('hash-object', name) == sha, (name, git('hash-object', name), sha)
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/penghaibin9/saas'+path,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={'Accept':'application/vnd.github+json','Content-Type':'application/json'},
                  method='POST' if data is not None else 'GET')
              request.add_unredirected_header('Authorization', 'Bearer '+os.environ['GH_TOKEN'])
              with urllib.request.urlopen(request, timeout=120) as response: return json.load(response)
          parent = os.environ['GITHUB_SHA']
          assert api('/git/ref/heads/codex/academic-affairs-delivery-20260907')['object']['sha'] == parent
          entries = [{'path':name,'mode':'100644','type':'blob','content':(R/name).read_text()} for name in target]
          entries.append({'path':'.github/workflows/pr264-final-contract-repair.yml','mode':'100644','type':'blob','sha':None})
          tree = api('/git/trees', {'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})
          commit = api('/git/commits', {'message':'fix(academic): prove atomic writer conflicts and preserve N-1 college read scope', 'tree':tree['sha'], 'parents':[parent]})
          print(json.dumps({'candidate':commit['sha'],'tree':tree['sha'],'parent':parent,'branchUpdated':False},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('candidate='+commit['sha']+'\n')
          PY
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: academic_test_only
          MYSQL_DATABASE: student_lifecycle_academic_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pacademic_test_only" --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      APP_ENV: test
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:academic_test_only@127.0.0.1:3306/student_lifecycle_academic_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:academic_test_only@127.0.0.1:3306/student_lifecycle_academic_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      SCHEDULER_MODE: external
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Execute unchanged permanent MySQL gate commands on the exact candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          workflow = yaml.safe_load(Path('.github/workflows/academic-authority-regression.yml').read_text())
          names = ['Require one migration head and upgrade fresh MySQL',
                   'Verify additive columns on migrated schema before test fixtures reset data',
                   'Run real MySQL organization and term regressions (ORM-reset fixtures)']
          steps = workflow['jobs']['mysql-regressions']['steps']
          for name in names:
              script = next(step['run'] for step in steps if step.get('name') == name)
              print('::group::'+name, flush=True)
              subprocess.run(script, shell=True, executable='/bin/bash', check=True)
              print('::endgroup::', flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: academic-final-contract-${{ github.run_id }}
          path: /tmp/academic-regression/
          retention-days: 7
          if-no-files-found: warn
