name: Graduation material closeout repair once

on:
  push:
    branches:
      - fix/graduation-material-closeout-p0-review

permissions:
  contents: write

concurrency:
  group: graduation-material-closeout-repair-once
  cancel-in-progress: false

jobs:
  repair-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graduation-material-closeout-p0-review
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Apply reviewed patch robustly
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy

          patch = Path('scripts/apply_graduation_archived_rule_closeout.py')
          text = patch.read_text(encoding='utf-8')
          text = text.replace(
              'if text.count(old_filter) != 2:\n    raise SystemExit(f"{command}: expected two active-student filters, got {text.count(old_filter)}")',
              'if text.count(old_filter) not in (1, 2):\n    raise SystemExit(f"{command}: expected active-student filters, got {text.count(old_filter)}")',
          )
          patch.write_text(text, encoding='utf-8')
          runpy.run_path(str(patch), run_name='__main__')

          command = Path('backend/app/modules/graduation/materials/command_service.py')
          source = command.read_text(encoding='utf-8')
          compact = '        GraduationStudent.record_status == "ACTIVE", GraduationStudent.is_deleted.is_(False),\n'
          expanded = (
              '        GraduationStudent.record_status == "ACTIVE",\n'
              '        func.coalesce(GraduationStudent.stage, "") != "ARCHIVED",\n'
              '        GraduationStudent.is_deleted.is_(False),\n'
          )
          source = source.replace(compact, expanded)
          if source.count('func.coalesce(GraduationStudent.stage, "") != "ARCHIVED"') != 2:
              raise SystemExit('command_service.py: archived batch/repair exclusion invariant not satisfied')
          command.write_text(source, encoding='utf-8')
          PY

      - name: Remove construction-only files
        run: |
          rm -f scripts/apply_graduation_archived_rule_closeout.py
          rm -f .github/workflows/graduation-material-closeout-apply-once.yml
          rm -f .github/workflows/graduation-material-closeout-repair-once.yml

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Validate syntax and real MySQL regressions
        working-directory: backend
        run: |
          git diff --check
          python -m compileall -q \
            app/modules/graduation/materials/definitions.py \
            app/modules/graduation/materials/rule_service.py \
            app/modules/graduation/materials/command_service.py \
            app/modules/graduation/materials/query_service.py \
            tests/test_graduation_material_archived_rule_resolution.py
          pytest \
            tests/test_graduation_material_archived_rule_resolution.py \
            tests/test_graduation_material_closeout_regressions.py \
            tests/test_graduation_material_rule_archive_invariants.py \
            tests/test_graduation_material_center_phase6.py \
            -q -p no:warnings

      - name: Commit validated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/modules/graduation/materials/definitions.py \
            backend/app/modules/graduation/materials/rule_service.py \
            backend/app/modules/graduation/materials/command_service.py \
            backend/app/modules/graduation/materials/query_service.py \
            backend/tests/test_graduation_material_archived_rule_resolution.py \
            scripts/apply_graduation_archived_rule_closeout.py \
            .github/workflows/graduation-material-closeout-apply-once.yml \
            .github/workflows/graduation-material-closeout-repair-once.yml
          git commit -m "fix(graduation): preserve archived material rule snapshots"
          git push origin HEAD:fix/graduation-material-closeout-p0-review
