name: E Mobile Cache Patch

on:
  push:
    branches:
      - perf/capacity-observability-and-load-gates
    paths:
      - "performance/tools/apply_mobile_read_cache_patch.py"
      - ".github/workflows/e-mobile-cache-patch.yml"

permissions:
  contents: write

concurrency:
  group: e-mobile-cache-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DEPLOYMENT_MODE: development
      DB_ENABLED: "true"
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: e-mobile-cache-patch-secret-at-least-32-bytes
      SCHEDULER_MODE: external
      FAST_TEST_SCHEMA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/capacity-observability-and-load-gates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply exact patch
        run: python performance/tools/apply_mobile_read_cache_patch.py
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Validate cache isolation and mobile contracts
        working-directory: backend
        run: |
          alembic upgrade head
          pytest tests/test_mobile_read_cache.py tests/test_mobile_teacher_*.py -q -p no:warnings --maxfail=1
          python -m py_compile app/api/v1/mobile.py app/services/mobile_teacher_service.py app/services/mobile_read_cache.py
      - name: Commit exact source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/api/v1/mobile.py backend/app/services/mobile_teacher_service.py
          if git diff --cached --quiet; then
            echo "patch already applied"
            exit 0
          fi
          git commit -m "perf: cache mobile read aggregations and remove class N+1"
          git push origin HEAD:perf/capacity-observability-and-load-gates
