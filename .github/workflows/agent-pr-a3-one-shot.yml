name: Agent PR-A3 one-shot

on:
  push:
    branches:
      - fix/system-audit-rbac-atomicity-20260813

permissions:
  contents: write

concurrency:
  group: agent-pr-a3-one-shot
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: '1'
      FILE_STORAGE_PROVIDER: local
      LOCAL_UPLOAD_DIR: /tmp/saas-ci-uploads
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/system-audit-rbac-atomicity-20260813
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Apply A3 atomic role lifecycle patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ""
          open('.agent_patch_a3.py','wb').write(gzip.decompress(base64.b64decode(payload)))
          PY
          python .agent_patch_a3.py
      - name: Compile A3 Python
        run: |
          python -m py_compile \
            backend/app/services/audit_log.py \
            backend/app/services/db_service.py \
            backend/app/services/role_assignment_service.py \
            backend/tests/test_role_assignment_validity.py \
            backend/tests/test_audit_fail_closed_actions.py
      - name: Run A3 MySQL lifecycle and audit contracts
        working-directory: backend
        run: |
          pytest \
            tests/test_role_assignment_privilege_boundary.py \
            tests/test_role_assignment_validity.py \
            tests/test_critical_audit_atomicity.py \
            tests/test_audit_fail_closed_actions.py \
            tests/test_audit_evidence_integrity.py \
            -q -p no:warnings
      - name: Commit exact A3 scope and remove one-shot artifacts
        run: |
          rm .agent_patch_a3.py .github/workflows/agent-pr-a3-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/services/audit_log.py \
            backend/app/services/db_service.py \
            backend/app/services/role_assignment_service.py \
            backend/tests/test_role_assignment_validity.py \
            backend/tests/test_audit_fail_closed_actions.py \
            .github/workflows/agent-pr-a3-one-shot.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(rbac): make role assignment lifecycle atomic"
          git push origin HEAD:fix/system-audit-rbac-atomicity-20260813
