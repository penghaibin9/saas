name: PR25 midterm fixture block correction

on:
  push:
    branches:
      - audit/file-capability-inventory
    paths:
      - .github/workflows/pr25-midterm-fixture-block-fix.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0

      - name: Remove obsolete fields only from GraduationMidterm fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/graduation_material_center_mysql_acceptance.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('            GraduationMidterm(')
          end = source.index('            GraduationArchiveRecord(', start)
          block = source[start:end]
          for obsolete in (
              '                issues="无",\n',
              '                next_plan="完成定稿",\n',
          ):
              if obsolete not in block:
                  raise SystemExit(f'obsolete midterm fixture field missing: {obsolete.strip()}')
              block = block.replace(obsolete, '', 1)
          source = source[:start] + block + source[end:]
          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit correction and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr25-midterm-fixture-block-fix.yml
          git add backend/tests/graduation_material_center_mysql_acceptance.py
          git diff --cached --check
          git commit -m "test(graduation): align midterm acceptance fixture with model"
          git push origin HEAD:audit/file-capability-inventory
