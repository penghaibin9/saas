name: PR274 isolated repair preparation
on:
  push:
    branches: [codex/pr274-recovery-20260924]
    paths:
      - .github/workflows/pr274-recovery.yml
      - scripts/dev/pr274-region-followup.py
permissions:
  contents: read
concurrency:
  group: pr274-isolated-repair-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'penghaibin9/saas'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      CI: 'true'
      VITE_API_BASE_URL: https://school-ci.invalid
      VITE_USE_MOCK: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 32e0a8deb86ca23e3575b73e500ba0b166f14c5e
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked miniapp dependencies
        working-directory: source
        run: npm --prefix miniapp ci
      - name: Reproduce external reset failures before changing the component
        working-directory: source
        run: python ../tooling/scripts/dev/pr274-region-followup.py reproduce
      - name: Apply only the region component correction
        working-directory: source
        run: python ../tooling/scripts/dev/pr274-region-followup.py apply
      - name: Validate all miniapp contracts and both production targets
        working-directory: source
        run: |
          set -euo pipefail
          npm --prefix miniapp test > ../region-after-repair-tests.log 2>&1 || { grep -A35 '^not ok' ../region-after-repair-tests.log; tail -15 ../region-after-repair-tests.log; exit 1; }
          tail -12 ../region-after-repair-tests.log
          npm --prefix miniapp run build:h5 > ../region-h5-build.log 2>&1 || { tail -80 ../region-h5-build.log; exit 1; }
          tail -4 ../region-h5-build.log
          npm --prefix miniapp run build:mp-weixin > ../region-weixin-build.log 2>&1 || { tail -80 ../region-weixin-build.log; exit 1; }
          tail -4 ../region-weixin-build.log
          git diff --cached --check
      - name: Create candidate objects without changing branches
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../tooling/scripts/dev/pr274-region-followup.py publish
      - name: Preserve before and after verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr274-region-followup-${{ github.run_id }}
          path: |
            region-*.log
            source/region-candidate.json
            source/region-reviewed.diff
          if-no-files-found: warn
          retention-days: 7
