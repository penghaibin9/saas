name: Academic B Final Backend Four Shard

on:
  pull_request:
    branches:
      - integration/academic-school-gold
    paths:
      - "backend/**"
      - ".github/workflows/academic-b-final-backend-four-shard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-b-final-backend-four-shard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-full-regression:
    name: Academic B Final / backend full regression shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: "1"
      SHARD_TOTAL: "4"
      SHARD_INDEX: ${{ matrix.shard }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frozen backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Tenant isolation ratchet
        run: python scripts/audit_tenant_queries.py --gate
      - name: Select deterministic test-file shard
        id: shard
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(python - <<'PY'
          import os
          from pathlib import Path
          shard = int(os.environ['SHARD_INDEX'])
          total = int(os.environ['SHARD_TOTAL'])
          files = sorted(str(p) for p in Path('tests').rglob('test_*.py'))
          selected = [p for i, p in enumerate(files) if i % total == shard]
          if not selected:
              raise SystemExit('empty pytest shard')
          print(' '.join(selected))
          PY
          )
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Shard ${SHARD_INDEX}/${SHARD_TOTAL}: $(wc -w <<<"$FILES" | tr -d ' ') test files"
      - name: Run every backend test in this shard
        shell: bash
        run: |
          set -euo pipefail
          timeout 85m pytest ${{ steps.shard.outputs.files }} -q -p no:warnings --durations=30

  four-shard-gate:
    name: Academic B Final / four-shard gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-full-regression
    steps:
      - name: Require all four backend shards to succeed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.backend-full-regression.result }}" = "success"
