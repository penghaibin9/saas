name: PR25 P0/P1 closeout repair

on:
  push:
    branches:
      - audit/file-capability-inventory
    paths:
      - '.github/workflows/pr25-p0-p1-closeout-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr25-p0-p1-closeout-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0

      - name: Apply audited P0 and P1 fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          fixture = Path('backend/tests/graduation_material_center_mysql_acceptance.py')
          source = fixture.read_text(encoding='utf-8')
          start = source.index('            GraduationArchiveRecord(')
          end = source.index('            ),', start) + len('            ),')
          block = source[start:end]
          obsolete = '                history_json=[],\n'
          if obsolete not in block:
              raise SystemExit('GraduationArchiveRecord.history_json fixture blocker not found')
          block = block.replace(obsolete, '', 1)
          fixture.write_text(source[:start] + block + source[end:], encoding='utf-8')

          workflow = Path('.github/workflows/file-center-final-merge-closeout-v3.yml')
          source = workflow.read_text(encoding='utf-8')

          conflict_start = source.index('          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)')
          conflict_end_marker = '          test -z "$(git diff --name-only --diff-filter=U)"\n'
          conflict_end = source.index(conflict_end_marker, conflict_start) + len(conflict_end_marker)
          audited_resolution = '''          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          if [ "${#conflicts[@]}" -gt 0 ]; then
            expected_conflicts=(
              frontend/src/modules/system/components/ImportDialog.vue
              frontend/src/modules/system/system.routes.js
              frontend/src/modules/system/systemManagementCatalog.js
              frontend/src/modules/system/views/SystemStudentImportView.vue
              frontend/src/modules/system/views/SystemTeacherImportView.vue
              student-portal/src/layouts/PortalLayout.vue
            )
            declare -A expected_ours=(
              [frontend/src/modules/system/components/ImportDialog.vue]=c67cdb2ddfc66d8decb76bea1f8d19ced0c10d04
              [frontend/src/modules/system/system.routes.js]=ef869b0308ecdab2dc5b5aa945fd366ea17d3aa6
              [frontend/src/modules/system/systemManagementCatalog.js]=cb1baf51b04a6757ce116b2d6e9bd00fd0db32c7
              [frontend/src/modules/system/views/SystemStudentImportView.vue]=3553cf286f6ec3b32b52b3a3f756da2a01352349
              [frontend/src/modules/system/views/SystemTeacherImportView.vue]=98cf92ae8ad424ec32fcd290da239a4fcff37a22
              [student-portal/src/layouts/PortalLayout.vue]=6fb38e818143bef43324a952c5bd05dea7721c90
            )
            declare -A expected_theirs=(
              [frontend/src/modules/system/components/ImportDialog.vue]=ad07bbe34fe00cb6e2e4f32b24814f1ca7c5c314
              [frontend/src/modules/system/system.routes.js]=651ab4d0a8375586abeac797230ea0f2cbc20e38
              [frontend/src/modules/system/systemManagementCatalog.js]=41dc36addf6a2e130c122d8675d055058c4d4217
              [frontend/src/modules/system/views/SystemStudentImportView.vue]=d4cb29e764ead41e916d8e9af5d4de2ac9e3b30c
              [frontend/src/modules/system/views/SystemTeacherImportView.vue]=a585c721c91f6702c9d2dea958854d396db09ef0
              [student-portal/src/layouts/PortalLayout.vue]=7ea360e7f4ccf52ae085f7b04020eae630d3bf50
            )

            if [ "${#conflicts[@]}" -ne "${#expected_conflicts[@]}" ]; then
              printf 'Unexpected conflict set:\n%s\n' "${conflicts[*]}"
              exit 1
            fi
            for file in "${expected_conflicts[@]}"; do
              printf '%s\n' "${conflicts[@]}" | grep -Fxq "$file" || {
                echo "Expected audited conflict missing: $file"
                exit 1
              }
              ours_blob="$(git rev-parse ":2:$file")"
              theirs_blob="$(git rev-parse ":3:$file")"
              if [ "$ours_blob" != "${expected_ours[$file]}" ] || [ "$theirs_blob" != "${expected_theirs[$file]}" ]; then
                echo "Conflict content changed since semantic audit: $file"
                echo "ours=$ours_blob expected=${expected_ours[$file]}"
                echo "theirs=$theirs_blob expected=${expected_theirs[$file]}"
                exit 1
              fi
              # The audited PR blob is the main version plus the file-center/data-exchange addition.
              # Exact blob guards above make this a semantic resolution, not a blind --ours fallback.
              git checkout --ours -- "$file"
              git add -- "$file"
            done
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
'''
          source = source[:conflict_start] + audited_resolution + source[conflict_end:]

          fixture_patch_anchor = "          source = source[:start] + block + source[end:]\n          path.write_text(source, encoding='utf-8')\n"
          if fixture_patch_anchor not in source:
              raise SystemExit('final closeout fixture patch anchor missing')
          fixture_patch = """          source = source[:start] + block + source[end:]

          archive_start = source.index('            GraduationArchiveRecord(')
          archive_end = source.index('            ),', archive_start) + len('            ),')
          archive_block = source[archive_start:archive_end]
          archive_block = archive_block.replace('                history_json=[],\\n', '', 1)
          source = source[:archive_start] + archive_block + source[archive_end:]
          path.write_text(source, encoding='utf-8')
"""
          source = source.replace(fixture_patch_anchor, fixture_patch, 1)

          remove_anchor = "          git rm -f .github/workflows/pr25-fix-merge-identity.yml || true\n"
          if remove_anchor not in source:
              raise SystemExit('final closeout cleanup anchor missing')
          source = source.replace(
              remove_anchor,
              remove_anchor + "          git rm -f .github/workflows/file-center-final-merge-closeout-v3.yml || true\n",
              1,
          )

          commit_anchor = """          git status --short
          git commit -m \"merge: sync main and close PR25 final audit\"
          git push origin HEAD:audit/file-capability-inventory
          echo \"final_sha=$(git rev-parse HEAD)\" >> \"$GITHUB_OUTPUT\"
"""
          if commit_anchor not in source:
              raise SystemExit('final closeout commit anchor missing')
          commit_block = """          git status --short
          if git diff --cached --quiet && git diff --quiet; then
            echo \"final_sha=$(git rev-parse HEAD)\" >> \"$GITHUB_OUTPUT\"
            exit 0
          fi
          git commit -m \"merge: sync main and close PR25 final audit\"
          git push origin HEAD:audit/file-capability-inventory
          echo \"final_sha=$(git rev-parse HEAD)\" >> \"$GITHUB_OUTPUT\"
"""
          source = source.replace(commit_anchor, commit_block, 1)
          workflow.write_text(source, encoding='utf-8')
          PY

          git rm -f .github/workflows/pr25-midterm-fixture-block-fix.yml
          git rm -f .github/workflows/pr25-fix-merge-identity.yml || true
          git rm -f .github/workflows/pr25-p0-p1-closeout-fix.yml
          git diff --check

      - name: Commit repaired closeout flow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/graduation_material_center_mysql_acceptance.py
          git add .github/workflows/file-center-final-merge-closeout-v3.yml
          git diff --cached --check
          git commit -m "fix(pr25): close final merge blockers safely"
          git push origin HEAD:audit/file-capability-inventory
