name: Supply chain security

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/requirements.txt'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'student-portal/package.json'
      - 'student-portal/package-lock.json'
      - 'miniapp/package.json'
      - 'miniapp/package-lock.json'
      - '.github/dependabot.yml'
      - '.github/workflows/supply-chain-security.yml'
  push:
    branches: [main]
    paths:
      - 'backend/requirements.txt'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'student-portal/package.json'
      - 'student-portal/package-lock.json'
      - 'miniapp/package.json'
      - 'miniapp/package-lock.json'
      - '.github/dependabot.yml'
      - '.github/workflows/supply-chain-security.yml'
  schedule:
    - cron: '20 19 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: Python dependency vulnerability gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Audit resolved backend dependency graph
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off

  npm-audit:
    name: ${{ matrix.app }} production dependency vulnerability gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, student-portal, miniapp]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Fail on high or critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
