name: Cleanup runs before 2026-08-16 10:00 GMT+8

on:
  push:
    branches:
      - cleanup/actions-before-20260816-1000-r1
    paths:
      - .github/workflows/cleanup-actions-before-20260816-1000.yml

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    if: github.actor == 'penghaibin9'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Delete workflow runs before cutoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: python
        run: |
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          current_run_id = int(os.environ['CURRENT_RUN_ID'])
          cutoff = '2026-08-16T01:59:59Z'  # Beijing 2026-08-16 10:00:00 is 02:00:00Z
          created_range = f'1970-01-01T00:00:00Z..{cutoff}'
          base = f'https://api.github.com/repos/{repo}'

          def request(method, path, data=None, retries=12):
              url = base + path
              body = None if data is None else json.dumps(data).encode()
              for attempt in range(retries):
                  req = urllib.request.Request(url, data=body, method=method)
                  req.add_header('Authorization', f'Bearer {token}')
                  req.add_header('Accept', 'application/vnd.github+json')
                  req.add_header('X-GitHub-Api-Version', '2022-11-28')
                  if body is not None:
                      req.add_header('Content-Type', 'application/json')
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          raw = resp.read()
                          return resp.status, (json.loads(raw) if raw else None), dict(resp.headers)
                  except urllib.error.HTTPError as e:
                      raw = e.read().decode(errors='replace')
                      headers = dict(e.headers)
                      if e.code in (403, 429):
                          reset = headers.get('X-RateLimit-Reset')
                          retry_after = headers.get('Retry-After')
                          if retry_after:
                              wait = max(5, int(retry_after) + 2)
                          elif reset:
                              wait = max(5, int(reset) - int(time.time()) + 5)
                          else:
                              wait = min(300, 15 * (attempt + 1))
                          print(f'Rate limited ({e.code}); waiting {wait}s')
                          time.sleep(wait)
                          continue
                      if e.code in (404, 409, 422):
                          print(f'{method} {path} -> {e.code}: {raw[:300]}')
                          return e.code, None, headers
                      raise
              raise RuntimeError(f'API retries exhausted for {method} {path}')

          deleted = 0
          cancelled = 0
          loops = 0

          while True:
              loops += 1
              q = urllib.parse.urlencode({'per_page': 100, 'created': created_range})
              status, payload, _ = request('GET', f'/actions/runs?{q}')
              runs = (payload or {}).get('workflow_runs', [])
              runs = [r for r in runs if int(r['id']) != current_run_id]

              if not runs:
                  break

              progress = False
              for run in runs:
                  rid = int(run['id'])
                  state = run.get('status')
                  if state == 'completed':
                      code, _, _ = request('DELETE', f'/actions/runs/{rid}')
                      if code in (204, 404):
                          deleted += 1
                          progress = True
                  else:
                      code, _, _ = request('POST', f'/actions/runs/{rid}/cancel')
                      if code in (202, 409, 404):
                          cancelled += 1
                          progress = True

              print(f'loop={loops} batch={len(runs)} deleted={deleted} cancel_attempts={cancelled}')
              time.sleep(8 if any(r.get('status') != 'completed' for r in runs) else 1)

              if loops > 500:
                  raise RuntimeError('Cleanup exceeded 500 loops; aborting instead of silently leaving records.')
              if not progress:
                  time.sleep(15)

          # Final verification: no run created before the cutoff should remain.
          q = urllib.parse.urlencode({'per_page': 100, 'created': created_range})
          _, verify, _ = request('GET', f'/actions/runs?{q}')
          remaining = [r for r in (verify or {}).get('workflow_runs', []) if int(r['id']) != current_run_id]
          if remaining:
              raise RuntimeError(f'Cleanup incomplete: {len(remaining)} matching runs remain in first verification page.')

          print(f'Cleanup complete. Deleted={deleted}; cancel_attempts={cancelled}; cutoff={cutoff}')

      - name: Remove temporary cleanup branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: cleanup/actions-before-20260816-1000-r1
        shell: python
        run: |
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPO']
          branch = urllib.parse.quote(os.environ['BRANCH'], safe='')
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/git/refs/heads/{branch}'
          req = urllib.request.Request(url, method='DELETE')
          req.add_header('Authorization', f'Bearer {token}')
          req.add_header('Accept', 'application/vnd.github+json')
          req.add_header('X-GitHub-Api-Version', '2022-11-28')
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  print('Temporary branch deleted:', resp.status)
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print('Temporary branch already absent.')
              else:
                  raise
