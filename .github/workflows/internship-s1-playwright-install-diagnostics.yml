name: Internship S1 Playwright Install Diagnostics

on:
  push:
    branches:
      - fix/internship-final-rc-20260824
    paths:
      - '.github/workflows/internship-s1-playwright-install-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-install-diagnostics:
    name: Verify e2e lockfile and Chromium install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_PRODUCT_EXACT_SHA: 2e0a92c8b7f21a6eaa5ed6ca02929e39cd97fd2b

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact runner/product SHA assertion
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$GITHUB_SHA"
          git cat-file -e "$E2E_PRODUCT_EXACT_SHA^{commit}"
          echo "diagnosticRunnerExactSha=$ACTUAL"
          echo "productExactSha=$E2E_PRODUCT_EXACT_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate lockfile and verify npm ci plus Playwright Chromium install
        working-directory: e2e
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p runtime-logs
          LOG="runtime-logs/s1-playwright-install-diagnostic.log"

          {
            echo '=== runner ==='
            uname -a
            cat /etc/os-release
            echo '=== node/npm ==='
            node --version
            npm --version
            echo '=== declared Playwright ==='
            node -e "console.log(require('./package.json').devDependencies['@playwright/test'])"
          } 2>&1 | tee "$LOG"

          set +e
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund 2>&1 | tee -a "$LOG"
          LOCK_RC=${PIPESTATUS[0]}
          echo "package_lock_generation_exit=$LOCK_RC" | tee -a "$LOG"
          if [ "$LOCK_RC" -ne 0 ]; then
            exit "$LOCK_RC"
          fi
          test -s package-lock.json
          sha256sum package-lock.json | tee -a "$LOG"

          npm ci 2>&1 | tee -a "$LOG"
          NPM_RC=${PIPESTATUS[0]}
          echo "npm_ci_exit=$NPM_RC" | tee -a "$LOG"
          if [ "$NPM_RC" -ne 0 ]; then
            exit "$NPM_RC"
          fi

          npx playwright --version 2>&1 | tee -a "$LOG"
          npx playwright install --with-deps chromium 2>&1 | tee -a "$LOG"
          PLAYWRIGHT_RC=${PIPESTATUS[0]}
          echo "playwright_install_exit=$PLAYWRIGHT_RC" | tee -a "$LOG"
          exit "$PLAYWRIGHT_RC"

      - name: Upload Playwright install diagnostics and generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-s1-playwright-install-diagnostics-${{ github.run_id }}
          path: |
            e2e/runtime-logs/s1-playwright-install-diagnostic.log
            e2e/package-lock.json
          if-no-files-found: error
          retention-days: 14
