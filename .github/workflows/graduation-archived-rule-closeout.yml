name: Graduation Archived Rule Closeout

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: graduation-archived-rule-closeout
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.head_ref == 'fix/graduation-material-closeout-p0-review'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graduation-material-closeout-p0-review
          fetch-depth: 0

      - name: Apply archived-rule closeout patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_graduation_archived_rule_closeout.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('if text.count(old_filter) != 2:', 'if text.count(old_filter) != 1:')
          text = text.replace('expected two active-student filters', 'expected active-student filter')
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/apply_graduation_archived_rule_closeout.py
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/modules/graduation/materials/command_service.py')
          text = path.read_text(encoding='utf-8')
          start_names = ('def initialize_batch_materials_in_session', 'def repair_material_catalog')
          end_names = ('def initialize_batch_materials(', 'def _assert_owner_role')
          old = '        GraduationStudent.record_status == "ACTIVE", GraduationStudent.is_deleted.is_(False),\n'
          new = ('        GraduationStudent.record_status == "ACTIVE",\n'
                 '        func.coalesce(GraduationStudent.stage, "") != "ARCHIVED",\n'
                 '        GraduationStudent.is_deleted.is_(False),\n')
          for start_name, end_name in zip(start_names, end_names):
              start = text.index(start_name)
              end = text.index(end_name, start)
              segment = text[start:end]
              if 'func.coalesce(GraduationStudent.stage, "") != "ARCHIVED"' not in segment:
                  if segment.count(old) != 1:
                      raise SystemExit(f'{start_name}: archived filter insertion mismatch')
                  segment = segment.replace(old, new, 1)
                  text = text[:start] + segment + text[end:]
          path.write_text(text, encoding='utf-8')
          compile(text, str(path), 'exec')
          assert text.count('func.coalesce(GraduationStudent.stage, "") != "ARCHIVED"') == 2
          PY
          git diff --check
          python -m compileall -q \
            backend/app/modules/graduation/materials/definitions.py \
            backend/app/modules/graduation/materials/rule_service.py \
            backend/app/modules/graduation/materials/command_service.py \
            backend/app/modules/graduation/materials/query_service.py \
            backend/tests/test_graduation_material_archived_rule_resolution.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography

      - name: Run graduation material MySQL regressions
        working-directory: backend
        run: |
          pytest -q \
            tests/test_graduation_material_archived_rule_resolution.py \
            tests/test_graduation_material_rule_archive_invariants.py \
            tests/test_graduation_material_closeout_regressions.py \
            tests/test_graduation_material_center_phase6.py

      - name: Commit only validated production changes
        run: |
          set -euo pipefail
          rm -f \
            scripts/apply_graduation_archived_rule_closeout.py \
            .github/workflows/graduation-archived-rule-closeout.yml
          git config user.name "graduation-closeout-bot"
          git config user.email "graduation-closeout-bot@users.noreply.github.com"
          git add -- \
            backend/app/modules/graduation/materials/definitions.py \
            backend/app/modules/graduation/materials/rule_service.py \
            backend/app/modules/graduation/materials/command_service.py \
            backend/app/modules/graduation/materials/query_service.py \
            backend/tests/test_graduation_material_archived_rule_resolution.py \
            scripts/apply_graduation_archived_rule_closeout.py \
            .github/workflows/graduation-archived-rule-closeout.yml
          git diff --cached --check
          git commit -m "fix(graduation): keep archived students on frozen material rules"
          git push origin HEAD:fix/graduation-material-closeout-p0-review
