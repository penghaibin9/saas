name: Academic C W3 W4 W5 PR Final

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/alembic/versions/20260818_aa_grade_task_deadline.py'
      - 'backend/alembic/versions/20260818_merge_prog_grade_deadline.py'
      - 'backend/app/modules/academic_affairs/routers/grade_core_router.py'
      - 'backend/app/modules/academic_affairs/routers/mobile_grade_entry_router.py'
      - 'backend/app/modules/academic_affairs/routers/exam_incident_closure_router.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_attendance_public_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_attendance_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_attendance_teacher_relation_guard.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_attendance_teacher_relation_read_guard.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_grade_deadline_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_grade_deadline_scheduler_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_grade_task_read_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_teacher_relation_authority.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_grade_xlsx_path_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_grade_message_event_guard.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_grade_reminder_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_exam_print_service.py'
      - 'backend/app/services/xlsx_util.py'
      - 'backend/scripts/run_scheduled_jobs.py'
      - 'backend/scripts/e2e_academic_affairs_live_flow.py'
      - 'backend/scripts/e2e_academic_affairs_round3.py'
      - 'backend/tests/test_academic_c_closure_contract.py'
      - 'backend/tests/test_aa_grade_deadline_scheduler.py'
      - 'frontend/src/modules/academicAffairs/views/AaTeachingClassDetailView.vue'
      - 'frontend/src/modules/academicAffairs/views/AaExamSeatingPrintView.vue'
      - 'frontend/src/modules/academicAffairs/views/AaGradeEntryView.vue'
      - 'frontend/src/modules/academicAffairs/api/academic-exam-formal-print.api.js'
      - 'frontend/src/modules/academicAffairs/api/grade-reminder.api.js'
      - '.github/workflows/academic-c-w345-pr-final.yml'

permissions:
  contents: read
concurrency:
  group: academic-c-w345-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: test
      JWT_SECRET: academic-c-w345-final-secret-at-least-32-bytes
      DB_ENABLED: 'true'
      MOCK_LOGIN_ENABLED: 'true'
      PYTEST_PRESERVE_MIGRATED_SCHEMA: '1'
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: student_lifecycle_test}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Migration and schema
        working-directory: backend
        run: |
          set -euo pipefail
          alembic heads
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic heads | grep -q '20260818_merge_prog_grade_dl (head)'
          alembic upgrade head
          mysql -h127.0.0.1 -uroot -proot student_lifecycle_test -Nse "SHOW COLUMNS FROM t_aa_grade_task LIKE 'deadline_at'" | grep -q deadline_at
          mysql -h127.0.0.1 -uroot -proot student_lifecycle_test -Nse "SHOW INDEX FROM t_aa_grade_task WHERE Key_name='ix_aa_grade_task_deadline'" | grep -q ix_aa_grade_task_deadline
      - name: Compile and source contracts
        working-directory: backend
        run: |
          python -m py_compile app/modules/academic_affairs/routers/grade_core_router.py app/modules/academic_affairs/routers/mobile_grade_entry_router.py app/modules/academic_affairs/routers/exam_incident_closure_router.py app/modules/academic_affairs/services/academic_affairs_attendance_public_service.py app/modules/academic_affairs/services/academic_affairs_attendance_service.py app/modules/academic_affairs/services/academic_affairs_attendance_teacher_relation_guard.py app/modules/academic_affairs/services/academic_affairs_attendance_teacher_relation_read_guard.py app/modules/academic_affairs/services/academic_affairs_grade_deadline_service.py app/modules/academic_affairs/services/academic_affairs_grade_deadline_scheduler_service.py app/modules/academic_affairs/services/academic_affairs_grade_task_read_service.py app/modules/academic_affairs/services/academic_affairs_teacher_relation_authority.py app/modules/academic_affairs/services/academic_affairs_grade_xlsx_path_service.py app/modules/academic_affairs/services/academic_affairs_grade_message_event_guard.py app/modules/academic_affairs/services/academic_affairs_grade_reminder_service.py app/modules/academic_affairs/services/academic_affairs_exam_print_service.py app/services/xlsx_util.py scripts/run_scheduled_jobs.py scripts/e2e_academic_affairs_live_flow.py scripts/e2e_academic_affairs_round3.py
          python - <<'PY'
          from pathlib import Path
          public=Path('app/modules/academic_affairs/services/academic_affairs_attendance_public_service.py').read_text()
          legacy=Path('app/modules/academic_affairs/services/academic_affairs_attendance_service.py').read_text()
          command=Path('app/modules/academic_affairs/services/academic_affairs_attendance_teacher_relation_guard.py').read_text()
          assert 'AaAttendanceSession(' not in public and 'AaAttendanceSession(' not in legacy
          assert 'def resolve_versioned_roster(' in public and 'def freeze_consumer_snapshot(' in public
          assert 'public.resolve_versioned_roster' in command and 'public.freeze_consumer_snapshot' in command
          assert 'public._canonical' not in command and 'setattr(public' not in command
          for phantom in ('teaching_task_id=','occurrence_identity=','source_type=','source_reason=','source_evidence='):
              assert phantom not in command
          assert 'reason={special_reason};evidence={special_evidence}' in command
          assert 'result["occurrenceEvidence"]' in command
          d=Path('app/modules/academic_affairs/services/academic_affairs_grade_deadline_service.py').read_text()
          q=Path('app/modules/academic_affairs/services/academic_affairs_grade_task_read_service.py').read_text()
          sched=Path('app/modules/academic_affairs/services/academic_affairs_grade_deadline_scheduler_service.py').read_text()
          assert 'GRADE_DEADLINE_EXPIRED' in d and 'deadline_projection_map' in q and 'FOR UPDATE SKIP LOCKED' in sched
          PY
      - name: Targeted MySQL regression
        working-directory: backend
        run: >-
          pytest -q tests/test_academic_c_closure_contract.py tests/test_aa_grade_deadline_scheduler.py tests/test_aa_exam_facade_contract_and_changes.py tests/test_aa_exam_fact_guards.py tests/test_aa_effective_grade_identity.py tests/test_aa_grade_recheck_concurrency.py tests/test_aa_p0_hardening_20260804.py -p no:warnings --durations=20
      - name: Frontend production build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Frontend source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q '新增共同授课' frontend/src/modules/academicAffairs/views/AaTeachingClassDetailView.vue
          grep -q 'formal-print/issue' frontend/src/modules/academicAffairs/api/academic-exam-formal-print.api.js
          grep -q 'v-if="canSubmit"' frontend/src/modules/academicAffairs/views/AaGradeEntryView.vue
          grep -q 'task.isOverdue === true' frontend/src/modules/academicAffairs/views/AaGradeEntryView.vue
          grep -q 'GRADE.ENTRY_REMINDED' frontend/src/modules/academicAffairs/views/AaGradeEntryView.vue
