name: Academic B W4 Formation Handoff

on:
  pull_request:
    branches:
      - integration/academic-school-gold
    paths:
      - .github/workflows/academic-b-w4-formation-handoff.yml
      - .github/workflows/academic-b-w4-formation-real-click.yml
      - backend/alembic/versions/20260816_academic_int_ac4_schema.py
      - backend/alembic/versions/20260817_aa_prog_expand.py
      - backend/alembic/versions/20260817_academic_int_program_series.py
      - backend/alembic/versions/20260818_academic_main_int_merge.py
      - backend/app/modules/academic_affairs/services/academic_affairs_selection_course_command_service.py
      - backend/app/modules/academic_affairs/services/academic_affairs_selection_formation_dependency.py
      - backend/scripts/e2e_seed_academic_b_w4_formation.py
      - backend/tests/test_aa_program_expand_schema_int.py
      - backend/tests/test_academic_int_main_lineage_convergence.py
      - backend/tests/test_aa_selection_w4_formation_handoff.py
      - backend/tests/test_aa_selection_w4_task_identity.py
      - backend/tests/test_aa_selection_read_production_contract.py
      - e2e/specs/academic-b-selection-w4-formation.spec.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-b-w4-formation-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  A_FINAL_GOLD_SHA: 71de7b4a0ac52216df9e8230f8b6ec97a26099be
  A_FORMATION_POLICY_BLOB: 746adabc57ea9ba21d4e49bd503a87272b3c8cbd
  EXPECTED_INTEGRATION_BASE_SHA: 50ec0b9aba564701805d5a3f590b2faa23c2cfc3
  SEALED_PROVENANCE_SHA: 6bb48f1c055d8fd16fe9563ba4ea64c36ac15f9a

jobs:
  formation-handoff:
    name: B SelectionCourse + approved A/INT integration base
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: academic_b_w4_formation_handoff
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      APP_ENV: test
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_w4_formation_handoff?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_w4_formation_handoff?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      SECRET_KEY: academic-b-w4-formation-handoff-secret-at-least-32-bytes

    steps:
      - name: Checkout exact B candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Pin exact B head and approved A/INT integration base
        run: |
          set -euo pipefail
          POLICY_PATH=backend/app/modules/academic_affairs/services/academic_affairs_task_formation_policy.py
          B_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"

          test "$(git rev-parse HEAD)" = "$B_HEAD_SHA"
          if test "${{ github.event_name }}" = "pull_request"; then
            test "${{ github.event.pull_request.base.ref }}" = "integration/academic-school-gold"
          fi

          git fetch origin integration/academic-school-gold --no-tags
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_INTEGRATION_BASE_SHA"
          git fetch origin "$A_FINAL_GOLD_SHA" --no-tags

          git cat-file -e "${A_FINAL_GOLD_SHA}^{commit}"
          git cat-file -e "${EXPECTED_INTEGRATION_BASE_SHA}^{commit}"
          git cat-file -e "${SEALED_PROVENANCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SEALED_PROVENANCE_SHA" "$EXPECTED_INTEGRATION_BASE_SHA"

          A_POLICY_BLOB="$(git rev-parse "${A_FINAL_GOLD_SHA}:${POLICY_PATH}")"
          BASE_POLICY_BLOB="$(git rev-parse "${EXPECTED_INTEGRATION_BASE_SHA}:${POLICY_PATH}")"
          test "$A_POLICY_BLOB" = "$A_FORMATION_POLICY_BLOB"
          test "$BASE_POLICY_BLOB" = "$A_FORMATION_POLICY_BLOB"
          test "$A_POLICY_BLOB" = "$BASE_POLICY_BLOB"
          git diff --quiet "$A_FINAL_GOLD_SHA" "$EXPECTED_INTEGRATION_BASE_SHA" -- "$POLICY_PATH"
          git show "${A_FINAL_GOLD_SHA}:${POLICY_PATH}" | grep -F 'def selection_eligible'

      - name: Materialize exact PR integration candidate when needed
        run: |
          set -euo pipefail
          git config user.name "academic-b-w4-handoff"
          git config user.email "academic-b-w4-handoff@invalid.local"
          if git merge-base --is-ancestor "$EXPECTED_INTEGRATION_BASE_SHA" HEAD; then
            echo "sealed INT base is already an ancestor of exact B HEAD"
          else
            git merge --no-commit --no-ff "$EXPECTED_INTEGRATION_BASE_SHA"
            test "$(git rev-parse MERGE_HEAD)" = "$EXPECTED_INTEGRATION_BASE_SHA"
          fi
          git diff --check
          test -f backend/app/modules/academic_affairs/services/academic_affairs_task_formation_provenance_service.py
          grep -F 'source_program_course_id' backend/app/models/academic_affairs.py
          grep -F '_guard_selection_formation(db, task_id)' \
            backend/app/modules/academic_affairs/services/academic_affairs_selection_course_command_service.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install integrated backend and migrate clean MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head

      - name: Run lineage, shared schema and B W4 handoff contracts
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q -p no:warnings \
            tests/test_academic_int_main_lineage_convergence.py \
            tests/test_aa_program_expand_schema_int.py \
            tests/test_academic_int_ac4_schema_mysql.py \
            tests/test_academic_int_program_series_schema_red.py \
            tests/test_academic_int_program_series_mysql.py \
            tests/test_aa_selection_read_production_contract.py \
            tests/test_aa_selection_formation_dependency_contract.py \
            tests/test_aa_selection_w4_formation_handoff.py \
            tests/test_aa_selection_w4_task_identity.py \
            tests/test_aa_selection_w4_supply_write_owner.py \
            tests/test_academic_int_task_program_course_provenance_contract.py \
            tests/test_academic_int_task_program_course_provenance_mysql.py \
            --timeout=180 \
            --timeout-method=signal \
            --maxfail=1 \
            --junitxml=/tmp/academic-b-w4-formation-handoff.xml

      - name: Upload formation handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-b-w4-formation-handoff-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/academic-b-w4-formation-handoff.xml
          if-no-files-found: warn
          retention-days: 14
