name: Agent PR107 E3 E4 durable external channels

on:
  push:
    branches:
      - fix/system-audit-rbac-atomicity-20260813
    paths:
      - .github/workflows/agent-pr107-e34-channel.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_e34
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_e34
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply E3 E4 patch and compile
        run: |
          python -m py_compile .github/agent/patch_pr107_e34.py
          python .github/agent/patch_pr107_e34.py
          python -m py_compile \
            backend/app/models/message.py \
            backend/app/services/message_campaign_service.py \
            backend/app/services/message_ops_service.py \
            backend/app/services/message_channel_delivery_service.py \
            backend/app/services/notification/sms_service.py \
            backend/tests/test_message_channel_delivery.py
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Require one migration head and upgrade fresh MySQL
        working-directory: backend
        run: |
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
      - name: Run channel authorization, durable queue and message regressions
        working-directory: backend
        run: |
          pytest -q -p no:warnings \
            tests/test_message_channel_delivery.py \
            tests/test_message_center.py \
            tests/test_message_governance.py \
            tests/test_message_delivery_async.py \
            --timeout=300 --timeout-method=signal
      - name: No plaintext phone in durable channel diff
        run: |
          ! grep -RInE 'phone_plain|mobile_plain|payload.*phone' \
            backend/app/services/message_channel_delivery_service.py \
            backend/app/models/message.py \
            backend/alembic/versions/msg_channel_delivery_20260813.py
      - name: Commit E3 E4 and clean runner
        run: |
          rm .github/agent/patch_pr107_e34.py .github/workflows/agent-pr107-e34-channel.yml
          git config user.name penghaibin9
          git config user.email penghaibin9@gmail.com
          git add \
            backend/app/api/v1/message_center.py \
            backend/app/services/message_campaign_service.py \
            backend/app/services/message_ops_service.py \
            backend/app/services/message_channel_delivery_service.py \
            backend/app/services/notification/sms_service.py \
            backend/app/models/message.py \
            backend/app/models/__init__.py \
            backend/alembic/versions/msg_channel_delivery_20260813.py \
            backend/scripts/run_scheduled_jobs.py \
            backend/tests/test_message_channel_delivery.py \
            .github/agent/patch_pr107_e34.py \
            .github/workflows/agent-pr107-e34-channel.yml
          git diff --cached --check
          git commit -m "feat(message): add governed durable external-channel delivery"
          git push origin HEAD:fix/system-audit-rbac-atomicity-20260813
