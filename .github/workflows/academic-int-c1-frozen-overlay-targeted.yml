name: Academic INT C-C1 Frozen Overlay Targeted

on:
  push:
    branches:
      - integration/academic-school-gold
    paths:
      - .github/workflows/academic-int-c1-frozen-overlay-targeted.yml

permissions:
  contents: write

concurrency:
  group: academic-int-c1-frozen-overlay
  cancel-in-progress: false

jobs:
  c1-frozen-overlay:
    name: C-C1 frozen 3288e109 / MySQL and source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: int_c1_overlay_root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pint_c1_overlay_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CI: 'true'
      APP_ENV: test
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:int_c1_overlay_root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:int_c1_overlay_root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: int_c1_overlay_root
      DB_NAME: student_lifecycle_test
      JWT_SECRET: academic-int-c1-overlay-not-production
      JWT_SECRET_KEY: academic-int-c1-overlay-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
    steps:
      - name: Checkout exact INT trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact integration and main baselines
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "ed497fbd0045d4bedb276929a53333c89c3ae390"
          git fetch origin main agent/academic-c-teaching-execution agent/academic-b-schedule-selection --no-tags
          test "$(git rev-parse origin/main)" = "457dc8821876b8e1b67e0fb5911a9eec33e37616"
          git merge-base --is-ancestor 3288e10907106d17d9dec64dc2a185b90a503bd5 origin/agent/academic-c-teaching-execution
          git merge-base --is-ancestor 6fc6bbaed7c8ef07e5d8ae3d12e41c726fdc0452 origin/agent/academic-b-schedule-selection

      - name: Materialize frozen C-C1 code and contracts only
        run: |
          set -euo pipefail
          paths=(
            backend/app/modules/academic_affairs/services/academic_affairs_attendance_occurrence_consumer.py
            backend/app/modules/academic_affairs/services/academic_affairs_attendance_public_service.py
            backend/app/modules/academic_affairs/services/academic_affairs_attendance_service.py
            backend/app/modules/academic_affairs/services/academic_affairs_warning_service.py
            backend/app/modules/academic_affairs/services/mobile_academic_affairs_facade.py
            backend/scripts/e2e_academic_affairs_round3.py
            backend/tests/test_aa_attendance_admin_special_contract.py
            backend/tests/test_aa_attendance_applied_change_contract.py
            backend/tests/test_aa_attendance_class_options_formal_schedule.py
            backend/tests/test_aa_attendance_expected_schedule_item_contract.py
            backend/tests/test_aa_attendance_occurrence_concurrency.py
            backend/tests/test_aa_attendance_published_occurrence_contract.py
            backend/tests/test_aa_attendance_warning_source_contract.py
            backend/tests/test_e2e_academic_affairs_round3_attendance_fixture.py
            e2e/specs/academic-affairs-attendance-source-visual.spec.mjs
            frontend/src/modules/academicAffairs/views/AaAttendanceStatsView.vue
            frontend/tests/academic-attendance-source-contract.test.mjs
            miniapp/src/pages/teacher/academic-affairs/attendance.vue
            miniapp/tests/academic-attendance-source-contract.test.mjs
          )
          git checkout 3288e10907106d17d9dec64dc2a185b90a503bd5 -- "${paths[@]}"
          printf '%s\n' "${paths[@]}" | sort > /tmp/expected-c1-paths.txt

      - name: Prove no main or B same-path overwrite
        run: |
          set -euo pipefail
          git diff --name-only 414216c4a79ff035aee87d70b35572572f5c0535..457dc8821876b8e1b67e0fb5911a9eec33e37616 | sort > /tmp/main-delta.txt
          git diff --name-only 414216c4a79ff035aee87d70b35572572f5c0535..6fc6bbaed7c8ef07e5d8ae3d12e41c726fdc0452 | sort > /tmp/b-delta.txt
          test -z "$(comm -12 /tmp/expected-c1-paths.txt /tmp/main-delta.txt)"
          test -z "$(comm -12 /tmp/expected-c1-paths.txt /tmp/b-delta.txt)"

      - name: Audit exact frozen overlay scope
        run: |
          set -euo pipefail
          git diff --check
          git status --porcelain=v1 | sed 's/^...//' | sort > /tmp/actual-c1-paths.txt
          diff -u /tmp/expected-c1-paths.txt /tmp/actual-c1-paths.txt
          test "$(git diff --name-only 3288e10907106d17d9dec64dc2a185b90a503bd5 -- $(cat /tmp/expected-c1-paths.txt) | wc -l)" -eq 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend and migrate INT MySQL
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          test "$(alembic heads | tr -d '\r')" = "20260816_acad_int_c1_att (head)"

      - name: Compile frozen C-C1 production modules
        working-directory: backend
        run: |
          python -m py_compile \
            app/modules/academic_affairs/services/academic_affairs_attendance_occurrence_consumer.py \
            app/modules/academic_affairs/services/academic_affairs_attendance_public_service.py \
            app/modules/academic_affairs/services/academic_affairs_attendance_service.py \
            app/modules/academic_affairs/services/academic_affairs_warning_service.py \
            app/modules/academic_affairs/services/mobile_academic_affairs_facade.py

      - name: Run only frozen attendance and roster MySQL contracts
        working-directory: backend
        run: |
          pytest -q \
            tests/test_aa_attendance_task_binding.py \
            tests/test_aa_attendance_admin_special_contract.py \
            tests/test_aa_attendance_applied_change_contract.py \
            tests/test_aa_attendance_class_options_formal_schedule.py \
            tests/test_aa_attendance_expected_schedule_item_contract.py \
            tests/test_aa_attendance_occurrence_concurrency.py \
            tests/test_aa_attendance_published_occurrence_contract.py \
            tests/test_aa_attendance_warning_source_contract.py \
            tests/test_aa_teaching_roster_unification.py \
            --maxfail=1 \
            --junitxml=/tmp/c1-frozen-junit.xml

      - name: Run C-C1 frontend source contracts
        run: |
          node --test frontend/tests/academic-attendance-source-contract.test.mjs
          node --test miniapp/tests/academic-attendance-source-contract.test.mjs

      - name: Atomic fast-forward frozen C-C1 into INT
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $(cat /tmp/expected-c1-paths.txt)
          git diff --cached --check
          git commit -m "feat(academic-int): integrate frozen C-C1 attendance consumer"
          git fetch origin integration/academic-school-gold main --no-tags
          test "$(git rev-parse origin/integration/academic-school-gold)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "457dc8821876b8e1b67e0fb5911a9eec33e37616"
          git push origin HEAD:integration/academic-school-gold

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-int-c1-frozen-overlay-${{ github.run_id }}
          path: /tmp/c1-frozen-junit.xml
          if-no-files-found: warn
          retention-days: 14
