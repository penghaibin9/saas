name: TEMP Graduation V9 U11 Gold freeze

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/graduation-v9-gold-freeze.yml'

permissions:
  contents: write
  actions: read

jobs:
  freeze-gold:
    if: >-
      github.actor != 'github-actions[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'candidate/graduation-u11-gold-seal-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '31803964135'
      SOURCE_ARTIFACT: 'playwright-evidence-31803964135'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download exact GREEN U11 capture artifact
        run: |
          rm -rf /tmp/u11-gold
          mkdir -p /tmp/u11-gold
          gh run download "$SOURCE_RUN" --repo "${{ github.repository }}" --name "$SOURCE_ARTIFACT" --dir /tmp/u11-gold

      - name: Verify SHA-256 and freeze Playwright snapshot files
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          root = Path('/tmp/u11-gold')
          baselines = {
              'gd-U1-dashboard-GoldCandidate-1280x800.png': (
                  'e2e/specs/graduation-v9-dashboard-visual.spec.mjs-snapshots/gd-U1-dashboard-GoldCandidate-1280x800-chromium-linux.png',
                  '0a3e70d24ac905e06dd62cc2ef2e635a61769f45e283280952261db271c9674a'),
              'gd-U1-dashboard-GoldCandidate-1440x900.png': (
                  'e2e/specs/graduation-v9-dashboard-visual.spec.mjs-snapshots/gd-U1-dashboard-GoldCandidate-1440x900-chromium-linux.png',
                  '3712e9419959854d1ef23da006e79402454af16ea44beac87d564b5e238da001'),
              'gd-U3-final-GoldCandidate-1280x800.png': (
                  'e2e/specs/graduation-v9-final-review-visual.spec.mjs-snapshots/gd-U3-final-GoldCandidate-1280x800-chromium-linux.png',
                  '9ef1fe110f2249f296eabff0379635f53c88f90868a723cdcd04b683b381ade2'),
              'gd-U3-final-GoldCandidate-1440x900.png': (
                  'e2e/specs/graduation-v9-final-review-visual.spec.mjs-snapshots/gd-U3-final-GoldCandidate-1440x900-chromium-linux.png',
                  '67b072e474901ac616b6301b64cc2b945725a0bb3ac6c03ba979189885a78d0c'),
              'gd-U4-process-GoldCandidate-1280x800.png': (
                  'e2e/specs/graduation-v9-process-visual.spec.mjs-snapshots/gd-U4-process-GoldCandidate-1280x800-chromium-linux.png',
                  '752fce4f40cb6e8844ced8c3d5c18236a5c126b9f43838d04653ebdc79b7e753'),
              'gd-U4-process-GoldCandidate-1440x900.png': (
                  'e2e/specs/graduation-v9-process-visual.spec.mjs-snapshots/gd-U4-process-GoldCandidate-1440x900-chromium-linux.png',
                  'b33ebcb5baa30a165441507ded4b67103857f3557a152f168c4be1d65c333c50'),
              'gd-U7-archive-GoldCandidate-1280x800.png': (
                  'e2e/specs/graduation-v9-archive-visual.spec.mjs-snapshots/gd-U7-archive-GoldCandidate-1280x800-chromium-linux.png',
                  'c858a8c18032b4f4793c6efbab4bef7aba85c179850d4073834a02142a231266'),
              'gd-U7-archive-GoldCandidate-1440x900.png': (
                  'e2e/specs/graduation-v9-archive-visual.spec.mjs-snapshots/gd-U7-archive-GoldCandidate-1440x900-chromium-linux.png',
                  '4e23d33def37d719ae796273f7e5a2c2111374f95870980d40aea409dd36df09'),
              'gd-U8-teacher-workbench-GoldCandidate-390x844.png': (
                  'e2e/specs/graduation-v9-teacher-mobile-visual.spec.mjs-snapshots/gd-U8-teacher-workbench-GoldCandidate-390x844-chromium-linux.png',
                  '672040f23f348dfe8409e833317e46c44709e9f5bdf41bd272cbbed707f965f4'),
              'gd-U8-teacher-workbench-GoldCandidate-375x812.png': (
                  'e2e/specs/graduation-v9-teacher-mobile-visual.spec.mjs-snapshots/gd-U8-teacher-workbench-GoldCandidate-375x812-chromium-linux.png',
                  '76093b94de993fecdea8bef753d24ee840b441f37eb1232d67d2012c445684e8'),
              'gd-U8-taskbook-GoldCandidate-390x844.png': (
                  'e2e/specs/graduation-v9-teacher-mobile-visual.spec.mjs-snapshots/gd-U8-taskbook-GoldCandidate-390x844-chromium-linux.png',
                  '6a2a3bf5a4447be83292d75153a1833d76c3548f02f02f540968b4dbb5955081'),
              'gd-U8-taskbook-GoldCandidate-375x812.png': (
                  'e2e/specs/graduation-v9-teacher-mobile-visual.spec.mjs-snapshots/gd-U8-taskbook-GoldCandidate-375x812-chromium-linux.png',
                  '8e80e68a08511ebf604a1e1b2b14cee1df8d548b42777e22d4e22e9744b2653f'),
          }

          for name, (destination, expected_sha) in baselines.items():
              matches = [p for p in root.rglob(name) if 'attachments' not in p.parts]
              if len(matches) != 1:
                  raise SystemExit(f'{name}: expected one canonical artifact file, got {matches}')
              source = matches[0]
              actual_sha = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(f'{name}: SHA mismatch {actual_sha} != {expected_sha}')
              target = Path(destination)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              print(f'GOLD {name} -> {target} sha256={actual_sha}')
          PY

      - name: Commit exact Gold baselines to U11 candidate
        run: |
          git status --short
          git add e2e/specs/*-visual.spec.mjs-snapshots/*.png
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 12
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(gd): freeze U11 Gold Master baselines'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
