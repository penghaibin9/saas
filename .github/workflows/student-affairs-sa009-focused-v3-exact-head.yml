name: Student Affairs SA-009 Focused V3 exact head

on:
  workflow_dispatch:
  push:
    branches:
      - audit/student-affairs-browser-runner-20260823
    paths:
      - 'audit-tests/student-affairs-sa009-bootstrap-v3.py'
      - 'audit-tests/student-affairs-sa009-browser-v3.spec.mjs'
      - 'audit-tests/student-affairs-sa009-verify-v3.py'
      - '.github/workflows/student-affairs-sa009-focused-v3-exact-head.yml'
  pull_request:
    branches:
      - audit/student-affairs-p0-p1-closeout-20260803
    paths:
      - 'audit-tests/student-affairs-sa009-bootstrap-v3.py'
      - 'audit-tests/student-affairs-sa009-browser-v3.spec.mjs'
      - 'audit-tests/student-affairs-sa009-verify-v3.py'
      - '.github/workflows/student-affairs-sa009-focused-v3-exact-head.yml'

permissions:
  contents: read

concurrency:
  group: student-affairs-sa009-focused-v3-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  sa009-focused-browser:
    name: SA-009 focused / managed dorm Browser lifecycle + MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_sa009_browser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_sa009_browser?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_sa009_browser?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_sa009_browser
      REDIS_URL: redis://127.0.0.1:6379/12
      REDIS_KEY_PREFIX: student-affairs-sa009-focused-v3
      JWT_SECRET: student-affairs-sa009-focused-v3-only
      JWT_SECRET_KEY: student-affairs-sa009-focused-v3-only
      PYTHONPATH: .
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_TARGET_SHA: 8576525eb95ee4dac8ce3dab3bb044eb175fc19c

    steps:
      - name: Checkout immutable audit runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: runner
          fetch-depth: 1

      - name: Checkout immutable application exact head
        uses: actions/checkout@v4
        with:
          ref: 8576525eb95ee4dac8ce3dab3bb044eb175fc19c
          path: app
          fetch-depth: 0

      - name: Assert exact heads and pristine product source
        run: |
          set -euo pipefail
          echo "tested_app_head=$(git -C app rev-parse HEAD)"
          echo "audit_runner_head=$(git -C runner rev-parse HEAD)"
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"
          test -z "$(git -C app status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/e2e/package-lock.json

      - name: Install backend, migrate Browser MySQL and publish IAM
        working-directory: app/backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          alembic upgrade head
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend
        run: |
          set -euo pipefail
          mkdir -p app/e2e/runtime-logs
          cd app/backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Bootstrap canonical SA-009 identities only (no dorm, no manager binding)
        working-directory: app/backend
        run: python ../../runner/audit-tests/student-affairs-sa009-bootstrap-v3.py

      - name: Start real Staff PC
        run: |
          set -euo pipefail
          cd app/frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/frontend.log
          exit 1

      - name: Install Chromium once and inject SA-009 focused spec
        run: |
          set -euo pipefail
          cp runner/audit-tests/student-affairs-sa009-browser-v3.spec.mjs app/e2e/specs/student-affairs-sa009-browser-v3.spec.mjs
          cd app/e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Run strict Browser First SA-009 dorm lifecycle
        id: journey_browser
        continue-on-error: true
        working-directory: app/e2e
        run: npx playwright test specs/student-affairs-sa009-browser-v3.spec.mjs

      - name: Verify manager binding, transfer, bed release, dorm ledger and audit truth in MySQL
        id: journey_mysql
        if: steps.journey_browser.outcome == 'success'
        continue-on-error: true
        working-directory: app/backend
        run: python ../../runner/audit-tests/student-affairs-sa009-verify-v3.py

      - name: Reassert immutable application source
        if: always()
        run: |
          set -euo pipefail
          echo "tested_app_head=$(git -C app rev-parse HEAD)"
          echo "audit_runner_head=$(git -C runner rev-parse HEAD)"
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"
          git -C app diff --exit-code
          git -C app diff --cached --exit-code
          unexpected="$(git -C app status --porcelain --untracked-files=all \
            | grep -v '^?? e2e/runtime-logs/' \
            | grep -v '^?? e2e/runtime-fixtures/control-plane-school-iam.json$' \
            | grep -v '^?? e2e/specs/student-affairs-sa009-browser-v3.spec.mjs$' \
            | grep -v '^?? e2e/student-affairs-sa009-browser-v3-evidence.json$' \
            | grep -v '^?? e2e/playwright-report/' \
            | grep -v '^?? e2e/test-results/' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected product worktree changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Show SA-009 focused outcomes and fail on any real blocker
        if: always()
        run: |
          echo "journey_browser=${{ steps.journey_browser.outcome }}"
          echo "journey_mysql=${{ steps.journey_mysql.outcome }}"
          test "${{ steps.journey_browser.outcome }}" = "success"
          test "${{ steps.journey_mysql.outcome }}" = "success"

      - name: Upload focused SA-009 Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-affairs-sa009-focused-v3-${{ github.run_id }}
          path: |
            app/e2e/playwright-report/
            app/e2e/test-results/
            app/e2e/student-affairs-sa009-browser-v3-evidence.json
            app/e2e/runtime-logs/
          if-no-files-found: ignore
          retention-days: 7
