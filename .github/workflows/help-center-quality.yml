name: Help Center Quality

on:
  pull_request:
    paths:
      - 'docs/help/**'
      - 'frontend/src/config/helpContent.js'
      - 'frontend/src/config/help/**'
      - 'frontend/src/config/helpCenterCore.js'
      - 'frontend/src/config/helpCenterModel.js'
      - 'frontend/src/config/helpCenterRuntime.js'
      - 'frontend/src/config/__tests__/**'
      - 'frontend/src/views/admin/help/**'
      - 'frontend/src/views/help/**'
      - 'frontend/src/main.js'
      - 'frontend/public/help/**'
      - 'miniapp/src/pages/common/help/**'
      - 'miniapp/src/pages/student/me/**'
      - 'miniapp/src/pages/teacher/me/**'
      - 'miniapp/src/pages.json'
      - 'miniapp/src/config/env.js'
      - 'backend/app/api/v1/help_metrics.py'
      - 'backend/app/api/v1/router.py'
      - 'backend/app/services/help_metrics_service.py'
      - 'backend/app/services/affairs_mental_service.py'
      - 'backend/tests/test_affairs_mental_scope_stable_identity.py'
      - 'scripts/validate_help_center.py'
      - '.github/workflows/help-center-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: help-center-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate governance, links, ids and assets
        run: python scripts/validate_help_center.py

      - name: Compile V3-08 metrics backend
        run: python -m py_compile backend/app/api/v1/help_metrics.py backend/app/services/help_metrics_service.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run help center tests
        working-directory: frontend
        run: |
          node --test \
            src/config/__tests__/helpCenterCore.test.js \
            src/config/__tests__/systemHelpCards.test.js \
            src/config/__tests__/foundationHelpCards.test.js \
            src/config/__tests__/studentDataHelpCards.test.js \
            src/config/__tests__/verifiedHelpOverrides.test.js \
            src/config/__tests__/studentAffairsVerifiedOverrides.test.js \
            src/config/__tests__/academicAffairsVerifiedOverrides.test.js \
            src/config/__tests__/academicAffairsKnowledgeCleaningV2.test.js \
            src/config/__tests__/academicAffairsCoreJourneyV3.test.js \
            src/config/__tests__/legacyHelpPolicy.test.js \
            src/config/__tests__/knowledgeCleaningV2.test.js \
            src/config/__tests__/mobileHelpCards.test.js \
            src/config/__tests__/mobileOperationsHelpCards.test.js \
            src/config/__tests__/studentAffairsMobileKnowledgeCleaningV2.test.js \
            src/config/__tests__/helpCenterV3.test.js \
            src/config/__tests__/helpCenterQualityV308.test.js \
            src/config/__tests__/roleScopeOwnershipHelpV3.test.js \
            src/config/__tests__/internshipCoreJourneyV3.test.js \
            src/config/__tests__/graduationCoreJourneyV3.test.js \
            src/config/__tests__/studentAffairsCoreJourneyV3.test.js \
            src/config/__tests__/highFrequencyTroubleshootingV3.test.js

      - name: Build management PC
        working-directory: frontend
        run: npm run build
