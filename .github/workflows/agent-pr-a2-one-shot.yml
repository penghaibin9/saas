name: Agent PR-A2 one-shot

on:
  push:
    branches:
      - fix/system-audit-rbac-atomicity-20260813

permissions:
  contents: write

concurrency:
  group: agent-pr-a2-one-shot
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: '1'
      FILE_STORAGE_PROVIDER: local
      LOCAL_UPLOAD_DIR: /tmp/saas-ci-uploads
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/system-audit-rbac-atomicity-20260813
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Apply A2 in-session critical audit primitive
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          p = Path('backend/app/services/audit_log.py')
          text = p.read_text(encoding='utf-8')
          needle = '''def record(action: str, resource: str, detail: dict | None = None, result: str = "SUCCESS",\n           *, tenant_id: int | str | None = None) -> dict:\n'''
          helper = '''def record_critical_in_session(\n    db, action: str, resource: str, *, detail: dict | None = None, result: str = "SUCCESS",\n    tenant_id: int | str | None = None, resource_id: str | None = None,\n) -> dict:\n    """把 critical audit 加入调用方 DB session；本函数绝不 commit、绝不吞错。"""\n    if action not in CRITICAL_ACTIONS:\n        raise ValueError(f"{action} 不是 CRITICAL_ACTIONS，禁止误用 critical in-session API")\n    safe_detail = detail or {}\n    effective_tid = _effective_tenant_id(action, resource, safe_detail, tenant_id)\n    if effective_tid is None:\n        raise AuditPersistenceError(f"高危动作 {action} 缺少可验证租户上下文")\n    try:\n        from app.services import db_service\n        db_service.audit_insert_in_session(\n            db, action, resource, safe_detail, result,\n            tenant_id=int(effective_tid), resource_id=resource_id,\n        )\n        _DB_HEALTH["consecutiveFailures"] = 0\n    except Exception as exc:  # noqa: BLE001 — critical audit 必须 fail-closed\n        _DB_HEALTH["consecutiveFailures"] += 1\n        _DB_HEALTH["lastFailure"] = {\n            "occurredAt": _now_iso(), "action": action, "error": str(exc)[:200],\n        }\n        _logger.error(\n            "同事务高危审计写入失败 action=%s resource=%s err=%s", action, resource, exc\n        )\n        raise AuditPersistenceError(\n            f"高危动作 {action} 审计写入失败，业务事务必须回滚：{exc}"\n        ) from exc\n    return {\n        "action": action, "resource": resource, "result": result,\n        "tenantId": str(effective_tid), "detail": safe_detail,\n    }\n\n\ndef record(action: str, resource: str, detail: dict | None = None, result: str = "SUCCESS",\n           *, tenant_id: int | str | None = None) -> dict:\n'''
          if text.count(needle) != 1:
              raise SystemExit(f'audit_log.py anchor count={text.count(needle)}')
          p.write_text(text.replace(needle, helper, 1), encoding='utf-8')

          test_b64 = ''
          Path('backend/tests/test_critical_audit_atomicity.py').write_bytes(base64.b64decode(test_b64))
          PY
      - name: Compile A2 Python
        run: |
          python -m py_compile backend/app/services/audit_log.py backend/tests/test_critical_audit_atomicity.py
      - name: Run A2 atomicity MySQL contracts
        working-directory: backend
        run: pytest tests/test_critical_audit_atomicity.py tests/test_audit_fail_closed_actions.py tests/test_audit_evidence_integrity.py -q -p no:warnings
      - name: Commit exact A2 scope and remove one-shot workflow
        run: |
          rm .github/workflows/agent-pr-a2-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/audit_log.py backend/tests/test_critical_audit_atomicity.py .github/workflows/agent-pr-a2-one-shot.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(audit): add transactional critical audit primitive"
          git push origin HEAD:fix/system-audit-rbac-atomicity-20260813
