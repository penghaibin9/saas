name: Student Affairs Final Validation

on:
  push:
    branches:
      - codex/student-affairs-integration-20260727
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  final-validation:
    if: github.event_name == 'push' || github.head_ref == 'codex/student-affairs-integration-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography

      - name: Verify single Alembic head
        working-directory: backend
        run: |
          HEADS="$(alembic heads | awk '{print $1}')"
          echo "$HEADS"
          test "$(printf '%s\n' "$HEADS" | sed '/^$/d' | wc -l)" -eq 1
          printf '%s\n' "$HEADS" | grep -qx '0143_merge_affairs_material_ops'

      - name: Student affairs and migration tests
        id: affairs_tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          timeout 45m pytest tests/test_affairs_*.py tests/test_alembic*.py -q -x -p no:warnings --durations=30 2>&1 | tee ../student-affairs-pytest.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-affairs-pytest-log
          path: student-affairs-pytest.log
          retention-days: 1

      - name: Stop on student affairs test failure
        if: steps.affairs_tests.outputs.status != '0'
        run: exit 1

      - name: Internship regression gate
        working-directory: backend
        run: timeout 25m pytest tests/test_internship*.py -q -p no:warnings --durations=20

      - name: Control-plane and graduation gates
        run: |
          python scripts/check/validate-module-manifest.py
          node scripts/check/generate-capability-registry.mjs
          python scripts/check/check-control-plane-contracts.py
          python scripts/check/check-student-sensitive-contracts.py
          node scripts/check/check-graduation-production-gates.mjs

      - name: Management PC lint test build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          node ../scripts/check/scan-fixed-demo-credentials.mjs dist

      - name: Student PC lint build
        working-directory: student-portal
        run: |
          npm ci
          npm run lint
          npm run build
          node ../scripts/check/scan-fixed-demo-credentials.mjs dist

      - name: Miniapp H5 and WeChat builds
        working-directory: miniapp
        run: |
          npm ci
          npm run build:h5
          npm run build:mp-weixin
          node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin

      - name: Forbidden tracked files
        shell: bash
        run: |
          set -euo pipefail
          FILES="$(git ls-files)"
          BAD="$(echo "$FILES" | grep -E '(^|/)\.env$|\.db$|(^|/)dist/|(^|/)node_modules/|(^|/)unpackage/|\.pem$|\.key$|(^|/)\.ai-backup/|(^|/)_local-backup/|backend/_pfull3\.txt|backend/scripts/_sec_verify\.py|一键构建\.bat|docs/ui/.*\.(zip|pdf)$' || true)"
          RUNTIME="$(echo "$FILES" | grep -E '(^|/)(uploads|exports)/' | grep -vE 'docs/ui/|docs/[^/]*/ui/|/internship-backend/uploads/|backend/app/.*/exports/' || true)"
          BAD="$(printf '%s\n%s' "$BAD" "$RUNTIME" | grep -vE '^$' || true)"
          if [ -n "$BAD" ]; then
            printf '%s\n' "$BAD"
            exit 1
          fi
