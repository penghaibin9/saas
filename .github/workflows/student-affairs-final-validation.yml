name: Student Affairs Final Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: student-affairs-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  final-validation:
    if: github.head_ref == 'codex/student-affairs-leave-cutover-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/student-affairs-leave-cutover-20260727
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography

      - name: Verify and apply single Alembic head
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          HEADS="$(alembic heads | awk '{print $1}')"
          printf '%s\n' "$HEADS"
          test "$(printf '%s\n' "$HEADS" | sed '/^$/d' | wc -l)" -eq 1
          printf '%s\n' "$HEADS" | grep -qx '0144_affairs_leave_identity_cutover'
          alembic upgrade head

      - name: Leave cutover real MySQL tests
        id: leave_tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 35m pytest \
            tests/test_affairs_leave.py \
            tests/test_affairs_leave_cutover_contract.py \
            tests/test_affairs_leave_identity_cutover_contract.py \
            tests/test_affairs_dashboard.py \
            tests/test_campus_service.py \
            tests/test_affairs_four_end_core_flow_matrix.py \
            tests/test_affairs_four_end_hardening.py \
            tests/test_affairs_four_end_review_round2.py \
            tests/test_affairs_four_end_terminal_guard.py \
            tests/test_affairs_route_mount_contract.py \
            -q -s -p no:warnings --durations=30 2>&1 | tee ../student-affairs-leave-pytest.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-affairs-leave-pytest-log
          path: student-affairs-leave-pytest.log
          retention-days: 2

      - name: Stop on leave cutover failure
        if: steps.leave_tests.outputs.status != '0'
        run: exit 1

      - name: Full student affairs MySQL tests
        id: affairs_tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 75m pytest tests/test_affairs_*.py -q -s -p no:warnings --durations=40 2>&1 | tee ../student-affairs-full-pytest.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-affairs-full-pytest-log
          path: student-affairs-full-pytest.log
          retention-days: 2

      - name: Stop on student affairs failure
        if: steps.affairs_tests.outputs.status != '0'
        run: exit 1

      - name: Internship regression gate
        id: internship_tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 35m pytest tests/test_internship*.py -q -p no:warnings --durations=30 2>&1 | tee ../internship-regression.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internship-regression-log
          path: internship-regression.log
          retention-days: 2

      - name: Stop on internship failure
        if: steps.internship_tests.outputs.status != '0'
        run: exit 1

      - name: Control-plane and graduation gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check/validate-module-manifest.py
          node scripts/check/generate-capability-registry.mjs
          python scripts/check/check-control-plane-contracts.py
          python scripts/check/check-student-sensitive-contracts.py
          node scripts/check/check-graduation-production-gates.mjs

      - name: Management PC lint test build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          node ../scripts/check/scan-fixed-demo-credentials.mjs dist

      - name: Student PC lint build
        working-directory: student-portal
        run: |
          npm ci
          npm run lint
          npm run build
          node ../scripts/check/scan-fixed-demo-credentials.mjs dist

      - name: Miniapp H5 and WeChat builds
        working-directory: miniapp
        run: |
          npm ci
          npm run build:h5
          npm run build:mp-weixin
          node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin

      - name: Forbidden tracked files
        shell: bash
        run: |
          set -euo pipefail
          FILES="$(git ls-files)"
          BAD="$(echo "$FILES" | grep -E '(^|/)\.env$|\.db$|\.pyc$|(^|/)__pycache__/|(^|/)dist/|(^|/)node_modules/|(^|/)unpackage/|\.pem$|\.key$|(^|/)\.ai-backup/|(^|/)_local-backup/|backend/_pfull3\.txt|backend/scripts/_sec_verify\.py|一键构建\.bat|docs/ui/.*\.(zip|pdf)$' || true)"
          RUNTIME="$(echo "$FILES" | grep -E '(^|/)(uploads|exports)/' | grep -vE 'docs/ui/|docs/[^/]*/ui/|/internship-backend/uploads/|backend/app/.*/exports/' || true)"
          BAD="$(printf '%s\n%s' "$BAD" "$RUNTIME" | grep -vE '^$' || true)"
          if [ -n "$BAD" ]; then
            printf '%s\n' "$BAD"
            exit 1
          fi
