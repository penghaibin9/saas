name: Student Affairs SA-004 scholarship browser audit exact head

on:
  push:
    branches:
      - audit/student-affairs-browser-runner-20260823
    paths:
      - 'audit-tests/student-affairs-scholarship-browser-audit.spec.mjs'
      - 'audit-tests/student-affairs-scholarship-browser-finalize.spec.mjs'
      - '.github/workflows/student-affairs-scholarship-browser-audit-exact-head.yml'
  pull_request:
    paths:
      - 'audit-tests/student-affairs-scholarship-browser-audit.spec.mjs'
      - 'audit-tests/student-affairs-scholarship-browser-finalize.spec.mjs'
      - '.github/workflows/student-affairs-scholarship-browser-audit-exact-head.yml'

permissions:
  contents: read

jobs:
  scholarship-browser-audit:
    name: SA-004 exact-head / Chromium / isolated MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/14
      REDIS_KEY_PREFIX: student-affairs-scholarship-browser-audit
      JWT_SECRET: student-affairs-scholarship-browser-audit-only
      JWT_SECRET_KEY: student-affairs-scholarship-browser-audit-only
      PYTHONPATH: .
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_TARGET_SHA: e2ec86e79ea620ce6ed67491f7e040ae1edfbab8

    steps:
      - name: Checkout audit runner only
        uses: actions/checkout@v4
        with:
          ref: audit/student-affairs-browser-runner-20260823
          path: runner
          fetch-depth: 1

      - name: Checkout immutable application exact head
        uses: actions/checkout@v4
        with:
          ref: e2ec86e79ea620ce6ed67491f7e040ae1edfbab8
          path: app
          fetch-depth: 0

      - name: Assert tested application exact head
        run: |
          set -euo pipefail
          ACTUAL="$(git -C app rev-parse HEAD)"
          echo "tested_app_head=$ACTUAL"
          test "$ACTUAL" = "$E2E_TARGET_SHA"
          test -z "$(git -C app status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/student-portal/package-lock.json

      - name: Install backend and migrate isolated MySQL
        working-directory: app/backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend
        run: |
          mkdir -p app/e2e/runtime-logs
          cd app/backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Bootstrap focused canonical SA-004 identities and relations
        working-directory: app/backend
        run: |
          python - <<'PY'
          import json

          from app.services.identity_import_file_service import build_student_template, build_teacher_template
          from scripts.e2e_bootstrap_graduation_accounts_ci import _canonical_import, _workbook_with_rows
          from scripts.e2e_bootstrap_student_affairs_accounts import (
              CLASS_A,
              CLASS_B,
              COLLEGE,
              MAJOR,
              STABLE_PWD,
              TENANT,
              _req,
              ensure_org,
              list_users,
          )

          admin = _req(
              'POST', '/auth/login',
              headers={'X-Forwarded-For': '10.254.0.250'},
              body={'loginName': 'admin2', 'password': '123456', 'tenantCode': TENANT},
          )
          assert admin.get('code') == 0, admin
          token = admin['data']['accessToken']

          org = ensure_org(token)
          print('[sa004-bootstrap] org ready', json.dumps(org, ensure_ascii=False))

          teachers = _workbook_with_rows(
              build_teacher_template(),
              [
                  ['e2e_sa_admin', 'E2E学工处管理员', '学工处', '学工处管理员',
                   'STUDENT_AFFAIRS_ADMIN', '', ''],
                  ['e2e_college_admin', 'E2E学院管理员', COLLEGE, '学院管理员',
                   'COLLEGE_ADMIN', 'COLLEGE', COLLEGE],
                  ['e2e_counselor_a', 'E2E辅导员A', COLLEGE, '辅导员',
                   'COUNSELOR', 'CLASS', CLASS_A],
                  ['e2e_counselor_b', 'E2E辅导员B', COLLEGE, '辅导员',
                   'COUNSELOR', 'CLASS', CLASS_B],
              ],
          )
          students = _workbook_with_rows(
              build_student_template(),
              [['E2E20260001', 'E2E学生A', COLLEGE, MAJOR, CLASS_A, '2024', '男', '']],
          )
          _canonical_import(
              token,
              kind='teachers',
              content=teachers,
              idempotency_namespace='e2e-sa004-focused',
          )
          _canonical_import(
              token,
              kind='students',
              content=students,
              idempotency_namespace='e2e-sa004-focused',
          )

          users = list_users(token)
          required = [
              'e2e_sa_admin',
              'e2e_college_admin',
              'e2e_counselor_a',
              'e2e_counselor_b',
              'E2E20260001',
          ]
          missing = [name for name in required if name not in users]
          assert not missing, f'missing canonical SA-004 identities: {missing}'

          for index, login_name in enumerate(required, start=1):
              user = users[login_name]
              user_id = user.get('id') or user.get('userId')
              reset = _req('POST', f'/system/users/{user_id}/reset-password', token=token, body={})
              assert reset.get('code') == 0, (login_name, reset)
              reset_data = reset.get('data') or {}
              temp_password = (
                  reset_data.get('tempPassword')
                  or reset_data.get('temporaryPassword')
                  or reset_data.get('password')
              )
              assert temp_password, f'{login_name}: reset returned no temporary password'
              login = _req(
                  'POST', '/auth/login',
                  headers={'X-Forwarded-For': f'10.254.0.{index}'},
                  body={
                      'loginName': login_name,
                      'password': temp_password,
                      'tenantCode': TENANT,
                  },
              )
              assert login.get('code') == 0, (login_name, login)
              changed = _req(
                  'POST', '/auth/change-password',
                  token=login['data']['accessToken'],
                  body={'oldPassword': temp_password, 'newPassword': STABLE_PWD},
              )
              assert changed.get('code') == 0, (login_name, changed)

          users = list_users(token)

          def ensure_primary_counselor(class_name, login_name):
              class_id = int(org['classIds'][class_name])
              counselor_id = int(users[login_name].get('id') or users[login_name].get('userId'))
              listed = _req(
                  'GET', '/student-affairs/counselor-assignments', token=token,
                  params={'classId': class_id, 'pageSize': 100},
              )
              assert listed.get('code') == 0, (class_name, listed)
              rows = (listed.get('data') or {}).get('items') or []
              active = next(
                  (
                      row for row in rows
                      if row.get('status') == 'ACTIVE'
                      and row.get('dutyType') == 'PRIMARY'
                      and int(row.get('userId') or 0) == counselor_id
                  ),
                  None,
              )
              if active:
                  return active.get('assignmentId') or active.get('id')
              created = _req(
                  'POST', '/student-affairs/counselor-assignments', token=token,
                  body={
                      'classId': class_id,
                      'userId': counselor_id,
                      'dutyType': 'PRIMARY',
                      'reason': 'SA-004 exact-head Browser First isolated fixture',
                  },
              )
              assert created.get('code') == 0, (class_name, login_name, created)
              return (created.get('data') or {}).get('assignmentId') or (created.get('data') or {}).get('id')

          relation_a = ensure_primary_counselor(CLASS_A, 'e2e_counselor_a')
          relation_b = ensure_primary_counselor(CLASS_B, 'e2e_counselor_b')
          print('[sa004-bootstrap] canonical identities/passwords/relations ready', {
              'accounts': required,
              'classAPrimary': relation_a,
              'classBPrimary': relation_b,
          })
          PY

      - name: Start official external scheduler
        run: |
          cd app/backend
          nohup python scripts/run_scheduled_jobs.py > ../e2e/runtime-logs/scheduler.log 2>&1 &
          sleep 2

      - name: Start real staff PC and student PC
        run: |
          cd app/frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          cd ../student-portal
          npm ci
          VITE_BASE=/portal/ VITE_API_BASE_URL=/ VITE_PROXY_TARGET=http://127.0.0.1:8000 nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-portal.log 2>&1 &

      - name: Wait for real browser applications
        run: |
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login; do
            ok=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "Application not ready: $url"
              cat app/e2e/runtime-logs/*.log
              exit 1
            fi
          done

      - name: Install Chromium and inject SA-004 specs outside application commit
        run: |
          cp runner/audit-tests/student-affairs-scholarship-browser-audit.spec.mjs app/e2e/specs/student-affairs-scholarship-browser-audit.spec.mjs
          cp runner/audit-tests/student-affairs-scholarship-browser-finalize.spec.mjs app/e2e/specs/student-affairs-scholarship-browser-finalize.spec.mjs
          cd app/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Run strict Browser First scholarship journey
        working-directory: app/e2e
        run: npx playwright test specs/student-affairs-scholarship-browser-audit.spec.mjs

      - name: Backdate only captured SA-004 publicity in isolated MySQL
        working-directory: app/backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pymysql

          evidence = json.loads(Path('../e2e/student-affairs-scholarship-audit-evidence.json').read_text(encoding='utf-8'))
          app_id = int(evidence['applicationId'])
          conn = pymysql.connect(host='127.0.0.1', port=3306, user='root', password='e2e_root', database='student_lifecycle_e2e', charset='utf8mb4')
          with conn.cursor() as cur:
              cur.execute("SELECT status FROM t_affairs_funding_application WHERE id=%s", (app_id,))
              before = cur.fetchone()
              assert before and before[0] == 'PUBLICITY', before
              cur.execute("UPDATE t_affairs_funding_application SET publicity_at=UTC_TIMESTAMP() - INTERVAL 2 DAY WHERE id=%s AND status='PUBLICITY'", (app_id,))
              assert cur.rowcount == 1, cur.rowcount
          conn.commit()
          conn.close()
          print('[TIME-GATE] backdated captured application only:', app_id)
          PY

      - name: Run real browser finalization after controlled time gate
        working-directory: app/e2e
        run: npx playwright test specs/student-affairs-scholarship-browser-finalize.spec.mjs

      - name: Verify SA-004 MySQL authority, appeal, lifecycle and audit truth
        working-directory: app/backend
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          import pymysql

          evidence = json.loads(Path('../e2e/student-affairs-scholarship-audit-evidence.json').read_text(encoding='utf-8'))
          app_id = int(evidence['applicationId'])
          appeal_id = int(evidence['appealId'])
          batch_id = int(evidence['batchId'])
          conn = pymysql.connect(host='127.0.0.1', port=3306, user='root', password='e2e_root', database='student_lifecycle_e2e', charset='utf8mb4')
          with conn.cursor() as cur:
              cur.execute('''SELECT student_id, project_type, status, statement, check_snapshot_json,
                                    approved_amount, quota_reserved, version
                             FROM t_affairs_funding_application WHERE id=%s''', (app_id,))
              app = cur.fetchone()
              print('[APPLICATION]', app)
              assert app, app_id
              student_id = int(app[0])
              assert app[1] == 'SCHOLARSHIP', app
              assert app[2] == 'GRANTED', app
              assert app[3] == evidence['revisedStatement'], (app[3], evidence['revisedStatement'])
              snapshot = json.loads(app[4] or '{}')
              assert snapshot.get('type') == 'SCHOLARSHIP', snapshot
              assert snapshot.get('ok') is True, snapshot
              assert snapshot.get('ruleVersion'), snapshot
              assert snapshot.get('evaluatedAt'), snapshot
              assert Decimal(str(app[5])) == Decimal('3000.00'), app
              assert bool(app[6]) is True, app

              cur.execute('SELECT quota, reserved_quota, reserved_amount FROM t_affairs_funding_batch WHERE id=%s', (batch_id,))
              batch = cur.fetchone()
              print('[BATCH]', batch)
              assert batch, batch_id
              assert int(batch[1]) == 1, batch
              assert int(batch[1]) <= int(batch[0]), batch
              assert Decimal(str(batch[2])) == Decimal('3000.00'), batch

              cur.execute('SELECT status, result, reason, review_opinion, open_key FROM t_affairs_funding_appeal WHERE id=%s', (appeal_id,))
              appeal = cur.fetchone()
              print('[APPEAL]', appeal)
              assert appeal, appeal_id
              assert appeal[0] == 'CLOSED', appeal
              assert appeal[1] == 'OVERRULED', appeal
              assert appeal[2] == evidence['appealReason'], appeal
              assert appeal[3] == evidence['appealOpinion'], appeal
              assert appeal[4] is None, appeal

              cur.execute("SELECT COUNT(*) FROM t_student_stage_event WHERE student_id=%s AND to_stage='FUNDING_GRANTED' AND source_module='student-affairs'", (student_id,))
              stage_count = int(cur.fetchone()[0])
              print('[STAGE] FUNDING_GRANTED=', stage_count)
              assert stage_count == 1, stage_count

              cur.execute("SELECT action FROM t_affairs_audit_trail WHERE biz_type='FUNDING' AND biz_id=%s ORDER BY id", (app_id,))
              actions = [str(row[0]).upper() for row in cur.fetchall()]
              print('[AUDIT]', actions)
              required = {'APPLY', 'RETURNED', 'STUDENT_EDIT_RETURNED', 'STUDENT_RESUBMIT', 'TO_PUBLICITY', 'FUNDING_APPEAL_SUBMIT', 'FUNDING_APPEAL_REVIEW', 'GRANTED'}
              missing = required.difference(actions)
              assert not missing, (missing, actions)
          conn.close()

          assert evidence.get('exactHead') == __import__('os').environ['E2E_TARGET_SHA'], evidence
          assert evidence.get('finalizedExactHead') == __import__('os').environ['E2E_TARGET_SHA'], evidence
          assert evidence.get('finalStatus') == 'GRANTED', evidence
          assert evidence.get('studentGrantedVisible') is True, evidence
          print('[EVIDENCE]', json.dumps(evidence, ensure_ascii=False))
          PY

      - name: Reassert tested app source stayed immutable
        if: always()
        run: |
          echo "tested_app_head=$(git -C app rev-parse HEAD)"
          git -C app status --short
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"

      - name: Show runtime logs on failure
        if: failure()
        run: |
          for f in app/e2e/runtime-logs/*.log; do echo "===== $f ====="; tail -n 300 "$f" || true; done

      - name: Upload SA-004 strict evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-affairs-sa004-scholarship-audit-${{ github.run_id }}
          path: |
            app/e2e/playwright-report/
            app/e2e/test-results/
            app/e2e/student-affairs-scholarship-audit-evidence.json
            app/e2e/runtime-logs/
          if-no-files-found: ignore
          retention-days: 7
