name: 教务最终集成执行

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/academic-affairs-4ends
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'student-portal/**'
      - 'miniapp/**'
      - 'scripts/check/**'
      - '.github/workflows/academic-affairs-4ends.yml'

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: read

concurrency:
  group: academic-affairs-final-integration
  cancel-in-progress: false

jobs:
  integrate:
    name: 从最新 main 压缩集成教务四端成果
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: saas_test
          MYSQL_USER: saas
          MYSQL_PASSWORD: saas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      INTEGRATION_REV: '4'
      SOURCE_BRANCH: refactor/academic-affairs-4ends
      FINAL_BRANCH: integrate/academic-affairs-final-20260729
      SECOND_STAGE_MAIN: 7ffa498e8604c4ba6961e87807dbcbc522f67baa
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://saas:saas@127.0.0.1:3306/saas_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://saas:saas@127.0.0.1:3306/saas_test?charset=utf8mb4
      JWT_SECRET: ci-academic-affairs-final-integration-secret
      MOCK_LOGIN_ENABLED: 'false'
      APP_ENV: test
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout 教务施工源
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 发布运行中状态
        shell: bash
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"pending","context":"academic-affairs/final-integration","description":"正在从最新 main 执行教务最终压缩集成","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 执行最终集成、验证、推送与 Draft PR
        shell: bash
        run: bash scripts/check/run-academic-affairs-final-integration.sh

      - name: 发布最终状态
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success; DESC='教务最终集成、基础验证与分支推送完成' ;;
            cancelled) STATE=error; DESC='教务最终集成已取消' ;;
            *) STATE=failure; DESC='教务最终集成未通过，请查看运行日志' ;;
          esac
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"academic-affairs/final-integration\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
