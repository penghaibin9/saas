name: 教务四端专项验证

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/app/modules/academic_affairs/**'
      - 'backend/app/core/security.py'
      - 'backend/tests/test_aa_*.py'
      - 'backend/tests/test_security_student_identity.py'
      - 'frontend/src/modules/academicAffairs/**'
      - 'frontend/src/config/adminMenu.js'
      - 'student-portal/**'
      - 'miniapp/src/pages/student/academic-affairs/**'
      - 'miniapp/src/pages/teacher/academic-affairs/**'
      - 'miniapp/src/services/**'
      - '.github/workflows/academic-affairs-4ends.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-affairs-4ends-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-targeted:
    name: 教务后端 · MySQL定向测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: saas_test
          MYSQL_USER: saas
          MYSQL_PASSWORD: saas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://saas:saas@127.0.0.1:3306/saas_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://saas:saas@127.0.0.1:3306/saas_test?charset=utf8mb4
      JWT_SECRET: ci-academic-affairs-four-ends-secret
      MOCK_LOGIN_ENABLED: 'false'
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: Python语法与导入编译
        working-directory: backend
        run: python -m compileall -q app tests
      - name: 创建MySQL表
        working-directory: backend
        run: python -c "from app.db.session import get_engine; from app.models.base import Base; import app.models; Base.metadata.create_all(bind=get_engine())"
      - name: 教务P0/P1定向测试
        working-directory: backend
        run: >-
          pytest -q
          tests/test_aa_archive_semantic_gates.py
          tests/test_aa_evaluation_appeal_scope.py
          tests/test_aa_attendance_teacher_identity.py
          tests/test_aa_mobile_teacher_identity.py
          tests/test_aa_effective_grade_identity.py
          tests/test_aa_task_teaching_weeks.py
          tests/test_aa_task_scope_security.py
          tests/test_aa_scope_fail_closed.py
          tests/test_aa_student_schedule_merge.py
          tests/test_aa_student_exam_time.py
          tests/test_aa_graduation_program_resolution.py
          tests/test_security_student_identity.py
          --maxfail=1

  teacher-pc:
    name: 教师/教务PC · test + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  student-pc:
    name: 学生PC · lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: student-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  wechat-miniapp:
    name: 学生/教师微信小程序 · H5 + 微信构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run build:h5
      - run: npm run build:mp-weixin
