name: Agent PR107 F2 tenant scheduler closeout

on:
  push:
    branches:
      - fix/system-audit-rbac-atomicity-20260813
    paths:
      - .github/workflows/agent-pr107-f2-tenant-scheduler.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_f2
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_f2
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_f2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Reuse F patch, update renamed regression, and compile
        run: |
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/agent-pr107-f-tenant-scheduler.yml').read_text(encoding='utf-8')
          match = re.search(r'^\s*payload = "([A-Za-z0-9+/=]+)"\s*$', workflow, re.MULTILINE)
          if not match:
              raise SystemExit('F patch payload not found')
          patch_path = Path('/tmp/patch_pr107_f.py')
          patch_path.write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          python -m py_compile /tmp/patch_pr107_f.py
          python /tmp/patch_pr107_f.py
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/tests/test_audit_outbox_exactly_once.py')
          t = p.read_text(encoding='utf-8')
          old = '    monkeypatch.setattr(scheduler, "_schedulable_tenant_ids", lambda: [])\n'
          new = '    monkeypatch.setattr(scheduler, "_candidate_tenant_ids", lambda: [])\n'
          if t.count(old) != 1:
              raise SystemExit(f'F audit-outbox scheduler fixture anchor mismatch: {t.count(old)}')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile \
            backend/app/services/tenant_effective_state_service.py \
            backend/scripts/run_scheduled_jobs.py \
            backend/app/services/message_event_outbox_service.py \
            backend/tests/test_scheduler_tenant_effective_state.py \
            backend/tests/test_affairs_appeal_repair_scheduler.py \
            backend/tests/test_audit_outbox_exactly_once.py
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Upgrade fresh MySQL
        working-directory: backend
        run: |
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
      - name: Run tenant scheduler truth and regressions
        working-directory: backend
        run: |
          pytest -q -p no:warnings \
            tests/test_scheduler_tenant_effective_state.py \
            tests/test_affairs_appeal_repair_scheduler.py \
            tests/test_audit_outbox_exactly_once.py \
            tests/test_message_delivery_async.py \
            tests/test_stage_c1_future_effective.py \
            tests/test_message_channel_delivery.py \
            --timeout=300 --timeout-method=signal
      - name: Static fail-closed scheduler guard
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('backend/scripts/run_scheduled_jobs.py').read_text(encoding='utf-8')
          assert 'background_execution_policy' in text
          assert 'scheduler_tenant_skipped' in text
          assert 'BACKGROUND_BUSINESS_WRITE' in text
          assert 'Tenant.status.in_' not in text
          PY
      - name: Commit F source and clean temporary runners
        run: |
          rm \
            .github/workflows/agent-pr107-f-tenant-scheduler.yml \
            .github/workflows/agent-pr107-f2-tenant-scheduler.yml
          git config user.name penghaibin9
          git config user.email penghaibin9@gmail.com
          git add \
            backend/app/services/tenant_effective_state_service.py \
            backend/scripts/run_scheduled_jobs.py \
            backend/app/services/message_event_outbox_service.py \
            backend/tests/test_scheduler_tenant_effective_state.py \
            backend/tests/test_affairs_appeal_repair_scheduler.py \
            backend/tests/test_audit_outbox_exactly_once.py \
            .github/workflows/agent-pr107-f-tenant-scheduler.yml \
            .github/workflows/agent-pr107-f2-tenant-scheduler.yml
          git diff --cached --check
          git commit -m "fix(scheduler): gate business jobs by tenant effective state"
          git push origin HEAD:fix/system-audit-rbac-atomicity-20260813
