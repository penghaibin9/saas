name: Academic B W2 Authority Consumers
# B-W2 is frozen at its recorded exact-head evidence. Later waves run their own targeted gates.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-b-w2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-mysql:
    name: EffectiveGrade + ScopeHead targeted truth
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: test
      DB_ENABLED: 'true'
      MOCK_LOGIN_ENABLED: 'true'
      JWT_SECRET: academic-b-w2-targeted-secret-at-least-32-bytes
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_w2?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_w2?charset=utf8mb4
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: academic_b_w2
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact W2 head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and migrate clean MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
      - name: Run only W2 affected contracts
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q -p no:warnings \
            tests/test_aa_selection_authority_consumer.py \
            tests/test_aa_selection.py::test_s11_prereq_and_passed_block \
            tests/test_aa_selection.py::test_s15_conflict_report \
            tests/test_aa_selection.py::test_s16_selection_result_merged_into_schedule \
            tests/test_aa_selection_canonical_service.py \
            tests/test_aa_selection_student_guard.py \
            --maxfail=1 \
            --junitxml=w2-junit.xml
      - name: Upload W2 JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-b-w2-junit-${{ github.sha }}
          path: backend/w2-junit.xml
          if-no-files-found: error
          retention-days: 14
