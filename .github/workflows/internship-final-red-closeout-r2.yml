name: internship-final-red-closeout-r2

on:
  push:
    branches:
      - fix/internship-prelaunch-p1p2-20260828

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore(internship): retry final red closeout' }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/internship-prelaunch-p1p2-20260828
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Reapply validated contract migration and close semantic drift
        run: |
          python - <<'PY'
          from pathlib import Path

          old_workflow = Path('../.github/workflows/internship-expected-version-closeout.yml')
          text = old_workflow.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("          PY\n", start)
          code = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in text[start:end].splitlines()
          )
          exec(compile(code, str(old_workflow), 'exec'), {'__name__': '__main__'})

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              value = p.read_text(encoding='utf-8')
              actual = value.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, got {actual}: {old!r}')
              p.write_text(value.replace(old, new), encoding='utf-8')

          # A never-reviewed enterprise must return to its pre-blacklist PENDING state;
          # clearing blacklist must never act as an implicit approval.
          replace_exact(
              'tests/test_internship_enterprise.py',
              'off["data"]["coopStatus"] == "ACTIVE"',
              'off["data"]["coopStatus"] == "PENDING"',
          )

          # The production compliance engine requires a stable advisor identity key.
          replace_exact(
              'tests/test_internship_student.py',
              'from app.models import InternshipAgreement, InternshipInsurance, InternshipRecord',
              'from app.models import InternshipAgreement, InternshipInsurance, InternshipRecord, User',
          )
          replace_exact(
              'tests/test_internship_student.py',
              '        rec.advisor_name = "张指导"',
              '        advisor = db.query(User).filter(\n'
              '            User.tenant_id == rec.tenant_id, User.status == "ACTIVE",\n'
              '            User.is_deleted.is_(False),\n'
              '        ).order_by(User.id).first()\n'
              '        assert advisor is not None\n'
              '        rec.advisor_user_id = advisor.id\n'
              '        rec.advisor_name = advisor.real_name or "张指导"',
          )

          # Staff enterprise mutations must carry the version displayed in the row.
          ui = Path('../frontend/src/modules/internship/views/InternshipEnterpriseListView.vue')
          value = ui.read_text(encoding='utf-8')
          replacements = [
              ("{ action: 'APPROVE', comment: reason || '' }", "{ action: 'APPROVE', comment: reason || '', expectedVersion: row.version }"),
              ("{ action: 'REJECT', comment: reason || '' }", "{ action: 'REJECT', comment: reason || '', expectedVersion: row.version }"),
              ("{ action: action.slice(5), reason: reason || '' }", "{ action: action.slice(5), reason: reason || '', expectedVersion: row.version }"),
              ("{ on: true, reason: reason || '' }", "{ on: true, reason: reason || '', expectedVersion: row.version }"),
              ("{ on: false }", "{ on: false, expectedVersion: row.version }"),
              ("this.confirm.visible = false\n        this.load()", "this.confirm.visible = false\n        await this.load()"),
          ]
          for old, new in replacements:
              if value.count(old) != 1:
                  raise SystemExit(f'enterprise UI expected exactly one match: {old!r}')
              value = value.replace(old, new)
          ui.write_text(value, encoding='utf-8')

          # S1 raced the legitimate multi-batch selector by checking count() while data was loading.
          e2e = Path('../e2e/pages/internship.page.mjs')
          value = e2e.read_text(encoding='utf-8')
          anchor = "    await expect(this.page.getByRole('button', { name: '实习请假' })).toBeVisible()\n\n    const batchSelector"
          replacement = "    await expect(this.page.getByRole('button', { name: '实习请假' })).toBeVisible()\n    await expect(this.page.getByText('正在加载实习信息…', { exact: true })).toBeHidden()\n\n    const batchSelector"
          if value.count(anchor) != 1:
              raise SystemExit(f'S1 helper expected exactly one loading anchor, got {value.count(anchor)}')
          e2e.write_text(value.replace(anchor, replacement), encoding='utf-8')
          PY

      - name: Syntax, ratchet and diff integrity
        run: |
          python -m py_compile \
            tests/test_internship_application.py \
            tests/test_internship_enterprise.py \
            tests/test_internship_match.py \
            tests/test_internship_p0_launch_blockers.py \
            tests/test_internship_p1_acceptance.py \
            tests/test_internship_p2_compliance.py \
            tests/test_internship_placement_snapshot_mysql.py \
            tests/test_internship_position.py \
            tests/test_internship_student.py
          python scripts/audit_tenant_queries.py --gate
          node --check ../e2e/pages/internship.page.mjs
          git diff --check

      - name: Targeted real-MySQL regression
        run: |
          timeout 20m pytest -q -p no:warnings \
            tests/test_internship_application.py \
            tests/test_internship_enterprise.py \
            tests/test_internship_match.py \
            tests/test_internship_p0_launch_blockers.py \
            tests/test_internship_p1_acceptance.py \
            tests/test_internship_p2_compliance.py \
            tests/test_internship_placement_snapshot_mysql.py \
            tests/test_internship_position.py \
            tests/test_internship_student.py

      - name: Commit validated repairs and remove one-shot workflows
        working-directory: .
        run: |
          rm .github/workflows/internship-expected-version-closeout.yml
          rm .github/workflows/internship-final-red-closeout-r2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/internship-expected-version-closeout.yml \
            .github/workflows/internship-final-red-closeout-r2.yml \
            backend/tests/test_internship_application.py \
            backend/tests/test_internship_enterprise.py \
            backend/tests/test_internship_match.py \
            backend/tests/test_internship_p0_launch_blockers.py \
            backend/tests/test_internship_p1_acceptance.py \
            backend/tests/test_internship_p2_compliance.py \
            backend/tests/test_internship_placement_snapshot_mysql.py \
            backend/tests/test_internship_position.py \
            backend/tests/test_internship_student.py \
            frontend/src/modules/internship/views/InternshipEnterpriseListView.vue \
            e2e/pages/internship.page.mjs
          git diff --cached --check
          git commit -m 'fix(internship): close remaining CI contract drift'
          git push origin HEAD:fix/internship-prelaunch-p1p2-20260828
