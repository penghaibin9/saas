name: Academic B W1 UI Mask Fix

on:
  push:
    branches: [agent/academic-b-schedule-selection]
    paths: ['.github/workflows/academic-b-w1-ui-mask-fix.yml']

permissions:
  contents: write

concurrency:
  group: academic-b-w1-ui-mask-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert isolated patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/modules/academicAffairs/views/AaSelectionConsoleView.vue')
          text = path.read_text(encoding='utf-8')
          old = "    onConfirm() { const a = this.pendingAction; this.pendingAction = null; if (a) a() }"
          new = """    onConfirm() {
                const a = this.pendingAction
                this.pendingAction = null
                this.confirmVisible = false
                if (a) a()
              }"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one onConfirm target, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          grep -A6 -F 'onConfirm() {' frontend/src/modules/academicAffairs/views/AaSelectionConsoleView.vue | grep -F 'this.confirmVisible = false'
          git rm .github/workflows/academic-b-w1-ui-mask-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/modules/academicAffairs/views/AaSelectionConsoleView.vue
          git diff --cached --check
          git commit -m 'fix(academic-b): close lifecycle confirm before command'
          git push origin HEAD:agent/academic-b-schedule-selection
