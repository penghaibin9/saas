name: Audit Academic AA-001 Term Calendar 20260827

on:
  pull_request:
    branches:
      - fix/academic-affairs-final-rc-20260824
    paths:
      - '.github/workflows/audit-academic-aa001-term-calendar-20260827.yml'
      - 'e2e/specs/academic-affairs-term-calendar-convenience.spec.mjs'
      - 'backend/scripts/e2e_assert_academic_aa001_term_calendar.py'

permissions:
  contents: read

concurrency:
  group: audit-academic-aa001-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  term-calendar-gold:
    name: exact product / calendar Browser / MySQL audit seal
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: academic_aa001_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      TARGET_SHA: ${{ github.event.pull_request.base.sha }}
      RUNNER_SHA: ${{ github.event.pull_request.head.sha }}
      SCHOOL_IAM_AUTHORITY_EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_aa001_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_aa001_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: academic_aa001_e2e
      REDIS_URL: redis://127.0.0.1:6379/11
      REDIS_KEY_PREFIX: academic-aa001-final-rc
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '3'
      JWT_SECRET: academic-aa001-browser-only-not-production
      JWT_SECRET_KEY: academic-aa001-browser-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Assert clean product head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          echo "AA-001 exact product SHA: $TARGET_SHA"

      - name: Checkout audit-only harness
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RUNNER_SHA }}
          path: audit-harness
          fetch-depth: 1

      - name: Overlay only AA-001 audit files
        run: |
          set -euo pipefail
          test "$(git -C audit-harness rev-parse HEAD)" = "$RUNNER_SHA"
          cp audit-harness/e2e/specs/academic-affairs-term-calendar-convenience.spec.mjs e2e/specs/academic-affairs-term-calendar-convenience.spec.mjs
          cp audit-harness/backend/scripts/e2e_assert_academic_aa001_term_calendar.py backend/scripts/e2e_assert_academic_aa001_term_calendar.py
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Fast AA-001 source preflight
        run: |
          set -euo pipefail
          python -m py_compile backend/scripts/e2e_assert_academic_aa001_term_calendar.py
          node --check e2e/specs/academic-affairs-term-calendar-convenience.spec.mjs
          grep -q 'calendar_copy_preview' backend/app/modules/academic_affairs/services/academic_affairs_term_calendar_convenience_service.py
          grep -q '_audit(db, "AA_CALENDAR", e.id, "ADD"' backend/app/modules/academic_affairs/services/academic_affairs_service.py

      - name: Install backend and migrate isolated MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head

      - name: Replay production School IAM Authority
        working-directory: backend
        run: PYTHONPATH=. python scripts/bootstrap_control_plane_school_iam_authority.py

      - name: Seed isolated tenant
        working-directory: backend
        run: python scripts/e2e_seed_playwright_tenants.py

      - name: Seed real School IAM runtime fixture
        working-directory: backend
        run: PYTHONPATH=. python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend with mock login disabled
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend-aa001.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend-aa001.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend-aa001.log
          exit 1

      - name: Bootstrap canonical browser accounts
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py

      - name: Build and start Staff PC
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: ''
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend-aa001.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend-aa001.pid

      - name: Wait for Staff PC
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat e2e/runtime-logs/*.log
          exit 1

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run only AA-001 calendar copy Browser chain
        working-directory: e2e
        run: npx playwright test specs/academic-affairs-term-calendar-convenience.spec.mjs --grep "calendar copy preview" --workers=1 --retries=0 --reporter=line

      - name: Assert AA-001 Direct MySQL and audit final state
        working-directory: backend
        run: python scripts/e2e_assert_academic_aa001_term_calendar.py

      - name: Upload AA-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-aa001-product-evidence-${{ env.TARGET_SHA }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/academic-aa001-browser-outcome.json
            e2e/academic-aa001-mysql-seal.json
            e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
