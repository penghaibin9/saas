name: Main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical_pr_shard:
    name: Main / canonical shard ${{ matrix.shard }}
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate workflow syntax
        run: python scripts/check/validate-github-workflows.py
      - name: Run canonical PR regression shard
        shell: bash
        working-directory: backend
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: "4"
        run: |
          set -euo pipefail
          TARGETS="$(python ../scripts/check/select_pytest_targets.py)"
          test -n "$TARGETS"
          SHARD_TARGETS="$(TARGETS="$TARGETS" python - <<'PY'
          import os
          targets = os.environ["TARGETS"].split()
          index = int(os.environ["SHARD_INDEX"])
          count = int(os.environ["SHARD_COUNT"])
          print(" ".join(targets[index::count]))
          PY
          )"
          echo "Canonical shard ${SHARD_INDEX}/${SHARD_COUNT}: ${SHARD_TARGETS:-<empty>}"
          if [ -z "$SHARD_TARGETS" ]; then
            exit 0
          fi
          read -r -a TESTS <<< "$SHARD_TARGETS"
          timeout 9m pytest "${TESTS[@]}" -q -p no:warnings --durations=20

  canonical-release-gate:
    name: Main / canonical release gate
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    needs: canonical_pr_shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate canonical shard results
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.canonical_pr_shard.result }}
        run: |
          set -euo pipefail
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "Canonical shard aggregate = RED ($SHARD_RESULT)"
            exit 1
          fi
          echo "Canonical shard aggregate = GREEN"
      - name: 声明本闸门的真实覆盖范围（禁止被误读为全量发布门禁）
        if: always()
        shell: bash
        run: |
          {
            echo "### 本闸门覆盖范围"
            echo ""
            echo "绿灯含义：**本次 diff 命中的变更感知 pytest 子集**已被完整分配到 4 个独立 MySQL shard，且全部通过。"
            echo ""
            echo "绿灯**不**含义：当前 HEAD 全量后端回归 0 failed / 0 errors、四端 E2E 通过、"
            echo "迁移升级路径收敛。上线放行必须另看 \`发布放行全量回归\` 与 \`迁移升级路径收敛门禁\`。"
          } >> "$GITHUB_STEP_SUMMARY"

  release-readiness-full-regression:
    name: 发布放行全量回归
    # 定时与手动触发才跑：这才是"当前 HEAD 能不能上线"的权威口径。
    # PR 阶段不挂它，避免历史欠账把每个 PR 变成永久红灯；但它红就不许发版。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 全量后端回归（不做基线豁免）
        id: fullrun
        continue-on-error: true
        working-directory: backend
        run: pytest -q -p no:warnings --junitxml=full-regression.xml
      - name: 判定发布放行（0 failed / 0 errors 才允许发版）
        working-directory: backend
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("full-regression.xml").getroot()
          suites = root.iter("testsuite") if root.tag == "testsuites" else [root]
          bad = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          print(f"全量回归未通过用例数 = {bad}")
          if bad:
              print("发布放行 = RED：存在未通过用例，不得对外发版。")
              sys.exit(1)
          print("发布放行 = GREEN")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-regression-${{ github.sha }}
          path: backend/full-regression.xml
