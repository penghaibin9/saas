name: Main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-contract:
    name: Main / workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all workflow YAML
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python scripts/check/validate-github-workflows.py
      - name: Require reproducible Python dependency truth
        run: python scripts/check/check-python-lock.py
      - name: Freeze historical Alembic time-travel debt
        run: python scripts/check/check-migration-time-travel.py
      - name: Require N-1 rollback-compatible migration upgrades
        env:
          ROLLBACK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check/check-rollback-compatible-migrations.py
      - name: Reject canonical bypass patterns
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/main-canonical-release-gate.yml')
          text = p.read_text(encoding='utf-8')
          forbidden = [
              'select_' + 'pytest_targets',
              'backend-known-' + 'failures',
              'compare-' + 'pytest-junit-baseline',
              'continue-' + 'on-error',
          ]
          hits = [item for item in forbidden if item in text]
          pr_number_ref = 'github.event.pull_request.' + 'number'
          if text.count(pr_number_ref) > 1:
              hits.append('PR-number-specific canonical branch')
          if hits:
              raise SystemExit('canonical bypass pattern(s): ' + ', '.join(hits))
          PY

  migrated-schema:
    name: Main / fresh Alembic schema truth
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_migrated
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_migrated
      DB_ENABLED: "true"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_migrated
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frozen backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Require exactly one Alembic head
        run: |
          set -euo pipefail
          HEADS=$(python -m alembic heads | grep -c "(head)")
          python -m alembic heads
          test "$HEADS" = "1"
      - name: Upgrade an empty MySQL 8 database to head
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"
          python -m alembic upgrade head
          python -m alembic current
      - name: Require migrated schema to match ORM
        run: python ../scripts/check/check-migrated-schema-parity.py
      - name: Run migration-backed P0 facts without create_all
        run: |
          timeout 35m pytest -q -p no:warnings \
            tests/test_stage_c1_academic_fact.py \
            tests/test_stage_c1_future_effective.py \
            tests/test_stage_c2_historical_consumers.py \
            tests/test_stage_c3_archive_immutability.py \
            tests/test_import_tenant_isolation.py \
            tests/test_graduation_credit_dedup.py \
            --timeout=180 --timeout-method=signal --durations=20

  backend-full-regression:
    name: Main / backend full regression shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: "1"
      SHARD_TOTAL: "4"
      SHARD_INDEX: ${{ matrix.shard }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frozen backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Select deterministic test-file shard
        id: shard
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(python - <<'PY'
          import os
          from pathlib import Path
          shard = int(os.environ['SHARD_INDEX'])
          total = int(os.environ['SHARD_TOTAL'])
          files = sorted(str(p) for p in Path('tests').rglob('test_*.py'))
          selected = [p for i, p in enumerate(files) if i % total == shard]
          if not selected:
              raise SystemExit('empty pytest shard')
          print(' '.join(selected))
          PY
          )
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Shard ${SHARD_INDEX}/${SHARD_TOTAL}: $(wc -w <<<"$FILES" | tr -d ' ') test files"
      - name: Run every backend test in this shard
        shell: bash
        run: |
          set -euo pipefail
          timeout 85m pytest ${{ steps.shard.outputs.files }} -q -p no:warnings --durations=30

  security-contract:
    name: Main / production security truth
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_security
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_security
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frozen backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Run tenant, browser-session and general security contracts
        run: |
          pytest -q -p no:warnings \
            tests/test_production_truth_hardening.py \
            tests/test_security_hardening.py \
            tests/test_p1_unknown_tenant_fail_closed.py

  auth-redis-contract:
    name: Main / auth Redis security truth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_auth_redis
      FAST_TEST_SCHEMA: "1"
      REDIS_URL: redis://127.0.0.1:6379/15
      REDIS_KEY_PREFIX: canonical-auth-redis
      REDIS_CONNECT_TIMEOUT: "2"
      REDIS_SOCKET_TIMEOUT: "2"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_auth_redis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frozen backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Require Redis challenge and production fail-closed contracts
        run: |
          pytest -q -p no:warnings \
            tests/test_auth_challenge_service.py \
            tests/test_auth_captcha_redis_fail_closed.py
      - name: Require production Redis preflight to reject missing store
        run: |
          if env -u REDIS_URL APP_ENV=production DEPLOYMENT_MODE=production \
            python scripts/check_production_redis.py; then
            echo "production Redis preflight incorrectly allowed missing REDIS_URL"
            exit 1
          fi
      - name: Require production Redis preflight to accept verified store
        env:
          APP_ENV: production
          DEPLOYMENT_MODE: production
          ALLOW_LOCAL_REDIS_IN_PRODUCTION: "true"
        run: python scripts/check_production_redis.py

  frontend-production:
    name: Main / PC production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  student-portal-production:
    name: Main / student portal production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: student-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: VITE_BASE=/portal/ VITE_API_BASE_URL= npm run build
      - run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  miniapp-production:
    name: Main / miniapp production builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: miniapp
    env:
      VITE_API_BASE_URL: https://school-ci.invalid
      VITE_USE_MOCK: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          # handoff seal 合同要顺着 merge → seal → 实现提交解析，默认 fetch-depth=1
          # 在 pull_request 的 merge 提交上只有一个对象，解析不出来。
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:h5
      - run: npm run build:mp-weixin
      - name: Reject localhost API in production outputs
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIlE 'https?://(localhost|127\.0\.0\.1)(:8000)?' dist/build/h5 dist/build/mp-weixin | grep -q .; then
            echo "Production miniapp output contains localhost API"
            exit 1
          fi
      - run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin

  deployment-contract:
    name: Main / deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_deploy_contract
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_deploy_contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frozen backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Run production deployment and rollback failure-injection contracts
        run: |
          pytest -q -p no:warnings \
            tests/test_school_trial_deploy_contract.py \
            tests/test_release_rollback_restore_integration.py

  canonical-release-gate:
    name: Main / canonical release gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - workflow-contract
      - migrated-schema
      - backend-full-regression
      - security-contract
      - auth-redis-contract
      - frontend-production
      - student-portal-production
      - miniapp-production
      - deployment-contract
    steps:
      - name: Require every authoritative release check to succeed
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.workflow-contract.result }}" = "success"
          test "${{ needs.migrated-schema.result }}" = "success"
          test "${{ needs.backend-full-regression.result }}" = "success"
          test "${{ needs.security-contract.result }}" = "success"
          test "${{ needs.auth-redis-contract.result }}" = "success"
          test "${{ needs.frontend-production.result }}" = "success"
          test "${{ needs.student-portal-production.result }}" = "success"
          test "${{ needs.miniapp-production.result }}" = "success"
          test "${{ needs.deployment-contract.result }}" = "success"
          echo "Canonical release truth is green: migration truth + full MySQL backend + security + Redis + all clients + rollback-tested deployment"
