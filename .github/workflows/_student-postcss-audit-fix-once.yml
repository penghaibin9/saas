name: Student postcss audit fix once

on:
  push:
    branches: ["feat/adaptive-login-captcha-20260805"]
    paths:
      - ".github/workflows/_student-postcss-audit-fix-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-login-captcha-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - name: Upgrade vulnerable transitive production dependency
        working-directory: student-portal
        run: |
          npm audit fix --package-lock-only
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test
          npm run lint
          npm run build
      - name: Commit lockfile-only repair
        run: |
          test -z "$(git status --short -- student-portal/package.json)" || { echo "package.json changed unexpectedly"; exit 1; }
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-portal/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile update needed"
            exit 0
          fi
          git commit -m "fix(student): upgrade vulnerable postcss dependency"
          git push origin HEAD:feat/adaptive-login-captcha-20260805
