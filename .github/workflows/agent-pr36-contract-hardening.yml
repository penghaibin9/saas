name: Agent PR36 Contract Hardening

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: agent-pr36-contract-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.head_ref == 'fix/graduation-material-closeout-p0-review' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graduation-material-closeout-p0-review
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed contract hardening patch
        env:
          PATCH_B64: 
        run: |
          python - <<'PY'
          import base64, os, subprocess, zlib
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH_B64']))
          with open('/tmp/pr36-hardening.patch', 'wb') as fh:
              fh.write(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/pr36-hardening.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/pr36-hardening.patch'], check=True)
          PY

      - name: Repair archive test through public file upload
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/tests/test_graduation_risk_archive_stats.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from app.models import (FileObject, GraduationDefenseScore, GraduationFinal, GraduationGrade,',
              'from app.models import (GraduationDefenseScore, GraduationFinal, GraduationGrade,',
              1,
          )
          old = '''    db = get_sessionmaker()()
              file_obj = FileObject(
                  tenant_id=1000000000000000001, file_key=f"test/final-{gid}.docx",
                  file_name="final.docx", ext="docx", mime_type="application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                  size_bytes=128, sha256=f"{int(gid):064x}"[-64:], biz_type="GRADUATION_FINAL", biz_id=str(gid),
                  visibility="BIZ_SCOPED", status="AVAILABLE",
              )
              db.add(file_obj)
              db.flush()
              final = GraduationFinal(
                  tenant_id=1000000000000000001, gd_student_id=int(gid), final_type="定稿",
                  version="v1", submit_at=datetime.utcnow(), plagiarism_rate="8.0%",
                  plagiarism_status="已检测", status="APPROVED", attachments_json=[str(file_obj.id)],
              )
          '''
          new = '''    uploaded = graduation_client.post(
              "/api/v1/files", headers=h,
              files={"file": (
                  "final.pdf", b"%PDF-1.4 graduation final document", "application/pdf",
              )},
              params={"bizType": "GRADUATION_FINAL", "bizId": str(gid)},
          ).json()
          assert uploaded["code"] == 0, uploaded
          file_id = int(uploaded["data"]["fileId"])

          db = get_sessionmaker()()
          final = GraduationFinal(
              tenant_id=1000000000000000001, gd_student_id=int(gid), final_type="定稿",
              version="v1", submit_at=datetime.utcnow(), plagiarism_rate="8.0%",
              plagiarism_status="已检测", status="APPROVED", attachments_json=[str(file_id)],
          )
          '''
          if old not in text:
              raise SystemExit('archive test seed block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate patch syntax and whitespace
        run: |
          python -m py_compile \
            backend/app/api/v1/mobile_graduation_material_center.py \
            backend/app/modules/graduation/materials/command_service.py \
            backend/app/modules/graduation/materials/rule_service.py \
            backend/app/modules/graduation/routers/graduation_material_center.py \
            backend/app/modules/graduation/schemas/graduation.py \
            backend/tests/test_graduation_material_archived_rule_resolution.py \
            backend/tests/test_graduation_material_closeout_regressions.py \
            backend/tests/test_graduation_material_dynamic_permission_inventory.py \
            backend/tests/test_graduation_material_rule_archive_invariants.py \
            backend/tests/test_graduation_risk_archive_stats.py
          node --check frontend/src/modules/graduation/api/graduation-material-center.api.js
          git diff --check

      - name: Commit focused repair and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-pr36-contract-hardening.yml
          git add \
            .github/workflows/graduation-targeted-repair.yml \
            backend/app/api/v1/mobile_graduation_material_center.py \
            backend/app/modules/graduation/materials/command_service.py \
            backend/app/modules/graduation/materials/rule_service.py \
            backend/app/modules/graduation/routers/graduation_material_center.py \
            backend/app/modules/graduation/schemas/graduation.py \
            backend/tests/test_graduation_material_archived_rule_resolution.py \
            backend/tests/test_graduation_material_closeout_regressions.py \
            backend/tests/test_graduation_material_dynamic_permission_inventory.py \
            backend/tests/test_graduation_material_rule_archive_invariants.py \
            backend/tests/test_graduation_risk_archive_stats.py \
            frontend/src/modules/graduation/api/graduation-material-center.api.js
          git commit -m 'fix(graduation): close version permission and archive contracts'
          git push origin HEAD:fix/graduation-material-closeout-p0-review
