name: Student Affairs V3.1 SA-003 exact-head Gold Deep

on:
  push:
    branches:
      - audit/student-affairs-v31-final-runner-20260827
    paths:
      - '.github/workflows/student-affairs-v31-sa003-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sa003-gold-deep:
    name: SA-003 Browser First / scope negatives / MySQL / audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/14
      REDIS_KEY_PREFIX: student-affairs-v31-sa003
      JWT_SECRET: student-affairs-v31-sa003-secret-at-least-32-bytes
      JWT_SECRET_KEY: student-affairs-v31-sa003-secret-at-least-32-bytes
      PYTHONPATH: .
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_TARGET_SHA: 2019ca946ce2bc2c21dc9e76a8de0ce674c2d03d

    steps:
      - name: Checkout independent runner
        uses: actions/checkout@v4
        with:
          ref: audit/student-affairs-v31-final-runner-20260827
          path: runner
          fetch-depth: 1

      - name: Checkout immutable product exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.E2E_TARGET_SHA }}
          path: app
          fetch-depth: 1

      - name: Assert immutable product exact head
        run: |
          set -euo pipefail
          ACTUAL="$(git -C app rev-parse HEAD)"
          echo "tested_product_exact_sha=$ACTUAL"
          test "$ACTUAL" = "$E2E_TARGET_SHA"
          test -z "$(git -C app status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/student-portal/package-lock.json

      - name: Install backend, run focused contracts, migrate isolated MySQL
        working-directory: app/backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pytest -q \
            tests/test_discipline_package11_integrity.py::test_package11_static_contracts_are_installed \
            tests/test_affairs_appeal_result_message_events.py
          alembic upgrade head
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend
        run: |
          set -euo pipefail
          mkdir -p app/e2e/runtime-logs
          cd app/backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Bootstrap canonical SA-003 identities and both counselor scopes
        working-directory: app/backend
        run: |
          python - <<'PY'
          import json
          from app.services.identity_import_file_service import build_student_template, build_teacher_template
          from scripts.e2e_bootstrap_graduation_accounts_ci import _canonical_import, _workbook_with_rows
          from scripts.e2e_bootstrap_student_affairs_accounts import (
              CLASS_A, CLASS_B, COLLEGE, MAJOR, STABLE_PWD, TENANT,
              _req, ensure_org, list_users,
          )

          admin = _req(
              'POST', '/auth/login',
              headers={'X-Forwarded-For': '10.252.3.250'},
              body={'loginName': 'admin2', 'password': '123456', 'tenantCode': TENANT},
          )
          assert admin.get('code') == 0, admin
          token = admin['data']['accessToken']
          org = ensure_org(token)

          teachers = _workbook_with_rows(
              build_teacher_template(),
              [
                  ['e2e_sa_admin', 'E2E学工处管理员', '学工处', '学工处管理员', 'STUDENT_AFFAIRS_ADMIN', '', ''],
                  ['e2e_college_admin', 'E2E学院管理员', COLLEGE, '学院管理员', 'COLLEGE_ADMIN', 'COLLEGE', COLLEGE],
                  ['e2e_counselor_a', 'E2E辅导员A', COLLEGE, '辅导员', 'COUNSELOR', 'CLASS', CLASS_A],
                  ['e2e_counselor_b', 'E2E辅导员B', COLLEGE, '辅导员', 'COUNSELOR', 'CLASS', CLASS_B],
              ],
          )
          students = _workbook_with_rows(
              build_student_template(),
              [['E2E20260001', 'E2E学生A', COLLEGE, MAJOR, CLASS_A, '2024', '男', '']],
          )
          _canonical_import(token, kind='teachers', content=teachers, idempotency_namespace='e2e-sa003-v31')
          _canonical_import(token, kind='students', content=students, idempotency_namespace='e2e-sa003-v31')

          users = list_users(token)
          required = ['e2e_sa_admin', 'e2e_college_admin', 'e2e_counselor_a', 'e2e_counselor_b', 'E2E20260001']
          missing = [name for name in required if name not in users]
          assert not missing, f'missing canonical SA-003 identities: {missing}'

          for index, login_name in enumerate(required, start=1):
              user = users[login_name]
              user_id = user.get('id') or user.get('userId')
              reset = _req('POST', f'/system/users/{user_id}/reset-password', token=token, body={})
              assert reset.get('code') == 0, (login_name, reset)
              data = reset.get('data') or {}
              temp = data.get('tempPassword') or data.get('temporaryPassword') or data.get('password')
              assert temp, f'{login_name}: reset returned no temporary password'
              login = _req(
                  'POST', '/auth/login',
                  headers={'X-Forwarded-For': f'10.252.3.{index}'},
                  body={'loginName': login_name, 'password': temp, 'tenantCode': TENANT},
              )
              assert login.get('code') == 0, (login_name, login)
              changed = _req(
                  'POST', '/auth/change-password', token=login['data']['accessToken'],
                  body={'oldPassword': temp, 'newPassword': STABLE_PWD},
              )
              assert changed.get('code') == 0, (login_name, changed)

          users = list_users(token)
          def ensure_primary(class_name, login_name):
              class_id = int(org['classIds'][class_name])
              counselor_id = int(users[login_name].get('id') or users[login_name].get('userId'))
              listed = _req('GET', '/student-affairs/counselor-assignments', token=token,
                            params={'classId': class_id, 'pageSize': 100})
              assert listed.get('code') == 0, listed
              rows = (listed.get('data') or {}).get('items') or []
              active = next((row for row in rows if row.get('status') == 'ACTIVE'
                             and row.get('dutyType') == 'PRIMARY'
                             and int(row.get('userId') or 0) == counselor_id), None)
              if active:
                  return active.get('assignmentId') or active.get('id')
              created = _req('POST', '/student-affairs/counselor-assignments', token=token, body={
                  'classId': class_id, 'userId': counselor_id, 'dutyType': 'PRIMARY',
                  'reason': 'SA-003 V3.1 exact-head Browser First fixture',
              })
              assert created.get('code') == 0, created
              return (created.get('data') or {}).get('assignmentId') or (created.get('data') or {}).get('id')

          print(json.dumps({
              'classA': ensure_primary(CLASS_A, 'e2e_counselor_a'),
              'classB': ensure_primary(CLASS_B, 'e2e_counselor_b'),
          }, ensure_ascii=False))
          PY

      - name: Start real staff PC and student PC
        run: |
          set -euo pipefail
          cd app/frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          cd ../student-portal
          npm ci
          VITE_BASE=/portal/ VITE_API_BASE_URL=/ VITE_PROXY_TARGET=http://127.0.0.1:8000 nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-portal.log 2>&1 &

      - name: Wait for browser apps
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login; do
            ok=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            test -n "$ok" || { cat app/e2e/runtime-logs/*.log; exit 1; }
          done

      - name: Install Chromium and bind strict SA-003 spec to canonical endpoint
        run: |
          set -euo pipefail
          cp runner/audit-tests/student-affairs-discipline-browser-audit.spec.mjs app/e2e/specs/student-affairs-discipline-browser-audit.spec.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path('app/e2e/specs/student-affairs-discipline-browser-audit.spec.mjs')
          text = p.read_text(encoding='utf-8')
          old = r'\/review$/.test'
          new = r'\/decision-review$/.test'
          assert old in text, 'expected old appeal response matcher not found in runner spec'
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cd app/e2e
          npm install --package-lock=false
          npx playwright install --with-deps chromium

      - name: Run strict Browser First SA-003 journey
        working-directory: app/e2e
        run: npx playwright test specs/student-affairs-discipline-browser-audit.spec.mjs

      - name: Verify Direct MySQL truth, projection, history and audit trail
        working-directory: app/backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pymysql

          e = json.loads(Path('../e2e/student-affairs-discipline-audit-evidence.json').read_text(encoding='utf-8'))
          case_id = int(e['caseId'])
          conn = pymysql.connect(host='127.0.0.1', port=3306, user='root', password='e2e_root',
                                 database='student_lifecycle_e2e', charset='utf8mb4')
          with conn.cursor() as cur:
              cur.execute('SELECT disc_type,reason,doc_no,status,cs_discipline_id FROM t_affairs_discipline_case WHERE id=%s', (case_id,))
              case = cur.fetchone()
              assert case and case[0] == 'SERIOUS_WARNING', case
              assert case[1] == e['revisedReason'] and case[2] == e['revisedDocNo'], case
              assert case[3] == 'REMOVED' and case[4] is not None, case

              cur.execute('SELECT version_no,decision_kind,disc_type,reason,doc_no FROM t_affairs_discipline_decision_version WHERE case_id=%s ORDER BY version_no', (case_id,))
              versions = cur.fetchall()
              assert len(versions) == 2, versions
              assert versions[0][1] == 'ORIGINAL' and versions[0][2] == 'WARNING', versions
              assert versions[1][1] == 'REVISED' and versions[1][2] == 'SERIOUS_WARNING', versions
              assert versions[1][3] == e['revisedReason'] and versions[1][4] == e['revisedDocNo'], versions

              cur.execute('SELECT status,result,review_opinion FROM t_affairs_discipline_appeal WHERE case_id=%s AND is_deleted=0', (case_id,))
              appeal = cur.fetchone()
              assert appeal and appeal[0] == 'REVISED' and appeal[1] == 'REVISED', appeal
              assert appeal[2] == e['reviewOpinion'], appeal

              cur.execute('SELECT disc_type,reason,doc_no,status,record_status,source_case_id FROM t_cs_discipline WHERE id=%s', (int(case[4]),))
              projection = cur.fetchone()
              assert projection, projection
              assert projection[0] == 'SERIOUS_WARNING', projection
              assert projection[1] == e['revisedReason'] and projection[2] == e['revisedDocNo'], projection
              assert projection[3] == 'EFFECTIVE' and projection[4] == 'REVOKED' and int(projection[5]) == case_id, projection

              cur.execute("SELECT to_stage FROM t_student_stage_event WHERE source_module='student-affairs' AND student_id=(SELECT student_id FROM t_affairs_discipline_case WHERE id=%s)", (case_id,))
              stages = {row[0] for row in cur.fetchall()}
              for expected in ('DISCIPLINE_EFFECTIVE', 'DISCIPLINE_REVISED', 'DISCIPLINE_REMOVED'):
                  assert expected in stages, (expected, stages)

              cur.execute("SELECT action FROM t_affairs_audit_trail WHERE biz_type='DISCIPLINE' AND biz_id=%s ORDER BY id", (case_id,))
              actions = [row[0] for row in cur.fetchall()]
              for expected in ('REGISTER', 'SUBMIT', 'EFFECTIVE', 'REMOVE_SUBMIT', 'REMOVED'):
                  assert expected in actions, (expected, actions)

          conn.close()
          print('SA-003 MYSQL_AUDIT_PROJECTION_PASS', case_id)
          PY

      - name: Reassert tested product source stayed immutable
        if: always()
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"
          git -C app diff --exit-code
          git -C app diff --cached --exit-code
          unexpected="$(git -C app status --porcelain --untracked-files=all \
            | grep -v '^?? backend/tmp/' \
            | grep -v '^?? e2e/runtime-logs/' \
            | grep -v '^?? e2e/runtime-fixtures/control-plane-school-iam.json$' \
            | grep -v '^?? e2e/specs/student-affairs-discipline-browser-audit.spec.mjs$' \
            | grep -v '^?? e2e/student-affairs-discipline-audit-evidence.json$' \
            | grep -v '^?? e2e/playwright-report/' \
            | grep -v '^?? e2e/test-results/' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected product worktree changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Upload SA-003 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-affairs-v31-sa003-${{ env.E2E_TARGET_SHA }}-${{ github.run_id }}
          path: |
            app/e2e/student-affairs-discipline-audit-evidence.json
            app/e2e/test-results/
            app/e2e/playwright-report/
            app/e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
