name: Student Affairs Restart Export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/student-affairs-restart-export.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/student-affairs-p0-p1-closeout-20260803
      - name: Package current PR branch
        run: tar -czf /tmp/saas-pr39-current.tgz --exclude='./.git/hooks' .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: saas-pr39-current-${{ github.sha }}
          path: /tmp/saas-pr39-current.tgz
          retention-days: 1
          if-no-files-found: error
