name: Internship Standalone C08 G15 Report Quality

on:
  pull_request:
    branches: [ main ]
    paths:
      - "products/internship-platform/backend/app/models/internship_report_quality.py"
      - "products/internship-platform/backend/app/models/__init__.py"
      - "products/internship-platform/backend/alembic/versions/0008_yiyang_report_quality.py"
      - "products/internship-platform/backend/app/modules/internship/services/internship_report_quality_service.py"
      - "products/internship-platform/backend/app/modules/internship/services/internship_process_report_service.py"
      - "products/internship-platform/backend/app/modules/internship/services/internship_student_report_context_service.py"
      - "products/internship-platform/backend/app/modules/internship/routers/internship_process.py"
      - "products/internship-platform/backend/tests/test_yiyang_c08_g15_report_quality.py"
      - ".github/workflows/internship-standalone-c08-g15.yml"
  workflow_dispatch:

jobs:
  c08-g15:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: c08_test
          MYSQL_DATABASE: internship_c08
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pc08_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      PYTHONPATH: products/internship-platform/backend
      DATABASE_URL: mysql+pymysql://root:c08_test@127.0.0.1:3306/internship_c08?charset=utf8mb4
      JWT_SECRET: c08-actions-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: products/internship-platform/backend/requirements.txt
      - name: Install standalone backend dependencies
        run: python -m pip install -r products/internship-platform/backend/requirements.txt
      - name: Compile G15 authority
        run: |
          python -m py_compile             products/internship-platform/backend/app/models/internship_report_quality.py             products/internship-platform/backend/app/modules/internship/services/internship_report_quality_service.py             products/internship-platform/backend/app/modules/internship/services/internship_process_report_service.py             products/internship-platform/backend/app/modules/internship/services/internship_student_report_context_service.py             products/internship-platform/backend/app/modules/internship/routers/internship_process.py
      - name: Upgrade empty MySQL to ix0008
        run: alembic -c products/internship-platform/backend/alembic.ini upgrade ix0008
      - name: Verify G15 database facts
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          expected = {
              "t_internship_report_rule_config",
              "t_internship_report_version",
              "t_internship_report_review",
          }
          with engine.connect() as db:
              version = db.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
              tables = set(db.execute(text(
                  "SELECT table_name FROM information_schema.tables WHERE table_schema=DATABASE()"
              )).scalars())
          assert version == "ix0008", version
          assert expected <= tables, sorted(expected - tables)
          print({"version": version, "tables": sorted(expected)})
          PY
      - name: Run C08/G15 acceptance only
        run: pytest -q products/internship-platform/backend/tests/test_yiyang_c08_g15_report_quality.py
