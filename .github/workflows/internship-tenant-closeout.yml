name: internship-tenant-closeout

on:
  push:
    branches:
      - fix/internship-prelaunch-p1p2-20260828

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore(internship): finish tenant closeout' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/internship-prelaunch-p1p2-20260828
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Replace only CI-reported tenant-unsafe gets
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = {
              'backend/app/modules/internship/services/internship_communication_service.py': [49, 96, 97],
              'backend/app/modules/internship/services/internship_compliance_service.py': [218, 275, 491],
              'backend/app/modules/internship/services/internship_position_service.py': [110, 111, 334, 346, 377],
              'backend/app/modules/internship/services/internship_process_report_service.py': [105, 106, 196, 197],
              'backend/app/modules/internship/services/internship_risk_service.py': [229],
              'backend/app/modules/internship/services/internship_service.py': [74, 137, 142, 145, 148, 472, 567, 703, 704, 869, 870],
              'backend/app/modules/internship/services/internship_student_service.py': [74, 149, 150, 230, 232, 356, 503, 614],
          }
          import_line = 'from app.core.tenant_scoped import tenant_get\n'
          for path_str, line_numbers in targets.items():
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              for lineno in sorted(line_numbers):
                  index = lineno - 1
                  if index >= len(lines) or 'db.get(' not in lines[index]:
                      got = lines[index].rstrip() if index < len(lines) else '<EOF>'
                      raise SystemExit(f'{path_str}:{lineno}: expected db.get, got {got!r}')
                  lines[index] = lines[index].replace('db.get(', 'tenant_get(db, ', 1)
              updated = ''.join(lines)
              if import_line.strip() not in updated:
                  anchor = 'from __future__ import annotations\n'
                  if anchor not in updated:
                      raise SystemExit(f'{path_str}: missing future import anchor')
                  updated = updated.replace(anchor, anchor + '\n' + import_line, 1)
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Tenant isolation ratchet gate
        run: |
          cd backend
          python scripts/audit_tenant_queries.py --gate

      - name: Syntax and diff hygiene
        run: |
          python -m py_compile \
            backend/app/modules/internship/services/internship_communication_service.py \
            backend/app/modules/internship/services/internship_compliance_service.py \
            backend/app/modules/internship/services/internship_position_service.py \
            backend/app/modules/internship/services/internship_process_report_service.py \
            backend/app/modules/internship/services/internship_risk_service.py \
            backend/app/modules/internship/services/internship_service.py \
            backend/app/modules/internship/services/internship_student_service.py
          git diff --check

      - name: Commit validated tenant closeout and remove one-shot workflow
        run: |
          rm .github/workflows/internship-tenant-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/internship-tenant-closeout.yml \
            backend/app/modules/internship/services/internship_communication_service.py \
            backend/app/modules/internship/services/internship_compliance_service.py \
            backend/app/modules/internship/services/internship_position_service.py \
            backend/app/modules/internship/services/internship_process_report_service.py \
            backend/app/modules/internship/services/internship_risk_service.py \
            backend/app/modules/internship/services/internship_service.py \
            backend/app/modules/internship/services/internship_student_service.py
          git diff --cached --check
          git commit -m 'fix(internship): enforce tenant-safe primary-key reads'
          git push origin HEAD:fix/internship-prelaunch-p1p2-20260828
