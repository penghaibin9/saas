name: Student Affairs Failure Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

concurrency:
  group: student-affairs-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  management-final-repro:
    if: github.head_ref == 'codex/student-affairs-leave-cutover-20260727' && contains(github.event.pull_request.title, '[UI-DIAG]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/student-affairs-leave-cutover-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Reproduce final management gate
        id: reproduce
        shell: bash
        run: |
          set +e
          set -o pipefail
          (
            set -euo pipefail
            python scripts/check/validate-module-manifest.py
            node scripts/check/generate-capability-registry.mjs
            python scripts/check/check-control-plane-contracts.py
            python scripts/check/check-student-sensitive-contracts.py
            node scripts/check/check-graduation-production-gates.mjs
            cd frontend
            npm ci
            npm run lint
            npm test
            npm run build
            node ../scripts/check/scan-fixed-demo-credentials.mjs dist
          ) 2>&1 | tee management-final-repro.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-affairs-management-final-repro-log
          path: management-final-repro.log
          retention-days: 2
      - name: Stop on reproduction failure
        if: steps.reproduce.outputs.status != '0'
        run: exit 1
