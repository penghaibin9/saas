name: Student Affairs Failure Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

concurrency:
  group: student-affairs-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  control-graduation-diagnose:
    if: github.head_ref == 'codex/student-affairs-leave-cutover-20260727' && contains(github.event.pull_request.title, '[CTRL-DIAG]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/student-affairs-leave-cutover-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run control-plane and graduation diagnostics
        id: gates
        shell: bash
        run: |
          set +e
          set -o pipefail
          (
            set -euo pipefail
            python scripts/check/validate-module-manifest.py
            node scripts/check/generate-capability-registry.mjs
            python scripts/check/check-control-plane-contracts.py
            python scripts/check/check-student-sensitive-contracts.py
            node scripts/check/check-graduation-production-gates.mjs
          ) 2>&1 | tee control-graduation-diagnostic.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-graduation-diagnostic-log
          path: control-graduation-diagnostic.log
          retention-days: 2
      - name: Stop on gate failure
        if: steps.gates.outputs.status != '0'
        run: exit 1
