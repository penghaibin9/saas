name: Student Affairs Failure Diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

concurrency:
  group: student-affairs-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  internship-stage3-diagnose:
    if: github.head_ref == 'codex/student-affairs-leave-cutover-20260727' && contains(github.event.pull_request.title, '[INT-DIAG]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/student-affairs-leave-cutover-20260727
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run internship stage3 regression
        id: stage3
        working-directory: backend
        shell: bash
        run: |
          set +e
          set -o pipefail
          pytest tests/test_internship_stage3.py -q -s -p no:warnings 2>&1 | tee ../internship-stage3-diagnostic.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internship-stage3-diagnostic-log
          path: internship-stage3-diagnostic.log
          retention-days: 2
      - name: Stop on stage3 failure
        if: steps.stage3.outputs.status != '0'
        run: exit 1
