name: PR37 CI Closeout Agent

# One-shot branch-local construction workflow; removed after generated fixes commit.
on:
  push:
    branches:
      - agent/internship-production-hardening-20260803
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: pr37-ci-closeout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/internship-production-hardening-20260803' || github.ref_name == 'agent/internship-production-hardening-20260803'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply CI closeout fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('backend/alembic/versions/20260803_internship_prod_hardening.py')
          text = migration.read_text(encoding='utf-8')
          old = '''        "INSERT INTO t_internship_audit_trail "
                  "(tenant_id, target_id, target_type, action, operator_name, detail_json, occurred_at) "
                  "VALUES (:tenant_id, :target_id, :target_type, 'MIGRATION_DEDUPLICATE', "
                  ":operator_name, :detail_json, UTC_TIMESTAMP())"
          '''
          new = '''        "INSERT INTO t_internship_audit_trail "
                  "(tenant_id, target_id, target_type, action, operator_name, detail_json, "
                  "occurred_at, created_at, updated_at, is_deleted) "
                  "VALUES (:tenant_id, :target_id, :target_type, 'MIGRATION_DEDLICATE', "
                  ":operator_name, :detail_json, UTC_TIMESTAMP(), UTC_TIMESTAMP(), UTC_TIMESTAMP(), 0)"
          '''
          # Preserve the audit action spelling in the generated SQL.
          new = new.replace('MIGRATION_DEDLICATE', 'MIGRATION_DEDUPLICATE')
          if old in text:
              text = text.replace(old, new, 1)
          elif 'occurred_at, created_at, updated_at, is_deleted' not in text:
              raise SystemExit('migration audit insert anchor missing')
          migration.write_text(text, encoding='utf-8')

          portal = Path('student-portal/review/v5-full-review.mjs')
          text = portal.read_text(encoding='utf-8')
          old = '''  const purple = page.locator('.sp-theme__item[title="科技紫"]')
          await purple.click()
          await page.reload({ waitUntil: 'domcontentloaded' })
          await waitStable(page)
          const persistedTheme = await page.evaluate(() => document.documentElement.dataset.spTheme || '')
          report.functionalChecks.push({
            name: '主题切换后刷新保持',
            passed: persistedTheme === 'purple',
            actual: { persistedTheme },
            screenshot: await capture(page, outputDir, 'functional-theme-persistence', false)
          })
          '''
          new = '''  const persistenceTheme = config.themes.find((theme) => theme.key !== 'blue') || config.themes[0]
          if (!persistenceTheme?.key) throw new Error('review theme configuration is empty')
          await setTheme(page, persistenceTheme.key)
          await page.reload({ waitUntil: 'domcontentloaded' })
          await waitStable(page)
          const persistedTheme = await page.evaluate(() => document.documentElement.dataset.spTheme || '')
          report.functionalChecks.push({
            name: '主题切换后刷新保持',
            passed: persistedTheme === persistenceTheme.key,
            actual: { persistedTheme, expectedTheme: persistenceTheme.key },
            screenshot: await capture(page, outputDir, 'functional-theme-persistence', false)
          })
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'expectedTheme: persistenceTheme.key' not in text:
              raise SystemExit('portal theme persistence anchor missing')
          portal.write_text(text, encoding='utf-8')

          score = Path('backend/app/modules/internship/services/internship_score_service.py')
          text = score.read_text(encoding='utf-8')
          if 'from sqlalchemy.exc import IntegrityError' not in text:
              text = text.replace(
                  'from sqlalchemy import func, select\n',
                  'from sqlalchemy import func, select\nfrom sqlalchemy.exc import IntegrityError\n',
                  1,
              )
          old = '''        db.flush()
          _trail(db, c.id, "SAVE_CONFIG", {
              **parsed, "passLine": pass_line, "scopeKey": scope_key,
          }, operator=_op_name(user))
          db.commit()
          return {"ok": True, "configId": str(c.id), "configVersion": int(c.version or 0),
                  "batchId": str(c.batch_id) if c.batch_id else ""}
          '''
          new = '''        try:
              db.flush()
              _trail(db, c.id, "SAVE_CONFIG", {
                  **parsed, "passLine": pass_line, "scopeKey": scope_key,
              }, operator=_op_name(user))
              db.commit()
          except IntegrityError as exc:
              db.rollback()
              raise AppException(
                  "DATA_CONFLICT",
                  "同一批次的成绩配置已被其他管理员更新，请刷新后重试",
              ) from exc
          return {"ok": True, "configId": str(c.id), "configVersion": int(c.version or 0),
                  "batchId": str(c.batch_id) if c.batch_id else ""}
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif '同一批次的成绩配置已被其他管理员更新' not in text:
              raise SystemExit('score configuration save anchor missing')
          score.write_text(text, encoding='utf-8')

          test = Path('backend/tests/test_internship_ci_closeout_static.py')
          test.write_text('''from pathlib import Path

ROOT = Path(__file__).resolve().parents[2]


def _read(path):
    return (ROOT / path).read_text(encoding="utf-8")


def test_migration_audit_populates_base_model_columns():
    source = _read("backend/alembic/versions/20260803_internship_prod_hardening.py")
    block = source[source.index("def _write_dedup_audit"):source.index("def _normalize_record_duplicates")]
    assert "created_at, updated_at, is_deleted" in block
    assert block.count("UTC_TIMESTAMP()") >= 3


def test_portal_theme_persistence_uses_review_configuration():
    source = _read("student-portal/review/v5-full-review.mjs")
    assert "config.themes.find" in source
    assert "expectedTheme: persistenceTheme.key" in source


def test_score_config_unique_race_returns_business_conflict():
    source = _read("backend/app/modules/internship/services/internship_score_service.py")
    block = source[source.index("def save_config"):source.index("def _approved_enterprise_eval")]
    assert "except IntegrityError as exc" in block
    assert "db.rollback()" in block
    assert "同一批次的成绩配置已被其他管理员更新" in block
''', encoding='utf-8')
          PY
      - name: Validate closeout files
        run: |
          python -m py_compile \
            backend/alembic/versions/20260803_internship_prod_hardening.py \
            backend/app/modules/internship/services/internship_score_service.py \
            backend/tests/test_internship_ci_closeout_static.py
          node --check student-portal/review/v5-full-review.mjs
          git diff --check
      - name: Commit closeout fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/alembic/versions/20260803_internship_prod_hardening.py \
            backend/app/modules/internship/services/internship_score_service.py \
            backend/tests/test_internship_ci_closeout_static.py \
            student-portal/review/v5-full-review.mjs
          if git diff --cached --quiet; then
            echo 'PR37 CI closeout already committed'
            exit 0
          fi
          git commit -m 'fix: close PR37 migration and portal review failures'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
