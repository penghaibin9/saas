name: Control Plane E x IAM Joint Gold

on:
  workflow_dispatch:
  push:
    branches: [integration/control-plane-option-b-20260815]
    paths:
      - 'backend/app/core/permissions.py'
      - 'backend/app/services/module_access_service.py'
      - 'backend/app/services/scope_policy_service.py'
      - 'backend/tests/e_iam_joint_gold.py'
      - 'backend/tests/test_scope_policy_inheritance.py'
      - 'shared/contracts/permission-catalog*.json'
      - 'scripts/check/check-permission-catalog.py'
      - '.github/workflows/control-plane-e-iam-joint-gold.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/core/permissions.py'
      - 'backend/app/services/module_access_service.py'
      - 'backend/app/services/scope_policy_service.py'
      - 'backend/tests/e_iam_joint_gold.py'
      - 'backend/tests/test_scope_policy_inheritance.py'
      - 'shared/contracts/permission-catalog*.json'
      - 'scripts/check/check-permission-catalog.py'
      - '.github/workflows/control-plane-e-iam-joint-gold.yml'

permissions:
  contents: read

concurrency:
  group: control-plane-e-iam-joint-gold-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  DEPLOYMENT_MODE: local
  TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/e_iam_joint_gold?charset=utf8mb4
  DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/e_iam_joint_gold?charset=utf8mb4
  SECRET_KEY: control-plane-e-iam-joint-gold-secret
  JWT_SECRET: control-plane-e-iam-joint-gold-secret
  CONTROL_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  e-iam-joint-gold:
    name: Exact-head temporary integration + DENY matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: e_iam_joint_gold
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_HEAD }}
          fetch-depth: 0

      - name: Assert exact Control Plane HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_HEAD"
          mkdir -p artifacts/control-plane
          printf '%s\n' "$CONTROL_HEAD" > artifacts/control-plane/e-iam-control-head.txt

      - name: Fetch exact E-series PR 132 HEAD
        id: ehead
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/pull/132/head:refs/remotes/origin/e-series-pr-132'
          E_HEAD="$(git rev-parse refs/remotes/origin/e-series-pr-132)"
          test -n "$E_HEAD"
          echo "E_HEAD=$E_HEAD" >> "$GITHUB_ENV"
          echo "e_head=$E_HEAD" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$E_HEAD" > artifacts/control-plane/e-iam-e-series-head.txt
          echo "Control Plane HEAD: $CONTROL_HEAD"
          echo "E-series PR #132 HEAD: $E_HEAD"

      - name: Create local-only temporary integration merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'control-plane-joint-gold'
          git config user.email 'control-plane-joint-gold@invalid.local'

          # First attempt a normal two-parent merge.  We permit exactly one known integration
          # seam: route_registration.py.  Any second conflict is a new collision and fails closed.
          set +e
          git merge --no-ff --no-commit "$E_HEAD"
          MERGE_RC=$?
          set -e
          if [ "$MERGE_RC" -ne 0 ]; then
            mapfile -t UNMERGED < <(git diff --name-only --diff-filter=U)
            printf 'unmerged: %s\n' "${UNMERGED[@]}"
            test "${#UNMERGED[@]}" -eq 1
            test "${UNMERGED[0]}" = 'backend/app/api/v1/route_registration.py'

            # Start from Control Plane ownership, then inject only PR #132's E-series route
            # deltas.  This preserves platform_router/system_i4_router while adding the
            # enterprise/recruitment/student-selection surfaces.  No whole-side ours/theirs
            # strategy is allowed for the merge itself.
            git checkout --ours backend/app/api/v1/route_registration.py
            python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/api/v1/route_registration.py')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              '''        internship_communication, internship_complaint, internship_compliance,\n        internship_enterprise_eval_versioned, internship_insurance,\n        internship_match, internship_material_center, internship_participant,\n        internship_plan, internship_position, internship_process, internship_stats,\n        internship_student, internship_visit_plan,\n''',
              '''        internship_communication, internship_complaint, internship_compliance,\n        internship_enterprise_collaboration, internship_enterprise_eval_versioned,\n        internship_enterprise_portal, internship_insurance, internship_match, internship_material_center,\n        internship_participant, internship_plan, internship_position, internship_process,\n        internship_recruitment_campaign, internship_stats, internship_student, internship_visit_plan,\n''',
              'E-series internship router imports',
          )
          replace_once(
              '''        internship_communication, internship_visit_plan, internship_complaint, internship_compliance,\n        internship_enterprise_eval_versioned,\n    ):\n        api_router.include_router(r.router, dependencies=d)\n\n\ndef register_student_affairs_routes''',
              '''        internship_communication, internship_visit_plan, internship_complaint, internship_compliance,\n        internship_enterprise_eval_versioned, internship_recruitment_campaign,\n    ):\n        api_router.include_router(r.router, dependencies=d)\n\n    # Enterprise APIs intentionally stay outside the staff dependency bundle.\n    api_router.include_router(internship_enterprise_portal.router)\n    api_router.include_router(internship_enterprise_collaboration.router)\n\n\ndef register_student_affairs_routes''',
              'E-series staff/enterprise route ownership',
          )
          replace_once(
              '''    from app.api.v1.todos import make_router as make_todos_router\n    from app.modules.platform.routers import platform_router\n''',
              '''    from app.api.v1.todos import make_router as make_todos_router\n    from app.modules.internship.routers import internship_student_selection\n    from app.modules.platform.routers import platform_router\n''',
              'student selection import',
          )
          replace_once(
              '''    api_router.include_router(mobile_internship_leave_context.router)\n    api_router.include_router(mobile_internship_student.router)\n    api_router.include_router(student_portal_graduation_guard.router)\n''',
              '''    api_router.include_router(mobile_internship_leave_context.router)\n    api_router.include_router(mobile_internship_student.router)\n    api_router.include_router(internship_student_selection.mobile_router)\n    api_router.include_router(student_portal_graduation_guard.router)\n''',
              'student selection mobile route',
          )
          replace_once(
              '''    portal_gate = [Depends(enforce_student_portal_module_access)]\n    api_router.include_router(student_portal_internship_router, dependencies=portal_gate)\n    from app.api.v1 import student_portal_admin\n''',
              '''    portal_gate = [Depends(enforce_student_portal_module_access)]\n    api_router.include_router(student_portal_internship_router, dependencies=portal_gate)\n    api_router.include_router(internship_student_selection.portal_router)\n    from app.api.v1 import student_portal_admin\n''',
              'student selection portal route',
          )

          required = (
              'from app.modules.platform.routers import platform_router',
              'from app.modules.system_admin.routers import system_i4_router',
              'api_router.include_router(platform_router.router)',
              'api_router.include_router(system_i4_router.router, tags=["system"])',
              'internship_enterprise_portal',
              'internship_enterprise_collaboration',
              'internship_recruitment_campaign',
              'internship_student_selection.mobile_router',
              'internship_student_selection.portal_router',
          )
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'integration route resolution lost required owners: {missing}')
          if '<<<<<<<' in source or '=======' in source or '>>>>>>>' in source:
              raise SystemExit('conflict markers remain after semantic resolution')
          path.write_text(source, encoding='utf-8')
          PY
            git add backend/app/api/v1/route_registration.py
          fi

          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- backend/app/api/v1/route_registration.py
          git commit -m 'CI-only E x IAM temporary integration'

          INTEGRATION_HEAD="$(git rev-parse HEAD)"
          PARENTS="$(git show -s --format=%P HEAD)"
          test "$(printf '%s\n' "$PARENTS" | awk '{print $1}')" = "$CONTROL_HEAD"
          test "$(printf '%s\n' "$PARENTS" | awk '{print $2}')" = "$E_HEAD"
          echo "INTEGRATION_HEAD=$INTEGRATION_HEAD" >> "$GITHUB_ENV"
          printf '%s\n' "$INTEGRATION_HEAD" > artifacts/control-plane/e-iam-temporary-integration-head.txt
          printf '%s\n' "$PARENTS" > artifacts/control-plane/e-iam-temporary-integration-parents.txt
          git status --short
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Wait for MySQL
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then exit 0; fi
            sleep 2
          done
          echo 'MySQL did not become ready' >&2
          exit 1

      - name: Fresh MySQL one-head migration after temporary merge
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          HEAD_COUNT="$(alembic heads | grep -c '(head)' || true)"
          test "$HEAD_COUNT" = '1'
          alembic upgrade head
          alembic current

      - name: Shared IAM and internship permission contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check/check-permission-catalog.py --strict
          python scripts/check/check-internship-route-permissions.py
          python - <<'PY'
          from pathlib import Path
          routes = Path('backend/app/api/v1/route_registration.py').read_text(encoding='utf-8')
          recruitment = Path('backend/app/modules/internship/routers/internship_recruitment_campaign.py').read_text(encoding='utf-8')
          enterprise_ctx = Path('backend/app/modules/internship/dependencies/enterprise_context.py').read_text(encoding='utf-8')
          member = Path('backend/app/modules/internship/services/internship_enterprise_member_service.py').read_text(encoding='utf-8')
          access = Path('backend/app/modules/internship/services/internship_enterprise_access_service.py').read_text(encoding='utf-8')
          collab = Path('backend/app/modules/internship/services/internship_enterprise_collaboration_service.py').read_text(encoding='utf-8')

          assert '"intern": [Depends(require_staff), Depends(require_module("internship"))]' in routes
          assert 'from app.modules.platform.routers import platform_router' in routes
          assert 'from app.modules.system_admin.routers import system_i4_router' in routes
          assert 'api_router.include_router(platform_router.router)' in routes
          assert 'api_router.include_router(system_i4_router.router, tags=["system"])' in routes
          assert 'api_router.include_router(internship_enterprise_portal.router)' in routes
          assert 'api_router.include_router(internship_enterprise_collaboration.router)' in routes
          assert 'api_router.include_router(internship_student_selection.mobile_router)' in routes
          assert 'api_router.include_router(internship_student_selection.portal_router)' in routes
          assert '_MANAGE = require_any_permission("internship.recruitment.manage", "internship.enterprise.manage")' in recruitment
          assert 'resolve_active_grant_in_tx(' in enterprise_ctx
          assert 'InternshipCampaignEnterprise.status == "ACCEPTED"' in enterprise_ctx
          assert 'InternshipEnterpriseMember' in member and 'User' in member
          assert 'effective_grant_status(grant, now=now) != "ACTIVE"' in access
          assert 'InternshipRecord.enterprise_id == context.company_id' in collab
          assert 'InternshipRecord.batch_id == context.batch_id' in collab
          assert 'InternshipRecord.mentor_contact_id == mentor_contact_id' in collab
          print('E x IAM source authority contracts: OK')
          PY

      - name: Run E x IAM joint negative matrix
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/e_iam_joint_gold.py \
            tests/test_scope_policy_inheritance.py::test_t01_inherited_deny_blocks_children \
            tests/test_scope_policy_inheritance.py::test_t01_default_is_deny \
            tests/test_scope_policy_inheritance.py::test_t04_cannot_target_other_tenant_node \
            tests/test_scope_policy_inheritance.py::test_t04_policies_are_tenant_isolated \
            --disable-warnings | tee ../artifacts/control-plane/e-iam-deny-matrix.txt
          if grep -Eiq '([1-9][0-9]* skipped|[1-9][0-9]* xfailed|[1-9][0-9]* xpassed)' ../artifacts/control-plane/e-iam-deny-matrix.txt; then
            echo 'Joint Gold refuses skipped/xfail/xpass evidence' >&2
            exit 1
          fi

      - name: Reuse E-series enterprise Authority contracts
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_internship_enterprise_member.py \
            tests/test_internship_enterprise_access.py \
            tests/test_internship_enterprise_auth_context.py \
            tests/test_internship_enterprise_e9_facade_contract.py \
            tests/test_internship_enterprise_collaboration_canonical_contract.py \
            --disable-warnings | tee ../artifacts/control-plane/e-iam-e-authority-contracts.txt
          if grep -Eiq '([1-9][0-9]* skipped|[1-9][0-9]* xfailed|[1-9][0-9]* xpassed)' ../artifacts/control-plane/e-iam-e-authority-contracts.txt; then
            echo 'Joint Gold refuses skipped/xfail/xpass E-series evidence' >&2
            exit 1
          fi

      - name: Freeze exact-head joint evidence
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_REMOTE="$(git ls-remote origin 'refs/heads/integration/control-plane-option-b-20260815' | awk '{print $1}')"
          E_REMOTE="$(git ls-remote origin 'refs/pull/132/head' | awk '{print $1}')"
          test "$CONTROL_REMOTE" = "$CONTROL_HEAD"
          test "$E_REMOTE" = "$E_HEAD"
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              'controlHead': os.environ['CONTROL_HEAD'],
              'eSeriesHead': os.environ['E_HEAD'],
              'temporaryIntegrationHead': os.environ['INTEGRATION_HEAD'],
              'remoteBranchesMutated': False,
              'mysql': '8.0',
              'moduleEntitlementDeny': True,
              'normalTeacherRecruitmentManageDeny': True,
              'crossOrgAndTenantDeny': True,
              'schoolAdminEnterpriseApiDeny': True,
              'expiredEnterpriseGrantDeny': True,
              'wrongEnterpriseDeny': True,
              'mentorNonOwnedStudentFilter': True,
              'secondIamRootAbsent': True,
              'skipOrXfailAccepted': False,
              'gold': True,
          }
          path = Path('artifacts/control-plane/e-iam-joint-gold.json')
          path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload E x IAM joint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-e-iam-joint-gold-${{ env.CONTROL_HEAD }}
          path: artifacts/control-plane/
          if-no-files-found: warn
          retention-days: 14
