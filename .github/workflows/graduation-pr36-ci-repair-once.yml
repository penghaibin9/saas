name: PR36 validation repair once

on:
  push:
    branches:
      - fix/graduation-material-closeout-p0-review

permissions:
  contents: write

concurrency:
  group: graduation-pr36-ci-repair-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graduation-material-closeout-p0-review
          fetch-depth: 0

      - name: Restore clean pytest fixture
        run: |
          set -euo pipefail
          git fetch origin feat/graduation-material-center
          git show origin/feat/graduation-material-center:backend/tests/conftest.py > backend/tests/conftest.py
          python - <<'PY'
          from pathlib import Path
          fixture = Path('backend/tests/conftest.py')
          raw = fixture.read_bytes()
          if b'\0' in raw:
              raise SystemExit('restored conftest.py still contains NUL bytes')
          compile(raw.decode('utf-8'), str(fixture), 'exec')
          PY
          rm .github/workflows/graduation-pr36-ci-repair-once.yml
          python -m py_compile backend/tests/conftest.py
          node --check student-portal/review/v5-full-review.mjs
          git diff --check

      - name: Commit and push repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/conftest.py .github/workflows/graduation-pr36-ci-repair-once.yml
          git commit -m "fix(ci): restore clean pytest fixture"
          git push origin HEAD:fix/graduation-material-closeout-p0-review
