name: Academic B W6 Busy Code Patch

on:
  push:
    branches: [tmp/academic-b-w6-rate-code-20260816]
    paths:
      - '.github/workflows/academic-b-w6-rate-code-patch.yml'

permissions:
  contents: write

concurrency:
  group: academic-b-w6-rate-code-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact patch head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Replace only W6 busy envelope code
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py')
          source = path.read_text(encoding='utf-8')
          assert source.count('"SELECTION_BUSY",') == 2, 'unexpected busy-code occurrence count'
          assert source.count('details={"selectionCourseId": str(course_id)},') == 2, 'unexpected busy-details occurrence count'
          source = source.replace('"SELECTION_BUSY",', '"RATE_LIMITED",')
          source = source.replace(
              'details={"selectionCourseId": str(course_id)},',
              'details={"businessCode": "SELECTION_BUSY", "selectionCourseId": str(course_id)},',
          )
          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py
          git diff --check
      - name: Audit exact one-file production scope
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py'
      - name: Commit and fast-forward fixed B branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py
          git commit -m 'fix(academic-b): use frozen rate-limit code for peak backpressure'
          git push origin HEAD:agent/academic-b-schedule-selection
