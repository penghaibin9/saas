name: 阶段E发现项精确修复

on:
  pull_request:
    branches:
      - main
    paths:
      - performance/tools/apply_teacher_leave_source_fix.py
      - .github/workflows/capacity-source-repair.yml
      - backend/app/services/mobile_teacher_service.py

permissions:
  contents: write

concurrency:
  group: capacity-source-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    name: 教师工作台请假事实源修复
    if: github.head_ref == 'perf/capacity-observability-and-load-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      DB_ENABLED: "true"
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      JWT_SECRET: capacity-repair-secret-at-least-32-bytes
      MOCK_LOGIN_ENABLED: "true"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/capacity-observability-and-load-gates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 应用精确源码修复
        run: python performance/tools/apply_teacher_leave_source_fix.py
      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: 真实MySQL定向验证
        working-directory: backend
        run: |
          pytest -q -p no:warnings \
            tests/test_mobile.py::test_teacher_overview_ok \
            tests/test_mobile.py::test_teacher_todos_403_and_200 \
            --durations=10
      - name: 精确提交正式源码
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/app/services/mobile_teacher_service.py; then
            echo "正式源码已包含修复，无需重复提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/mobile_teacher_service.py
          git diff --cached --check
          git commit -m "fix(mobile): use student-affairs leave source in teacher workbench"
          git push origin HEAD:perf/capacity-observability-and-load-gates
