name: Student Affairs Final Main Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/student-affairs-final-sync.yml

permissions:
  contents: write

concurrency:
  group: student-affairs-final-main-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/student-affairs-p0-p1-closeout-20260803
      - name: Merge latest main and close Alembic graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path('backend/alembic/versions')
          revisions = {}
          parents = set()
          for path in root.glob('*.py'):
              tree = ast.parse(path.read_text(encoding='utf-8'))
              values = {}
              for node in tree.body:
                  if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                      key = node.targets[0].id
                      if key in {'revision', 'down_revision'}:
                          try:
                              values[key] = ast.literal_eval(node.value)
                          except Exception:
                              pass
              rev = values.get('revision')
              down = values.get('down_revision')
              if not rev:
                  continue
              revisions[rev] = down
              if isinstance(down, (tuple, list)):
                  parents.update(x for x in down if x)
              elif down:
                  parents.add(down)
          heads = sorted(set(revisions) - parents)
          print('heads before final merge:', heads)
          if len(heads) > 1:
              revision = '20260804_affairs_final_merge'
              if revision in revisions:
                  raise SystemExit(f'revision already exists but graph still has multiple heads: {heads}')
              target = root / '20260804_merge_affairs_latest_main_heads.py'
              target.write_text(
                  '"""Merge final student-affairs branch with latest main migration head.\n\n'
                  f'Revision ID: {revision}\nRevises: {", ".join(heads)}\nCreate Date: 2026-08-04\n"""\n'
                  'from __future__ import annotations\n\n'
                  f'revision = {revision!r}\n'
                  f'down_revision = {tuple(heads)!r}\n'
                  'branch_labels = None\n'
                  'depends_on = None\n\n\n'
                  'def upgrade() -> None:\n'
                  '    """Both parent branches already contain their schema changes."""\n\n\n'
                  'def downgrade() -> None:\n'
                  '    """Downgrade restores the parent heads without reversing schema."""\n',
                  encoding='utf-8',
              )
          elif len(heads) != 1:
              raise SystemExit(f'invalid Alembic graph heads: {heads}')
          PY
          git add backend/alembic/versions
          if ! git diff --cached --quiet; then
            git commit -m "fix(migration): merge latest main Alembic head"
          fi
          git push origin HEAD:audit/student-affairs-p0-p1-closeout-20260803
