name: Cleanup runs after 2026-08-18 18:50 GMT+8 - worker odd

on:
  push:
    branches: [cleanup/actions-after-20260818-1850-worker-odd-r1]

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Delete odd run IDs after cutoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for round in $(seq 1 120); do
            ids=$(gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.created_at >= "2026-08-18T10:50:00Z") | select(((.head_branch // "") | startswith("cleanup/actions-after-20260818-1850")) == false) | select((.id % 2) == 1) | [.id,.status] | @tsv')
            [ -z "$ids" ] && break
            while IFS=$'\t' read -r id status; do
              if [ "$status" = "completed" ]; then
                gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
              else
                gh api -X POST "repos/$REPO/actions/runs/$id/cancel" || true
              fi
            done <<< "$ids"
            sleep 8
          done
