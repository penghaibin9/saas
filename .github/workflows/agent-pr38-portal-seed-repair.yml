name: Agent PR38 Portal Seed Repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-pytest-fixture-corruption
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply portal seed repair
        run: python scripts/maintenance/agent_pr38_portal_seed_repair.py
      - name: Validate Python syntax
        run: python -m py_compile backend/tests/test_portal_graduation.py
      - name: Commit exact repair set
        run: |
          git config user.name 'OpenAI Repair Agent'
          git config user.email 'agent@openai.local'
          rm .github/workflows/agent-pr38-portal-seed-repair.yml scripts/maintenance/agent_pr38_portal_seed_repair.py
          git add backend/tests/test_portal_graduation.py
          git add -u .github/workflows/agent-pr38-portal-seed-repair.yml scripts/maintenance/agent_pr38_portal_seed_repair.py
          git commit -m 'test: seed real graduation batch and file contracts'
          git push origin HEAD:fix/main-pytest-fixture-corruption
