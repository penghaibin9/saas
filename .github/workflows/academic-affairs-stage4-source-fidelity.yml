name: 教务第四阶段施工源完整性核验

on:
  workflow_dispatch:
  push:
    branches:
      - integrate/academic-affairs-final-20260729

permissions:
  contents: write
  statuses: write

concurrency:
  group: academic-affairs-stage4-source-fidelity
  cancel-in-progress: true

jobs:
  source-fidelity:
    name: PR17 教务独占成果逐文件核验
    runs-on: ubuntu-latest
    steps:
      - name: 发布核验中状态
        shell: bash
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"pending","context":"academic-affairs/stage4-source-fidelity","description":"正在核对 PR17 教务独占成果完整性","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Checkout 最终验收分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 应用预警提醒真实落库修复
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "academic-affairs-stage4-bot"
          git config user.email "academic-affairs-stage4@users.noreply.github.com"
          git pull --ff-only origin integrate/academic-affairs-final-20260729
          python scripts/check/apply-stage4-warning-reminder-fix.py
          git add -- \
            backend/app/services/message_event_outbox_service.py \
            backend/app/modules/academic_affairs/services/academic_affairs_warning_service.py \
            backend/tests/test_aa_stage4_real_smoke.py
          if ! git diff --cached --quiet; then
            git commit -m "fix(academic-affairs): persist warning reminder message type"
            git push origin HEAD:integrate/academic-affairs-final-20260729
          fi

      - name: 核对施工源教务文件完整性
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main refactor/academic-affairs-4ends --prune

          MAIN=origin/main
          SOURCE=origin/refactor/academic-affairs-4ends
          FINAL=HEAD

          is_academic_owned() {
            case "$1" in
              backend/alembic/versions/0127_aa_*|\
              backend/alembic/versions/0128_aa_*|\
              backend/alembic/versions/0129_aa_*|\
              backend/alembic/versions/0130_aa_*|\
              backend/alembic/versions/0131_aa_*|\
              backend/alembic/versions/0132_aa_*|\
              backend/alembic/versions/0133_aa_*|\
              backend/alembic/versions/0134_aa_*|\
              backend/app/models/academic_affairs_*|\
              backend/app/models/academic_grade_extensions.py|\
              backend/app/modules/academic_affairs/*|\
              backend/app/student_portal/services/academic_*.py|\
              backend/tests/test_aa_*.py|\
              frontend/src/modules/academicAffairs/*|\
              student-portal/src/router/academicRoutes.js|\
              student-portal/src/views/academic/*|\
              miniapp/src/pages/student/academic-affairs/*|\
              miniapp/src/pages/teacher/academic-affairs/*|\
              miniapp/src/pages/teacher/academic-task/*|\
              miniapp/src/pages/teacher/academic-warning/*|\
              miniapp/src/pages/teacher/exam-defer/*|\
              miniapp/src/pages/teacher/my-schedule/*|\
              miniapp/src/services/academic*.js|\
              miniapp/src/stores/sessionAcademicPlugin.js)
                return 0 ;;
            esac
            return 1
          }

          is_allowed_final_remediation() {
            case "$1" in
              backend/app/modules/academic_affairs/services/academic_affairs_warning_service.py|\
              backend/app/student_portal/services/academic_evaluation_safety_facade.py|\
              backend/app/student_portal/services/academic_transcript_safety_facade.py)
                return 0 ;;
            esac
            return 1
          }

          : > /tmp/source-academic-files.txt
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            if is_academic_owned "$path"; then
              echo "$path" >> /tmp/source-academic-files.txt
            fi
          done < <(git diff --name-only --diff-filter=ACMRT "$MAIN...$SOURCE")
          sort -u -o /tmp/source-academic-files.txt /tmp/source-academic-files.txt

          TOTAL=$(wc -l < /tmp/source-academic-files.txt)
          if [[ "$TOTAL" -lt 250 ]]; then
            echo "教务独占文件识别数量异常：$TOTAL，拒绝继续"
            exit 1
          fi

          : > /tmp/missing.txt
          : > /tmp/unexpected-diff.txt
          : > /tmp/allowed-diff.txt
          EXACT=0

          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            if ! git cat-file -e "$FINAL:$path" 2>/dev/null; then
              echo "$path" >> /tmp/missing.txt
              continue
            fi

            SOURCE_BLOB=$(git rev-parse "$SOURCE:$path")
            FINAL_BLOB=$(git rev-parse "$FINAL:$path")
            if [[ "$SOURCE_BLOB" = "$FINAL_BLOB" ]]; then
              EXACT=$((EXACT + 1))
            elif is_allowed_final_remediation "$path"; then
              echo "$path" >> /tmp/allowed-diff.txt
            else
              echo "$path" >> /tmp/unexpected-diff.txt
            fi
          done < /tmp/source-academic-files.txt

          if grep -Fxq 'backend/app/modules/academic_affairs/services/academic_affairs_warning_service.py' /tmp/allowed-diff.txt; then
            grep -Fq 'event_code = "WARNING.REMINDED" if is_remind else "WARNING.CREATED"' \
              backend/app/modules/academic_affairs/services/academic_affairs_warning_service.py
            test "$(grep -Fc 'event_code=event_code' backend/app/modules/academic_affairs/services/academic_affairs_warning_service.py)" -eq 2
            grep -Fq '"WARNING.REMINDED"' backend/app/services/message_event_outbox_service.py
            grep -Fq '"message_type": "ACAD_WARNING_REMIND"' backend/app/services/message_event_outbox_service.py
            grep -Fq 'test_stage4_warning_reminder_persists_real_message_type' backend/tests/test_aa_stage4_real_smoke.py
          fi
          if grep -Fxq 'backend/app/student_portal/services/academic_evaluation_safety_facade.py' /tmp/allowed-diff.txt; then
            grep -Fq 'from app.services.mobile_student_service import _require_student' \
              backend/app/student_portal/services/academic_evaluation_safety_facade.py
            test "$(grep -Fc '_require_student(user)' backend/app/student_portal/services/academic_evaluation_safety_facade.py)" -ge 2
          fi
          if grep -Fxq 'backend/app/student_portal/services/academic_transcript_safety_facade.py' /tmp/allowed-diff.txt; then
            grep -Fq 'from app.services.mobile_student_service import _require_student' \
              backend/app/student_portal/services/academic_transcript_safety_facade.py
            grep -Fq 'student_user = _require_student(user)' \
              backend/app/student_portal/services/academic_transcript_safety_facade.py
            grep -Fq 'reason = "本人查询使用"' \
              backend/app/student_portal/services/academic_transcript_safety_facade.py
            grep -Fq '"official": False' \
              backend/app/student_portal/services/academic_transcript_safety_facade.py
            grep -Fq '"verifiable": False' \
              backend/app/student_portal/services/academic_transcript_safety_facade.py
          fi

          MISSING=$(wc -l < /tmp/missing.txt)
          UNEXPECTED=$(wc -l < /tmp/unexpected-diff.txt)
          ALLOWED=$(wc -l < /tmp/allowed-diff.txt)

          echo "施工源教务独占文件=$TOTAL，完全一致=$EXACT，已解释安全修复=$ALLOWED，缺失=$MISSING，未解释差异=$UNEXPECTED"
          if [[ "$MISSING" -gt 0 ]]; then
            echo '--- 缺失文件 ---'
            cat /tmp/missing.txt
          fi
          if [[ "$UNEXPECTED" -gt 0 ]]; then
            echo '--- 未解释内容差异 ---'
            cat /tmp/unexpected-diff.txt
          fi
          if [[ "$ALLOWED" -gt 0 ]]; then
            echo '--- 已解释最终安全修复 ---'
            cat /tmp/allowed-diff.txt
          fi

          {
            echo '## PR #17 → PR #23 教务独占成果核验'
            echo
            echo "- 施工源教务独占文件：$TOTAL"
            echo "- 内容完全一致：$EXACT"
            echo "- 最终验收安全修复差异：$ALLOWED"
            echo "- 缺失：$MISSING"
            echo "- 未解释差异：$UNEXPECTED"
            if [[ "$ALLOWED" -gt 0 ]]; then
              echo
              echo '### 已解释的最终安全修复'
              sed 's/^/- `/' /tmp/allowed-diff.txt | sed 's/$/`/'
            fi
            if [[ "$MISSING" -gt 0 ]]; then
              echo
              echo '### 缺失文件'
              sed 's/^/- `/' /tmp/missing.txt | sed 's/$/`/'
            fi
            if [[ "$UNEXPECTED" -gt 0 ]]; then
              echo
              echo '### 未解释内容差异'
              sed 's/^/- `/' /tmp/unexpected-diff.txt | sed 's/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$MISSING" -ne 0 || "$UNEXPECTED" -ne 0 ]]; then
            echo "第四阶段施工源完整性未通过"
            exit 1
          fi

          echo "第四阶段施工源完整性通过：$TOTAL 个教务独占文件全部存在，$EXACT 个内容一致，$ALLOWED 个为已验证安全修复。"

      - name: 发布最终核验状态
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) STATE=success; DESC='PR17 教务独占成果完整进入最终分支' ;;
            cancelled) STATE=error; DESC='教务施工源完整性核验已取消' ;;
            *) STATE=failure; DESC='教务施工源存在缺失或未解释差异' ;;
          esac
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"academic-affairs/stage4-source-fidelity\",\"description\":\"$DESC\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
