name: System UI Contract Validation

on:
  push:
    branches: [codex/system-management-ui-20260906]
    paths:
      - '.github/workflows/system-ui-contract-validation.yml'
      - 'docs/system-management-ui/baseline.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-ui-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze-source:
    name: Freeze exact source for system UI implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact source and frozen backend bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/system-ui-source"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/system-ui-source/HEAD.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/system-ui-source/git-tree.txt"
          git cat-file commit HEAD > "$RUNNER_TEMP/system-ui-source/commit.txt"
          sha256sum backend/app/modules/system_admin/routers/system_bundle.py > "$RUNNER_TEMP/system-ui-source/frozen-bundle.sha256"
          git archive --format=tar.gz --output="$RUNNER_TEMP/system-ui-source/source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/system-ui-source/source.tar.gz" > "$RUNNER_TEMP/system-ui-source/archive.sha256"
          printf 'Source captured at `%s`. No database, production credentials, migrations, or deployment were used.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: system-ui-exact-source-${{ github.sha }}
          path: ${{ runner.temp }}/system-ui-source/
          retention-days: 1
          if-no-files-found: error
