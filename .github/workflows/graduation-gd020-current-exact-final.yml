name: Graduation GD-020 current exact-head final seal

on:
  push:
    branches: [audit/graduation-gd020-current-final-20260827]
    paths:
      - '.github/workflows/graduation-gd020-current-exact-final.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graduation-gd020-current-exact-final
  cancel-in-progress: true

jobs:
  gd020:
    name: GD-020 exact SHA / Chromium / one MySQL / continuous journey
    runs-on: ubuntu-latest
    timeout-minutes: 95
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20

    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/13
      REDIS_KEY_PREFIX: graduation-gd020-current-final-20260827
      JWT_SECRET: graduation-gd020-seal-only-not-production
      JWT_SECRET_KEY: graduation-gd020-seal-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_EXPECTED_SHA: 5a86ff4fc58d97eabf2a3931d99074b8f1291716

    steps:
      - name: Checkout product exact HEAD
        uses: actions/checkout@v4
        with:
          ref: 5a86ff4fc58d97eabf2a3931d99074b8f1291716
          fetch-depth: 0

      - name: Assert exact product HEAD
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "PRODUCT_EXACT_HEAD=$actual"
          test "$actual" = "$E2E_EXPECTED_SHA"

      - name: Checkout GD-020 audit harness only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: audit-harness
          sparse-checkout: |
            e2e/specs/graduation-guidance-browser-audit.spec.mjs
            e2e/specs/graduation-midterm-browser-audit.spec.mjs
            e2e/specs/graduation-final-browser-audit.spec.mjs
            e2e/specs/graduation-review-browser-audit.spec.mjs
            e2e/specs/graduation-defense-browser-audit.spec.mjs
            e2e/specs/graduation-grade-browser-audit.spec.mjs
            e2e/specs/graduation-archive-browser-audit.spec.mjs
            e2e/scripts/graduation-specialist-accounts.py
            e2e/scripts/graduation-review-db-audit.py
            e2e/scripts/graduation-defense-db-audit.py
            e2e/scripts/graduation-grade-db-audit.py
            e2e/scripts/graduation-archive-db-audit.py
          sparse-checkout-cone-mode: false

      - name: Inject only GD-020 audit harness into product tree
        run: |
          set -euo pipefail
          cp audit-harness/e2e/specs/graduation-*-browser-audit.spec.mjs e2e/specs/
          mkdir -p e2e/scripts
          cp audit-harness/e2e/scripts/graduation-specialist-accounts.py e2e/scripts/
          cp audit-harness/e2e/scripts/graduation-*-db-audit.py e2e/scripts/
          rm -rf audit-harness
          test "$(git rev-parse HEAD)" = "$E2E_EXPECTED_SHA"
          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^e2e/' || true)"
          test -z "$bad"
          git status --short

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json

      - name: Install backend, migrate MySQL, seed IAM and tenants
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          alembic heads
          alembic upgrade head
          alembic current
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs e2e/test-results
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Bootstrap graduation accounts through real HTTP import
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py
          python ../e2e/scripts/graduation-specialist-accounts.py

      - name: Start staff PC
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend.pid

      - name: Start student PC
        env:
          VITE_BASE: /portal/
          VITE_API_BASE_URL: /
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd student-portal
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-portal.log 2>&1 &
          echo $! > ../e2e/runtime-logs/student-portal.pid

      - name: Wait for browser apps
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login; do
            ok=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              cat e2e/runtime-logs/*.log || true
              exit 1
            fi
          done

      - name: Apply isolated GD-020 runner continuation patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          edits = {
            'e2e/lib/api-fixture.mjs': [
              ('`PW-E2E-${runId}`', '`E2E-GD020-${runId}`'),
              ('`Playwright 毕设交互测试 ${runId}`', '`E2E-GD020 毕设批次 ${runId}`'),
              ('`Playwright 交互测试课题 ${runId}`', '`E2E-GD020 课题 ${runId}`'),
            ],
            'e2e/pages/graduation.page.mjs': [
              ('`Playwright 背景 ${suffix}：验证真实浏览器交互和数据持久化。`', '`E2E-GD020 背景 ${suffix}：验证真实浏览器交互和数据持久化。`'),
              ('`Playwright 计划 ${suffix}：学生提交、导师审核、管理员复核。`', '`E2E-GD020 计划 ${suffix}：学生提交、导师审核、管理员复核。`'),
              ('`Playwright 成果 ${suffix}：保留完整证据链。`', '`E2E-GD020 成果 ${suffix}：保留完整证据链。`'),
            ],
            'e2e/specs/graduation-midterm-browser-audit.spec.mjs': [
              (
                "    await loginStudent(page)\n    const student = new StudentGraduationPage(page, config.studentBaseUrl)\n    await student.open()\n    const midtermStep = page.locator('.gd-step').filter({ has: page.getByRole('heading', { name: '中期检查', exact: true }) }).first()",
                "    const resumeResponsePromise = page.waitForResponse((response) =>\n      response.url().includes('/api/v1/auth/browser-refresh') && response.request().method() === 'POST'\n    )\n    const student = new StudentGraduationPage(page, config.studentBaseUrl)\n    await student.open()\n    const resumeResponse = await resumeResponsePromise\n    expect(resumeResponse.ok(), `student browser-refresh HTTP ${resumeResponse.status()}`).toBeTruthy()\n    const midtermStep = page.locator('.gd-step').filter({ has: page.getByRole('heading', { name: '中期检查', exact: true }) }).first()",
              ),
            ],
            'e2e/specs/graduation-final-browser-audit.spec.mjs': [
              (
                "    await reachFinalCheckThroughUi(page, fixture)",
                "    if (process.env.GD020_CONTINUE_FROM_MIDTERM !== '1') await reachFinalCheckThroughUi(page, fixture)",
              ),
            ],
          }
          for raw, replacements in edits.items():
            path = Path(raw)
            text = path.read_text(encoding='utf-8')
            for old, new in replacements:
              assert old in text, (raw, old)
              text = text.replace(old, new)
            path.write_text(text, encoding='utf-8')
          PY
          test "$(git rev-parse HEAD)" = "$E2E_EXPECTED_SHA"
          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^e2e/' || true)"
          test -z "$bad"

      - name: Install Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: GD-020 A · real browser guidance
        id: guidance
        continue-on-error: true
        working-directory: e2e
        run: |
          set +e
          npx playwright test specs/graduation-guidance-browser-audit.spec.mjs
          rc=$?
          test -f test-results/junit.xml && cp test-results/junit.xml test-results/gd020-guidance-junit.xml
          exit $rc

      - name: GD-020 B · proposal reject/resubmit + midterm rectify/re-review
        id: midterm
        if: steps.guidance.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: |
          set +e
          npx playwright test specs/graduation-midterm-browser-audit.spec.mjs
          rc=$?
          test -f test-results/junit.xml && cp test-results/junit.xml test-results/gd020-midterm-junit.xml
          exit $rc

      - name: GD-020 C · final reject/resubmit + plagiarism recheck
        id: finalpw
        if: steps.midterm.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        env:
          GD020_CONTINUE_FROM_MIDTERM: '1'
        run: |
          set +e
          npx playwright test specs/graduation-final-browser-audit.spec.mjs
          rc=$?
          test -f test-results/junit.xml && cp test-results/junit.xml test-results/gd020-final-junit.xml
          exit $rc

      - name: GD-020 D · independent review
        id: reviewpw
        if: steps.finalpw.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: |
          set +e
          npx playwright test specs/graduation-review-browser-audit.spec.mjs
          rc=$?
          test -f test-results/junit.xml && cp test-results/junit.xml test-results/gd020-review-junit.xml
          exit $rc

      - name: GD-020 D · Direct MySQL independent review evidence
        id: reviewdb
        if: steps.reviewpw.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: python scripts/graduation-review-db-audit.py

      - name: GD-020 E · defense + second defense
        id: defensepw
        if: steps.reviewdb.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: |
          set +e
          npx playwright test specs/graduation-defense-browser-audit.spec.mjs
          rc=$?
          test -f test-results/junit.xml && cp test-results/junit.xml test-results/gd020-defense-junit.xml
          exit $rc

      - name: GD-020 E · Direct MySQL defense evidence
        id: defensedb
        if: steps.defensepw.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: python scripts/graduation-defense-db-audit.py

      - name: GD-020 F · grade publish + appeal + withdraw/re-publish
        id: gradepw
        if: steps.defensedb.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: |
          set +e
          npx playwright test specs/graduation-grade-browser-audit.spec.mjs
          rc=$?
          test -f test-results/junit.xml && cp test-results/junit.xml test-results/gd020-grade-junit.xml
          exit $rc

      - name: GD-020 F · Direct MySQL grade evidence
        id: gradedb
        if: steps.gradepw.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: python scripts/graduation-grade-db-audit.py

      - name: GD-020 G · archive freeze + stale-token rejection + xlsx
        id: archivepw
        if: steps.gradedb.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: |
          set +e
          npx playwright test specs/graduation-archive-browser-audit.spec.mjs
          rc=$?
          test -f test-results/junit.xml && cp test-results/junit.xml test-results/gd020-archive-junit.xml
          exit $rc

      - name: GD-020 G · Direct MySQL archive manifest/FileVersion evidence
        id: archivedb
        if: steps.archivepw.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: python scripts/graduation-archive-db-audit.py

      - name: Enforce GD-020 continuous same-MySQL journey
        if: always()
        env:
          GUIDANCE: ${{ steps.guidance.outcome }}
          MIDTERM: ${{ steps.midterm.outcome }}
          FINAL_PW: ${{ steps.finalpw.outcome }}
          REVIEW_PW: ${{ steps.reviewpw.outcome }}
          REVIEW_DB: ${{ steps.reviewdb.outcome }}
          DEFENSE_PW: ${{ steps.defensepw.outcome }}
          DEFENSE_DB: ${{ steps.defensedb.outcome }}
          GRADE_PW: ${{ steps.gradepw.outcome }}
          GRADE_DB: ${{ steps.gradedb.outcome }}
          ARCHIVE_PW: ${{ steps.archivepw.outcome }}
          ARCHIVE_DB: ${{ steps.archivedb.outcome }}
        working-directory: e2e
        run: |
          set -euo pipefail
          for v in GUIDANCE MIDTERM FINAL_PW REVIEW_PW REVIEW_DB DEFENSE_PW DEFENSE_DB GRADE_PW GRADE_DB ARCHIVE_PW ARCHIVE_DB; do
            test "${!v}" = success || { echo "$v=${!v}"; exit 1; }
          done
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = [
            'gd020-guidance-junit.xml', 'gd020-midterm-junit.xml', 'gd020-final-junit.xml',
            'gd020-review-junit.xml', 'gd020-defense-junit.xml', 'gd020-grade-junit.xml', 'gd020-archive-junit.xml',
          ]
          total = 0
          for name in files:
            path = Path('test-results') / name
            assert path.exists(), f'missing {name}'
            root = ET.parse(path).getroot()
            tests = int(root.attrib.get('tests', 0))
            failures = int(root.attrib.get('failures', 0))
            errors = int(root.attrib.get('errors', 0))
            skipped = int(root.attrib.get('skipped', 0))
            print(name, {'tests': tests, 'failures': failures, 'errors': errors, 'skipped': skipped})
            assert tests > 0, name
            assert failures == errors == skipped == 0, name
            total += tests
          assert total >= 7, total
          PY
          test "$(git rev-parse HEAD)" = "$E2E_EXPECTED_SHA"

      - name: Upload GD-020 continuous Browser First evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graduation-gd020-current-final-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            e2e/test-results/**
            e2e/runtime-logs/**
