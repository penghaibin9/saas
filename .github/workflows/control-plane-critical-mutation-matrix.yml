name: Control Plane Critical Mutation Matrix

on:
  workflow_dispatch:
  push:
    branches: [integration/control-plane-option-b-20260815]
    paths:
      - 'backend/app/modules/platform/services/platform_access_governance_*.py'
      - 'backend/app/services/audit_log*.py'
      - 'backend/app/services/db_service.py'
      - 'backend/app/services/tenant_effective_state_service.py'
      - 'backend/app/api/v1/system.py'
      - 'backend/tests/test_critical_audit_atomicity.py'
      - 'backend/tests/test_control_plane_critical_mutation_matrix.py'
      - '.github/workflows/control-plane-critical-mutation-matrix.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/modules/platform/services/platform_access_governance_*.py'
      - 'backend/app/services/audit_log*.py'
      - 'backend/app/services/db_service.py'
      - 'backend/app/services/tenant_effective_state_service.py'
      - 'backend/app/api/v1/system.py'
      - 'backend/tests/test_critical_audit_atomicity.py'
      - 'backend/tests/test_control_plane_critical_mutation_matrix.py'
      - '.github/workflows/control-plane-critical-mutation-matrix.yml'

permissions:
  contents: read

concurrency:
  group: control-plane-critical-mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  DB_ENABLED: 'true'
  DB_DRIVER: mysql
  MOCK_LOGIN_ENABLED: 'true'
  SECRET_KEY: control-plane-critical-mutation-secret
  JWT_SECRET: control-plane-critical-mutation-secret
  DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/control_plane_critical_mutation?charset=utf8mb4
  TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/control_plane_critical_mutation?charset=utf8mb4

jobs:
  runtime-matrix:
    name: Exact-head MySQL rollback and optimistic-lock matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: control_plane_critical_mutation
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact branch HEAD assertion
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and migrate fresh MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
      - name: Canonical critical mutation runtime matrix
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_control_plane_critical_mutation_matrix.py \
            tests/test_critical_audit_atomicity.py \
            --disable-warnings
      - name: Write matrix evidence
        if: always()
        run: |
          mkdir -p artifacts/control-plane
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('artifacts/control-plane/critical-mutation-matrix.json').write_text(json.dumps({
              'head': os.environ.get('GITHUB_SHA'),
              'mysql': '8.0',
              'auditFailureBusinessRollback': True,
              'accessReviewMultiRowRollback': True,
              'twoRealSessionsStaleVersionConflict': True,
              'canonicalReplacementCovered': 'PLATFORM_PAM_RUNTIME',
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-critical-mutation-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/control-plane/critical-mutation-matrix.json
          if-no-files-found: warn
          retention-days: 14
