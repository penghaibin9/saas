name: Playwright production interaction E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - '!backend/app/modules/graduation/**'
      - '!backend/tests/test_graduation*'
      - '!backend/scripts/e2e_*graduation*'
      - 'frontend/**'
      - '!frontend/src/modules/graduation/**'
      - '!frontend/tests/graduation*'
      - 'student-portal/**'
      - '!student-portal/src/views/graduation/**'
      - 'enterprise-portal/**'
      - 'miniapp/**'
      - '!miniapp/src/pages/student/graduation/**'
      - '!miniapp/src/pages/teacher/graduation-*/**'
      - '!miniapp/src/services/graduation*'
      - 'e2e/**'
      - '!e2e/specs/graduation*.spec.mjs'
      - '!e2e/lib/graduation*.mjs'
      - '!e2e/pages/graduation.page.mjs'
      - '.github/actions/browser-runtime/**'
      - 'scripts/e2e/bootstrap-browser-runtime.sh'
      - 'scripts/e2e/run-browser-suite.sh'
      - '.github/workflows/playwright-production-e2e.yml'

concurrency:
  group: playwright-functional-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e:
    name: real browser / real API / isolated MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/14
      REDIS_KEY_PREFIX: playwright-functional-${{ github.run_id }}
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: playwright-e2e-only-not-production
      JWT_SECRET_KEY: playwright-e2e-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_ENTERPRISE_BASE_URL: http://127.0.0.1:5202/enterprise
      E2E_MINIAPP_BASE_URL: http://127.0.0.1:5188
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.E2E_EXPECTED_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json
            enterprise-portal/package-lock.json
            miniapp/package-lock.json
            e2e/package-lock.json

      - name: Bootstrap unified full browser runtime
        uses: ./.github/actions/browser-runtime
        with:
          profile: full
          head_sha: ${{ env.E2E_EXPECTED_SHA }}
          verify_gold_manifest: 'false'

      - name: Run non-graduation functional browser suite
        run: bash scripts/e2e/run-browser-suite.sh production-non-graduation

      - name: Publish browser gate summary
        if: always()
        run: |
          echo '## Production browser gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Runtime: one exact-head MySQL/Redis environment' >> "$GITHUB_STEP_SUMMARY"
          echo '- Scope: non-graduation functional specs; visual and graduation suites are separate gates' >> "$GITHUB_STEP_SUMMARY"
          test ! -f e2e/gate-results/production-non-graduation.json || cat e2e/gate-results/production-non-graduation.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ github.run_id }}
          path: e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots, video, traces and gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            e2e/test-results/
            e2e/gate-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload service logs and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-service-logs-${{ github.run_id }}
          path: e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
