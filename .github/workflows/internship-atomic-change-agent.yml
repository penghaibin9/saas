name: Internship Atomic Change Agent

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: internship-atomic-change-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/internship-production-hardening-20260803'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply atomic change patch
        run: |
          if [ -f scripts/agent/apply_internship_atomic_change.py ]; then
            python scripts/agent/apply_internship_atomic_change.py
          else
            echo 'atomic patch script already consumed'
          fi
      - name: Validate patched files
        run: |
          python -m py_compile \
            backend/app/models/internship.py \
            backend/app/modules/internship/services/internship_student_service.py \
            backend/app/modules/internship/services/internship_change_service.py \
            backend/app/modules/internship/services/internship_student_change_context_service.py \
            backend/alembic/versions/20260803_internship_prod_hardening.py \
            backend/tests/test_internship_atomic_change_static.py
          git diff --check
      - name: Commit atomic business changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/agent/apply_internship_atomic_change.py
          git add -u
          if [ -f backend/tests/test_internship_atomic_change_static.py ]; then
            git add backend/tests/test_internship_atomic_change_static.py
          fi
          if git diff --cached --quiet; then
            echo 'atomic change patch already committed'
            exit 0
          fi
          git commit -m 'fix: make internship changes atomic'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
