name: Internship Standalone DB Head

on:
  push:
    branches:
      - feat/internship-standalone-yiyang-v1
    paths:
      - "products/internship-platform/backend/alembic/**"
      - "products/internship-platform/backend/app/models/**"
      - ".github/workflows/internship-standalone-db-head.yml"
  pull_request:
    paths:
      - "products/internship-platform/backend/alembic/**"
      - "products/internship-platform/backend/app/models/**"
      - ".github/workflows/internship-standalone-db-head.yml"

jobs:
  mysql-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: standalone_test
          MYSQL_DATABASE: internship_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pstandalone_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      PYTHONPATH: products/internship-platform/backend
      DATABASE_URL: mysql+pymysql://root:standalone_test@127.0.0.1:3306/internship_test?charset=utf8mb4

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: products/internship-platform/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r products/internship-platform/backend/requirements.txt

      - name: Upgrade empty MySQL to head
        run: alembic -c products/internship-platform/backend/alembic.ini upgrade head

      - name: Verify current ORM table set equals MySQL
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from app.models.base import Base
          import app.models  # noqa: F401

          expected = sorted(Base.metadata.tables)
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as db:
              actual = sorted(db.execute(text(
                  "SELECT table_name FROM information_schema.tables "
                  "WHERE table_schema = DATABASE() AND table_name <> 'alembic_version'"
              )).scalars())
              version = db.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
          assert actual == expected, {
              "missing": sorted(set(expected) - set(actual)),
              "unexpected": sorted(set(actual) - set(expected)),
          }
          assert version == "ix0002", version
          assert "t_internship_score_appeal" in actual
          print({"tables": len(actual), "version": version})
          PY

      - name: Downgrade to frozen ix0001
        run: alembic -c products/internship-platform/backend/alembic.ini downgrade ix0001

      - name: Verify score appeal table removed at ix0001
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as db:
              names = set(db.execute(text(
                  "SELECT table_name FROM information_schema.tables "
                  "WHERE table_schema = DATABASE()"
              )).scalars())
              version = db.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
          assert "t_internship_score_appeal" not in names
          assert version == "ix0001", version
          PY

      - name: Re-upgrade to head
        run: alembic -c products/internship-platform/backend/alembic.ini upgrade head

      - name: Verify restored head
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as db:
              exists = db.execute(text(
                  "SELECT COUNT(*) FROM information_schema.tables "
                  "WHERE table_schema = DATABASE() AND table_name='t_internship_score_appeal'"
              )).scalar_one()
              version = db.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
          assert int(exists) == 1
          assert version == "ix0002", version
          PY
