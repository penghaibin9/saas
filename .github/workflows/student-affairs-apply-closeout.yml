name: Apply Student Affairs Closeout

on:
  push:
    branches:
      - audit/student-affairs-p0-p1-closeout-20260803
    paths:
      - .github/workflows/student-affairs-apply-closeout.yml

permissions:
  contents: write

concurrency:
  group: apply-student-affairs-closeout
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/closeout-patch/part-* > /tmp/student-affairs-closeout.patch.gz.b64
          test "$(wc -c < /tmp/student-affairs-closeout.patch.gz.b64)" -eq 89064
          echo "cf5227c6ce6a272cd68ef92fac7384312182384af424408aecf61c56b5f32855  /tmp/student-affairs-closeout.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/student-affairs-closeout.patch.gz.b64 | gzip -d > /tmp/student-affairs-closeout.patch
          git apply --check /tmp/student-affairs-closeout.patch
          git apply --index /tmp/student-affairs-closeout.patch
          git rm .github/closeout-patch/part-* .github/workflows/student-affairs-apply-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(student-affairs): close P0/P1 audit findings"
          git push origin HEAD:audit/student-affairs-p0-p1-closeout-20260803
