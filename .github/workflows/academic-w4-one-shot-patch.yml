name: Academic W4 One Shot Patch

on:
  push:
    branches:
      - fix/academic-archive-correction-w1-20260821
    paths:
      - .github/workflows/academic-w4-one-shot-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/academic-archive-correction-w1-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply W4 patch
        run: python scripts/check/apply-academic-w4-one-shot.py
      - name: Self-clean and commit
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/check/apply-academic-w4-one-shot.py
          rm .github/workflows/academic-w4-one-shot-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backend/app/modules/academic_affairs/services/academic_file_exchange_service.py \
            backend/app/services/data_exchange_confirm_legacy.py \
            frontend/src/modules/academicAffairs/views/AaCourseListView.vue \
            frontend/src/modules/academicAffairs/views/AaProgramListView.vue \
            frontend/src/modules/academicAffairs/views/AaGradeEntryView.vue \
            frontend/src/modules/academicAffairs/views/AaScheduleMaintainView.vue \
            frontend/src/modules/academicAffairs/views/AaRosterImportExportView.vue \
            scripts/check/apply-academic-w4-one-shot.py \
            .github/workflows/academic-w4-one-shot-patch.yml
          git diff --cached --check
          git commit -m "W4: migrate academic Excel flows to authoritative ImportJob"
          git push origin HEAD:fix/academic-archive-correction-w1-20260821
