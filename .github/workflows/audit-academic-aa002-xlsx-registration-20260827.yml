name: Audit Academic AA-002 XLSX Registration 20260827

on:
  pull_request:
    branches:
      - fix/academic-affairs-final-rc-20260824
    paths:
      - '.github/workflows/audit-academic-aa002-xlsx-registration-20260827.yml'
      - 'e2e/specs/academic-affairs-roster-registration-convenience.spec.mjs'
      - 'backend/scripts/e2e_prepare_academic_aa002_xlsx.py'
      - 'backend/scripts/e2e_assert_academic_aa002_registration.py'

permissions:
  contents: read

concurrency:
  group: audit-academic-aa002-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  xlsx-registration-gold:
    name: exact product / real XLSX / Browser registration / MySQL audit seal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: academic_aa002_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TARGET_SHA: ${{ github.event.pull_request.base.sha }}
      RUNNER_SHA: ${{ github.event.pull_request.head.sha }}
      SCHOOL_IAM_AUTHORITY_EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_aa002_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_aa002_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: academic_aa002_e2e
      REDIS_URL: redis://127.0.0.1:6379/10
      REDIS_KEY_PREFIX: academic-aa002-final-rc
      JWT_SECRET: academic-aa002-browser-only-not-production
      JWT_SECRET_KEY: academic-aa002-browser-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with: { ref: '${{ env.TARGET_SHA }}', fetch-depth: 0 }
      - name: Assert clean product head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          echo "AA-002 exact product SHA: $TARGET_SHA"
      - name: Checkout audit-only harness
        uses: actions/checkout@v4
        with: { ref: '${{ env.RUNNER_SHA }}', path: audit-harness, fetch-depth: 1 }
      - name: Overlay only AA-002 audit files
        run: |
          set -euo pipefail
          test "$(git -C audit-harness rev-parse HEAD)" = "$RUNNER_SHA"
          cp audit-harness/e2e/specs/academic-affairs-roster-registration-convenience.spec.mjs e2e/specs/academic-affairs-roster-registration-convenience.spec.mjs
          cp audit-harness/backend/scripts/e2e_prepare_academic_aa002_xlsx.py backend/scripts/e2e_prepare_academic_aa002_xlsx.py
          cp audit-harness/backend/scripts/e2e_assert_academic_aa002_registration.py backend/scripts/e2e_assert_academic_aa002_registration.py
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Fast AA-002 source preflight
        run: |
          set -euo pipefail
          python -m py_compile backend/scripts/e2e_prepare_academic_aa002_xlsx.py backend/scripts/e2e_assert_academic_aa002_registration.py
          node --check e2e/specs/academic-affairs-roster-registration-convenience.spec.mjs
          grep -q 'roster_import_xlsx' backend/app/modules/academic_affairs/routers/roster_registration_router.py
          grep -q '_audit(db, "AA_ROSTER", out.student_id, "IMPORT"' backend/app/modules/academic_affairs/services/academic_affairs_service.py
          grep -q '_audit(db, "AA_REGISTRATION", rec.id, "REGISTER"' backend/app/modules/academic_affairs/services/academic_affairs_service.py
      - name: Install backend and migrate isolated MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
      - name: Replay production School IAM Authority
        working-directory: backend
        run: PYTHONPATH=. python scripts/bootstrap_control_plane_school_iam_authority.py
      - name: Seed isolated tenant
        working-directory: backend
        run: python scripts/e2e_seed_playwright_tenants.py
      - name: Seed real School IAM runtime fixture
        working-directory: backend
        run: PYTHONPATH=. python scripts/e2e_seed_control_plane_school_iam.py
      - name: Bootstrap canonical browser accounts and AA-002 class
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py
      - name: Build real AA-002 XLSX fixture
        working-directory: backend
        run: python scripts/e2e_prepare_academic_aa002_xlsx.py
      - name: Start real backend with mock login disabled
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend-aa002.log 2>&1 &
          for i in {1..60}; do if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi; sleep 2; done
          cat ../e2e/runtime-logs/backend-aa002.log; exit 1
      - name: Build and start Staff PC
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: ''
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend-aa002.log 2>&1 &
      - name: Wait for Staff PC
        run: |
          for i in {1..60}; do if curl -fsS http://127.0.0.1:5173/login >/dev/null; then exit 0; fi; sleep 2; done
          cat e2e/runtime-logs/*.log; exit 1
      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run only AA-002 real XLSX and registration Browser chain
        working-directory: e2e
        run: npx playwright test specs/academic-affairs-roster-registration-convenience.spec.mjs --workers=1 --retries=0 --reporter=line
      - name: Assert AA-002 Direct MySQL and audit final state
        working-directory: backend
        run: python scripts/e2e_assert_academic_aa002_registration.py
      - name: Upload AA-002 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-aa002-product-evidence-${{ env.TARGET_SHA }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/fixtures/aa002-roster-import.xlsx
            e2e/academic-aa002-browser-outcome.json
            e2e/academic-aa002-mysql-seal.json
            backend/tmp/e2e_academic_aa002_state.local.json
            e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
