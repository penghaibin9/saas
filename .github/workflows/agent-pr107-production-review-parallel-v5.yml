name: Agent PR107 production review parallel v5

on:
  push:
    branches:
      - fix/system-audit-rbac-atomicity-20260813
    paths:
      - .github/workflows/agent-pr107-production-review-parallel-v5.yml

permissions:
  contents: write

jobs:
  regression:
    name: regression-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: role-audit
            tests: "tests/test_role_assignment_validity.py tests/test_role_assignment_privilege_boundary.py tests/test_critical_audit_atomicity.py"
          - shard: channel-lease
            tests: "tests/test_message_channel_delivery.py tests/test_message_lease_reclaim.py"
          - shard: scheduler-session
            tests: "tests/test_scheduler_tenant_effective_state.py tests/test_browser_session_tab_isolation.py"
          - shard: outbox-delivery
            tests: "tests/test_audit_outbox_exactly_once.py tests/test_message_delivery_async.py"
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_review_v5
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_review_v5
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_review_v5
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply exact reviewed patch
        run: |
          python - <<'PY'
          import re, textwrap
          from pathlib import Path
          workflow=Path('.github/workflows/agent-pr107-production-review-fixes-v2.yml').read_text(encoding='utf-8')
          m=re.search(r"      - name: Apply precise production review fixes\n        run: \|\n          python - <<'PY'\n(?P<body>.*?)\n          PY\n",workflow,re.S)
          if not m: raise SystemExit('v2 patch body not found')
          Path('/tmp/review.py').write_text(textwrap.dedent(m.group('body')),encoding='utf-8')
          PY
          python /tmp/review.py
          python - <<'PY'
          from pathlib import Path
          def replace_exact(path, old, new, expected):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count!=expected: raise SystemExit(f'{path}: expected {expected}, got {count}: {old!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')
          delivery='backend/app/services/message_delivery_service.py'
          replace_exact(delivery,'from app.services.db_service import _tid, session\n','from app.core.tenant_scoped import tenant_get\nfrom app.services.db_service import _tid, session\n',1)
          replace_exact(delivery,'            job = db.get(MessageDeliveryJob, jid)\n','            job = tenant_get(db, MessageDeliveryJob, jid, tenant_id=_tid())\n',2)
          outbox='backend/app/services/message_event_outbox_service.py'
          replace_exact(outbox,'from app.core.exceptions import AppException\n','from app.core.exceptions import AppException\nfrom app.core.tenant_scoped import tenant_get\n',1)
          replace_exact(outbox,'            row = db.get(MessageEventOutbox, row_id)\n','            row = tenant_get(db, MessageEventOutbox, row_id, tenant_id=_tid())\n',1)
          replace_exact(outbox,'                    row2 = db2.get(MessageEventOutbox, row_id)\n','                    row2 = tenant_get(db2, MessageEventOutbox, row_id, tenant_id=_tid())\n',1)
          PY
          python -m py_compile \
            backend/app/services/role_assignment_service.py backend/app/services/audit_log.py \
            backend/app/services/message_ops_service.py backend/app/services/message_channel_delivery_service.py \
            backend/app/services/message_delivery_service.py backend/app/services/message_event_outbox_service.py \
            backend/app/models/message.py backend/alembic/versions/msg_channel_delivery_20260813.py \
            backend/tests/test_role_assignment_validity.py backend/tests/test_message_channel_delivery.py
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Fresh MySQL single-head migration
        working-directory: backend
        run: |
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
      - name: Run shard regressions
        working-directory: backend
        run: pytest -q -p no:warnings ${{ matrix.tests }} --timeout=300 --timeout-method=signal

  scale-security:
    name: scale-security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_review_v5_scale
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_review_v5_scale
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_review_v5_scale
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply exact reviewed patch
        run: |
          python - <<'PY'
          import re, textwrap
          from pathlib import Path
          workflow=Path('.github/workflows/agent-pr107-production-review-fixes-v2.yml').read_text(encoding='utf-8')
          m=re.search(r"      - name: Apply precise production review fixes\n        run: \|\n          python - <<'PY'\n(?P<body>.*?)\n          PY\n",workflow,re.S)
          if not m: raise SystemExit('v2 patch body not found')
          Path('/tmp/review.py').write_text(textwrap.dedent(m.group('body')),encoding='utf-8')
          PY
          python /tmp/review.py
          python - <<'PY'
          from pathlib import Path
          def replace_exact(path, old, new, expected):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count!=expected: raise SystemExit(f'{path}: expected {expected}, got {count}: {old!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')
          delivery='backend/app/services/message_delivery_service.py'
          replace_exact(delivery,'from app.services.db_service import _tid, session\n','from app.core.tenant_scoped import tenant_get\nfrom app.services.db_service import _tid, session\n',1)
          replace_exact(delivery,'            job = db.get(MessageDeliveryJob, jid)\n','            job = tenant_get(db, MessageDeliveryJob, jid, tenant_id=_tid())\n',2)
          outbox='backend/app/services/message_event_outbox_service.py'
          replace_exact(outbox,'from app.core.exceptions import AppException\n','from app.core.exceptions import AppException\nfrom app.core.tenant_scoped import tenant_get\n',1)
          replace_exact(outbox,'            row = db.get(MessageEventOutbox, row_id)\n','            row = tenant_get(db, MessageEventOutbox, row_id, tenant_id=_tid())\n',1)
          replace_exact(outbox,'                    row2 = db2.get(MessageEventOutbox, row_id)\n','                    row2 = tenant_get(db2, MessageEventOutbox, row_id, tenant_id=_tid())\n',1)
          PY
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Fresh schema and tenant ratchet
        working-directory: backend
        run: |
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
          python scripts/audit_tenant_queries.py --gate
      - name: Real 20K recipient durable enqueue
        working-directory: backend
        run: |
          python - <<'PY'
          from app.core.context import set_tenant
          from app.db.session import get_sessionmaker
          from app.models import MessageCampaign, MessageChannelDelivery, Tenant, UnifiedMessage
          from app.services.message_channel_delivery_service import enqueue_campaign_channel_deliveries_in_db
          tid=1000000000000011999; set_tenant({'tenantId':str(tid)}); db=get_sessionmaker()()
          try:
              db.add(Tenant(id=tid,tenant_code='channel-20k-review',school_name='20K消息生产复审',short_name='20k',deploy_mode='SAAS',db_mode='SHARED',status='ACTIVE'))
              camp=MessageCampaign(tenant_id=tid,title='20k review',content_plain='x',category='ANNOUNCEMENT',priority='NORMAL',status='PUBLISHED',source_kind='HUMAN',content_mode='SHARED',sender_user_id=1,publish_mode='IMMEDIATE',created_by=1); db.add(camp); db.flush()
              for start in range(1,20001,2000):
                  db.add_all([UnifiedMessage(tenant_id=tid,receiver_id=i,receiver_user_id=i,receiver_context_key='GLOBAL',campaign_id=camp.id,title='x',status='UNREAD',created_by=1) for i in range(start,min(start+2000,20001))]); db.flush()
              first=enqueue_campaign_channel_deliveries_in_db(db,camp,channel='SMS',created_by=1); db.commit()
              second=enqueue_campaign_channel_deliveries_in_db(db,camp,channel='SMS',created_by=1); db.commit()
              count=db.query(MessageChannelDelivery).filter_by(tenant_id=tid,campaign_id=camp.id,channel='SMS').count()
              assert first['recipientCount']==20000 and first['newQueuedCount']==20000, first
              assert second['newQueuedCount']==0 and second['existingCount']==20000, second
              assert count==20000, count
              print({'recipientCount':20000,'storedCount':count,'secondNew':second['newQueuedCount']})
          finally: db.close(); set_tenant(None)
          PY
      - name: Static production review guards
        run: |
          python - <<'PY'
          from pathlib import Path
          role=Path('backend/app/services/role_assignment_service.py').read_text(encoding='utf-8')
          audit=Path('backend/app/services/audit_log.py').read_text(encoding='utf-8')
          channel=Path('backend/app/services/message_channel_delivery_service.py').read_text(encoding='utf-8')
          ops=Path('backend/app/services/message_ops_service.py').read_text(encoding='utf-8')
          delivery=Path('backend/app/services/message_delivery_service.py').read_text(encoding='utf-8')
          outbox=Path('backend/app/services/message_event_outbox_service.py').read_text(encoding='utf-8')
          assert '_record_expiry_audit' not in role
          assert 'ROLE_ASSIGNMENT_GRANH' not in audit
          assert '.with_for_update()' in ops
          assert 'allow_legacy_plaintext=False' in channel and '_CLAIM_BATCH_SIZE = 5' in channel and '[REDACTED_PHONE]' in channel
          assert delivery.count('tenant_get(db, MessageDeliveryJob')>=2
          assert 'tenant_get(db, MessageEventOutbox' in outbox and 'tenant_get(db2, MessageEventOutbox' in outbox
          PY

  finalize:
    name: finalize-reviewed-fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [regression, scale-security]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply exact reviewed patch for commit
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python - <<'PY'
          import re, textwrap
          from pathlib import Path
          workflow=Path('.github/workflows/agent-pr107-production-review-fixes-v2.yml').read_text(encoding='utf-8')
          m=re.search(r"      - name: Apply precise production review fixes\n        run: \|\n          python - <<'PY'\n(?P<body>.*?)\n          PY\n",workflow,re.S)
          if not m: raise SystemExit('v2 patch body not found')
          Path('/tmp/review.py').write_text(textwrap.dedent(m.group('body')),encoding='utf-8')
          PY
          python /tmp/review.py
          python - <<'PY'
          from pathlib import Path
          def replace_exact(path, old, new, expected):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count!=expected: raise SystemExit(f'{path}: expected {expected}, got {count}: {old!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')
          delivery='backend/app/services/message_delivery_service.py'
          replace_exact(delivery,'from app.services.db_service import _tid, session\n','from app.core.tenant_scoped import tenant_get\nfrom app.services.db_service import _tid, session\n',1)
          replace_exact(delivery,'            job = db.get(MessageDeliveryJob, jid)\n','            job = tenant_get(db, MessageDeliveryJob, jid, tenant_id=_tid())\n',2)
          outbox='backend/app/services/message_event_outbox_service.py'
          replace_exact(outbox,'from app.core.exceptions import AppException\n','from app.core.exceptions import AppException\nfrom app.core.tenant_scoped import tenant_get\n',1)
          replace_exact(outbox,'            row = db.get(MessageEventOutbox, row_id)\n','            row = tenant_get(db, MessageEventOutbox, row_id, tenant_id=_tid())\n',1)
          replace_exact(outbox,'                    row2 = db2.get(MessageEventOutbox, row_id)\n','                    row2 = tenant_get(db2, MessageEventOutbox, row_id, tenant_id=_tid())\n',1)
          PY
          python -m py_compile \
            backend/app/services/role_assignment_service.py backend/app/services/audit_log.py \
            backend/app/services/message_ops_service.py backend/app/services/message_channel_delivery_service.py \
            backend/app/services/message_delivery_service.py backend/app/services/message_event_outbox_service.py \
            backend/app/models/message.py backend/alembic/versions/msg_channel_delivery_20260813.py \
            backend/tests/test_role_assignment_validity.py backend/tests/test_message_channel_delivery.py
      - name: Commit reviewed fixes and clean temporary runners
        run: |
          rm .github/workflows/agent-pr107-production-review-fixes.yml \
             .github/workflows/agent-pr107-production-review-fixes-v2.yml \
             .github/workflows/agent-pr107-production-review-fixes-v3.yml \
             .github/workflows/agent-pr107-production-review-fixes-v4.yml \
             .github/workflows/agent-pr107-production-review-parallel-v5.yml
          git config user.name penghaibin9
          git config user.email penghaibin9@gmail.com
          git add \
            backend/app/services/role_assignment_service.py backend/app/services/audit_log.py \
            backend/app/services/message_ops_service.py backend/app/services/message_channel_delivery_service.py \
            backend/app/services/message_delivery_service.py backend/app/services/message_event_outbox_service.py \
            backend/app/models/message.py backend/alembic/versions/msg_channel_delivery_20260813.py \
            backend/tests/test_role_assignment_validity.py backend/tests/test_message_channel_delivery.py \
            .github/workflows/agent-pr107-production-review-fixes.yml \
            .github/workflows/agent-pr107-production-review-fixes-v2.yml \
            .github/workflows/agent-pr107-production-review-fixes-v3.yml \
            .github/workflows/agent-pr107-production-review-fixes-v4.yml \
            .github/workflows/agent-pr107-production-review-parallel-v5.yml
          git diff --cached --check
          git commit -m "fix(review): close PR107 production edge cases"
          git push origin HEAD:fix/system-audit-rbac-atomicity-20260813
