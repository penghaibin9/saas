name: Student Affairs Diagnostics

on:
  push:
    branches:
      - codex/student-affairs-four-end-hardening-20260726

jobs:
  node-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Capture management PC contract tests
        shell: bash
        run: |
          mkdir -p diagnostics
          cd frontend
          npm ci > ../diagnostics/frontend-install.log 2>&1
          set +e
          npm test > ../diagnostics/frontend-test.log 2>&1
          echo $? > ../diagnostics/frontend-test.exit
          set -e
      - name: Capture student portal lint
        shell: bash
        run: |
          cd student-portal
          npm ci > ../diagnostics/student-portal-install.log 2>&1
          set +e
          npm run lint > ../diagnostics/student-portal-lint.log 2>&1
          echo $? > ../diagnostics/student-portal-lint.exit
          set -e
      - name: Capture miniapp credential matches
        shell: bash
        run: |
          cd miniapp
          npm ci > ../diagnostics/miniapp-install.log 2>&1
          npm run build:mp-weixin > ../diagnostics/miniapp-build.log 2>&1
          grep -R -n -I -E '密码 123456|ROLE_DEMO_ACCOUNT|DEMO_PASSWORD|password["'"'":= ]+123456' dist/build/mp-weixin > ../diagnostics/miniapp-credential-matches.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: student-affairs-node-diagnostics
          path: diagnostics/
          if-no-files-found: error

  backend-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip > ../backend-install.log 2>&1
          pip install -r requirements.txt >> ../backend-install.log 2>&1
          pip install cryptography >> ../backend-install.log 2>&1
      - name: Capture selected pytest output
        shell: bash
        run: |
          mkdir -p ../diagnostics
          TARGETS=$(python ../scripts/check/select_pytest_targets.py)
          echo "$TARGETS" > ../diagnostics/backend-targets.log
          set +e
          timeout 25m pytest $TARGETS -q -p no:warnings --durations=20 > ../diagnostics/backend-pytest.log 2>&1
          echo $? > ../diagnostics/backend-pytest.exit
          set -e
      - uses: actions/upload-artifact@v4
        with:
          name: student-affairs-backend-diagnostics
          path: diagnostics/
          if-no-files-found: error
