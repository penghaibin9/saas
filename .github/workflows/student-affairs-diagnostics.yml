name: Student Affairs Diagnostics

on:
  push:
    branches:
      - codex/student-affairs-four-end-hardening-20260726
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Run student-affairs frontend contract tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch "$SOURCE_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo/frontend
          npm ci --silent
          node --test tests/studentAffairs.fourEndReview.test.mjs tests/studentAffairs.fourEndUiAudit.test.mjs

  student-portal-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Run student portal lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch "$SOURCE_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo/student-portal
          npm ci --silent
          npm run lint

  miniapp-credential-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Run fixed credential scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch "$SOURCE_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo/miniapp
          npm ci --silent
          npm run build:mp-weixin >/dev/null
          node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin

  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Run new backend contract tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch "$SOURCE_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo/backend
          python -m pip install -q -r requirements.txt cryptography
          pytest tests/test_affairs_student_contract_service.py tests/test_affairs_student_contract_security_guard.py -q -p no:warnings
