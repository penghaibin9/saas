name: Student Affairs Diagnostics

on:
  push:
    branches:
      - codex/student-affairs-four-end-hardening-20260726
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Run student-affairs frontend contract tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch "$SOURCE_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo/frontend
          npm ci --silent
          node --test \
            tests/studentAffairs.fourEndReview.test.mjs \
            tests/studentAffairs.fourEndUiAudit.test.mjs \
            tests/studentAffairs.teacherWorkbench.test.mjs \
            tests/studentAffairs.allowedActions.test.mjs

  student-portal-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Run student portal lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch "$SOURCE_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo/student-portal
          npm ci --silent
          npm run lint

  miniapp-credential-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Run fixed credential scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch "$SOURCE_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo/miniapp
          npm ci --silent
          npm run build:mp-weixin >/dev/null
          node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin

  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
    steps:
      - name: Run route, student and teacher contracts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          docker run -d --name affairs-mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=student_lifecycle_test \
            -p 3306:3306 mysql:8.0 >/dev/null 2>&1
          trap 'docker rm -f affairs-mysql >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec affairs-mysql mysqladmin ping -h 127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; then break; fi
            sleep 1
          done
          git clone -q --depth 1 --branch "$SOURCE_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo/backend
          python -m pip install -q -r requirements.txt cryptography
          pytest \
            tests/test_affairs_route_mount_contract.py \
            tests/test_affairs_four_end_terminal_guard.py \
            tests/test_affairs_student_contract_service.py \
            tests/test_affairs_student_contract_security_guard.py \
            tests/test_affairs_teacher_workbench_guard.py \
            -q -p no:warnings
