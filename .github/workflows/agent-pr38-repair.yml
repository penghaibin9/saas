name: Agent PR38 Repair

on:
  push:
    branches:
      - fix/main-pytest-fixture-corruption

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'test: make graduation fixture explicit') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-pytest-fixture-corruption
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped repair
        run: python scripts/maintenance/agent_pr38_repair.py
      - name: Validate Python syntax
        run: |
          python -m py_compile backend/tests/conftest.py backend/tests/test_portal_graduation.py backend/tests/test_pytest_client_contract.py
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('backend/tests').glob('test_graduation*.py'):
              ast.parse(path.read_text(encoding='utf-8'))
          PY
      - name: Commit exact repair set
        run: |
          git config user.name 'OpenAI Repair Agent'
          git config user.email 'agent@openai.local'
          rm .github/workflows/agent-pr38-repair.yml scripts/maintenance/agent_pr38_repair.py
          git add backend/tests/conftest.py backend/tests/test_graduation*.py backend/tests/test_portal_graduation.py backend/tests/test_pytest_client_contract.py
          git rm --cached .github/workflows/agent-pr38-repair.yml scripts/maintenance/agent_pr38_repair.py
          git commit -m 'test: make graduation fixture explicit and honor version contract'
          git push origin HEAD:fix/main-pytest-fixture-corruption
