name: Internship S6 Source Closure

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/src/modules/internship/**'
      - 'frontend/src/config/navPlan.js'
      - 'frontend/src/router/**'
      - 'student-portal/src/views/internship/**'
      - 'student-portal/src/views/messages/**'
      - 'student-portal/src/views/home/**'
      - 'student-portal/src/router/**'
      - 'student-portal/src/platform/**'
      - 'student-portal/src/services/**'
      - 'miniapp/src/pages/**'
      - 'miniapp/src/config/**'
      - 'miniapp/src/services/**'
      - 'miniapp/src/stores/**'
      - 'miniapp/src/pages.json'
      - 'backend/app/modules/internship/**'
      - 'backend/app/models/internship.py'
      - 'backend/app/models/internship_*.py'
      - 'backend/app/api/v1/route_registration.py'
      - 'backend/app/api/v1/*internship*.py'
      - 'backend/app/services/*internship*.py'
      - 'backend/app/student_portal/**internship*.py'
      - 'backend/alembic/versions/**'
      - 'backend/scripts/run_scheduled_jobs.py'
      - 'enterprise-portal/**'
      - 'e2e/lib/internship-enterprise-position-browser.mjs'
      - 'scripts/check/check-internship-source-closure-v2.py'
      - '.github/actions/internship-e2e-*/**'
      - '.github/workflows/internship-*.yml'
      - '.github/workflows/playwright-production-e2e.yml'
  workflow_dispatch:

concurrency:
  group: internship-s6-source-closure-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  s6-source-closure:
    name: git ls-files / routes / imports / migrations / schedulers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      E2E_PRODUCT_EXACT_SHA: 979592ef8bfe3318bf5fd12043da17e635dcad1a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert exact runner SHA and product boundary
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "runnerExactSha=$ACTUAL"
          echo "productExactSha=$E2E_PRODUCT_EXACT_SHA"
          test "$ACTUAL" = "$E2E_EXPECTED_SHA"
          git cat-file -e "$E2E_PRODUCT_EXACT_SHA^{commit}"

      - name: Run S6 source closure
        run: python scripts/check/check-internship-source-closure-v2.py

      - name: Print S6 evidence
        if: always()
        run: |
          test -f artifacts/internship/final-audit/source-manifest/source-closure.json && \
            cat artifacts/internship/final-audit/source-manifest/source-closure.json || true

      - name: Upload S6 source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-s6-source-closure-${{ github.run_id }}
          path: artifacts/internship/final-audit/source-manifest/source-closure.json
          if-no-files-found: warn
          retention-days: 14