name: Academic B Current Main Integration Rehearsal

on:
  push:
    branches:
      - agent/academic-b-schedule-selection
    paths:
      - .github/workflows/academic-b-current-main-integration-rehearsal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-b-current-main-integration-rehearsal
  cancel-in-progress: false

jobs:
  targeted-integration:
    name: B exact-head + current main targeted integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: academic_b_main_rehearsal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      APP_ENV: test
      DB_ENABLED: 'true'
      MOCK_LOGIN_ENABLED: 'true'
      JWT_SECRET: academic-b-current-main-rehearsal-secret-at-least-32-bytes
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_main_rehearsal?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_main_rehearsal?charset=utf8mb4

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin B parent and current main; prove zero direct path collision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "ca3b485b32ab53461d74b6b48b6dcdf400480ca7"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "e91c4aabd99b1b328b6be5f2d8d0b127fe193140"
          python - <<'PY'
          import subprocess
          def names(base, head):
              return set(subprocess.check_output(
                  ['git', 'diff', '--name-only', f'{base}..{head}'],
                  text=True,
              ).splitlines())
          b = names('414216c4a79ff035aee87d70b35572572f5c0535', 'HEAD')
          main_delta = names('457dc8821876b8e1b67e0fb5911a9eec33e37616', 'origin/main')
          overlap = sorted(b & main_delta)
          print('B changed paths=', len(b))
          print('new-main paths=', len(main_delta))
          print('direct overlap=', overlap)
          assert overlap == [], f'new main overlaps B paths: {overlap}'
          PY

      - name: Ephemeral merge current main in runner only
        run: |
          set -euo pipefail
          git config user.name "academic-b-integration-rehearsal"
          git config user.email "academic-b-integration-rehearsal@invalid.local"
          git merge --no-commit --no-ff origin/main
          test "$(git rev-parse MERGE_HEAD)" = "e91c4aabd99b1b328b6be5f2d8d0b127fe193140"
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and migrate clean MySQL on ephemeral merge
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head

      - name: Run only critical B MySQL contracts on current-main merge
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q -p no:warnings \
            tests/test_aa_selection_w6_lock_drop_order_mysql.py \
            tests/test_aa_selection_w6_lottery_concurrency_mysql.py \
            tests/test_aa_selection_w6_roster_reconcile_mysql.py \
            tests/test_aa_selection_student_projection_states_mysql.py \
            --maxfail=1 \
            --junitxml=/tmp/academic-b-current-main-junit.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run only B client/source contracts on current-main merge
        run: |
          set -euo pipefail
          node --test \
            frontend/tests/academic-b-selection-preflight-contract.test.mjs \
            frontend/tests/academic-schedule-task-first-contract.test.mjs \
            student-portal/tests/academic-b-selection-preflight-client.test.mjs \
            miniapp/tests/academic-b-selection-preflight-client.test.mjs

      - name: Upload targeted integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-b-current-main-integration-${{ github.sha }}
          path: /tmp/academic-b-current-main-junit.xml
          if-no-files-found: warn
          retention-days: 14
