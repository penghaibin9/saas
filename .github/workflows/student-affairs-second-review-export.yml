name: Student Affairs Second Review Export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/student-affairs-second-review-export.yml
      - .audit/second-review.patch.gz.b64.*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/student-affairs-p0-p1-closeout-20260803
      - name: Apply second-review closeout atomically
        shell: bash
        run: |
          set -euo pipefail
          APPLY_WORKFLOW_PARENT="$(git rev-parse HEAD^)"
          cat .audit/second-review.patch.gz.b64.* | base64 -d | gzip -d > /tmp/second-review.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-edit origin/main
          git checkout "$APPLY_WORKFLOW_PARENT" -- .github/workflows/student-affairs-second-review-export.yml
          git apply --index /tmp/second-review.patch
          rm -f .audit/second-review.patch.gz.b64.*
          git add -u .audit
          rmdir .audit 2>/dev/null || true
          git diff --cached --check
          git commit -m "fix(student-affairs): close second-review merge blockers"
          git push origin HEAD:audit/student-affairs-p0-p1-closeout-20260803
