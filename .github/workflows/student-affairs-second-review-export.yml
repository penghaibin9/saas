name: Student Affairs Second Review Export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/student-affairs-second-review-export.yml
      - .audit/second-review.patch.gz.b64.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/student-affairs-p0-p1-closeout-20260803
      - name: Verify patch chunks
        shell: bash
        run: |
          set -euo pipefail
          for f in .audit/second-review.patch.gz.b64.*; do
            printf '%s ' "$f"
            wc -c < "$f" | tr -d '\n'
            printf ' '
            sha256sum "$f" | cut -d' ' -f1
          done
          cat .audit/second-review.patch.gz.b64.* > /tmp/second-review.b64
          printf 'combined '
          wc -c < /tmp/second-review.b64 | tr -d '\n'
          printf ' '
          sha256sum /tmp/second-review.b64 | cut -d' ' -f1
          base64 -d /tmp/second-review.b64 | gzip -t
