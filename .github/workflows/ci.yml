name: CI

# 每次 push / PR 自动验证：后端测试 + 前端 lint/build + 小程序构建 + 禁止文件检查。
# 说明：小程序构建较重，拆为可选 job（continue-on-error），失败不阻断主流程但保留命令与日志。

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    # 每日 18:00 UTC（北京 02:00）跑后端全量；push/PR 仅跑 portal 相关快测（每用例重建~250表，全量很慢）
    - cron: "0 18 * * *"

jobs:
  internship-production-gates:
    name: 岗位实习生产闸门
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 后端测试为 MySQL-only（conftest 拒绝回落 SQLite）；CI 提供 MySQL 服务库
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography   # PyMySQL 连 MySQL8 caching_sha2_password 认证所需
      - name: 岗位实习专项测试（20分钟硬超时）
        run: timeout 20m pytest tests/test_internship*.py -q -p no:warnings --durations=20

  graduation-production-gates:
    name: 毕业设计生产闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check/check-graduation-production-gates.mjs

  backend:
    name: 后端 pytest（PR:portal子集 / 定时:全量）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      # 后端测试为 MySQL-only（conftest 拒绝回落 SQLite）；CI 提供 MySQL 服务库
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography   # PyMySQL 连 MySQL8 caching_sha2_password 认证所需
      - name: 运行 pytest（push/PR 只跑 portal 相关；schedule 跑全量）
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "定时全量：pytest 全部用例"
            pytest -q -p no:warnings
          else
            echo "push/PR 快测：仅 portal 相关用例"
            pytest tests/test_portal_*.py -q -p no:warnings
          fi

  frontend:
    name: PC 管理端 lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  miniapp:
    name: 小程序生产 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run build:h5
      - run: npm run build:mp-weixin
      - name: 禁止生产包携带固定演示凭据
        run: |
          if grep -R -E '密码 123456|ROLE_DEMO_ACCOUNT|DEMO_PASSWORD|password["'"'":= ]+123456' dist/build/mp-weixin; then
            echo "❌ 小程序生产包包含固定演示凭据"
            exit 1
          fi
          echo "✅ 小程序生产包未发现固定演示凭据"

  forbidden-files:
    name: 禁止文件检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描不应入库的文件
        run: |
          set -e
          echo "检查被 git 跟踪的敏感/产物文件..."
          FILES=$(git ls-files)
          # 敏感文件 / 构建产物 / 本地备份（任何位置都不允许入库）
          BAD=$(echo "$FILES" | grep -E \
            '(^|/)\.env$|\.db$|(^|/)dist/|(^|/)node_modules/|(^|/)unpackage/|\.pem$|\.key$|(^|/)\.ai-backup/|(^|/)_local-backup/|backend/_pfull3\.txt|backend/scripts/_sec_verify\.py|一键构建\.bat|docs/ui/.*\.(zip|pdf)$' \
            || true)
          # 运行时上传/导出目录（可能含 PII/敏感数据）；排除设计稿与老参考系统里的同名目录
          # 排除：设计稿资源目录（docs/<章节>/ui/…/uploads）、老参考系统同名目录、源码包名恰为 exports 的 Python 包（backend/app/**/exports/）
          RUNTIME=$(echo "$FILES" | grep -E '(^|/)(uploads|exports)/' | grep -vE 'docs/ui/|docs/[^/]*/ui/|/internship-backend/uploads/|backend/app/.*/exports/' || true)
          BAD=$(printf '%s\n%s' "$BAD" "$RUNTIME" | grep -vE '^$' || true)
          if [ -n "$BAD" ]; then
            echo "❌ 发现不应入库的文件："
            echo "$BAD"
            exit 1
          fi
          echo "✅ 未发现禁止文件"
