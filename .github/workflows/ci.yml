name: CI

# 每次 push / PR 自动验证：后端测试 + 管理 PC/学生 PC + 小程序测试/构建 + 禁止文件检查。

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  control-plane-contracts:
    name: 控制面合同检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 校验模块清单
        run: python scripts/check/validate-module-manifest.py
      - name: 生成能力注册表
        run: node scripts/check/generate-capability-registry.mjs
      - name: 控制面合同检查
        run: python scripts/check/check-control-plane-contracts.py
      - name: 学生敏感字段与权限码合同检查
        run: python scripts/check/check-student-sensitive-contracts.py
      - name: A6 正式路由依赖图门禁
        run: node scripts/check/check-formal-route-dependency-graph.mjs
      - name: Stage C1/C2/C3 学籍事实/历史/不可变门禁
        run: python scripts/check/check-stage-c1-academic-fact-bypass.py
      - name: 生产 Nginx 安全合同（所有部署方式同一条基线）
        run: python scripts/check/check-nginx-security-contract.py
      - name: 禁止新增 create_all 型迁移
        run: python scripts/check/check-migration-time-travel.py

  internship-production-gates:
    name: 岗位实习生产闸门
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: 岗位实习专项测试（20分钟硬超时）
        run: timeout 20m pytest tests/test_internship*.py -q -p no:warnings --durations=20
      - name: 岗位实习静态生产合同
        run: python ../scripts/check/check-internship-production-contracts.py
      - name: 岗位实习 PC 路由权限合同
        run: python ../scripts/check/check-internship-route-permissions.py

  graduation-production-gates:
    name: 毕业设计生产闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check/check-graduation-production-gates.mjs

  backend:
    name: 后端 pytest（PR/push 变更感知；定时全量）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: 租户隔离棘轮门禁（禁止新增未带租户校验的裸 Session.get）
        run: python scripts/audit_tenant_queries.py --gate
      - name: 选择最小必要测试集合
        id: select
        run: |
          TARGETS=$(python ../scripts/check/select_pytest_targets.py)
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "选中: $TARGETS"
      - name: 运行 pytest（PR/push 变更感知；定时全量）
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "定时任务：执行 backend 全量 pytest"
            timeout 80m pytest -q -p no:warnings --durations=30
          else
            # PR 的全量回归唯一由 Main canonical release gate 的 4 个
            # deterministic shards 承担；CI 保持 change-aware，避免同一
            # HEAD 在单 runner 上重复全量并被 90m job ceiling 取消。
            TARGETS="${{ steps.select.outputs.targets }}"
            echo "PR/push 变更感知：$TARGETS"
            timeout 40m pytest $TARGETS -q -p no:warnings --durations=20
          fi

  frontend:
    name: PC 管理端 lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: 四端前端合同测试
        run: npm test
      - run: npm run build
      - name: 禁止 PC 产物携带固定演示凭据
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  student-portal:
    name: 学生 PC 门户 lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: student-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: 禁止学生门户产物携带固定演示凭据
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  miniapp:
    name: 小程序 test + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
        with:
          # handoff seal 合同（handoff-exact-head-contract）要顺着提交链解析出被封存的
          # 实现提交：pull_request 事件下 HEAD 是 GitHub 生成的 merge 提交，默认
          # fetch-depth=1 只有这一个对象，两个父提交都不在，解析不出来就只能误判。
          # merge → seal → 实现提交共三层，取 5 留一点余量。
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - name: 小程序合同测试
        run: npm test
      - run: npm run build:h5
      - run: npm run build:mp-weixin
      - name: 禁止生产包携带固定演示凭据
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin

  forbidden-files:
    name: 禁止文件检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验全部 GitHub Actions YAML 语法
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python scripts/check/validate-github-workflows.py
      - name: 扫描不应入库的文件
        run: |
          set -e
          echo "检查被 git 跟踪的敏感/产物文件..."
          FILES=$(git ls-files)
          BAD=$(echo "$FILES" | grep -E \
            '(^|/)\.env$|\.db$|(^|/)dist/|(^|/)node_modules/|(^|/)unpackage/|\.pem$|\.key$|(^|/)\.ai-backup/|(^|/)_local-backup/|backend/_pfull3\.txt|backend/scripts/_sec_verify\.py|一键构建\.bat|docs/ui/.*\.(zip|pdf)$' \
            || true)
          RUNTIME=$(echo "$FILES" | grep -E '(^|/)(uploads|exports)/' | grep -vE 'docs/ui/|docs/[^/]*/ui/|/internship-backend/uploads/|backend/app/.*/exports/' || true)
          BAD=$(printf '%s\n%s' "$BAD" "$RUNTIME" | grep -vE '^$' || true)
          if [ -n "$BAD" ]; then
            echo "❌ 发现不应入库的文件："
            echo "$BAD"
            exit 1
          fi
          echo "✅ 未发现禁止文件"

  migrated-schema-gate:
    name: 迁移库门禁（真实 alembic schema / ${{ matrix.shard }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [stage-c1, stage-c2, stage-c3, archive, p0]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_migrated"
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_migrated"
      DB_ENABLED: "true"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_migrated
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography pytest-timeout
      - name: Alembic 单 head
        run: |
          set -e
          HEADS=$(python -m alembic heads | grep -c "(head)")
          python -m alembic heads
          if [ "$HEADS" != "1" ]; then
            echo "❌ 迁移链出现 $HEADS 个 head，必须收敛为单 head"
            exit 1
          fi
          echo "✅ 单 head"
      - name: 全新库跑完整迁移链
        run: |
          set -e
          mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"
          # 与生产一致的排序规则（见 deploy/docker/docker-compose.mysql.yml）
          mysql -h 127.0.0.1 -uroot -proot -e \
            "ALTER DATABASE student_lifecycle_migrated CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          python -m alembic upgrade head
          python -m alembic current
      - name: 迁移库与 ORM 模型一致性
        run: python ../scripts/check/check-migrated-schema-parity.py
      - name: 导出「全新安装」结构快照
        run: |
          python ../scripts/check/dump-mysql-schema.py \
            --url "$DATABASE_URL" --out /tmp/schema-fresh.txt
      # ── 迁移"时间旅行"门禁（P0 止损）──────────────────────────────
      # 0001 等 12 个迁移跑的是 metadata.create_all（"用今天的 ORM 建表"），
      # 不是冻结的历史 DDL，所以老库和新库理论上会走到不同结构。
      # 历史链已实测无法从旧 commit 重放，真正的修复是一次迁移基线重建（见
      # docs/06-开发施工与质量验收/迁移基线重建-待办.md）。这里先冻结现状、禁止变坏。
      - name: 禁止新增 create_all 型迁移
        run: python ../scripts/check/check-migration-time-travel.py
      - name: 上传全新安装的结构快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-schema-${{ matrix.shard }}-${{ github.sha }}
          path: /tmp/schema-fresh.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Stage C1 学籍事实 reconciliation 归零
        run: python scripts/audit_stage_c1_academic_facts.py
      - name: 上传 Stage C1 reconciliation 证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-c1-reconciliation-${{ matrix.shard }}-${{ github.sha }}
          path: backend/test-results/stage-c1-reconciliation.json
          if-no-files-found: warn
          retention-days: 14
      # Stage C1/C2/C3 在同一 25m 外层 timeout 下已经稳定跑到 exit 124。
      # 拆成三个独立 Runner 并行执行；测试集合、断言、真实迁移库与每测试 180s 超时全部保持不变。
      - name: 运行迁移库专项分片（不用 create_all）
        run: |
          case "${{ matrix.shard }}" in
            stage-c1)
              timeout 25m pytest -vv -p no:warnings \
                tests/test_stage_c1_academic_fact.py \
                tests/test_stage_c1_future_effective.py \
                tests/test_stage_c1_major_split_fact.py \
                tests/test_stage_c1_program_transition.py \
                --timeout=180 --timeout-method=signal --durations=30
              ;;
            stage-c2)
              timeout 20m pytest -vv -p no:warnings \
                tests/test_stage_c2_historical_consumers.py \
                tests/test_stage_c2_transcript_identity.py \
                --timeout=180 --timeout-method=signal --durations=30
              ;;
            stage-c3)
              timeout 25m pytest -vv -p no:warnings \
                tests/test_stage_c3_archive_immutability.py \
                tests/test_stage_c3_history_contract.py \
                tests/test_stage_c3_correction_router_contract.py \
                tests/test_stage_c3_post_archive_official_fact.py \
                tests/test_stage_c3_correction_end_to_end.py \
                --timeout=180 --timeout-method=signal --durations=30
              ;;
            archive)
              timeout 25m pytest -vv -p no:warnings \
                tests/test_aa_archive.py \
                --timeout=180 --timeout-method=signal --durations=30
              ;;
            p0)
              timeout 25m pytest -vv -p no:warnings \
                tests/test_domain_import.py \
                tests/test_import_tenant_isolation.py \
                tests/test_graduation_credit_dedup.py \
                tests/test_discipline_package11_integrity.py \
                tests/test_funding_package10_closeout.py \
                --timeout=180 --timeout-method=signal --durations=30
              ;;
            *)
              echo "❌ 未知 migrated-schema shard: ${{ matrix.shard }}"
              exit 2
              ;;
          esac

  # ── 升级路径收敛门禁 ────────────────────────────────────────────────
  # 老学校一路升上来的库，必须等于新学校全新装出来的库。
  #
  # 2026-08-10：此前不收敛（245/427 张表、3583 处列/索引差异），根因是
  # 0001 用 metadata.create_all 抢建了 291 张本该由正式迁移建的表，
  # 后续正式建表迁移全部命中"表已存在就 return"。已修复：
  #   - 0001 不再抢建那 291 张表（清单冻结在迁移文件里）；
  #   - 新增 20260810_schema_reconcile 把既有老库补齐到同一结构。
  # 当前实测差异 = 0，本门禁应保持绿；再变红说明又有人往回写了。
  migration-path-convergence:
    name: 迁移升级路径收敛门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: conv_fresh
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: 全新安装路径
        env:
          FRESH_DB_URL: "mysql+pymysql://root:root@127.0.0.1:3306/conv_fresh?charset=utf8mb4"
        run: |
          set -e
          mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"
          # 排序规则必须与生产一致（deploy/docker/docker-compose.mysql.yml 声明
          # collation-server=utf8mb4_unicode_ci）。用 MySQL 8 默认的 0900_ai_ci
          # 建库会让比对结果掺进环境噪音，门禁结论就不可信了。
          mysql -h 127.0.0.1 -uroot -proot -e \
            "ALTER DATABASE conv_fresh CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          DATABASE_URL="$FRESH_DB_URL" python -m alembic upgrade head
          python ../scripts/check/dump-mysql-schema.py \
            --url "$FRESH_DB_URL" --out /tmp/schema-fresh.txt
      - name: 老库升级路径
        env:
          # 2026-07-14 的基线，是能被完整重放的最早 commit 之一
          #（更早的 commit 迁移链本身就断：0015 revision 缺失 / alembic_version
          #  列宽不足 33 字符 / 多 head，均已实测）。
          MIGRATION_BASELINE_SHA: 50d6a2f0043b98d6a018fe7be498cd197d406d54
          OLD_DB_URL: "mysql+pymysql://root:root@127.0.0.1:3306/conv_upgraded?charset=utf8mb4"
        run: |
          set -e
          mysql -h 127.0.0.1 -uroot -proot -e \
            "CREATE DATABASE conv_upgraded CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          git worktree add /tmp/oldtree "$MIGRATION_BASELINE_SHA"
          (cd /tmp/oldtree/backend && DATABASE_URL="$OLD_DB_URL" python -m alembic upgrade head)
          DATABASE_URL="$OLD_DB_URL" python -m alembic upgrade head
          DATABASE_URL="$OLD_DB_URL" python -m alembic current
          python ../scripts/check/dump-mysql-schema.py \
            --url "$OLD_DB_URL" --out /tmp/schema-upgraded.txt
      - name: 比对两条安装路径的库结构
        run: |
          python ../scripts/check/compare-schema-dumps.py \
            --upgraded /tmp/schema-upgraded.txt --fresh /tmp/schema-fresh.txt
      - name: 上传两条路径的结构快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-path-schemas-${{ github.sha }}
          path: |
            /tmp/schema-fresh.txt
            /tmp/schema-upgraded.txt
          if-no-files-found: warn
          retention-days: 30
