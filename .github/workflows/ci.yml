name: CI

on:
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  pr37-repair:
    name: PR37 独立复审阻断修复
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/internship-production-hardening-20260803
          fetch-depth: 0
      - name: 修复、校验并恢复原 CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 anchor, got {count}")
              return text.replace(old, new, 1)

          p = "backend/alembic/versions/20260803_internship_prod_hardening.py"
          t = read(p)
          t = once(t, "Revision ID: 20260803_internship_prod_hardening", "Revision ID: 20260803_internship_hardening", "migration doc revision")
          t = once(t, "Revises: 0161_access_governance", "Revises: 0164_master_data_governance", "migration doc parent")
          t = once(t, 'revision = "20260803_internship_prod_hardening"', 'revision = "20260803_internship_hardening"', "migration revision")
          t = once(t, 'down_revision = "0161_access_governance"', 'down_revision = "0164_master_data_governance"', "migration parent")
          write(p, t)

          p = "backend/app/modules/internship/services/internship_score_service.py"
          t = read(p)
          t = once(t, "from sqlalchemy import func, select\n", "from sqlalchemy import func, select\nfrom sqlalchemy.exc import IntegrityError\n", "score import")
          anchor = '        db.flush()\n        _trail(db, c.id, "SAVE_CONFIG", {'
          replacement = '''        try:
              db.flush()
          except IntegrityError as exc:
              db.rollback()
              detail = str(getattr(exc, "orig", exc))
              if "uk_intern_score_cfg_active_scope" in detail or ("1062" in detail and "active_scope_key" in detail):
                  raise AppException(
                      "DATA_CONFLICT",
                      "同一评分配置范围正在被其他操作更新，请刷新后重试",
                  ) from None
              raise
          _trail(db, c.id, "SAVE_CONFIG", {'''
          t = once(t, anchor, replacement, "score flush")
          write(p, t)

          p = "backend/app/modules/internship/services/internship_change_service.py"
          t = read(p)
          start = t.index("        snapshot = int(change.record_version_snapshot or 0)\n")
          end = t.index("\n        before = {", start)
          old = t[start:end]
          new = '''        snapshot = int(change.record_version_snapshot or 0)
          if action == "APPROVE":
              expected_record = snapshot if record_expected_version is None else extract_expected_version(
                  {"expectedVersion": record_expected_version})
              if expected_record != snapshot:
                  raise AppException("DATA_CONFLICT", "页面实习记录版本与申请快照不一致，请刷新")
              if int(record.version or 0) != snapshot:
                  raise AppException(
                      "DATA_CONFLICT",
                      "学生实习主记录在申请后已变化，请退回申请并由学生基于最新数据重新提交",
                  )
          '''.rstrip()
          if "if int(record.version or 0) != snapshot" not in old:
              raise RuntimeError("change snapshot block not found")
          write(p, t[:start] + new + t[end:])

          p = "backend/app/modules/internship/services/internship_complaint_service.py"
          t = read(p)
          start = t.index("    if c.complainant_contact_encrypted:\n")
          end = t.index("    confidential =", start)
          old = t[start:end]
          new = '''    if c.complainant_contact_encrypted:
              try:
                  plain = decrypt_sensitive(
                      c.complainant_contact_encrypted,
                      "internship_complaint_contact",
                      allow_legacy_plaintext=True,
                  )
                  if plain is None:
                      contact_corrupted = True
                      _logger.error("complaint_contact_decrypt_failed complaint_id=%s", c.id)
                  else:
                      contact = plain
              except Exception:  # noqa: BLE001 - 列表展示必须 fail-closed，解密错误已记录
                  contact_corrupted = True
                  _logger.exception("complaint_contact_decrypt_failed complaint_id=%s", c.id)
          '''
          if "decrypt_sensitive" not in old:
              raise RuntimeError("complaint decrypt block not found")
          write(p, t[:start] + new + t[end:])

          p = "backend/tests/test_internship_score_config_scope_static.py"
          t = read(p)
          if "test_score_config_first_save_conflict_is_a_business_conflict" not in t:
              t += '''

          def test_score_config_first_save_conflict_is_a_business_conflict():
              service = _read("backend/app/modules/internship/services/internship_score_service.py")
              block = service[service.index("def save_config"):service.index("def _approved_enterprise_eval")]
              assert "IntegrityError" in block
              assert "uk_intern_score_cfg_active_scope" in block
              assert '"DATA_CONFLICT"' in block
              assert "请刷新后重试" in block
          '''
          write(p, t)

          p = "backend/tests/test_internship_production_hardening_static.py"
          t = read(p)
          if "test_internship_migration_extends_latest_main_head" not in t:
              t += '''

          def test_internship_migration_extends_latest_main_head():
              migration = _read("backend/alembic/versions/20260803_internship_prod_hardening.py")
              assert 'revision = "20260803_internship_hardening"' in migration
              assert 'down_revision = "0164_master_data_governance"' in migration
              assert len("20260803_internship_hardening") <= 32


          def test_complaint_corrupted_ciphertext_is_explicitly_fail_closed():
              text = _read("backend/app/modules/internship/services/internship_complaint_service.py")
              block = text[text.index("def _row"):text.index("def _trail")]
              assert "if plain is None" in block
              assert '"complainantContactCorrupted": contact_corrupted' in block
              assert '"***" if contact_corrupted' in block
          '''
          write(p, t)

          p = "backend/tests/test_internship_process_change.py"
          t = read(p)
          if "test_stale_change_request_can_still_be_rejected" not in t:
              t += '''

          def test_stale_change_request_can_still_be_rejected(client, db_mode):
              ids = _seed(db_mode)
              response = client.post(
                  f"{MOB}/internship/change-request",
                  json={
                      "changeType": "CHANGE_ENTERPRISE",
                      "reason": "企业经营调整需变更单位",
                      "targetEnterpriseId": ids["target_company_id"],
                      "targetPositionId": ids["target_position_id"],
                      "targetEnterpriseName": "新企业A",
                      "targetPositionName": "新岗位B",
                  },
                  headers=_student(),
              )
              assert response.status_code == 200 and response.json()["code"] == 0
              change = response.json()["data"]

              from app.db.session import get_sessionmaker
              from app.models import InternshipRecord
              db = get_sessionmaker()()
              try:
                  record = db.get(InternshipRecord, ids["rec_id"])
                  record.version = int(record.version or 0) + 1
                  db.commit()
              finally:
                  db.close()

              rejected = client.post(
                  f"{INT}/change-requests/{change['id']}/review",
                  json={
                      "action": "REJECT",
                      "comment": "主记录已变化，请重新提交申请",
                      "expectedVersion": int(change.get("version") or 0),
                  },
                  headers=_mentor("刘强"),
              )
              assert rejected.status_code == 200, rejected.json()
              assert rejected.json()["data"]["status"] == "REJECTED"
          '''
          write(p, t)
          PY

          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f .github/workflows/pr37-independent-review-fixes.yml
          rm -f .github/pr37-repair-error.txt

          python -m py_compile \
            backend/alembic/versions/20260803_internship_prod_hardening.py \
            backend/app/modules/internship/services/internship_score_service.py \
            backend/app/modules/internship/services/internship_change_service.py \
            backend/app/modules/internship/services/internship_complaint_service.py \
            backend/tests/test_internship_score_config_scope_static.py \
            backend/tests/test_internship_production_hardening_static.py \
            backend/tests/test_internship_process_change.py
          git diff --check
          git add \
            .github/workflows/ci.yml \
            backend/alembic/versions/20260803_internship_prod_hardening.py \
            backend/app/modules/internship/services/internship_score_service.py \
            backend/app/modules/internship/services/internship_change_service.py \
            backend/app/modules/internship/services/internship_complaint_service.py \
            backend/tests/test_internship_score_config_scope_static.py \
            backend/tests/test_internship_production_hardening_static.py \
            backend/tests/test_internship_process_change.py
          git commit -m "fix: close PR37 independent review blockers"
          git push origin HEAD:agent/internship-production-hardening-20260803
