name: CI

# 每次 push / PR 自动验证：后端测试 + 管理 PC/学生 PC + 小程序构建 + 禁止文件检查。

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    # 每日 18:00 UTC（北京 02:00）跑后端全量；push/PR 仅跑 portal 相关快测。
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  control-plane-contracts:
    name: 控制面合同检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 校验模块清单
        run: python scripts/check/validate-module-manifest.py
      - name: 生成能力注册表
        run: node scripts/check/generate-capability-registry.mjs
      - name: 控制面合同检查
        run: python scripts/check/check-control-plane-contracts.py
      - name: 学生敏感字段与权限码合同检查
        run: python scripts/check/check-student-sensitive-contracts.py

  internship-production-gates:
    name: 岗位实习生产闸门
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: 岗位实习专项测试（20分钟硬超时）
        run: timeout 20m pytest tests/test_internship*.py -q -p no:warnings --durations=20
      - name: 岗位实习静态生产合同
        run: python ../scripts/check/check-internship-production-contracts.py
      - name: 岗位实习 PC 路由权限合同
        run: python ../scripts/check/check-internship-route-permissions.py

  graduation-production-gates:
    name: 毕业设计生产闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check/check-graduation-production-gates.mjs

  backend:
    name: 后端 pytest（PR:变更感知 / 定时:全量）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: 选择最小必要测试集合
        id: select
        run: |
          TARGETS=$(python ../scripts/check/select_pytest_targets.py)
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "选中: $TARGETS"
      - name: 运行 pytest（push/PR 变更感知；schedule 全量）
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "定时全量：pytest 全部用例"
            timeout 80m pytest -q -p no:warnings --durations=30
          else
            TARGETS="${{ steps.select.outputs.targets }}"
            echo "push/PR 变更感知：$TARGETS"
            timeout 40m pytest $TARGETS -q -p no:warnings --durations=20
          fi

  frontend:
    name: PC 管理端 lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: 四端前端合同测试
        run: npm test
      - run: npm run build
      - name: 禁止 PC 产物携带固定演示凭据
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  student-portal:
    name: 学生 PC 门户 lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: student-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: 禁止学生门户产物携带固定演示凭据
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  miniapp:
    name: 小程序生产 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run build:h5
      - run: npm run build:mp-weixin
      - name: 禁止生产包携带固定演示凭据
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin

  forbidden-files:
    name: 禁止文件检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描不应入库的文件
        run: |
          set -e
          echo "检查被 git 跟踪的敏感/产物文件..."
          FILES=$(git ls-files)
          BAD=$(echo "$FILES" | grep -E \
            '(^|/)\.env$|\.db$|(^|/)dist/|(^|/)node_modules/|(^|/)unpackage/|\.pem$|\.key$|(^|/)\.ai-backup/|(^|/)_local-backup/|backend/_pfull3\.txt|backend/scripts/_sec_verify\.py|一键构建\.bat|docs/ui/.*\.(zip|pdf)$' \
            || true)
          RUNTIME=$(echo "$FILES" | grep -E '(^|/)(uploads|exports)/' | grep -vE 'docs/ui/|docs/[^/]*/ui/|/internship-backend/uploads/|backend/app/.*/exports/' || true)
          BAD=$(printf '%s\n%s' "$BAD" "$RUNTIME" | grep -vE '^$' || true)
          if [ -n "$BAD" ]; then
            echo "❌ 发现不应入库的文件："
            echo "$BAD"
            exit 1
          fi
          echo "✅ 未发现禁止文件"

  pr37-closeout-apply:
    name: PR37 一次性修复落地
    if: (github.event_name == 'pull_request' && github.head_ref == 'agent/internship-production-hardening-20260803') || (github.event_name == 'push' && github.ref_name == 'agent/internship-production-hardening-20260803')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 修复迁移审计、门户复审和成绩配置并发
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('backend/alembic/versions/20260803_internship_prod_hardening.py')
          text = migration.read_text(encoding='utf-8')
          old = '''        "INSERT INTO t_internship_audit_trail "
                  "(tenant_id, target_id, target_type, action, operator_name, detail_json, occurred_at) "
                  "VALUES (:tenant_id, :target_id, :target_type, 'MIGRATION_DEDUPLICATE', "
                  ":operator_name, :detail_json, UTC_TIMESTAMP())"
          '''
          new = '''        "INSERT INTO t_internship_audit_trail "
                  "(tenant_id, target_id, target_type, action, operator_name, detail_json, "
                  "occurred_at, created_at, updated_at, is_deleted) "
                  "VALUES (:tenant_id, :target_id, :target_type, 'MIGRATION_DEDUPLICATE', "
                  ":operator_name, :detail_json, UTC_TIMESTAMP(), UTC_TIMESTAMP(), UTC_TIMESTAMP(), 0)"
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'occurred_at, created_at, updated_at, is_deleted' not in text:
              raise SystemExit('migration audit insert anchor missing')
          migration.write_text(text, encoding='utf-8')

          portal = Path('student-portal/review/v5-full-review.mjs')
          text = portal.read_text(encoding='utf-8')
          old = '''  const purple = page.locator('.sp-theme__item[title="科技紫"]')
          await purple.click()
          await page.reload({ waitUntil: 'domcontentloaded' })
          await waitStable(page)
          const persistedTheme = await page.evaluate(() => document.documentElement.dataset.spTheme || '')
          report.functionalChecks.push({
            name: '主题切换后刷新保持',
            passed: persistedTheme === 'purple',
            actual: { persistedTheme },
            screenshot: await capture(page, outputDir, 'functional-theme-persistence', false)
          })
          '''
          new = '''  const persistenceTheme = config.themes.find((theme) => theme.key !== 'blue') || config.themes[0]
          if (!persistenceTheme?.key) throw new Error('review theme configuration is empty')
          await setTheme(page, persistenceTheme.key)
          await page.reload({ waitUntil: 'domcontentloaded' })
          await waitStable(page)
          const persistedTheme = await page.evaluate(() => document.documentElement.dataset.spTheme || '')
          report.functionalChecks.push({
            name: '主题切换后刷新保持',
            passed: persistedTheme === persistenceTheme.key,
            actual: { persistedTheme, expectedTheme: persistenceTheme.key },
            screenshot: await capture(page, outputDir, 'functional-theme-persistence', false)
          })
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'expectedTheme: persistenceTheme.key' not in text:
              raise SystemExit('portal theme persistence anchor missing')
          portal.write_text(text, encoding='utf-8')

          score = Path('backend/app/modules/internship/services/internship_score_service.py')
          text = score.read_text(encoding='utf-8')
          if 'from sqlalchemy.exc import IntegrityError' not in text:
              text = text.replace(
                  'from sqlalchemy import func, select\n',
                  'from sqlalchemy import func, select\nfrom sqlalchemy.exc import IntegrityError\n',
                  1,
              )
          old = '''        db.flush()
          _trail(db, c.id, "SAVE_CONFIG", {
              **parsed, "passLine": pass_line, "scopeKey": scope_key,
          }, operator=_op_name(user))
          db.commit()
          return {"ok": True, "configId": str(c.id), "configVersion": int(c.version or 0),
                  "batchId": str(c.batch_id) if c.batch_id else ""}
          '''
          new = '''        try:
              db.flush()
              _trail(db, c.id, "SAVE_CONFIG", {
                  **parsed, "passLine": pass_line, "scopeKey": scope_key,
              }, operator=_op_name(user))
              db.commit()
          except IntegrityError as exc:
              db.rollback()
              raise AppException(
                  "DATA_CONFLICT",
                  "同一批次的成绩配置已被其他管理员更新，请刷新后重试",
              ) from exc
          return {"ok": True, "configId": str(c.id), "configVersion": int(c.version or 0),
                  "batchId": str(c.batch_id) if c.batch_id else ""}
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif '同一批次的成绩配置已被其他管理员更新' not in text:
              raise SystemExit('score configuration save anchor missing')
          score.write_text(text, encoding='utf-8')

          test = Path('backend/tests/test_internship_ci_closeout_static.py')
          test.write_text('''from pathlib import Path

ROOT = Path(__file__).resolve().parents[2]


def _read(path):
    return (ROOT / path).read_text(encoding="utf-8")


def test_migration_audit_populates_base_model_columns():
    source = _read("backend/alembic/versions/20260803_internship_prod_hardening.py")
    block = source[source.index("def _write_dedup_audit"):source.index("def _normalize_record_duplicates")]
    assert "created_at, updated_at, is_deleted" in block
    assert block.count("UTC_TIMESTAMP()") >= 3


def test_portal_theme_persistence_uses_review_configuration():
    source = _read("student-portal/review/v5-full-review.mjs")
    assert "config.themes.find" in source
    assert "expectedTheme: persistenceTheme.key" in source


def test_score_config_unique_race_returns_business_conflict():
    source = _read("backend/app/modules/internship/services/internship_score_service.py")
    block = source[source.index("def save_config"):source.index("def _approved_enterprise_eval")]
    assert "except IntegrityError as exc" in block
    assert "db.rollback()" in block
    assert "同一批次的成绩配置已被其他管理员更新" in block
''', encoding='utf-8')
          PY
      - name: 校验并提交修复
        run: |
          python -m py_compile \
            backend/alembic/versions/20260803_internship_prod_hardening.py \
            backend/app/modules/internship/services/internship_score_service.py \
            backend/tests/test_internship_ci_closeout_static.py
          node --check student-portal/review/v5-full-review.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/alembic/versions/20260803_internship_prod_hardening.py \
            backend/app/modules/internship/services/internship_score_service.py \
            backend/tests/test_internship_ci_closeout_static.py \
            student-portal/review/v5-full-review.mjs
          if git diff --cached --quiet; then
            echo 'PR37 closeout already applied'
            exit 0
          fi
          git commit -m 'fix: close PR37 migration and portal review failures'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
