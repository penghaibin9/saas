name: CI

# 每次 push / PR 自动验证：后端测试 + 前端 lint/build + 小程序构建 + 禁止文件检查。
# 说明：小程序构建较重，拆为可选 job（continue-on-error），失败不阻断主流程但保留命令与日志。

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    # 每日 18:00 UTC（北京 02:00）跑后端全量；push/PR 仅跑 portal 相关快测（每用例重建~250表，全量很慢）
    - cron: "0 18 * * *"

jobs:
  control-plane-contracts:
    name: 控制面合同检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 校验模块清单
        run: python scripts/check/validate-module-manifest.py
      - name: 生成能力注册表
        run: node scripts/check/generate-capability-registry.mjs
      - name: 控制面合同检查
        run: python scripts/check/check-control-plane-contracts.py
      - name: 学生敏感字段与权限码合同检查
        run: python scripts/check/check-student-sensitive-contracts.py

  internship-production-gates:
    name: 岗位实习生产闸门
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 后端测试为 MySQL-only（conftest 拒绝回落 SQLite）；CI 提供 MySQL 服务库
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography   # PyMySQL 连 MySQL8 caching_sha2_password 认证所需
      - name: 岗位实习专项测试（20分钟硬超时）
        run: timeout 20m pytest tests/test_internship*.py -q -p no:warnings --durations=20

  graduation-production-gates:
    name: 毕业设计生产闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check/check-graduation-production-gates.mjs

  backend:
    name: 后端 pytest（PR:portal子集 / 定时:全量）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      # 后端测试为 MySQL-only（conftest 拒绝回落 SQLite）；CI 提供 MySQL 服务库
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography   # PyMySQL 连 MySQL8 caching_sha2_password 认证所需
      - name: 选择最小必要测试集合
        id: select
        run: |
          TARGETS=$(python ../scripts/check/select_pytest_targets.py)
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "选中: $TARGETS"
      - name: 运行 pytest（push/PR 变更感知；schedule 全量）
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "定时全量：pytest 全部用例"
            timeout 80m pytest -q -p no:warnings --durations=30
          else
            TARGETS="${{ steps.select.outputs.targets }}"
            echo "push/PR 变更感知：$TARGETS"
            # 每组 25 分钟硬超时；失败即失败，不 continue-on-error
            timeout 25m pytest $TARGETS -q -p no:warnings --durations=20
          fi

  frontend:
    name: PC 管理端 lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: 禁止 PC 产物携带固定演示凭据
        id: pc_credentials
        run: |
          MATCHES=$(grep -R -n -E '密码 123456|ROLE_DEMO_ACCOUNT|DEMO_PASSWORD|password["'"'"':= ]+123456' dist || true)
          printf '%s\n' "$MATCHES" | tee /tmp/pc-credential-matches.txt
          if [ -n "$MATCHES" ]; then
            echo "❌ PC 生产包包含固定演示凭据"
            exit 1
          fi
          echo "✅ PC 生产包未发现固定演示凭据"
      - name: 上传 PC 凭据闸门失败明细
        if: failure() && steps.pc_credentials.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pc-credential-failure-log
          path: /tmp/pc-credential-matches.txt

  miniapp:
    name: 小程序生产 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - name: Run npm run build:h5
        id: miniapp_h5
        run: |
          set -o pipefail
          npm run build:h5 2>&1 | tee /tmp/miniapp-h5.log
      - name: 上传 H5 构建失败日志
        if: failure() && steps.miniapp_h5.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: miniapp-h5-failure-log
          path: /tmp/miniapp-h5.log
      - run: npm run build:mp-weixin
      - name: 禁止生产包携带固定演示凭据
        run: |
          if grep -R -E '密码 123456|ROLE_DEMO_ACCOUNT|DEMO_PASSWORD|password["'"'"':= ]+123456' dist/build/mp-weixin; then
            echo "❌ 小程序生产包包含固定演示凭据"
            exit 1
          fi
          echo "✅ 小程序生产包未发现固定演示凭据"

  forbidden-files:
    name: 禁止文件检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描不应入库的文件
        run: |
          set -e
          echo "检查被 git 跟踪的敏感/产物文件..."
          FILES=$(git ls-files)
          # 敏感文件 / 构建产物 / 本地备份（任何位置都不允许入库）
          BAD=$(echo "$FILES" | grep -E \
            '(^|/)\.env$|\.db$|(^|/)dist/|(^|/)node_modules/|(^|/)unpackage/|\.pem$|\.key$|(^|/)\.ai-backup/|(^|/)_local-backup/|backend/_pfull3\.txt|backend/scripts/_sec_verify\.py|一键构建\.bat|docs/ui/.*\.(zip|pdf)$' \
            || true)
          # 运行时上传/导出目录（可能含 PII/敏感数据）；排除设计稿与老参考系统里的同名目录
          # 排除：设计稿资源目录（docs/<章节>/ui/…/uploads）、老参考系统同名目录、源码包名恰为 exports 的 Python 包（backend/app/**/exports/）
          RUNTIME=$(echo "$FILES" | grep -E '(^|/)(uploads|exports)/' | grep -vE 'docs/ui/|docs/[^/]*/ui/|/internship-backend/uploads/|backend/app/.*/exports/' || true)
          BAD=$(printf '%s\n%s' "$BAD" "$RUNTIME" | grep -vE '^$' || true)
          if [ -n "$BAD" ]; then
            echo "❌ 发现不应入库的文件："
            echo "$BAD"
            exit 1
          fi
          echo "✅ 未发现禁止文件"
