name: CI

# 每次 push / PR 自动验证：后端测试 + 管理 PC/学生 PC + 小程序测试/构建 + 禁止文件检查。

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  control-plane-contracts:
    name: 控制面合同检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 校验模块清单
        run: python scripts/check/validate-module-manifest.py
      - name: 生成能力注册表
        run: node scripts/check/generate-capability-registry.mjs
      - name: 控制面合同检查
        run: python scripts/check/check-control-plane-contracts.py
      - name: 学生敏感字段与权限码合同检查
        run: python scripts/check/check-student-sensitive-contracts.py
      - name: A6 正式路由依赖图门禁
        run: node scripts/check/check-formal-route-dependency-graph.mjs
      - name: Stage C1/C2/C3 学籍事实/历史/不可变门禁
        run: python scripts/check/check-stage-c1-academic-fact-bypass.py

  internship-production-gates:
    name: 岗位实习生产闸门
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: 岗位实习专项测试（20分钟硬超时）
        run: timeout 20m pytest tests/test_internship*.py -q -p no:warnings --durations=20
      - name: 岗位实习静态生产合同
        run: python ../scripts/check/check-internship-production-contracts.py
      - name: 岗位实习 PC 路由权限合同
        run: python ../scripts/check/check-internship-route-permissions.py

  graduation-production-gates:
    name: 毕业设计生产闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check/check-graduation-production-gates.mjs

  backend:
    name: 后端 pytest（小 PR 变更感知；大 PR 基线差分；定时全量）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: 租户隔离棘轮门禁（禁止新增未带租户校验的裸 Session.get）
        run: python scripts/audit_tenant_queries.py --gate
      - name: 选择最小必要测试集合
        id: select
        run: |
          TARGETS=$(python ../scripts/check/select_pytest_targets.py)
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "选中: $TARGETS"
      - name: 运行 pytest（小 PR 变更感知；大 PR 基线差分；定时全量）
        run: |
          FULL_REGRESSION=0
          BASELINE_DIFF=0
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "定时任务：执行 backend 全量 pytest"
            FULL_REGRESSION=1
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_COUNT=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | wc -l | tr -d ' ')
            echo "PR 变更文件数：$CHANGED_COUNT"
            if [ "$CHANGED_COUNT" -ge 150 ]; then
              echo "大 PR（>=150 文件）：执行全量 pytest，并与 main 已知失败基线比较"
              FULL_REGRESSION=1
              BASELINE_DIFF=1
            fi
          fi

          if [ "$FULL_REGRESSION" = "1" ]; then
            if [ "$BASELINE_DIFF" = "1" ]; then
              mkdir -p test-results
              set +e
              timeout 80m pytest -q -p no:warnings --durations=30 \
                --junitxml=test-results/backend-full.xml
              PYTEST_EXIT=$?
              set -e
              python ../scripts/check/compare-pytest-junit-baseline.py \
                --junit test-results/backend-full.xml \
                --baseline ../scripts/check/backend-known-failures-main.txt \
                --base-ref "${{ github.event.pull_request.base.sha }}" \
                --repo-root .. \
                --pytest-exit-code "$PYTEST_EXIT"
            else
              timeout 80m pytest -q -p no:warnings --durations=30
            fi
          else
            TARGETS="${{ steps.select.outputs.targets }}"
            echo "PR/push 变更感知：$TARGETS"
            timeout 40m pytest $TARGETS -q -p no:warnings --durations=20
          fi

  frontend:
    name: PC 管理端 lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: 四端前端合同测试
        run: npm test
      - run: npm run build
      - name: 禁止 PC 产物携带固定演示凭据
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  student-portal:
    name: 学生 PC 门户 lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: student-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: 禁止学生门户产物携带固定演示凭据
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  miniapp:
    name: 小程序 test + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - name: 小程序合同测试
        run: npm test
      - run: npm run build:h5
      - run: npm run build:mp-weixin
      - name: 禁止生产包携带固定演示凭据
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin

  forbidden-files:
    name: 禁止文件检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验全部 GitHub Actions YAML 语法
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python scripts/check/validate-github-workflows.py
      - name: 扫描不应入库的文件
        run: |
          set -e
          echo "检查被 git 跟踪的敏感/产物文件..."
          FILES=$(git ls-files)
          BAD=$(echo "$FILES" | grep -E \
            '(^|/)\.env$|\.db$|(^|/)dist/|(^|/)node_modules/|(^|/)unpackage/|\.pem$|\.key$|(^|/)\.ai-backup/|(^|/)_local-backup/|backend/_pfull3\.txt|backend/scripts/_sec_verify\.py|一键构建\.bat|docs/ui/.*\.(zip|pdf)$' \
            || true)
          RUNTIME=$(echo "$FILES" | grep -E '(^|/)(uploads|exports)/' | grep -vE 'docs/ui/|docs/[^/]*/ui/|/internship-backend/uploads/|backend/app/.*/exports/' || true)
          BAD=$(printf '%s\n%s' "$BAD" "$RUNTIME" | grep -vE '^$' || true)
          if [ -n "$BAD" ]; then
            echo "❌ 发现不应入库的文件："
            echo "$BAD"
            exit 1
          fi
          echo "✅ 未发现禁止文件"

  migrated-schema-gate:
    name: 迁移库门禁（真实 alembic schema）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_migrated"
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_migrated"
      DB_ENABLED: "true"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_migrated
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography pytest-timeout
      - name: Alembic 单 head
        run: |
          set -e
          HEADS=$(python -m alembic heads | grep -c "(head)")
          python -m alembic heads
          if [ "$HEADS" != "1" ]; then
            echo "❌ 迁移链出现 $HEADS 个 head，必须收敛为单 head"
            exit 1
          fi
          echo "✅ 单 head"
      - name: 全新库跑完整迁移链
        run: |
          set -e
          mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"
          python -m alembic upgrade head
          python -m alembic current
      - name: 迁移库与 ORM 模型一致性
        run: python ../scripts/check/check-migrated-schema-parity.py
      - name: 导出「全新安装」结构快照
        run: |
          python ../scripts/check/dump-mysql-schema.py \
            --url "$DATABASE_URL" --out /tmp/schema-fresh.txt
      # ── 迁移升级路径收敛门禁（P0）────────────────────────────────
      # 0001 跑的是 metadata.create_all（"用今天的 ORM 建表"），不是冻结的历史 DDL。
      # 于是"老学校一路升级"和"新学校全新安装"理论上会走到不同的结构，
      # 而后续迁移里"表已存在就 return"的兼容写法会把差异继续掩盖。
      # 这里用一个历史基线 commit 真建一个"老库"，一路升到 HEAD，再和全新安装逐字段比对。
      - name: 用历史基线 commit 建「老库」并一路升级到 HEAD
        env:
          # 2026-07-07 的基线（当时迁移链只有 14 个版本），代表最早一批装机的学校。
          MIGRATION_BASELINE_SHA: 21ab58bf72a3f4f2ccc196bddb07adac42905d7f
          OLD_DB_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_upgraded"
        run: |
          set -e
          mysql -h 127.0.0.1 -uroot -proot -e \
            "CREATE DATABASE student_lifecycle_upgraded CHARACTER SET utf8mb4"
          git worktree add /tmp/oldtree "$MIGRATION_BASELINE_SHA"
          # 用基线版本的迁移链把"老库"建起来（依赖仍用 HEAD 已安装的那套）
          (cd /tmp/oldtree/backend && DATABASE_URL="$OLD_DB_URL" python -m alembic upgrade head)
          (cd /tmp/oldtree/backend && DATABASE_URL="$OLD_DB_URL" python -m alembic current)
          # 再用 HEAD 的迁移链把这个老库升到最新
          DATABASE_URL="$OLD_DB_URL" python -m alembic upgrade head
          DATABASE_URL="$OLD_DB_URL" python -m alembic current
          python ../scripts/check/dump-mysql-schema.py \
            --url "$OLD_DB_URL" --out /tmp/schema-upgraded.txt
      - name: 比对两条安装路径的库结构（不一致即不得发版）
        run: |
          python ../scripts/check/compare-schema-dumps.py \
            --upgraded /tmp/schema-upgraded.txt --fresh /tmp/schema-fresh.txt
      - name: 上传两条路径的结构快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-path-schemas-${{ github.sha }}
          path: |
            /tmp/schema-fresh.txt
            /tmp/schema-upgraded.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Stage C1 学籍事实 reconciliation 归零
        run: python scripts/audit_stage_c1_academic_facts.py
      - name: 上传 Stage C1 reconciliation 证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-c1-reconciliation-${{ github.sha }}
          path: backend/test-results/stage-c1-reconciliation.json
          if-no-files-found: warn
          retention-days: 14
      - name: 在迁移库上跑 Stage C1/C2/C3 + P0 专项（不用 create_all）
        run: |
          timeout 35m pytest -vv -p no:warnings \
            tests/test_stage_c1_academic_fact.py \
            tests/test_stage_c1_future_effective.py \
            tests/test_stage_c1_major_split_fact.py \
            tests/test_stage_c1_program_transition.py \
            tests/test_stage_c2_historical_consumers.py \
            tests/test_stage_c2_transcript_identity.py \
            tests/test_stage_c3_archive_immutability.py \
            tests/test_stage_c3_history_contract.py \
            tests/test_stage_c3_correction_router_contract.py \
            tests/test_stage_c3_post_archive_official_fact.py \
            tests/test_stage_c3_correction_end_to_end.py \
            tests/test_aa_archive.py \
            tests/test_domain_import.py \
            tests/test_import_tenant_isolation.py \
            tests/test_graduation_credit_dedup.py \
            tests/test_discipline_package11_integrity.py \
            tests/test_funding_package10_closeout.py \
            --timeout=180 --timeout-method=signal --durations=30
