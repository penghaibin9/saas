name: CI

# 每次 push / PR 自动验证：后端测试 + 前端 lint/build + 小程序构建 + 禁止文件检查。
# 说明：小程序构建较重，拆为可选 job（continue-on-error），失败不阻断主流程但保留命令与日志。

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  backend:
    name: 后端 pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行 pytest
        run: pytest -q -p no:warnings

  frontend:
    name: PC 管理端 lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  miniapp:
    name: 小程序 build（可选）
    runs-on: ubuntu-latest
    continue-on-error: true   # 小程序构建环境较重；失败不阻断，但保留命令/日志供排查
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run build:h5
      - run: npm run build:mp-weixin

  forbidden-files:
    name: 禁止文件检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描不应入库的文件
        run: |
          set -e
          echo "检查被 git 跟踪的敏感/产物文件..."
          FILES=$(git ls-files)
          # 敏感文件 / 构建产物 / 本地备份（任何位置都不允许入库）
          BAD=$(echo "$FILES" | grep -E \
            '(^|/)\.env$|\.db$|(^|/)dist/|(^|/)node_modules/|(^|/)unpackage/|\.pem$|\.key$|(^|/)\.ai-backup/|(^|/)_local-backup/|backend/_pfull3\.txt|backend/scripts/_sec_verify\.py|一键构建\.bat|docs/ui/.*\.(zip|pdf)$' \
            || true)
          # 运行时上传/导出目录（可能含 PII/敏感数据）；排除设计稿与老参考系统里的同名目录
          RUNTIME=$(echo "$FILES" | grep -E '(^|/)(uploads|exports)/' | grep -vE 'docs/ui/|/internship-backend/uploads/' || true)
          BAD=$(printf '%s\n%s' "$BAD" "$RUNTIME" | grep -vE '^$' || true)
          if [ -n "$BAD" ]; then
            echo "❌ 发现不应入库的文件："
            echo "$BAD"
            exit 1
          fi
          echo "✅ 未发现禁止文件"
