name: CI

# 每次 push / PR 自动验证：后端测试 + 管理 PC/学生 PC + 小程序构建 + 禁止文件检查。

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    # 每日 18:00 UTC（北京 02:00）跑后端全量；push/PR 仅跑 portal 相关快测。
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  control-plane-contracts:
    name: 控制面合同检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 校验模块清单
        run: python scripts/check/validate-module-manifest.py
      - name: 生成能力注册表
        run: node scripts/check/generate-capability-registry.mjs
      - name: 控制面合同检查
        run: python scripts/check/check-control-plane-contracts.py
      - name: 学生敏感字段与权限码合同检查
        run: python scripts/check/check-student-sensitive-contracts.py

  internship-production-gates:
    name: 岗位实习生产闸门
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: 岗位实习专项测试（20分钟硬超时）
        run: timeout 20m pytest tests/test_internship*.py -q -p no:warnings --durations=20

  graduation-production-gates:
    name: 毕业设计生产闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check/check-graduation-production-gates.mjs

  backend:
    name: 后端 pytest（PR:portal子集 / 定时:全量）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
      # 仍使用真实 MySQL；会话建表一次、每用例清数据，避免约 250 张表反复 DDL 导致超时。
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: 选择最小必要测试集合
        id: select
        run: |
          TARGETS=$(python ../scripts/check/select_pytest_targets.py)
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "选中: $TARGETS"
      - name: 运行 pytest（push/PR 变更感知；schedule 全量）
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "定时全量：pytest 全部用例"
            timeout 80m pytest -q -p no:warnings --durations=30
          else
            TARGETS="${{ steps.select.outputs.targets }}"
            echo "push/PR 变更感知：$TARGETS"
            timeout 40m pytest $TARGETS -q -p no:warnings --durations=20
          fi

  frontend:
    name: PC 管理端 lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: 四端前端合同测试
        run: npm test
      - run: npm run build
      - name: 禁止 PC 产物携带固定演示凭据
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  student-portal:
    name: 学生 PC 门户 lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: student-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: 禁止学生门户产物携带固定演示凭据
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  miniapp:
    name: 小程序生产 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run build:h5
      - run: npm run build:mp-weixin
      - name: 禁止生产包携带固定演示凭据
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin

  forbidden-files:
    name: 禁止文件检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描不应入库的文件
        run: |
          set -e
          echo "检查被 git 跟踪的敏感/产物文件..."
          FILES=$(git ls-files)
          BAD=$(echo "$FILES" | grep -E \
            '(^|/)\.env$|\.db$|(^|/)dist/|(^|/)node_modules/|(^|/)unpackage/|\.pem$|\.key$|(^|/)\.ai-backup/|(^|/)_local-backup/|backend/_pfull3\.txt|backend/scripts/_sec_verify\.py|一键构建\.bat|docs/ui/.*\.(zip|pdf)$' \
            || true)
          RUNTIME=$(echo "$FILES" | grep -E '(^|/)(uploads|exports)/' | grep -vE 'docs/ui/|docs/[^/]*/ui/|/internship-backend/uploads/|backend/app/.*/exports/' || true)
          BAD=$(printf '%s\n%s' "$BAD" "$RUNTIME" | grep -vE '^$' || true)
          if [ -n "$BAD" ]; then
            echo "❌ 发现不应入库的文件："
            echo "$BAD"
            exit 1
          fi
          echo "✅ 未发现禁止文件"

  # STAGE_A_AUTOFIX_BEGIN
  stage-a-autofix:
    name: 小程序阶段A源码施工与权威验证
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/miniapp-mp-weixin-release-hardening-20260729'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: test
      JWT_SECRET: stage-a-authoritative-secret-at-least-32-bytes
      DB_ENABLED: "true"
      MOCK_LOGIN_ENABLED: "true"
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: "1"
      VITE_API_BASE_URL: https://api.hnyueke.com
      VITE_USE_MOCK: "false"
      WECHAT_APPID: ${{ vars.WECHAT_APPID }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: 检出固定分支
        uses: actions/checkout@v4
        with:
          ref: agent/miniapp-mp-weixin-release-hardening-20260729
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - name: 应用阶段A精确补丁
        run: |
          python scripts/maintenance/hotfix_stage_a_runner.py
          python scripts/maintenance/hotfix_stage_a_runner_tail.py
          python scripts/maintenance/apply_miniapp_stage_a.py
          python scripts/maintenance/postprocess_stage_a_patch.py
      - name: 公共文件中心禁区和迁移红线检查
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only HEAD --)
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -E '(^|/)(file-center|file_center)(/|$)|miniapp/src/services/fileApi\.js|miniapp/src/services/fileCenter\.js|miniapp/src/stores/uploadQueue\.js|miniapp/src/components/file-center/|^backend/alembic/versions/|^miniapp/src/pages\.json$'; then
            echo "阶段A触碰公共文件中心、迁移或 pages.json 禁区"
            exit 1
          fi
      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Python编译与阶段A相关MySQL测试
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app tests
          pytest -q -p no:warnings \
            tests/test_mobile_stage_a_contracts.py \
            tests/test_mobile.py::test_home_aggregation_and_cross_tenant_isolation \
            tests/test_mobile.py::test_messages_self_only \
            tests/test_mobile.py::test_student_cannot_access_teacher \
            tests/test_mobile.py::test_requires_login \
            tests/test_mobile.py::test_teacher_overview_ok \
            tests/test_mobile.py::test_teacher_todos_403_and_200 \
            tests/test_mobile.py::test_new_endpoints_require_login \
            --durations=20
      - name: 安装小程序依赖
        working-directory: miniapp
        run: npm ci
      - name: 阶段A前端合同测试
        working-directory: miniapp
        run: npm test
      - name: H5生产构建
        working-directory: miniapp
        run: npm run build:h5
      - name: 微信生产构建
        working-directory: miniapp
        run: npm run build:mp-weixin:release
      - name: 固定演示凭据扫描
        working-directory: miniapp
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin
      - name: 差异格式检查
        run: git diff --check
      - name: 上传微信开发者工具导入目录
        uses: actions/upload-artifact@v4
        with:
          name: mp-weixin-importable-stage-a
          path: miniapp/dist/build/mp-weixin
          if-no-files-found: error
          retention-days: 14
      - name: 恢复永久闸门并精确提交
        shell: bash
        run: |
          set -euo pipefail
          python scripts/maintenance/finalize_stage_a_branch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          text = p.read_text(encoding='utf-8')
          marker = '\n  # STAGE_A_AUTOFIX_BEGIN\n'
          if marker not in text:
              raise SystemExit('stage A CI marker missing')
          text = text.split(marker, 1)[0].rstrip() + '\n'
          text = text.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/miniapp-mp-weixin-release.yml \
            .github/workflows/miniapp-stage-a-autofix.yml \
            scripts/maintenance/apply_miniapp_stage_a.py \
            scripts/maintenance/hotfix_stage_a_runner.py \
            scripts/maintenance/hotfix_stage_a_runner_tail.py \
            scripts/maintenance/postprocess_stage_a_patch.py \
            scripts/maintenance/finalize_stage_a_branch.py \
            backend/app/api/v1/mobile.py \
            backend/app/services/mobile_student_service.py \
            backend/app/services/mobile_teacher_service.py \
            backend/tests/test_mobile_stage_a_contracts.py \
            miniapp/package.json \
            miniapp/docs/mp-weixin-subpackage-candidates.md \
            miniapp/tests/stage-a-contract.test.mjs \
            miniapp/src/pages/student/home/index.vue \
            miniapp/src/pages/student/messages/index.vue \
            miniapp/src/pages/teacher/workbench/index.vue \
            miniapp/src/pages/teacher/todos/index.vue \
            miniapp/src/pages/teacher/risk-students/index.vue \
            miniapp/src/services/request.js \
            miniapp/src/services/realApi.js \
            miniapp/src/services/studentApi.js \
            miniapp/src/services/teacherApi.js \
            miniapp/src/stores/session.js \
            miniapp/src/stores/internshipContext.js \
            miniapp/src/utils/viewFreshness.js
          echo "精确暂存文件："
          git diff --cached --name-only
          git diff --cached --check
          git commit -m "perf(miniapp): close stage A non-file P0 issues"
          git push origin HEAD:agent/miniapp-mp-weixin-release-hardening-20260729
  # STAGE_A_AUTOFIX_END
