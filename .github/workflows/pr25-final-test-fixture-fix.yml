name: PR25 final fixture correction

on:
  push:
    branches:
      - audit/file-capability-inventory
    paths:
      - .github/workflows/pr25-final-test-fixture-fix.yml

permissions:
  contents: write

concurrency:
  group: pr25-final-fixture-correction
  cancel-in-progress: true

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0

      - name: Remove obsolete GraduationGuidance fixture fields
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/graduation_material_center_mysql_acceptance.py')
          source = path.read_text(encoding='utf-8')
          for obsolete in (
              '                hours=2,\n',
              '                advisor_name="阶段六指导教师",\n',
          ):
              if obsolete not in source:
                  raise SystemExit(f'obsolete fixture field missing: {obsolete.strip()}')
              source = source.replace(obsolete, '', 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit correction and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr25-final-test-fixture-fix.yml
          git add backend/tests/graduation_material_center_mysql_acceptance.py
          git diff --cached --check
          git commit -m "test(graduation): align phase6 guidance fixture with model"
          git push origin HEAD:audit/file-capability-inventory
