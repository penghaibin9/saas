name: PR41 backend diagnostic

on:
  push:
    branches:
      - agent/academic-affairs-p0-p2-hardening
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  academic-affairs-diagnostic:
    name: 教务系统专项测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: campus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:rootpass@127.0.0.1:3306/campus_test?charset=utf8mb4
      FAST_TEST_SCHEMA: "1"
      FIELD_ENCRYPTION_MASTER_KEY: test-only-master-key-32-bytes
      LOG_DECRYPTION_KEY: test-only-log-decryption-key-32b
      SECURITY_AUDIT_RETENTION_DAYS: "365"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: 运行并保存教务系统专项测试完整日志
        shell: bash
        working-directory: backend
        run: |
          mkdir -p /tmp/pr41-diagnostic
          CANDIDATES=(
            tests/unit/test_academic_affairs_models.py
            tests/unit/test_academic_affairs_service.py
            tests/test_department_permissions.py
            tests/test_user_pagination.py
          )
          TARGETS=()
          for target in "${CANDIDATES[@]}"; do
            if [ -f "$target" ]; then
              TARGETS+=("$target")
            fi
          done
          printf '%s\n' "${TARGETS[@]}" | tee /tmp/pr41-diagnostic/targets.txt
          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "No PR41 academic-affairs tests found" | tee /tmp/pr41-diagnostic/pytest.log
            echo 2 > /tmp/pr41-diagnostic/pytest-exit
            exit 0
          fi
          set +e
          python -m pytest -vv --tb=long --maxfail=1 "${TARGETS[@]}" 2>&1 | tee /tmp/pr41-diagnostic/pytest.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > /tmp/pr41-diagnostic/pytest-exit
          exit 0
      - name: 上传诊断日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr41-academic-affairs-diagnostic
          path: /tmp/pr41-diagnostic/
          if-no-files-found: error
          retention-days: 3
      - name: 保留真实测试结论
        if: always()
        shell: bash
        run: test "$(cat /tmp/pr41-diagnostic/pytest-exit)" = "0"
