name: PR41 backend diagnostic

on:
  push:
    branches:
      - agent/academic-affairs-p0-p2-hardening

permissions:
  contents: read

jobs:
  backend-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: campus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:rootpass@127.0.0.1:3306/campus_test?charset=utf8mb4
      FIELD_ENCRYPTION_MASTER_KEY: test-only-master-key-32-bytes
      LOG_DECRYPTION_KEY: test-only-log-decryption-key-32b
      SECURITY_AUDIT_RETENTION_DAYS: "365"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: 运行并保存教务及迁移测试完整日志
        shell: bash
        run: |
          cd backend
          mapfile -t TARGETS < <(find tests -maxdepth 1 -type f \( -name 'test_aa_*.py' -o -name 'test_alembic*.py' \) | sort)
          printf '%s\n' "${TARGETS[@]}" | tee /tmp/pr41-targets.txt
          set +e
          pytest -vv --tb=long --maxfail=10 "${TARGETS[@]}" 2>&1 | tee /tmp/pr41-pytest.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/pr41-pytest-exit
          exit 0
      - name: 上传诊断日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr41-backend-diagnostic
          path: |
            /tmp/pr41-targets.txt
            /tmp/pr41-pytest.log
            /tmp/pr41-pytest-exit
          if-no-files-found: error
          retention-days: 1
      - name: 保留真实测试结论
        if: always()
        shell: bash
        run: test "$(cat /tmp/pr41-pytest-exit)" = "0"
