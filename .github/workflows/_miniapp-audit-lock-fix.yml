name: Miniapp audit lock fix

on:
  push:
    branches: [agent/production-release-governance-20260807]
    paths:
      - '.github/workflows/_miniapp-audit-lock-fix.yml'

permissions:
  contents: write

jobs:
  fix-lock-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/production-release-governance-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - name: Apply only non-breaking lockfile audit fixes
        working-directory: miniapp
        run: |
          set -euo pipefail
          npm ci
          npm audit fix --package-lock-only || true
          git diff -- package-lock.json
          test -z "$(git status --short -- package.json)"
      - name: Commit only the miniapp lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- miniapp/package-lock.json; then
            echo 'No non-breaking lockfile fix available.'
            exit 0
          fi
          test -z "$(git status --short -- miniapp/package.json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add miniapp/package-lock.json
          test "$(git diff --cached --name-only)" = 'miniapp/package-lock.json'
          git commit -m 'security(miniapp): apply non-breaking audit lock fixes'
          git push origin HEAD:agent/production-release-governance-20260807
