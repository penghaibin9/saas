name: Temporary graduation deep-form readability polish

on:
  push:
    branches:
      - ui/graduation-shared-workspace-polish-20260908
    paths:
      - .github/workflows/tmp-graduation-form-readability-20260909.yml

permissions:
  contents: write

jobs:
  apply-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/graduation-shared-workspace-polish-20260908
          fetch-depth: 0

      - name: Apply guarded graduation form-only patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/modules/graduation/views/GraduationDefenseGradeFormView.vue')
          text = path.read_text(encoding='utf-8')

          replacements = [
            ('.dgf-context span{display:grid;min-width:145px;gap:1px;padding:6px 8px;border:1px solid var(--border-light);border-radius:8px;background:#fff;color:var(--text-secondary);font-size:10px}',
             '.dgf-context span{display:grid;min-width:145px;gap:2px;padding:7px 9px;border:1px solid var(--border-light);border-radius:8px;background:#fff;color:var(--text-secondary);font-size:12px;line-height:1.45}'),
            ('.dgf-context b{color:var(--text-tertiary);font-size:9px}',
             '.dgf-context b{color:var(--text-tertiary);font-size:11px}'),
            ('.dgf-command span,.dgf-actor span{color:var(--primary-600);font-size:9px;font-weight:700;letter-spacing:.06em}',
             '.dgf-command span,.dgf-actor span{color:var(--primary-600);font-size:11px;font-weight:700;letter-spacing:.04em}'),
            ('.dgf-command strong,.dgf-actor strong{color:var(--text-primary);font-size:12px}',
             '.dgf-command strong,.dgf-actor strong{color:var(--text-primary);font-size:14px}'),
            ('.dgf-command p,.dgf-actor small{margin:0;color:var(--text-secondary);font-size:9px;line-height:1.45}',
             '.dgf-command p,.dgf-actor small{margin:0;color:var(--text-secondary);font-size:12px;line-height:1.55}'),
            ('.dgf-command>b{padding:4px 7px;border-radius:999px;background:var(--warning-50);color:var(--warning-800);font-size:9px;white-space:nowrap}',
             '.dgf-command>b{padding:5px 8px;border-radius:999px;background:var(--warning-50);color:var(--warning-800);font-size:11px;white-space:nowrap}'),
            ('.dgf-fields>header span,.dgf-fields>header small{color:var(--text-tertiary);font-size:9px}',
             '.dgf-fields>header span,.dgf-fields>header small{color:var(--text-tertiary);font-size:11px}'),
            ('.dgf-fields>header strong{font-size:11px}',
             '.dgf-fields>header strong{font-size:13px}'),
            ('.dgf-check strong{font-size:10px}',
             '.dgf-check strong{font-size:13px}'),
            ('.dgf-check small{color:var(--text-tertiary);font-size:9px}',
             '.dgf-check small{color:var(--text-tertiary);font-size:12px;line-height:1.5}'),
            ('.dgf-aside-card>span{font-size:11px;font-weight:700}',
             '.dgf-aside-card>span{font-size:13px;font-weight:700}'),
            ('.dgf-aside-card li{display:flex;gap:7px;font-size:9px}',
             '.dgf-aside-card li{display:flex;gap:8px;font-size:12px;line-height:1.45}'),
            ('.dgf-aside-card li>b{display:grid;width:20px;height:20px;flex:none;place-items:center;border-radius:50%;background:var(--gray-100);color:var(--text-tertiary);font-size:8px}',
             '.dgf-aside-card li>b{display:grid;width:24px;height:24px;flex:none;place-items:center;border-radius:50%;background:var(--gray-100);color:var(--text-tertiary);font-size:11px}'),
            ('.dgf-aside-card li strong{font-size:9px}',
             '.dgf-aside-card li strong{font-size:12px}'),
            ('.dgf-aside-card li small{color:var(--text-tertiary);font-size:8px}',
             '.dgf-aside-card li small{color:var(--text-tertiary);font-size:11px;line-height:1.45}'),
            ('.dgf-next summary{cursor:pointer;color:var(--text-primary);font-size:10px;font-weight:700}',
             '.dgf-next summary{cursor:pointer;color:var(--text-primary);font-size:13px;font-weight:700}'),
            ('.dgf-next li{display:flex;gap:6px;color:var(--text-secondary);font-size:9px}',
             '.dgf-next li{display:flex;gap:8px;color:var(--text-secondary);font-size:12px;line-height:1.45}'),
            ('.dgf-next li::before{counter-increment:next;content:counter(next);display:grid;width:17px;height:17px;flex:none;place-items:center;border-radius:5px;background:var(--primary-50);color:var(--primary-700);font-size:8px}',
             '.dgf-next li::before{counter-increment:next;content:counter(next);display:grid;width:20px;height:20px;flex:none;place-items:center;border-radius:5px;background:var(--primary-50);color:var(--primary-700);font-size:10px}'),
            ('.mp-btn{padding:7px 15px;border:1px solid var(--line,#d9dee8);border-radius:8px;background:#fff;cursor:pointer;font-size:12px}',
             '.mp-btn{min-height:36px;padding:8px 15px;border:1px solid var(--line,#d9dee8);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:600}'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guarded style anchor mismatch: {old!r} count={count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate scoped product boundary
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = 'frontend/src/modules/graduation/views/GraduationDefenseGradeFormView.vue'
          node --test \
            frontend/tests/graduation.defense-grade-form-permission.contract.test.mjs \
            frontend/tests/graduation.v6-deep-link-and-cross-client.contract.test.mjs
          python - <<'PY'
          from pathlib import Path
          text = Path('frontend/src/modules/graduation/views/GraduationDefenseGradeFormView.vue').read_text(encoding='utf-8')
          required = [
            'font-size:12px;line-height:1.45}.dgf-context b',
            '.dgf-context b{color:var(--text-tertiary);font-size:11px}',
            '.dgf-command strong,.dgf-actor strong{color:var(--text-primary);font-size:14px}',
            'font-size:12px;line-height:1.55}.dgf-command>b',
            '.dgf-fields>header strong{font-size:13px}',
            '.dgf-check strong{font-size:13px}',
            'width:24px;height:24px',
            '.dgf-next summary{cursor:pointer;color:var(--text-primary);font-size:13px',
            '.mp-btn{min-height:36px',
            'await this.$router.push(snapshot.backTo)',
            'beforeRouteLeave(_to, _from, next)'
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing scoped marker: {marker}')
          forbidden = [
            '.dgf-context b{color:var(--text-tertiary);font-size:9px}',
            '.dgf-aside-card li small{color:var(--text-tertiary);font-size:8px}',
            '.dgf-next li{display:flex;gap:6px;color:var(--text-secondary);font-size:9px}'
          ]
          for marker in forbidden:
              if marker in text:
                  raise SystemExit(f'legacy tiny-copy marker remains: {marker}')
          print('graduation deep-form readability boundary: PASS')
          PY

      - name: Commit product polish and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-graduation-form-readability-20260909.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/modules/graduation/views/GraduationDefenseGradeFormView.vue \
                  .github/workflows/tmp-graduation-form-readability-20260909.yml
          git diff --cached --check
          git commit -m "style(graduation): improve deep form readability"
          git push origin HEAD:ui/graduation-shared-workspace-polish-20260908
