name: Observable file center stage 6-10 closure

on:
  push:
    branches: [audit/file-capability-inventory]
    paths: ['.github/workflows/file-center-closure-fix-v2.yml']

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: file-center-closure-fix-v2
  cancel-in-progress: true

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      APP_ENV: test
      SECRET_KEY: file-center-stage10-observable-closure
      FILE_SCAN_ENABLED: 'false'
      FILE_SCAN_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: student-portal/package-lock.json

      - name: Merge main and apply verified residual fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-commit origin/main || true

          UNMERGED="$(git diff --name-only --diff-filter=U)"
          if [ -n "$UNMERGED" ]; then
            if [ "$UNMERGED" != "student-portal/src/layouts/PortalLayout.vue" ]; then
              echo "Unexpected merge conflicts:"
              echo "$UNMERGED"
              exit 1
            fi
            git checkout --theirs -- student-portal/src/layouts/PortalLayout.vue
          fi

          python - <<'PY'
          from pathlib import Path
          import re

          def replace_range(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              target = Path(path)
              source = target.read_text(encoding='utf-8')
              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit(f'start marker missing: {path}: {start_marker!r}')
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'end marker missing: {path}: {end_marker!r}')
              target.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding='utf-8')
              if old not in source:
                  raise SystemExit(f'patch anchor missing: {path}')
              target.write_text(source.replace(old, new, 1), encoding='utf-8')

          # Keep main's complete V5 portal and restore only the file-center material-library context action.
          portal = Path('student-portal/src/layouts/PortalLayout.vue')
          source = portal.read_text(encoding='utf-8')
          if 'function toggleGraduationView()' not in source:
              button_anchor = '''          <button v-if="activeModulePath === 'internship'" class="sp-context-link" type="button" @click="toggleInternshipView">
            {{ route.name === 'internship-compliance' ? '返回实习工作台' : '上岗合规与安全教育' }}
          </button>
'''
              button = '''          <button v-if="activeModulePath === 'graduation'" class="sp-context-link" type="button" @click="toggleGraduationView">
            {{ route.name === 'graduation-material-library' ? '返回毕业设计工作台' : '我的材料库' }}
          </button>
'''
              function_anchor = '''function toggleInternshipView() {
  router.push(route.name === 'internship-compliance' ? '/internship' : '/internship/compliance')
}
'''
              function = '''function toggleGraduationView() {
  router.push(route.name === 'graduation-material-library' ? '/graduation' : '/graduation/materials')
}
'''
              if button_anchor not in source or function_anchor not in source:
                  raise SystemExit('PortalLayout V5 anchors missing')
              source = source.replace(button_anchor, button_anchor + button, 1)
              source = source.replace(function_anchor, function_anchor + function, 1)
          for marker in ('sp-theme__grid', 'student-portal-theme-change', "activeModulePath === 'graduation'", 'function toggleGraduationView()'):
              if marker not in source:
                  raise SystemExit(f'PortalLayout contract missing: {marker}')
          portal.write_text(source, encoding='utf-8')

          resolver_path = 'backend/app/services/file_access_resolvers.py'
          resolver = Path(resolver_path).read_text(encoding='utf-8')
          function_start = resolver.index('def scoped_binding_resolver(')
          block_start = resolver.index('    if active:', function_start)
          function_end = resolver.index('\n\ndef _graduation_student_ids', block_start)
          new_tail = '''    biz_type = str(file_obj.biz_type or "").upper()
    permission = _FILE_VIEW_PERMISSION.get(biz_type)
    subject_allowed = any(_binding_subject_allows(item, user) for item in active)

    if str(user.get("userType") or "").upper() == "STUDENT":
        biz_id = str(file_obj.biz_id or "").strip()
        if biz_id and biz_id in _student_scope_values(db, file_obj, user):
            return True
        return any(
            str(item.subject_type or "").upper() in {"STUDENT", "USER"}
            and _binding_subject_allows(item, user)
            for item in active
        )

    if permission and has_permission(user, permission):
        if biz_type in {"ATTACHMENT", "AID", "RISK", "MENTAL"}:
            return subject_allowed
        return True
    return subject_allowed
'''
          Path(resolver_path).write_text(resolver[:block_start] + new_tail + resolver[function_end:], encoding='utf-8')

          stage10_path = 'backend/tests/test_file_center_stage10_closure.py'
          stage10_replacement = '''def test_legacy_upload_alias_is_removed_and_authoritative_contract_is_single():
    legacy = _route_signatures(session_router.router)
    assert ("/upload", frozenset({"POST"})) not in legacy
    assert ("/meta/{file_id}", frozenset({"GET"})) not in legacy
    assert ("/download/{file_id}", frozenset({"GET"})) not in legacy
    assert not hasattr(session_router, "delegated_legacy_upload")

    authoritative = _route_signatures(authoritative_router.router)
    assert ("/files", frozenset({"POST"})) in authoritative
    assert ("/files/{file_id}", frozenset({"GET"})) in authoritative
    assert ("/files/download/{file_id}", frozenset({"GET"})) in authoritative
    source = inspect.getsource(authoritative_router.upload_file)
    assert "upload_contract(" in source
    assert "file_service.store_upload" not in source


'''
          replace_range(
              stage10_path,
              'def test_nonzero_call_upload_alias_is_delegated_not_duplicated():',
              'def test_upload_session_and_scan_routes_remain_available():',
              stage10_replacement,
          )

          storage_test = Path('backend/tests/test_file_storage.py')
          storage_source = storage_test.read_text(encoding='utf-8')
          storage_source, count = re.subn(
              r'def put_object\(self, Bucket, Body, Key\):  # noqa: N803\n\s+_FakeCosClient\.store\[Key\] = Body\.read\(\)',
              'def put_object(self, Bucket, Body, Key, ServerSideEncryption=None):  # noqa: N803\n        assert ServerSideEncryption == "AES256"\n        _FakeCosClient.store[Key] = Body.read()',
              storage_source,
              count=1,
          )
          if count != 1:
              raise SystemExit('COS fake client patch did not match exactly once')
          storage_test.write_text(storage_source, encoding='utf-8')

          phase6_path = 'backend/tests/graduation_material_center_mysql_acceptance.py'
          replace_range(
              phase6_path,
              '            GraduationGuidance(',
              '            GraduationArchiveRecord(',
              '''            GraduationGuidance(
                tenant_id=TENANT_ID,
                gd_student_id=student.id,
                guidance_date=datetime.utcnow(),
                method="ONLINE",
                content="阶段六指导记录；下一步完成归档",
                issues="无",
                attachments_json=[],
            ),
            GraduationMidterm(
                tenant_id=TENANT_ID,
                gd_student_id=student.id,
                status="CHECKED_PASS",
                check_comment="进度 80%，检查通过，下一步完成定稿",
                conclusion="PASS",
                checked_at=datetime.utcnow(),
            ),
''',
          )

          internship_test_path = 'backend/tests/test_internship_material_center.py'
          internship_replacement = '''def test_manifest_freezes_real_versions_and_package_rechecks_bytes():
    core = read("backend/app/modules/internship/services/internship_material_center_service.py")
    streaming = read("backend/app/modules/internship/services/internship_streaming_package_service.py")
    facade = read("backend/app/modules/internship/services/internship_material_center_facade.py")
    assert "version_id=int(item[\\"versionId\\"])" in facade
    assert "file_object_id=int(item[\\"fileId\\"])" in facade
    assert "manifestSha256" in core
    assert "version.file_object_id != file_row.id" in streaming
    assert "file_row.sha256 != item.sha256_snapshot" in streaming
    assert "expected_sha256=item.sha256_snapshot" in streaming
    assert "expected_size=int(item.size_snapshot or 0)" in streaming
    assert "INTERNSHIP_ARCHIVE_PACKAGE_FILE_VERSION_V2" in streaming
    assert 'add_json(archive_zip, "manifest.json"' in streaming
    assert ".read_bytes(" not in streaming


'''
          replace_range(
              internship_test_path,
              'def test_manifest_freezes_real_versions_and_package_rechecks_bytes():',
              'def test_existing_archive_freeze_and_revoke_are_preserved():',
              internship_replacement,
          )

          inventory = Path('docs/architecture/file-capability-inventory.d/10-streaming-archives.yaml')
          inventory.write_text('''entries:
  - module: file-center
    client: backend
    route: backend/app/services/streaming_archive_service.py
    page: backend/app/services/streaming_archive_service.py
    action: export+archive+stream
    fileCategory: STREAMING_ZIP_ARCHIVE
    api: internal archive boundary
    backendService: backend/app/services/streaming_archive_service.py
    storageMode: TEMP_FILE_ZIP64_CHUNKED
    authMode: internal-service-after-business-authorization
    dataScope: frozen-manifest+tenant+business-scope
    versioned: true
    scanGated: true
    preview: false
    download: false
    import: false
    export: true
    archive: true
    status: active
    risk: P0
    targetPhase: '10'
    notes: 材料逐块哈希并写入 ZIP64，校验冻结 SHA-256 与大小，不读取整文件或整包到内存。
  - module: internship
    client: backend
    route: /api/v1/internship/archive/{internshipId}/package
    page: backend/app/modules/internship/services/internship_streaming_package_service.py
    action: export+archive+stream
    fileCategory: INTERNSHIP_STREAMING_ARCHIVE
    api: POST /api/v1/internship/archive/{internshipId}/package
    backendService: backend/app/modules/internship/services/internship_streaming_package_service.py; backend/app/services/generated_file_path_service.py
    storageMode: FROZEN_MANIFEST_TO_STREAMING_ZIP_FILE_OBJECT
    authMode: internship.archive.package+tenant+record-scope
    dataScope: tenant+internship-record+frozen-file-version-manifest
    versioned: true
    scanGated: true
    preview: false
    download: true
    import: false
    export: true
    archive: true
    status: active
    risk: P0
    targetPhase: '10'
    notes: 只从冻结 Manifest 取当前版本，分块复核字节后经路径型 FileObject 边界持久化并审计。
''', encoding='utf-8')
          PY

          git add -- \
            student-portal/src/App.vue \
            student-portal/src/layouts/PortalLayout.vue \
            student-portal/src/styles/v5-overrides.css \
            student-portal/src/styles/v5-polish.css \
            student-portal/src/views/home/HomeView.vue \
            backend/app/services/file_access_resolvers.py \
            backend/tests/test_file_center_stage10_closure.py \
            backend/tests/test_file_storage.py \
            backend/tests/graduation_material_center_mysql_acceptance.py \
            backend/tests/test_internship_material_center.py \
            docs/architecture/file-capability-inventory.d/10-streaming-archives.yaml
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run real MySQL residual gates
        working-directory: backend
        run: |
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
          python -m compileall -q app tests
          pytest \
            tests/test_file_center_stage10_closure.py \
            tests/test_file_p0_authz.py \
            tests/test_file_storage.py \
            tests/test_graduation_material_center_phase6.py \
            tests/test_internship_material_center.py \
            tests/test_file_streaming_archive_cutover.py \
            -q -p no:warnings --durations=20

      - name: Run inventory and strict call scan
        run: |
          pip install pyyaml
          python scripts/audit_file_capabilities.py --check-schema
          python scripts/audit_file_capabilities.py --strict-baseline
          python scripts/check_new_file_capabilities.py --base-ref origin/main
          python scripts/audit_file_center_calls.py --strict --base-ref origin/main

      - name: Validate merged student portal V5
        working-directory: student-portal
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit verified merge and fixes
        run: |
          git commit -m "fix(file-center): close stage 6-10 residual gates and absorb main"
          git push origin HEAD:audit/file-capability-inventory

  report:
    if: always()
    needs: close
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RESULT: ${{ needs.close.result }}
    steps:
      - name: Report observable closure result
        run: |
          gh pr comment 25 --repo "$GITHUB_REPOSITORY" --body "<!-- file-center-closure-v2 -->
          ## 阶段 6–10 剩余根因施工

          - 结果：**${RESULT}**
          - 施工 SHA：\`${GITHUB_SHA}\`
          - 运行日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          仅在 MySQL、调用扫描和学生门户 V5 全绿后才会推送业务修复。"
