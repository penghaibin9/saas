name: Agent PR-A tenant ratchet fix

on:
  push:
    branches:
      - fix/system-audit-rbac-atomicity-20260813

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/system-audit-rbac-atomicity-20260813
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Replace two new naked Session.get calls with tenant_get
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/services/role_assignment_service.py')
          text = p.read_text(encoding='utf-8')
          fn_start = text.index('def effective_assignments(')
          fn_end = text.index('\n\ndef list_assignments(', fn_start)
          fn = text[fn_start:fn_end]
          old_import = '    from app.models import User, UserRole\n    from app.models.role_assignment import RoleAssignmentValidity\n'
          new_import = '    from app.core.tenant_scoped import tenant_get\n    from app.models import User, UserRole\n    from app.models.role_assignment import RoleAssignmentValidity\n'
          if fn.count(old_import) != 1:
              raise SystemExit('effective_assignments import anchor changed')
          fn = fn.replace(old_import, new_import, 1)
          old_account = '        account = db.get(User, int(user_id))\n'
          new_account = '        account = tenant_get(db, User, int(user_id), tenant_id=tid)\n'
          if fn.count(old_account) != 1:
              raise SystemExit('effective_assignments account db.get anchor changed')
          fn = fn.replace(old_account, new_account, 1)
          old_link = '            link = db.get(UserRole, int(row.user_role_id))\n'
          new_link = '            link = tenant_get(db, UserRole, int(row.user_role_id), tenant_id=tid)\n'
          if fn.count(old_link) != 1:
              raise SystemExit('effective_assignments UserRole db.get anchor changed')
          fn = fn.replace(old_link, new_link, 1)
          p.write_text(text[:fn_start] + fn + text[fn_end:], encoding='utf-8')
          PY
      - name: Tenant isolation ratchet must pass
        working-directory: backend
        run: python scripts/audit_tenant_queries.py --gate
      - name: Compile changed service
        run: python -m py_compile backend/app/services/role_assignment_service.py
      - name: Re-run PR-A critical MySQL contracts
        working-directory: backend
        run: |
          pytest \
            tests/test_critical_audit_atomicity.py \
            tests/test_system_admin_p0.py \
            tests/test_role_assignment_privilege_boundary.py \
            tests/test_role_assignment_validity.py \
            tests/test_audit_fail_closed_actions.py \
            tests/test_audit_evidence_integrity.py \
            -q -p no:warnings
      - name: Commit exact fix and remove temporary workflow
        run: |
          rm .github/workflows/agent-pr-a-tenant-ratchet-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/role_assignment_service.py .github/workflows/agent-pr-a-tenant-ratchet-fix.yml
          git diff --cached --check
          git commit -m "fix(rbac): scope assignment reads to tenant"
          git push origin HEAD:fix/system-audit-rbac-atomicity-20260813
