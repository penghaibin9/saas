name: Academic Archive Correction W1 Layer Fix

on:
  push:
    branches:
      - fix/academic-archive-correction-w1-20260821
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-layer:
    if: github.ref == 'refs/heads/fix/academic-archive-correction-w1-20260821'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact W1 branch
        uses: actions/checkout@v4
        with:
          ref: fix/academic-archive-correction-w1-20260821
          fetch-depth: 0

      - name: Patch confirmation above modal drawer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/modules/academicAffairs/components/AaArchiveCorrectionWorkspace.vue')
          text = path.read_text(encoding='utf-8')
          marker = '<style scoped>\n'
          rule = '''<style scoped>\n/* A confirmation opened from the teleported modal drawer must stay above it. */\n.aacw :deep(.app-confirm-dialog__mask) {\n  z-index: calc(var(--z-modal) + 1);\n}\n'''
          if 'z-index: calc(var(--z-modal) + 1);' not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f'expected one scoped style marker, got {text.count(marker)}')
              text = text.replace(marker, rule, 1)
              path.write_text(text, encoding='utf-8')
          PY
          grep -F "z-index: calc(var(--z-modal) + 1);" frontend/src/modules/academicAffairs/components/AaArchiveCorrectionWorkspace.vue
          git diff --check

      - name: Commit only W1 UI layer fix and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/src/modules/academicAffairs/components/AaArchiveCorrectionWorkspace.vue
          git rm -- .github/workflows/academic-archive-correction-w1-layer-fix.yml
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "fix(w1): layer correction confirmation above detail modal"
          git push origin HEAD:fix/academic-archive-correction-w1-20260821
