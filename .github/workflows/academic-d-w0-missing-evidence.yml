name: Academic D W0 missing evidence repair

on:
  push:
    branches:
      - agent/academic-d-graduation-delivery
    paths:
      - '.github/scripts/academic_d_w0_missing_evidence_patch.py'
      - '.github/workflows/academic-d-w0-missing-evidence.yml'

permissions:
  contents: write

jobs:
  patch-and-self-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-d-graduation-delivery
          fetch-depth: 0
      - name: Apply deterministic fail-closed patch
        run: python .github/scripts/academic_d_w0_missing_evidence_patch.py
      - name: Verify source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/app/modules/academic_affairs/services/academic_affairs_graduation_immutable_service.py').read_text(encoding='utf-8')
          assert 'required_unknown_blockers.issubset(present_codes)' in source
          test = Path('backend/tests/test_graduation_d_w0_contract.py').read_text(encoding='utf-8')
          assert 'test_d_w0_missing_required_evidence_item_cannot_pass' in test
          PY
      - name: Diff integrity
        run: git diff --check
      - name: Commit production fix and self-clean
        run: |
          rm .github/scripts/academic_d_w0_missing_evidence_patch.py
          rm .github/workflows/academic-d-w0-missing-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/modules/academic_affairs/services/academic_affairs_graduation_immutable_service.py backend/tests/test_graduation_d_w0_contract.py
          git add -u
          git diff --cached --check
          git commit -m 'fix(academic-d): fail closed on missing graduation evidence'
          git push origin HEAD:agent/academic-d-graduation-delivery
