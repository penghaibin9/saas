name: Student Affairs Migration Diagnose

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/student-affairs-migration-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/student-affairs-p0-p1-closeout-20260803
      - name: Print Alembic graph heads
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          revisions = {}
          parents = set()
          paths = {}
          for path in Path('backend/alembic/versions').glob('*.py'):
              tree = ast.parse(path.read_text(encoding='utf-8'))
              values = {}
              for node in tree.body:
                  if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                      if node.targets[0].id in {'revision', 'down_revision'}:
                          try: values[node.targets[0].id] = ast.literal_eval(node.value)
                          except Exception: pass
              rev = values.get('revision')
              down = values.get('down_revision')
              if not rev: continue
              revisions[rev] = down
              paths[rev] = str(path)
              if isinstance(down, (tuple, list)):
                  parents.update(x for x in down if x)
              elif down:
                  parents.add(down)
          heads = sorted(set(revisions) - parents)
          print('ALEMBIC_HEAD_COUNT', len(heads))
          for head in heads:
              print('ALEMBIC_HEAD', head, paths[head], 'DOWN', revisions[head])
          PY
