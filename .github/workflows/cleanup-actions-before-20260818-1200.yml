name: Cleanup runs before 2026-08-18 12:00 GMT+8

on:
  push:
    branches:
      - cleanup/actions-before-20260818-1200-r1
    paths:
      - .github/workflows/cleanup-actions-before-20260818-1200.yml

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    if: github.actor == 'penghaibin9'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Cancel and delete workflow runs before cutoff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          TEMP_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          temp_branch = os.environ["TEMP_BRANCH"]
          cutoff_range = "1970-01-01T00:00:00Z..2026-08-18T03:59:59Z"
          api = f"https://api.github.com/repos/{repo}"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "actions-run-cleanup",
          }

          def request(method, url, *, ok=(200, 201, 202, 204), body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read()
                      if resp.status not in ok:
                          raise RuntimeError(f"{method} {url}: HTTP {resp.status}")
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode(errors="replace")
                  if exc.code in ok:
                      return json.loads(raw) if raw else None
                  raise RuntimeError(f"{method} {url}: HTTP {exc.code}: {raw}") from exc

          def list_runs():
              query = urllib.parse.urlencode({"created": cutoff_range, "per_page": 100})
              data = request("GET", f"{api}/actions/runs?{query}")
              return data.get("workflow_runs", [])

          cancelled = 0
          deleted = 0
          rounds = 0

          while True:
              rounds += 1
              runs = [r for r in list_runs() if int(r["id"]) != current_run_id]
              if not runs:
                  break

              progress = False
              for run in runs:
                  run_id = int(run["id"])
                  status = run.get("status")
                  if status == "completed":
                      try:
                          request("DELETE", f"{api}/actions/runs/{run_id}", ok=(204,))
                          deleted += 1
                          progress = True
                      except RuntimeError as exc:
                          print(f"delete failed for {run_id}: {exc}")
                  else:
                      try:
                          request("POST", f"{api}/actions/runs/{run_id}/cancel", ok=(202, 409))
                          cancelled += 1
                          progress = True
                      except RuntimeError as exc:
                          print(f"cancel failed for {run_id}: {exc}")

              print(f"round={rounds} cancelled={cancelled} deleted={deleted} remaining_batch={len(runs)}")
              time.sleep(5 if progress else 15)

          remaining = [r for r in list_runs() if int(r["id"]) != current_run_id]
          if remaining:
              raise SystemExit(f"cleanup verification failed: {len(remaining)} runs remain before cutoff")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## Actions cleanup complete\n")
                  fh.write(f"- Cutoff: 2026-08-18 12:00 GMT+8\n")
                  fh.write(f"- Cancel requests: {cancelled}\n")
                  fh.write(f"- Deleted runs: {deleted}\n")
                  fh.write("- Verified: no workflow runs remain before cutoff\n")

          encoded_branch = urllib.parse.quote(temp_branch, safe="")
          request("DELETE", f"{api}/git/refs/heads/{encoded_branch}", ok=(204,))
          print(f"deleted temporary branch: {temp_branch}")
          PY
