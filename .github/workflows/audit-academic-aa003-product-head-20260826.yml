name: Audit Academic AA-003 Product Head 20260826

on:
  pull_request:
    branches:
      - fix/academic-affairs-final-rc-20260824
    paths:
      - '.github/workflows/audit-academic-aa003-product-head-20260826.yml'
      - 'e2e/specs/academic-aa003-status-change-gold-browser.spec.mjs'
      - 'backend/scripts/e2e_prepare_academic_aa003_status_change.py'
      - 'backend/scripts/e2e_assert_academic_aa003_status_change.py'

permissions:
  contents: read

concurrency:
  group: audit-academic-aa003-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  status-change-gold:
    name: exact product / four-surface returned-case resubmit / MySQL seal
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: academic_aa003_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      TARGET_SHA: ${{ github.event.pull_request.base.sha }}
      RUNNER_SHA: ${{ github.event.pull_request.head.sha }}
      SCHOOL_IAM_AUTHORITY_EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_aa003_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_aa003_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: academic_aa003_e2e
      REDIS_URL: redis://127.0.0.1:6379/12
      REDIS_KEY_PREFIX: academic-aa003-final-rc
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '3'
      JWT_SECRET: academic-aa003-browser-only-not-production
      JWT_SECRET_KEY: academic-aa003-browser-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_MINIAPP_BASE_URL: http://localhost:5188
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Assert clean product head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          echo "AA-003 exact product SHA: $TARGET_SHA"

      - name: Checkout audit-only AA-003 harness
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RUNNER_SHA }}
          path: audit-harness
          fetch-depth: 1

      - name: Overlay only AA-003 audit files
        run: |
          set -euo pipefail
          test "$(git -C audit-harness rev-parse HEAD)" = "$RUNNER_SHA"
          cp audit-harness/e2e/specs/academic-aa003-status-change-gold-browser.spec.mjs e2e/specs/academic-aa003-status-change-gold-browser.spec.mjs
          cp audit-harness/backend/scripts/e2e_prepare_academic_aa003_status_change.py backend/scripts/e2e_prepare_academic_aa003_status_change.py
          cp audit-harness/backend/scripts/e2e_assert_academic_aa003_status_change.py backend/scripts/e2e_assert_academic_aa003_status_change.py
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json
            miniapp/package-lock.json
            e2e/package-lock.json

      - name: Fast AA-003 source preflight
        run: |
          set -euo pipefail
          python -m py_compile backend/app/modules/academic_affairs/services/academic_affairs_change_resubmit_service.py
          python -m py_compile backend/app/modules/academic_affairs/services/academic_affairs_change_resubmit_meta_service.py
          python -m py_compile backend/app/api/v1/mobile_academic_status.py
          python -m py_compile backend/scripts/e2e_prepare_academic_aa003_status_change.py
          python -m py_compile backend/scripts/e2e_assert_academic_aa003_status_change.py
          node --check e2e/specs/academic-aa003-status-change-gold-browser.spec.mjs
          grep -q 'sameChangeId=1' backend/app/modules/academic_affairs/services/academic_affairs_change_resubmit_service.py
          grep -q 'expectedVersion: c.version' miniapp/src/pages/student/academic-affairs/status.vue
          grep -q '_aa003_resubmit_projection' backend/app/modules/academic_affairs/services/academic_affairs_change_resubmit_meta_service.py
          grep -q '/academic/status-changes/{change_id}/resubmit' backend/app/api/v1/mobile_academic_status.py

      - name: Install backend and migrate isolated MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head

      - name: Replay production School IAM Authority
        working-directory: backend
        run: PYTHONPATH=. python scripts/bootstrap_control_plane_school_iam_authority.py

      - name: Seed isolated tenant
        working-directory: backend
        run: python scripts/e2e_seed_playwright_tenants.py

      - name: Seed real School IAM runtime fixture
        working-directory: backend
        run: PYTHONPATH=. python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend with mock login disabled
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend-aa003.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend-aa003.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend-aa003.log
          exit 1

      - name: Bootstrap canonical browser accounts
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py

      - name: Prepare only AA-003 status-change identity scope and current term
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_prepare_academic_aa003_status_change.py
          test -s tmp/e2e_academic_aa003_state.local.json

      - name: Build and start Staff PC
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: ''
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend-aa003.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend-aa003.pid

      - name: Build and start Student PC
        env:
          VITE_BASE: /portal/
          VITE_API_BASE_URL: /
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd student-portal
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-aa003.log 2>&1 &
          echo $! > ../e2e/runtime-logs/student-aa003.pid

      - name: Dual-build and start Teacher/Student Mini H5
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd miniapp
          npm ci --no-audit --no-fund
          npm run build:h5
          npm run build:mp-weixin
          nohup npm run dev:h5 > ../e2e/runtime-logs/mini-aa003.log 2>&1 &
          echo $! > ../e2e/runtime-logs/mini-aa003.pid

      - name: Wait for all AA-003 browser surfaces
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login http://localhost:5188/; do
            ready=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ -z "$ready" ]; then
              echo "Surface not ready: $url"
              cat e2e/runtime-logs/*.log
              exit 1
            fi
          done

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run only AA-003 four-surface status-change Gold Deep
        working-directory: e2e
        run: npx playwright test specs/academic-aa003-status-change-gold-browser.spec.mjs --workers=1 --retries=0 --reporter=line

      - name: Assert AA-003 Direct MySQL final state
        working-directory: backend
        run: python scripts/e2e_assert_academic_aa003_status_change.py

      - name: Upload AA-003 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-aa003-product-evidence-${{ env.TARGET_SHA }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/academic-aa003-browser-outcome.json
            e2e/academic-aa003-mysql-seal.json
            backend/tmp/e2e_academic_aa003_state.local.json
            e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
