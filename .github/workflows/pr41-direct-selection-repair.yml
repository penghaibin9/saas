name: PR41 direct selection repair

on:
  push:
    branches:
      - agent/academic-affairs-p0-p2-hardening
    paths:
      - .github/workflows/pr41-direct-selection-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-affairs-p0-p2-hardening
          fetch-depth: 0
          persist-credentials: true
      - name: Patch timetable contract
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | python
          python -m py_compile backend/app/modules/academic_affairs/services/academic_affairs_selection_service.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/academic_affairs/services/academic_affairs_selection_service.py
          git commit -m "fix(academic-affairs): align selection timetable contract"
          git push origin HEAD:agent/academic-affairs-p0-p2-hardening
