name: PR219 R3 ticket targeted gate

on:
  push:
    branches:
      - audit/pr219-r3-ticket-runner-20260828
    paths:
      - '.github/workflows/academic-pr219-r3-ticket-targeted.yml'

permissions:
  contents: read

concurrency:
  group: pr219-r3-ticket-targeted
  cancel-in-progress: false

jobs:
  targeted:
    name: P1-01 AA-001 targeted pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: '1'
      FILE_STORAGE_PROVIDER: local
      LOCAL_UPLOAD_DIR: /tmp/saas-ci-uploads
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: 02cd2e5d57dd75c9c95b627e2e4fe41c18ea3f9e
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Run P1-01 precise test only
        working-directory: backend
        run: pytest -q tests/test_aa_term_authority_commands_r3.py
