name: Temporary Graduation PR267 Closeout

on:
  push:
    branches:
      - ui/graduation-shared-workspace-polish-20260908
    paths:
      - .github/workflows/_tmp_graduation_pr267_closeout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/graduation-shared-workspace-polish-20260908
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply graduation closeout patch
        run: python .github/scripts/_tmp_graduation_pr267_closeout.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Fix lint-only test formatting
        working-directory: frontend
        run: |
          npx eslint --fix \
            tests/graduation.defense-workspace-polish.test.mjs \
            tests/graduation.material-workspace-polish.test.mjs \
            tests/graduation.process-workspace-polish.test.mjs \
            tests/graduation.student-workspace-polish.test.mjs

      - name: Verify frontend graduation closeout
        working-directory: frontend
        run: |
          npm run lint
          node --test tests/graduation.*polish.test.mjs tests/graduation.shared-workspace*.test.mjs
          npm run build

      - name: Verify scoped diff
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
            'frontend/src/modules/graduation/views/AdminGraduationLayout.vue',
            'frontend/src/modules/graduation/views/GraduationDefenseGradeFormView.vue',
            'frontend/tests/graduation.final-integration-polish.test.mjs',
            'frontend/tests/graduation.defense-workspace-polish.test.mjs',
            'frontend/tests/graduation.material-workspace-polish.test.mjs',
            'frontend/tests/graduation.process-workspace-polish.test.mjs',
            'frontend/tests/graduation.student-workspace-polish.test.mjs',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected scoped diff: changed={sorted(changed)} expected={sorted(allowed)}')
          PY

      - name: Commit closeout and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/_tmp_graduation_pr267_closeout.yml
          rm .github/scripts/_tmp_graduation_pr267_closeout.py
          git add \
            frontend/src/modules/graduation/views/AdminGraduationLayout.vue \
            frontend/src/modules/graduation/views/GraduationDefenseGradeFormView.vue \
            frontend/tests/graduation.final-integration-polish.test.mjs \
            frontend/tests/graduation.defense-workspace-polish.test.mjs \
            frontend/tests/graduation.material-workspace-polish.test.mjs \
            frontend/tests/graduation.process-workspace-polish.test.mjs \
            frontend/tests/graduation.student-workspace-polish.test.mjs
          git add -u \
            .github/workflows/_tmp_graduation_pr267_closeout.yml \
            .github/scripts/_tmp_graduation_pr267_closeout.py
          git diff --cached --check
          git commit -m "fix(graduation): close final browser gate regressions"
          git push origin HEAD:ui/graduation-shared-workspace-polish-20260908
