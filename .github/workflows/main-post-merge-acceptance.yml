name: Main post-merge acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/main-post-merge-acceptance.yml'
      - 'deploy/backup/**'
      - 'deploy/systemd/**'
      - 'backend/requirements.txt'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'student-portal/package.json'
      - 'student-portal/package-lock.json'
      - 'miniapp/package.json'
      - 'miniapp/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-post-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrated-schema:
    name: Main / Alembic + migrated-schema contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_migrated
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DEPLOYMENT_MODE: local
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_migrated?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_migrated?charset=utf8mb4
      SECRET_KEY: main-post-merge-migrated-schema-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Enforce one Alembic head and upgrade clean MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          HEAD_COUNT="$(alembic heads | grep -c '(head)' || true)"
          alembic heads
          test "$HEAD_COUNT" = '1'
          mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"
          alembic upgrade head
          alembic current
      - name: Verify migrated schema parity
        working-directory: backend
        run: python ../scripts/check/check-migrated-schema-parity.py
      - name: Run migrated-schema P0 contracts
        working-directory: backend
        run: |
          timeout 30m pytest -q -p no:warnings \
            tests/test_domain_import.py \
            tests/test_import_tenant_isolation.py \
            tests/test_graduation_credit_dedup.py \
            tests/test_discipline_package11_integrity.py \
            tests/test_funding_package10_closeout.py \
            --durations=20

  backend-full:
    name: Main / backend full MySQL regression
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      SECRET_KEY: main-post-merge-backend-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app tests
      - name: Run complete backend regression
        working-directory: backend
        run: timeout 85m pytest -q -p no:warnings --durations=40

  admin-pc:
    name: Main / admin PC production build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  student-pc:
    name: Main / student PC production build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: student-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  miniapp:
    name: Main / H5 + WeChat production build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:h5
      - run: npm run build:mp-weixin
      - run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin

  release-gate:
    name: Main / canonical release gate
    if: always()
    needs: [migrated-schema, backend-full, admin-pc, student-pc, miniapp]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed unless every final-main gate passed
        env:
          MIGRATED: ${{ needs.migrated-schema.result }}
          BACKEND: ${{ needs.backend-full.result }}
          ADMIN_PC: ${{ needs.admin-pc.result }}
          STUDENT_PC: ${{ needs.student-pc.result }}
          MINIAPP: ${{ needs.miniapp.result }}
        run: |
          set -euo pipefail
          printf 'migrated=%s\nbackend=%s\nadmin_pc=%s\nstudent_pc=%s\nminiapp=%s\n' \
            "$MIGRATED" "$BACKEND" "$ADMIN_PC" "$STUDENT_PC" "$MINIAPP"
          test "$MIGRATED" = success
          test "$BACKEND" = success
          test "$ADMIN_PC" = success
          test "$STUDENT_PC" = success
          test "$MINIAPP" = success
          echo 'Canonical main post-merge acceptance passed.'
