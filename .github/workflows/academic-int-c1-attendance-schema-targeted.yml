name: Academic INT C-C1 Attendance Schema Targeted

on:
  push:
    branches:
      - integration/academic-school-gold
    paths:
      - .github/workflows/academic-int-c1-attendance-schema-targeted.yml

permissions:
  contents: write

concurrency:
  group: academic-int-c1-attendance-schema
  cancel-in-progress: false

jobs:
  c1-attendance-schema-mysql:
    name: C-C1 expand schema and legacy inventory / fresh MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: int_c1_root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pint_c1_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CI: 'true'
      APP_ENV: test
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:int_c1_root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:int_c1_root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: int_c1_root
      DB_NAME: student_lifecycle_test
      JWT_SECRET: academic-int-c1-targeted-not-production
      JWT_SECRET_KEY: academic-int-c1-targeted-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
    steps:
      - name: Checkout exact INT trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert C-C1 migration starts only after A-C4 green head
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 4ef175502a756e322b2957f2048fa87cc71a71c3 HEAD
          python - <<'PY'
          import subprocess
          files = subprocess.check_output([
              'git', 'diff', '--name-only',
              '4ef175502a756e322b2957f2048fa87cc71a71c3..HEAD',
          ], text=True).splitlines()
          print('C-C1 pre-code delta=', files)
          assert files == ['.github/workflows/academic-int-c1-attendance-schema-targeted.yml']
          PY
          grep -F 'revision = "20260816_acad_int_ac4"' backend/alembic/versions/20260816_academic_int_ac4_schema.py
          matches="$(grep -R --include='*.py' -F 'down_revision = "20260816_acad_int_ac4"' backend/alembic/versions || true)"
          test -z "$matches"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Materialize C-C1 expand schema
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path('backend/app/models/academic_affairs.py')
          text = model.read_text(encoding='utf-8')
          old_import = 'from sqlalchemy import (BigInteger, Boolean, CheckConstraint, DateTime, Integer, Numeric, String,\n                        Text, UniqueConstraint)'
          new_import = 'from sqlalchemy import (BigInteger, Boolean, CheckConstraint, DateTime, Index, Integer, Numeric, String,\n                        Text, UniqueConstraint)'
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import, 1)

          anchor = '''    class_id: Mapped[int | None] = mapped_column(BigInteger, index=True, comment="行政班")
    course_name: Mapped[str | None] = mapped_column(String(200))
    term_code: Mapped[str | None] = mapped_column(String(50))'''
          replacement = '''    class_id: Mapped[int | None] = mapped_column(BigInteger, index=True, comment="行政班")
    teaching_task_id: Mapped[int | None] = mapped_column(
        BigInteger,
        comment="INT C-C1: formal TeachingTask authority; ADMIN_SPECIAL / unresolved legacy may be NULL",
    )
    occurrence_identity: Mapped[str | None] = mapped_column(
        String(255),
        comment="INT C-C1: canonical formal occurrence identity; ADMIN_SPECIAL / unresolved legacy NULL",
    )
    source_type: Mapped[str | None] = mapped_column(
        String(30),
        comment="INT C-C1: FORMAL_TEACHING / ADMIN_SPECIAL; unresolved legacy remains NULL during expand",
    )
    source_reason: Mapped[str | None] = mapped_column(String(500), comment="ADMIN_SPECIAL reason; legacy unresolved NULL")
    source_evidence: Mapped[str | None] = mapped_column(Text, comment="ADMIN_SPECIAL or formal occurrence auditable evidence snapshot")
    course_name: Mapped[str | None] = mapped_column(String(200))
    term_code: Mapped[str | None] = mapped_column(String(50))'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, replacement, 1)

          tail = '''    status: Mapped[str] = mapped_column(String(20), nullable=False, default="DRAFT", index=True,
                                        comment="DRAFT/SUBMITTED")


# ═══════════ 学院专业班级 Tier1 R2'''
          tail_replacement = '''    status: Mapped[str] = mapped_column(String(20), nullable=False, default="DRAFT", index=True,
                                        comment="DRAFT/SUBMITTED")

    __table_args__ = (
        UniqueConstraint("tenant_id", "occurrence_identity", name="uk_aa_attendance_occurrence"),
        CheckConstraint(
            "source_type IS NULL OR source_type IN ('FORMAL_TEACHING','ADMIN_SPECIAL')",
            name="ck_aa_attendance_source_type",
        ),
        Index("ix_aa_attendance_task", "tenant_id", "teaching_task_id"),
        Index("ix_aa_attendance_source", "tenant_id", "source_type"),
    )


# ═══════════ 学院专业班级 Tier1 R2'''
          assert text.count(tail) == 1
          text = text.replace(tail, tail_replacement, 1)
          model.write_text(text, encoding='utf-8')
          PY

          cat > backend/alembic/versions/20260816_academic_int_c1_attendance.py <<'PY'
          """Academic INT C-C1 attendance source and occurrence expand schema.

          Revision ID: 20260816_acad_int_c1_att
          Revises: 20260816_acad_int_ac4

          Expand only: all new columns remain nullable so unresolved legacy facts are never guessed.
          The occurrence unique constraint spans soft-deleted history as well, preventing
          delete-and-recreate from manufacturing a second formal attendance fact.
          """
          from __future__ import annotations

          import sqlalchemy as sa
          from alembic import op

          revision = "20260816_acad_int_c1_att"
          down_revision = "20260816_acad_int_ac4"
          branch_labels = None
          depends_on = None

          TABLE = "t_aa_attendance_session"


          def _require_mysql() -> None:
              if op.get_bind().dialect.name != "mysql":
                  raise RuntimeError("20260816_acad_int_c1_att requires MySQL")


          def upgrade() -> None:
              _require_mysql()
              op.add_column(TABLE, sa.Column("teaching_task_id", sa.BigInteger(), nullable=True, comment="formal TeachingTask; special/legacy may be NULL"))
              op.add_column(TABLE, sa.Column("occurrence_identity", sa.String(length=255), nullable=True, comment="canonical formal occurrence identity"))
              op.add_column(TABLE, sa.Column("source_type", sa.String(length=30), nullable=True, comment="FORMAL_TEACHING/ADMIN_SPECIAL; legacy unresolved NULL"))
              op.add_column(TABLE, sa.Column("source_reason", sa.String(length=500), nullable=True, comment="ADMIN_SPECIAL reason"))
              op.add_column(TABLE, sa.Column("source_evidence", sa.Text(), nullable=True, comment="auditable source evidence snapshot"))
              op.create_unique_constraint("uk_aa_attendance_occurrence", TABLE, ["tenant_id", "occurrence_identity"])
              op.create_check_constraint("ck_aa_attendance_source_type", TABLE, "source_type IS NULL OR source_type IN ('FORMAL_TEACHING','ADMIN_SPECIAL')")
              op.create_index("ix_aa_attendance_task", TABLE, ["tenant_id", "teaching_task_id"], unique=False)
              op.create_index("ix_aa_attendance_source", TABLE, ["tenant_id", "source_type"], unique=False)


          def downgrade() -> None:
              _require_mysql()
              op.drop_index("ix_aa_attendance_source", table_name=TABLE)
              op.drop_index("ix_aa_attendance_task", table_name=TABLE)
              op.drop_constraint("ck_aa_attendance_source_type", TABLE, type_="check")
              op.drop_constraint("uk_aa_attendance_occurrence", TABLE, type_="unique")
              op.drop_column(TABLE, "source_evidence")
              op.drop_column(TABLE, "source_reason")
              op.drop_column(TABLE, "source_type")
              op.drop_column(TABLE, "occurrence_identity")
              op.drop_column(TABLE, "teaching_task_id")
          PY

          cat > backend/app/modules/academic_affairs/services/academic_affairs_attendance_migration_inventory.py <<'PY'
          """Read-only INT inventory for legacy Attendance source governance."""
          from __future__ import annotations

          from sqlalchemy import func


          def inventory_legacy_attendance_sources(db, tenant_id: int, *, sample_limit: int = 50) -> dict:
              from app.models import AaAttendanceSession, AffairsAuditTrail

              tid = int(tenant_id)
              limit = max(1, min(int(sample_limit or 50), 200))
              legacy = [
                  AaAttendanceSession.tenant_id == tid,
                  AaAttendanceSession.source_type.is_(None),
              ]
              manual_audit = [
                  AffairsAuditTrail.tenant_id == tid,
                  AffairsAuditTrail.biz_type == "AA_ATTENDANCE",
                  AffairsAuditTrail.action == "CREATE",
                  AffairsAuditTrail.biz_id.isnot(None),
                  AffairsAuditTrail.detail.contains("source=ADMIN_MANUAL"),
              ]

              manual_ids = db.query(AffairsAuditTrail.biz_id).filter(*manual_audit).distinct().subquery()
              total = int(db.query(func.count(AaAttendanceSession.id)).filter(*legacy).scalar() or 0)
              active = int(db.query(func.count(AaAttendanceSession.id)).filter(
                  *legacy, AaAttendanceSession.is_deleted.is_(False),
              ).scalar() or 0)
              matched = int(db.query(func.count(AaAttendanceSession.id)).filter(
                  *legacy, AaAttendanceSession.id.in_(manual_ids),
              ).scalar() or 0)

              term_totals = dict(db.query(
                  AaAttendanceSession.term_code, func.count(AaAttendanceSession.id),
              ).filter(*legacy).group_by(AaAttendanceSession.term_code).all())
              term_matched = dict(db.query(
                  AaAttendanceSession.term_code, func.count(AaAttendanceSession.id),
              ).filter(*legacy, AaAttendanceSession.id.in_(manual_ids)).group_by(AaAttendanceSession.term_code).all())
              terms = []
              for term_code in sorted(term_totals, key=lambda value: str(value or "")):
                  count = int(term_totals[term_code] or 0)
                  proven = int(term_matched.get(term_code, 0) or 0)
                  terms.append({
                      "termCode": term_code,
                      "legacyRows": count,
                      "manualAuditMatchedRows": proven,
                      "unresolvedRows": count - proven,
                  })

              unresolved_ids = [int(row[0]) for row in db.query(AaAttendanceSession.id).filter(
                  *legacy, ~AaAttendanceSession.id.in_(manual_ids),
              ).order_by(AaAttendanceSession.id.asc()).limit(limit).all()]
              orphan_audit_ids = [int(row[0]) for row in db.query(AffairsAuditTrail.biz_id).filter(
                  *manual_audit,
                  ~AffairsAuditTrail.biz_id.in_(
                      db.query(AaAttendanceSession.id).filter(AaAttendanceSession.tenant_id == tid)
                  ),
              ).distinct().order_by(AffairsAuditTrail.biz_id.asc()).limit(limit).all()]

              return {
                  "tenantId": str(tid),
                  "legacyRows": total,
                  "activeLegacyRows": active,
                  "deletedLegacyRows": total - active,
                  "manualAuditMatchedRows": matched,
                  "unresolvedRows": total - matched,
                  "orphanManualAuditRows": len(orphan_audit_ids),
                  "unresolvedSampleSessionIds": unresolved_ids,
                  "orphanManualAuditSampleBizIds": orphan_audit_ids,
                  "terms": terms,
                  "mutationPerformed": False,
              }
          PY

          cat > backend/tests/test_academic_int_c1_attendance_schema_mysql.py <<'PY'
          """INT C-C1 Attendance expand schema, uniqueness, vocabulary and legacy inventory."""
          from __future__ import annotations

          from pathlib import Path

          import pytest
          from sqlalchemy import inspect
          from sqlalchemy.exc import IntegrityError, OperationalError

          from app.db.session import get_sessionmaker
          from app.models import AaAttendanceSession, AffairsAuditTrail
          from app.modules.academic_affairs.services.academic_affairs_attendance_migration_inventory import (
              inventory_legacy_attendance_sources,
          )


          def _mysql_code(exc: Exception) -> int | None:
              original = getattr(exc, "orig", None)
              args = getattr(original, "args", ())
              return int(args[0]) if args and isinstance(args[0], int) else None


          def _attendance(*, tenant_id: int, date: str, slot: int, source_type=None, occurrence=None, deleted=False):
              return AaAttendanceSession(
                  tenant_id=tenant_id,
                  class_id=7001,
                  teaching_task_id=8001 if source_type == "FORMAL_TEACHING" else None,
                  occurrence_identity=occurrence,
                  source_type=source_type,
                  source_reason="管理员补录证据齐全" if source_type == "ADMIN_SPECIAL" else None,
                  source_evidence="ticket:INT-C1" if source_type == "ADMIN_SPECIAL" else None,
                  course_name="INT C-C1",
                  term_code="2026-1",
                  teacher_key="INT-T1",
                  session_date=date,
                  slot_no=slot,
                  roster_json="[]",
                  total_count=0,
                  present_count=0,
                  absent_count=0,
                  status="DRAFT",
                  is_deleted=deleted,
              )


          def test_int_c1_schema_contract_is_expand_only_and_matches_frozen_handoff():
              columns = AaAttendanceSession.__table__.c
              for name in ("teaching_task_id", "occurrence_identity", "source_type", "source_reason", "source_evidence"):
                  assert columns[name].nullable is True
              assert columns["occurrence_identity"].type.length == 255
              assert columns["source_type"].type.length == 30
              constraints = {c.name: c for c in AaAttendanceSession.__table__.constraints if c.name}
              assert tuple(constraints["uk_aa_attendance_occurrence"].columns.keys()) == ("tenant_id", "occurrence_identity")
              check = str(constraints["ck_aa_attendance_source_type"].sqltext)
              assert "FORMAL_TEACHING" in check and "ADMIN_SPECIAL" in check and "IS NULL" in check
              source = Path("alembic/versions/20260816_academic_int_c1_attendance.py").read_text(encoding="utf-8")
              upper = source.upper()
              assert 'down_revision = "20260816_acad_int_ac4"' in source
              assert "UPDATE T_AA_ATTENDANCE_SESSION" not in upper
              assert "DELETE FROM T_AA_ATTENDANCE_SESSION" not in upper
              assert "NULLABLE=FALSE" not in upper


          def test_int_c1_mysql_unique_and_source_vocabulary_are_real(db_mode):
              db = get_sessionmaker()()
              try:
                  inspector = inspect(db.bind)
                  columns = {c["name"]: c for c in inspector.get_columns("t_aa_attendance_session")}
                  for name in ("teaching_task_id", "occurrence_identity", "source_type", "source_reason", "source_evidence"):
                      assert columns[name]["nullable"] is True
                  uniques = {u["name"]: tuple(u["column_names"]) for u in inspector.get_unique_constraints("t_aa_attendance_session")}
                  assert uniques["uk_aa_attendance_occurrence"] == ("tenant_id", "occurrence_identity")
                  checks = {c["name"]: c["sqltext"] for c in inspector.get_check_constraints("t_aa_attendance_session")}
                  assert "ck_aa_attendance_source_type" in checks

                  tenant = 1000000000000008911
                  identity = "V1:TASK:8001:ITEM:9001:DATE:2026-03-02:SLOT:2"
                  db.add(_attendance(tenant_id=tenant, date="2026-03-02", slot=2, source_type="FORMAL_TEACHING", occurrence=identity))
                  db.commit()
                  db.add(_attendance(tenant_id=tenant, date="2026-03-02", slot=2, source_type="FORMAL_TEACHING", occurrence=identity))
                  with pytest.raises(IntegrityError) as duplicate:
                      db.commit()
                  assert _mysql_code(duplicate.value) == 1062
                  db.rollback()

                  db.add_all([
                      _attendance(tenant_id=tenant + 1, date="2026-03-02", slot=2, source_type="FORMAL_TEACHING", occurrence=identity),
                      _attendance(tenant_id=tenant, date="2026-03-03", slot=3, source_type="ADMIN_SPECIAL", occurrence=None),
                      _attendance(tenant_id=tenant, date="2026-03-04", slot=4, source_type=None, occurrence=None),
                  ])
                  db.commit()
                  db.add(_attendance(tenant_id=tenant, date="2026-03-05", slot=5, source_type="ADMIN_MANUAL", occurrence=None))
                  with pytest.raises(OperationalError) as invalid_source:
                      db.commit()
                  assert _mysql_code(invalid_source.value) == 3819
                  db.rollback()
              finally:
                  db.close()


          def test_int_c1_legacy_inventory_is_same_tenant_read_only_and_repeatable(db_mode):
              db = get_sessionmaker()()
              try:
                  tenant = 1000000000000008921
                  matched = _attendance(tenant_id=tenant, date="2026-04-01", slot=1)
                  unresolved = _attendance(tenant_id=tenant, date="2026-04-02", slot=2)
                  deleted = _attendance(tenant_id=tenant, date="2026-04-03", slot=3, deleted=True)
                  modern = _attendance(tenant_id=tenant, date="2026-04-04", slot=4, source_type="FORMAL_TEACHING", occurrence="V1:MODERN:8921")
                  db.add_all([matched, unresolved, deleted, modern])
                  db.flush()
                  db.add_all([
                      AffairsAuditTrail(tenant_id=tenant, biz_type="AA_ATTENDANCE", biz_id=matched.id, action="CREATE", operator="int", detail="task=-;source=ADMIN_MANUAL;course=x"),
                      AffairsAuditTrail(tenant_id=tenant + 1, biz_type="AA_ATTENDANCE", biz_id=unresolved.id, action="CREATE", operator="neighbor", detail="source=ADMIN_MANUAL"),
                      AffairsAuditTrail(tenant_id=tenant, biz_type="AA_ATTENDANCE", biz_id=999999991, action="CREATE", operator="orphan", detail="source=ADMIN_MANUAL"),
                  ])
                  db.commit()

                  before = db.query(AaAttendanceSession).filter(AaAttendanceSession.tenant_id == tenant).count()
                  first = inventory_legacy_attendance_sources(db, tenant, sample_limit=10)
                  second = inventory_legacy_attendance_sources(db, tenant, sample_limit=10)
                  after = db.query(AaAttendanceSession).filter(AaAttendanceSession.tenant_id == tenant).count()
                  assert first == second
                  assert before == after == 4
                  assert first["legacyRows"] == 3
                  assert first["activeLegacyRows"] == 2
                  assert first["deletedLegacyRows"] == 1
                  assert first["manualAuditMatchedRows"] == 1
                  assert first["unresolvedRows"] == 2
                  assert first["orphanManualAuditRows"] == 1
                  assert unresolved.id in first["unresolvedSampleSessionIds"]
                  assert matched.id not in first["unresolvedSampleSessionIds"]
                  assert first["mutationPerformed"] is False
              finally:
                  db.close()
          PY

      - name: Audit exact generated scope
        run: |
          python -m py_compile \
            backend/app/models/academic_affairs.py \
            backend/alembic/versions/20260816_academic_int_c1_attendance.py \
            backend/app/modules/academic_affairs/services/academic_affairs_attendance_migration_inventory.py \
            backend/tests/test_academic_int_c1_attendance_schema_mysql.py
          git diff --check
          python - <<'PY'
          import subprocess
          expected = sorted([
              'backend/app/models/academic_affairs.py',
              'backend/alembic/versions/20260816_academic_int_c1_attendance.py',
              'backend/app/modules/academic_affairs/services/academic_affairs_attendance_migration_inventory.py',
              'backend/tests/test_academic_int_c1_attendance_schema_mysql.py',
          ])
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z']).decode('utf-8')
          actual = sorted(record[3:] for record in raw.split('\0') if record)
          print('generated scope=', actual)
          assert actual == expected
          PY

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Fresh MySQL upgrade downgrade upgrade
        working-directory: backend
        run: |
          alembic upgrade head
          test "$(alembic heads | tr -d '\r')" = "20260816_acad_int_c1_att (head)"
          alembic downgrade 20260816_acad_int_ac4
          alembic upgrade head
          test "$(alembic heads | tr -d '\r')" = "20260816_acad_int_c1_att (head)"

      - name: Run only C-C1 schema and inventory contracts
        working-directory: backend
        run: |
          pytest -q tests/test_academic_int_c1_attendance_schema_mysql.py --maxfail=1 --junitxml=/tmp/c1-attendance-junit.xml

      - name: Atomic fast-forward INT only after green
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/models/academic_affairs.py \
            backend/alembic/versions/20260816_academic_int_c1_attendance.py \
            backend/app/modules/academic_affairs/services/academic_affairs_attendance_migration_inventory.py \
            backend/tests/test_academic_int_c1_attendance_schema_mysql.py
          git diff --cached --check
          git commit -m "feat(academic-int): add C-C1 attendance expand schema"
          git fetch origin integration/academic-school-gold
          test "$(git rev-parse origin/integration/academic-school-gold)" = "$GITHUB_SHA"
          git push origin HEAD:integration/academic-school-gold

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-int-c1-attendance-${{ github.run_id }}
          path: /tmp/c1-attendance-junit.xml
          if-no-files-found: warn
          retention-days: 14
