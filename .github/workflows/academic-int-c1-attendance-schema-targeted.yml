name: Academic INT C-C1 Attendance Expand Targeted

on:
  push:
    branches:
      - integration/academic-school-gold
    paths:
      - .github/workflows/academic-int-c1-attendance-schema-targeted.yml

permissions:
  contents: write

concurrency:
  group: academic-int-c1-attendance-expand
  cancel-in-progress: false

jobs:
  c1-attendance-expand-mysql:
    name: C-C1 expand schema and legacy inventory / fresh MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: int_c1_root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pint_c1_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CI: 'true'
      APP_ENV: test
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:int_c1_root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:int_c1_root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: int_c1_root
      DB_NAME: student_lifecycle_test
      JWT_SECRET: academic-int-c1-targeted-not-production
      JWT_SECRET_KEY: academic-int-c1-targeted-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
    steps:
      - name: Checkout exact INT trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert A-C4 green base and workflow-only INT delta
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 4ef175502a756e322b2957f2048fa87cc71a71c3 HEAD
          python - <<'PY'
          import subprocess
          files = subprocess.check_output([
              "git", "diff", "--name-only",
              "4ef175502a756e322b2957f2048fa87cc71a71c3..HEAD",
          ], text=True).splitlines()
          print("pre-code delta=", files)
          assert files == [".github/workflows/academic-int-c1-attendance-schema-targeted.yml"]
          PY
          matches="$(grep -R --include='*.py' -F 'down_revision = "20260816_acad_int_ac4"' backend/alembic/versions || true)"
          test -z "$matches"

      - name: Fetch pinned C-C1 staging
        run: |
          git fetch origin tmp/academic-int-c1-attendance-expand-staging
          test "$(git rev-parse FETCH_HEAD)" = "fb60ebac80d5a91b52e72de48882276eff07d1e8"

      - name: Materialize exact four-file candidate
        run: |
          git show FETCH_HEAD:.tmp/academic-int-c1-attendance-expand/materialize_model.py > /tmp/materialize_model.py
          git show FETCH_HEAD:.tmp/academic-int-c1-attendance-expand/migration.py > backend/alembic/versions/20260816_academic_int_c1_attendance.py
          git show FETCH_HEAD:.tmp/academic-int-c1-attendance-expand/inventory.py > backend/app/modules/academic_affairs/services/academic_affairs_attendance_migration_inventory.py
          git show FETCH_HEAD:.tmp/academic-int-c1-attendance-expand/test_schema_mysql.py > backend/tests/test_academic_int_c1_attendance_schema_mysql.py
          python /tmp/materialize_model.py
          python -m py_compile \
            backend/app/models/academic_affairs.py \
            backend/alembic/versions/20260816_academic_int_c1_attendance.py \
            backend/app/modules/academic_affairs/services/academic_affairs_attendance_migration_inventory.py \
            backend/tests/test_academic_int_c1_attendance_schema_mysql.py

      - name: Audit exact generated scope
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          expected = sorted([
              "backend/alembic/versions/20260816_academic_int_c1_attendance.py",
              "backend/app/models/academic_affairs.py",
              "backend/app/modules/academic_affairs/services/academic_affairs_attendance_migration_inventory.py",
              "backend/tests/test_academic_int_c1_attendance_schema_mysql.py",
          ])
          raw = subprocess.check_output(["git", "status", "--porcelain=v1", "-z"]).decode("utf-8")
          actual = sorted(record[3:] for record in raw.split("\0") if record)
          print("generated scope=", actual)
          assert actual == expected
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Fresh MySQL upgrade downgrade upgrade
        working-directory: backend
        run: |
          alembic upgrade head
          test "$(alembic heads | tr -d '\r')" = "20260816_acad_int_c1_att (head)"
          alembic downgrade 20260816_acad_int_ac4
          alembic upgrade head
          test "$(alembic heads | tr -d '\r')" = "20260816_acad_int_c1_att (head)"

      - name: Run only C-C1 expand and inventory contracts
        working-directory: backend
        run: |
          pytest -q tests/test_academic_int_c1_attendance_schema_mysql.py \
            --maxfail=1 \
            --junitxml=/tmp/c1-attendance-junit.xml

      - name: Atomic fast-forward INT only after green
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/alembic/versions/20260816_academic_int_c1_attendance.py \
            backend/app/models/academic_affairs.py \
            backend/app/modules/academic_affairs/services/academic_affairs_attendance_migration_inventory.py \
            backend/tests/test_academic_int_c1_attendance_schema_mysql.py
          git diff --cached --check
          git commit -m "feat(academic-int): add C-C1 attendance expand schema"
          git fetch origin integration/academic-school-gold
          test "$(git rev-parse origin/integration/academic-school-gold)" = "$GITHUB_SHA"
          git push origin HEAD:integration/academic-school-gold

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-int-c1-attendance-${{ github.run_id }}
          path: /tmp/c1-attendance-junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary staging branch
        if: success()
        continue-on-error: true
        run: git push origin --delete tmp/academic-int-c1-attendance-expand-staging
