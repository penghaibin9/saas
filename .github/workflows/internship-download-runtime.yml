name: Internship repair runtime evidence
on:
  push:
    branches: [fix/internship-download-repair-20260909]
    paths:
      - '.github/workflows/internship-download-runtime.yml'
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DEPLOYMENT_MODE: development
      DEBUG: 'false'
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      CAPACITY_EPHEMERAL_ACK: student_lifecycle_test
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: download-repair-ephemeral-local-test-only-20260909
      INTERNAL_OPS_TOKEN: download-repair-local-observability-only
      MOCK_LOGIN_ENABLED: 'true'
      SCHEDULER_MODE: external
      BASE_URL: http://127.0.0.1:8000
      PROFILE: smoke
      SCENARIO: mixed
      IDENTITY_MODE: cold
      STUDENT_SHARE_PERCENT: '75'
      SUMMARY_PATH: /work/performance/results/k6-summary.json
      K6_STUDENT_TOKENS_FILE: /work/performance/secrets/student-tokens.json
      K6_TEACHER_TOKENS_FILE: /work/performance/secrets/teacher-tokens.json
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent" --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python scripts/repair-payload/materialize_for_test.py
      - run: pip install -r backend/requirements.txt cryptography
      - name: Migrated test fixture and measured smoke
        run: |
          set -euo pipefail
          mkdir -p performance/results
          cp /tmp/repair-proof/manifest.json performance/results/source-manifest.json
          (cd backend && alembic upgrade head)
          python performance/tools/seed_local_capacity_env.py --out performance/secrets --token-count 2
          (cd backend && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log --log-config ../performance/uvicorn-capacity-log.json > ../performance/results/backend.log 2>&1 &)
          ready=false
          for i in $(seq 1 90); do if curl -fsS "$BASE_URL/health" >/dev/null; then ready=true; break; fi; sleep 1; done
          test "$ready" = true
          python performance/tools/probe_observability.py --base-url "$BASE_URL" --samples 3 --interval 0.2 --output performance/results/observability-before.json
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/work" -w /work -e BASE_URL -e PROFILE -e SCENARIO -e IDENTITY_MODE -e STUDENT_SHARE_PERCENT -e SUMMARY_PATH -e K6_STUDENT_TOKENS_FILE -e K6_TEACHER_TOKENS_FILE grafana/k6:0.54.0 run performance/k6/capacity.js 2>&1 | tee performance/results/k6-console.log
      - name: Preserve actual verdict
        if: always()
        run: |
          python performance/tools/probe_observability.py --base-url "$BASE_URL" --samples 3 --interval 0.2 --output performance/results/observability-after.json
          python performance/tools/evaluate_capacity_result.py --profile smoke --identity-mode cold --summary performance/results/k6-summary.json --v3 performance/results/k6-summary-v3.json --before performance/results/observability-before.json --after performance/results/observability-after.json --output performance/results/capacity-verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-capacity-${{ github.run_id }}
          path: performance/results/
          if-no-files-found: warn
          retention-days: 14
  funding-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/14
      REDIS_KEY_PREFIX: repair-browser-${{ github.run_id }}
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: playwright-e2e-only-not-production
      JWT_SECRET_KEY: playwright-e2e-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_ENTERPRISE_BASE_URL: http://127.0.0.1:5202/enterprise
      E2E_MINIAPP_BASE_URL: http://127.0.0.1:5188
      E2E_EXPECTED_SHA: ${{ github.sha }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root --silent" --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/repair-payload/materialize_for_test.py
      - uses: ./.github/actions/browser-runtime
        with:
          profile: full
          head_sha: ${{ github.sha }}
          verify_gold_manifest: 'false'
      - name: Original failing funding journey with real API and MySQL
        working-directory: e2e
        run: npx playwright test specs/golden-rollout-student-affairs-funding.spec.mjs --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-funding-browser-${{ github.run_id }}
          path: |
            /tmp/repair-proof/manifest.json
            e2e/test-results/
            e2e/playwright-report/
            artifacts/browser-runtime/
          if-no-files-found: warn
          retention-days: 14
