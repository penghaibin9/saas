name: Graduation V6 Gold Candidate

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact reviewed commit SHA. Leave blank to use the selected branch HEAD.
        required: false
        type: string

concurrency:
  group: graduation-gold-candidate-${{ inputs.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: reviewed candidate / no auto-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/14
      REDIS_KEY_PREFIX: graduation-gold-${{ github.run_id }}
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: graduation-gold-only-not-production
      JWT_SECRET_KEY: graduation-gold-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_ENTERPRISE_BASE_URL: http://127.0.0.1:5202/enterprise
      E2E_MINIAPP_BASE_URL: http://127.0.0.1:5188
      E2E_EXPECTED_SHA: ${{ inputs.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.E2E_EXPECTED_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json
            miniapp/package-lock.json
            e2e/package-lock.json

      - name: Bootstrap unified graduation Gold runtime
        uses: ./.github/actions/browser-runtime
        with:
          profile: graduation
          head_sha: ${{ env.E2E_EXPECTED_SHA }}
          verify_gold_manifest: 'true'

      - name: Generate exact-head candidates and immutable inventory
        run: bash scripts/e2e/run-browser-suite.sh graduation-gold

      - name: Publish candidate summary
        if: always()
        run: |
          echo '## Graduation Gold candidate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Trigger: manual, after functional browser gate review' >> "$GITHUB_STEP_SUMMARY"
          echo '- Policy: candidate only; no baseline commit or auto-promotion' >> "$GITHUB_STEP_SUMMARY"
          test ! -f e2e/gold-candidate/candidate-inventory.json || cat e2e/gold-candidate/candidate-inventory.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate snapshots and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graduation-v6-gold-candidate-${{ github.run_id }}
          path: |
            e2e/specs/graduation-v9-*-visual.spec.mjs-snapshots/*.png
            e2e/gold-candidate/
            e2e/test-results/
            e2e/gate-results/
            e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload candidate service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graduation-v6-gold-candidate-logs-${{ github.run_id }}
          path: e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
