name: File center streaming scan closeout

on:
  push:
    branches:
      - audit/file-capability-inventory
    paths:
      - .github/workflows/file-center-streaming-scan-closeout.yml

permissions:
  contents: write

concurrency:
  group: file-center-streaming-scan-closeout
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply path-based XLSX and bounded ClamAV response patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1) XLSX utility: validate and parse either bytes or a governed local path.
          path = 'backend/app/services/xlsx_util.py'
          source = read(path)
          if 'from pathlib import Path\n' not in source:
              source = source.replace('from datetime import datetime\n', 'from datetime import datetime\nfrom pathlib import Path\n', 1)
          start = source.index('def validate_xlsx_package(')
          end = source.index('\ndef build_template_xlsx(', start)
          replacement = '''def _validate_xlsx_archive(archive: zipfile.ZipFile) -> None:
              members = archive.infolist()
              if len(members) > MAX_ZIP_ENTRIES:
                  raise AppException("VALIDATION_ERROR", "XLSX 内部文件数量异常")
              total = 0
              for member in members:
                  name = member.filename.replace("\\\\", "/").lower()
                  if name.startswith("/") or ".." in name.split("/"):
                      raise AppException("VALIDATION_ERROR", "XLSX 包含非法路径")
                  total += member.file_size
                  if total > MAX_UNCOMPRESSED_BYTES:
                      raise AppException("VALIDATION_ERROR", "XLSX 解压后体积异常")
                  if member.file_size > 1024 * 1024 and member.compress_size > 0:
                      if member.file_size / member.compress_size > 100:
                          raise AppException("VALIDATION_ERROR", "XLSX 压缩比异常")
                  if (
                      name.endswith(".bin")
                      or "vbaproject" in name
                      or "/embeddings/" in name
                      or "/oleobjects/" in name
                      or "/externallinks/" in name
                  ):
                      raise AppException("VALIDATION_ERROR", "XLSX 不允许宏、嵌入对象或外部链接")


def validate_xlsx_package(file_bytes: bytes) -> None:
              """Reject zip bombs, path traversal, macros, OLE and external workbook links."""
              if not file_bytes or len(file_bytes) > MAX_UPLOAD_BYTES:
                  raise AppException("VALIDATION_ERROR", "Excel 文件为空或超过 10MB")
              stream = io.BytesIO(file_bytes)
              if not zipfile.is_zipfile(stream):
                  raise AppException("VALIDATION_ERROR", "文件内容不是有效的 XLSX")
              try:
                  with zipfile.ZipFile(stream) as archive:
                      _validate_xlsx_archive(archive)
              except zipfile.BadZipFile:
                  raise AppException("VALIDATION_ERROR", "文件内容不是有效的 XLSX") from None


def validate_xlsx_path(file_path: str | Path) -> Path:
              """Validate a governed local XLSX without loading the whole file into memory."""
              target = Path(file_path)
              if not target.is_file():
                  raise AppException("VALIDATION_ERROR", "Excel 文件不存在")
              size = target.stat().st_size
              if size <= 0 or size > MAX_UPLOAD_BYTES:
                  raise AppException("VALIDATION_ERROR", "Excel 文件为空或超过 10MB")
              if not zipfile.is_zipfile(target):
                  raise AppException("VALIDATION_ERROR", "文件内容不是有效的 XLSX")
              try:
                  with zipfile.ZipFile(target) as archive:
                      _validate_xlsx_archive(archive)
              except zipfile.BadZipFile:
                  raise AppException("VALIDATION_ERROR", "文件内容不是有效的 XLSX") from None
              return target


def _read_xlsx_source(source, header_map: dict[str, str]) -> list[dict]:
              wb = load_workbook(source, read_only=True, data_only=True, keep_links=False)
              try:
                  if len(wb.worksheets) > 10:
                      raise AppException("VALIDATION_ERROR", "XLSX 工作表不得超过 10 个")
                  ws = wb["导入模板"] if "导入模板" in wb.sheetnames else wb.worksheets[0]
                  if ws.max_column > 100:
                      raise AppException("VALIDATION_ERROR", "XLSX 单表列数不得超过 100")
                  if ws.max_row > MAX_ROWS + 1:
                      raise AppException("VALIDATION_ERROR", f"单次导入不得超过 {MAX_ROWS} 行")
                  it = ws.iter_rows(values_only=True)
                  try:
                      header = next(it)
                  except StopIteration:
                      return []
                  idx_key: dict[int, str] = {}
                  for i, h in enumerate(header):
                      name = str(h).strip() if h is not None else ""
                      name = name.rstrip(" *").strip()
                      if name in header_map:
                          idx_key[i] = header_map[name]
                  out: list[dict] = []
                  for row in it:
                      if row is None:
                          continue
                      item, empty = {}, True
                      for i, key in idx_key.items():
                          value = row[i] if i < len(row) else None
                          text = "" if value is None else str(value).strip()
                          item[key] = text
                          if text:
                              empty = False
                      if not empty:
                          out.append(item)
                      if len(out) > MAX_ROWS:
                          raise AppException("VALIDATION_ERROR", f"单次导入不得超过 {MAX_ROWS} 行")
                  return out
              finally:
                  wb.close()


def read_xlsx(file_bytes: bytes, header_map: dict[str, str]) -> list[dict]:
              """Parse XLSX bytes for legacy callers."""
              validate_xlsx_package(file_bytes)
              return _read_xlsx_source(io.BytesIO(file_bytes), header_map)


def read_xlsx_path(file_path: str | Path, header_map: dict[str, str]) -> list[dict]:
              """Parse a governed local XLSX path without creating a whole-file bytes copy."""
              target = validate_xlsx_path(file_path)
              return _read_xlsx_source(target, header_map)

'''
          # Normalize indentation intentionally introduced by the heredoc.
          replacement = '\n'.join(line[12:] if line.startswith('            ') else line for line in replacement.splitlines()) + '\n'
          source = source[:start] + replacement + source[end + 1:]
          write(path, source)

          # 2) Public Excel pipeline exposes a path reader.
          path = 'backend/app/services/excel/pipeline.py'
          source = read(path)
          if 'from pathlib import Path\n' not in source:
              source = source.replace('from datetime import datetime\n', 'from datetime import datetime\nfrom pathlib import Path\n', 1)
          anchor = '''def read_upload(spec: ImportSpec, file_bytes: bytes) -> list:
              """上传 .xlsx → list[dict]（按表头映射为字段 key）。"""
              _enforce_spec_permission(spec)
              return xlsx_util.read_xlsx(file_bytes, spec.header_map)
'''
          anchor = '\n'.join(line[12:] if line.startswith('            ') else line for line in anchor.splitlines())
          addition = anchor + '''


def read_upload_path(spec: ImportSpec, file_path: str | Path) -> list:
    """已扫描的本地 .xlsx 路径 → list[dict]，不复制整文件到内存。"""
    _enforce_spec_permission(spec)
    return xlsx_util.read_xlsx_path(file_path, spec.header_map)
'''
          if 'def read_upload_path(' not in source:
              if anchor not in source:
                  raise SystemExit('excel pipeline read_upload anchor missing')
              source = source.replace(anchor, addition, 1)
          write(path, source)

          path = 'backend/app/services/excel/__init__.py'
          source = read(path)
          source = source.replace(
              'pre_validate, read_upload)',
              'pre_validate, read_upload, read_upload_path)',
              1,
          )
          source = source.replace(
              '"build_template", "read_upload", "pre_validate",',
              '"build_template", "read_upload", "read_upload_path", "pre_validate",',
              1,
          )
          write(path, source)

          # 3) Roster adapter exposes the path-based reader.
          path = 'backend/app/modules/academic_affairs/services/academic_affairs_service.py'
          source = read(path)
          anchor = '''def roster_import_read(content: bytes) -> list:
    from app.services import excel
    return excel.read_upload(build_roster_import_spec(), content)
'''
          addition = anchor + '''


def roster_import_read_path(file_path) -> list:
    from app.services import excel
    return excel.read_upload_path(build_roster_import_spec(), file_path)
'''
          if 'def roster_import_read_path(' not in source:
              if anchor not in source:
                  raise SystemExit('roster import reader anchor missing')
              source = source.replace(anchor, addition, 1)
          write(path, source)

          # 4) Academic import lifecycle keeps and parses the governed local path.
          path = 'backend/app/modules/academic_affairs/services/academic_file_exchange_service.py'
          source = read(path)
          if 'from pathlib import Path\n' not in source:
              source = source.replace('from datetime import timedelta\n', 'from datetime import timedelta\nfrom pathlib import Path\n', 1)
          start = source.index('def _source_file_bytes(')
          end = source.index('\ndef _detail(', start)
          block = '''def _source_file_path(import_row, user: dict) -> Path:
    from app.models.file import FileObject
    from app.services.file_scan_service import assert_file_ready_for_business
    from app.services.storage import get_backend

    if not import_row.source_file_id:
        raise AppException("DATA_CONFLICT", "导入任务缺少原始文件，请重新上传")
    assert_file_ready_for_business(str(import_row.source_file_id), user=user)
    db = get_sessionmaker()()
    try:
        file_row = db.scalars(select(FileObject).where(
            FileObject.id == int(import_row.source_file_id),
            FileObject.tenant_id == jobs._tenant_id(),
            FileObject.is_deleted.is_(False),
        )).first()
        if not file_row:
            raise not_found("导入原始文件不存在")
        if int(file_row.size_bytes or 0) > MAX_IMPORT_BYTES:
            raise AppException("FILE_TOO_LARGE", "教务导入文件超过 20MB，请拆分后重试")
        path = get_backend().fetch_local(file_row.file_key)
        if not path or not path.exists():
            raise not_found("导入原始文件不存在或已清理")
        if path.stat().st_size > MAX_IMPORT_BYTES:
            raise AppException("FILE_TOO_LARGE", "教务导入文件超过 20MB，请拆分后重试")
        return Path(path)
    finally:
        db.close()


def _parse_and_validate(import_row, source_path: Path, user: dict) -> tuple[list[dict], dict]:
    snapshot = dict(import_row.source_snapshot_json or {})
    context = dict(snapshot.get("context") or {})
    if import_row.import_type == ACADEMIC_ROSTER_IMPORT:
        from app.modules.academic_affairs.services import academic_affairs_service as roster
        rows = roster.roster_import_read_path(source_path)
        return rows, roster.roster_import_dry_run(rows)
    if import_row.import_type == ACADEMIC_GRADE_IMPORT:
        from app.modules.academic_affairs.services import academic_affairs_grade_service as grade
        from app.services import xlsx_util
        task_id = int(context.get("taskId") or 0)
        if not task_id:
            raise AppException("DATA_CONFLICT", "成绩导入任务缺少成绩任务编号")
        rows = xlsx_util.read_xlsx_path(source_path, grade.IMPORT_HEADER_MAP)
        return rows, grade.grade_import_dry_run(task_id, user, rows)
    if import_row.import_type == ACADEMIC_SCHEDULE_IMPORT:
        from app.modules.academic_affairs.services import academic_affairs_schedule_service as schedule
        from app.services import xlsx_util
        batch_id = int(context.get("batchId") or 0)
        if not batch_id:
            raise AppException("DATA_CONFLICT", "排课导入任务缺少排课批次编号")
        rows = xlsx_util.read_xlsx_path(source_path, schedule.IMPORT_HEADER_MAP)
        if len(rows) > schedule.IMPORT_MAX_ROWS:
            raise AppException("VALIDATION_ERROR", f"单批导入行数不得超过 {schedule.IMPORT_MAX_ROWS} 行")
        rows = schedule.sanitize_import_rows(rows)
        return rows, {
            "totalRows": len(rows),
            "validRows": len(rows),
            "invalidRows": 0,
            "errors": [],
        }
    raise AppException("DATA_CONFLICT", "未知教务导入类型")

'''
          source = source[:start] + block + source[end + 1:]
          source = source.replace('content = _source_file_bytes(current, user)', 'source_path = _source_file_path(current, user)')
          source = source.replace('rows, preview = _parse_and_validate(row, content, user)', 'rows, preview = _parse_and_validate(row, source_path, user)')
          source = source.replace('content = _source_file_bytes(row, user)', 'source_path = _source_file_path(row, user)')
          if '_source_file_bytes' in source or '_parse_and_validate(row, content, user)' in source:
              raise SystemExit('academic file exchange still contains bytes parser path')
          write(path, source)

          # 5) Compatibility export metadata checks use a temporary path, not BytesIO workbook parsing.
          path = 'backend/app/modules/academic_affairs/services/academic_export_compat_service.py'
          source = read(path)
          source = source.replace('import io\n', '')
          if 'import tempfile\n' not in source:
              source = source.replace('import json\n', 'import json\nimport tempfile\n', 1)
          start = source.index('def _row_count(')
          end = source.index('\ndef task_backed_file_response(', start)
          block = '''def _row_count(content: bytes, filename: str) -> int:
    lower = str(filename or "").lower()
    suffix = ".xlsx" if lower.endswith(".xlsx") else ".zip" if lower.endswith(".zip") else ""
    if not suffix:
        return 0
    try:
        with tempfile.NamedTemporaryFile(suffix=suffix) as handle:
            handle.write(content)
            handle.flush()
            if suffix == ".xlsx":
                workbook = load_workbook(handle.name, read_only=True, data_only=True)
                try:
                    sheet = workbook.active
                    return max(0, int(sheet.max_row or 0) - 1)
                finally:
                    workbook.close()
            with zipfile.ZipFile(handle.name, "r") as archive:
                return len([item for item in archive.infolist() if not item.is_dir()])
    except Exception:
        # 行数只是任务展示信息，生成文件本身仍由领域服务和后续下载校验负责。
        return 0

'''
          source = source[:start] + block + source[end + 1:]
          write(path, source)

          # 6) ClamAV protocol response is bounded and accumulated incrementally.
          path = 'backend/app/services/clamav_client.py'
          source = read(path)
          old = '''        chunks: list[bytes] = []
        size = 0
        while size < limit:
            try:
                part = sock.recv(min(4096, limit - size))
            except OSError as exc:
                raise ClamAVUnavailable(f"ClamAV read failed: {exc}") from exc
            if not part:
                break
            chunks.append(part)
            size += len(part)
            if b"\\0" in part or b"\\n" in part:
                break
        return b"".join(chunks).rstrip(b"\\0\\r\\n").decode("utf-8", errors="replace")
'''
          new = '''        response = bytearray()
        while len(response) < limit:
            try:
                part = sock.recv(min(4096, limit - len(response)))
            except OSError as exc:
                raise ClamAVUnavailable(f"ClamAV read failed: {exc}") from exc
            if not part:
                break
            response.extend(part)
            if b"\\0" in part or b"\\n" in part:
                break
        return response.rstrip(b"\\0\\r\\n").decode("utf-8", errors="replace")
'''
          if old not in source:
              raise SystemExit('ClamAV response anchor missing')
          source = source.replace(old, new, 1)
          write(path, source)
          PY
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile changed production paths
        working-directory: backend
        run: |
          python -m py_compile \
            app/services/xlsx_util.py \
            app/services/excel/pipeline.py \
            app/services/excel/__init__.py \
            app/services/clamav_client.py \
            app/modules/academic_affairs/services/academic_affairs_service.py \
            app/modules/academic_affairs/services/academic_file_exchange_service.py \
            app/modules/academic_affairs/services/academic_export_compat_service.py
      - name: Run strict scanner and targeted contracts
        run: |
          python scripts/audit_file_center_calls.py --strict --base-ref origin/main
          cd backend
          pytest -q -p no:warnings \
            tests/test_academic_file_exchange_center.py \
            tests/test_academic_export_compat.py \
            tests/test_file_center_stage10_closure.py \
            tests/test_file_scan_clamav.py
      - name: Commit verified fixes and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/file-center-streaming-scan-closeout.yml
          git add -- \
            backend/app/services/xlsx_util.py \
            backend/app/services/excel/pipeline.py \
            backend/app/services/excel/__init__.py \
            backend/app/services/clamav_client.py \
            backend/app/modules/academic_affairs/services/academic_affairs_service.py \
            backend/app/modules/academic_affairs/services/academic_file_exchange_service.py \
            backend/app/modules/academic_affairs/services/academic_export_compat_service.py
          git diff --cached --check
          git commit -m "fix(file-center): stream academic imports and scan responses"
          git push origin HEAD:audit/file-capability-inventory
