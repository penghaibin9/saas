name: Academic INT Control Plane Alembic Convergence

on:
  push:
    branches:
      - integration/academic-school-gold
    paths:
      - 'backend/alembic/versions/20260817_academic_int_control_plane_merge.py'
      - '.github/workflows/academic-int-control-plane-convergence.yml'

concurrency:
  group: academic-int-control-plane-convergence
  cancel-in-progress: false

jobs:
  alembic-convergence:
    name: Academic / Control Plane Alembic single-head convergence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      APP_ENV: test
      SECRET_KEY: academic-int-alembic-convergence-ci
    steps:
      - name: Checkout exact INT head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact head and latest main ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --no-tags
          echo "INT_HEAD=$(git rev-parse HEAD)"
          echo "MAIN_HEAD=$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$(git rev-parse origin/main)" HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Prove pure two-parent convergence source
        run: |
          set -euo pipefail
          FILE=backend/alembic/versions/20260817_academic_int_control_plane_merge.py
          grep -F 'revision = "20260817_acad_int_ctrl_merge"' "$FILE"
          grep -F '"20260816_acad_int_c1_att"' "$FILE"
          grep -F '"20260816_merge_ctrl_intern_e"' "$FILE"
          ! grep -E 'op\.(add_column|create_table|create_index|create_unique_constraint|alter_column|execute)' "$FILE"

      - name: Prove Alembic has exactly one head
        working-directory: backend
        run: |
          set -euo pipefail
          HEADS="$(alembic heads)"
          echo "$HEADS"
          test "$(printf '%s\n' "$HEADS" | grep -c ' (head)')" = "1"
          printf '%s\n' "$HEADS" | grep -F '20260817_acad_int_ctrl_merge (head)'

      - name: Fresh MySQL upgrade to converged head
        working-directory: backend
        run: |
          set -euo pipefail
          alembic upgrade head
          alembic current | grep -F '20260817_acad_int_ctrl_merge (head)'

      - name: Main-lineage MySQL upgrade discovers Academic branch then converges
        working-directory: backend
        run: |
          set -euo pipefail
          python - <<'PY'
          import pymysql
          conn = pymysql.connect(host='127.0.0.1', user='root', password='root', autocommit=True)
          try:
              with conn.cursor() as cur:
                  cur.execute('DROP DATABASE IF EXISTS student_lifecycle_upgrade_path')
                  cur.execute('CREATE DATABASE student_lifecycle_upgrade_path CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci')
          finally:
              conn.close()
          PY
          export DATABASE_URL='mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_upgrade_path?charset=utf8mb4'
          export TEST_DATABASE_URL="$DATABASE_URL"
          alembic upgrade 20260816_merge_ctrl_intern_e
          alembic current | grep -F '20260816_merge_ctrl_intern_e'
          alembic upgrade head
          alembic current | grep -F '20260817_acad_int_ctrl_merge (head)'
