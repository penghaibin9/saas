name: One-shot student affairs V6 contextual deep links

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/feat/student-affairs-v6-a1-on-theme-shell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/student-affairs-v6-a1-on-theme-shell
          fetch-depth: 0

      - name: Apply audited contextual deep-link patch
        run: python .github/scripts/patch_student_affairs_v6_contextual_deeplinks.py

      - name: Validate and commit product files
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- frontend/src/layouts/BasePortalLayout.vue frontend/src/config/navPlan.js frontend/src/modules/studentAffairs/views/StudentAffairsRiskListView.vue; then
            echo "contextual deep-link patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/layouts/BasePortalLayout.vue frontend/src/config/navPlan.js frontend/src/modules/studentAffairs/views/StudentAffairsRiskListView.vue
          git commit -m "feat(student-affairs): expose contextual third-level deep links"
          git push origin HEAD:feat/student-affairs-v6-a1-on-theme-shell
