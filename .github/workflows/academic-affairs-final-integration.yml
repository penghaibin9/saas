name: 教务最终集成执行

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/academic-affairs-4ends
    paths:
      - '.github/workflows/academic-affairs-final-integration.yml'

permissions:
  contents: write
  pull-requests: write
  statuses: read
  actions: read

concurrency:
  group: academic-affairs-final-integration
  cancel-in-progress: false

jobs:
  integrate:
    name: 从最新 main 压缩集成教务四端成果
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: saas_test
          MYSQL_USER: saas
          MYSQL_PASSWORD: saas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SOURCE_BRANCH: refactor/academic-affairs-4ends
      FINAL_BRANCH: integrate/academic-affairs-final-20260729
      SECOND_STAGE_MAIN: 7ffa498e8604c4ba6961e87807dbcbc522f67baa
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://saas:saas@127.0.0.1:3306/saas_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://saas:saas@127.0.0.1:3306/saas_test?charset=utf8mb4
      JWT_SECRET: ci-academic-affairs-final-integration-secret
      MOCK_LOGIN_ENABLED: 'false'
      APP_ENV: test
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout 教务施工源
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 冻结最新 main 与施工源 HEAD
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "academic-affairs-integration-bot"
          git config user.email "academic-affairs-integration@users.noreply.github.com"
          git fetch origin main "$SOURCE_BRANCH" --prune
          MAIN_SHA=$(git rev-parse origin/main)
          SOURCE_SHA=$(git rev-parse "origin/$SOURCE_BRANCH")
          {
            echo "MAIN_SHA=$MAIN_SHA"
            echo "SOURCE_SHA=$SOURCE_SHA"
          } >> "$GITHUB_ENV"
          printf 'main=%s\nsource=%s\n' "$MAIN_SHA" "$SOURCE_SHA" | tee /tmp/frozen-heads.txt
          git diff --name-only "$SECOND_STAGE_MAIN" "$MAIN_SHA" > /tmp/main-after-stage2.txt || true
          if [ -s /tmp/main-after-stage2.txt ]; then
            echo "第二阶段后 main 新增提交涉及文件："
            cat /tmp/main-after-stage2.txt
          else
            echo "第二阶段后 main HEAD 未变化。"
          fi

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 确认施工源专项兼容状态
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_SHA"
          cd backend
          python -m compileall -q app tests
          pytest -q \
            tests/test_aa_main_migration_compat.py \
            tests/test_aa_model_extension_compat.py \
            tests/test_aa_route_registration_main_compat.py \
            tests/test_aa_route_uniqueness.py \
            tests/test_aa_shared_exception_compat.py \
            tests/test_aa_source_branch_dependency_closure.py \
            tests/test_aa_student_portal_route_main_compat.py \
            tests/test_aa_miniapp_main_compat.py \
            tests/test_aa_main_permission_middleware_compat.py \
            tests/test_aa_scope_fail_closed.py \
            tests/test_security_student_identity.py
          echo "source-compat=success" > /tmp/source-validation.txt

      - name: 执行 squash 冲突审计并回到最新 main
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B __academic_squash_audit "$MAIN_SHA"
          set +e
          git merge --squash --no-commit "$SOURCE_SHA" > /tmp/squash-audit.log 2>&1
          SQUASH_CODE=$?
          set -e
          git diff --name-only --diff-filter=U | sort -u > /tmp/squash-conflicts.txt
          echo "squash_exit=$SQUASH_CODE" | tee /tmp/squash-result.txt
          echo "冲突文件："
          cat /tmp/squash-conflicts.txt || true
          git reset --hard "$MAIN_SHA"
          git clean -fd
          git checkout -B "$FINAL_BRANCH" "$MAIN_SHA"

      - name: 从施工源抽取已收口的教务成果
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/imported-files.txt
          : > /tmp/skipped-files.txt

          is_allowed() {
            case "$1" in
              backend/alembic/versions/0127_aa_*|\
              backend/alembic/versions/0128_aa_*|\
              backend/alembic/versions/0129_aa_*|\
              backend/alembic/versions/0130_aa_*|\
              backend/alembic/versions/0131_aa_*|\
              backend/alembic/versions/0132_aa_*|\
              backend/alembic/versions/0133_aa_*|\
              backend/alembic/versions/0134_aa_*|\
              backend/app/modules/academic_affairs/*|\
              backend/app/models/academic_affairs_*|\
              backend/app/models/academic_grade_extensions.py|\
              backend/tests/test_aa_*|\
              backend/tests/test_security_student_identity.py|\
              frontend/src/modules/academicAffairs/*|\
              student-portal/src/views/academic/*|\
              student-portal/src/router/academicRoutes.js|\
              miniapp/src/pages/student/academic-affairs/*|\
              miniapp/src/pages/teacher/academic-affairs/*|\
              miniapp/src/pages/teacher/academic-task/*|\
              miniapp/src/pages/teacher/academic-warning/*|\
              miniapp/src/pages/teacher/exam-defer/*|\
              miniapp/src/pages/teacher/my-schedule/*|\
              miniapp/src/services/academic*.js|\
              miniapp/src/stores/sessionAcademicPlugin.js)
                return 0 ;;

              backend/app/api/v1/route_registration.py|\
              backend/app/core/exceptions.py|\
              backend/app/models/__init__.py|\
              backend/app/services/mobile_student_identity_facade.py|\
              backend/app/student_portal/services/__init__.py|\
              backend/app/student_portal/services/academic_*.py|\
              frontend/src/config/adminMenu.js|\
              frontend/src/components/common/AppStatusTag.vue|\
              student-portal/src/components/StatusTag.vue|\
              student-portal/src/main.js|\
              student-portal/src/router/index.js|\
              student-portal/src/services/portalApi.js|\
              student-portal/src/views/home/HomeView.vue|\
              student-portal/src/views/internship/InternshipComplianceView.vue|\
              miniapp/src/components/AppInlineAlert.vue|\
              miniapp/src/components/MobileNavBar.vue|\
              miniapp/src/components/MobileStatusTag.vue|\
              miniapp/src/main.js|\
              miniapp/src/services/request.js|\
              miniapp/src/services/sensitiveDraftStorage.js|\
              miniapp/src/services/studentApi.js|\
              miniapp/src/services/teacherApi.js|\
              miniapp/src/stores/session.js|\
              miniapp/src/styles/tokens.css)
                return 0 ;;
            esac
            return 1
          }

          git diff --name-only --diff-filter=ACMRT "$MAIN_SHA" "$SOURCE_SHA" | while IFS= read -r path; do
            [ -n "$path" ] || continue
            if is_allowed "$path"; then
              if git cat-file -e "$SOURCE_SHA:$path" 2>/dev/null; then
                git checkout "$SOURCE_SHA" -- "$path"
                echo "$path" >> /tmp/imported-files.txt
              fi
            else
              echo "$path" >> /tmp/skipped-files.txt
            fi
          done

          git diff --name-only --diff-filter=D "$MAIN_SHA" "$SOURCE_SHA" | while IFS= read -r path; do
            [ -n "$path" ] || continue
            if is_allowed "$path"; then
              git rm -f --ignore-unmatch -- "$path"
              echo "$path" >> /tmp/imported-files.txt
            fi
          done

          sort -u -o /tmp/imported-files.txt /tmp/imported-files.txt
          sort -u -o /tmp/skipped-files.txt /tmp/skipped-files.txt
          echo "导入文件数：$(wc -l < /tmp/imported-files.txt)"
          echo "排除文件数：$(wc -l < /tmp/skipped-files.txt)"

      - name: 收敛 Alembic 迁移图
        shell: bash
        run: |
          set -euo pipefail
          rm -f backend/alembic/versions/aa_merge_main_20260728_heads.py
          cd backend
          mapfile -t HEADS < <(alembic heads | awk '/\(head\)/ {print $1}')
          if [ "${#HEADS[@]}" -gt 1 ]; then
            alembic merge -r aa_final_20260729 -m "merge academic affairs final with main" heads
          fi
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic heads | tee /tmp/alembic-heads.txt

      - name: 审计最终差异边界
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$MAIN_SHA" | sort -u > /tmp/final-files.txt
          BAD=$(grep -E '(^|/)(graduation|internship|student_affairs|studentAffairs)(/|_)' /tmp/final-files.txt \
            | grep -vE '^backend/app/modules/academic_affairs/|^frontend/src/modules/academicAffairs/|^student-portal/src/views/internship/InternshipComplianceView.vue$' || true)
          if [ -n "$BAD" ]; then
            echo "发现不应进入最终教务分支的跨域文件："
            echo "$BAD"
            exit 1
          fi
          for forbidden in \
            backend/app/core/config.py \
            backend/app/core/context.py \
            backend/app/core/permissions.py \
            backend/app/middleware/context.py \
            backend/app/core/security.py; do
            if grep -Fxq "$forbidden" /tmp/final-files.txt; then
              echo "共享高风险文件不得由教务最终分支覆盖：$forbidden"
              exit 1
            fi
          done
          echo "最终候选变更文件数：$(wc -l < /tmp/final-files.txt)"

      - name: 后端基础验证
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m compileall -q app tests
          test "$(alembic heads | grep -c '(head)')" -eq 1
          python -c "from app.db.session import get_engine; from app.models.base import Base; import app.models; Base.metadata.create_all(bind=get_engine())"
          pytest -q tests/test_aa_*.py tests/test_security_student_identity.py -p no:warnings --durations=20
          echo "backend=success" > /tmp/backend-validation.txt

      - name: 教师和教务 PC build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          echo "teacher-pc=success" > /tmp/teacher-pc-validation.txt

      - name: 学生 PC build
        working-directory: student-portal
        run: |
          npm ci
          npm run build
          echo "student-pc=success" > /tmp/student-pc-validation.txt

      - name: 小程序 H5 与微信 build
        working-directory: miniapp
        run: |
          npm ci
          npm run build:h5
          npm run build:mp-weixin
          echo "miniapp=success" > /tmp/miniapp-validation.txt

      - name: 形成单一交付提交并推送
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -z | xargs -0 -r git add --
          git ls-files --others --exclude-standard -z | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "最终集成没有可提交差异"
            exit 1
          fi
          git commit -m "feat(academic-affairs): integrate four-end academic affairs delivery"
          FINAL_SHA=$(git rev-parse HEAD)
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "final_sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"
          git push --set-upstream origin "$FINAL_BRANCH"
          echo "commit_count=$(git rev-list --count "$MAIN_SHA..$FINAL_SHA")" >> "$GITHUB_OUTPUT"
          echo "changed_files=$(git diff --name-only "$MAIN_SHA" "$FINAL_SHA" | wc -l)" >> "$GITHUB_OUTPUT"

      - name: 创建替代 PR #17 的新 Draft PR
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          CONFLICT_COUNT=$(wc -l < /tmp/squash-conflicts.txt)
          CHANGED_FILES=$(git diff --name-only "$MAIN_SHA" "$FINAL_SHA" | wc -l)
          COMMIT_COUNT=$(git rev-list --count "$MAIN_SHA..$FINAL_SHA")
          {
            echo "## 教务最终集成"
            echo
            echo "本 Draft PR 从最新 main 创建，以单一压缩交付提交导入教务四端最终成果，替代施工记录 PR #17。"
            echo
            echo "- 冻结 main：\`$MAIN_SHA\`"
            echo "- 施工源：\`$SOURCE_SHA\`"
            echo "- 最终分支：\`$FINAL_BRANCH\`"
            echo "- 最终 HEAD：\`$FINAL_SHA\`"
            echo "- 最终变更文件：$CHANGED_FILES"
            echo "- 最终提交数：$COMMIT_COUNT"
            echo "- squash 冲突审计文件：$CONFLICT_COUNT"
            echo
            echo "### 集成原则"
            echo "- 教务独占目录取已通过专项验证的施工成果。"
            echo "- 公共共享目录以最新 main 为基准，仅接入第二阶段确认的教务扩展。"
            echo "- 毕设、岗位实习、学工文件不从施工分支带入。"
            echo "- Alembic 通过新的图合并 revision 收敛为单一 head，不改写 main 已用迁移。"
            echo
            echo "### 基础验证"
            echo "- [x] Python 编译与导入"
            echo "- [x] Alembic 单一 head"
            echo "- [x] MySQL create_all"
            echo "- [x] 教务后端定向测试"
            echo "- [x] 教师/教务 PC build"
            echo "- [x] 学生 PC build"
            echo "- [x] 小程序 H5 build"
            echo "- [x] 微信小程序 build"
            echo
            echo "### 旧 PR 处理"
            echo "PR #17 继续保持 Draft、Open、未合并；本流程不会关闭、合并或标记 Ready。"
            echo
            echo "<details><summary>squash 冲突文件</summary>"
            echo
            sed 's/^/- `/' /tmp/squash-conflicts.txt | sed 's/$/`/'
            echo
            echo "</details>"
          } > /tmp/final-pr-body.md

          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$FINAL_BRANCH" --json number,url --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            PR_NUMBER="$EXISTING"
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "Draft: 教务四端最终集成" --body-file /tmp/final-pr-body.md
          else
            PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$FINAL_BRANCH" \
              --title "Draft: 教务四端最终集成" --body-file /tmp/final-pr-body.md)
            PR_NUMBER=$(basename "$PR_URL")
          fi
          PR_URL=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "$PR_URL"

      - name: 输出执行摘要
        if: always()
        shell: bash
        run: |
          {
            echo "# 教务最终集成执行摘要"
            echo
            echo "- main: ${MAIN_SHA:-未冻结}"
            echo "- source: ${SOURCE_SHA:-未冻结}"
            echo "- final branch: $FINAL_BRANCH"
            echo "- final head: ${FINAL_SHA:-未生成}"
            echo "- Draft PR: ${{ steps.pr.outputs.pr_url || '未创建' }}"
            echo
            echo "## squash 冲突审计"
            if [ -f /tmp/squash-conflicts.txt ]; then
              echo "冲突文件数：$(wc -l < /tmp/squash-conflicts.txt)"
              sed 's/^/- `/' /tmp/squash-conflicts.txt | sed 's/$/`/'
            else
              echo "未执行"
            fi
            echo
            echo "## 最终差异"
            if [ -f /tmp/final-files.txt ]; then
              echo "文件数：$(wc -l < /tmp/final-files.txt)"
            else
              echo "未生成"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
