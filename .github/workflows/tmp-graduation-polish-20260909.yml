name: Temporary graduation frontend polish patch

on:
  push:
    branches:
      - ui/graduation-shared-workspace-polish-20260908
    paths:
      - .github/workflows/tmp-graduation-polish-20260909.yml

permissions:
  contents: write

jobs:
  apply-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/graduation-shared-workspace-polish-20260908
          fetch-depth: 0

      - name: Apply guarded graduation-only patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one guarded anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          admin = 'frontend/src/modules/graduation/views/AdminGraduationLayout.vue'
          replace_once(
              admin,
              ".gd-business-view[data-planning-workspace] :deep(.mp-link) { font-size: 13px; }\n.gd-business-view :deep(.gd-student-page .gd-primary-tabs button),\n.gd-business-view :deep(.gd-student-page .gd-local-views button),\n.gd-business-view :deep(.gd-student-page .af__control) { font-size: 13px; }\n\n@container gd-students (max-width: 1000px) {",
              ".gd-business-view[data-planning-workspace] :deep(.mp-link) { font-size: 13px !important; }\n.gd-business-view :deep(.gd-student-page .gd-primary-tabs button),\n.gd-business-view :deep(.gd-student-page .gd-local-views button),\n.gd-business-view :deep(.gd-student-page .af__control) { font-size: 13px !important; }\n\n/* Proposal workbench: keep the real queue compact without allowing 11px operational copy. */\n.gd-business-view[data-graduation-content-workspace='proposal'] :deep(.pr-hero__copy > p),\n.gd-business-view[data-graduation-content-workspace='proposal'] :deep(.pr-hero__metrics small),\n.gd-business-view[data-graduation-content-workspace='proposal'] :deep(.pr-list__head small) {\n  font-size: 12px !important;\n  line-height: 1.5;\n}\n.gd-business-view[data-graduation-content-workspace='proposal'] :deep(.mp-tab),\n.gd-business-view[data-graduation-content-workspace='proposal'] :deep(.pr-pane__nav .mp-link),\n.gd-business-view[data-graduation-content-workspace='proposal'] :deep(.pr-remind-action button) {\n  min-height: 34px;\n  font-size: 13px !important;\n}\n\n/* At constrained content width, reclaim vertical space from chrome rather than shrinking type. */\n@container gd-planning (max-width: 1080px) {\n  .gd-business-view[data-planning-workspace] :deep(.mps),\n  .gd-business-view[data-planning-workspace] :deep(.mp-stack) { gap: 10px; }\n  .gd-business-view[data-planning-workspace] :deep(.mps__head) { gap: 8px; }\n  .gd-business-view[data-planning-workspace] :deep(.gm-tabs),\n  .gd-business-view[data-planning-workspace] :deep(.gd-primary-tabs),\n  .gd-business-view[data-planning-workspace] :deep(.gd-local-views) { gap: 4px; padding: 4px; }\n  .gd-business-view[data-planning-workspace] :deep(.af) { gap: 8px; padding: 8px 10px; }\n  .gd-business-view[data-planning-workspace] :deep(.af__fields) { gap: 8px; }\n  .gd-business-view[data-planning-workspace] :deep(.af__field) { gap: 3px; }\n}\n\n@container gd-students (max-width: 1000px) {"
          )

          form = 'frontend/src/modules/graduation/views/GraduationDefenseGradeFormView.vue'
          replace_once(
              form,
              "        if (res?.code === 0) {\n          toast.success(`${this.activePreset.title}已提交`)\n          this.$router.push(snapshot.backTo)\n        } else if (res && isGraduationConflictResponse(res)) {",
              "        if (res?.code === 0) {\n          toast.success(`${this.activePreset.title}已提交`)\n          // The server has acknowledged the write. Release the submit lock before\n          // our own completion navigation so beforeRouteLeave only blocks unsafe exits.\n          this.submitting = false\n          await this.$router.push(snapshot.backTo)\n          return\n        } else if (res && isGraduationConflictResponse(res)) {"
          )
          PY

      - name: Run focused static contracts
        shell: bash
        run: |
          git diff --check
          node --test \
            frontend/tests/graduation.final-integration-polish.test.mjs \
            frontend/tests/graduation.defense-grade-form-permission.contract.test.mjs \
            frontend/tests/graduation.v6-deep-link-and-cross-client.contract.test.mjs

      - name: Commit product patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-graduation-polish-20260909.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/modules/graduation/views/AdminGraduationLayout.vue \
                  frontend/src/modules/graduation/views/GraduationDefenseGradeFormView.vue \
                  .github/workflows/tmp-graduation-polish-20260909.yml
          git diff --cached --check
          git commit -m "fix(graduation): close frontend usability blockers"
          git push origin HEAD:ui/graduation-shared-workspace-polish-20260908
