name: Graduation Browser Functional Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/app/modules/graduation/**'
      - 'backend/tests/test_graduation*'
      - 'backend/scripts/e2e_*graduation*'
      - 'frontend/src/modules/graduation/**'
      - 'frontend/tests/graduation*'
      - 'frontend/src/components/business/EmptyState.vue'
      - 'student-portal/src/views/graduation/**'
      - 'miniapp/src/pages/student/graduation/**'
      - 'miniapp/src/pages/teacher/graduation-*/**'
      - 'miniapp/src/services/graduation*'
      - 'e2e/specs/graduation*.spec.mjs'
      - 'e2e/lib/graduation*.mjs'
      - 'e2e/pages/graduation.page.mjs'
      - '.github/actions/browser-runtime/**'
      - 'scripts/e2e/bootstrap-browser-runtime.sh'
      - 'scripts/e2e/run-browser-suite.sh'
      - 'scripts/check/check-graduation-browser-architecture.mjs'
      - '.github/workflows/graduation-browser-gate.yml'

concurrency:
  group: graduation-browser-functional-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  graduation-browser:
    name: real roles / real APIs / 24-page audit
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/14
      REDIS_KEY_PREFIX: graduation-functional-${{ github.run_id }}
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: graduation-functional-only-not-production
      JWT_SECRET_KEY: graduation-functional-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_ENTERPRISE_BASE_URL: http://127.0.0.1:5202/enterprise
      E2E_MINIAPP_BASE_URL: http://127.0.0.1:5188
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.E2E_EXPECTED_SHA }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json
            miniapp/package-lock.json
            e2e/package-lock.json

      - name: Verify graduation browser gate architecture
        run: node scripts/check/check-graduation-browser-architecture.mjs

      - name: Bootstrap unified graduation browser runtime
        uses: ./.github/actions/browser-runtime
        with:
          profile: graduation
          head_sha: ${{ env.E2E_EXPECTED_SHA }}
          verify_gold_manifest: 'true'

      - name: Run graduation functional, cross-client and 24-page suites
        run: bash scripts/e2e/run-browser-suite.sh graduation-functional

      - name: Publish graduation browser summary
        if: always()
        run: |
          echo '## Graduation browser functional gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- One exact-head runtime: MySQL + Redis + backend + staff PC + student PC + teacher miniapp H5' >> "$GITHUB_STEP_SUMMARY"
          echo '- Includes functional flows, cross-client FileVersion verification, deep links, roles, accessibility, and 24-page audit' >> "$GITHUB_STEP_SUMMARY"
          echo '- Excludes Gold promotion; visual candidates are a separate manual gate' >> "$GITHUB_STEP_SUMMARY"
          test ! -f e2e/gate-results/graduation-functional.json || cat e2e/gate-results/graduation-functional.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine-readable failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graduation-browser-diagnostics-${{ github.run_id }}
          path: |
            e2e/gate-results/graduation-functional.json
            e2e/gate-results/graduation-functional-failures.json
            e2e/gate-results/graduation-functional-selected-specs.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload graduation browser report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graduation-browser-report-${{ github.run_id }}
          path: e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload graduation browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graduation-browser-evidence-${{ github.run_id }}
          path: |
            e2e/test-results/
            e2e/gate-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload graduation runtime logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graduation-browser-logs-${{ github.run_id }}
          path: e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14