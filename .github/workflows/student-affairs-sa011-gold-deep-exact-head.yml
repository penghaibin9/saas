name: Student Affairs SA-011 Gold Deep exact head

on:
  workflow_dispatch:
  push:
    branches:
      - audit/student-affairs-sa011-browser-runner-20260826
    paths:
      - 'audit-tests/student-affairs-sa011-browser-v3.spec.mjs'
      - 'audit-tests/student-affairs-sa011-verify-v3.py'
      - '.github/workflows/student-affairs-sa011-gold-deep-exact-head.yml'

permissions:
  contents: read

concurrency:
  group: student-affairs-sa011-gold-deep
  cancel-in-progress: true

jobs:
  sa011-gold-deep:
    name: SA-011 risk four-end Browser First / scope + privacy / MySQL seal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/13
      REDIS_KEY_PREFIX: student-affairs-sa011-gold-deep
      JWT_SECRET: student-affairs-sa011-gold-deep-only
      JWT_SECRET_KEY: student-affairs-sa011-gold-deep-only
      PYTHONPATH: .
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_MINIAPP_BASE_URL: http://127.0.0.1:5188
      E2E_TARGET_SHA: a288b0dcfdd5b1a2b8fcee12d7d83b7b9ad9bfb4

    steps:
      - name: Checkout immutable SA-011 runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: runner
          fetch-depth: 1

      - name: Checkout immutable application exact head
        uses: actions/checkout@v4
        with:
          ref: a288b0dcfdd5b1a2b8fcee12d7d83b7b9ad9bfb4
          path: app
          fetch-depth: 0

      - name: Assert exact Product and clean source
        run: |
          set -euo pipefail
          echo "tested_app_head=$(git -C app rev-parse HEAD)"
          echo "audit_runner_head=$(git -C runner rev-parse HEAD)"
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"
          test -z "$(git -C app status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/student-portal/package-lock.json
            app/miniapp/package-lock.json
            app/e2e/package-lock.json

      - name: Install backend, migrate isolated MySQL and publish IAM authority
        working-directory: app/backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          alembic upgrade head
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend
        run: |
          set -euo pipefail
          mkdir -p app/e2e/runtime-logs
          cd app/backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend-sa011.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend-sa011.log
          exit 1

      - name: Bootstrap canonical SA-011 identities and formal A/B counselor scope
        working-directory: app/backend
        run: |
          set -euo pipefail
          python - <<'PY'
          import runpy
          ns = runpy.run_path('../../runner/audit-tests/student-affairs-sa005-bootstrap-v3.py')
          result = ns['_bootstrap_identities']()
          print('[SA011_BOOTSTRAP]', result.get('org') or result)
          PY

      - name: Start real Staff PC, Student PC and Miniapp H5
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd app/frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend-sa011.log 2>&1 &
          cd ../student-portal
          npm ci
          VITE_BASE=/portal/ VITE_API_BASE_URL=/ VITE_PROXY_TARGET=http://127.0.0.1:8000 nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-portal-sa011.log 2>&1 &
          cd ../miniapp
          npm ci
          nohup npm run dev:h5 -- --host 127.0.0.1 --port 5188 > ../e2e/runtime-logs/miniapp-sa011.log 2>&1 &

      - name: Wait for real browser applications
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login http://127.0.0.1:5188/; do
            ready=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ -z "$ready" ]; then
              echo "Application not ready: $url"
              cat app/e2e/runtime-logs/*.log || true
              exit 1
            fi
          done

      - name: Install Chromium and inject immutable SA-011 spec
        run: |
          set -euo pipefail
          cp runner/audit-tests/student-affairs-sa011-browser-v3.spec.mjs app/e2e/specs/student-affairs-sa011-browser-v3.spec.mjs
          cd app/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Run SA-011 four-end real Browser First journey
        id: browser
        continue-on-error: true
        working-directory: app/e2e
        run: npx playwright test specs/student-affairs-sa011-browser-v3.spec.mjs

      - name: Seal SA-011 final truth in real MySQL
        id: mysql
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        working-directory: app/backend
        run: python ../../runner/audit-tests/student-affairs-sa011-verify-v3.py

      - name: Reassert immutable Product exact head
        if: always()
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"
          test -z "$(git -C app status --porcelain --untracked-files=no)"
          echo "tested_app_head=$(git -C app rev-parse HEAD)"
          echo "tested_runner_head=$(git -C runner rev-parse HEAD)"

      - name: Show outcomes and fail on genuine blocker
        if: always()
        run: |
          echo "sa011_browser=${{ steps.browser.outcome }}"
          echo "sa011_mysql=${{ steps.mysql.outcome }}"
          test "${{ steps.browser.outcome }}" = "success"
          test "${{ steps.mysql.outcome }}" = "success"

      - name: Upload SA-011 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-affairs-sa011-gold-deep-${{ github.run_id }}
          path: |
            app/e2e/student-affairs-sa011-evidence.json
            app/e2e/playwright-report/
            app/e2e/test-results/
            app/e2e/runtime-logs/
          if-no-files-found: ignore
          retention-days: 7
