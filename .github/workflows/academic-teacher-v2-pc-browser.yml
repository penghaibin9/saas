name: Academic Teacher V2 PC Browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/modules/academic_affairs/routers/academic_affairs.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_teacher_today_work_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_teacher_today_grade_todo_guard.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_schedule_change_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_schedule_change_r3_service.py'
      - 'backend/app/modules/academic_affairs/services/mobile_academic_affairs_public_service.py'
      - 'frontend/src/modules/academicAffairs/**'
      - 'frontend/tests/academic-teacher-flow-closure-v2.test.mjs'
      - 'backend/tests/test_aa_academic_teacher_flow_closure_v2.py'
      - 'e2e/specs/academic-teacher-v2-pc.spec.mjs'
      - '.github/workflows/academic-teacher-v2-pc-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-teacher-v2-pc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  teacher-pc:
    name: real teacher PC / real API / isolated MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/14
      REDIS_KEY_PREFIX: academic-teacher-v2-pc
      JWT_SECRET: academic-teacher-v2-pc-browser-only-not-production
      JWT_SECRET_KEY: academic-teacher-v2-pc-browser-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrate isolated database
        working-directory: backend
        run: alembic upgrade head

      - name: Seed School IAM authority and isolated tenants
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Run V2 source contracts
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          node --test tests/academic-teacher-flow-closure-v2.test.mjs
          npm run build
          cd ../backend
          pytest -q tests/test_aa_academic_teacher_flow_closure_v2.py tests/test_aa_academic_teacher_projection_security.py -p no:warnings

      - name: Start backend
        run: |
          mkdir -p e2e/runtime-logs
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend-academic-teacher-v2.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/backend-academic-teacher-v2.log
          exit 1

      - name: Bootstrap canonical teacher and student identities
        working-directory: backend
        run: |
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py

      - name: Start staff PC
        run: |
          cd frontend
          nohup env VITE_USE_MOCK=false VITE_API_BASE_URL=http://127.0.0.1:8000 npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend-academic-teacher-v2.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5173/login >/dev/null && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/frontend-academic-teacher-v2.log
          exit 1

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run real teacher PC flow
        working-directory: e2e
        run: npx playwright test specs/academic-teacher-v2-pc.spec.mjs --workers=1 --retries=0

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-teacher-v2-pc-${{ github.run_id }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
