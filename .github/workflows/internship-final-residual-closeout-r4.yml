name: internship-final-residual-closeout-r4

on:
  push:
    branches:
      - fix/internship-prelaunch-p1p2-20260828

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore(internship): run residual closeout r4' }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/internship-prelaunch-p1p2-20260828
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Apply residual fixture corrections
        run: python ../.github/scripts/internship_residual_closeout.py
      - name: Syntax tenant ratchet and diff integrity
        run: |
          python -m py_compile tests/test_internship_score_archive_guard.py tests/test_internship_archive.py tests/test_internship_v93_batch2_remaining_first_create.py tests/test_internship_v93_special_filing_review_flow.py tests/test_portal_internship.py tests/test_internship_scope.py tests/test_internship_enterprise_eval.py
          python scripts/audit_tenant_queries.py --gate
          git diff --check
      - name: Residual real MySQL regression
        run: |
          timeout 25m pytest -q -p no:warnings tests/test_internship_score_archive_guard.py tests/test_internship_archive.py tests/test_internship_v93_batch2_remaining_first_create.py tests/test_internship_v93_special_filing_review_flow.py tests/test_portal_internship.py tests/test_internship_scope.py tests/test_internship_enterprise_eval.py
      - name: Commit validated residual repairs and remove scaffolding
        working-directory: .
        run: |
          rm -f .github/internship-residual-closeout-r4.trigger
          rm -f .github/workflows/internship-final-residual-closeout-r3.yml
          rm -f .github/workflows/internship-final-residual-closeout-r4.yml
          rm -f .github/scripts/internship_residual_closeout.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- .github
          git add -- backend/tests/test_internship_score_archive_guard.py backend/tests/test_internship_archive.py backend/tests/test_internship_v93_batch2_remaining_first_create.py backend/tests/test_internship_v93_special_filing_review_flow.py backend/tests/test_portal_internship.py backend/tests/test_internship_scope.py backend/tests/test_internship_enterprise_eval.py
          git diff --cached --check
          git commit -m 'fix(internship): align remaining production fixtures'
          git push origin HEAD:fix/internship-prelaunch-p1p2-20260828
