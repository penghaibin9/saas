name: internship-final-residual-closeout-r4

on:
  push:
    branches:
      - tmp/pr231-residual-closeout-20260828

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore(internship): run residual closeout r4' }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/pr231-residual-closeout-20260828
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Apply isolated diagnostic transforms
        run: |
          python ../.github/scripts/internship_residual_closeout.py
          python ../.github/scripts/internship_residual_patch2.py
          python ../.github/scripts/internship_special_filing_diag.py
      - name: Run one special-filing diagnostic on real MySQL
        run: |
          pytest -s -q -p no:warnings tests/test_internship_v93_special_filing_review_flow.py::test_full_review_flow_reaches_approved
