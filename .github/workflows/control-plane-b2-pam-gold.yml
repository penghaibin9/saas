name: Control Plane B2 PAM Gold

on:
  workflow_dispatch:
  push:
    branches: [integration/control-plane-option-b-20260815]
    paths:
      - 'backend/app/core/platform_assurance.py'
      - 'backend/app/modules/platform/services/platform_access_governance_*.py'
      - 'backend/app/modules/platform/routers/platform_router.py'
      - 'backend/app/models/customer_success.py'
      - 'backend/app/services/customer_health_service.py'
      - 'backend/tests/test_platform_control_plane_access.py'
      - 'backend/tests/test_control_plane_platform_pam_gold.py'
      - 'frontend/src/modules/platform/views/control/PlatformAccessView.vue'
      - '.github/workflows/control-plane-b2-pam-gold.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/core/platform_assurance.py'
      - 'backend/app/modules/platform/services/platform_access_governance_*.py'
      - 'backend/app/modules/platform/routers/platform_router.py'
      - 'backend/app/models/customer_success.py'
      - 'backend/app/services/customer_health_service.py'
      - 'backend/tests/test_platform_control_plane_access.py'
      - 'backend/tests/test_control_plane_platform_pam_gold.py'
      - 'frontend/src/modules/platform/views/control/PlatformAccessView.vue'
      - '.github/workflows/control-plane-b2-pam-gold.yml'

permissions:
  contents: read

concurrency:
  group: control-plane-b2-pam-gold-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  DB_ENABLED: 'true'
  DB_DRIVER: mysql
  MOCK_LOGIN_ENABLED: 'true'
  SECRET_KEY: control-plane-b2-pam-gold-secret
  JWT_SECRET: control-plane-b2-pam-gold-secret
  DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/control_plane_b2_pam?charset=utf8mb4
  TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/control_plane_b2_pam?charset=utf8mb4

jobs:
  pam-gold:
    name: Exact-head MySQL PAM runtime Gold
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: control_plane_b2_pam
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact branch HEAD assertion
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Source authority contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          runtime = Path('backend/app/modules/platform/services/platform_access_governance_runtime.py').read_text(encoding='utf-8')
          router = Path('backend/app/modules/platform/routers/platform_router.py').read_text(encoding='utf-8')
          view = Path('frontend/src/modules/platform/views/control/PlatformAccessView.vue').read_text(encoding='utf-8')
          required_runtime = [
              'require_mfa=True', '_validate_support_ticket', 'SupportTicket',
              'SUPPORT_TICKET_ASSIGNEE_MISMATCH', 'support_session_allows',
              'ticketVersionAtGrant', 'IDEMPOTENCY_CONFLICT',
          ]
          for token in required_runtime:
              assert token in runtime, token
          assert '绑定真实 SupportTicket' in router
          assert 'requestId: requestId()' in view
          assert 'SupportTicket 数字 ID' in view
          assert 'tenant.context.read' in view
          assert 'tenant.health' not in view
          print('B2 PAM source authority contract OK')
          PY
      - name: Install backend and migrate fresh MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
          alembic current
      - name: Run PAM production regressions
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_control_plane_platform_pam_gold.py \
            tests/test_platform_control_plane_access.py \
            --disable-warnings
      - name: Write exact-head evidence
        if: always()
        run: |
          mkdir -p artifacts/control-plane
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('artifacts/control-plane/b2-pam-gold.json').write_text(json.dumps({
              'head': os.environ.get('GITHUB_SHA'),
              'authority': 'SUPPORT_TICKET_LIVE_RUNTIME',
              'elevationMfa': True,
              'supportTicketLiveRecheck': True,
              'accessReviewRevoke': 'CANONICAL_ATOMIC_PATH',
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Upload PAM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-b2-pam-gold-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/control-plane/b2-pam-gold.json
          if-no-files-found: warn
          retention-days: 14
