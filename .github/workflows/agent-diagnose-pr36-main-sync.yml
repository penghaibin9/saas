name: Agent Diagnose PR36 Main Sync

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.head_ref == 'fix/graduation-material-closeout-p0-review' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graduation-material-closeout-p0-review
          fetch-depth: 0

      - name: Diagnose merge conflicts
        run: |
          set +e
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff origin/main > /tmp/merge.log 2>&1
          status=$?
          cat /tmp/merge.log
          if [ "$status" -eq 0 ]; then
            echo 'NO_CONFLICTS'
            git merge --abort || true
            exit 0
          fi
          echo '=== CONFLICT FILES ==='
          git diff --name-only --diff-filter=U | tee /tmp/conflicts.txt
          echo '=== COMBINED DIFF ==='
          git diff --cc | tee /tmp/conflict.diff
          git merge --abort || true
          exit 1

      - name: Upload conflict evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr36-main-sync-conflicts
          path: |
            /tmp/merge.log
            /tmp/conflicts.txt
            /tmp/conflict.diff
          if-no-files-found: warn
          retention-days: 2

      # Trigger after the workflow already exists on the PR branch.
