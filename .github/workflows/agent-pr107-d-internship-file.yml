name: Agent PR107 D stable internship advisor ACL

on:
  push:
    branches:
      - fix/system-audit-rbac-atomicity-20260813
    paths:
      - .github/workflows/agent-pr107-d-internship-file.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_d
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_d
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply D patch and compile
        run: |
          python -m py_compile .github/agent/patch_pr107_d.py
          python .github/agent/patch_pr107_d.py
          python -m py_compile \
            backend/app/modules/internship/services/internship_identity.py \
            backend/app/modules/internship/services/internship_advisor_identity_guard.py \
            backend/app/services/file_access_resolvers.py \
            backend/tests/test_internship_file_stable_advisor_acl.py
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Run stable-advisor and student-file MySQL contracts
        working-directory: backend
        run: |
          pytest -q -p no:warnings \
            tests/test_internship_file_stable_advisor_acl.py \
            tests/test_file_student_internship_acl.py \
            --timeout=180 --timeout-method=signal
      - name: Commit D source and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/agent/patch_pr107_d.py .github/workflows/agent-pr107-d-internship-file.yml
          git config user.name "penghaibin9"
          git config user.email "penghaibin9@gmail.com"
          git add \
            backend/app/modules/internship/services/internship_identity.py \
            backend/app/modules/internship/services/internship_advisor_identity_guard.py \
            backend/app/services/file_access_resolvers.py \
            backend/tests/test_internship_file_stable_advisor_acl.py \
            .github/agent/patch_pr107_d.py \
            .github/workflows/agent-pr107-d-internship-file.yml
          git diff --cached --check
          git commit -m "fix(files): enforce stable internship advisor identity"
          git push origin HEAD:fix/system-audit-rbac-atomicity-20260813
