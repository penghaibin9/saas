name: Academic D source materialize

on:
  push:
    branches:
      - agent/academic-d-graduation-delivery
    paths:
      - '.academic-d-source/**'
      - '.github/workflows/academic-d-source-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout D branch
        uses: actions/checkout@v4
        with:
          ref: agent/academic-d-graduation-delivery
          fetch-depth: 0
      - name: Rebuild exact construction source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .academic-d-source ]]; then
            echo 'Source already materialized; nothing to do.'
            exit 0
          fi
          cat .academic-d-source/part-* > /tmp/academic-d-source.xz.b64
          base64 -d /tmp/academic-d-source.xz.b64 > /tmp/academic-d-source.xz
          xz -dc /tmp/academic-d-source.xz > 'D_教务Graduation_Delivery_当前代码精确施工总册_V2.1_20260816.md'
          echo 'ec4e6f105c2df399e336a943c955e53a1a839599915c95f09de6db56fdda6d2a  D_教务Graduation_Delivery_当前代码精确施工总册_V2.1_20260816.md' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'D_教务Graduation_Delivery_当前代码精确施工总册_V2.1_20260816.md'
          git rm -r .academic-d-source
          git commit -m 'docs(academic-d): add exact V2.1 construction source'
          git push origin HEAD:agent/academic-d-graduation-delivery
