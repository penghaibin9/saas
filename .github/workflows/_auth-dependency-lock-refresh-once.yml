name: Auth dependency lock refresh once

on:
  push:
    branches:
      - feat/adaptive-login-captcha-20260805
    paths:
      - "frontend/package.json"
      - ".github/workflows/_auth-dependency-lock-refresh-once.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-login-captcha-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate deterministic lockfile
        run: |
          cd frontend
          npm install --package-lock-only --ignore-scripts
      - name: Validate install and patched production tree
        run: |
          cd frontend
          npm ci
          npm audit --omit=dev --audit-level=high
          node - <<'NODE'
          const COS = require('cos-js-sdk-v5')
          const { XMLParser } = require('fast-xml-parser')
          const client = new COS({})
          if (typeof client.getObject !== 'function') throw new Error('COS SDK failed to load')
          const value = new XMLParser().parse('<ListBucketResult><Name>lock-smoke</Name></ListBucketResult>')
          if (value?.ListBucketResult?.Name !== 'lock-smoke') throw new Error('fast-xml-parser compatibility smoke failed')
          NODE
          npm run lint
          npm test
          npm run build
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --quiet && { echo "package-lock.json did not change"; exit 1; }
          git commit -m "fix(frontend): refresh patched production dependency lock"
          git push origin HEAD:feat/adaptive-login-captcha-20260805
      - name: Upload regenerated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-patched-package-lock-${{ github.run_id }}
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 2
