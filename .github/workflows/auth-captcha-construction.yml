name: Auth captcha construction

on:
  push:
    branches:
      - feat/adaptive-login-captcha-20260805
    paths:
      - scripts/automation/build_auth_captcha_pr.py
      - .github/workflows/auth-captcha-construction.yml

permissions:
  contents: write

concurrency:
  group: auth-captcha-construction
  cancel-in-progress: false

jobs:
  construct-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-login-captcha-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply audited construction
        run: python scripts/automation/build_auth_captcha_pr.py
      - name: Python syntax check
        run: python -m compileall -q backend/app backend/tests/test_auth_challenge_service.py
      - name: Backend captcha tests
        working-directory: backend
        env:
          APP_ENV: test
          DEPLOYMENT_MODE: local
          DB_ENABLED: 'false'
          REDIS_URL: ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests/test_auth_challenge_service.py -q -p no:warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PC management build
        working-directory: frontend
        run: npm ci && npm run lint && npm test && npm run build
      - name: Student portal build
        working-directory: student-portal
        run: npm ci && npm run lint && npm test && npm run build
      - name: Miniapp builds
        working-directory: miniapp
        run: npm ci && npm run build:h5 && npm run build:mp-weixin
      - name: Commit final implementation
        run: |
          rm -f scripts/automation/build_auth_captcha_pr.py .github/workflows/auth-captcha-construction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/auth_challenge_service.py \
                  backend/app/core/token_store.py backend/app/core/config.py \
                  backend/app/services/auth_service_db.py backend/app/services/wx_auth_service.py \
                  backend/app/api/v1/auth.py backend/app/student_portal/services/guardian_service.py \
                  backend/tests/test_auth_challenge_service.py \
                  frontend/src/components/auth/LoginCaptcha.vue frontend/src/services/http/client.js \
                  frontend/src/views/LoginView.vue frontend/src/views/PlatformLoginView.vue \
                  student-portal/src/components/auth/LoginCaptcha.vue student-portal/src/services/request.js \
                  student-portal/src/services/portalApi.js student-portal/src/stores/session.js \
                  student-portal/src/views/login/LoginView.vue miniapp/src/services/request.js \
                  miniapp/src/components/login/MiniLoginAuthPanel.vue \
                  scripts/automation/build_auth_captcha_pr.py .github/workflows/auth-captcha-construction.yml
          git diff --cached --check
          git commit -m 'feat(auth): add adaptive graphical login captcha'
          git push origin HEAD:feat/adaptive-login-captcha-20260805
