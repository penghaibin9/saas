name: PR107 browser contract fix

on:
  push:
    branches:
      - fix/system-audit-rbac-atomicity-20260813
    paths:
      - .github/workflows/pr107-browser-contract-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/system-audit-rbac-atomicity-20260813
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch stale browser session tests only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/tests/test_browser_auth_session_scope.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              (
                  '    result = auth_browser._sessionize_payload(payload)\n',
                  '    result = auth_browser._sessionize_payload(\n        payload, browser_channel="staff", browser_session_id="tab-a"\n    )\n'
              ),
              (
                  '    assert auth_browser._sessionize_payload(payload) is payload\n',
                  '    assert auth_browser._sessionize_payload(\n        payload, browser_channel="staff", browser_session_id="tab-fixture"\n    ) is payload\n'
              ),
              (
                  '        "consume_refresh",\n        lambda token: {"userId": "db-7", "tenantId": "1001", "clientType": "PC"},\n',
                  '        "consume_refresh_if_matches",\n        lambda token, **kwargs: {"userId": "db-7", "tenantId": "1001", "clientType": "PC"},\n'
              ),
              (
                  '    result = auth_browser._rotate_browser_refresh("legacy-cookie")\n',
                  '    result = auth_browser._rotate_browser_refresh(\n        "legacy-cookie", channel="staff", browser_session_id="tab-a"\n    )\n'
              ),
              (
                  '        "consume_refresh",\n        lambda token: {"userId": "db-7", "authSessionId": "dead-session"},\n',
                  '        "consume_refresh_if_matches",\n        lambda token, **kwargs: {"userId": "db-7", "authSessionId": "dead-session"},\n'
              ),
              (
                  '        auth_browser._rotate_browser_refresh("raced-refresh")\n',
                  '        auth_browser._rotate_browser_refresh(\n            "raced-refresh", channel="staff", browser_session_id="tab-dead"\n        )\n'
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one stale contract occurrence: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install backend and run the exact failed contracts
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests/test_browser_auth_session_scope.py tests/test_p1_new_reliability.py -q -p no:warnings
      - name: Commit verified test contract fix and remove temporary workflow
        run: |
          rm .github/workflows/pr107-browser-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_browser_auth_session_scope.py
          git add -u .github/workflows/pr107-browser-contract-fix.yml
          git commit -m "test(auth): align browser scope contracts with per-tab binding"
          git push origin HEAD:fix/system-audit-rbac-atomicity-20260813
