name: Audit Academic AA-004 Major Split 20260827

on:
  push:
    branches:
      - audit/academic-sequential-20260827
    paths:
      - '.github/workflows/audit-academic-aa004-major-split-20260827.yml'
      - 'e2e/specs/academic-aa004-major-split-close-allocate-resume.spec.mjs'
      - 'backend/scripts/e2e_prepare_academic_aa004_major_split.py'

permissions:
  contents: read

concurrency:
  group: audit-academic-aa004-${{ github.ref }}
  cancel-in-progress: true

jobs:
  major-split-failed-step-resume:
    name: failed step only / Staff PC close-confirm -> auto-allocate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: academic_aa004_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TARGET_SHA: 7a761d2dd9f38fc9bad0685e95e37924eacd55fc
      RUNNER_SHA: ${{ github.sha }}
      SCHOOL_IAM_AUTHORITY_EXPECTED_SHA: 7a761d2dd9f38fc9bad0685e95e37924eacd55fc
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_aa004_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_aa004_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: academic_aa004_e2e
      REDIS_URL: redis://127.0.0.1:6379/11
      REDIS_KEY_PREFIX: academic-aa004-resume
      JWT_SECRET: academic-aa004-browser-only-not-production
      JWT_SECRET_KEY: academic-aa004-browser-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_EXPECTED_SHA: 7a761d2dd9f38fc9bad0685e95e37924eacd55fc

    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with: { ref: '${{ env.TARGET_SHA }}', fetch-depth: 0 }

      - name: Assert clean product head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          echo "AA-004 focused product SHA: $TARGET_SHA"

      - name: Checkout audit-only harness
        uses: actions/checkout@v4
        with: { ref: '${{ env.RUNNER_SHA }}', path: audit-harness, fetch-depth: 1 }

      - name: Overlay only failed-step harness
        run: |
          set -euo pipefail
          test "$(git -C audit-harness rev-parse HEAD)" = "$RUNNER_SHA"
          cp audit-harness/e2e/specs/academic-aa004-major-split-close-allocate-resume.spec.mjs e2e/specs/academic-aa004-major-split-close-allocate-resume.spec.mjs
          cp audit-harness/backend/scripts/e2e_prepare_academic_aa004_major_split.py backend/scripts/e2e_prepare_academic_aa004_major_split.py
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Focused source preflight only
        run: |
          set -euo pipefail
          python -m py_compile backend/scripts/e2e_prepare_academic_aa004_major_split.py
          node --check e2e/specs/academic-aa004-major-split-close-allocate-resume.spec.mjs
          grep -q 'this.confirmVisible = false' frontend/src/modules/academicAffairs/views/AaMajorSplitView.vue
          grep -q '专业分流 · 教务处控制台' frontend/src/modules/academicAffairs/views/AaMajorSplitView.vue

      - name: Install backend and migrate isolated MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head

      - name: Replay production School IAM Authority
        working-directory: backend
        run: PYTHONPATH=. python scripts/bootstrap_control_plane_school_iam_authority.py

      - name: Seed isolated tenant
        working-directory: backend
        run: python scripts/e2e_seed_playwright_tenants.py

      - name: Seed real School IAM runtime fixture
        working-directory: backend
        run: PYTHONPATH=. python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend with mock login disabled
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend-aa004-resume.log 2>&1 &
          for i in {1..60}; do if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi; sleep 2; done
          cat ../e2e/runtime-logs/backend-aa004-resume.log
          exit 1

      - name: Bootstrap canonical Staff PC account
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py

      - name: Prepare only AA-004 identity baseline
        working-directory: backend
        run: python scripts/e2e_prepare_academic_aa004_major_split.py

      - name: Start Staff PC only
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: ''
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend-aa004-resume.log 2>&1 &

      - name: Wait for Staff PC only
        run: |
          set -euo pipefail
          ready=''
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/login >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then cat e2e/runtime-logs/*.log; exit 1; fi

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run only failed Staff PC step and immediate downstream
        working-directory: e2e
        run: npx playwright test specs/academic-aa004-major-split-close-allocate-resume.spec.mjs --workers=1 --retries=0 --reporter=line

      - name: Upload focused AA-004 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-aa004-close-allocate-resume-${{ env.TARGET_SHA }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/academic-aa004-close-allocate-resume-outcome.json
            backend/tmp/e2e_academic_aa004_state.local.json
            e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
