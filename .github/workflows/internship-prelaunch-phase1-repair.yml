name: internship-prelaunch-final-repair

on:
  push:
    branches:
      - fix/internship-prelaunch-p1p2-20260828

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore(internship): run score appeal final repair' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/internship-prelaunch-p1p2-20260828
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply final score appeal codemod
        run: python .github/scripts/fix_internship_score_appeal_final.py

      - name: Python syntax gate
        run: |
          python -m py_compile \
            backend/app/modules/internship/services/internship_score_appeal_service.py \
            backend/app/modules/internship/routers/internship_score_appeal.py \
            backend/app/student_portal/services/internship_service.py \
            backend/app/student_portal/router.py \
            backend/app/api/v1/campus_service.py \
            backend/app/api/v1/route_registration.py \
            backend/app/modules/internship/services/internship_score_service.py

      - name: JavaScript syntax gate
        run: |
          node --check frontend/src/modules/internship/api/score.api.js
          node --check student-portal/src/services/portalApi.js

      - name: Final static regression contracts
        run: |
          cd backend
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('tests/test_internship_prelaunch_static_contracts.py')
          spec = importlib.util.spec_from_file_location('prelaunch_contracts', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tests = [name for name in dir(module) if name.startswith('test_')]
          for name in tests:
              getattr(module, name)()
              print(f'PASS {name}')
          print(f'{len(tests)} static contracts passed')
          PY

      - name: Targeted source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          appeal = Path('backend/app/modules/internship/services/internship_score_appeal_service.py').read_text(encoding='utf-8')
          score_view = Path('frontend/src/modules/internship/views/ScoreView.vue').read_text(encoding='utf-8')
          student_view = Path('student-portal/src/views/internship/InternshipView.vue').read_text(encoding='utf-8')
          assert '成绩申诉必须携带当前实习批次或实习记录上下文' in appeal
          assert 'values={"status": "WITHDRAWN"}' in appeal
          assert "const RECALC_STATUSES = ['PENDING_REVIEW', 'PENDING_CALC', 'WITHDRAWN']" in score_view
          assert 'body.expectedVersion = current.version' in score_view
          assert 'scoreApi.getAppeals' in score_view
          assert '...currentInternshipContext(), reason: appealReason.value' in student_view
          print('targeted source invariants passed')
          PY

      - name: Diff hygiene gate
        run: git diff --check

      - name: Show patch summary
        run: git diff --stat

      - name: Remove one-shot codemod
        run: rm .github/scripts/fix_internship_score_appeal_final.py

      - name: Commit validated final repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/scripts/fix_internship_score_appeal_final.py \
            backend/app/modules/internship/services/internship_score_appeal_service.py \
            backend/app/student_portal/services/internship_service.py \
            backend/app/student_portal/router.py \
            student-portal/src/services/portalApi.js \
            student-portal/src/views/internship/InternshipView.vue \
            frontend/src/modules/internship/api/score.api.js \
            frontend/src/modules/internship/views/ScoreView.vue \
            backend/tests/test_internship_prelaunch_static_contracts.py
          git diff --cached --check
          git commit -m 'fix(internship): close score appeal domain loop'
          git push origin HEAD:fix/internship-prelaunch-p1p2-20260828
