name: Student Affairs SA-004 Focused V3 exact head

on:
  workflow_dispatch:
  push:
    branches:
      - audit/student-affairs-browser-runner-20260823
    paths:
      - 'audit-tests/student-affairs-sa004-bootstrap-v3.py'
      - 'audit-tests/student-affairs-sa004-verify-v3.py'
      - 'audit-tests/student-affairs-scholarship-config-browser-v3.spec.mjs'
      - 'audit-tests/student-affairs-scholarship-browser-audit.spec.mjs'
      - '.github/workflows/student-affairs-sa004-focused-v3-exact-head.yml'

permissions:
  contents: read

concurrency:
  group: student-affairs-sa004-focused-v3
  cancel-in-progress: true

jobs:
  sa004-focused-browser:
    name: SA-004 focused / config + journey / Chromium / MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/15
      REDIS_KEY_PREFIX: student-affairs-sa004-focused-v3
      JWT_SECRET: student-affairs-sa004-focused-v3-only
      JWT_SECRET_KEY: student-affairs-sa004-focused-v3-only
      PYTHONPATH: .
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_TARGET_SHA: 6a734c42f3df08d348a01bb36d930ab6620f9a0f

    steps:
      - name: Checkout immutable audit runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: runner
          fetch-depth: 1

      - name: Checkout immutable application exact head
        uses: actions/checkout@v4
        with:
          ref: 6a734c42f3df08d348a01bb36d930ab6620f9a0f
          path: app
          fetch-depth: 0

      - name: Assert exact heads and clean product source
        run: |
          set -euo pipefail
          echo "tested_app_head=$(git -C app rev-parse HEAD)"
          echo "audit_runner_head=$(git -C runner rev-parse HEAD)"
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"
          test -z "$(git -C app status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/student-portal/package-lock.json
            app/e2e/package-lock.json

      - name: Install backend, migrate MySQL and publish current IAM authority
        working-directory: app/backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          alembic upgrade head
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Run changed SA-004 contracts only
        working-directory: app/backend
        run: |
          set -euo pipefail
          pytest -q -p no:warnings \
            tests/test_affairs_permission_codes.py::test_counselor_self_service_eval_only \
            tests/test_affairs_phase2_role_matrix.py \
            tests/test_affairs_funding_appeal_list_version.py
          python - <<'PY'
          from app.services.system_role_shadow_service import expected_system_role_permissions
          codes = set(expected_system_role_permissions('COUNSELOR'))
          assert 'studentAffairs.funding.approve' in codes, sorted(codes)
          assert 'studentAffairs.funding.project.manage' not in codes, sorted(codes)
          assert 'studentAffairs.funding.publicity.manage' not in codes, sorted(codes)
          print('[PERMISSION] COUNSELOR funding first-review grant is narrow')
          PY

      - name: Start real backend
        run: |
          set -euo pipefail
          mkdir -p app/e2e/runtime-logs
          cd app/backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Bootstrap canonical SA-004 identities and counselor relations
        working-directory: app/backend
        run: python ../../runner/audit-tests/student-affairs-sa004-bootstrap-v3.py

      - name: Start official external scheduler
        run: |
          cd app/backend
          nohup python scripts/run_scheduled_jobs.py > ../e2e/runtime-logs/scheduler.log 2>&1 &
          sleep 2

      - name: Start real Staff PC and Student PC
        run: |
          set -euo pipefail
          cd app/frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          cd ../student-portal
          npm ci
          VITE_BASE=/portal/ VITE_API_BASE_URL=/ VITE_PROXY_TARGET=http://127.0.0.1:8000 nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-portal.log 2>&1 &

      - name: Wait for browser applications
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login; do
            ready=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ -z "$ready" ]; then
              echo "Application not ready: $url"
              cat app/e2e/runtime-logs/*.log || true
              exit 1
            fi
          done

      - name: Install Chromium once and inject both SA-004 specs
        run: |
          set -euo pipefail
          cp runner/audit-tests/student-affairs-scholarship-config-browser-v3.spec.mjs app/e2e/specs/student-affairs-scholarship-config-browser-v3.spec.mjs
          cp runner/audit-tests/student-affairs-scholarship-browser-audit.spec.mjs app/e2e/specs/student-affairs-scholarship-browser-audit.spec.mjs
          cd app/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Run real Staff PC project and batch configuration
        id: config_browser
        continue-on-error: true
        working-directory: app/e2e
        run: npx playwright test specs/student-affairs-scholarship-config-browser-v3.spec.mjs

      - name: Verify configuration truth in MySQL
        id: config_mysql
        if: steps.config_browser.outcome == 'success'
        continue-on-error: true
        working-directory: app/backend
        run: python ../../runner/audit-tests/student-affairs-sa004-verify-v3.py config

      - name: Run strict Browser First scholarship journey to real time gate
        id: journey_browser
        continue-on-error: true
        working-directory: app/e2e
        run: npx playwright test specs/student-affairs-scholarship-browser-audit.spec.mjs

      - name: Verify journey truth and real publicity wait in MySQL
        id: journey_mysql
        if: steps.journey_browser.outcome == 'success'
        continue-on-error: true
        working-directory: app/backend
        run: python ../../runner/audit-tests/student-affairs-sa004-verify-v3.py journey

      - name: Reassert immutable application commit
        if: always()
        run: |
          echo "tested_app_head=$(git -C app rev-parse HEAD)"
          echo "audit_runner_head=$(git -C runner rev-parse HEAD)"
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"

      - name: Show focused outcomes and fail on any real blocker
        if: always()
        run: |
          echo "config_browser=${{ steps.config_browser.outcome }}"
          echo "config_mysql=${{ steps.config_mysql.outcome }}"
          echo "journey_browser=${{ steps.journey_browser.outcome }}"
          echo "journey_mysql=${{ steps.journey_mysql.outcome }}"
          test "${{ steps.config_browser.outcome }}" = "success"
          test "${{ steps.config_mysql.outcome }}" = "success"
          test "${{ steps.journey_browser.outcome }}" = "success"
          test "${{ steps.journey_mysql.outcome }}" = "success"

      - name: Upload focused SA-004 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-affairs-sa004-focused-v3-${{ github.run_id }}
          path: |
            app/e2e/playwright-report/
            app/e2e/test-results/
            app/e2e/student-affairs-scholarship-config-v3-evidence.json
            app/e2e/student-affairs-scholarship-audit-evidence.json
            app/e2e/runtime-logs/
          if-no-files-found: ignore
          retention-days: 7
