name: Academic D W1 UI zero semantics

on:
  push:
    branches:
      - agent/academic-d-graduation-delivery
    paths:
      - '.github/workflows/academic-d-w1-ui-zero-semantics.yml'

permissions:
  contents: write

jobs:
  ui-four-state-zero-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-d-graduation-delivery
          fetch-depth: 0
      - name: Apply deterministic UI semantics patch
        run: python .github/scripts/academic_d_w1_ui_zero_semantics.py
      - name: Run Stage D archive UI contract
        run: node --test frontend/tests/stage-d-archive-precheck-contract.test.mjs
      - name: Diff integrity
        run: git diff --check
      - name: Commit UI semantics fix and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/src/modules/academicAffairs/views/ArchivePrecheckView.vue \
            frontend/tests/stage-d-archive-precheck-contract.test.mjs
          git rm \
            .github/scripts/academic_d_w1_ui_zero_semantics.py \
            .github/workflows/academic-d-w1-ui-zero-semantics.yml
          git commit -m 'fix(academic-d): preserve archive N/A zero semantics in UI'
          git push origin HEAD:agent/academic-d-graduation-delivery
