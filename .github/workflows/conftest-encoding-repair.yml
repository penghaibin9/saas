name: Conftest Encoding Repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: conftest-encoding-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'agent/internship-production-hardening-20260803'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore latest valid historical conftest
        run: |
          python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path

          rel = 'backend/tests/conftest.py'
          path = Path(rel)
          current = path.read_bytes()
          try:
              ast.parse(current.decode('utf-8'), filename=rel)
              print('current conftest is already valid')
              raise SystemExit(0)
          except (UnicodeDecodeError, SyntaxError):
              pass

          commits = subprocess.check_output(
              ['git', 'rev-list', 'HEAD', '--', rel], text=True
          ).splitlines()
          chosen = None
          chosen_text = None
          for commit in commits[1:]:
              try:
                  raw = subprocess.check_output(['git', 'show', f'{commit}:{rel}'])
                  text = raw.decode('utf-8')
                  ast.parse(text, filename=f'{commit}:{rel}')
              except (subprocess.CalledProcessError, UnicodeDecodeError, SyntaxError):
                  continue
              chosen = commit
              chosen_text = text
              break
          if not chosen or chosen_text is None:
              raise SystemExit('no valid historical conftest.py found')
          canonical = chosen_text.replace('\r\n', '\n').replace('\r', '\n')
          path.write_text(canonical, encoding='utf-8', newline='\n')
          print(f'restored conftest.py from valid commit {chosen}')
          PY
          python -m py_compile backend/tests/conftest.py
          git diff --check
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/conftest.py
          if git diff --cached --quiet; then
            echo 'conftest already clean'
            exit 0
          fi
          git commit -m 'fix: restore valid pytest conftest'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
