name: Control Plane B7 School IAM Authority

on:
  workflow_dispatch:
  push:
    branches: [integration/control-plane-option-b-20260815]
    paths:
      - 'backend/app/modules/system_admin/services/school_iam_workspace_service.py'
      - 'backend/app/modules/system_admin/services/school_iam_authority_projection_service.py'
      - 'backend/app/models/permission_governance.py'
      - 'backend/app/services/system_role_shadow_service.py'
      - 'backend/tests/test_control_plane_school_iam_workspace.py'
      - '.github/workflows/control-plane-school-iam-b7-authority.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/modules/system_admin/services/school_iam_workspace_service.py'
      - 'backend/app/modules/system_admin/services/school_iam_authority_projection_service.py'
      - 'backend/app/models/permission_governance.py'
      - 'backend/app/services/system_role_shadow_service.py'
      - 'backend/tests/test_control_plane_school_iam_workspace.py'
      - '.github/workflows/control-plane-school-iam-b7-authority.yml'

permissions:
  contents: read

concurrency:
  group: control-plane-b7-school-iam-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  DB_ENABLED: 'true'
  DB_DRIVER: mysql
  MOCK_LOGIN_ENABLED: 'true'
  SECRET_KEY: control-plane-b7-school-iam-authority-secret
  JWT_SECRET: control-plane-b7-school-iam-authority-secret
  DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/control_plane_b7_school_iam?charset=utf8mb4
  TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/control_plane_b7_school_iam?charset=utf8mb4

jobs:
  b7-authority:
    name: Exact-head MySQL B7 published RoleTemplate authority
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: control_plane_b7_school_iam
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact branch HEAD assertion
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Verify B7 source cutover
        run: |
          set -euo pipefail
          python -m py_compile backend/app/modules/system_admin/services/school_iam_authority_projection_service.py
          python - <<'PY'
          from pathlib import Path
          shim = Path('backend/app/modules/system_admin/services/school_iam_workspace_service.py').read_text(encoding='utf-8')
          canonical = Path('backend/app/modules/system_admin/services/school_iam_authority_projection_service.py').read_text(encoding='utf-8')
          assert 'ROLE_PERMISSIONS_LEGACY' not in shim + canonical
          assert 'SYSTEM_ROLE_STILL_READS_ROLE_PERMISSIONS' not in shim + canonical
          assert 'NOT_APPLICABLE_UNTIL_SYSTEM_SHADOW' not in shim + canonical
          assert 'published_system_role_permissions' in canonical
          assert 'ROLE_TEMPLATE_PERMISSION_NORMALIZED' in canonical
          assert 'permission_ceiling_json' in canonical
          assert 'compatibility JSON is non-authoritative' in canonical
          PY
      - name: Install backend and migrate fresh MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
      - name: Replay production School-IAM Authority
        working-directory: backend
        run: PYTHONPATH=. python scripts/bootstrap_control_plane_school_iam_authority.py
      - name: Run B7 canonical workspace contracts
        working-directory: backend
        run: pytest -q tests/test_control_plane_school_iam_workspace.py --disable-warnings --timeout=180
      - name: Prove published normalized SYSTEM authority
        working-directory: backend
        run: |
          python - <<'PY'
          from app.db.session import get_sessionmaker
          from app.services.system_role_shadow_service import active_tenant_permission_codes, published_system_role_permissions
          db = get_sessionmaker()()
          try:
              codes = set(published_system_role_permissions(db, 'SCHOOL_ADMIN'))
              universe = set(active_tenant_permission_codes())
              assert codes == universe
              assert '*' not in codes
              assert not any(code.startswith('platform.') or code.startswith('enterprise.') for code in codes)
              assert len(codes) > 400
          finally:
              db.close()
          PY
