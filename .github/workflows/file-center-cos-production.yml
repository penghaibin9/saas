name: File center COS production

on:
  pull_request:
    paths:
      - 'backend/alembic/versions/0152_file_center_cos_production.py'
      - 'backend/app/api/v1/file.py'
      - 'backend/app/api/v1/file_contract.py'
      - 'backend/app/models/file.py'
      - 'backend/app/services/storage/**'
      - 'backend/app/commands/migrate_files_to_cos.py'
      - 'backend/app/workers/file_scan_worker.py'
      - 'backend/requirements.txt'
      - 'backend/tests/test_file_center_cos_production.py'
      - 'frontend/src/services/file/fileSdk.js'
      - 'frontend/src/services/file/cosBrowserSdk.js'
      - 'docs/architecture/file-capability-inventory.d/08-cos-production.yaml'
      - '.github/workflows/file-center-cos-production.yml'
  push:
    branches: [audit/file-capability-inventory]
    paths:
      - 'backend/alembic/versions/0152_file_center_cos_production.py'
      - 'backend/app/api/v1/file.py'
      - 'backend/app/api/v1/file_contract.py'
      - 'backend/app/models/file.py'
      - 'backend/app/services/storage/**'
      - 'backend/app/commands/migrate_files_to_cos.py'
      - 'backend/app/workers/file_scan_worker.py'
      - 'backend/requirements.txt'
      - 'backend/tests/test_file_center_cos_production.py'
      - 'frontend/src/services/file/fileSdk.js'
      - 'frontend/src/services/file/cosBrowserSdk.js'
      - 'docs/architecture/file-capability-inventory.d/08-cos-production.yaml'
      - '.github/workflows/file-center-cos-production.yml'

concurrency:
  group: file-center-cos-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-storage-contract:
    name: MySQL 对象身份 + STS + 分区 + PC 分片
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      APP_ENV: test
      SECRET_KEY: stage8-cos-production-ci-secret
      FILE_SCAN_ENABLED: 'false'
      FILE_SCAN_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify one Alembic head and upgrade real MySQL
        working-directory: backend
        run: |
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          from app.core.config import settings
          engine = create_engine(str(settings.DATABASE_URL))
          cols = {c['name'] for c in inspect(engine).get_columns('t_file_object')}
          required = {'bucket_name','object_key','etag','legacy_file_key','storage_migrated_at','storage_verified_at'}
          assert required <= cols, required - cols
          PY
      - name: Compile storage and migration services
        working-directory: backend
        run: |
          python -m py_compile \
            app/api/v1/file.py app/api/v1/file_contract.py \
            app/services/storage/cos.py app/services/storage/keys.py \
            app/services/storage/production.py app/services/storage/finalize.py \
            app/services/storage/promotion.py \
            app/commands/migrate_files_to_cos.py app/workers/file_scan_worker.py
      - name: Stage 8 backend contracts
        working-directory: backend
        run: pytest tests/test_file_center_cos_production.py tests/test_file_scan_state.py -q -p no:warnings
      - name: Teacher PC lint and production build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Freeze least privilege, commit-before-delete and no frontend permanent key
        run: |
          grep -q '"allow_prefix": \[object_key\]' backend/app/services/storage/production.py
          ! grep -R -n --exclude='*.md' 'allow_prefix.*\*' backend/app/services/storage
          ! grep -R -n --exclude='cosBrowserSdk.js' 'COS_SECRET_KEY\|COS_SECRET_ID' frontend/src
          grep -q 'COS_SDK_VERSION = .1.10.1.' frontend/src/services/file/cosBrowserSdk.js
          grep -q 'cos.pauseTask' frontend/src/services/file/fileSdk.js
          grep -q 'cos.restartTask' frontend/src/services/file/fileSdk.js
          grep -q 'cos.cancelTask' frontend/src/services/file/fileSdk.js
          grep -q 'presigned_download_url' backend/app/services/storage/cos.py
          grep -q 'cleanup_promoted_source' backend/app/services/storage/finalize.py
          ! grep -q 'backend.delete(source_key)' backend/app/services/storage/promotion.py
          grep -q -- '--verify-only' backend/app/commands/migrate_files_to_cos.py
          grep -q -- '--rollback' backend/app/commands/migrate_files_to_cos.py
