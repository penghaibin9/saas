name: Data exchange job center

on:
  pull_request:
    paths:
      - 'backend/app/models/data_exchange.py'
      - 'backend/app/services/data_exchange_job_service.py'
      - 'backend/app/services/data_exchange_confirm_service.py'
      - 'backend/app/api/v1/data_exchange.py'
      - 'backend/app/api/v1/migration.py'
      - 'backend/alembic/versions/0147_data_exchange_job_center.py'
      - 'backend/tests/test_data_exchange_job_center.py'
      - 'frontend/src/modules/system/**'
      - '.github/workflows/data-exchange-job-center.yml'
  push:
    branches:
      - audit/file-capability-inventory
    paths:
      - 'backend/app/models/data_exchange.py'
      - 'backend/app/services/data_exchange_job_service.py'
      - 'backend/app/services/data_exchange_confirm_service.py'
      - 'backend/app/api/v1/data_exchange.py'
      - 'backend/app/api/v1/migration.py'
      - 'backend/alembic/versions/0147_data_exchange_job_center.py'
      - 'backend/tests/test_data_exchange_job_center.py'
      - 'frontend/src/modules/system/**'
      - '.github/workflows/data-exchange-job-center.yml'

concurrency:
  group: data-exchange-job-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-contract:
    name: MySQL 任务权威 + PC 任务中心合同
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      APP_ENV: test
      SECRET_KEY: stage3-data-exchange-ci-secret-key
      FILE_SCAN_ENABLED: 'false'
      FILE_SCAN_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify single Alembic head and upgrade MySQL
        working-directory: backend
        run: |
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
      - name: Compile stage 3 backend
        working-directory: backend
        run: |
          python -m py_compile \
            app/models/data_exchange.py \
            app/services/data_exchange_job_service.py \
            app/services/data_exchange_confirm_service.py \
            app/api/v1/data_exchange.py \
            app/api/v1/migration.py \
            alembic/versions/0147_data_exchange_job_center.py
      - name: Authoritative contract tests
        working-directory: backend
        run: pytest tests/test_data_exchange_job_center.py -q -p no:warnings
      - name: Frontend lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Reject old confirmation contract in migrated pages
        run: |
          ! grep -R "confirmStudentIdentityBatch\|confirmTeacherIdentityBatch\|confirmMigrationBatch" \
            frontend/src/modules/system/views/SystemStudentImportView.vue \
            frontend/src/modules/system/views/SystemTeacherImportView.vue \
            frontend/src/modules/system/views/SystemMigrationView.vue
          grep -q "jobId" frontend/src/modules/system/components/ImportDialog.vue
          grep -q "expectedVersion" frontend/src/modules/system/components/ImportDialog.vue
          grep -q "pendingJobId" frontend/src/modules/system/views/SystemMigrationView.vue
          grep -q "extra=\"forbid\"" backend/app/api/v1/data_exchange.py
