name: Academic INT Program Stable Series Targeted

on:
  push:
    branches:
      - tmp/academic-int-program-series-green-20260817
      - tmp/academic-int-program-series-green-v2-20260818
      - integration/academic-school-gold
    paths:
      - 'backend/alembic/versions/20260817_academic_int_program_series.py'
      - 'backend/app/models/academic_affairs.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_program_core_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_program_authority_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_program_service.py'
      - 'backend/tests/test_academic_int_program_series_schema_red.py'
      - 'backend/tests/test_academic_int_program_series_mysql.py'
      - '.github/workflows/academic-int-program-series-targeted.yml'

concurrency:
  group: academic-int-program-series-${{ github.ref }}
  cancel-in-progress: false

jobs:
  program-stable-series:
    name: Program stable-series exact-head MySQL gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      APP_ENV: test
      SECRET_KEY: academic-int-program-series-targeted
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact atomic base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "4d971781a9d0d1728cc7ab01daefb25de95fd23a"
          test "$(git rev-list --count 4d971781a9d0d1728cc7ab01daefb25de95fd23a..HEAD)" = "1"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Prove source contract and single Alembic head
        working-directory: backend
        run: |
          set -euo pipefail
          FILE=alembic/versions/20260817_academic_int_program_series.py
          grep -F 'revision = "20260817_acad_int_program_series"' "$FILE"
          grep -F 'down_revision = "20260817_acad_int_ctrl_merge"' "$FILE"
          grep -F 'uk_aa_program_series_version' "$FILE"
          ! grep -Ei 'UPDATE[[:space:]]+t_aa_program|LEGACY-' "$FILE"
          grep -F '.with_for_update()' app/modules/academic_affairs/services/academic_affairs_program_authority_service.py
          grep -F 'PROGRAM_SERIES_UNRESOLVED' app/modules/academic_affairs/services/academic_affairs_program_authority_service.py
          HEADS="$(alembic heads)"
          echo "$HEADS"
          test "$(printf '%s\n' "$HEADS" | grep -c ' (head)')" = "1"
          printf '%s\n' "$HEADS" | grep -F '20260817_acad_int_program_series (head)'

      - name: Fresh MySQL upgrade
        working-directory: backend
        run: |
          set -euo pipefail
          alembic upgrade head
          alembic current | grep -F '20260817_acad_int_program_series (head)'

      - name: Run only stable-series targeted contracts
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_academic_int_program_series_schema_red.py \
            tests/test_academic_int_program_series_mysql.py
