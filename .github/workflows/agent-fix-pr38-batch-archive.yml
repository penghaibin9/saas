name: Agent Fix PR38 Batch Archive

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: agent-fix-pr38-batch-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.head_ref == 'fix/main-pytest-fixture-corruption' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-pytest-fixture-corruption
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch V2 batch archive accounting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/modules/graduation/materials/manifest_service.py')
          text = path.read_text(encoding='utf-8')
          marker = '        if row.get("missing") or int(row.get("openRisks") or 0) > 0:\n'
          if marker not in text:
              anchor = '        gd_student_id = int(row["studentId"])\n        try:\n'
              replacement = (
                  '        gd_student_id = int(row["studentId"])\n'
                  '        if row.get("missing") or int(row.get("openRisks") or 0) > 0:\n'
                  '            skipped += 1\n'
                  '            continue\n'
                  '        try:\n'
              )
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one batch_file anchor, found {text.count(anchor)}')
              path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          python -m py_compile backend/app/modules/graduation/materials/manifest_service.py
          git diff --check

      - name: Commit focused fix
        run: |
          if git diff --quiet -- backend/app/modules/graduation/materials/manifest_service.py; then
            echo 'No change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/modules/graduation/materials/manifest_service.py
          git commit -m 'fix(graduation): count ineligible batch archive rows as skipped [agent-fix-pr38]'
          git push origin HEAD:fix/main-pytest-fixture-corruption
