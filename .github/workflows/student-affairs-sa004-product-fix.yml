# Retrigger precise SA-004 product repair after runner pre-audit.
name: Student Affairs SA-004 product fix

on:
  push:
    branches:
      - audit/student-affairs-browser-runner-20260823
    paths:
      - '.github/workflows/student-affairs-sa004-product-fix.yml'

permissions:
  contents: write

jobs:
  fix-sa004-reviewer-statement:
    name: SA-004 reviewer statement / precise fix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout product RC exact head
        uses: actions/checkout@v4
        with:
          ref: fix/student-affairs-final-rc-20260824
          fetch-depth: 0

      - name: Assert expected product head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e2ec86e79ea620ce6ed67491f7e040ae1edfbab8"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact SA-004 product repair
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('backend/app/services/affairs_funding_service.py')
          text = backend.read_text(encoding='utf-8')
          old = '''            "amount": _amount_view(x.amount, user), "status": x.status,
            "statusLabel": L_FUND.get(x.status, x.status),'''
          new = '''            "amount": _amount_view(x.amount, user), "statement": x.statement or "", "status": x.status,
            "statusLabel": L_FUND.get(x.status, x.status),'''
          assert text.count(old) == 1, 'backend funding row contract drifted'
          backend.write_text(text.replace(old, new), encoding='utf-8')

          frontend = Path('frontend/src/modules/studentAffairs/views/FundingWorkbenchView.vue')
          text = frontend.read_text(encoding='utf-8')
          old = '''          </dl>
          <p v-if="selected.checkSnapshot" class="fd-snap">资格校验：{{ snapshotText(selected.checkSnapshot) }}</p>'''
          new = '''          </dl>
          <div class="fd-statement">
            <span>申请理由</span>
            <p>{{ selected.statement || '未填写申请理由' }}</p>
          </div>
          <p v-if="selected.checkSnapshot" class="fd-snap">资格校验：{{ snapshotText(selected.checkSnapshot) }}</p>'''
          assert text.count(old) == 1, 'funding detail template drifted'
          text = text.replace(old, new)
          old_css = '''.fd-snap {
  font-size: var(--font-size-xs);'''
          new_css = '''.fd-statement {
  margin: 0 0 var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--border-base);
  border-radius: var(--radius-base);
  background: var(--bg-subtle, #f8fafc);
}
.fd-statement span {
  display: block;
  margin-bottom: var(--space-1);
  font-size: var(--font-size-xs);
  color: var(--text-tertiary);
}
.fd-statement p {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: var(--font-size-sm);
  line-height: 1.65;
  color: var(--text-primary);
}
.fd-snap {
  font-size: var(--font-size-xs);'''
          assert text.count(old_css) == 1, 'funding detail style anchor drifted'
          frontend.write_text(text.replace(old_css, new_css), encoding='utf-8')

          contract = Path('frontend/tests/studentAffairs.fundingReviewerStatement.contract.test.mjs')
          contract.write_text('''import assert from 'node:assert/strict'\nimport fs from 'node:fs'\n\nconst service = fs.readFileSync('../backend/app/services/affairs_funding_service.py', 'utf8')\nconst view = fs.readFileSync('src/modules/studentAffairs/views/FundingWorkbenchView.vue', 'utf8')\n\nassert.match(service, /["']statement["']:\\s*x\\.statement\\s+or\\s+["']["']/)\nassert.match(view, />申请理由<\\/span>/)\nassert.match(view, /selected\\.statement\\s*\\|\\|\\s*['"]未填写申请理由['"]/)\nassert.match(view, /white-space:\\s*pre-wrap/)\nconsole.log('student affairs funding reviewer statement contract: PASS')\n''', encoding='utf-8')
          PY

      - name: Run precise SA-004 regressions
        run: |
          pip install -r backend/requirements.txt
          cd backend
          pytest -q tests/test_affairs_funding.py
          cd ../frontend
          node tests/studentAffairs.fundingReviewerStatement.contract.test.mjs
          npm ci
          npm run build

      - name: Commit exact files to product RC
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git add backend/app/services/affairs_funding_service.py
          git add frontend/src/modules/studentAffairs/views/FundingWorkbenchView.vue
          git add frontend/tests/studentAffairs.fundingReviewerStatement.contract.test.mjs
          test -z "$(git diff --cached --name-only | grep -v -E '^(backend/app/services/affairs_funding_service.py|frontend/src/modules/studentAffairs/views/FundingWorkbenchView.vue|frontend/tests/studentAffairs.fundingReviewerStatement.contract.test.mjs)$')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(student-affairs): show funding statement to reviewers"
          git push origin HEAD:fix/student-affairs-final-rc-20260824
          echo "new_product_head=$(git rev-parse HEAD)"
