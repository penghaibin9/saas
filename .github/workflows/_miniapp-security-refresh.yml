name: Miniapp security refresh

on:
  push:
    branches: [agent/production-release-governance-20260807]
    paths:
      - '.github/workflows/_miniapp-security-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/production-release-governance-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - name: Separate build toolchain from shipped runtime dependencies
        working-directory: miniapp
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.dependencies ||= {}
          pkg.devDependencies ||= {}
          const buildOnly = [
            '@dcloudio/types',
            '@dcloudio/uni-app',
            '@dcloudio/uni-cli-shared',
            '@dcloudio/uni-components',
            '@dcloudio/uni-h5',
            '@dcloudio/uni-mp-weixin',
            '@dcloudio/vite-plugin-uni',
            'sass',
            'vite'
          ]
          for (const name of buildOnly) {
            if (!(name in pkg.dependencies)) throw new Error(`expected build dependency missing: ${name}`)
            pkg.devDependencies[name] = pkg.dependencies[name]
            delete pkg.dependencies[name]
          }
          // 9.14.5 is the patched v9 line and remains compatible with the current app contract.
          pkg.dependencies['vue-i18n'] = '9.14.5'
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
          NODE
          npm install --package-lock-only
      - name: Verify production tree is free of build-only DCloud packages
        working-directory: miniapp
        shell: bash
        run: |
          set -euo pipefail
          npm ls --omit=dev --depth=0
          node <<'NODE'
          const pkg = require('./package.json')
          const forbidden = Object.keys(pkg.dependencies || {}).filter((name) => name.startsWith('@dcloudio/') || ['vite', 'sass'].includes(name))
          if (forbidden.length) throw new Error(`build-only packages leaked into production dependencies: ${forbidden.join(', ')}`)
          NODE
      - name: Verify clean install, production audit, tests and builds
        working-directory: miniapp
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test
          npm run build:h5
          npm run build:mp-weixin
      - name: Commit only dependency manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git status --short)"
          echo "$CHANGED"
          test -n "$CHANGED"
          BAD="$(git status --short | awk '{print $2}' | grep -Ev '^(miniapp/package.json|miniapp/package-lock.json)$' || true)"
          test -z "$BAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add miniapp/package.json miniapp/package-lock.json
          git commit -m 'security(miniapp): separate build and runtime dependencies'
          git push origin HEAD:agent/production-release-governance-20260807
