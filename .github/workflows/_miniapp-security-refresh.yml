name: Miniapp security refresh

on:
  push:
    branches: [agent/production-release-governance-20260807]
    paths:
      - '.github/workflows/_miniapp-security-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/production-release-governance-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - name: Patch vulnerable transitive dependencies without downgrading UniApp
        working-directory: miniapp
        shell: bash
        run: |
          set -euo pipefail
          # Keep the validated UniApp train. npm audit --force proposes ancient UniApp
          # downgrades, so pin only vulnerable transitive packages to current patched releases.
          npm pkg set \
            'overrides.@babel/core=latest' \
            'overrides.@intlify/core-base=latest' \
            'overrides.@intlify/message-compiler=latest' \
            'overrides.@intlify/message-resolver=latest' \
            'overrides.@intlify/runtime=latest' \
            'overrides.@intlify/vue-devtools=latest' \
            'overrides.adm-zip=latest' \
            'overrides.jpeg-js=latest' \
            'overrides.path-to-regexp=latest' \
            'overrides.postcss=latest' \
            'overrides.ws=latest'
          npm install --package-lock-only
      - name: Verify clean install, production audit, tests and builds
        working-directory: miniapp
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test
          npm run build:h5
          npm run build:mp-weixin
      - name: Commit only dependency manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git status --short)"
          echo "$CHANGED"
          test -n "$CHANGED"
          BAD="$(git status --short | awk '{print $2}' | grep -Ev '^(miniapp/package.json|miniapp/package-lock.json)$' || true)"
          test -z "$BAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add miniapp/package.json miniapp/package-lock.json
          git commit -m 'security(miniapp): pin patched transitive dependencies'
          git push origin HEAD:agent/production-release-governance-20260807
