name: Module commerce M2 browser E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/models/commercial.py'
      - 'backend/app/models/__init__.py'
      - 'backend/app/services/commercial_catalog_contract.py'
      - 'backend/app/services/commercial_catalog_service.py'
      - 'backend/app/services/commercial_order_item_service.py'
      - 'backend/app/services/module_subscription_service.py'
      - 'backend/app/services/commercial_entitlement_authority_service.py'
      - 'backend/app/services/platform_service.py'
      - 'backend/alembic/versions/20260908_module_commerce_m12.py'
      - 'backend/scripts/e2e_seed_module_commerce_m2.py'
      - 'frontend/src/security/moduleEntitlement.js'
      - 'frontend/src/security/permissionGate.js'
      - 'frontend/src/config/navPlan.js'
      - 'frontend/src/config/adminMenu.js'
      - 'frontend/src/layouts/BasePortalLayout.vue'
      - 'frontend/tests/module-commerce-entitlement-projection.test.mjs'
      - 'e2e/specs/module-commerce-m2.spec.mjs'
      - '.github/workflows/module-commerce-m2-e2e.yml'

permissions:
  contents: read

concurrency:
  group: module-commerce-m2-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  APP_ENV: test
  DEPLOYMENT_MODE: local
  TRUSTED_PROXY_IPS: 127.0.0.1/32
  DB_ENABLED: 'true'
  DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/module_commerce_m2_e2e?charset=utf8mb4
  TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/module_commerce_m2_e2e?charset=utf8mb4
  DB_HOST: 127.0.0.1
  DB_PORT: '3306'
  DB_USER: root
  DB_PASSWORD: e2e_root
  DB_NAME: module_commerce_m2_e2e
  REDIS_URL: redis://127.0.0.1:6379/14
  REDIS_KEY_PREFIX: module-commerce-m2-${{ github.run_id }}
  REDIS_CONNECT_TIMEOUT: '2'
  REDIS_SOCKET_TIMEOUT: '2'
  JWT_SECRET: module-commerce-m2-e2e-only
  JWT_SECRET_KEY: module-commerce-m2-e2e-only
  SECRET_KEY: module-commerce-m2-e2e-only-secret
  MOCK_LOGIN_ENABLED: 'false'
  SMS_ENABLED: 'false'
  SCHEDULER_MODE: external
  E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
  E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
  E2E_STAFF_BASE_URL: http://127.0.0.1:5174
  E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
  E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DEPLOYED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  m2-browser:
    name: 16 combinations / real browser / real API / isolated MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: module_commerce_m2_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.E2E_EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact source revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$E2E_EXPECTED_SHA"
          mkdir -p artifacts/module-commerce-m2 e2e/runtime-logs
          git rev-parse HEAD > artifacts/module-commerce-m2/revision.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend and migrate exact schema
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
          alembic current | tee ../artifacts/module-commerce-m2/alembic-current.log
          python -m py_compile scripts/e2e_seed_module_commerce_m2.py

      - name: Seed sixteen paid-order entitlement combinations
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          python scripts/e2e_seed_module_commerce_m2.py 2>&1 | tee ../artifacts/module-commerce-m2/seed.log

      - name: Start exact-head backend
        run: |
          set -euo pipefail
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/module-commerce-backend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/module-commerce-backend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/module-commerce-backend.log
          exit 1

      - name: Install, contract-test and build production staff PC
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          node --test tests/module-commerce-entitlement-projection.test.mjs | tee ../artifacts/module-commerce-m2/frontend-contract.log
          npm run build | tee ../artifacts/module-commerce-m2/frontend-build.log
          nohup npm run preview -- --host 127.0.0.1 --port 5174 > ../e2e/runtime-logs/module-commerce-frontend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/module-commerce-frontend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5174/workbench >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/module-commerce-frontend.log
          exit 1

      - name: Install Chromium and run M2 exact-head browser matrix
        working-directory: e2e
        run: |
          set -euo pipefail
          npm ci
          node --check specs/module-commerce-m2.spec.mjs
          npx playwright install --with-deps chromium
          npx playwright test specs/module-commerce-m2.spec.mjs --workers=1 --retries=0

      - name: Validate sealed browser evidence
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = os.environ['E2E_EXPECTED_SHA']
          path = Path('e2e/test-results/module-commerce-m2-evidence.json')
          evidence = json.loads(path.read_text(encoding='utf-8'))
          assert evidence['headSha'] == expected
          assert evidence['realBrowser'] is True
          assert evidence['realApi'] is True
          assert evidence['isolatedMySql'] is True
          assert evidence['mockSuccess'] is False
          assert evidence['legacyFeatureOverrideUsed'] is False
          assert evidence['comboCount'] == 16
          rows = evidence['combinations']
          assert len(rows) == 16
          assert {int(row['mask']) for row in rows} == set(range(16))
          modules = {'internship', 'graduationDesign', 'studentAffairs', 'academicAffairs'}
          for row in rows:
              assert row['currentContextCoreExact'] is True
              assert row['railCoreExact'] is True
              assert row['employmentDenied'] is True
              assert row['apiAccessDenied'] is True
              assert row['platformPlaneDenied'] is True
              assert set(row['routes']) == modules
              assert set(row['apis']) == modules
          target = Path('artifacts/module-commerce-m2/browser-evidence.json')
          target.write_text(json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          print('MODULE_COMMERCE_M2_BROWSER_SEALED')
          PY

      - name: Upload M2 browser evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-commerce-m2-e2e-${{ env.E2E_EXPECTED_SHA }}
          path: |
            artifacts/module-commerce-m2/
            e2e/test-results/
            e2e/playwright-report/
            e2e/runtime-fixtures/module-commerce-m2.json
            e2e/runtime-logs/
          if-no-files-found: error
          retention-days: 14
