name: Backend pytest DB-mode cluster

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/tests/test_db_mode.py'
      - 'backend/app/**'
      - 'backend/alembic/**'
      - 'backend/requirements.txt'
      - 'backend/requirements-dev.txt'
      - 'scripts/check/sanitize_pytest_junit.py'
      - '.github/workflows/backend-pytest-db-mode-cluster.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precise:
    name: DB-mode / ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: approval
            nodeid: tests/test_db_mode.py::test_approval_flow_db
          - case: upload
            nodeid: tests/test_db_mode.py::test_p4_upload_real
          - case: student-void
            nodeid: tests/test_db_mode.py::test_student_create_void_db
          - case: todos-messages
            nodeid: tests/test_db_mode.py::test_todos_messages_db
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: saas_test
          MYSQL_USER: saas
          MYSQL_PASSWORD: saas_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DB_MODE: db
      DATABASE_URL: mysql+pymysql://saas:saas_test_password@127.0.0.1:3306/saas_test?charset=utf8mb4
      JWT_SECRET: ci-test-only-jwt-secret-not-production
      FILE_STORAGE_PROVIDER: local
      LOCAL_UPLOAD_DIR: /tmp/saas-ci-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run exact historical nodeid
        id: pytest
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m pytest -q '${{ matrix.nodeid }}' --junitxml="/tmp/db-mode-${{ matrix.case }}.xml"
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Sanitize JUnit
        if: always()
        run: python scripts/check/sanitize_pytest_junit.py "/tmp/db-mode-${{ matrix.case }}.xml"
      - name: Upload secret-safe JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-mode-${{ matrix.case }}
          path: /tmp/db-mode-${{ matrix.case }}.xml
          if-no-files-found: error
          retention-days: 14
      - name: Preserve real pytest result
        if: always()
        shell: bash
        run: exit '${{ steps.pytest.outputs.exit_code }}'
