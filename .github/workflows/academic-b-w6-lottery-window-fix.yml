name: Academic B W6 Lottery Window Fix

on:
  push:
    branches:
      - agent/academic-b-schedule-selection
    paths:
      - .github/workflows/academic-b-w6-lottery-window-fix.yml

permissions:
  contents: write

concurrency:
  group: academic-b-w6-lottery-window-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact helper parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7e1cdbf94bdb562fd5599d9a32dcaa80230850c9"
      - name: Apply exact W6-3 round-window fix
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py")
          test_path = Path("backend/tests/test_aa_selection_w6_lottery_concurrency_mysql.py")
          source = source_path.read_text(encoding="utf-8")
          test = test_path.read_text(encoding="utf-8")

          helper_marker = "\n\ndef _evaluate_student_course(\n"
          assert source.count(helper_marker) == 1
          helper = '''\n\ndef _configured_round_batch_ids(db, batch_ids) -> set[int]:\n    \"\"\"Return tenant-scoped batches that have any persisted Selection round.\"\"\"\n    from app.models import AaSelectionRound\n\n    normalized = sorted({int(value) for value in (batch_ids or [])})\n    if not normalized:\n        return set()\n    rows = db.query(AaSelectionRound.batch_id).filter(\n        AaSelectionRound.tenant_id == _base._core._tid(),\n        AaSelectionRound.batch_id.in_(normalized),\n        AaSelectionRound.is_deleted.is_(False),\n    ).distinct().all()\n    return {int(row[0]) for row in rows}\n'''
          source = source.replace(helper_marker, helper + helper_marker, 1)

          signature_old = '''    active_round,\n    evaluated_at,\n) -> dict:\n'''
          signature_new = '''    active_round,\n    evaluated_at,\n    round_configured=False,\n) -> dict:\n'''
          assert source.count(signature_old) == 1
          source = source.replace(signature_old, signature_new, 1)

          evaluator_old = '''        else:\n            if active_round and not active_round.allow_enroll:\n                raise _base._core._invalid(\"当前轮次不允许选课\")\n'''
          evaluator_new = '''        else:\n            if (\n                str(batch.status or \"\").upper() == _base._BATCH_OPEN\n                and round_configured\n                and active_round is None\n            ):\n                raise _base._core._invalid(\"当前没有开放选课轮次\")\n            if active_round and not active_round.allow_enroll:\n                raise _base._core._invalid(\"当前轮次不允许选课\")\n'''
          assert source.count(evaluator_old) == 1
          source = source.replace(evaluator_old, evaluator_new, 1)

          allow_enroll_old = '''            \"allowEnroll\": bool(getattr(active_round, \"allow_enroll\", True)) if active_round else True,\n'''
          allow_enroll_new = '''            \"allowEnroll\": (\n                bool(getattr(active_round, \"allow_enroll\", True))\n                if active_round\n                else not (\n                    str(batch.status or \"\").upper() == _base._BATCH_OPEN\n                    and round_configured\n                )\n            ),\n'''
          assert source.count(allow_enroll_old) == 1
          source = source.replace(allow_enroll_old, allow_enroll_new, 1)

          courses_start = source.index("\ndef student_courses(user, batch_id=None):")
          courses_end = source.index("\n\ndef batch_preflight(user, batch_id, action: str)", courses_start)
          courses = source[courses_start:courses_end]
          batch_ids_old = '''        batch_ids = [int(batch.id) for batch in batches]\n        course_rows = db.query(AaSelectionCourse).filter(\n'''
          batch_ids_new = '''        batch_ids = [int(batch.id) for batch in batches]\n        configured_round_batch_ids = _configured_round_batch_ids(db, batch_ids)\n        course_rows = db.query(AaSelectionCourse).filter(\n'''
          assert courses.count(batch_ids_old) == 1
          courses = courses.replace(batch_ids_old, batch_ids_new, 1)
          courses_call_old = '''                    active_round=active_round,\n                    evaluated_at=evaluated_at,\n                )\n'''
          courses_call_new = '''                    active_round=active_round,\n                    evaluated_at=evaluated_at,\n                    round_configured=bid in configured_round_batch_ids,\n                )\n'''
          assert courses.count(courses_call_old) == 1
          courses = courses.replace(courses_call_old, courses_call_new, 1)
          source = source[:courses_start] + courses + source[courses_end:]

          preflight_start = source.index("\ndef student_preflight(user, body):")
          preflight_end = source.index("\n\ndef student_enroll(user, body):", preflight_start)
          preflight = source[preflight_start:preflight_end]
          preflight_round_old = '''        active_round = _base._active_round(db, batch.id)\n        return _evaluate_student_course(\n'''
          preflight_round_new = '''        active_round = _base._active_round(db, batch.id)\n        round_configured = bool(_configured_round_batch_ids(db, [batch.id]))\n        return _evaluate_student_course(\n'''
          assert preflight.count(preflight_round_old) == 1
          preflight = preflight.replace(preflight_round_old, preflight_round_new, 1)
          preflight_call_old = '''            active_round=active_round,\n            evaluated_at=evaluated_at,\n        )\n'''
          preflight_call_new = '''            active_round=active_round,\n            evaluated_at=evaluated_at,\n            round_configured=round_configured,\n        )\n'''
          assert preflight.count(preflight_call_old) == 1
          preflight = preflight.replace(preflight_call_old, preflight_call_new, 1)
          source = source[:preflight_start] + preflight + source[preflight_end:]

          command_start = source.index("\ndef _student_enroll_guarded(user, body):")
          command_end = source.index("\n\ndef student_drop(user, body):", command_start)
          command = source[command_start:command_end]
          command_round_old = '''        active_round = _base._active_round(db, batch.id)\n        if active_round and not active_round.allow_enroll:\n'''
          command_round_new = '''        active_round = _base._active_round(db, batch.id)\n        round_configured = bool(_configured_round_batch_ids(db, [batch.id]))\n        if (\n            batch.status == _base._BATCH_OPEN\n            and round_configured\n            and active_round is None\n        ):\n            exc = _base._core._invalid(\"当前没有开放选课轮次\")\n            raise selection_trace.attach_selection_trace(\n                exc,\n                db=db,\n                student=student,\n                course=course,\n                evaluated_at=selection_effective_at,\n                rule_code=\"SELECTION_LOCKED\",\n            )\n        if active_round and not active_round.allow_enroll:\n'''
          assert command.count(command_round_old) == 1
          command = command.replace(command_round_old, command_round_new, 1)
          source = source[:command_start] + command + source[command_end:]

          projection_marker = '''\ndef _run_draw(barrier: Barrier, round_id: int, outcomes: Queue) -> None:\n'''
          assert test.count(projection_marker) == 1
          projection_helper = '''\n\ndef _course_projection(payload, selection_course_id: int):\n    for group in payload[\"data\"][\"items\"]:\n        for course in group.get(\"courses\") or []:\n            if str(course.get(\"selectionCourseId\")) == str(selection_course_id):\n                return course\n    raise AssertionError(f\"projection missing selectionCourseId={selection_course_id}\")\n'''
          test = test.replace(projection_marker, projection_helper + projection_marker, 1)

          late_marker = '''    late = _enroll(client, \"SEL2402\", \"选乙\", int(selection_course_id))\n    assert late.status_code == 409, late.text\n'''
          assert test.count(late_marker) == 1
          read_write_contract = '''    stu2 = _suite._stu_token(\"选乙\", \"SEL2402\")\n    courses_resp = client.get(f\"{BASE}/selection/student/courses\", headers=stu2)\n    assert courses_resp.status_code == 200, courses_resp.text\n    blocked = _course_projection(courses_resp.json(), int(selection_course_id))\n    assert blocked[\"status\"] == \"BLOCKED\"\n    assert blocked[\"allowedActions\"] == [\"VIEW\"]\n    assert blocked[\"eligibility\"] == \"INELIGIBLE\"\n    assert \"当前没有开放选课轮次\" in blocked[\"reason\"]\n    assert blocked[\"lottery\"][\"allowEnroll\"] is False\n\n    preflight = client.post(\n        f\"{BASE}/selection/student/preflight\",\n        headers=stu2,\n        json={\"selectionCourseId\": str(selection_course_id)},\n    )\n    assert preflight.status_code == 200, preflight.text\n    pf = preflight.json()[\"data\"]\n    assert pf[\"allowed\"] is False\n    assert pf[\"status\"] == \"BLOCKED\"\n    assert pf[\"allowedActions\"] == [\"VIEW\"]\n    assert pf[\"reason\"] == blocked[\"reason\"]\n\n    late = _enroll(client, \"SEL2402\", \"选乙\", int(selection_course_id))\n    assert late.status_code == 409, late.text\n    assert \"当前没有开放选课轮次\" in late.json()[\"message\"]\n'''
          test = test.replace(late_marker, read_write_contract, 1)

          assert source.count("当前没有开放选课轮次") == 2
          assert source.count("round_configured=round_configured") == 1
          assert source.count("round_configured=bid in configured_round_batch_ids") == 1
          drop_start = source.index("\ndef student_drop(user, body):")
          lock_start = source.index("\n\ndef lock_batch(user, batch_id):", drop_start)
          assert "_configured_round_batch_ids" not in source[drop_start:lock_start]
          source_path.write_text(source, encoding="utf-8")
          test_path.write_text(test, encoding="utf-8")
          PY
          python -m py_compile \
            backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py \
            backend/tests/test_aa_selection_w6_lottery_concurrency_mysql.py
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py \
            backend/tests/test_aa_selection_w6_lottery_concurrency_mysql.py | sort)"
          test "$changed" = "$expected"
      - name: Commit exact production fix and self-clean helper
        run: |
          set -euo pipefail
          rm .github/workflows/academic-b-w6-lottery-window-fix.yml
          git add \
            backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py \
            backend/tests/test_aa_selection_w6_lottery_concurrency_mysql.py \
            .github/workflows/academic-b-w6-lottery-window-fix.yml
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/academic-b-w6-lottery-window-fix.yml \
            backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py \
            backend/tests/test_aa_selection_w6_lottery_concurrency_mysql.py | sort)"
          test "$staged" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(academic-b): close W6 lottery round gap"
          git push origin HEAD:agent/academic-b-schedule-selection
