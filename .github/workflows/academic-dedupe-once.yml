name: Academic Dedupe Once

on:
  push:
    branches:
      - fix/academic-affairs-final-rc-20260824

permissions:
  contents: write

jobs:
  dedupe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor duplicate academic implementations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          stats_path = Path('backend/app/modules/academic_affairs/services/academic_affairs_stats_service.py')
          grade_path = Path('backend/app/modules/academic_affairs/services/academic_affairs_grade_service.py')
          guard_path = Path('backend/app/modules/academic_affairs/services/academic_affairs_grade_execution_transaction_guard.py')
          test_path = Path('backend/tests/test_academic_dedupe_contract.py')

          # 1) Remove the second shadowing definitions in legacy stats service.
          # The canonical runtime facade still owns these six contracts; keeping only the first
          # compatibility definition eliminates Python's "last definition wins" ambiguity.
          stats_text = stats_path.read_text(encoding='utf-8')
          stats_tree = ast.parse(stats_text)
          targets = {
              'course_selection_stats',
              'course_selection_detail',
              'exam_stats',
              'exam_detail',
              'resource_stats',
              'resource_detail',
          }
          occurrences: dict[str, list[ast.AST]] = {name: [] for name in targets}
          for node in stats_tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in targets:
                  occurrences[node.name].append(node)
          bad = {name: len(nodes) for name, nodes in occurrences.items() if len(nodes) != 2}
          if bad:
              raise SystemExit(f'unexpected stats duplicate shape: {bad}')
          lines = stats_text.splitlines(keepends=True)
          ranges: list[tuple[int, int]] = []
          for nodes in occurrences.values():
              node = nodes[1]
              start = node.lineno - 1
              end = int(node.end_lineno or node.lineno)
              while end < len(lines) and not lines[end].strip():
                  end += 1
              ranges.append((start, end))
          for start, end in sorted(ranges, reverse=True):
              del lines[start:end]
          stats_path.write_text(''.join(lines), encoding='utf-8')

          # 2) Make grade_service the single owner of score-entry and submit business rules.
          grade_text = grade_path.read_text(encoding='utf-8')

          enter_block = r'''def _write_user(db, task, user, prepare_user=None):
              """Resolve optional execution-layer authority without duplicating grade business rules."""
              if prepare_user is None:
                  return user
              return prepare_user(db, task, user)


          def _enter_score_in_session(db, task, user, body, *, prepare_user=None) -> dict:
              """Canonical single-row score command inside the caller's existing transaction."""
              from app.models import AaGradeRecord
              from app.modules.academic_affairs.services.academic_affairs_archive_service import guard_term_writable

              guard_term_writable(db, task.term_id)
              scoped_user = _write_user(db, task, user, prepare_user)
              _core._check_course_scope(task, scoped_user)
              if str(task.status or "").upper() not in _EDITABLE:
                  raise AppException("DATA_CONFLICT", "当前状态不可录入（已提交/已发布，如需修改请走成绩更正）")
              data = _require_ready_roster(db, task)
              try:
                  student_id = int(_body_value(body, "studentId"))
              except (TypeError, ValueError) as exc:
                  raise AppException("VALIDATION_ERROR", "studentId必填且须为有效数字") from exc
              if student_id not in {int(value) for value in data.get("studentIds") or []}:
                  raise AppException("VALIDATION_ERROR", "该学生不在当前教学任务正式名单中")

              record = db.scalars(select(AaGradeRecord).where(
                  AaGradeRecord.tenant_id == _core._tid(),
                  AaGradeRecord.task_id == task.id,
                  AaGradeRecord.student_id == student_id,
                  AaGradeRecord.is_deleted.is_(False),
              )).first()
              if not record:
                  record = AaGradeRecord(tenant_id=_core._tid(), task_id=task.id, student_id=student_id)
                  db.add(record)

              fields = _body_fields(body)
              if isinstance(body, dict):
                  fields = set(body)
              clear_usual = bool(_body_value(body, "clearUsual", False))
              clear_midterm = bool(_body_value(body, "clearMidterm", False))
              clear_final = bool(_body_value(body, "clearFinal", False))
              if clear_usual:
                  fields.add("usualScore")
              if clear_midterm:
                  fields.add("midtermScore")
              if clear_final:
                  fields.add("finalScore")

              usual = record.usual_score
              midterm = record.midterm_score
              final = record.final_score
              if "usualScore" in fields:
                  usual = None if clear_usual else _strict_score(_body_value(body, "usualScore"), "平时")
              if "midtermScore" in fields:
                  midterm = None if clear_midterm else _strict_score(_body_value(body, "midtermScore"), "期中")
              if "finalScore" in fields:
                  final = None if clear_final else _strict_score(_body_value(body, "finalScore"), "期末")

              if "exceptionFlag" in fields:
                  flag = str(_body_value(body, "exceptionFlag") or "NORMAL").strip().upper()
              else:
                  flag = str(record.exception_flag or "NORMAL").upper()
              if flag not in _SPECIAL_FLAGS:
                  raise AppException("VALIDATION_ERROR", "异常标记非法")

              total = None
              if flag == "NORMAL":
                  if _core._scores_complete(task, usual, midterm, final):
                      total = _core._compose_total(task, usual, midterm, final)
              else:
                  usual = midterm = final = None

              record.usual_score = usual
              record.midterm_score = midterm
              record.final_score = final
              record.total_score = total
              record.exception_flag = flag
              record.pass_status = (
                  "PASSED" if total is not None and total >= int(task.pass_line or 60)
                  else "FAILED" if total is not None
                  else None
              )
              if task.status == "NOT_STARTED":
                  task.status = "INPUTTING"
              db.flush()
              _core._audit(
                  db,
                  "AA_GRADE_TASK",
                  task.id,
                  "ENTER",
                  f"student={student_id};roster={data.get('source')}",
              )
              return {
                  "recordId": str(record.id),
                  "studentId": str(student_id),
                  "usualScore": usual,
                  "midtermScore": midterm,
                  "finalScore": final,
                  "totalScore": total,
                  "passStatus": record.pass_status,
                  "exceptionFlag": flag,
              }


          def enter_score(task_id, user, body) -> dict:
              """Single-row grade save; canonical business rules live in one in-session command."""
              with _core.session() as db:
                  task = _load_task(db, int(task_id), lock=True)
                  result = _enter_score_in_session(db, task, user, body)
                  db.commit()
                  return result'''
          enter_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in enter_block.splitlines())

          start = grade_text.index('def enter_score(')
          end = grade_text.index('def grade_import_dry_run(', start)
          grade_text = grade_text[:start] + enter_block + '\n\n\n' + grade_text[end:]

          submit_block = r'''def _submit_task_in_session(db, task, user, *, prepare_user=None) -> dict:
              """Canonical ordinary grade-task submit command inside one existing transaction."""
              from app.models import AaGradeRecord, AaGradeTask, WorkflowInstance, WorkflowTask
              from app.modules.academic_affairs.services.academic_affairs_archive_service import guard_term_writable
              from app.modules.academic_affairs.services.academic_affairs_grade_task_assignee_guard import (
                  resolve_grade_task_assignee,
              )
              from app.services.runtime_preset_install_service import ensure_workflow_enabled

              guard_term_writable(db, task.term_id)
              scoped_user = _write_user(db, task, user, prepare_user)
              _core._check_course_scope(task, scoped_user)
              if task.status not in {"INPUTTING", "RETURNED"}:
                  raise AppException("DATA_CONFLICT", "当前状态不可提交")
              was_returned = task.status == "RETURNED"
              if not task.teaching_task_id:
                  raise AppException(
                      "DATA_CONFLICT",
                      "管理员特殊补录不可走普通教学任务提交链；请使用补录复核专用流程",
                      http_status=409,
                  )

              data = resolve_versioned_roster(db, int(task.teaching_task_id))
              roster_ids = {int(value) for value in data.get("studentIds") or []}
              if not roster_ids:
                  raise AppException("DATA_CONFLICT", "正式教学名单为空，不可提交成绩任务", http_status=409)
              records = db.scalars(select(AaGradeRecord).where(
                  AaGradeRecord.tenant_id == _core._tid(),
                  AaGradeRecord.task_id == task.id,
                  AaGradeRecord.is_deleted.is_(False),
              )).all()
              record_ids = {int(row.student_id) for row in records}
              missing = sorted(roster_ids - record_ids)
              extra = sorted(record_ids - roster_ids)
              if missing or extra:
                  raise AppException(
                      "DATA_CONFLICT",
                      f"成绩名单不一致：未录 {len(missing)} 人，名单外记录 {len(extra)} 人",
                      details={
                          "rosterSource": data.get("source"),
                          "rosterVersionId": str(data.get("rosterVersionId") or ""),
                          "missingStudentIds": [str(value) for value in missing],
                          "extraStudentIds": [str(value) for value in extra],
                      },
                      http_status=409,
                  )
              incomplete = [
                  row for row in records
                  if row.total_score is None and str(row.exception_flag or "NORMAL").upper() == "NORMAL"
              ]
              if incomplete:
                  raise AppException("DATA_CONFLICT", f"仍有 {len(incomplete)} 名学生成绩未录全，不可提交")

              snapshot = freeze_consumer_snapshot(
                  db,
                  "GRADE_TASK",
                  int(task.id),
                  int(task.teaching_task_id),
                  roster=data,
                  allow_replace=was_returned,
                  replace_reason="成绩任务退回后按当前正式名单重新提交" if was_returned else "",
              )
              claimed = db.query(AaGradeTask).filter(
                  AaGradeTask.id == task.id,
                  AaGradeTask.tenant_id == _core._tid(),
                  AaGradeTask.status.in_(["INPUTTING", "RETURNED"]),
              ).update({AaGradeTask.status: "SUBMITTED"}, synchronize_session=False)
              if not claimed:
                  db.rollback()
                  raise AppException("APPROVAL_VERSION_CONFLICT", "成绩任务已提交或状态已变化", http_status=409)
              task.status = "SUBMITTED"

              _name, _role, user_id = _core._op()
              ensure_workflow_enabled(db, _core._tid(), _core._WF_SUBMIT)
              instance = WorkflowInstance(
                  tenant_id=_core._tid(),
                  workflow_code=_core._WF_SUBMIT,
                  source_module="academic-affairs",
                  source_biz_type="AA_GRADE_TASK",
                  source_biz_id=task.id,
                  applicant_id=int(user_id) if str(user_id).isdigit() else 0,
                  title=f"{task.course_name or ''} 成绩审核",
                  status="RUNNING",
                  current_node="COLLEGE_REVIEW",
              )
              db.add(instance)
              db.flush()
              db.add(WorkflowTask(
                  tenant_id=_core._tid(),
                  instance_id=instance.id,
                  node_code="COLLEGE_REVIEW",
                  assignee_id=resolve_grade_task_assignee(db, "COLLEGE_REVIEW", task),
                  status="PENDING",
              ))
              task.workflow_instance_id = instance.id
              task.submitted_at = datetime.utcnow()
              _core._todo_done_grade_entry(db, task.id)
              _core._audit(
                  db,
                  "AA_GRADE_TASK",
                  task.id,
                  "SUBMIT",
                  (
                      f"students={len(roster_ids)};teachingClassId={snapshot['teachingClassId']};"
                      f"rosterVersionId={snapshot['rosterVersionId']};snapshotVersion={snapshot['snapshotVersion']}"
                  ),
              )
              return {
                  "gradeTaskId": str(task.id),
                  "status": "SUBMITTED",
                  "studentCount": len(roster_ids),
                  "rosterIdentity": snapshot,
              }


          def submit_task(task_id, user) -> dict:
              """Submit a grade task; canonical business rules live in one in-session command."""
              with _core.session() as db:
                  task = _load_task(db, int(task_id), lock=True)
                  result = _submit_task_in_session(db, task, user)
                  db.commit()
                  return result'''
          submit_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in submit_block.splitlines())

          start = grade_text.index('def submit_task(')
          end = grade_text.index('def _refresh_aggregates(', start)
          grade_text = grade_text[:start] + submit_block + '\n\n\n' + grade_text[end:]
          grade_path.write_text(grade_text, encoding='utf-8')

          # 3) Transaction guard becomes a thin live-authority adapter only.
          guard_path.write_text('''"""AA-05 live-teacher transaction adapter for grade writes.

          The canonical score-entry and submit business rules are owned only by
          ``academic_affairs_grade_service``. This adapter contributes one concern: validate and pin
          the current AaTeachingTask owner while those canonical in-session commands run in the same
          MySQL transaction. No grade state machine, roster, workflow or audit business logic is
          duplicated here.
          """
          from __future__ import annotations

          from . import academic_affairs_grade_core_service as _core
          from . import academic_affairs_grade_execution_service as _exec
          from . import academic_affairs_grade_service as _grade

          _INSTALLED = False


          def _live_teacher_user(db, task, user):
              _exec._require_live_teacher(db, task, user, lock_owner=True)
              return _exec._canonical_scope_user(task, user)


          def _enter_score_single_session(task_id: int, user, body) -> dict:
              with _core.session() as db:
                  task = _grade._load_task(db, int(task_id), lock=True)
                  result = _grade._enter_score_in_session(
                      db,
                      task,
                      user,
                      body,
                      prepare_user=_live_teacher_user,
                  )
                  db.commit()
                  return result


          def _submit_task_single_session(task_id: int, user) -> dict:
              with _core.session() as db:
                  task = _grade._load_task(db, int(task_id), lock=True)
                  result = _grade._submit_task_in_session(
                      db,
                      task,
                      user,
                      prepare_user=_live_teacher_user,
                  )
                  db.commit()
                  return result


          def install() -> None:
              global _INSTALLED
              if _INSTALLED:
                  return
              _exec.teacher_enter_score = _enter_score_single_session
              _enter_score_single_session.__grade_single_session_guard__ = True
              _exec.teacher_submit_task = _submit_task_single_session
              _submit_task_single_session.__grade_single_session_guard__ = True
              _INSTALLED = True
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          # 4) Permanent source-structure regression gate.
          test_path.write_text('''"""Prevent academic duplicate implementations from returning."""
          from __future__ import annotations

          import ast
          from pathlib import Path

          BACKEND = Path(__file__).resolve().parents[1]
          SERVICES = BACKEND / "app" / "modules" / "academic_affairs" / "services"


          def _top_level_def_counts(path: Path) -> dict[str, int]:
              tree = ast.parse(path.read_text(encoding="utf-8"))
              counts: dict[str, int] = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      counts[node.name] = counts.get(node.name, 0) + 1
              return counts


          def test_stats_legacy_has_one_definition_per_runtime_contract():
              counts = _top_level_def_counts(SERVICES / "academic_affairs_stats_service.py")
              for name in (
                  "course_selection_stats",
                  "course_selection_detail",
                  "exam_stats",
                  "exam_detail",
                  "resource_stats",
                  "resource_detail",
              ):
                  assert counts.get(name) == 1, f"{name} defined {counts.get(name, 0)} times"


          def test_grade_transaction_guard_delegates_business_to_canonical_commands():
              grade_counts = _top_level_def_counts(SERVICES / "academic_affairs_grade_service.py")
              assert grade_counts.get("_enter_score_in_session") == 1
              assert grade_counts.get("_submit_task_in_session") == 1

              source = (SERVICES / "academic_affairs_grade_execution_transaction_guard.py").read_text(
                  encoding="utf-8"
              )
              assert "_grade._enter_score_in_session" in source
              assert "_grade._submit_task_in_session" in source
              for forbidden in ("AaGradeRecord", "WorkflowInstance", "WorkflowTask", "freeze_consumer_snapshot"):
                  assert forbidden not in source
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          # Static gates before any commit.
          for path in (stats_path, grade_path, guard_path, test_path):
              ast.parse(path.read_text(encoding='utf-8'))

          counts = _top_counts = {}
          tree = ast.parse(stats_path.read_text(encoding='utf-8'))
          for node in tree.body:
              if isinstance(node, ast.FunctionDef):
                  counts[node.name] = counts.get(node.name, 0) + 1
          for name in targets:
              if counts.get(name) != 1:
                  raise SystemExit(f'{name} still has {counts.get(name, 0)} definitions')

          guard_source = guard_path.read_text(encoding='utf-8')
          for forbidden in ('AaGradeRecord', 'WorkflowInstance', 'WorkflowTask', 'freeze_consumer_snapshot'):
              if forbidden in guard_source:
                  raise SystemExit(f'grade transaction guard still owns business detail: {forbidden}')
          PY

      - name: Run narrow dedupe gates
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            backend/app/modules/academic_affairs/services/academic_affairs_stats_service.py \
            backend/app/modules/academic_affairs/services/academic_affairs_grade_service.py \
            backend/app/modules/academic_affairs/services/academic_affairs_grade_execution_transaction_guard.py \
            backend/tests/test_academic_dedupe_contract.py
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path('backend/tests/test_academic_dedupe_contract.py')
          ast.parse(p.read_text(encoding='utf-8'))
          print('dedupe source gate: PASS')
          PY
          git diff --check

      - name: Commit verified dedupe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/modules/academic_affairs/services/academic_affairs_stats_service.py \
            backend/app/modules/academic_affairs/services/academic_affairs_grade_service.py \
            backend/app/modules/academic_affairs/services/academic_affairs_grade_execution_transaction_guard.py \
            backend/tests/test_academic_dedupe_contract.py
          git rm .github/workflows/academic-dedupe-once.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'no dedupe changes produced'; exit 1; }
          git commit -m "refactor(academic): dedupe stats and grade write paths"
          git push origin HEAD:fix/academic-affairs-final-rc-20260824
