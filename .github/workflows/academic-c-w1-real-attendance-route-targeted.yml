name: Academic C W1 Real Attendance Route Targeted

on:
  push:
    branches:
      - tmp/academic-c-w1-real-write-1da9f7d2
    paths:
      - .github/workflows/academic-c-w1-real-attendance-route-targeted.yml

permissions:
  contents: write

jobs:
  route-preflight:
    name: Real route test preflight / exact 1da9f7d2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact C production head
        uses: actions/checkout@v4
        with:
          ref: 1da9f7d2d626ac09660ddc048a06ae78089444a4
          fetch-depth: 0

      - name: Fetch pinned real-route staging
        run: |
          test "$(git rev-parse HEAD)" = "1da9f7d2d626ac09660ddc048a06ae78089444a4"
          git fetch origin tmp/academic-c-w1-real-write-staging
          test "$(git rev-parse FETCH_HEAD)" = "457b23c4de41d3e1a5269fdd06e32245bacac746"
          git show FETCH_HEAD:.tmp/academic-c-w1-real-write/test_aa_attendance_real_route_w1.py > /tmp/cw1-real-route.py
          python -m py_compile /tmp/cw1-real-route.py

      - name: Enforce real-route evidence discipline
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/cw1-real-route.py').read_text(encoding='utf-8')
          forbidden = [
              'mock-login', 'monkeypatch', 'MagicMock', 'unittest.mock',
              'academic_affairs_attendance_public_service.create_session(',
              'academic_affairs_attendance_service.create_session(',
          ]
          for token in forbidden:
              assert token not in source, f'forbidden shortcut in real-route proof: {token}'
          required = [
              'TestClient(app)', 'create_access_token(',
              '/api/v1/mobile/teacher/academic/attendance',
              'formalOccurrenceReady', 'scheduleItemId', 'occurrenceEvidence',
              'AaRosterConsumerSnapshot', 'ATTENDANCE_SESSION',
          ]
          for token in required:
              assert token in source, f'missing real-route evidence element: {token}'
          assert source.count('def test_') == 1
          print('real-route preflight passed: one focused test, no auth/service shortcut')
          PY

  real-route-mysql:
    name: JWT -> FastAPI -> formal occurrence -> roster snapshot / MySQL
    needs: route-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cw1_root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcw1_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CI: 'true'
      APP_ENV: test
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:cw1_root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:cw1_root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: cw1_root
      DB_NAME: student_lifecycle_test
      JWT_SECRET: academic-c-w1-real-route-only-not-production
      JWT_SECRET_KEY: academic-c-w1-real-route-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
    steps:
      - name: Checkout exact C production head
        uses: actions/checkout@v4
        with:
          ref: 1da9f7d2d626ac09660ddc048a06ae78089444a4
          fetch-depth: 0

      - name: Fetch identical pinned route contract
        run: |
          test "$(git rev-parse HEAD)" = "1da9f7d2d626ac09660ddc048a06ae78089444a4"
          git fetch origin tmp/academic-c-w1-real-write-staging
          test "$(git rev-parse FETCH_HEAD)" = "457b23c4de41d3e1a5269fdd06e32245bacac746"
          git show FETCH_HEAD:.tmp/academic-c-w1-real-write/test_aa_attendance_real_route_w1.py > /tmp/cw1-real-route.py
          python -m py_compile /tmp/cw1-real-route.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and migrate fresh MySQL
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head

      - name: Materialize exactly one route contract
        run: |
          cp /tmp/cw1-real-route.py backend/tests/test_aa_attendance_real_route_w1.py
          python -m py_compile backend/tests/test_aa_attendance_real_route_w1.py

      - name: Run only the focused real attendance route proof
        working-directory: backend
        run: |
          pytest -q \
            tests/test_aa_attendance_real_route_w1.py::test_cw1_real_mobile_route_freezes_formal_occurrence_and_roster \
            --maxfail=1 \
            --junitxml=/tmp/cw1-real-route-junit.xml

      - name: Audit exact evidence-only scope
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          expected = ['backend/tests/test_aa_attendance_real_route_w1.py']
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z'])
          records = [record for record in raw.decode('utf-8').split('\0') if record]
          actual = sorted(record[3:] for record in records)
          print('actual=', actual)
          assert actual == expected
          PY

      - name: Atomic fast-forward C with route evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_aa_attendance_real_route_w1.py
          git diff --cached --check
          git commit -m "test(academic-c): prove real formal attendance route"
          git fetch origin agent/academic-c-teaching-execution
          test "$(git rev-parse origin/agent/academic-c-teaching-execution)" = "1da9f7d2d626ac09660ddc048a06ae78089444a4"
          git push origin HEAD:agent/academic-c-teaching-execution

      - name: Stage focused evidence
        if: always()
        run: |
          mkdir -p artifacts/cw1-real-route
          test -f /tmp/cw1-real-route-junit.xml && cp /tmp/cw1-real-route-junit.xml artifacts/cw1-real-route/junit.xml || true
          printf '%s\n' \
            'No mock-login; real JWT create_access_token -> FastAPI mobile attendance routes.' \
            'Fresh MySQL; formal ScopeHead/PUBLISHED/EFFECTIVE occurrence; versioned TeachingRoster.' \
            'Route chain: class-options -> stale scheduleItemId 409 -> create -> detail -> mark -> submit -> DB roster snapshot.' \
            > artifacts/cw1-real-route/contract.txt

      - name: Upload focused route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-c-w1-real-route-${{ github.run_id }}
          path: artifacts/cw1-real-route/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary construction branch
        if: success()
        continue-on-error: true
        run: git push origin --delete tmp/academic-c-w1-real-write-1da9f7d2
