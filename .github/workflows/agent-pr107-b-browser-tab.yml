name: Agent PR107 B browser tab isolation

on:
  push:
    branches:
      - fix/system-audit-rbac-atomicity-20260813
    paths:
      - .github/workflows/agent-pr107-b-browser-tab.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_b
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_b
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and apply B patch
        run: |
          python -m py_compile .github/agent/patch_pr107_b.py
          python .github/agent/patch_pr107_b.py
      - name: Compile changed sources and E2E syntax
        run: |
          python -m py_compile backend/app/api/v1/auth_browser.py backend/app/core/token_store.py backend/tests/test_browser_session_tab_isolation.py
          node --check frontend/src/services/http/client.js
          node --check student-portal/src/services/request.js
          node --check e2e/pages/login.page.mjs
          node --check e2e/specs/auth-browser-multi-tab-isolation.spec.mjs
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Run B backend targeted contracts
        working-directory: backend
        run: |
          pytest -q -p no:warnings \
            tests/test_browser_session_tab_isolation.py \
            tests/test_production_truth_hardening.py \
            --timeout=180 --timeout-method=signal
      - name: Run teacher and student browser-auth contracts
        run: |
          node --test frontend/tests/auth-session-race-contract.test.mjs
          node --test frontend/tests/student-portal-auth-session-race-contract.test.mjs
      - name: Commit B source and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/agent/patch_pr107_b.py .github/workflows/agent-pr107-b-browser-tab.yml
          git config user.name "penghaibin9"
          git config user.email "penghaibin9@gmail.com"
          git add \
            backend/app/api/v1/auth_browser.py \
            backend/app/core/token_store.py \
            backend/tests/test_browser_session_tab_isolation.py \
            backend/tests/test_production_truth_hardening.py \
            frontend/src/services/http/client.js \
            frontend/tests/auth-session-race-contract.test.mjs \
            frontend/tests/student-portal-auth-session-race-contract.test.mjs \
            student-portal/src/services/request.js \
            e2e/pages/login.page.mjs \
            e2e/specs/auth-browser-multi-tab-isolation.spec.mjs \
            .github/agent/patch_pr107_b.py \
            .github/workflows/agent-pr107-b-browser-tab.yml
          git diff --cached --check
          git commit -m "fix(auth): isolate browser refresh sessions per tab"
          git push origin HEAD:fix/system-audit-rbac-atomicity-20260813
