name: Agent PR107 E1 E2 message lease reclaim

on:
  push:
    branches:
      - fix/system-audit-rbac-atomicity-20260813
    paths:
      - .github/workflows/agent-pr107-e12-leases.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_e12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_e12
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply E1 E2 patch
        run: |
          python -m py_compile .github/agent/patch_pr107_e12.py
          python .github/agent/patch_pr107_e12.py
          python -m py_compile backend/app/services/message_delivery_service.py backend/app/services/message_event_outbox_service.py backend/tests/test_message_lease_reclaim.py
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Run lease reclaim and existing message contracts
        working-directory: backend
        run: |
          pytest -q -p no:warnings \
            tests/test_message_lease_reclaim.py \
            tests/test_message_delivery_async.py \
            tests/test_message_governance.py \
            tests/test_message_center_followups.py \
            --timeout=300 --timeout-method=signal
      - name: Commit E1 E2 and clean runner
        run: |
          rm .github/agent/patch_pr107_e12.py .github/workflows/agent-pr107-e12-leases.yml
          git config user.name penghaibin9
          git config user.email penghaibin9@gmail.com
          git add backend/app/services/message_delivery_service.py backend/app/services/message_event_outbox_service.py backend/tests/test_message_lease_reclaim.py .github/agent/patch_pr107_e12.py .github/workflows/agent-pr107-e12-leases.yml
          git diff --cached --check
          git commit -m "fix(message): reclaim expired delivery and outbox leases"
          git push origin HEAD:fix/system-audit-rbac-atomicity-20260813
