name: File capability inventory

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "frontend/src/**"
      - "student-portal/src/**"
      - "miniapp/src/**"
      - "docs/architecture/file-center-*.md"
      - "docs/architecture/file-capability-inventory.yaml"
      - "scripts/audit_file_capabilities.py"
      - ".github/workflows/file-capability-inventory.yml"
  push:
    branches:
      - main
      - audit/file-capability-inventory
    paths:
      - "backend/app/**"
      - "frontend/src/**"
      - "student-portal/src/**"
      - "miniapp/src/**"
      - "docs/architecture/file-center-*.md"
      - "docs/architecture/file-capability-inventory.yaml"
      - "scripts/audit_file_capabilities.py"
      - ".github/workflows/file-capability-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    name: 文件能力清单与登记门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanner dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate inventory schema
        run: python scripts/audit_file_capabilities.py --check-schema
      - name: Check full existing baseline
        run: python scripts/audit_file_capabilities.py --strict-baseline
      - name: Require registration for changed file capabilities
        if: github.event_name == 'pull_request'
        run: python scripts/audit_file_capabilities.py --check-new --base-ref "origin/${{ github.base_ref }}"
