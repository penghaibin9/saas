name: File capability inventory

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "frontend/src/**"
      - "student-portal/src/**"
      - "miniapp/src/**"
      - "docs/architecture/file-center-*.md"
      - "docs/architecture/file-capability-inventory.yaml"
      - "scripts/audit_file_capabilities.py"
      - ".github/workflows/file-capability-inventory.yml"
  push:
    branches:
      - main
      - audit/file-capability-inventory
    paths:
      - "backend/app/**"
      - "frontend/src/**"
      - "student-portal/src/**"
      - "miniapp/src/**"
      - "docs/architecture/file-center-*.md"
      - "docs/architecture/file-capability-inventory.yaml"
      - "scripts/audit_file_capabilities.py"
      - ".github/workflows/file-capability-inventory.yml"

permissions:
  contents: write

jobs:
  inventory:
    name: 文件能力清单与登记门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Stage 6 snapshot filename sanitizer
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/audit/file-capability-inventory') ||
          (github.event_name == 'pull_request' && github.head_ref == 'audit/file-capability-inventory')
        run: |
          set -euo pipefail
          git fetch origin audit/file-capability-inventory
          git checkout -B stage6-syntax-fix origin/audit/file-capability-inventory
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/modules/graduation/services/graduation_material_center_service.py')
          text = path.read_text(encoding='utf-8')
          old = 'safe_student = re.sub(r"[\\\\/:*?"<>|]+", "_", student.name or "学生")'
          new = "safe_student = re.sub(r'[\\\\/:*?\"<>|]+', '_', student.name or '学生')"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one broken sanitizer, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if ! git diff --quiet -- backend/app/modules/graduation/services/graduation_material_center_service.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- backend/app/modules/graduation/services/graduation_material_center_service.py
            test "$(git diff --cached --name-only | wc -l)" -eq 1
            git commit -m "fix(graduation): correct legacy snapshot filename sanitizer"
            git push origin HEAD:audit/file-capability-inventory
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanner dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Synchronize Stage 0 inventory
        if: github.event_name == 'push' && github.ref == 'refs/heads/audit/file-capability-inventory'
        run: |
          python scripts/audit_file_capabilities.py --sync-inventory
          if ! git diff --quiet -- docs/architecture/file-capability-inventory.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/architecture/file-capability-inventory.yaml
            git commit -m "docs(file-center-audit): synchronize exhaustive capability inventory"
            git push origin HEAD:audit/file-capability-inventory
          fi
      - name: Validate inventory schema
        run: python scripts/audit_file_capabilities.py --check-schema
      - name: Generate machine audit report
        run: |
          mkdir -p audit-artifacts
          python scripts/audit_file_capabilities.py \
            --report \
            --json-report audit-artifacts/file-capability-report.json \
            > audit-artifacts/file-capability-report.txt
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-capability-audit-report
          path: audit-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Check full existing baseline
        run: python scripts/audit_file_capabilities.py --strict-baseline
      - name: Require registration for changed file capabilities
        if: github.event_name == 'pull_request'
        run: python scripts/audit_file_capabilities.py --check-new --base-ref "origin/${{ github.base_ref }}"
