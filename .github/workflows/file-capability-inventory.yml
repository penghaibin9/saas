name: File capability inventory

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "frontend/src/**"
      - "student-portal/src/**"
      - "miniapp/src/**"
      - "docs/architecture/file-center-*.md"
      - "docs/architecture/file-capability-inventory.yaml"
      - "docs/architecture/file-capability-inventory.d/**"
      - "scripts/audit_file_capabilities.py"
      - "scripts/check_new_file_capabilities.py"
      - ".github/workflows/file-capability-inventory.yml"
  push:
    branches:
      - main
      - audit/file-capability-inventory
    paths:
      - "backend/app/**"
      - "frontend/src/**"
      - "student-portal/src/**"
      - "miniapp/src/**"
      - "docs/architecture/file-center-*.md"
      - "docs/architecture/file-capability-inventory.yaml"
      - "docs/architecture/file-capability-inventory.d/**"
      - "scripts/audit_file_capabilities.py"
      - "scripts/check_new_file_capabilities.py"
      - ".github/workflows/file-capability-inventory.yml"

permissions:
  contents: write

jobs:
  tenant-scope-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/student-affairs-flow-continuity-20260828'
    name: 学工处分申诉租户查询精准修复
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/student-affairs-flow-continuity-20260828
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replace the single shifted bare Session.get
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/services/affairs_discipline_service.py')
          text = p.read_text(encoding='utf-8')
          old = '        s = db.get(StudentProfile, int(a.student_id)) if a.student_id else None\n'
          new = ('        s = db.scalars(select(StudentProfile).where(\n'
                 '            StudentProfile.id == int(a.student_id), StudentProfile.tenant_id == _tid(),\n'
                 '            StudentProfile.is_deleted.is_(False)\n'
                 '        )).first() if a.student_id else None\n')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target lookup, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          python -m py_compile backend/app/services/affairs_discipline_service.py
          python backend/scripts/audit_tenant_queries.py --gate
      - name: Restore workflow files and publish only the verified product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "student-affairs-flow-bot"
          git config user.email "student-affairs-flow-bot@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/file-capability-inventory.yml
          if [ -f .github/workflows/sa-flow-tenant-get-hotfix.yml ]; then
            git rm .github/workflows/sa-flow-tenant-get-hotfix.yml
          fi
          git add -- backend/app/services/affairs_discipline_service.py .github/workflows/file-capability-inventory.yml
          git diff --cached --check
          git commit -m "fix(student-affairs): keep discipline appeal lookup tenant-scoped"
          git push origin HEAD:fix/student-affairs-flow-continuity-20260828

  inventory:
    name: 文件能力清单与登记门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanner dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate inventory schema
        run: python scripts/audit_file_capabilities.py --check-schema
      - name: Generate machine audit report
        run: |
          mkdir -p audit-artifacts
          python scripts/audit_file_capabilities.py \
            --report \
            --json-report audit-artifacts/file-capability-report.json \
            > audit-artifacts/file-capability-report.txt
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-capability-audit-report
          path: audit-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Check full existing baseline
        run: python scripts/audit_file_capabilities.py --strict-baseline
      - name: Require registration for changed production capabilities
        if: github.event_name == 'pull_request'
        run: python scripts/check_new_file_capabilities.py --base-ref "origin/${{ github.base_ref }}"
