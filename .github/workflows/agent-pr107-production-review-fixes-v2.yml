name: Agent PR107 production review fixes v2

on:
  push:
    branches:
      - fix/system-audit-rbac-atomicity-20260813
    paths:
      - .github/workflows/agent-pr107-production-review-fixes-v2.yml

permissions:
  contents: write

jobs:
  review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_review2
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_review2
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_review2
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Apply precise production review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_one(
              'backend/app/services/role_assignment_service.py',
              '            _record_expiry_audit(db, tid, touched, source="READ_LIST_ASSIGNMENTS")\n',
              '            _audit_expiry_in_session(db, tid, touched, source="READ_LIST_ASSIGNMENTS")\n',
          )

          old_revoke = '''    from app.models import UserRole\n\n    if row.status != VALIDITY_ACTIVE:\n        raise AppException("VALIDATION_ERROR", "该授权当前不是生效状态，不能重复回收")\n    row.status = VALIDITY_REVOKED\n    row.revoked_at = _now()\n    row.revoked_by = _actor_id(actor)\n    row.revoke_reason = reason\n    row.transferred_to_user_id = transferred_to_user_id\n    row.version = int(row.version or 0) + 1\n    link = db.get(UserRole, int(row.user_role_id))\n'''
          new_revoke = '''    from app.core.tenant_scoped import tenant_get\n    from app.models import UserRole\n\n    if row.status != VALIDITY_ACTIVE:\n        raise AppException("VALIDATION_ERROR", "该授权当前不是生效状态，不能重复回收")\n    row.status = VALIDITY_REVOKED\n    row.revoked_at = _now()\n    row.revoked_by = _actor_id(actor)\n    row.revoke_reason = reason\n    row.transferred_to_user_id = transferred_to_user_id\n    row.version = int(row.version or 0) + 1\n    link = tenant_get(db, UserRole, int(row.user_role_id), tenant_id=int(row.tenant_id))\n'''
          replace_one('backend/app/services/role_assignment_service.py', old_revoke, new_revoke)

          replace_one(
              'backend/app/services/audit_log.py',
              '    "ROLE_ASSIGNMENT_GRANH", "ROLE_ASSIGNMENT_REVOKE", "ROLE_ASSIGNMENT_TRANSFER",\n',
              '    "ROLE_ASSIGNMENT_REVOKE", "ROLE_ASSIGNMENT_TRANSFER",\n',
          )

          replace_one(
              'backend/app/services/message_ops_service.py',
              '            MessageCampaign.is_deleted.is_(False),\n        ))\n        if not camp:\n',
              '            MessageCampaign.is_deleted.is_(False),\n        ).with_for_update())\n        if not camp:\n',
          )

          channel_path = 'backend/app/services/message_channel_delivery_service.py'
          replace_one(channel_path, 'import logging\n', 'import logging\nimport re\n')
          replace_one(
              channel_path,
              '_LEASE_SECONDS = 120\n',
              '_LEASE_SECONDS = 120\n_CLAIM_BATCH_SIZE = 5\n_PHONE_LIKE_RE = re.compile(r"(?<!\\d)(?:(?:\\+?86)[ -]?)?1\\d{10}(?!\\d)")\n_LONG_NUMBER_RE = re.compile(r"(?<!\\d)\\d{7,20}(?!\\d)")\n',
          )
          replace_one(
              channel_path,
              "def _safe_message(value) -> str | None:\n    text=str(value or '').strip()\n    return text[:200] or None\n",
              "def _safe_message(value) -> str | None:\n    text=str(value or '').strip()\n    text=_PHONE_LIKE_RE.sub('[REDACTED_PHONE]', text)\n    text=_LONG_NUMBER_RE.sub('[REDACTED_NUMBER]', text)\n    return text[:200] or None\n",
          )
          replace_one(
              channel_path,
              "        row=db.get(MessageChannelDelivery,row_id); now=_now()\n",
              "        row=db.scalar(select(MessageChannelDelivery).where(\n            MessageChannelDelivery.id==row_id, MessageChannelDelivery.tenant_id==_tid(),\n            MessageChannelDelivery.is_deleted.is_(False),\n        )); now=_now()\n",
          )
          replace_one(
              channel_path,
              "                row=db.get(MessageChannelDelivery,row_id)\n                if not row or row.locked_by!=worker_id: continue\n",
              "                row=db.scalar(select(MessageChannelDelivery).where(\n                    MessageChannelDelivery.id==row_id, MessageChannelDelivery.tenant_id==_tid(),\n                    MessageChannelDelivery.is_deleted.is_(False),\n                ))\n                if not row or row.locked_by!=worker_id: continue\n",
          )
          old_worker = '''def claim_and_process_channel_deliveries(*, limit: int=100, worker_id: str='scheduler-channel', lease_seconds: int=_LEASE_SECONDS) -> int:\n    done=0\n    for row_id in _claim(limit,worker_id,lease_seconds):\n        try:\n            if _process_one(row_id,worker_id): done+=1\n        except Exception as exc:  # noqa: BLE001\n            log.exception('channel delivery failed id=%s',row_id)\n            from app.models import MessageChannelDelivery\n            with session() as db:\n                row=db.scalar(select(MessageChannelDelivery).where(\n                    MessageChannelDelivery.id==row_id, MessageChannelDelivery.tenant_id==_tid(),\n                    MessageChannelDelivery.is_deleted.is_(False),\n                ))\n                if not row or row.locked_by!=worker_id: continue\n                attempt=int(row.attempt_count or 1); row.last_error_code=type(exc).__name__[:80]\n                row.last_error_message_safe='worker internal error'; row.locked_by=None; row.locked_at=None; row.lease_expires_at=None\n                if attempt>=_MAX_ATTEMPTS: row.status='DEAD'\n                else: row.status='RETRY_WAIT'; row.next_retry_at=_now()+timedelta(seconds=_backoff(attempt))\n                db.commit()\n    return done\n'''
          new_worker = '''def claim_and_process_channel_deliveries(*, limit: int=100, worker_id: str='scheduler-channel', lease_seconds: int=_LEASE_SECONDS) -> int:\n    done=0\n    attempted=0\n    while attempted < max(int(limit), 0):\n        batch_limit=min(_CLAIM_BATCH_SIZE, int(limit)-attempted)\n        claimed=_claim(batch_limit,worker_id,lease_seconds)\n        if not claimed:\n            break\n        attempted += len(claimed)\n        for row_id in claimed:\n            try:\n                if _process_one(row_id,worker_id): done+=1\n            except Exception as exc:  # noqa: BLE001\n                log.exception('channel delivery failed id=%s',row_id)\n                from app.models import MessageChannelDelivery\n                with session() as db:\n                    row=db.scalar(select(MessageChannelDelivery).where(\n                        MessageChannelDelivery.id==row_id, MessageChannelDelivery.tenant_id==_tid(),\n                        MessageChannelDelivery.is_deleted.is_(False),\n                    ))\n                    if not row or row.locked_by!=worker_id:\n                        continue\n                    attempt=int(row.attempt_count or 1); row.last_error_code=type(exc).__name__[:80]\n                    row.last_error_message_safe='worker internal error'; row.locked_by=None; row.locked_at=None; row.lease_expires_at=None\n                    if attempt>=_MAX_ATTEMPTS: row.status='DEAD'\n                    else: row.status='RETRY_WAIT'; row.next_retry_at=_now()+timedelta(seconds=_backoff(attempt))\n                    db.commit()\n    return done\n'''
          replace_one(channel_path, old_worker, new_worker)

          replace_one(
              'backend/app/models/message.py',
              '        Index("ix_msg_channel_delivery_claim", "tenant_id", "status", "next_retry_at", "id"),\n        Index("ix_msg_channel_delivery_campaign", "tenant_id", "campaign_id", "channel", "status"),\n',
              '        Index("ix_msg_channel_delivery_claim", "tenant_id", "status", "next_retry_at", "id"),\n        Index("ix_msg_channel_delivery_lease", "tenant_id", "status", "lease_expires_at", "id"),\n        Index("ix_msg_channel_delivery_campaign", "tenant_id", "campaign_id", "channel", "status"),\n',
          )
          replace_one(
              'backend/alembic/versions/msg_channel_delivery_20260813.py',
              '    op.create_index("ix_msg_channel_delivery_claim","t_message_channel_delivery",["tenant_id","status","next_retry_at","id"])\n    op.create_index("ix_msg_channel_delivery_campaign","t_message_channel_delivery",["tenant_id","campaign_id","channel","status"])\n',
              '    op.create_index("ix_msg_channel_delivery_claim","t_message_channel_delivery",["tenant_id","status","next_retry_at","id"])\n    op.create_index("ix_msg_channel_delivery_lease","t_message_channel_delivery",["tenant_id","status","lease_expires_at","id"])\n    op.create_index("ix_msg_channel_delivery_campaign","t_message_channel_delivery",["tenant_id","campaign_id","channel","status"])\n',
          )

          role_test = Path('backend/tests/test_role_assignment_validity.py')
          role_text = role_test.read_text(encoding='utf-8')
          if 'def test_list_assignments_expiry_writes_atomic_audit(db_mode):' in role_text:
              raise SystemExit('role expiry review regression already exists')
          role_text += '''\n\n\ndef test_list_assignments_expiry_writes_atomic_audit(db_mode):\n    from app.models import SecurityAuditLog\n    from app.models.role_assignment import RoleAssignmentValidity\n    from sqlalchemy import select\n\n    _make_role("COUNSELOR")\n    user_id = _make_user("ras_list_expire_review")\n    granted = _grant(user_id, "COUNSELOR", reason="列表读取到期回收复审", expires_at=(datetime.now() + timedelta(days=1)).strftime("%Y-%m-%d %H:%M:%S"), tenant_id=MAIN_TENANT_ID)\n    assignment_id = int(granted["assignmentId"])\n    with _session() as db:\n        row = db.get(RoleAssignmentValidity, assignment_id)\n        row.expires_at = datetime.now().replace(microsecond=0) - timedelta(minutes=1)\n        db.commit()\n    listed = ras.list_assignments(tenant_id=MAIN_TENANT_ID)\n    expired = [item for item in listed["list"] if item.get("assignmentId") == str(assignment_id)]\n    assert expired and expired[0]["status"] == "EXPIRED"\n    assert _user_role_status(user_id, "COUNSELOR") == "EXPIRED"\n    with _session() as db:\n        audit = db.scalars(select(SecurityAuditLog).where(SecurityAuditLog.tenant_id == MAIN_TENANT_ID, SecurityAuditLog.action == "ROLE_ASSIGNMENT_EXPIRE").order_by(SecurityAuditLog.id.desc())).first()\n        assert audit is not None\n        assert (audit.detail_json or {}).get("source") == "READ_LIST_ASSIGNMENTS"\n'''
          role_test.write_text(role_text, encoding='utf-8')

          msg_test = Path('backend/tests/test_message_channel_delivery.py')
          msg_text = msg_test.read_text(encoding='utf-8')
          if 'def test_concurrent_campaign_channel_enqueue_is_idempotent(db_mode):' in msg_text:
              raise SystemExit('concurrent enqueue review regression already exists')
          msg_text += '''\n\n\ndef test_concurrent_campaign_channel_enqueue_is_idempotent(db_mode):\n    from concurrent.futures import ThreadPoolExecutor\n    from app.core.context import set_tenant\n    from app.db.session import get_sessionmaker\n    from app.models import MessageCampaign, MessageChannelDelivery, Tenant, UnifiedMessage\n    from app.services import message_ops_service\n    tid=1000000000000011015; set_tenant({'tenantId':str(tid)}); db=get_sessionmaker()()\n    try:\n        if not db.get(Tenant,tid): db.add(Tenant(id=tid,tenant_code='channel-race',school_name='channel-race',short_name='race',deploy_mode='SAAS',db_mode='SHARED',status='ACTIVE'))\n        camp=MessageCampaign(tenant_id=tid,title='race',content_plain='x',category='ANNOUNCEMENT',priority='NORMAL',status='PUBLISHED',source_kind='HUMAN',content_mode='SHARED',sender_user_id=7,publish_mode='IMMEDIATE',created_by=7); db.add(camp); db.flush(); campaign_id=int(camp.id)\n        db.add_all([UnifiedMessage(tenant_id=tid,receiver_id=i,receiver_user_id=i,receiver_context_key='GLOBAL',campaign_id=campaign_id,title='x',status='UNREAD',created_by=7) for i in range(1,101)]); db.commit()\n    finally: db.close(); set_tenant(None)\n    actor=_actor(tid,8,'SCHOOL_ADMIN')\n    def run_once():\n        set_tenant({'tenantId':str(tid)})\n        try: return message_ops_service.enqueue_channel_delivery(actor,str(campaign_id),channel='SMS')\n        finally: set_tenant(None)\n    with ThreadPoolExecutor(max_workers=2) as pool: results=list(pool.map(lambda _:run_once(),range(2)))\n    assert sorted(item['newQueuedCount'] for item in results)==[0,100]\n    assert sorted(item['existingCount'] for item in results)==[0,100]\n    set_tenant({'tenantId':str(tid)}); db=get_sessionmaker()()\n    try: assert db.query(MessageChannelDelivery).filter_by(tenant_id=tid,campaign_id=campaign_id,channel='SMS').count()==100\n    finally: db.close(); set_tenant(None)\n\n\ndef test_channel_delivery_has_retry_and_lease_claim_indexes():\n    from app.models import MessageChannelDelivery\n    names={idx.name for idx in MessageChannelDelivery.__table__.indexes}\n    assert 'ix_msg_channel_delivery_claim' in names and 'ix_msg_channel_delivery_lease' in names\n\n\ndef test_safe_provider_error_redacts_phone_and_long_numbers():\n    from app.services import message_channel_delivery_service as svc\n    value=svc._safe_message('provider rejected +86 13800138000 request 123456789012345')\n    assert '13800138000' not in value and '123456789012345' not in value\n    assert '[REDACTED_PHONE]' in value and '[REDACTED_NUMBER]' in value\n\n\ndef test_channel_worker_claims_fresh_small_batches(monkeypatch):\n    from app.services import message_channel_delivery_service as svc\n    calls=[]; batches=[[1,2,3,4,5],[6]]\n    def fake_claim(limit,worker_id,lease_seconds):\n        calls.append(limit); return batches.pop(0) if batches else []\n    monkeypatch.setattr(svc,'_claim',fake_claim)\n    monkeypatch.setattr(svc,'_process_one',lambda row_id,worker_id: True)\n    assert svc.claim_and_process_channel_deliveries(limit=6,worker_id='batch-review')==6\n    assert calls==[5,1]\n'''
          msg_test.write_text(msg_text, encoding='utf-8')
          PY
          python -m py_compile backend/app/services/role_assignment_service.py backend/app/services/audit_log.py backend/app/services/message_ops_service.py backend/app/services/message_channel_delivery_service.py backend/app/models/message.py backend/alembic/versions/msg_channel_delivery_20260813.py backend/tests/test_role_assignment_validity.py backend/tests/test_message_channel_delivery.py

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Fresh MySQL single-head migration
        working-directory: backend
        run: |
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head

      - name: Tenant isolation ratchet
        working-directory: backend
        run: python scripts/audit_tenant_queries.py --gate

      - name: Run production review regressions
        working-directory: backend
        run: |
          pytest -q -p no:warnings tests/test_role_assignment_validity.py tests/test_role_assignment_privilege_boundary.py tests/test_critical_audit_atomicity.py tests/test_message_channel_delivery.py tests/test_message_lease_reclaim.py tests/test_scheduler_tenant_effective_state.py tests/test_browser_session_tab_isolation.py --timeout=300 --timeout-method=signal

      - name: Real 20K recipient durable enqueue
        working-directory: backend
        run: |
          python - <<'PY'
          from app.core.context import set_tenant
          from app.db.session import get_sessionmaker
          from app.models import MessageCampaign, MessageChannelDelivery, Tenant, UnifiedMessage
          from app.services.message_channel_delivery_service import enqueue_campaign_channel_deliveries_in_db
          tid=1000000000000011999; set_tenant({'tenantId':str(tid)}); db=get_sessionmaker()()
          try:
              db.add(Tenant(id=tid,tenant_code='channel-20k-review',school_name='20K消息生产复审',short_name='20k',deploy_mode='SAAS',db_mode='SHARED',status='ACTIVE'))
              camp=MessageCampaign(tenant_id=tid,title='20k review',content_plain='x',category='ANNOUNCEMENT',priority='NORMAL',status='PUBLISHED',source_kind='HUMAN',content_mode='SHARED',sender_user_id=1,publish_mode='IMMEDIATE',created_by=1); db.add(camp); db.flush()
              for start in range(1,20001,2000):
                  db.add_all([UnifiedMessage(tenant_id=tid,receiver_id=i,receiver_user_id=i,receiver_context_key='GLOBAL',campaign_id=camp.id,title='x',status='UNREAD',created_by=1) for i in range(start,min(start+2000,20001))]); db.flush()
              first=enqueue_campaign_channel_deliveries_in_db(db,camp,channel='SMS',created_by=1); db.commit()
              second=enqueue_campaign_channel_deliveries_in_db(db,camp,channel='SMS',created_by=1); db.commit()
              count=db.query(MessageChannelDelivery).filter_by(tenant_id=tid,campaign_id=camp.id,channel='SMS').count()
              assert first['recipientCount']==20000 and first['newQueuedCount']==20000, first
              assert second['newQueuedCount']==0 and second['existingCount']==20000, second
              assert count==20000, count
              print({'recipientCount':20000,'storedCount':count,'secondNew':second['newQueuedCount']})
          finally: db.close(); set_tenant(None)
          PY

      - name: Static production review guards
        run: |
          python - <<'PY'
          from pathlib import Path
          role=Path('backend/app/services/role_assignment_service.py').read_text(encoding='utf-8')
          audit=Path('backend/app/services/audit_log.py').read_text(encoding='utf-8')
          channel=Path('backend/app/services/message_channel_delivery_service.py').read_text(encoding='utf-8')
          ops=Path('backend/app/services/message_ops_service.py').read_text(encoding='utf-8')
          assert '_record_expiry_audit' not in role
          assert 'ROLE_ASSIGNMENT_GRANH' not in audit
          assert '.with_for_update()' in ops
          assert 'allow_legacy_plaintext=False' in channel
          assert '_CLAIM_BATCH_SIZE = 5' in channel
          assert '[REDACTED_PHONE]' in channel
          PY

      - name: Commit reviewed fixes and clean runners
        run: |
          rm .github/workflows/agent-pr107-production-review-fixes.yml .github/workflows/agent-pr107-production-review-fixes-v2.yml
          git config user.name penghaibin9
          git config user.email penghaibin9@gmail.com
          git add backend/app/services/role_assignment_service.py backend/app/services/audit_log.py backend/app/services/message_ops_service.py backend/app/services/message_channel_delivery_service.py backend/app/models/message.py backend/alembic/versions/msg_channel_delivery_20260813.py backend/tests/test_role_assignment_validity.py backend/tests/test_message_channel_delivery.py .github/workflows/agent-pr107-production-review-fixes.yml .github/workflows/agent-pr107-production-review-fixes-v2.yml
          git diff --cached --check
          git commit -m "fix(review): close PR107 production edge cases"
          git push origin HEAD:fix/system-audit-rbac-atomicity-20260813
