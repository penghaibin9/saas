name: File storage governance

on:
  pull_request:
    paths:
      - 'backend/alembic/versions/0153_file_storage_governance.py'
      - 'backend/app/api/v1/file.py'
      - 'backend/app/api/v1/file_governance.py'
      - 'backend/app/api/v1/files.py'
      - 'backend/app/models/file.py'
      - 'backend/app/services/file_storage_governance_service.py'
      - 'backend/app/services/storage/__init__.py'
      - 'backend/app/services/storage/governed.py'
      - 'backend/app/workers/file_governance_worker.py'
      - 'backend/tests/test_file_storage_governance.py'
      - 'frontend/src/modules/system/api/fileStorageGovernance.api.js'
      - 'frontend/src/modules/system/views/SystemFileStorageGovernanceView.vue'
      - 'frontend/src/modules/system/system.routes.js'
      - 'frontend/src/modules/system/systemManagementCatalog.js'
      - 'docs/architecture/file-capability-inventory.d/09-storage-governance.yaml'
      - '.github/workflows/file-storage-governance.yml'
  push:
    branches: [audit/file-capability-inventory]
    paths:
      - 'backend/alembic/versions/0153_file_storage_governance.py'
      - 'backend/app/api/v1/file.py'
      - 'backend/app/api/v1/file_governance.py'
      - 'backend/app/api/v1/files.py'
      - 'backend/app/models/file.py'
      - 'backend/app/services/file_storage_governance_service.py'
      - 'backend/app/services/storage/__init__.py'
      - 'backend/app/services/storage/governed.py'
      - 'backend/app/workers/file_governance_worker.py'
      - 'backend/tests/test_file_storage_governance.py'
      - 'frontend/src/modules/system/api/fileStorageGovernance.api.js'
      - 'frontend/src/modules/system/views/SystemFileStorageGovernanceView.vue'
      - 'frontend/src/modules/system/system.routes.js'
      - 'frontend/src/modules/system/systemManagementCatalog.js'
      - 'docs/architecture/file-capability-inventory.d/09-storage-governance.yaml'
      - '.github/workflows/file-storage-governance.yml'

concurrency:
  group: file-storage-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-governance:
    name: MySQL 配额 + 保留 + 法律保留 + 清理 + 管理 PC
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      APP_ENV: test
      SECRET_KEY: stage9-storage-governance-ci-secret
      FILE_SCAN_ENABLED: 'false'
      FILE_SCAN_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify one Alembic head and upgrade real MySQL
        working-directory: backend
        run: |
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          from app.core.config import settings
          engine = create_engine(str(settings.DATABASE_URL))
          inspector = inspect(engine)
          assert inspector.has_table('t_file_retention_policy')
          assert inspector.has_table('t_tenant_storage_quota')
          cols = {c['name'] for c in inspector.get_columns('t_file_object')}
          assert {'retention_until','legal_hold','deleted_at'} <= cols
          PY
      - name: Compile governance services
        working-directory: backend
        run: |
          python -m py_compile \
            app/api/v1/file.py app/api/v1/file_governance.py app/api/v1/files.py \
            app/services/file_storage_governance_service.py \
            app/services/storage/__init__.py app/services/storage/governed.py \
            app/workers/file_governance_worker.py
      - name: Real MySQL governance tests
        working-directory: backend
        run: pytest tests/test_file_storage_governance.py tests/test_file_center_cos_production.py -q -p no:warnings
      - name: Governance worker dry-run
        working-directory: backend
        run: python -m app.workers.file_governance_worker --once --tenant-id 90992 --dry-run
      - name: Teacher PC lint and production build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Freeze safety invariants
        run: |
          grep -q 'legal_hold' backend/app/services/file_storage_governance_service.py
          grep -q '_has_active_reference' backend/app/services/file_storage_governance_service.py
          grep -q 'assert_quota_available' backend/app/services/storage/governed.py
          grep -q 'assert_quota_available(body.sizeBytes' backend/app/api/v1/file.py
          grep -q 'router.include_router(file_governance.router)' backend/app/api/v1/files.py
          grep -q 'SystemFileStorageGovernanceView' frontend/src/modules/system/system.routes.js
          grep -q '平台默认不查看文件内容' frontend/src/modules/system/views/SystemFileStorageGovernanceView.vue
