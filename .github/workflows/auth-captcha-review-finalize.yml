name: Auth Captcha Finalize Reviewed Source

on:
  push:
    branches: ["feat/adaptive-login-captcha-20260805"]
    paths:
      - ".github/workflows/auth-captcha-review-finalize.yml"

permissions:
  contents: write

jobs:
  finalize-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-login-captcha-20260805

      - name: Apply the exact source patch already verified by final review
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/auth-captcha-review-fix.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          script_lines = []
          for line in lines[start + 1:end]:
              script_lines.append(line[10:] if line.startswith('          ') else line)
          exec(compile('\n'.join(script_lines) + '\n', str(workflow), 'exec'), {'__name__': '__main__'})

          e2e = Path('scripts/e2e/auth_login_redis_click.py')
          text = e2e.read_text(encoding='utf-8')
          needle = '            captcha_input.fill(captcha_code)\n'
          replacement = (
              '            # 前两次错误密码产生的 401 属于预期安全行为；从此处开始只审计成功登录后的错误。\n'
              '            browser_errors.clear()\n'
              '            api_failures.clear()\n'
              '            captcha_input.fill(captcha_code)\n'
          )
          if text.count(needle) != 1:
              raise SystemExit(f'E2E success-boundary marker mismatch: {text.count(needle)}')
          e2e.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          fail_closed_test = Path('backend/tests/test_auth_captcha_redis_fail_closed.py')
          fail_closed_test.write_text(
              fail_closed_test.read_text(encoding='utf-8').rstrip() + '\n',
              encoding='utf-8',
          )
          PY

          # The review patch also updates the permanent workflow trigger. A GitHub
          # Actions token cannot push workflow changes, so the connector applies that
          # file separately after this source commit.
          git restore .github/workflows/auth-login-redis-e2e.yml
          git diff --check

      - name: Commit only the reviewed application and test source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/services/auth_challenge_service.py \
            backend/app/api/v1/auth.py \
            backend/app/services/auth_service_db.py \
            backend/tests/test_auth_challenge_service.py \
            backend/tests/test_auth_captcha_redis_fail_closed.py \
            miniapp/src/components/login/MiniLoginAuthPanel.vue \
            scripts/e2e/auth_login_redis_click.py
          git diff --cached --check
          git commit -m "fix(auth): close captcha review gaps"
          git push origin HEAD:feat/adaptive-login-captcha-20260805
