name: PR39 exact revision-contract test fix

on:
  push:
    branches:
      - audit/student-affairs-p0-p1-closeout-20260803
    paths:
      - .github/workflows/pr39-fix-revision-contract.yml

permissions:
  contents: write

jobs:
  patch-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/student-affairs-p0-p1-closeout-20260803
          fetch-depth: 0

      - name: Update only stale revision assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_student_affairs_p0_p1_closeout.py')
          text = path.read_text(encoding='utf-8')
          old = '20260804_affairs_second_review_merge'
          new = '20260804_affairs_r2_merge'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 stale revision assertions, found {count}')
          text = text.replace(old, new)
          if text.count(new) < 2 or old in text:
              raise SystemExit('revision assertion replacement incomplete')
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile backend/tests/test_student_affairs_p0_p1_closeout.py

      - name: Commit exact test fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr39-fix-revision-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_student_affairs_p0_p1_closeout.py .github/workflows/pr39-fix-revision-contract.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "test(affairs): align migration revision assertions"
          git push origin HEAD:audit/student-affairs-p0-p1-closeout-20260803
