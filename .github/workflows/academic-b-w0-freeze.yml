name: Academic B W0 Authority Freeze

on:
  workflow_dispatch:
  push:
    branches: [agent/academic-b-schedule-selection]
    paths:
      - 'backend/app/modules/academic_affairs/services/academic_affairs_schedule_*.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_teaching_roster_*.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_selection_*.py'
      - 'backend/tests/test_aa_schedule_active_truth.py'
      - 'backend/tests/test_aa_teaching_roster_unification.py'
      - 'backend/tests/test_aa_selection_lock_scaling.py'
      - 'backend/tests/test_aa_selection_rounds.py'
      - 'backend/tests/test_aa_d6_selection_truth_contract.py'
      - '.github/workflows/academic-b-w0-freeze.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/modules/academic_affairs/services/academic_affairs_schedule_*.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_teaching_roster_*.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_selection_*.py'
      - 'backend/tests/test_aa_schedule_active_truth.py'
      - 'backend/tests/test_aa_teaching_roster_unification.py'
      - 'backend/tests/test_aa_selection_lock_scaling.py'
      - 'backend/tests/test_aa_selection_rounds.py'
      - 'backend/tests/test_aa_d6_selection_truth_contract.py'
      - '.github/workflows/academic-b-w0-freeze.yml'

permissions:
  contents: read

concurrency:
  group: academic-b-w0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  DB_ENABLED: 'true'
  MOCK_LOGIN_ENABLED: 'true'
  JWT_SECRET: academic-b-w0-authority-freeze-secret-at-least-32-bytes
  DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_w0?charset=utf8mb4
  TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_w0?charset=utf8mb4

jobs:
  mysql-freeze:
    name: ScopeHead / Roster / Lock / Lottery-FCFS truth
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: academic_b_w0
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Fresh MySQL schema truth
        working-directory: backend
        run: |
          set -euo pipefail
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
          alembic current
      - name: W0 KEEP regression
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q -p no:warnings \
            tests/test_aa_schedule_active_truth.py \
            tests/test_aa_teaching_roster_unification.py \
            tests/test_aa_selection_lock_scaling.py \
            tests/test_aa_selection_rounds.py \
            tests/test_aa_d6_selection_truth_contract.py \
            --maxfail=1
