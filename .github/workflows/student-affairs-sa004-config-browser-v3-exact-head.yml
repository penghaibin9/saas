name: Student Affairs SA-004 Config Browser V3 exact head

on:
  workflow_dispatch:
  push:
    branches:
      - audit/student-affairs-browser-runner-20260823
    paths:
      - 'audit-tests/student-affairs-scholarship-config-browser-v3.spec.mjs'
      - '.github/workflows/student-affairs-sa004-config-browser-v3-exact-head.yml'

permissions:
  contents: read

concurrency:
  group: student-affairs-sa004-config-browser-v3
  cancel-in-progress: false

jobs:
  scholarship-config-browser:
    name: SA-004 config / Staff PC / isolated MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/13
      REDIS_KEY_PREFIX: student-affairs-sa004-config-v3
      JWT_SECRET: student-affairs-sa004-config-v3-only
      JWT_SECRET_KEY: student-affairs-sa004-config-v3-only
      PYTHONPATH: .
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_TARGET_SHA: 6519b309243750caed54eb59b942629fc743203a

    steps:
      - name: Checkout immutable audit runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: runner
          fetch-depth: 1

      - name: Checkout immutable application exact head
        uses: actions/checkout@v4
        with:
          ref: 6519b309243750caed54eb59b942629fc743203a
          path: app
          fetch-depth: 0

      - name: Assert tested application exact head
        run: |
          set -euo pipefail
          ACTUAL="$(git -C app rev-parse HEAD)"
          RUNNER="$(git -C runner rev-parse HEAD)"
          echo "tested_app_head=$ACTUAL"
          echo "audit_runner_head=$RUNNER"
          test "$ACTUAL" = "$E2E_TARGET_SHA"
          test -z "$(git -C app status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/e2e/package-lock.json

      - name: Install backend and migrate isolated MySQL
        working-directory: app/backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend
        run: |
          mkdir -p app/e2e/runtime-logs
          cd app/backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Bootstrap canonical student-affairs accounts and relations
        working-directory: app/backend
        run: python scripts/e2e_bootstrap_student_affairs_accounts.py

      - name: Start real Staff PC
        run: |
          cd app/frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/frontend.log
          exit 1

      - name: Install Chromium and inject config Browser First spec
        run: |
          cp runner/audit-tests/student-affairs-scholarship-config-browser-v3.spec.mjs app/e2e/specs/student-affairs-scholarship-config-browser-v3.spec.mjs
          cd app/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Run real Staff PC project and batch creation
        working-directory: app/e2e
        run: npx playwright test specs/student-affairs-scholarship-config-browser-v3.spec.mjs

      - name: Verify config server truth in MySQL
        working-directory: app/backend
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pymysql

          evidence = json.loads(Path('../e2e/student-affairs-scholarship-config-v3-evidence.json').read_text(encoding='utf-8'))
          project_id = int(evidence['projectId'])
          batch_id = int(evidence['batchId'])
          conn = pymysql.connect(
              host='127.0.0.1', port=3306, user='root', password='e2e_root',
              database='student_lifecycle_e2e', charset='utf8mb4'
          )
          with conn.cursor() as cur:
              cur.execute('SELECT project_type, project_name, amount, quota, status FROM t_affairs_funding_project WHERE id=%s', (project_id,))
              project = cur.fetchone()
              print('[PROJECT]', project)
              assert project, project_id
              assert project[0] == 'SCHOLARSHIP', project
              assert project[1] == evidence['projectName'], project
              assert str(project[2]) == '3000.00', project
              assert int(project[3]) == 1, project
              assert project[4] == 'ENABLED', project

              cur.execute('SELECT project_id, project_type, year_code, publicity_days, quota, status FROM t_affairs_funding_batch WHERE id=%s', (batch_id,))
              batch = cur.fetchone()
              print('[BATCH]', batch)
              assert batch, batch_id
              assert int(batch[0]) == project_id, batch
              assert batch[1] == 'SCHOLARSHIP', batch
              assert batch[2] == evidence['schoolYear'], batch
              assert int(batch[3]) == 1, batch
              assert int(batch[4]) == 1, batch
              assert batch[5] == 'OPEN', batch
          conn.close()
          assert evidence['exactHead'] == os.environ['E2E_TARGET_SHA'], evidence
          assert evidence['result'] == 'REAL_PASS', evidence
          print('[RESULT] REAL_PASS SA-004 configuration Browser First')
          PY

      - name: Reassert immutable application source
        if: always()
        run: |
          echo "tested_app_head=$(git -C app rev-parse HEAD)"
          echo "audit_runner_head=$(git -C runner rev-parse HEAD)"
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"

      - name: Show runtime logs on failure
        if: failure()
        run: |
          for f in app/e2e/runtime-logs/*.log; do echo "===== $f ====="; tail -n 300 "$f" || true; done

      - name: Upload SA-004 config V3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-affairs-sa004-config-v3-${{ github.run_id }}
          path: |
            app/e2e/playwright-report/
            app/e2e/test-results/
            app/e2e/student-affairs-scholarship-config-v3-evidence.json
            app/e2e/runtime-logs/
          if-no-files-found: ignore
          retention-days: 7
