name: PR198 Website Evidence Import

on:
  push:
    branches:
      - agent/yueke-official-site-framer-style-20260821
    paths:
      - '.github/workflows/pr198-website-evidence-import.yml'

permissions:
  contents: write
  actions: read

jobs:
  import-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download successful same-branch Playwright evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9444434412/zip" -o /tmp/evidence.zip
          mkdir -p /tmp/evidence
          unzip -q /tmp/evidence.zip -d /tmp/evidence

      - name: Convert selected real-browser screenshots
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('/tmp/evidence')
          out = Path('frontend/public/official-site')
          out.mkdir(parents=True, exist_ok=True)
          files = {
              'academic-schedule.webp': 'w3-scheduled-success-1440x900.png',
              'academic-registration.webp': 'd2-registration-bulk-preview-1440x900.png',
              'student-affairs-risk.webp': 'rollout-risk-student-affairs-b-1440x1000.png',
              'student-affairs-talk.webp': 'rollout-process-affairs-talk-ledger-b-1440x1000.png',
              'student-affairs-dormitory.webp': 'rollout-student-affairs-dormitory-b-1440x1000.png',
              'graduation-dashboard.webp': 'gd-U1-dashboard-B-1440x900.png',
              'graduation-final-review.webp': 'gd-U3-final-B-1440x900.png',
              'graduation-process.webp': 'gd-U4-process-B-1440x900.png',
              'internship-risk.webp': 'rollout-risk-internship-b-1440x1000.png',
              'internship-guidance.webp': 'rollout-process-internship-guidance-b-1440x1000.png',
              'internship-students.webp': 'rollout-ops-internship-students-b-1440x1000.png',
          }
          for target, basename in files.items():
              hits = list(root.rglob(basename))
              if len(hits) != 1:
                  raise SystemExit(f'{basename}: expected 1 evidence file, got {len(hits)}')
              with Image.open(hits[0]) as im:
                  im.convert('RGB').save(out / target, 'WEBP', quality=84, method=6)
              print(f'{target} <- {hits[0]}')
          PY

      - name: Install final product evidence configuration
        run: |
          set -euo pipefail
          cp .github/pr198-officialProducts.js frontend/src/config/officialProducts.js

      - name: Commit final website evidence and remove importer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr198-website-evidence-import.yml
          git rm .github/pr198-officialProducts.js
          git add -- frontend/src/config/officialProducts.js frontend/public/official-site/academic-schedule.webp frontend/public/official-site/academic-registration.webp frontend/public/official-site/student-affairs-risk.webp frontend/public/official-site/student-affairs-talk.webp frontend/public/official-site/student-affairs-dormitory.webp frontend/public/official-site/graduation-dashboard.webp frontend/public/official-site/graduation-final-review.webp frontend/public/official-site/graduation-process.webp frontend/public/official-site/internship-risk.webp frontend/public/official-site/internship-guidance.webp frontend/public/official-site/internship-students.webp
          git diff --cached --stat
          git commit -m "feat(site): enrich product pages with real browser evidence"
          git push origin HEAD:${{ github.ref_name }}
