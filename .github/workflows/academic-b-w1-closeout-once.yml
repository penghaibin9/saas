name: Academic B W1 cross-client closeout once

on:
  push:
    branches: [agent/academic-b-schedule-selection]
    paths:
      - '.github/workflows/academic-b-w1-closeout-once.yml'

permissions:
  contents: write

env:
  APP_ENV: test
  DB_ENABLED: 'true'
  MOCK_LOGIN_ENABLED: 'true'
  JWT_SECRET: academic-b-w1-closeout-secret-at-least-32-bytes
  DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_w1_close?charset=utf8mb4
  TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_w1_close?charset=utf8mb4

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: academic_b_w1_close
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-b-schedule-selection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply explicit transaction ownership and cross-client preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          core = 'backend/app/modules/academic_affairs/services/academic_affairs_selection_core_service.py'
          replace_once(core, '''def _record_conflict_reject(db, batch, course, student, msg):\n    """⑤课表冲突被拒事件持久化（供「冲突检测」卡批次级报表聚合，见09号卡§8）。\n    独立 commit：即使随后 enroll() 整体因冲突异常回滚，该拒绝事件仍需留痕，\n    不能随请求失败一起丢失（否则报表无数据源）。biz_id=selection_course_id 供按课程聚合，\n    detail 内嵌 studentNo 供「按学号查询」过滤（不新建专属统计表，复用审计基座）。"""\n''', '''def _record_conflict_reject(db, batch, course, student, msg):\n    """登记⑤课表冲突拒绝证据；只 add，不在 helper 内夺取事务所有权。\n\n    调用 Command 必须在异常出口显式 commit 一次，保证失败请求仍留证据；validator/preflight\n    只做判断，绝不写审计或提交事务。\n    """\n''')
          replace_once(core, '''        detail=(f"studentNo={student.student_no or ''} studentName={student.real_name or ''} "\n               f"courseName={course.course_name or ''} reason={msg}")[:990],\n        occurred_at=datetime.utcnow()))\n    db.commit()\n''', '''        detail=(f"studentNo={student.student_no or ''} studentName={student.real_name or ''} "\n               f"courseName={course.course_name or ''} reason={msg}")[:990],\n        occurred_at=datetime.utcnow()))\n''')
          replace_once(core, '''            if "上课时间冲突" in message:\n                _record_conflict_reject(db, b, c, student, message)\n            raise\n''', '''            if "上课时间冲突" in message:\n                _record_conflict_reject(db, b, c, student, message)\n                db.commit()\n            raise\n''')

          final = 'backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py'
          replace_once(final, '''            if "上课时间冲突" in message:\n                _base._core._record_conflict_reject(db, batch, course, student, message)\n            raise selection_trace.attach_selection_trace(\n''', '''            if "上课时间冲突" in message:\n                _base._core._record_conflict_reject(db, batch, course, student, message)\n                db.commit()\n            raise selection_trace.attach_selection_trace(\n''')

          mobile_svc = 'backend/app/modules/academic_affairs/services/mobile_academic_affairs_service.py'
          replace_once(mobile_svc, '''def selection_enroll_my(user, body) -> dict:\n    from app.modules.academic_affairs.services import academic_affairs_selection_service as sel\n    if not (body or {}).get("selectionCourseId"):\n        raise AppException("VALIDATION_ERROR", "selectionCourseId 必填")\n    return sel.student_enroll(user, _ns(body))\n''', '''def selection_preflight_my(user, body) -> dict:\n    """本人选课纯读预检；移动端只代理 canonical SelectionPreflight，不复制规则。"""\n    from app.modules.academic_affairs.services import academic_affairs_selection_service as sel\n    if not (body or {}).get("selectionCourseId"):\n        raise AppException("VALIDATION_ERROR", "selectionCourseId 必填")\n    return sel.student_preflight(user, _ns(body))\n\n\ndef selection_enroll_my(user, body) -> dict:\n    from app.modules.academic_affairs.services import academic_affairs_selection_service as sel\n    if not (body or {}).get("selectionCourseId"):\n        raise AppException("VALIDATION_ERROR", "selectionCourseId 必填")\n    return sel.student_enroll(user, _ns(body))\n''')

          mobile_router = 'backend/app/api/v1/mobile.py'
          replace_once(mobile_router, '''@router.post("/academic/selection/enroll", summary="教务·网上选课·本人选课")\ndef academic_selection_enroll(body: dict = Body(...), user=Depends(get_current_user)):\n    return success(aa.selection_enroll_my(user, body), message="选课成功")\n''', '''@router.post("/academic/selection/preflight", summary="教务·网上选课·本人纯读预检")\ndef academic_selection_preflight(body: dict = Body(...), user=Depends(get_current_user)):\n    return success(aa.selection_preflight_my(user, body))\n\n\n@router.post("/academic/selection/enroll", summary="教务·网上选课·本人选课")\ndef academic_selection_enroll(body: dict = Body(...), user=Depends(get_current_user)):\n    return success(aa.selection_enroll_my(user, body), message="选课成功")\n''')

          portal_svc = 'backend/app/student_portal/services/academic_service.py'
          replace_once(portal_svc, '''def selection_enroll(user: dict, body: dict) -> dict:\n    """选课·选课（selectionCourseId 必填，容量/冲突由教务选课服务校验）。"""\n    _require_student(user)\n    return aa.selection_enroll_my(user, body or {})\n''', '''def selection_preflight(user: dict, body: dict) -> dict:\n    """选课·纯读预检；直接代理 canonical SelectionPreflight。"""\n    _require_student(user)\n    return aa.selection_preflight_my(user, body or {})\n\n\ndef selection_enroll(user: dict, body: dict) -> dict:\n    """选课·选课（selectionCourseId 必填，容量/冲突由教务选课服务校验）。"""\n    _require_student(user)\n    return aa.selection_enroll_my(user, body or {})\n''')

          portal_router = 'backend/app/student_portal/router.py'
          replace_once(portal_router, '''@router.post("/academic/course-selection/enroll", summary="选课（本人）")\ndef academic_course_enroll(user=Depends(get_current_user), body: dict = Body(...)):\n    return success(academic.selection_enroll(user, body))\n''', '''@router.post("/academic/course-selection/preflight", summary="选课纯读预检（本人）")\ndef academic_course_preflight(user=Depends(get_current_user), body: dict = Body(...)):\n    return success(academic.selection_preflight(user, body))\n\n\n@router.post("/academic/course-selection/enroll", summary="选课（本人）")\ndef academic_course_enroll(user=Depends(get_current_user), body: dict = Body(...)):\n    return success(academic.selection_enroll(user, body))\n''')

          portal_api = 'student-portal/src/services/portalApi.js'
          replace_once(portal_api, '''  academicCourseSelection: (batchId) => request(`/portal/academic/course-selection${q({ batchId })}`),\n  academicEnroll: (body) => request('/portal/academic/course-selection/enroll', { method: 'POST', body }),\n''', '''  academicCourseSelection: (batchId) => request(`/portal/academic/course-selection${q({ batchId })}`),\n  academicSelectionPreflight: (body) => request('/portal/academic/course-selection/preflight', { method: 'POST', body }),\n  academicEnroll: (body) => request('/portal/academic/course-selection/enroll', { method: 'POST', body }),\n''')

          portal_view = 'student-portal/src/views/academic/StudentSelectionView.vue'
          replace_once(portal_view, '''  try {\n    await portalApi.academicEnroll({ selectionCourseId: id })\n    ui.notify('选课成功')\n    await load()\n  } catch (e) {\n''', '''  try {\n    const preflight = await portalApi.academicSelectionPreflight({ selectionCourseId: id })\n    if (!preflight?.allowed) {\n      decisionError.value = {\n        message: preflight?.message || '当前课程未通过选课预检',\n        decisionTrace: preflight?.decisionTrace || null\n      }\n      ui.notify(decisionError.value.message)\n      return\n    }\n    await portalApi.academicEnroll({ selectionCourseId: id })\n    ui.notify('选课成功')\n    await load()\n  } catch (e) {\n''')

          real_api = 'miniapp/src/services/realApi.js'
          replace_once(real_api, '''export const acadSelectionEnroll = (selectionCourseId) =>\n  realRequest('/mobile/academic/selection/enroll', { method: 'POST', data: { selectionCourseId } })\n''', '''export const acadSelectionPreflight = (selectionCourseId) =>\n  realRequest('/mobile/academic/selection/preflight', { method: 'POST', data: { selectionCourseId } })\nexport const acadSelectionEnroll = (selectionCourseId) =>\n  realRequest('/mobile/academic/selection/enroll', { method: 'POST', data: { selectionCourseId } })\n''')

          student_api = 'miniapp/src/services/studentApi.js'
          replace_once(student_api, '''  getSelectionCourses: (batchId) => real.acadSelectionCourses(batchId),\n  enrollSelection: (selectionCourseId) => real.acadSelectionEnroll(selectionCourseId),\n''', '''  getSelectionCourses: (batchId) => real.acadSelectionCourses(batchId),\n  preflightSelection: (selectionCourseId) => real.acadSelectionPreflight(selectionCourseId),\n  enrollSelection: (selectionCourseId) => real.acadSelectionEnroll(selectionCourseId),\n''')

          mini_view = 'miniapp/src/pages/student/academic-affairs/selection.vue'
          replace_once(mini_view, '''      studentApi.enrollSelection(c.selectionCourseId).then(() => {\n        uni.showToast({ title: '选课成功', icon: 'success' })\n        this.load()\n      }).catch((e) => {\n''', '''      studentApi.preflightSelection(c.selectionCourseId).then((preflight) => {\n        if (!preflight || !preflight.allowed) {\n          this.decisionError = {\n            message: (preflight && preflight.message) || '当前课程未通过选课预检',\n            decisionTrace: (preflight && preflight.decisionTrace) || null\n          }\n          toast(this.decisionError.message)\n          return null\n        }\n        return studentApi.enrollSelection(c.selectionCourseId)\n      }).then((result) => {\n        if (result == null) return\n        uni.showToast({ title: '选课成功', icon: 'success' })\n        this.load()\n      }).catch((e) => {\n''')

          Path('backend/tests/test_aa_selection_w1_closeout.py').write_text('''from __future__ import annotations\n\nimport inspect\nfrom pathlib import Path\n\nfrom app.modules.academic_affairs.services import academic_affairs_selection_core_service as core\nfrom app.modules.academic_affairs.services import academic_affairs_selection_final_service as final\nfrom app.modules.academic_affairs.services import mobile_academic_affairs_service as mobile\n\n\ndef _block(source: str, start: str, end: str) -> str:\n    left = source.index(start)\n    right = source.index(end, left)\n    return source[left:right]\n\n\ndef test_conflict_audit_helper_never_commits_and_commands_own_single_commit():\n    core_source = Path(core.__file__).read_text(encoding="utf-8")\n    helper = _block(core_source, "def _record_conflict_reject", "\\ndef _validate_enroll")\n    assert "db.commit(" not in helper\n    legacy = inspect.getsource(core.student_enroll)\n    assert legacy.count("_record_conflict_reject") == 1\n    reject_at = legacy.index("_record_conflict_reject")\n    assert "db.commit()" in legacy[reject_at:reject_at + 220]\n\n    final_source = inspect.getsource(final.student_enroll)\n    assert final_source.count("_record_conflict_reject") == 1\n    reject_at = final_source.index("_record_conflict_reject")\n    assert "db.commit()" in final_source[reject_at:reject_at + 240]\n\n\ndef test_mobile_preflight_delegates_canonical_final_service_without_rule_copy():\n    source = inspect.getsource(mobile.selection_preflight_my)\n    assert "sel.student_preflight" in source\n    for forbidden in ["_validate_enroll", "AcademicGrade", "AaScheduleItem", "db.commit"]:\n        assert forbidden not in source\n\n\ndef test_portal_and_mobile_routes_expose_preflight_before_enroll():\n    root = Path(__file__).resolve().parents[2]\n    mobile_router = (root / "backend/app/api/v1/mobile.py").read_text(encoding="utf-8")\n    portal_router = (root / "backend/app/student_portal/router.py").read_text(encoding="utf-8")\n    assert mobile_router.index('/academic/selection/preflight') < mobile_router.index('/academic/selection/enroll')\n    assert portal_router.index('/academic/course-selection/preflight') < portal_router.index('/academic/course-selection/enroll')\n''', encoding='utf-8')

          Path('student-portal/tests/academic-b-selection-preflight-client.test.mjs').write_text('''import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport { readFile } from 'node:fs/promises'\n\nconst api = await readFile(new URL('../src/services/portalApi.js', import.meta.url), 'utf8')\nconst view = await readFile(new URL('../src/views/academic/StudentSelectionView.vue', import.meta.url), 'utf8')\n\ntest('student PC preflights before enroll and renders backend decision trace', () => {\n  assert.match(api, /academicSelectionPreflight/)\n  const start = view.indexOf('async function enroll(course)')\n  const block = view.slice(start, view.indexOf('async function drop', start))\n  assert.ok(block.indexOf('academicSelectionPreflight') < block.indexOf('academicEnroll'))\n  assert.match(block, /preflight\?\.allowed/)\n  assert.match(block, /preflight\?\.decisionTrace/)\n  assert.match(view, /AcademicDecisionTraceCard/)\n})\n''', encoding='utf-8')

          Path('miniapp/tests/academic-b-selection-preflight-client.test.mjs').write_text('''import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport { readFile } from 'node:fs/promises'\n\nconst realApi = await readFile(new URL('../src/services/realApi.js', import.meta.url), 'utf8')\nconst studentApi = await readFile(new URL('../src/services/studentApi.js', import.meta.url), 'utf8')\nconst page = await readFile(new URL('../src/pages/student/academic-affairs/selection.vue', import.meta.url), 'utf8')\n\ntest('miniapp preflights before enroll and reuses backend decision trace', () => {\n  assert.match(realApi, /acadSelectionPreflight/)\n  assert.match(studentApi, /preflightSelection/)\n  const start = page.indexOf('enroll(c)')\n  const block = page.slice(start, page.indexOf('drop(c)', start))\n  assert.ok(block.indexOf('preflightSelection') < block.indexOf('enrollSelection'))\n  assert.match(block, /preflight\.allowed/)\n  assert.match(block, /preflight\.decisionTrace/)\n  assert.match(page, /MobileAcademicDecisionCard/)\n})\n''', encoding='utf-8')
          PY
      - name: Install backend and migrate fresh MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
      - name: W1 backend closeout targeted
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q -p no:warnings \
            tests/test_aa_selection_preflight_w1.py \
            tests/test_aa_selection_batch_preflight_w1.py \
            tests/test_aa_selection_w1_closeout.py \
            tests/test_stage_d_selection_trace.py \
            tests/test_aa_selection_student_guard.py \
            --maxfail=1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - name: Student PC preflight contract and build
        working-directory: student-portal
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/stage-d-decision-trace-contract.test.mjs tests/academic-b-selection-preflight-client.test.mjs
          npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - name: Miniapp preflight contract and dual production builds
        working-directory: miniapp
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/academic-b-selection-preflight-client.test.mjs
          npm run build:h5
          npm run build:mp-weixin
      - name: Commit W1 cross-client closeout atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            backend/app/modules/academic_affairs/services/academic_affairs_selection_core_service.py \
            backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py \
            backend/app/modules/academic_affairs/services/mobile_academic_affairs_service.py \
            backend/app/api/v1/mobile.py \
            backend/app/student_portal/services/academic_service.py \
            backend/app/student_portal/router.py \
            backend/tests/test_aa_selection_w1_closeout.py \
            student-portal/src/services/portalApi.js \
            student-portal/src/views/academic/StudentSelectionView.vue \
            student-portal/tests/academic-b-selection-preflight-client.test.mjs \
            miniapp/src/services/realApi.js \
            miniapp/src/services/studentApi.js \
            miniapp/src/pages/student/academic-affairs/selection.vue \
            miniapp/tests/academic-b-selection-preflight-client.test.mjs
          git rm -- '.github/workflows/academic-b-w1-closeout-once.yml'
          git commit -m 'feat(academic-b): close selection preflight across clients'
          git fetch origin agent/academic-b-schedule-selection
          git rebase origin/agent/academic-b-schedule-selection
          git push origin HEAD:agent/academic-b-schedule-selection
