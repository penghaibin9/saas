name: PR25 phase6 reviewed grade fixture sync

on:
  push:
    branches: [audit/file-capability-inventory]

permissions:
  contents: write

concurrency:
  group: pr25-phase6-reviewed-grade-fixture-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0

      - name: Add exact reviewed grade acceptance fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path('backend/tests/graduation_material_center_mysql_acceptance.py')
          source = path.read_text(encoding='utf-8')

          import_anchor = '    GraduationFinal,\n    GraduationGuidance,\n'
          import_replacement = '    GraduationFinal,\n    GraduationGrade,\n    GraduationGuidance,\n'
          if source.count(import_anchor) != 1:
              raise SystemExit(f'import anchor count={source.count(import_anchor)}')
          source = source.replace(import_anchor, import_replacement, 1)

          seed_anchor = '''        db.add(GraduationDefenseScore(
            tenant_id=TENANT_ID,
            gd_student_id=student_id,
            defense_group_id=77001,
            judge_name="阶段六答辩评委",
            status="CONFIRMED",
            score=90,
            comment="答辩通过",
            round_no=1,
        ))
        db.commit()
'''
          seed_replacement = '''        db.add(GraduationDefenseScore(
            tenant_id=TENANT_ID,
            gd_student_id=student_id,
            defense_group_id=77001,
            judge_name="阶段六答辩评委",
            status="CONFIRMED",
            score=90,
            comment="答辩通过",
            round_no=1,
        ))
        db.add(GraduationGrade(
            tenant_id=TENANT_ID,
            gd_student_id=student_id,
            advisor_score=86,
            reviewer_score=88,
            defense_score=90,
            total_score=88,
            grade_level="良好",
            status="REVIEWED",
            calculated_at=datetime.utcnow(),
            reviewed_by="阶段六管理员",
            reviewed_at=datetime.utcnow(),
            source_snapshot_hash=hashlib.sha256(
                f"{student_id}:86:88:90:88".encode("utf-8")
            ).hexdigest(),
        ))
        db.commit()
'''
          if source.count(seed_anchor) != 1:
              raise SystemExit(f'seed anchor count={source.count(seed_anchor)}')
          source = source.replace(seed_anchor, seed_replacement, 1)

          ast.parse(source, filename=str(path))
          path.write_text(source, encoding='utf-8')
          PY

          git diff --check
          grep -n 'GraduationGrade' backend/tests/graduation_material_center_mysql_acceptance.py
          grep -n 'status="REVIEWED"' backend/tests/graduation_material_center_mysql_acceptance.py

      - name: Commit fixture and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/graduation_material_center_mysql_acceptance.py
          git rm .github/workflows/pr25-phase6-grade-fixture-sync.yml
          git diff --cached --check
          git commit -m 'test(graduation): seed reviewed grade for archive acceptance'
          git push origin HEAD:audit/file-capability-inventory
