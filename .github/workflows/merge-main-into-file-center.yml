name: Merge latest main into file center Draft

on:
  push:
    branches: [audit/file-capability-inventory]
    paths: ['.github/workflows/merge-main-into-file-center.yml']

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - name: Merge main and preserve the file-center graduation entry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-commit origin/main || true

          UNMERGED="$(git diff --name-only --diff-filter=U)"
          if [ -n "$UNMERGED" ]; then
            if [ "$UNMERGED" != "student-portal/src/layouts/PortalLayout.vue" ]; then
              echo "Unexpected merge conflicts:"
              echo "$UNMERGED"
              exit 1
            fi
            git checkout --theirs -- student-portal/src/layouts/PortalLayout.vue
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('student-portal/src/layouts/PortalLayout.vue')
          source = path.read_text(encoding='utf-8')

          button = '''          <button v-if="activeModulePath === 'graduation'" class="sp-context-link" type="button" @click="toggleGraduationView">
            {{ route.name === 'graduation-material-library' ? '返回毕业设计工作台' : '我的材料库' }}
          </button>
'''
          if 'toggleGraduationView' not in source:
              anchor = '''          <button v-if="activeModulePath === 'internship'" class="sp-context-link" type="button" @click="toggleInternshipView">
            {{ route.name === 'internship-compliance' ? '返回实习工作台' : '上岗合规与安全教育' }}
          </button>
'''
              if anchor not in source:
                  raise SystemExit('PortalLayout internship context anchor not found')
              source = source.replace(anchor, anchor + button, 1)

              function_anchor = '''function toggleInternshipView() {
  router.push(route.name === 'internship-compliance' ? '/internship' : '/internship/compliance')
}
'''
              function = '''function toggleGraduationView() {
  router.push(route.name === 'graduation-material-library' ? '/graduation' : '/graduation/materials')
}
'''
              if function_anchor not in source:
                  raise SystemExit('PortalLayout internship function anchor not found')
              source = source.replace(function_anchor, function_anchor + function, 1)

          required = (
              "activeModulePath === 'graduation'",
              "route.name === 'graduation-material-library'",
              "function toggleGraduationView()",
              "'/graduation/materials'",
              "sp-theme__grid",
              "student-portal-theme-change",
          )
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit(f'PortalLayout merge lost required contracts: {missing}')
          path.write_text(source, encoding='utf-8')
          PY

          git add -- student-portal/src/layouts/PortalLayout.vue
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check

      - name: Validate merged student portal
        working-directory: student-portal
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit merge to the existing Draft branch
        run: |
          git commit -m "merge(main): absorb student portal V5 and preserve file center entry"
          git push origin HEAD:audit/file-capability-inventory
