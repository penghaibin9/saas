name: Agent Apply Mobile Graduation Batch Contract

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: agent-mobile-graduation-batch-pr36
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.head_ref == 'fix/graduation-material-closeout-p0-review' }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graduation-material-closeout-p0-review
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply explicit batch contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_mobile.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_teacher_domain_pages_structure(client, db_mode):
              _seed_rich(db_mode)
              admin_headers = _teacher_token(role="SCHOOL_ADMIN")
              it = client.get("/api/v1/mobile/teacher/internship", headers=admin_headers).json()
              assert it["code"] == 0 and "weeklyReports" in it["data"] and "abnormalCheckins" in it["data"]
              gd = client.get("/api/v1/mobile/teacher/graduation", headers=admin_headers).json()
              assert gd["code"] == 0 and "students" in gd["data"] and "reviewDetail" in gd["data"]
          '''
          new = '''def test_teacher_domain_pages_structure(client, db_mode):
              _seed_rich(db_mode)
              from app.db.session import get_sessionmaker
              from app.models import GraduationBatch

              db = get_sessionmaker()()
              try:
                  batch = GraduationBatch(
                      tenant_id=MAIN, batch_name="移动端结构测试批次", batch_no="MOBILE-STRUCTURE-001",
                      planned_count=2, status="RUNNING", archive_status="NOT_ARCHIVED",
                  )
                  db.add(batch)
                  db.flush()
                  batch_id = int(batch.id)
                  db.commit()
              finally:
                  db.close()

              admin_headers = _teacher_token(role="SCHOOL_ADMIN")
              it = client.get("/api/v1/mobile/teacher/internship", headers=admin_headers).json()
              assert it["code"] == 0 and "weeklyReports" in it["data"] and "abnormalCheckins" in it["data"]
              gd = client.get(
                  "/api/v1/mobile/teacher/graduation", headers=admin_headers, params={"batchId": batch_id}
              ).json()
              assert gd["code"] == 0 and "students" in gd["data"] and "reviewDetail" in gd["data"]
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'params={"batchId": batch_id}' not in text:
              raise SystemExit('mobile graduation assertion anchor not found')
          PY
          python -m py_compile backend/tests/test_mobile.py
          git diff --check

      - name: Verify focused regression
        working-directory: backend
        run: pytest tests/test_mobile.py::test_teacher_domain_pages_structure -q -p no:warnings

      - name: Remove temporary workflow and commit
        run: |
          git rm -f .github/workflows/agent-diagnose-main-ci-regressions.yml || true
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(mobile): require explicit graduation batch context'
          git push origin HEAD:fix/graduation-material-closeout-p0-review
