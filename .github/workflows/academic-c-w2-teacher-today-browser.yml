name: Academic C W2 Teacher Today Browser Seal

on:
  push:
    branches:
      - agent/academic-c-teaching-execution
      - fix/academic-e2e-school-iam-bootstrap-20260823
    paths:
      - 'backend/app/modules/academic_affairs/services/academic_affairs_teacher_today_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_teacher_today_execution_state_service.py'
      - 'backend/app/modules/academic_affairs/services/mobile_academic_affairs_public_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_attendance_public_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_grade_core_service.py'
      - 'backend/scripts/e2e_seed_academic_c_teacher_today.py'
      - 'miniapp/src/pages/teacher/academic-affairs/index.vue'
      - 'miniapp/src/pages/teacher/academic-affairs/attendance.vue'
      - 'miniapp/tests/academic-teacher-today-contract.test.mjs'
      - 'e2e/specs/academic-c-teacher-today.spec.mjs'
      - '.github/workflows/academic-c-w2-teacher-today-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: academic-c-w2-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-grade-audit:
    if: github.ref == 'refs/heads/fix/academic-e2e-school-iam-bootstrap-20260823'
    name: patch grade high-risk audit evidence atomically
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch only grade service when needed
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/modules/academic_affairs/services/academic_affairs_grade_core_service.py')
          text = path.read_text(encoding='utf-8')
          if 'before_val=_snapshot(before_val)' in text and 'after_val=_snapshot(after_val)' in text:
              print('grade audit evidence already patched')
              raise SystemExit(0)

          def once(old, new):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'expected exactly one match, got {n}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          once('from datetime import datetime\n\nfrom sqlalchemy import and_, func, select\n',
               'from datetime import datetime\nimport json\n\nfrom sqlalchemy import and_, func, select\n')
          once(
              '''def _audit(db, biz_type, biz_id, action, detail=""):\n    from app.models import AffairsAuditTrail\n    n, r, uid = _op()\n    db.add(AffairsAuditTrail(tenant_id=_tid(), biz_type=biz_type, biz_id=int(biz_id) if biz_id else None,\n                             action=action, operator=n or uid, role_name=r, detail=detail,\n                             occurred_at=datetime.utcnow()))\n''',
              '''def _audit(db, biz_type, biz_id, action, detail="", *, before_val=None, after_val=None):\n    from app.models import AffairsAuditTrail\n    n, r, uid = _op()\n\n    def _snapshot(value):\n        if value is None or isinstance(value, str):\n            return value\n        return json.dumps(value, ensure_ascii=False, sort_keys=True, default=str)\n\n    db.add(AffairsAuditTrail(tenant_id=_tid(), biz_type=biz_type, biz_id=int(biz_id) if biz_id else None,\n                             action=action, operator=n or uid, role_name=r, detail=detail,\n                             before_val=_snapshot(before_val), after_val=_snapshot(after_val),\n                             occurred_at=datetime.utcnow()))\n''')
          once(
              '''        # CAS：仅 INPUTTING/RETURNED 可抢占为 SUBMITTED，防并发双提交产生孤儿工作流\n        claim = db.query(AaGradeTask).filter(\n''',
              '''        # CAS：仅 INPUTTING/RETURNED 可抢占为 SUBMITTED，防并发双提交产生孤儿工作流\n        before_status = t.status\n        claim = db.query(AaGradeTask).filter(\n''')
          once(
              '''        _todo_done_grade_entry(db, t.id)\n        _audit(db, "AA_GRADE_TASK", t.id, "SUBMIT")\n''',
              '''        _todo_done_grade_entry(db, t.id)\n        _audit(\n            db, "AA_GRADE_TASK", t.id, "SUBMIT",\n            before_val={"status": before_status, "workflowInstanceId": None},\n            after_val={"status": "SUBMITTED", "workflowInstanceId": str(inst.id),\n                       "submittedAt": t.submitted_at},\n        )\n''')
          once(
              '''            t.status, t.return_reason = "RETURNED", reason.strip()\n            _push_grade_entry_todo(db, t)\n            _audit(db, "AA_GRADE_TASK", t.id, "COLLEGE_RETURN", reason.strip())\n''',
              '''            t.status, t.return_reason = "RETURNED", reason.strip()\n            _push_grade_entry_todo(db, t)\n            _audit(\n                db, "AA_GRADE_TASK", t.id, "COLLEGE_RETURN", reason.strip(),\n                before_val={"status": "SUBMITTED", "returnReason": None},\n                after_val={"status": "RETURNED", "returnReason": reason.strip(),\n                           "reviewerId": int(uid) if uid.isdigit() else None},\n            )\n''')
          once(
              '''            t.college_reviewed_at = datetime.utcnow()\n            t.college_reviewer_id = int(uid) if uid.isdigit() else None\n            t.status = "ACADEMIC_REVIEW"\n            _audit(db, "AA_GRADE_TASK", t.id, "COLLEGE_APPROVE")\n''',
              '''            t.college_reviewed_at = datetime.utcnow()\n            t.college_reviewer_id = int(uid) if uid.isdigit() else None\n            t.status = "ACADEMIC_REVIEW"\n            _audit(\n                db, "AA_GRADE_TASK", t.id, "COLLEGE_APPROVE",\n                before_val={"status": "SUBMITTED", "collegeReviewerId": None},\n                after_val={"status": "ACADEMIC_REVIEW",\n                           "collegeReviewerId": t.college_reviewer_id,\n                           "collegeReviewedAt": t.college_reviewed_at},\n            )\n''')
          once(
              '''        t.academic_reviewed_at = datetime.utcnow()\n        n, r2, uid = _op()\n        t.academic_reviewer_id = int(uid) if uid.isdigit() else None\n        _audit(db, "AA_GRADE_TASK", t.id, "PUBLISH", f"projected={projected},fail={fail_count}")\n''',
              '''        t.academic_reviewed_at = datetime.utcnow()\n        n, r2, uid = _op()\n        t.academic_reviewer_id = int(uid) if uid.isdigit() else None\n        _audit(\n            db, "AA_GRADE_TASK", t.id, "PUBLISH", f"projected={projected},fail={fail_count}",\n            before_val={"status": "ACADEMIC_REVIEW", "publishAt": None,\n                        "academicReviewerId": None},\n            after_val={"status": "PUBLISHED", "publishAt": t.publish_at,\n                       "academicReviewedAt": t.academic_reviewed_at,\n                       "academicReviewerId": t.academic_reviewer_id,\n                       "projected": projected, "failCount": fail_count},\n        )\n''')
          once(
              '''        t.status, t.return_reason = "RETURNED", reason.strip()\n        _push_grade_entry_todo(db, t)\n        _audit(db, "AA_GRADE_TASK", t.id, "ACADEMIC_RETURN", reason.strip())\n''',
              '''        t.status, t.return_reason = "RETURNED", reason.strip()\n        _push_grade_entry_todo(db, t)\n        _audit(\n            db, "AA_GRADE_TASK", t.id, "ACADEMIC_RETURN", reason.strip(),\n            before_val={"status": "ACADEMIC_REVIEW", "returnReason": None},\n            after_val={"status": "RETURNED", "returnReason": reason.strip()},\n        )\n''')
          once(
              '''        t.status = "ARCHIVED"\n        # 明确保留 teaching_task_id，归档不释放终身唯一占用\n        _audit(db, "AA_GRADE_TASK", t.id, "ARCHIVE")\n''',
              '''        t.status = "ARCHIVED"\n        # 明确保留 teaching_task_id，归档不释放终身唯一占用\n        _audit(\n            db, "AA_GRADE_TASK", t.id, "ARCHIVE",\n            before_val={"status": "PUBLISHED", "teachingTaskId": str(t.teaching_task_id or "")},\n            after_val={"status": "ARCHIVED", "teachingTaskId": str(t.teaching_task_id or "")},\n        )\n''')
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          python -m py_compile backend/app/modules/academic_affairs/services/academic_affairs_grade_core_service.py
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo 'No patch commit required.'
            exit 0
          fi
          test "$changed" = 'backend/app/modules/academic_affairs/services/academic_affairs_grade_core_service.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/app/modules/academic_affairs/services/academic_affairs_grade_core_service.py
          git commit -m 'fix(academic): persist grade high-risk audit before-after evidence'
          git push origin HEAD:${GITHUB_REF_NAME}

  teacher-today-browser:
    name: real miniapp / real API / isolated MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/14
      REDIS_KEY_PREFIX: academic-c-w2-browser
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: academic-c-w2-browser-only-not-production
      JWT_SECRET_KEY: academic-c-w2-browser-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://localhost:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_MINIAPP_BASE_URL: http://localhost:5188
      E2E_EXPECTED_SHA: ${{ github.sha }}
      SCHOOL_IAM_AUTHORITY_EXPECTED_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Fast C-W2 browser preflight
        run: |
          python -m py_compile backend/scripts/e2e_seed_academic_c_teacher_today.py
          node --check e2e/specs/academic-c-teacher-today.spec.mjs
          node --test miniapp/tests/academic-teacher-today-contract.test.mjs

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrate isolated database
        working-directory: backend
        run: alembic upgrade head

      - name: Replay production School IAM Authority
        working-directory: backend
        run: python scripts/bootstrap_control_plane_school_iam_authority.py

      - name: Seed isolated tenant and teacher identities
        working-directory: backend
        run: python scripts/e2e_seed_playwright_tenants.py

      - name: Seed real School IAM runtime fixture
        working-directory: backend
        run: python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start backend
        run: |
          mkdir -p e2e/runtime-logs
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend-c-w2.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/backend-c-w2.log
          exit 1

      - name: Bootstrap existing sandbox teachers and students
        working-directory: backend
        run: |
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py

      - name: Install and start teacher miniapp H5
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: http://localhost:8000
        run: |
          cd miniapp
          npm ci
          nohup npm run dev:h5 > ../e2e/runtime-logs/miniapp-c-w2.log 2>&1 &

      - name: Wait for Teacher miniapp
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5188/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat e2e/runtime-logs/miniapp-c-w2.log
          exit 1

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run C-W2 exact browser seal
        working-directory: e2e
        run: npx playwright test specs/academic-c-teacher-today.spec.mjs --workers=1 --retries=0

      - name: Upload C-W2 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-c-w2-browser-${{ github.run_id }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
