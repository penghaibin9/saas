name: Official news integration checks
on:
  push:
    branches: [feat/yueke-official-site-60-gallery-20260909]
    paths: ['.github/workflows/official-news-check.yml']
permissions:
  contents: read
jobs:
  media-context:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8b09ff359fdffd71fc1e0b099ddb4a138d0ce173
          persist-credentials: false
      - name: Retrieve licensed source for campus synchronization
        run: |
          mkdir -p "$RUNNER_TEMP/website-news-media"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 90 'https://www.scottbuckley.com.au/library/wp-content/uploads/2020/01/sb_discovery.mp3' -o "$RUNNER_TEMP/website-news-media/discovery-source.mp3"
          sha256sum "$RUNNER_TEMP/website-news-media/discovery-source.mp3" > "$RUNNER_TEMP/website-news-media/audio-sha256.txt"
          printf '%s\n' "Discovery by Scott Buckley – released under CC-BY 4.0. www.scottbuckley.com.au" 'Source: https://www.scottbuckley.com.au/library/discovery/' 'License: https://creativecommons.org/licenses/by/4.0/' 'To be synchronized with campus tour; retain attribution and record modifications.' > "$RUNNER_TEMP/website-news-media/ATTRIBUTION.txt"
      - name: Include only missing deployment configuration context
        run: |
          python - <<'PY'
          import pathlib,subprocess,zipfile,os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'website-news-media'
          with zipfile.ZipFile(root/'deployment-context.zip','w',zipfile.ZIP_DEFLATED) as z:
              for n in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  if n.startswith('deploy/') and pathlib.Path(n).suffix in {'.conf','.example','.service','.timer'}:
                      z.write(n,n)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-news-music-and-deployment
          path: ${{ runner.temp }}/website-news-media/*
          retention-days: 1
