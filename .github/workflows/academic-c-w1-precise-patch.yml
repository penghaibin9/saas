name: Academic C W1 Precise Patch

on:
  push:
    branches:
      - agent/academic-c-teaching-execution
    paths:
      - .github/workflows/academic-c-w1-precise-patch.yml

permissions:
  contents: write

jobs:
  patch-and-targeted-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-c-teaching-execution
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Patch only the two proven C-W1 red points
        run: |
          python - <<'PY'
          from pathlib import Path

          warning = Path('backend/app/modules/academic_affairs/services/academic_affairs_warning_service.py')
          text = warning.read_text(encoding='utf-8')
          old = '                sp = db.get(StudentProfile, profile_id)\n'
          new = (
              '                sp = db.scalars(select(StudentProfile).where(\n'
              '                    StudentProfile.id == profile_id,\n'
              '                    StudentProfile.tenant_id == _tid(),\n'
              '                    StudentProfile.is_deleted.is_(False),\n'
              '                )).first()\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'warning patch anchor count={text.count(old)}; expected 1')
          warning.write_text(text.replace(old, new, 1), encoding='utf-8')

          view = Path('frontend/src/modules/academicAffairs/views/AaAttendanceStatsView.vue')
          text = view.read_text(encoding='utf-8')
          old = '        <template v-if="sessionType === \'ADMIN_SPECIAL\'">特殊补录仅用于审计核对，不进入标准课堂旷课预警。</template>\n'
          new = '        <span v-if="sessionType === \'ADMIN_SPECIAL\'">特殊补录仅用于审计核对，不进入标准课堂旷课预警。</span>\n'
          if text.count(old) != 1:
              raise SystemExit(f'visual patch anchor count={text.count(old)}; expected 1')
          view.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install only backend dependencies needed by targeted checks
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tenant isolation ratchet only
        working-directory: backend
        run: python scripts/audit_tenant_queries.py --gate

      - name: Attendance warning source contract only
        working-directory: backend
        env:
          APP_ENV: test
          JWT_SECRET: academic-c-w1-targeted-secret-at-least-32-bytes
          DB_ENABLED: 'false'
        run: pytest -q tests/test_aa_attendance_warning_source_contract.py -p no:warnings

      - name: PC attendance source contract only
        working-directory: frontend
        run: node --test tests/academic-attendance-source-contract.test.mjs

      - name: Commit proven fixes and remove one-shot helper
        run: |
          rm .github/workflows/academic-c-w1-precise-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/modules/academic_affairs/services/academic_affairs_warning_service.py
          git add frontend/src/modules/academicAffairs/views/AaAttendanceStatsView.vue
          git add -u .github/workflows/academic-c-w1-precise-patch.yml
          git diff --cached --check
          git commit -m "fix(academic-c): close attendance tenant and visual red lights"
          git push origin HEAD:agent/academic-c-teaching-execution
