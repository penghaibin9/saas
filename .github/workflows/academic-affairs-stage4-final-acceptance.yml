name: 教务第四阶段合并前最终验收

on:
  workflow_dispatch:
  push:
    branches:
      - integrate/academic-affairs-final-20260729

permissions:
  contents: read

concurrency:
  group: academic-affairs-stage4-final-acceptance
  cancel-in-progress: true

jobs:
  freeze-audit:
    name: 冻结 main 与最终分支关系
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 冻结并校验基准
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          MAIN_SHA=$(git rev-parse origin/main)
          FINAL_SHA=$(git rev-parse HEAD)
          AHEAD=$(git rev-list --count origin/main..HEAD)
          BEHIND=$(git rev-list --count HEAD..origin/main)
          MERGE_BASE=$(git merge-base origin/main HEAD)
          echo "main=$MAIN_SHA"
          echo "final=$FINAL_SHA"
          echo "ahead=$AHEAD behind=$BEHIND merge_base=$MERGE_BASE"
          test "$BEHIND" -eq 0
          test "$AHEAD" -ge 1
          test "$MERGE_BASE" = "$MAIN_SHA"
          {
            echo "## 第四阶段冻结状态"
            echo "- main: \`$MAIN_SHA\`"
            echo "- final: \`$FINAL_SHA\`"
            echo "- ahead / behind: $AHEAD / $BEHIND"
          } >> "$GITHUB_STEP_SUMMARY"

  backend-final-gate:
    name: 后端、MySQL、迁移与真实业务冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: test
      JWT_SECRET: stage4-final-acceptance-secret
      MOCK_LOGIN_ENABLED: "false"
      DB_ENABLED: "true"
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install cryptography
      - name: Python 编译、导入、路由、模型与生产认证边界
        working-directory: backend
        run: |
          python -m compileall -q app tests
          python - <<'PY'
          from fastapi.routing import APIRoute
          from fastapi.testclient import TestClient
          from app.main import app as fastapi_app
          import app.models as _registered_models
          from app.models.base import Base

          seen = set()
          for route in fastapi_app.routes:
              if not isinstance(route, APIRoute):
                  continue
              for method in (route.methods or set()) - {"HEAD", "OPTIONS"}:
                  key = (method, route.path)
                  if key in seen:
                      raise SystemExit(f"duplicate route: {key}")
                  seen.add(key)

          required = {
              "t_aa_term", "t_aa_teaching_class",
              "t_aa_teaching_class_roster_version", "t_aa_effective_grade",
          }
          missing = required - set(Base.metadata.tables)
          if missing:
              raise SystemExit(f"unregistered models: {sorted(missing)}")

          # 最终验收使用真实 JWT；生产式配置下 mock-login 必须明确拒绝。
          with TestClient(fastapi_app) as client:
              response = client.post(
                  "/api/v1/auth/mock-login",
                  json={"loginName": "school_admin01", "password": "any"},
              )
              if response.status_code != 403:
                  raise SystemExit(f"mock-login should be disabled, got {response.status_code}: {response.text}")

          print(f"routes={len(seen)} tables={len(Base.metadata.tables)} mock_login=disabled")
          PY
      - name: Alembic 单一 head 与升级迁移安全扫描
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          cd backend
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic heads
          python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD", "--", "backend/alembic/versions"],
              text=True,
          ).splitlines()
          bad = []
          for raw in files:
              path = Path("..") / raw
              if not path.exists() or path.suffix != ".py":
                  continue
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              upgrade = next(
                  (node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "upgrade"),
                  None,
              )
              if upgrade is None:
                  continue
              for node in ast.walk(upgrade):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                      if node.func.attr in {"drop_table", "drop_column"}:
                          bad.append(f"{path}:{node.lineno}:{node.func.attr}")
                  if isinstance(node, ast.Constant) and isinstance(node.value, str):
                      normalized = " ".join(node.value.upper().split())
                      if "DROP TABLE" in normalized or "DROP COLUMN" in normalized:
                          bad.append(f"{path}:{node.lineno}:raw destructive SQL")
          if bad:
              raise SystemExit("upgrade() 包含无保护破坏性 DDL:\n" + "\n".join(bad))
          print(f"checked migration files={len(files)}; destructive upgrade DDL=0")
          PY
      - name: 从当前 main 数据库版本升级到最终 head
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pymysql
          conn = pymysql.connect(host="127.0.0.1", user="root", password="root", autocommit=True)
          try:
              with conn.cursor() as cur:
                  for name in ("stage4_main_upgrade", "stage4_create_all"):
                      cur.execute(f"DROP DATABASE IF EXISTS `{name}`")
                      cur.execute(f"CREATE DATABASE `{name}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci")
          finally:
              conn.close()
          PY
          git fetch origin main --prune
          git worktree add --detach /tmp/stage4-main origin/main
          (
            cd /tmp/stage4-main/backend
            APP_ENV=test DB_ENABLED=true MOCK_LOGIN_ENABLED=false JWT_SECRET="$JWT_SECRET" \
            DATABASE_URL='mysql+pymysql://root:root@127.0.0.1:3306/stage4_main_upgrade?charset=utf8mb4' \
            alembic upgrade head
          )
          (
            cd backend
            APP_ENV=test DB_ENABLED=true MOCK_LOGIN_ENABLED=false JWT_SECRET="$JWT_SECRET" \
            DATABASE_URL='mysql+pymysql://root:root@127.0.0.1:3306/stage4_main_upgrade?charset=utf8mb4' \
            alembic upgrade head
            test "$(alembic heads | grep -c '(head)')" -eq 1
          )
          git worktree remove /tmp/stage4-main --force
      - name: MySQL Base.metadata.create_all
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/stage4_create_all?charset=utf8mb4
        run: |
          python - <<'PY'
          import app.models as _registered_models
          from app.db.session import get_engine
          from app.models.base import Base
          Base.metadata.create_all(bind=get_engine())
          print(f"create_all tables={len(Base.metadata.tables)}")
          PY
      - name: 教务核心、权限身份、成绩补考名单评教归档与真实冒烟
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          COMMON=(
            tests/test_security_student_identity.py
            tests/test_portal_academic.py
            tests/test_p1_tenant_readonly_guard.py
            tests/test_p1_config_guards.py
            tests/test_p1_health_ops.py
          )
          while IFS= read -r file; do
            case " ${COMMON[*]} " in *" $file "*) ;; *) COMMON+=("$file") ;; esac
          done < <(find tests -maxdepth 1 -type f \( -name 'test_auth*.py' -o -name 'test_*request_context*.py' -o -name 'test_*context_security*.py' \) | sort)
          printf '附加公共认证/上下文测试：\n%s\n' "${COMMON[*]}"
          timeout 70m pytest -q tests/test_aa_*.py "${COMMON[@]}" -p no:warnings --durations=30

  teacher-pc:
    name: 教师／教务 PC test + lint + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  student-pc:
    name: 学生 PC lint + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist

  miniapp:
    name: 学生／教师小程序 H5 + 微信构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run build:h5
      - run: npm run build:mp-weixin
      - run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin

  cross-module-protection:
    name: 毕设／实习／学工／认证公共保护
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APP_ENV: test
      JWT_SECRET: stage4-cross-module-secret
      # 岗位实习历史测试夹具通过 /auth/mock-login 取得测试 JWT；
      # 生产关闭边界已在 backend-final-gate 使用 MOCK_LOGIN_ENABLED=false 独立验证。
      MOCK_LOGIN_ENABLED: "true"
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install cryptography
      - name: 控制面、菜单、权限与毕业设计静态闸门
        run: |
          python scripts/check/validate-module-manifest.py
          node scripts/check/generate-capability-registry.mjs
          python scripts/check/check-control-plane-contracts.py
          python scripts/check/check-student-sensitive-contracts.py
          node scripts/check/check-graduation-production-gates.mjs
      - name: 岗位实习关键验证
        working-directory: backend
        run: timeout 25m pytest tests/test_internship*.py -q -p no:warnings --durations=20
      - name: 学工公共权限、菜单与共享契约
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            tests/test_aa_main_permission_middleware_compat.py
            tests/test_aa_student_portal_route_main_compat.py
            tests/test_aa_miniapp_main_compat.py
          )
          while IFS= read -r file; do FILES+=("$file"); done < <(
            find tests -maxdepth 1 -type f \( \
              -name 'test_affairs_*permission*.py' -o \
              -name 'test_*student_affairs*contract*.py' -o \
              -name 'test_*menu*contract*.py' \
            \) | sort
          )
          timeout 20m pytest -q "${FILES[@]}" -p no:warnings --durations=20

  acceptance-summary:
    name: 第四阶段闸门汇总
    if: always()
    needs:
      - freeze-audit
      - backend-final-gate
      - teacher-pc
      - student-pc
      - miniapp
      - cross-module-protection
    runs-on: ubuntu-latest
    steps:
      - name: 汇总并强制全绿
        shell: bash
        env:
          FREEZE: ${{ needs.freeze-audit.result }}
          BACKEND: ${{ needs.backend-final-gate.result }}
          TEACHER_PC: ${{ needs.teacher-pc.result }}
          STUDENT_PC: ${{ needs.student-pc.result }}
          MINIAPP: ${{ needs.miniapp.result }}
          CROSS: ${{ needs.cross-module-protection.result }}
        run: |
          set -euo pipefail
          printf 'freeze=%s\nbackend=%s\nteacher_pc=%s\nstudent_pc=%s\nminiapp=%s\ncross=%s\n' \
            "$FREEZE" "$BACKEND" "$TEACHER_PC" "$STUDENT_PC" "$MINIAPP" "$CROSS" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$FREEZE" = success
          test "$BACKEND" = success
          test "$TEACHER_PC" = success
          test "$STUDENT_PC" = success
          test "$MINIAPP" = success
          test "$CROSS" = success
