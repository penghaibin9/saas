name: File center streaming blockers fix

on:
  push:
    branches:
      - audit/file-capability-inventory
    paths:
      - .github/workflows/file-center-streaming-blockers-fix.yml

permissions:
  contents: write

concurrency:
  group: file-center-streaming-blockers-fix
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert academic import parsing to validated local paths
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/modules/academic_affairs/services/academic_file_exchange_service.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import uuid\n', 'import uuid\nimport zipfile\n', 1)
          text = text.replace('from datetime import timedelta\n', 'from datetime import timedelta\nfrom pathlib import Path\n', 1)
          text = text.replace('from sqlalchemy import delete, select\n', 'from openpyxl import load_workbook\nfrom sqlalchemy import delete, select\n', 1)

          old = '''def _source_file_bytes(import_row, user: dict) -> bytes:\n    from app.models.file import FileObject\n    from app.services.file_scan_service import assert_file_ready_for_business\n    from app.services.storage import get_backend\n\n    if not import_row.source_file_id:\n        raise AppException("DATA_CONFLICT", "导入任务缺少原始文件，请重新上传")\n    assert_file_ready_for_business(str(import_row.source_file_id), user=user)\n    db = get_sessionmaker()()\n    try:\n        file_row = db.scalars(select(FileObject).where(\n            FileObject.id == int(import_row.source_file_id),\n            FileObject.tenant_id == jobs._tenant_id(),\n            FileObject.is_deleted.is_(False),\n        )).first()\n        if not file_row:\n            raise not_found("导入原始文件不存在")\n        if int(file_row.size_bytes or 0) > MAX_IMPORT_BYTES:\n            raise AppException("FILE_TOO_LARGE", "教务导入文件超过 20MB，请拆分后重试")\n        path = get_backend().fetch_local(file_row.file_key)\n        if not path or not path.exists():\n            raise not_found("导入原始文件不存在或已清理")\n        chunks: list[bytes] = []\n        size = 0\n        with path.open("rb") as handle:\n            while chunk := handle.read(1024 * 1024):\n                size += len(chunk)\n                if size > MAX_IMPORT_BYTES:\n                    raise AppException("FILE_TOO_LARGE", "教务导入文件超过 20MB，请拆分后重试")\n                chunks.append(chunk)\n        return b"".join(chunks)\n    finally:\n        db.close()\n\n\ndef _parse_and_validate(import_row, content: bytes, user: dict) -> tuple[list[dict], dict]:\n'''
          new = '''def _source_file_path(import_row, user: dict) -> Path:\n    from app.models.file import FileObject\n    from app.services.file_scan_service import assert_file_ready_for_business\n    from app.services.storage import get_backend\n\n    if not import_row.source_file_id:\n        raise AppException("DATA_CONFLICT", "导入任务缺少原始文件，请重新上传")\n    assert_file_ready_for_business(str(import_row.source_file_id), user=user)\n    db = get_sessionmaker()()\n    try:\n        file_row = db.scalars(select(FileObject).where(\n            FileObject.id == int(import_row.source_file_id),\n            FileObject.tenant_id == jobs._tenant_id(),\n            FileObject.is_deleted.is_(False),\n        )).first()\n        if not file_row:\n            raise not_found("导入原始文件不存在")\n        if int(file_row.size_bytes or 0) > MAX_IMPORT_BYTES:\n            raise AppException("FILE_TOO_LARGE", "教务导入文件超过 20MB，请拆分后重试")\n        source_path = get_backend().fetch_local(file_row.file_key)\n        if not source_path or not source_path.exists():\n            raise not_found("导入原始文件不存在或已清理")\n        source_path = Path(source_path)\n        if source_path.stat().st_size <= 0:\n            raise AppException("VALIDATION_ERROR", "导入文件不能为空")\n        if source_path.stat().st_size > MAX_IMPORT_BYTES:\n            raise AppException("FILE_TOO_LARGE", "教务导入文件超过 20MB，请拆分后重试")\n        return source_path\n    finally:\n        db.close()\n\n\ndef _read_xlsx_path(source_path: Path, header_map: dict[str, str]) -> list[dict]:\n    if not zipfile.is_zipfile(source_path):\n        raise AppException("VALIDATION_ERROR", "文件内容不是有效的 XLSX")\n    try:\n        with zipfile.ZipFile(source_path) as archive:\n            members = archive.infolist()\n            if len(members) > 2000:\n                raise AppException("VALIDATION_ERROR", "XLSX 内部文件数量异常")\n            uncompressed = 0\n            for member in members:\n                name = member.filename.replace("\\\\", "/").lower()\n                if name.startswith("/") or ".." in name.split("/"):\n                    raise AppException("VALIDATION_ERROR", "XLSX 包含非法路径")\n                uncompressed += member.file_size\n                if uncompressed > 50 * 1024 * 1024:\n                    raise AppException("VALIDATION_ERROR", "XLSX 解压后体积异常")\n                if member.file_size > 1024 * 1024 and member.compress_size > 0:\n                    if member.file_size / member.compress_size > 100:\n                        raise AppException("VALIDATION_ERROR", "XLSX 压缩比异常")\n                if (\n                    name.endswith(".bin")\n                    or "vbaproject" in name\n                    or "/embeddings/" in name\n                    or "/oleobjects/" in name\n                    or "/externallinks/" in name\n                ):\n                    raise AppException("VALIDATION_ERROR", "XLSX 不允许宏、嵌入对象或外部链接")\n    except zipfile.BadZipFile:\n        raise AppException("VALIDATION_ERROR", "文件内容不是有效的 XLSX") from None\n\n    workbook = load_workbook(source_path, read_only=True, data_only=True, keep_links=False)\n    try:\n        if len(workbook.worksheets) > 10:\n            raise AppException("VALIDATION_ERROR", "XLSX 工作表不得超过 10 个")\n        sheet = workbook["导入模板"] if "导入模板" in workbook.sheetnames else workbook.worksheets[0]\n        if sheet.max_column > 100:\n            raise AppException("VALIDATION_ERROR", "XLSX 单表列数不得超过 100")\n        if sheet.max_row > 5001:\n            raise AppException("VALIDATION_ERROR", "单次导入不得超过 5000 行")\n        iterator = sheet.iter_rows(values_only=True)\n        try:\n            header = next(iterator)\n        except StopIteration:\n            return []\n        index_map: dict[int, str] = {}\n        for index, value in enumerate(header):\n            title = str(value).strip() if value is not None else ""\n            title = title.rstrip(" *").strip()\n            if title in header_map:\n                index_map[index] = header_map[title]\n        rows: list[dict] = []\n        for values in iterator:\n            item: dict[str, str] = {}\n            empty = True\n            for index, key in index_map.items():\n                value = values[index] if index < len(values) else None\n                normalized = "" if value is None else str(value).strip()\n                item[key] = normalized\n                if normalized:\n                    empty = False\n            if not empty:\n                rows.append(item)\n            if len(rows) > 5000:\n                raise AppException("VALIDATION_ERROR", "单次导入不得超过 5000 行")\n        return rows\n    finally:\n        workbook.close()\n\n\ndef _parse_and_validate(import_row, source_path: Path, user: dict) -> tuple[list[dict], dict]:\n'''
          if old not in text:
              raise SystemExit('academic import source block changed unexpectedly')
          text = text.replace(old, new, 1)
          text = text.replace(
              'rows = roster.roster_import_read(content)',
              'rows = _read_xlsx_path(source_path, roster.build_roster_import_spec().header_map)',
          )
          text = text.replace(
              'rows = xlsx_util.read_xlsx(content, grade.IMPORT_HEADER_MAP)',
              'rows = _read_xlsx_path(source_path, grade.IMPORT_HEADER_MAP)',
          )
          text = text.replace(
              'rows = xlsx_util.read_xlsx(content, schedule.IMPORT_HEADER_MAP)',
              'rows = _read_xlsx_path(source_path, schedule.IMPORT_HEADER_MAP)',
          )
          text = text.replace('            content = _source_file_bytes(current, user)', '            source_path = _source_file_path(current, user)')
          text = text.replace('            rows, preview = _parse_and_validate(row, content, user)', '            rows, preview = _parse_and_validate(row, source_path, user)')
          text = text.replace('        content = _source_file_bytes(row, user)', '        source_path = _source_file_path(row, user)')
          text = text.replace('        rows, preview = _parse_and_validate(row, content, user)', '        rows, preview = _parse_and_validate(row, source_path, user)')
          if 'b"".join(chunks)' in text or '_source_file_bytes' in text:
              raise SystemExit('whole-buffer implementation still present')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile and run the unchanged strict scanner
        run: |
          python -m compileall -q backend/app/modules/academic_affairs/services/academic_file_exchange_service.py
          python scripts/audit_file_center_calls.py --strict --base-ref origin/main --json-report /tmp/file-center-call-scan.json

      - name: Commit the verified fix and remove this temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/file-center-streaming-blockers-fix.yml
          git add -- backend/app/modules/academic_affairs/services/academic_file_exchange_service.py
          git diff --cached --check
          git commit -m "fix(file-center): parse academic imports from validated paths"
          git push origin HEAD:audit/file-capability-inventory
