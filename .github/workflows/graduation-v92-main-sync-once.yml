name: TEMP Graduation V9.2 latest-main sync

on:
  push:
    branches:
      - 'ops/graduation-v92-main-sync-20260814'
    paths:
      - '.github/workflows/graduation-v92-main-sync-once.yml'

permissions:
  contents: write

env:
  EXPECTED_MAIN: '4293aaf9c3825f9856b288aff4ec439d4f9fc114'
  EXPECTED_GD_HEAD: 'ffe960490f1a8e27239b1906f965465714a1a772'
  TARGET_BRANCH: 'sync/graduation-v92-main-20260814'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed on branch drift
        shell: bash
        run: |
          set -euo pipefail
          main_remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          gd_remote="$(git ls-remote origin refs/heads/agent/graduation-v9-2-production-seal-20260813 | awk '{print $1}')"
          test "$main_remote" = "$EXPECTED_MAIN" || {
            echo "main drifted: expected=$EXPECTED_MAIN actual=$main_remote"
            exit 1
          }
          test "$gd_remote" = "$EXPECTED_GD_HEAD" || {
            echo "#105 drifted: expected=$EXPECTED_GD_HEAD actual=$gd_remote"
            exit 1
          }
          test -z "$(git ls-remote origin "refs/heads/$TARGET_BRANCH")" || {
            echo "target branch already exists: $TARGET_BRANCH"
            exit 1
          }

      - name: Merge latest main with exactly audited conflict set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --detach "$EXPECTED_GD_HEAD"
          git switch -c "$TARGET_BRANCH"

          set +e
          git merge --no-ff --no-commit "$EXPECTED_MAIN"
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'Conflicts:\n%s\n' "${conflicts[*]}"
            expected=(
              '.github/workflows/ci.yml'
              'e2e/specs/golden-rollout-material-evidence.spec.mjs'
            )
            if [ "${#conflicts[@]}" -ne 2 ] || [ "${conflicts[0]}" != "${expected[0]}" ] || [ "${conflicts[1]}" != "${expected[1]}" ]; then
              echo 'Unexpected merge conflict set; fail closed.'
              exit 1
            fi

            # Keep Graduation V9.2 five-shard CI topology, absorb #101 archive timeout 20m -> 25m.
            git checkout --ours .github/workflows/ci.yml
            python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          changed = 0
          for i, line in enumerate(lines):
              if line.strip() != 'archive)':
                  continue
              for j in range(i + 1, min(i + 5, len(lines))):
                  if 'timeout 20m pytest' in lines[j]:
                      lines[j] = lines[j].replace('timeout 20m pytest', 'timeout 25m pytest', 1)
                      changed += 1
                      break
          if changed != 1:
              raise SystemExit(f'Expected exactly one archive timeout replacement; got {changed}')
          p.write_text(''.join(lines), encoding='utf-8')
          PY

            # Both sides already encode the same explicit Graduation batchId; take latest-main formatting.
            git checkout --theirs e2e/specs/golden-rollout-material-evidence.spec.mjs
            git add .github/workflows/ci.yml e2e/specs/golden-rollout-material-evidence.spec.mjs
          fi

          test -z "$(git diff --name-only --diff-filter=U)"

          python - <<'PY'
          from pathlib import Path
          ci = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          material = Path('e2e/specs/golden-rollout-material-evidence.spec.mjs').read_text(encoding='utf-8')
          assert 'shard: [stage-c1, stage-c2, stage-c3, archive, p0]' in ci
          assert 'archive)\n              timeout 25m pytest' in ci
          assert '/admin/graduation/material-center?tab=students&batchId=${encodeURIComponent(graduationFixture.batchId)}' in material
          assert "setBatchStorage(page, 'graduation.selectedBatchId'" not in material
          print('Audited two-file semantic merge GREEN')
          PY

          git diff --check
          git status --short
          git commit -m 'merge: sync latest main into Graduation V9.2 seal'

          parents="$(git show -s --format='%P' HEAD)"
          set -- $parents
          test "$#" -eq 2
          test "$1" = "$EXPECTED_GD_HEAD"
          test "$2" = "$EXPECTED_MAIN"

          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "SYNC_HEAD=$(git rev-parse HEAD)"
