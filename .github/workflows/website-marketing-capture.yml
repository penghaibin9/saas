name: Website Marketing Capture

on:
  workflow_dispatch:
  push:
    branches: [agent/website-marketing-capture-20260821]
    paths:
      - 'e2e/specs/website-marketing-capture.spec.mjs'
      - '.github/workflows/website-marketing-capture.yml'

permissions:
  contents: write

concurrency:
  group: website-marketing-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: real stack / isolated data / Chromium screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: website_capture_e2e
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/website_capture_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/website_capture_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: website_capture_e2e
      REDIS_URL: redis://127.0.0.1:6379/15
      REDIS_KEY_PREFIX: website-capture
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: website-capture-only-not-production
      JWT_SECRET_KEY: website-capture-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_MINIAPP_BASE_URL: http://127.0.0.1:5188
      E2E_EXPECTED_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact capture head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json
            miniapp/package-lock.json

      - name: Install backend and migrate isolated database
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head

      - name: Seed isolated platform and browser fixtures
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py
          python scripts/e2e_seed_academic_b_selection.py
          python scripts/e2e_seed_academic_b_w3_schedule.py
          python scripts/e2e_seed_academic_b_w4_selection.py
          python scripts/e2e_seed_academic_b_w4_formation.py

      - name: Start backend
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs website-assets/screenshots
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Bootstrap dedicated interaction accounts
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py
          python scripts/e2e_bootstrap_affairs_counselor_ci.py
          python scripts/e2e_seed_academic_b_w5_selection.py
          python scripts/e2e_seed_internship_sandbox.py

      - name: Best-effort enrich screenshot-only test data
        working-directory: backend
        run: |
          set -u
          for pattern in \
            'scripts/e2e_seed_*orientation*.py' \
            'scripts/e2e_seed_*graduation*.py' \
            'scripts/e2e_seed_*student_affairs*.py' \
            'scripts/e2e_seed_*affairs*.py'; do
            for script in $pattern; do
              [ -f "$script" ] || continue
              case "$script" in
                *playwright_tenants.py|*academic*) continue ;;
              esac
              echo "::notice::optional website fixture: $script"
              python "$script" || echo "::warning::optional fixture skipped: $script"
            done
          done
          exit 0

      - name: Install and start staff PC
        run: |
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend.pid

      - name: Install and start student PC
        env:
          VITE_BASE: /portal/
          VITE_API_BASE_URL: /
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd student-portal
          npm ci --no-audit --no-fund
          nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-portal.log 2>&1 &
          echo $! > ../e2e/runtime-logs/student-portal.pid

      - name: Install and start miniapp H5
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd miniapp
          npm ci --no-audit --no-fund
          nohup npm run dev:h5 -- --host 127.0.0.1 --port 5188 > ../e2e/runtime-logs/miniapp.log 2>&1 &
          echo $! > ../e2e/runtime-logs/miniapp.pid

      - name: Wait for browser applications
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login http://127.0.0.1:5188/; do
            ok=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "Application not ready: $url"
              cat e2e/runtime-logs/*.log
              exit 1
            fi
          done

      - name: Install Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Capture website marketing screenshots
        working-directory: e2e
        run: npx playwright test specs/website-marketing-capture.spec.mjs --reporter=line

      - name: Persist website assets to capture branch
        if: always()
        run: |
          set -euo pipefail
          SRC='e2e/test-results/website-assets'
          if [ ! -d "$SRC" ]; then
            echo '::warning::No website assets directory was produced.'
            exit 0
          fi
          rm -rf website-assets
          cp -R "$SRC" website-assets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website-assets
          if git diff --cached --quiet; then
            echo 'No website asset changes to commit.'
            exit 0
          fi
          git commit -m 'chore: persist website marketing captures [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload website asset package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yueke-website-assets-${{ github.sha }}
          path: website-assets/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yueke-website-capture-diagnostics-${{ github.sha }}
          path: |
            e2e/test-results/
            e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
