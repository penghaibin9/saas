name: Student Affairs Leave Cutover PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: student-affairs-leave-cutover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-audit:
    if: github.head_ref == 'codex/student-affairs-leave-cutover-20260727' || github.ref_name == 'codex/student-affairs-leave-cutover-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/student-affairs-leave-cutover-20260727
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply cuts repairs and request merge
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            python scripts/maintenance/student_affairs_leave_cutover_followup.py
            python scripts/maintenance/repair_affairs_leave_tests.py
            python scripts/maintenance/repair_affairs_validation_round2.py
            python scripts/maintenance/repair_affairs_validation_round3.py
            python scripts/maintenance/repair_affairs_explicit_contracts_round4.py
            python scripts/maintenance/repair_affairs_remaining_round5.py
            python scripts/maintenance/repair_affairs_sensitive_scope_round6.py
            python scripts/maintenance/repair_affairs_bigdata_round7.py
            python scripts/maintenance/fix_round8_whitespace_matching.py
            python scripts/maintenance/repair_affairs_runtime_tests_round8.py
            python scripts/maintenance/repair_affairs_funding_round9.py
            python scripts/maintenance/repair_affairs_cockpit_round10.py
            python scripts/maintenance/repair_affairs_residual_round11.py
            python scripts/maintenance/fix_request_resolver_anchor.py
            python scripts/maintenance/resolve_student_affairs_request_conflicts.py
          } 2>&1 | tee leave-cutover.log
          status=${PIPESTATUS[0]}
          tail -n 420 leave-cutover.log
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leave-cutover-audit
          path: |
            leave-cutover.log
            leave-test-audit.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Static and syntax re-audit
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n "serviceKey: ['\"]LEAVE['\"]" -- student-portal/src miniapp/src backend/tests frontend/tests
          ! git grep -n "/campus-service/leaves" -- backend/app backend/tests frontend/src frontend/tests student-portal/src miniapp/src
          ! git grep -n "/admin/campus-service/leave" -- frontend/src frontend/tests backend/tests student-portal/src miniapp/src
          ! git grep -n "affairs_test_compat\|affairs_test_diagnostics\|affairs_test_legacy_inputs" -- backend/pytest.ini backend/tests
          git grep -n "/admin/student-affairs/leave" -- frontend/src/config frontend/src/modules/campusService
          git grep -n "portal/affairs/leave\|mobile/affairs/leave" -- backend/app/api/v1/affairs_leave_self_api.py student-portal/src miniapp/src
          git grep -n "refreshOnce" -- student-portal/src/services/request.js
          git grep -n "GD_TEMP_FILES_KEY" -- student-portal/src/services/request.js
          git grep -n "realUpload\|realDownload" -- miniapp/src/services/request.js
          git grep -n "GD_TEACHER_BATCH_KEY\|collectTeacherGraduationPages" -- miniapp/src/services/request.js
          python -m compileall -q backend/app backend/tests backend/affairs_contract_test_support.py scripts/maintenance
          node --check student-portal/src/services/request.js
          node --check miniapp/src/services/request.js
          node --check student-portal/src/services/portalApi.js
          node --check miniapp/src/services/realApi.js
          node --check miniapp/src/services/studentApi.js
      - name: Commit repair chain
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -u
          git add backend/app backend/tests backend/pytest.ini backend/affairs_contract_test_support.py frontend/src frontend/tests student-portal/src miniapp/src scripts/maintenance
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
          else
            git commit -m "fix(student-affairs): complete explicit contracts after main sync"
            git pull --rebase origin codex/student-affairs-leave-cutover-20260727
            git push origin HEAD:codex/student-affairs-leave-cutover-20260727
          fi
