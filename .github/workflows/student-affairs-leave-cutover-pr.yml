name: Student Affairs Leave Cutover PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-audit:
    if: github.head_ref == 'codex/student-affairs-leave-cutover-20260727' || github.ref_name == 'codex/student-affairs-leave-cutover-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/student-affairs-leave-cutover-20260727
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply cuts and audit callers/tests
        shell: bash
        run: |
          set +e
          {
            python scripts/maintenance/student_affairs_leave_cutover_followup.py
            python scripts/maintenance/repair_affairs_leave_tests.py
            python scripts/maintenance/repair_affairs_validation_round2.py
            python scripts/maintenance/repair_affairs_validation_round3.py
          } 2>&1 | tee leave-cutover.log
          status=${PIPESTATUS[0]}
          tail -n 260 leave-cutover.log
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leave-cutover-audit
          path: |
            leave-cutover.log
            leave-test-audit.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Static and syntax re-audit
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n "serviceKey: ['\"]LEAVE['\"]" -- student-portal/src miniapp/src backend/tests frontend/tests
          ! git grep -n "/campus-service/leaves" -- backend/app backend/tests frontend/src frontend/tests student-portal/src miniapp/src
          ! git grep -n "/admin/campus-service/leave" -- frontend/src frontend/tests backend/tests student-portal/src miniapp/src
          ! git grep -n "affairs_test_compat\|affairs_test_diagnostics\|affairs_test_legacy_inputs" -- backend/pytest.ini backend/tests
          git grep -n "/admin/student-affairs/leave" -- frontend/src/config frontend/src/modules/campusService
          git grep -n "portal/affairs/leave\|mobile/affairs/leave" -- backend/app/api/v1/affairs_leave_self_api.py student-portal/src miniapp/src
          python -m compileall -q backend/app backend/tests
          node --check student-portal/src/services/portalApi.js
          node --check miniapp/src/services/realApi.js
          node --check miniapp/src/services/studentApi.js
      - name: Commit cutover changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app backend/tests backend/pytest.ini frontend/src frontend/tests student-portal/src miniapp/src scripts/maintenance
          if git diff --cached --quiet; then
            echo "No cutover changes to commit"
          else
            git commit -m "refactor(student-affairs): complete leave cutover and repair tests"
            git push origin HEAD:codex/student-affairs-leave-cutover-20260727
          fi
