name: Academic C W3 Invigilation Targeted

on:
  push:
    branches:
      - agent/academic-c-teaching-execution
    paths:
      - 'backend/app/modules/academic_affairs/services/academic_affairs_invigilation_workbench_service.py'
      - 'backend/tests/test_aa_exam_invigilation_workbench_contract.py'
      - '.github/workflows/academic-c-w3-invigilation-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-c-w3-invigilation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invigilation-workbench:
    name: canonical invigilation projection / MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      JWT_SECRET: academic-c-w3-invigilation-targeted-secret
      DB_ENABLED: 'true'
      MOCK_LOGIN_ENABLED: 'true'
      FAST_TEST_SCHEMA: '1'
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install cryptography
      - name: Compile C-W3 invigilation projection
        working-directory: backend
        run: python -m py_compile app/modules/academic_affairs/services/academic_affairs_invigilation_workbench_service.py tests/test_aa_exam_invigilation_workbench_contract.py
      - name: C-W3 canonical invigilation exact contract on MySQL
        working-directory: backend
        run: pytest -q tests/test_aa_exam_invigilation_workbench_contract.py -p no:warnings --durations=10
      - name: Prove invigilation workbench is read-only
        working-directory: backend
        run: |
          python - <<'PY'
          import inspect
          from app.modules.academic_affairs.services import academic_affairs_invigilation_workbench_service as svc
          source = inspect.getsource(svc)
          forbidden = ('db.add(', 'db.flush(', 'db.commit(', 'AaExamInvigilator(', 'UnifiedTodo', 'freeze_consumer_snapshot')
          bad = [value for value in forbidden if value in source]
          if bad:
              raise SystemExit('C-W3 invigilation read-only invariant violated: ' + ', '.join(bad))
          print('C-W3 invigilation read-only invariant=ok')
          PY
