name: Internship Standalone Five Surface Final Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/internship-standalone-yiyang-v1
    paths:
      - ".github/workflows/internship-standalone-five-surface-final.yml"

jobs:
  backend:
    name: Backend standalone import
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: products/internship-platform/backend/requirements.txt
      - name: Install backend
        run: python -m pip install -r products/internship-platform/backend/requirements.txt
      - name: Verify backend import closure
        env:
          PYTHONPATH: products/internship-platform/backend
        run: |
          python products/internship-platform/scripts/check_w2_import_closure.py
          python -c "import app.main; print('standalone backend import: OK')"

  admin-pc:
    name: Admin teacher PC build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build admin teacher PC
        working-directory: products/internship-platform/admin-web
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          echo "admin-pc $(du -sh dist | cut -f1)"

  student-pc:
    name: Student PC build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build student PC under /student/
        working-directory: products/internship-platform/student-web
        run: |
          grep -q "base: env.VITE_BASE || '/student/'" vite.config.js
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          grep -Eq "/student/assets/" dist/index.html
          echo "student-pc $(du -sh dist | cut -f1)"

  enterprise:
    name: Enterprise collaboration build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: products/internship-platform/enterprise-web/package-lock.json
      - name: Test and build enterprise portal under /enterprise/
        working-directory: products/internship-platform/enterprise-web
        run: |
          grep -q "base: env.VITE_BASE || '/enterprise/'" vite.config.js
          npm ci
          npm test
          npm run build
          test -s dist/index.html
          grep -Eq "/enterprise/assets/" dist/index.html
          echo "enterprise $(du -sh dist | cut -f1)"

  mobile:
    name: Student teacher WeChat build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify student and teacher mobile source closure
        run: |
          python products/internship-platform/scripts/check_mobile_import_closure.py
          grep -q '"path": "pages/student-internship/index"' products/internship-platform/mobile/src/pages.json
          grep -q '"path": "pages/teacher-internship/internship-students/index"' products/internship-platform/mobile/src/pages.json
      - name: Build WeChat mini program
        working-directory: products/internship-platform/mobile
        run: |
          npm install --no-audit --no-fund
          npm run build:mp-weixin
          test -d dist/build/mp-weixin
          test -s dist/build/mp-weixin/app.json
          echo "mobile-mp-weixin $(du -sh dist/build/mp-weixin | cut -f1)"

  five-surface:
    name: Five-surface build verdict
    runs-on: ubuntu-latest
    needs: [backend, admin-pc, student-pc, enterprise, mobile]
    steps:
      - name: Record build-only verdict
        run: |
          echo "Backend + admin/teacher PC + student PC + student/teacher WeChat + enterprise portal contract/build gates passed."
          echo "This is a source/build gate only. Browser UAT, WeChat developer-tool/real-phone UAT and formal 5000-VU G20 remain separate evidence gates."
