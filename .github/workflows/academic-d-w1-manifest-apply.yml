name: Academic D W1 manifest alignment

on:
  push:
    branches:
      - agent/academic-d-graduation-delivery
    paths:
      - '.github/workflows/academic-d-w1-manifest-apply.yml'

permissions:
  contents: write

jobs:
  manifest-four-state:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      PYTHONUNBUFFERED: '1'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-d-graduation-delivery
          fetch-depth: 0
      - name: Apply W1 manifest alignment
        run: python .github/scripts/academic_d_w1_manifest_apply.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: W1 manifest and four-state contracts
        working-directory: backend
        run: |
          pytest \
            tests/test_aa_archive_d_w1_contract.py \
            tests/test_aa_archive_semantic_gates.py \
            -q -p no:warnings
      - name: Diff integrity
        run: git diff --check
      - name: Commit W1 manifest alignment and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/app/modules/academic_affairs/services/academic_affairs_archive_manifest_service.py \
            backend/tests/test_aa_archive_d_w1_contract.py
          git rm .github/scripts/academic_d_w1_manifest_apply.py .github/workflows/academic-d-w1-manifest-apply.yml
          git commit -m 'fix(academic-d): align archive manifest with four-state gate'
          git push origin HEAD:agent/academic-d-graduation-delivery
