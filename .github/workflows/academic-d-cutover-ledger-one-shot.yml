name: Academic D Cutover Ledger One Shot

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/academic-d-cutover-ledger-one-shot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-d-cutover-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mysql-cutover-ledger:
    name: Real MySQL 8 cutover ledger and T0 writer handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUTOVER_OWNER: academic-d
      CUTOVER_EVIDENCE_FILE: /tmp/academic-d-cutover-ledger-evidence.txt

    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Start isolated MySQL 8
        run: |
          set -euo pipefail
          docker run -d --name academic-d-cutover-mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -p 3307:3306 \
            mysql:8.0
          for i in $(seq 1 60); do
            if MYSQL_PWD=root mysql --protocol=tcp -h127.0.0.1 -P3307 -uroot -Nse 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs academic-d-cutover-mysql
          exit 1

      - name: Build source and target with an initial snapshot
        run: |
          set -euo pipefail
          MYSQL=(mysql --protocol=tcp -h127.0.0.1 -P3307 -uroot -proot --batch --raw --skip-column-names)
          "${MYSQL[@]}" <<'SQL'
          DROP DATABASE IF EXISTS academic_d_cutover_source;
          DROP DATABASE IF EXISTS academic_d_cutover_target;
          CREATE DATABASE academic_d_cutover_source CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE DATABASE academic_d_cutover_target CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

          CREATE TABLE academic_d_cutover_source.t_d_w4_cutover_probe (
            id BIGINT PRIMARY KEY,
            version_no INT NOT NULL,
            payload VARCHAR(120) NOT NULL,
            updated_at DATETIME(6) NOT NULL
          ) ENGINE=InnoDB;
          INSERT INTO academic_d_cutover_source.t_d_w4_cutover_probe(id, version_no, payload, updated_at)
          VALUES
            (1, 1, 'SOURCE_BASELINE_A', UTC_TIMESTAMP(6)),
            (2, 1, 'SOURCE_BASELINE_B', UTC_TIMESTAMP(6));

          CREATE TABLE academic_d_cutover_target.t_d_w4_cutover_probe
            LIKE academic_d_cutover_source.t_d_w4_cutover_probe;
          INSERT INTO academic_d_cutover_target.t_d_w4_cutover_probe
          SELECT * FROM academic_d_cutover_source.t_d_w4_cutover_probe;

          CREATE USER 'academic_d_legacy'@'%' IDENTIFIED BY 'legacy';
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON academic_d_cutover_source.* TO 'academic_d_legacy'@'%';
          SQL

          INITIAL_ROWS="$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM academic_d_cutover_source.t_d_w4_cutover_probe")"
          INITIAL_SOURCE_DIGEST="$("${MYSQL[@]}" -e "SELECT SHA2(GROUP_CONCAT(CONCAT_WS(':', id, version_no, payload) ORDER BY id SEPARATOR '|'), 256) FROM academic_d_cutover_source.t_d_w4_cutover_probe")"
          INITIAL_TARGET_DIGEST="$("${MYSQL[@]}" -e "SELECT SHA2(GROUP_CONCAT(CONCAT_WS(':', id, version_no, payload) ORDER BY id SEPARATOR '|'), 256) FROM academic_d_cutover_target.t_d_w4_cutover_probe")"
          test "$INITIAL_ROWS" = "2"
          test -n "$INITIAL_SOURCE_DIGEST"
          test "$INITIAL_SOURCE_DIGEST" = "$INITIAL_TARGET_DIGEST"
          {
            echo "INITIAL_ROWS=$INITIAL_ROWS"
            echo "INITIAL_SOURCE_DIGEST=$INITIAL_SOURCE_DIGEST"
            echo "INITIAL_TARGET_DIGEST=$INITIAL_TARGET_DIGEST"
          } >> "$GITHUB_ENV"

      - name: Apply final pre-T0 delta and prove zero-diff convergence
        run: |
          set -euo pipefail
          MYSQL=(mysql --protocol=tcp -h127.0.0.1 -P3307 -uroot -proot --batch --raw --skip-column-names)
          "${MYSQL[@]}" <<'SQL'
          UPDATE academic_d_cutover_source.t_d_w4_cutover_probe
             SET version_no=2, payload='SOURCE_FINAL_DELTA_A', updated_at=UTC_TIMESTAMP(6)
           WHERE id=1;
          INSERT INTO academic_d_cutover_source.t_d_w4_cutover_probe(id, version_no, payload, updated_at)
          VALUES (3, 1, 'SOURCE_FINAL_DELTA_C', UTC_TIMESTAMP(6));
          SQL

          CONFLICTS="$("${MYSQL[@]}" -e "
            SELECT COUNT(*)
              FROM academic_d_cutover_source.t_d_w4_cutover_probe s
              JOIN academic_d_cutover_target.t_d_w4_cutover_probe t ON t.id=s.id
             WHERE t.version_no > s.version_no
                OR (t.version_no=s.version_no AND t.payload<>s.payload)
          ")"
          test "$CONFLICTS" = "0"

          FINAL_DELTA_ROWS="$("${MYSQL[@]}" -e "
            SELECT COUNT(*)
              FROM academic_d_cutover_source.t_d_w4_cutover_probe s
              LEFT JOIN academic_d_cutover_target.t_d_w4_cutover_probe t ON t.id=s.id
             WHERE t.id IS NULL OR t.version_no<>s.version_no OR t.payload<>s.payload
          ")"
          test "$FINAL_DELTA_ROWS" = "2"

          "${MYSQL[@]}" <<'SQL'
          INSERT INTO academic_d_cutover_target.t_d_w4_cutover_probe(id, version_no, payload, updated_at)
          SELECT id, version_no, payload, updated_at
            FROM academic_d_cutover_source.t_d_w4_cutover_probe
          ON DUPLICATE KEY UPDATE
            version_no=VALUES(version_no),
            payload=VALUES(payload),
            updated_at=VALUES(updated_at);
          SQL

          T0_SOURCE_DIGEST="$("${MYSQL[@]}" -e "SELECT SHA2(GROUP_CONCAT(CONCAT_WS(':', id, version_no, payload) ORDER BY id SEPARATOR '|'), 256) FROM academic_d_cutover_source.t_d_w4_cutover_probe")"
          T0_TARGET_DIGEST="$("${MYSQL[@]}" -e "SELECT SHA2(GROUP_CONCAT(CONCAT_WS(':', id, version_no, payload) ORDER BY id SEPARATOR '|'), 256) FROM academic_d_cutover_target.t_d_w4_cutover_probe")"
          T0_DIFF_ROWS="$("${MYSQL[@]}" -e "
            SELECT
              (SELECT COUNT(*)
                 FROM academic_d_cutover_source.t_d_w4_cutover_probe s
                 LEFT JOIN academic_d_cutover_target.t_d_w4_cutover_probe t ON t.id=s.id
                WHERE t.id IS NULL OR t.version_no<>s.version_no OR t.payload<>s.payload)
              +
              (SELECT COUNT(*)
                 FROM academic_d_cutover_target.t_d_w4_cutover_probe t
                 LEFT JOIN academic_d_cutover_source.t_d_w4_cutover_probe s ON s.id=t.id
                WHERE s.id IS NULL)
          ")"
          test "$T0_SOURCE_DIGEST" = "$T0_TARGET_DIGEST"
          test "$T0_DIFF_ROWS" = "0"
          T0_UTC="$("${MYSQL[@]}" -e "SELECT DATE_FORMAT(UTC_TIMESTAMP(6), '%Y-%m-%dT%H:%i:%s.%fZ')")"
          {
            echo "CONFLICTS=$CONFLICTS"
            echo "FINAL_DELTA_ROWS=$FINAL_DELTA_ROWS"
            echo "T0_SOURCE_DIGEST=$T0_SOURCE_DIGEST"
            echo "T0_TARGET_DIGEST=$T0_TARGET_DIGEST"
            echo "T0_DIFF_ROWS=$T0_DIFF_ROWS"
            echo "T0_UTC=$T0_UTC"
          } >> "$GITHUB_ENV"

      - name: Enforce T0 old-system read-only and new-system-only writes
        run: |
          set -euo pipefail
          MYSQL=(mysql --protocol=tcp -h127.0.0.1 -P3307 -uroot -proot --batch --raw --skip-column-names)
          "${MYSQL[@]}" -e "REVOKE INSERT, UPDATE, DELETE ON academic_d_cutover_source.* FROM 'academic_d_legacy'@'%'"

          if MYSQL_PWD=legacy mysql --protocol=tcp -h127.0.0.1 -P3307 \
              -uacademic_d_legacy academic_d_cutover_source \
              -e "UPDATE t_d_w4_cutover_probe SET payload='ILLEGAL_POST_T0_WRITE' WHERE id=1" \
              >/tmp/academic-d-cutover-legacy-write.out \
              2>/tmp/academic-d-cutover-legacy-write.err; then
            echo "legacy writer unexpectedly retained post-T0 write access" >&2
            exit 1
          fi
          test -s /tmp/academic-d-cutover-legacy-write.err
          test "$(MYSQL_PWD=legacy mysql --protocol=tcp -h127.0.0.1 -P3307 \
            -uacademic_d_legacy --batch --raw --skip-column-names \
            -e "SELECT COUNT(*) FROM academic_d_cutover_source.t_d_w4_cutover_probe")" = "3"

          "${MYSQL[@]}" -e "
            INSERT INTO academic_d_cutover_target.t_d_w4_cutover_probe(id, version_no, payload, updated_at)
            VALUES (4, 1, 'NEW_SYSTEM_AFTER_T0', UTC_TIMESTAMP(6))
          "

          T_PLUS_1_SOURCE_DIGEST="$("${MYSQL[@]}" -e "SELECT SHA2(GROUP_CONCAT(CONCAT_WS(':', id, version_no, payload) ORDER BY id SEPARATOR '|'), 256) FROM academic_d_cutover_source.t_d_w4_cutover_probe")"
          T_PLUS_1_SOURCE_ROWS="$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM academic_d_cutover_source.t_d_w4_cutover_probe")"
          T_PLUS_1_TARGET_ROWS="$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM academic_d_cutover_target.t_d_w4_cutover_probe")"
          NEW_SYSTEM_POST_T0_ROWS="$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM academic_d_cutover_target.t_d_w4_cutover_probe WHERE id=4 AND payload='NEW_SYSTEM_AFTER_T0'")"
          ILLEGAL_SOURCE_ROWS="$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM academic_d_cutover_source.t_d_w4_cutover_probe WHERE payload='ILLEGAL_POST_T0_WRITE'")"
          test "$T_PLUS_1_SOURCE_DIGEST" = "$T0_SOURCE_DIGEST"
          test "$T_PLUS_1_SOURCE_ROWS" = "3"
          test "$T_PLUS_1_TARGET_ROWS" = "4"
          test "$NEW_SYSTEM_POST_T0_ROWS" = "1"
          test "$ILLEGAL_SOURCE_ROWS" = "0"
          T_PLUS_1_UTC="$("${MYSQL[@]}" -e "SELECT DATE_FORMAT(UTC_TIMESTAMP(6), '%Y-%m-%dT%H:%i:%s.%fZ')")"

          cat > "$CUTOVER_EVIDENCE_FILE" <<EVIDENCE
source=academic_d_cutover_source.t_d_w4_cutover_probe
source_digest=$T0_SOURCE_DIGEST
initial_digest=$INITIAL_SOURCE_DIGEST
initial_rows=$INITIAL_ROWS
initial_target_digest=$INITIAL_TARGET_DIGEST
conflicts=$CONFLICTS
final_delta_rows=$FINAL_DELTA_ROWS
t0_utc=$T0_UTC
t0_source_digest=$T0_SOURCE_DIGEST
t0_target_digest=$T0_TARGET_DIGEST
t0_diff_rows=$T0_DIFF_ROWS
legacy_writer=academic_d_legacy
legacy_post_t0_write_rejected=true
legacy_source_read_only=true
t_plus_1_utc=$T_PLUS_1_UTC
source_digest_t_plus_1=$T_PLUS_1_SOURCE_DIGEST
source_rows_t_plus_1=$T_PLUS_1_SOURCE_ROWS
target_rows_t_plus_1=$T_PLUS_1_TARGET_ROWS
source_unchanged_t_plus_1=true
new_system_post_t0_rows=$NEW_SYSTEM_POST_T0_ROWS
new_system_only_writer=true
owner=$CUTOVER_OWNER
sign_off=true
source_commit=${GITHUB_SHA:-unknown}
workflow_run_id=${GITHUB_RUN_ID:-manual}
EVIDENCE

          grep -Fqx 'source=academic_d_cutover_source.t_d_w4_cutover_probe' "$CUTOVER_EVIDENCE_FILE"
          grep -Eq '^source_digest=[0-9a-f]{64}$' "$CUTOVER_EVIDENCE_FILE"
          grep -Eq '^initial_digest=[0-9a-f]{64}$' "$CUTOVER_EVIDENCE_FILE"
          grep -Eq '^initial_rows=[1-9][0-9]*$' "$CUTOVER_EVIDENCE_FILE"
          grep -Fqx 'conflicts=0' "$CUTOVER_EVIDENCE_FILE"
          grep -Eq '^final_delta_rows=[1-9][0-9]*$' "$CUTOVER_EVIDENCE_FILE"
          grep -Fqx 't0_diff_rows=0' "$CUTOVER_EVIDENCE_FILE"
          grep -Fqx 'legacy_post_t0_write_rejected=true' "$CUTOVER_EVIDENCE_FILE"
          grep -Fqx 'legacy_source_read_only=true' "$CUTOVER_EVIDENCE_FILE"
          grep -Fqx 'source_unchanged_t_plus_1=true' "$CUTOVER_EVIDENCE_FILE"
          grep -Fqx 'new_system_only_writer=true' "$CUTOVER_EVIDENCE_FILE"
          grep -Fqx 'owner=academic-d' "$CUTOVER_EVIDENCE_FILE"
          grep -Fqx 'sign_off=true' "$CUTOVER_EVIDENCE_FILE"

          cd "$(dirname "$CUTOVER_EVIDENCE_FILE")"
          sha256sum "$(basename "$CUTOVER_EVIDENCE_FILE")" > "$(basename "$CUTOVER_EVIDENCE_FILE").sha256"
          sha256sum -c "$(basename "$CUTOVER_EVIDENCE_FILE").sha256"

      - name: Upload D-W4 cutover ledger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-d-cutover-ledger-${{ github.run_id }}
          path: |
            /tmp/academic-d-cutover-ledger-evidence.txt
            /tmp/academic-d-cutover-ledger-evidence.txt.sha256
            /tmp/academic-d-cutover-legacy-write.err
          if-no-files-found: warn
          retention-days: 30
