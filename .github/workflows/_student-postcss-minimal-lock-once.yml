name: Student PostCSS minimal lock once

on:
  push:
    branches: ["feat/adaptive-login-captcha-20260805"]
    paths:
      - ".github/workflows/_student-postcss-minimal-lock-once.yml"

permissions:
  contents: write

concurrency:
  group: student-postcss-minimal-lock-once
  cancel-in-progress: true

jobs:
  rebuild-validate-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-login-captcha-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - name: Rebuild and validate minimal security lock
        working-directory: student-portal
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --omit=dev --audit-level=high
          npm ls vite@5.4.21 postcss@8.5.23
          npm run lint
          npm test
          npm run build
      - name: Commit lock and self-clean
        run: |
          rm .github/workflows/_student-postcss-minimal-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-portal/package-lock.json .github/workflows/_student-postcss-minimal-lock-once.yml
          git commit -m "fix(student-portal): refresh minimal patched dependency lock"
          git fetch origin feat/adaptive-login-captcha-20260805
          git rebase origin/feat/adaptive-login-captcha-20260805
          git push origin HEAD:feat/adaptive-login-captcha-20260805
