name: Release governance contracts

on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/**'
      - 'deploy/backup/**'
      - 'deploy/systemd/**'
      - 'deploy/env/backup.env.example'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'deploy/backup/**'
      - 'deploy/systemd/**'
      - 'deploy/env/backup.env.example'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    name: Permanent release governance contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Reject obsolete one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/package11-closeout-patch.yml
          test ! -e .github/workflows/file-center-final-merge-closeout-v3.yml
          test ! -e .github/workflows/_miniapp-security-refresh.yml
      - name: Require Node 24 in long-lived workflows
        shell: bash
        run: |
          set -euo pipefail
          BAD="$(grep -R -nE 'node-version:[[:space:]]*["'"'"']?(20|22)["'"'"']?([[:space:]]|$)' .github/workflows || true)"
          if [ -n "$BAD" ]; then
            echo 'Long-lived workflows still pin unsupported/older Node runtimes:'
            echo "$BAD"
            exit 1
          fi
          echo 'All explicit workflow Node runtimes are pinned to Node 24.'
      - name: Require current official Actions runtimes
        shell: bash
        run: |
          set -euo pipefail
          BAD="$(grep -R -nE 'actions/(checkout@v[1-6]|setup-node@v[1-6]|setup-python@v[1-6]|upload-artifact@v[1-6]|download-artifact@v[1-7])' .github/workflows || true)"
          if [ -n "$BAD" ]; then
            echo 'Deprecated official Actions runtime returned:'
            echo "$BAD"
            exit 1
          fi
          echo 'Official checkout/setup/upload/download actions use the current Node-24-era major versions.'
      - name: Require hardened production backup service
        shell: bash
        run: |
          set -euo pipefail
          UNIT=deploy/systemd/school-lifecycle-backup.service
          ENV_EXAMPLE=deploy/env/backup.env.example
          RUNNER=deploy/backup/backup-runner.sh
          test -f "$UNIT"
          test -f "$ENV_EXAMPLE"
          test -f "$RUNNER"
          grep -q '^ProtectHome=true$' "$UNIT"
          grep -q '^Environment=RCLONE_CONFIG=/etc/school-lifecycle/rclone.conf$' "$UNIT"
          grep -q '^Environment=REQUIRE_UPLOAD_BACKUP=1$' "$UNIT"
          grep -q '^Environment=BACKUP_REQUIRE_OFFSITE=true$' "$UNIT"
          grep -q '^Environment=BACKUP_REQUIRE_IMMUTABLE_REMOTE=true$' "$UNIT"
          grep -q '^ReadOnlyPaths=/etc/school-lifecycle/rclone.conf$' "$UNIT"
          grep -q '^RCLONE_CONFIG=/etc/school-lifecycle/rclone.conf$' "$ENV_EXAMPLE"
          grep -q '^REQUIRE_UPLOAD_BACKUP=1$' "$ENV_EXAMPLE"
          grep -q '^BACKUP_REQUIRE_IMMUTABLE_REMOTE=true$' "$ENV_EXAMPLE"
          grep -q '^BACKUP_IMMUTABLE_REMOTE_CONFIRMED=false$' "$ENV_EXAMPLE"
          grep -q 'rclone .* cat' "$RUNNER"
          grep -q 'remote_hash=' "$RUNNER"
          echo 'Production backup unit is pinned to explicit credentials, required uploads, offsite storage and immutable-storage attestation.'
      - name: Require canonical post-merge main gate
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/workflows/main-post-merge-acceptance.yml
          test -f "$FILE"
          grep -q '^name: Main post-merge acceptance$' "$FILE"
          grep -q '^  pull_request:$' "$FILE"
          grep -q 'branches: \[main\]' "$FILE"
          PR_TRIGGER="$(awk '/^  pull_request:/{flag=1; next} flag && /^  [[:alnum:]_-]+:/{flag=0} flag{print}' "$FILE")"
          if grep -q '^[[:space:]]*paths:' <<<"$PR_TRIGGER"; then
            echo '::error::Main / canonical release gate is globally required and must not be suppressed by pull_request.paths.'
            exit 1
          fi
          grep -q '^    name: Main / protected branch contract$' "$FILE"
          grep -q 'rules/branches/main' "$FILE"
          grep -q 'branches/main/protection' "$FILE"
          grep -q 'main.effective_rules=' "$FILE"
          grep -q 'strict_required_status_checks_policy' "$FILE"
          grep -q 'required_status_checks.strict == true' "$FILE"
          grep -q 'required_pull_request_reviews != null' "$FILE"
          grep -q 'enforce_admins.enabled == true' "$FILE"
          grep -q 'allow_force_pushes.enabled == false' "$FILE"
          grep -q 'allow_deletions.enabled == false' "$FILE"
          grep -q 'Main / canonical release gate' "$FILE"
          grep -q '^    name: Main / canonical release gate$' "$FILE"
          grep -q 'needs: \[main-governance,' "$FILE"
          echo 'Canonical main gate is permanently wired to every main PR; Ruleset and classic-protection paths are both strict and fail closed.'
