name: Graduation material closeout apply once

on:
  push:
    branches:
      - fix/graduation-material-closeout-p0-review
    paths:
      - scripts/apply_graduation_archived_rule_closeout.py
      - .github/workflows/graduation-material-closeout-apply-once.yml

permissions:
  contents: write

concurrency:
  group: graduation-material-closeout-apply-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graduation-material-closeout-p0-review
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed closeout patch
        run: python scripts/apply_graduation_archived_rule_closeout.py

      - name: Remove one-shot construction files
        run: |
          rm scripts/apply_graduation_archived_rule_closeout.py
          rm .github/workflows/graduation-material-closeout-apply-once.yml

      - name: Validate patch
        run: |
          git diff --check
          python -m pip install --disable-pip-version-check pytest
          python -m pytest backend/tests/test_graduation_material_archived_rule_resolution.py -q

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/modules/graduation/materials/definitions.py \
            backend/app/modules/graduation/materials/rule_service.py \
            backend/app/modules/graduation/materials/command_service.py \
            backend/app/modules/graduation/materials/query_service.py \
            backend/tests/test_graduation_material_archived_rule_resolution.py \
            scripts/apply_graduation_archived_rule_closeout.py \
            .github/workflows/graduation-material-closeout-apply-once.yml
          git commit -m "fix(graduation): preserve archived material rule snapshots"
          git push origin HEAD:fix/graduation-material-closeout-p0-review
