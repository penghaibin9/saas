name: Cleanup runs before 2026-08-09 20:30 GMT+8

on:
  push:
    branches:
      - cleanup/actions-before-20260809-2030-r1
    paths:
      - .github/workflows/cleanup-before-20260809-2030.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.actor == 'penghaibin9'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Cancel and delete runs before cutoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RANGE='1970-01-01T00:00:00Z..2026-08-09T12:29:59Z'
          deleted=0
          while true; do
            active="$(gh api -X GET "repos/$REPO/actions/runs" \
              -f created="$RANGE" \
              -f per_page=100 \
              --jq '.workflow_runs[] | select(.status != "completed") | .id')"
            for id in $active; do
              gh api -X POST "repos/$REPO/actions/runs/$id/cancel" --silent || true
            done

            ids="$(gh api -X GET "repos/$REPO/actions/runs" \
              -f status=completed \
              -f created="$RANGE" \
              -f per_page=100 \
              --jq '.workflow_runs[].id')"
            for id in $ids; do
              gh api -X DELETE "repos/$REPO/actions/runs/$id"
              deleted=$((deleted + 1))
              if [ $((deleted % 50)) -eq 0 ]; then
                echo "Deleted $deleted runs"
              fi
              sleep 0.2
            done

            remaining="$(gh api -X GET "repos/$REPO/actions/runs" \
              -f created="$RANGE" \
              -f per_page=1 \
              --jq '.total_count')"
            [ "$remaining" = "0" ] && break
            sleep 5
          done
          echo "Cleanup complete: deleted $deleted workflow runs created before 2026-08-09 20:30 GMT+8."
