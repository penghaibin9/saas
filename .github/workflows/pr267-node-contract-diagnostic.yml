name: PR267 Node Contract Diagnostic

on:
  push:
    branches:
      - ui/graduation-shared-workspace-polish-20260908

permissions:
  contents: read

jobs:
  frontend-node-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Capture full Node contract output
        id: contracts
        shell: bash
        run: |
          set +e
          npm test > node-contract-output.txt 2>&1
          status=$?
          cat node-contract-output.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr267-node-contract-output-${{ github.sha }}
          path: frontend/node-contract-output.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failing status
        if: steps.contracts.outputs.exit_code != '0'
        run: exit 1
