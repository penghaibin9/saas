name: Academic B W1 Preflight Epoch Fix

on:
  push:
    branches: [agent/academic-b-schedule-selection]
    paths: ['.github/workflows/academic-b-w1-preflight-epoch-fix.yml']

permissions:
  contents: write

concurrency:
  group: academic-b-w1-preflight-epoch-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply exact lifecycle epoch patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/modules/academicAffairs/views/AaSelectionConsoleView.vue')
          text = path.read_text(encoding='utf-8')

          old_select = "\n".join([
              "    async select(b) {",
              "      this.current = b",
              "      this.drawResult = null",
              "      this.preflight = null",
              "      await this.refreshDetail()",
              "      await this.refreshPreflight()",
              "    },",
          ])
          new_select = "\n".join([
              "    async select(b) {",
              "      const passiveEpoch = ++this.preflightRequestSeq",
              "      this.current = b",
              "      this.drawResult = null",
              "      this.preflight = null",
              "      await this.refreshDetail()",
              "      if (",
              "        passiveEpoch !== this.preflightRequestSeq ||",
              "        !this.current ||",
              "        this.current.batchId !== b.batchId",
              "      ) return",
              "      await this.refreshPreflight()",
              "    },",
          ])

          old_check = "\n".join([
              "      if (action) {",
              "        const checked = await this.refreshPreflight()",
              "        if (!checked || !checked.allowed) {",
              "          toast.error(this.preflightMessage(checked))",
              "          return",
              "        }",
              "      }",
          ])
          new_check = "\n".join([
              "      if (action) {",
              "        let checked = await this.refreshPreflight()",
              "        if (!checked && action === this.lifecycleAction(this.current && this.current.status)) {",
              "          checked = await this.refreshPreflight()",
              "        }",
              "        if (!checked || !checked.allowed) {",
              "          toast.error(this.preflightMessage(checked))",
              "          return",
              "        }",
              "      }",
          ])

          old_success = "        if (res.code === 0) { toast.success(label + '成功'); this.preflightRequestSeq += 1; this.preflight = null; this.current = res.data; await this.load(); await this.refreshDetail(); await this.refreshPreflight() }"
          new_success = "\n".join([
              "        if (res.code === 0) {",
              "          toast.success(label + '成功')",
              "          const passiveEpoch = ++this.preflightRequestSeq",
              "          this.preflight = null",
              "          this.current = res.data",
              "          await this.load()",
              "          await this.refreshDetail()",
              "          if (passiveEpoch === this.preflightRequestSeq) await this.refreshPreflight()",
              "        }",
          ])

          for old, new, label in [
              (old_select, new_select, 'select-passive-preflight'),
              (old_check, new_check, 'interactive-preflight-retry'),
              (old_success, new_success, 'lifecycle-passive-preflight'),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {label} target, got {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -F 'const passiveEpoch = ++this.preflightRequestSeq' frontend/src/modules/academicAffairs/views/AaSelectionConsoleView.vue
          test "$(grep -F -c 'const passiveEpoch = ++this.preflightRequestSeq' frontend/src/modules/academicAffairs/views/AaSelectionConsoleView.vue)" -eq 2
      - name: Production build staff PC
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
      - name: Self-clean and commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/academic-b-w1-preflight-epoch-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/modules/academicAffairs/views/AaSelectionConsoleView.vue
          git diff --cached --check
          git commit -m 'fix(academic-b): serialize lifecycle preflight epochs'
          git push origin HEAD:agent/academic-b-schedule-selection
