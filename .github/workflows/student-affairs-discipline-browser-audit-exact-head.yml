name: Student Affairs strict discipline browser audit exact head
# trigger: guarded product fix via runner-base PR

on:
  push:
    branches:
      - audit/student-affairs-browser-runner-20260823
    paths:
      - '.github/workflows/student-affairs-discipline-browser-audit-exact-head.yml'
  pull_request:
    paths:
      - 'audit-tests/student-affairs-discipline-browser-audit.spec.mjs'
      - '.github/workflows/student-affairs-discipline-browser-audit-exact-head.yml'

permissions:
  contents: write

jobs:
  guarded-product-fix:
    name: SA-003 guarded product RBAC fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout product RC branch
        uses: actions/checkout@v4
        with:
          ref: fix/student-affairs-final-rc-20260824
          fetch-depth: 0
          persist-credentials: true

      - name: Assert expected old RC head
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "old_product_head=$ACTUAL"
          test "$ACTUAL" = "79d6516780e13f58b6f4a4a5118fa6360fdaccc3"
          test -z "$(git status --porcelain)"

      - name: Apply exact narrow RBAC patch
        run: |
          python - <<'PY'
          from pathlib import Path

          permissions = Path('backend/app/core/permissions.py')
          text = permissions.read_text(encoding='utf-8')
          old_comment = '''    # 辅导员：数据范围限本人所带班级（服务层 _allowed_class_ids/scope 收敛，越权返回 NO_DATA_SCOPE）。
    # 本班范围内广读 + 操作 班级/请假/风险/谈话/家校；困难/资助/违纪的正式审批与登记归学工处/院，辅导员默认只读。
'''
          new_comment = '''    # 辅导员：数据范围限本人所带班级（服务层 _allowed_class_ids/scope 收敛，越权返回 NO_DATA_SCOPE）。
    # 本班范围内广读 + 操作 班级/请假/风险/谈话/家校；困难/资助/违纪的正式审批与登记归学工处/院。
    # 处分仅冻结一个写例外：解除子流程 COUNSELOR_REVIEW 初审；后端仍按节点、数据范围与 WorkflowTask assignee 收敛。
'''
          old_grant = '        "studentAffairs.aid.view", "studentAffairs.funding.view", "studentAffairs.discipline.view",\n'
          new_grant = old_grant + '        "studentAffairs.discipline.remove.approve",\n'
          assert text.count(old_comment) == 1, 'COUNSELOR comment anchor drifted'
          assert text.count(old_grant) == 1, 'COUNSELOR discipline grant anchor drifted'
          assert '        "studentAffairs.discipline.remove.approve",\n' not in text, 'permission already present unexpectedly'
          text = text.replace(old_comment, new_comment).replace(old_grant, new_grant)
          permissions.write_text(text, encoding='utf-8')

          tests = Path('backend/tests/test_affairs_phase2_role_matrix.py')
          test_text = tests.read_text(encoding='utf-8')
          anchor = '''def _headers_or_skip(client, login_name, expected_role):
'''
          regression = '''def test_counselor_discipline_removal_permission_is_narrow():
    """辅导员仅获得处分解除初审，不得顺带获得正式处分审批或申诉复核。"""
    user = {"currentRoleCode": "COUNSELOR", "userType": "TEACHER", "userId": "matrix"}
    assert has_permission(user, "studentAffairs.discipline.remove.approve") is True
    assert has_permission(user, "studentAffairs.discipline.approve") is False
    assert has_permission(user, "studentAffairs.discipline.appeal.review") is False


'''
          assert test_text.count(anchor) == 1, 'role-matrix anchor drifted'
          assert 'test_counselor_discipline_removal_permission_is_narrow' not in test_text, 'regression already present unexpectedly'
          tests.write_text(test_text.replace(anchor, regression + anchor), encoding='utf-8')
          PY

      - name: Prove patch scope before commit
        run: |
          set -euo pipefail
          python -m py_compile backend/app/core/permissions.py backend/tests/test_affairs_phase2_role_matrix.py
          git diff --check
          printf '%s\n' \
            backend/app/core/permissions.py \
            backend/tests/test_affairs_phase2_role_matrix.py > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff -- backend/app/core/permissions.py backend/tests/test_affairs_phase2_role_matrix.py
          grep -F '"studentAffairs.discipline.remove.approve"' backend/app/core/permissions.py
          ! grep -F '"studentAffairs.discipline.*"' backend/app/core/permissions.py

      - name: Commit exact files and push RC branch
        run: |
          set -euo pipefail
          git config user.name 'openai-sa003-audit'
          git config user.email 'openai-sa003-audit@users.noreply.github.com'
          git add backend/app/core/permissions.py backend/tests/test_affairs_phase2_role_matrix.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '2'
          git commit -m 'fix(student-affairs): allow counselor removal first review'
          NEW_SHA="$(git rev-parse HEAD)"
          echo "new_product_head=$NEW_SHA"
          git push origin HEAD:fix/student-affairs-final-rc-20260824
