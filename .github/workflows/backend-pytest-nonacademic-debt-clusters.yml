name: Backend pytest non-academic debt probes

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/tests/test_student_affairs_p0_p1_closeout.py'
      - 'backend/tests/test_student_shadow_dual_read.py'
      - 'backend/tests/test_saas_role_templates_unit.py'
      - 'backend/tests/test_teacher_identity_p0b.py'
      - 'backend/tests/test_academic_graduation_truth_guard.py'
      - 'backend/tests/test_domain_export.py'
      - 'backend/tests/test_load_smoke.py'
      - 'backend/tests/test_security_hardening.py'
      - 'backend/tests/test_portal_guardian.py'
      - 'backend/tests/test_p0_new_security.py'
      - 'backend/tests/test_p0_txn_audit_delivery.py'
      - 'backend/tests/test_p1_tenant_context_required.py'
      - 'backend/tests/test_student_portal_config.py'
      - 'backend/app/**'
      - 'backend/requirements.txt'
      - 'scripts/check/sanitize_pytest_junit.py'
      - 'scripts/check/summarize_pytest_junit_diagnostics.py'
      - '.github/workflows/backend-pytest-nonacademic-debt-clusters.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-nonacademic-debt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Debt probe / ${{ matrix.case }}
    if: github.head_ref == 'fix/backend-pytest-debt-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: A5-student-affairs-registry
            nodeid: tests/test_student_affairs_p0_p1_closeout.py::test_permission_registry_and_generated_catalog_are_zero_drift
          - case: A5-student-shadow-bound
            nodeid: tests/test_student_shadow_dual_read.py::test_bound_row_identity_is_readonly_in_business_domain
          - case: A5-student-shadow-unchanged
            nodeid: tests/test_student_shadow_dual_read.py::test_resubmitting_unchanged_identity_is_not_rejected
          - case: A5-student-shadow-unbound-edit
            nodeid: tests/test_student_shadow_dual_read.py::test_unbound_legacy_row_still_editable
          - case: A6-internship-mentor-role
            nodeid: tests/test_saas_role_templates_unit.py::test_internship_mentor_scope_uses_user_id_and_blocks_same_name_teacher
          - case: A6-internship-mentor-identity
            nodeid: tests/test_teacher_identity_p0b.py::test_duplicate_name_mentors_cannot_cross_access
          - case: A7-graduation-truth-guard
            nodeid: tests/test_academic_graduation_truth_guard.py::test_guard_is_installed_on_public_graduation_service
          - case: A8-domain-export
            nodeid: tests/test_domain_export.py::test_export_all_six_domains
          - case: A8-load-service-apply
            nodeid: tests/test_load_smoke.py::test_concurrent_service_apply_20
          - case: A8-load-weekly-duplicate
            nodeid: tests/test_load_smoke.py::test_concurrent_weekly_duplicate_20
          - case: A8-load-export-rate
            nodeid: tests/test_load_smoke.py::test_export_rate_limit
          - case: A9-auth-lockout
            nodeid: tests/test_security_hardening.py::test_password_login_lockout
          - case: A9-guardian-login
            nodeid: tests/test_portal_guardian.py::test_guardian_login_and_view
          - case: A10-role-template-admin
            nodeid: tests/test_saas_role_templates_unit.py::test_academic_admin_is_the_explicit_tenant_wide_academic_role
          - case: A10-task-assignee-security
            nodeid: tests/test_p0_new_security.py::test_assert_task_assignee_denies_other_user
          - case: A10-portal-config-audit
            nodeid: tests/test_student_portal_config.py::test_update_writes_audit
          - case: A11-student-controlled-restore
            nodeid: tests/test_p0_txn_audit_delivery.py::test_student_void_then_create_restores_same_id
          - case: A11-file-tenant-context
            nodeid: tests/test_p1_tenant_context_required.py::test_file_require_tenant_without_context
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: '1'
      FILE_STORAGE_PROVIDER: local
      LOCAL_UPLOAD_DIR: /tmp/saas-ci-uploads
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Run representative historical nodeid
        id: pytest
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          DIR="test-results/nonacademic-debt/${{ matrix.case }}"
          XML="$DIR/raw.xml"
          RAW="$DIR/raw.log"
          mkdir -p "$DIR"
          set +e
          timeout 12m pytest '${{ matrix.nodeid }}' -q -p no:warnings --junitxml="$XML" >"$RAW" 2>&1
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$rc" > "$DIR/pytest-exit.txt"
          if [ -f "$XML" ]; then
            python ../scripts/check/summarize_pytest_junit_diagnostics.py "$XML" --output "$DIR/diagnostics.md"
            cat "$DIR/diagnostics.md" >> "$GITHUB_STEP_SUMMARY"
            python ../scripts/check/sanitize_pytest_junit.py "$XML"
            mv "$XML" "$DIR/sanitized.xml"
          else
            printf '# Secret-safe pytest diagnostics\n\nJUnit XML was not produced; pytest exit code: `%s`.\n' "$rc" > "$DIR/diagnostics.md"
            cat "$DIR/diagnostics.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$RAW"
          exit 0
      - name: Upload secret-safe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonacademic-debt-${{ matrix.case }}
          path: backend/test-results/nonacademic-debt/${{ matrix.case }}/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve real pytest result
        if: always()
        shell: bash
        run: exit '${{ steps.pytest.outputs.exit_code }}'
