name: Graduation GD-018 archive Browser First audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/graduation-archive-browser-audit-pr.yml'
      - 'e2e/specs/graduation-final-browser-audit.spec.mjs'
      - 'e2e/specs/graduation-review-browser-audit.spec.mjs'
      - 'e2e/specs/graduation-defense-browser-audit.spec.mjs'
      - 'e2e/specs/graduation-grade-browser-audit.spec.mjs'
      - 'e2e/specs/graduation-archive-browser-audit.spec.mjs'
      - 'e2e/scripts/graduation-archive-db-audit.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graduation-archive-browser-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archive-browser-audit:
    name: exact SHA review → defense → grade → GD-018 / Chromium / MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/12
      REDIS_KEY_PREFIX: graduation-archive-audit-20260824
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: graduation-archive-audit-only-not-production
      JWT_SECRET_KEY: graduation-archive-audit-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_EXPECTED_SHA: fcdbe5b1761a13f3fa96e6ece8b78abc5cdeb1e2

    steps:
      - name: Checkout product exact HEAD
        uses: actions/checkout@v4
        with:
          ref: fcdbe5b1761a13f3fa96e6ece8b78abc5cdeb1e2
          fetch-depth: 0

      - name: Assert exact product HEAD
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "PRODUCT_EXACT_HEAD=$actual"
          test "$actual" = "$E2E_EXPECTED_SHA"

      - name: Checkout audit harness only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: audit-harness
          sparse-checkout: |
            e2e/specs/graduation-final-browser-audit.spec.mjs
            e2e/specs/graduation-review-browser-audit.spec.mjs
            e2e/specs/graduation-defense-browser-audit.spec.mjs
            e2e/specs/graduation-grade-browser-audit.spec.mjs
            e2e/specs/graduation-archive-browser-audit.spec.mjs
            e2e/scripts/graduation-specialist-accounts.py
            e2e/scripts/graduation-archive-db-audit.py
          sparse-checkout-cone-mode: false

      - name: Inject only audit harness into exact product tree
        run: |
          set -euo pipefail
          cp audit-harness/e2e/specs/graduation-final-browser-audit.spec.mjs e2e/specs/
          cp audit-harness/e2e/specs/graduation-review-browser-audit.spec.mjs e2e/specs/
          cp audit-harness/e2e/specs/graduation-defense-browser-audit.spec.mjs e2e/specs/
          cp audit-harness/e2e/specs/graduation-grade-browser-audit.spec.mjs e2e/specs/
          cp audit-harness/e2e/specs/graduation-archive-browser-audit.spec.mjs e2e/specs/
          mkdir -p e2e/scripts
          cp audit-harness/e2e/scripts/graduation-specialist-accounts.py e2e/scripts/
          cp audit-harness/e2e/scripts/graduation-archive-db-audit.py e2e/scripts/
          rm -rf audit-harness
          grep -rl -e '63195a6dc9d25fa3805563910fb699ec163b552a' -e '47264037bf014276e795d3655d7f178830756729' -e '4aa4c95ba9e99f248ea19e251dacb6d116bbc3c9' e2e/scripts | xargs -r sed -i -e 's/63195a6dc9d25fa3805563910fb699ec163b552a/fcdbe5b1761a13f3fa96e6ece8b78abc5cdeb1e2/g' -e 's/47264037bf014276e795d3655d7f178830756729/fcdbe5b1761a13f3fa96e6ece8b78abc5cdeb1e2/g' -e 's/4aa4c95ba9e99f248ea19e251dacb6d116bbc3c9/fcdbe5b1761a13f3fa96e6ece8b78abc5cdeb1e2/g'
          test "$(git rev-parse HEAD)" = "$E2E_EXPECTED_SHA"
          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^e2e/' || true)"
          test -z "$bad"
          git status --short

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json

      - name: Install backend, migrate MySQL, seed IAM and tenants
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          alembic heads
          alembic upgrade head
          alembic current
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs e2e/test-results
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Bootstrap graduation accounts through real HTTP import
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py
          python ../e2e/scripts/graduation-specialist-accounts.py

      - name: Start staff PC
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend.pid

      - name: Start student PC
        env:
          VITE_BASE: /portal/
          VITE_API_BASE_URL: /
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd student-portal
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-portal.log 2>&1 &
          echo $! > ../e2e/runtime-logs/student-portal.pid

      - name: Wait for browser apps
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login; do
            ok=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              cat e2e/runtime-logs/*.log || true
              exit 1
            fi
          done

      - name: Apply isolated audit prefix and remove redundant same-role relogins
        run: |
          python - <<'PY'
          from pathlib import Path
          edits = {
            'e2e/lib/api-fixture.mjs': [
              ('`PW-E2E-${runId}`', '`E2E-AUDIT-20260824-${runId}`'),
              ('`Playwright 毕设交互测试 ${runId}`', '`E2E-AUDIT-20260824 毕设批次 ${runId}`'),
              ('`Playwright 交互测试课题 ${runId}`', '`E2E-AUDIT-20260824 课题 ${runId}`'),
            ],
            'e2e/pages/graduation.page.mjs': [
              ('`Playwright 背景 ${suffix}：验证真实浏览器交互和数据持久化。`', '`E2E-AUDIT-20260824 背景 ${suffix}：验证真实浏览器交互和数据持久化。`'),
              ('`Playwright 计划 ${suffix}：学生提交、导师审核、管理员复核。`', '`E2E-AUDIT-20260824 计划 ${suffix}：学生提交、导师审核、管理员复核。`'),
              ('`Playwright 成果 ${suffix}：保留完整证据链。`', '`E2E-AUDIT-20260824 成果 ${suffix}：保留完整证据链。`'),
            ],
            'e2e/specs/graduation-final-browser-audit.spec.mjs': [
              (
                "async function submitStudentFinal(page, fixture, marker) {\n  await loginStudent(page)",
                "async function submitStudentFinal(page, fixture, marker, { login = true } = {}) {\n  if (login) await loginStudent(page)",
              ),
              ('const second = await submitStudentFinal(page, fixture, \'draft-v2\')', 'const second = await submitStudentFinal(page, fixture, \'draft-v2\', { login: false })'),
              ('const finalSubmit = await submitStudentFinal(page, fixture, \'final-v1\')', 'const finalSubmit = await submitStudentFinal(page, fixture, \'final-v1\', { login: false })'),
            ],
          }
          for raw, replacements in edits.items():
            path = Path(raw)
            text = path.read_text(encoding='utf-8')
            for old, new in replacements:
              if old in text:
                text = text.replace(old, new)
              elif new in text:
                print(f'already patched: {raw}: {new[:80]}')
              else:
                raise AssertionError((raw, old, new))
            path.write_text(text, encoding='utf-8')
          PY
          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^e2e/' || true)"
          test -z "$bad"

      - name: Install Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Fixture setup only · real browser final + plagiarism
        id: finalpw
        continue-on-error: true
        working-directory: e2e
        run: npx playwright test specs/graduation-final-browser-audit.spec.mjs

      - name: Target · real browser independent review
        id: reviewpw
        if: steps.finalpw.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: npx playwright test specs/graduation-review-browser-audit.spec.mjs

      - name: Target · real browser defense
        id: defensepw
        if: steps.reviewpw.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: npx playwright test specs/graduation-defense-browser-audit.spec.mjs

      - name: Target · real browser grade
        id: gradepw
        if: steps.defensepw.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: npx playwright test specs/graduation-grade-browser-audit.spec.mjs

      - name: Target · real browser GD-018 archive preview, stale-token rejection, freeze and xlsx
        id: archivepw
        if: steps.gradepw.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: |
          set +e
          npx playwright test specs/graduation-archive-browser-audit.spec.mjs
          rc=$?
          test -f test-results/junit.xml && cp test-results/junit.xml test-results/graduation-archive-junit.xml
          exit $rc

      - name: Direct MySQL GD-018 manifest and FileVersion verification
        id: archivedb
        if: steps.archivepw.outcome == 'success'
        continue-on-error: true
        working-directory: e2e
        run: python scripts/graduation-archive-db-audit.py

      - name: Enforce affected-chain review, defense, grade, GD-018 and MySQL evidence gates
        if: always()
        env:
          FINAL_SETUP: ${{ steps.finalpw.outcome }}
          REVIEW_PW: ${{ steps.reviewpw.outcome }}
          DEFENSE_PW: ${{ steps.defensepw.outcome }}
          GRADE_PW: ${{ steps.gradepw.outcome }}
          ARCHIVE_PW: ${{ steps.archivepw.outcome }}
          ARCHIVE_DB: ${{ steps.archivedb.outcome }}
        working-directory: e2e
        run: |
          set -euo pipefail
          test "$FINAL_SETUP" = success
          test "$REVIEW_PW" = success
          test "$DEFENSE_PW" = success
          test "$GRADE_PW" = success
          test "$ARCHIVE_PW" = success
          test "$ARCHIVE_DB" = success
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('test-results/graduation-archive-junit.xml')
          assert path.exists(), 'missing graduation-archive-junit.xml'
          root = ET.parse(path).getroot()
          tests = int(root.attrib.get('tests', 0))
          failures = int(root.attrib.get('failures', 0))
          errors = int(root.attrib.get('errors', 0))
          skipped = int(root.attrib.get('skipped', 0))
          print('graduation-archive-junit.xml', {'tests': tests, 'failures': failures, 'errors': errors, 'skipped': skipped})
          assert tests > 0
          assert failures == 0 and errors == 0 and skipped == 0
          PY
          python scripts/graduation-archive-db-audit.py

      - name: Upload GD-018 Browser First evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graduation-archive-browser-audit-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14