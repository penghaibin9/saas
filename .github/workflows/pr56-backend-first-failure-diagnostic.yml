name: PR56 backend first-failure diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-failure:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/canonical-release-gate-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      SECRET_KEY: pr56-first-failure-diagnostic-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app tests
      - name: Stop at first backend failure and capture traceback
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          timeout 85m pytest -q -x -p no:warnings --tb=short --durations=20 2>&1 | tee /tmp/pytest-first-failure.log
      - name: Upload first-failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr56-backend-first-failure
          path: /tmp/pytest-first-failure.log
          if-no-files-found: error
          retention-days: 3
