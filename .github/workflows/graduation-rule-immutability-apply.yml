name: Graduation Rule Immutability Apply

on:
  push:
    branches:
      - fix/graduation-material-closeout-p0-review
    paths:
      - .github/workflows/graduation-rule-immutability-apply.yml

permissions:
  contents: write

concurrency:
  group: graduation-rule-immutability-apply
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graduation-material-closeout-p0-review
          fetch-depth: 0

      - name: Preserve archived rule evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/modules/graduation/materials/rule_service.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once('from sqlalchemy import func, select\n', 'from sqlalchemy import func, or_, select\n')
          replace_once(
              '''        candidate_items[code].required != current_items[code].required,
        candidate_items[code].review_required != current_items[code].review_required,
        candidate_items[code].archive_required != current_items[code].archive_required,
        candidate_items[code].owner_role != current_items[code].owner_role,
        candidate_items[code].allowed_ext_json != current_items[code].allowed_ext_json,
        candidate_items[code].max_size_bytes != current_items[code].max_size_bytes,
''',
              '''        candidate_items[code].material_name != current_items[code].material_name,
        candidate_items[code].biz_stage != current_items[code].biz_stage,
        candidate_items[code].required != current_items[code].required,
        candidate_items[code].review_required != current_items[code].review_required,
        candidate_items[code].archive_required != current_items[code].archive_required,
        candidate_items[code].owner_role != current_items[code].owner_role,
        candidate_items[code].allowed_ext_json != current_items[code].allowed_ext_json,
        candidate_items[code].max_files != current_items[code].max_files,
        candidate_items[code].max_size_bytes != current_items[code].max_size_bytes,
        candidate_items[code].sensitivity_level != current_items[code].sensitivity_level,
''',
          )
          replace_once(
              '''    rows = list(db.scalars(select(GraduationStudentMaterial).where(
        GraduationStudentMaterial.tenant_id == _tid(),
        GraduationStudentMaterial.batch_id == int(candidate.batch_id),
        GraduationStudentMaterial.is_deleted.is_(False),
    ).with_for_update()).all())
    migrated = removed_empty = 0
    for material in rows:
        item = items.get(material.material_code)
''',
              '''    archived_student_ids = set(db.scalars(select(GraduationStudent.id).where(
        GraduationStudent.tenant_id == _tid(),
        GraduationStudent.batch_id == int(candidate.batch_id),
        GraduationStudent.stage == "ARCHIVED",
        GraduationStudent.is_deleted.is_(False),
    ).with_for_update()).all())
    rows = list(db.scalars(select(GraduationStudentMaterial).where(
        GraduationStudentMaterial.tenant_id == _tid(),
        GraduationStudentMaterial.batch_id == int(candidate.batch_id),
        GraduationStudentMaterial.is_deleted.is_(False),
    ).with_for_update()).all())
    migrated = removed_empty = preserved_archived = 0
    for material in rows:
        if int(material.gd_student_id) in archived_student_ids or material.archive_status in {"FROZEN", "ARCHIVED"}:
            preserved_archived += 1
            continue
        item = items.get(material.material_code)
''',
          )
          replace_once(
              '    return {"migrated": migrated, "removedEmpty": removed_empty}\n',
              '    return {"migrated": migrated, "removedEmpty": removed_empty, "preservedArchived": preserved_archived}\n',
          )
          replace_once(
              '        migration = {"migrated": 0, "removedEmpty": 0}\n',
              '        migration = {"migrated": 0, "removedEmpty": 0, "preservedArchived": 0}\n',
          )
          path.write_text(text, encoding='utf-8')
          compile(text, str(path), 'exec')
          assert 'GraduationStudent.stage == "ARCHIVED"' in text
          assert 'preservedArchived' in text
          assert 'candidate_items[code].material_name != current_items[code].material_name' in text
          assert 'candidate_items[code].sensitivity_level != current_items[code].sensitivity_level' in text
          PY
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography

      - name: Run material closeout regression tests
        working-directory: backend
        run: |
          pytest -q tests/test_graduation_material_closeout_regressions.py tests/test_graduation_material_center_phase6.py

      - name: Commit validated rule immutability fix
        run: |
          rm -f .github/workflows/graduation-rule-immutability-apply.yml
          git config user.name "graduation-closeout-bot"
          git config user.email "graduation-closeout-bot@users.noreply.github.com"
          git add -- backend/app/modules/graduation/materials/rule_service.py .github/workflows/graduation-rule-immutability-apply.yml
          git diff --cached --check
          git commit -m "fix(graduation): preserve archived material rule evidence"
          git push origin HEAD:fix/graduation-material-closeout-p0-review
