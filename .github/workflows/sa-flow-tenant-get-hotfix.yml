name: Student Affairs tenant-scope hotfix

on:
  push:
    branches:
      - fix/student-affairs-flow-continuity-20260828
    paths:
      - .github/workflows/sa-flow-tenant-get-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/student-affairs-flow-continuity-20260828
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replace shifted bare Session.get with tenant_get
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/services/affairs_discipline_service.py')
          text = p.read_text(encoding='utf-8')
          import_anchor = 'from app.core.pagination import normalize_page\n'
          import_line = 'from app.core.tenant_scoped import tenant_get\n'
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('tenant_get import anchor drift')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          old = '        s = db.get(StudentProfile, int(a.student_id)) if a.student_id else None\n'
          new = '        s = tenant_get(db, StudentProfile, int(a.student_id)) if a.student_id else None\n'
          if text.count(old) != 1:
              raise SystemExit(f'target db.get anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          python -m py_compile backend/app/services/affairs_discipline_service.py
          python scripts/audit_tenant_queries.py --gate
      - name: Commit verified fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "student-affairs-flow-bot"
          git config user.email "student-affairs-flow-bot@users.noreply.github.com"
          rm .github/workflows/sa-flow-tenant-get-hotfix.yml
          git add -- backend/app/services/affairs_discipline_service.py
          git add -u -- .github/workflows/sa-flow-tenant-get-hotfix.yml
          git diff --cached --check
          git commit -m "fix(student-affairs): keep discipline appeal lookup tenant-scoped"
          git push origin HEAD:fix/student-affairs-flow-continuity-20260828
