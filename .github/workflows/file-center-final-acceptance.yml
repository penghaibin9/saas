name: File center final acceptance

on:
  pull_request:
    paths:
      - 'backend/app/api/v1/file*.py'
      - 'backend/app/models/file.py'
      - 'backend/app/services/file**'
      - 'backend/app/services/storage/**'
      - 'backend/app/workers/file_*worker.py'
      - 'backend/app/modules/**/material*'
      - 'backend/app/modules/academic_affairs/**'
      - 'backend/alembic/versions/015*.py'
      - 'backend/tests/test_file*.py'
      - 'backend/tests/test_*material*.py'
      - 'backend/tests/test_academic_file_exchange_center.py'
      - 'frontend/src/services/file/**'
      - 'frontend/src/modules/system/**'
      - 'frontend/src/modules/academicAffairs/**'
      - 'student-portal/src/**'
      - 'miniapp/src/**'
      - 'scripts/audit_file_center_calls.py'
      - 'scripts/audit_file_capabilities.py'
      - 'scripts/check_new_file_capabilities.py'
      - 'docs/architecture/file-center-stage10-closure.md'
      - 'docs/architecture/file-capability-inventory*'
      - '.github/workflows/file-center-final-acceptance.yml'
  push:
    branches: [audit/file-capability-inventory]

concurrency:
  group: file-center-final-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory-and-call-scan:
    name: 能力清单 + 调用扫描 + 旧合同退役
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Machine-readable inventory gates
        run: |
          python scripts/audit_file_capabilities.py --check-schema
          python scripts/audit_file_capabilities.py --strict-baseline
          python scripts/check_new_file_capabilities.py --base-ref origin/main
      - name: Strict file center call scan
        run: python scripts/audit_file_center_calls.py --strict --json-report artifacts/file-center-call-scan.json
      - name: Freeze retired aliases
        run: |
          ! grep -R -n --include='*.js' --include='*.vue' --include='*.ts' '["'"'"'`]\/files\/upload' frontend/src student-portal/src miniapp/src
          ! grep -R -n --include='*.js' --include='*.vue' --include='*.ts' '["'"'"'`]\/files\/meta\/' frontend/src student-portal/src miniapp/src
          ! grep -n '@router.post("/upload"' backend/app/api/v1/file.py
          ! grep -n '@router.get("/meta/' backend/app/api/v1/file.py
      - uses: actions/upload-artifact@v4
        with:
          name: file-center-call-scan
          path: artifacts/file-center-call-scan.json
          retention-days: 14

  mysql-contracts:
    name: MySQL 8 阶段 6–10 生产合同
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: '1'
      APP_ENV: test
      SECRET_KEY: stage10-file-center-final-ci-secret
      FILE_SCAN_ENABLED: 'false'
      FILE_SCAN_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Single Alembic head and real MySQL upgrade
        working-directory: backend
        run: |
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
          alembic current
      - name: Compile all stage 6–10 production paths
        working-directory: backend
        run: |
          python -m compileall -q \
            app/api/v1/file.py app/api/v1/files.py app/api/v1/file_governance.py \
            app/services/storage app/services/file_storage_governance_service.py \
            app/modules/academic_affairs/routers/academic_file_exchange_router.py \
            app/modules/academic_affairs/services/academic_file_exchange_service.py \
            app/workers/file_scan_worker.py app/workers/file_governance_worker.py \
            app/commands/migrate_files_to_cos.py
      - name: Select stage 6–10 targeted tests
        id: tests
        working-directory: backend
        shell: bash
        run: |
          TARGETS=$(find tests -maxdepth 1 -type f \( \
            -name 'test_file*.py' -o \
            -name 'test_*material_center*.py' -o \
            -name 'test_*archive_manifest*.py' -o \
            -name 'test_data_exchange_job_center.py' -o \
            -name 'test_academic_file_exchange_center.py' \
          \) | sort | tr '\n' ' ')
          test -n "$TARGETS"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "$TARGETS"
      - name: Run stage 6–10 targeted tests
        working-directory: backend
        run: timeout 50m pytest ${{ steps.tests.outputs.targets }} -q -p no:warnings --durations=30
      - name: Governance worker one-tenant dry run
        working-directory: backend
        run: python -m app.workers.file_governance_worker --once --tenant-id 90999 --dry-run

  admin-pc:
    name: 管理 PC lint + test + build
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  student-pc:
    name: 学生 PC lint + test + build
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: student-portal } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  miniapp:
    name: H5 + 微信小程序生产构建
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: miniapp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run build:h5
      - run: npm run build:mp-weixin

  draft-safety:
    name: PR Draft 与禁止施工残留
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No one-shot triggers, patch scripts, secrets or runtime files
        run: |
          FILES=$(git ls-files)
          BAD=$(echo "$FILES" | grep -Ei '(^|/)_?stage[0-9]+.*trigger\.py$|(^|/)patch_.*(ci|phase|stage).*\.py$|(^|/)uploads/|(^|/)exports/|\.pem$|\.key$|(^|/)\.env$' || true)
          if [ -n "$BAD" ]; then echo "$BAD"; exit 1; fi
          ! grep -R -n --include='*.js' --include='*.vue' --include='*.ts' 'COS_SECRET_ID\|COS_SECRET_KEY\|tmpSecretKey.*=' frontend/src student-portal/src miniapp/src
