name: internship-expected-version-closeout

on:
  push:
    branches:
      - fix/internship-prelaunch-p1p2-20260828

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore(internship): repair expected version callers' }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/internship-prelaunch-p1p2-20260828
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Repair strict optimistic-lock callers
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def load(rel):
              p = ROOT / rel
              return p, p.read_text(encoding='utf-8')

          def save(p, text):
              p.write_text(text, encoding='utf-8')

          def replace_exact(text, old, new, *, count=1, label='replacement'):
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{label}: expected {count} matches, got {actual}')
              return text.replace(old, new)

          # Immediate create -> enterprise approve callers: brand-new enterprise version is 0.
          immediate = {
              'tests/test_internship_application.py': 2,
              'tests/test_internship_match.py': 1,
              'tests/test_internship_position.py': 1,
              'tests/test_internship_student.py': 1,
          }
          for rel, count in immediate.items():
              p, t = load(rel)
              t = replace_exact(
                  t,
                  'json={"action": "APPROVE"}',
                  'json={"action": "APPROVE", "expectedVersion": 0}',
                  count=count,
                  label=f'{rel}: immediate enterprise approve',
              )
              save(p, t)

          # P1 race: use the version returned by enterprise creation.
          p, t = load('tests/test_internship_p1_acceptance.py')
          t = replace_exact(
              t,
              'client.post(f"{ENT}/{eid}/review", headers=auth_headers, json={"action": "APPROVE"})',
              'client.post(f"{ENT}/{eid}/review", headers=auth_headers, json={\n'
              '        "action": "APPROVE", "expectedVersion": int(ent["data"].get("version") or 0),\n'
              '    })',
              label='p1 enterprise approve',
          )
          save(p, t)

          # P2 enterprise-access fixture + incident must bind a real internship record.
          p, t = load('tests/test_internship_p2_compliance.py')
          t = replace_exact(
              t,
              'client.post(f"{ENT}/{eid}/review", headers=h, json={"action": "APPROVE"})',
              'client.post(f"{ENT}/{eid}/review", headers=h, json={\n'
              '        "action": "APPROVE", "expectedVersion": int(ent["data"].get("version") or 0),\n'
              '    })',
              label='p2 enterprise approve',
          )
          t = replace_exact(
              t,
              '    bid = _mk_batch(client, h)\n    key = _uniq("idem")',
              '    bid = _mk_batch(client, h)\n    internship_id = _mk_intern(client, h, bid)\n    key = _uniq("idem")',
              label='p2 incident record fixture',
          )
          t = replace_exact(
              t,
              '        "batchId": bid, "summary": "现场受伤测试", "severity": "HIGH",\n'
              '        "idempotencyKey": key, "fileIds": ["f1"],',
              '        "batchId": bid, "internshipId": internship_id,\n'
              '        "summary": "现场受伤测试", "severity": "HIGH",\n'
              '        "idempotencyKey": key, "fileIds": ["f1"],',
              label='p2 incident internshipId',
          )
          t = replace_exact(
              t,
              '        "batchId": bid, "summary": "重复", "idempotencyKey": key,',
              '        "batchId": bid, "internshipId": internship_id,\n'
              '        "summary": "重复", "idempotencyKey": key,',
              label='p2 incident idempotent internshipId',
          )
          save(p, t)

          # Placement snapshot immediate enterprise review.
          p, t = load('tests/test_internship_placement_snapshot_mysql.py')
          t = replace_exact(
              t,
              'reviewed = client.post(f"{ENT}/{company_id}/review", headers=auth_headers, json={"action": "APPROVE"}).json()',
              'reviewed = client.post(f"{ENT}/{company_id}/review", headers=auth_headers, json={\n'
              '        "action": "APPROVE", "expectedVersion": int(company["data"].get("version") or 0),\n'
              '    }).json()',
              label='placement enterprise approve',
          )
          save(p, t)

          # Enterprise state-machine tests always fetch the current version, so negative cases
          # still exercise the intended business rule rather than failing DTO validation.
          p, t = load('tests/test_internship_enterprise.py')
          helper_anchor = 'def test_create_and_list(client, auth_headers, db_mode):\n'
          helper = '''def _version(client, headers, company_id) -> int:\n    detail = client.get(f"{BASE}/{company_id}", headers=headers).json()\n    assert detail["code"] == 0, detail\n    return int(detail["data"].get("version") or 0)\n\n\n'''
          t = replace_exact(t, helper_anchor, helper + helper_anchor, label='enterprise version helper')
          payloads = [
              ('{"action": "APPROVE", "comment": "资质齐全"}', '{"action": "APPROVE", "comment": "资质齐全", "expectedVersion": _version(client, auth_headers, cid)}', 1),
              ('{"action": "APPROVE"}', '{"action": "APPROVE", "expectedVersion": _version(client, auth_headers, cid)}', 2),
              ('{"action": "REJECT", "comment": "资质不符"}', '{"action": "REJECT", "comment": "资质不符", "expectedVersion": _version(client, auth_headers, cid)}', 1),
              ('{"action": "REJECT", "comment": "营业执照经营范围与实习岗位不符"}', '{"action": "REJECT", "comment": "营业执照经营范围与实习岗位不符", "expectedVersion": _version(client, auth_headers, cid)}', 1),
              ('{"action": "SUSPEND"}', '{"action": "SUSPEND", "expectedVersion": _version(client, auth_headers, cid)}', 2),
              ('{"action": "RESUME"}', '{"action": "RESUME", "expectedVersion": _version(client, auth_headers, cid)}', 1),
              ('{"action": "ARCHIVE"}', '{"action": "ARCHIVE", "expectedVersion": _version(client, auth_headers, cid)}', 1),
              ('{"on": True, "reason": ""}', '{"on": True, "reason": "", "expectedVersion": _version(client, auth_headers, cid)}', 1),
              ('{"on": True, "reason": "多次拖欠实习津贴"}', '{"on": True, "reason": "多次拖欠实习津贴", "expectedVersion": _version(client, auth_headers, cid)}', 1),
              ('{"on": False}', '{"on": False, "expectedVersion": _version(client, auth_headers, cid)}', 1),
          ]
          for old, new, count in payloads:
              t = replace_exact(t, old, new, count=count, label=f'enterprise payload {old}')
          t = replace_exact(
              t,
              'json={"title": "技术总监"}',
              'json={"title": "技术总监", "expectedVersion": int(a["data"].get("version") or 0)}',
              label='enterprise contact update version',
          )
          save(p, t)

          # Preserve the semantic intent of blacklist publish tests after blacklist also became strict.
          for rel in ('tests/test_internship_position.py', 'tests/test_internship_student.py'):
              p, t = load(rel)
              old = 'json={"on": True, "reason": "拖欠津贴多次投诉"}' if rel.endswith('position.py') else 'json={"on": True, "reason": "多次违规拖欠"}'
              new = old[:-1] + ', "expectedVersion": 1}'
              t = replace_exact(t, old, new, label=f'{rel}: blacklist semantic lock')
              save(p, t)

          # Student strict mutations: always send the actual current record version.
          p, t = load('tests/test_internship_student.py')
          anchor = 'def _satisfy_onboard_prereqs(rid):\n'
          helper = '''def _record_version(client, headers, record_id) -> int:\n    detail = client.get(f"{IST}/{record_id}", headers=headers).json()\n    assert detail["code"] == 0, detail\n    return int(detail["data"].get("version") or 0)\n\n\n'''
          t = replace_exact(t, anchor, helper + anchor, label='student version helper')
          t = replace_exact(
              t,
              'json={"advisorUserId": replacement_id, "reason": "重新分配"}',
              'json={"advisorUserId": replacement_id, "reason": "重新分配",\n'
              '                                "expectedVersion": _record_version(client, auth_headers, record_id)}',
              label='advisor expectedVersion',
          )
          # Limit status-machine rewrites to that function only.
          start = t.index('def test_status_machine(')
          end = t.index('\ndef test_destination(', start)
          seg = t[start:end]
          seg = replace_exact(seg, 'json={"action": "READY"}',
                              'json={"action": "READY", "expectedVersion": _record_version(client, auth_headers, rid)}',
                              count=2, label='student READY versions')
          seg = replace_exact(seg, 'json={"status": "QUALIFIED"}',
                              'json={"status": "QUALIFIED", "expectedVersion": _record_version(client, auth_headers, rid)}',
                              label='student eligibility version')
          seg = replace_exact(seg, 'json={"action": "ONBOARD"}',
                              'json={"action": "ONBOARD", "expectedVersion": _record_version(client, auth_headers, rid)}',
                              count=3, label='student ONBOARD versions')
          seg = replace_exact(seg, 'json={"action": "ASSESS"}',
                              'json={"action": "ASSESS", "expectedVersion": _record_version(client, auth_headers, rid)}',
                              label='student ASSESS version')
          seg = replace_exact(seg, 'json={"positionId": pid, "expectedVersion": 0}',
                              'json={"positionId": pid, "expectedVersion": _record_version(client, auth_headers, rid)}',
                              label='student status assign current version')
          seg = replace_exact(seg, '"evidenceFileIds": [fid], "expectedVersion": 1,',
                              '"evidenceFileIds": [fid], "expectedVersion": _record_version(client, auth_headers, rid),',
                              label='student archive current version')
          seg = replace_exact(seg, 'json={"remark": "x"}',
                              'json={"remark": "x", "expectedVersion": _record_version(client, auth_headers, rid)}',
                              label='student archived-edit semantic lock')
          t = t[:start] + seg + t[end:]
          start = t.index('def test_destination(')
          end = t.index('\ndef test_stats_and_export(', start)
          seg = t[start:end]
          seg = replace_exact(seg, 'json={"destination": "SELF_ARRANGED"}',
                              'json={"destination": "SELF_ARRANGED", "expectedVersion": _record_version(client, auth_headers, rid)}',
                              label='student destination success version')
          seg = replace_exact(seg, 'json={"destination": "EXEMPTED"}',
                              'json={"destination": "EXEMPTED", "expectedVersion": _record_version(client, auth_headers, r2)}',
                              label='student destination negative semantic version')
          t = t[:start] + seg + t[end:]
          save(p, t)

          # P0 schema test: validate ARCHIVE rejection, not missing expectedVersion.
          p, t = load('tests/test_internship_p0_launch_blockers.py')
          t = replace_exact(t, 'StudentStatusRequest(action="ARCHIVE")',
                            'StudentStatusRequest(action="ARCHIVE", expectedVersion=0)',
                            label='p0 archive schema')
          t = replace_exact(t, 'StudentStatusRequest(action="ASSESS").action',
                            'StudentStatusRequest(action="ASSESS", expectedVersion=0).action',
                            label='p0 assess schema')
          save(p, t)
          PY

      - name: Syntax and tenant ratchet
        run: |
          python -m py_compile \
            tests/test_internship_application.py \
            tests/test_internship_enterprise.py \
            tests/test_internship_match.py \
            tests/test_internship_p0_launch_blockers.py \
            tests/test_internship_p1_acceptance.py \
            tests/test_internship_p2_compliance.py \
            tests/test_internship_placement_snapshot_mysql.py \
            tests/test_internship_position.py \
            tests/test_internship_student.py
          python scripts/audit_tenant_queries.py --gate
          git diff --check

      - name: Targeted optimistic-lock regression
        run: |
          timeout 20m pytest -q -p no:warnings \
            tests/test_internship_application.py \
            tests/test_internship_enterprise.py \
            tests/test_internship_match.py \
            tests/test_internship_p0_launch_blockers.py \
            tests/test_internship_p1_acceptance.py \
            tests/test_internship_p2_compliance.py \
            tests/test_internship_placement_snapshot_mysql.py \
            tests/test_internship_position.py \
            tests/test_internship_student.py

      - name: Commit validated caller repairs and remove one-shot workflow
        working-directory: .
        run: |
          rm .github/workflows/internship-expected-version-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/internship-expected-version-closeout.yml \
            backend/tests/test_internship_application.py \
            backend/tests/test_internship_enterprise.py \
            backend/tests/test_internship_match.py \
            backend/tests/test_internship_p0_launch_blockers.py \
            backend/tests/test_internship_p1_acceptance.py \
            backend/tests/test_internship_p2_compliance.py \
            backend/tests/test_internship_placement_snapshot_mysql.py \
            backend/tests/test_internship_position.py \
            backend/tests/test_internship_student.py
          git diff --cached --check
          git commit -m 'test(internship): align optimistic-lock callers'
          git push origin HEAD:fix/internship-prelaunch-p1p2-20260828
