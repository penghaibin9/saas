name: Academic D W1 Archive Targeted

on:
  push:
    branches:
      - agent/academic-d-graduation-delivery
    paths:
      - '.github/workflows/academic-d-w1-archive-targeted.yml'

permissions:
  contents: write

jobs:
  mysql-authority-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: test
      DB_ENABLED: 'true'
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-d-graduation-delivery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Run W1 four-state and mature authority regressions
        working-directory: backend
        run: |
          set -euo pipefail
          timeout 22m pytest -q -p no:warnings \
            tests/test_aa_archive_d_w1_contract.py \
            tests/test_aa_archive_d_w1_authority_regressions.py \
            tests/test_aa_archive_semantic_gates.py \
            tests/test_aa_archive_status_change_gate.py \
            tests/test_aa_archive_workflow_policy.py \
            tests/test_aa_archive_grade_policy_guard.py \
            tests/test_aa_evaluation_archive_guard.py \
            tests/test_aa_textbook_archive_guard.py \
            tests/test_aa_archive.py::test_ar1_batch_and_check \
            tests/test_aa_archive.py::test_ar5_precheck_realtime_no_batch
      - name: Run Stage D archive UI contracts
        run: |
          node --test frontend/tests/stage-d-archive-precheck-contract.test.mjs
      - name: Diff integrity
        run: git diff --check
      - name: Self-clean targeted workflow
        run: |
          rm .github/workflows/academic-d-w1-archive-targeted.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git commit -m 'chore(academic-d): remove W1 archive targeted gate'
          git push origin HEAD:agent/academic-d-graduation-delivery
