name: File center lockfile closeout

on:
  push:
    branches:
      - audit/file-capability-inventory
    paths:
      - .github/workflows/file-center-lockfile-closeout.yml

permissions:
  contents: write

concurrency:
  group: file-center-lockfile-closeout
  cancel-in-progress: true

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate official npm lockfile
        working-directory: frontend
        run: |
          npm config set registry https://registry.npmjs.org
          npm install --save-exact cos-js-sdk-v5@1.10.1 --package-lock-only --ignore-scripts
      - name: Verify COS package supply chain
        working-directory: frontend
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          if (pkg.dependencies?.['cos-js-sdk-v5'] !== '1.10.1') throw new Error('package.json COS version is not exact')
          if (lock.packages?.['']?.dependencies?.['cos-js-sdk-v5'] !== '1.10.1') throw new Error('lock root COS version is not exact')
          const cos = lock.packages?.['node_modules/cos-js-sdk-v5']
          if (cos?.version !== '1.10.1') throw new Error('COS lock node missing')
          if (cos.resolved !== 'https://registry.npmjs.org/cos-js-sdk-v5/-/cos-js-sdk-v5-1.10.1.tgz') throw new Error('COS resolved URL is not official npm')
          if (!String(cos.integrity || '').startsWith('sha512-')) throw new Error('COS integrity missing')
          if (!lock.packages?.['node_modules/fast-xml-parser']) throw new Error('fast-xml-parser lock node missing')
          if (!lock.packages?.['node_modules/strnum']) throw new Error('strnum lock node missing')
          console.log('COS npm lockfile verified')
          NODE
      - name: Commit lockfile and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/file-center-lockfile-closeout.yml
          git add -- frontend/package.json frontend/package-lock.json
          git diff --cached --check
          git commit -m "fix(file-center): lock official COS browser SDK"
          git push origin HEAD:audit/file-capability-inventory
