name: Academic C materialize V2.1 manual once

on:
  push:
    branches:
      - agent/academic-c-teaching-execution
    paths:
      - '.github/workflows/academic-c-materialize-manual-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: academic-c-materialize-manual-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-c-teaching-execution
          fetch-depth: 0

      - name: Assemble and verify exact uploaded C manual
        shell: bash
        run: |
          set -euo pipefail
          PART_DIR='.tmp/academic-c-manual.correct'
          PAYLOAD='.tmp/academic-c-manual.correct.joined.b64'
          TARGET='C_教务Teaching_Execution_当前代码精确施工总册_V2.1_20260816.md'
          TMP="${TARGET}.verified.tmp"

          test -d "$PART_DIR"
          PART_COUNT="$(find "$PART_DIR" -maxdepth 1 -type f -name 'correct-*.b64' | wc -l | tr -d ' ')"
          test "$PART_COUNT" = '7'
          cat "$PART_DIR"/correct-*.b64 > "$PAYLOAD"
          PAYLOAD_SIZE="$(wc -c < "$PAYLOAD" | tr -d ' ')"
          echo "parts=$PART_COUNT payload_chars=$PAYLOAD_SIZE"
          test "$PAYLOAD_SIZE" = '73804'

          base64 --decode "$PAYLOAD" | gzip -dc > "$TMP"

          ACTUAL_SIZE="$(wc -c < "$TMP" | tr -d ' ')"
          ACTUAL_LINES="$(awk 'END{print NR}' "$TMP")"
          ACTUAL_SHA="$(sha256sum "$TMP" | awk '{print $1}')"
          EXPECTED_SIZE='333509'
          EXPECTED_LINES='6169'
          EXPECTED_SHA='388b3f78e55bc43ef82c3cd71973d47fc530e674e271d3234b18ee6456d2afe4'

          echo "size=$ACTUAL_SIZE lines=$ACTUAL_LINES sha256=$ACTUAL_SHA"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          test "$ACTUAL_LINES" = "$EXPECTED_LINES"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          mv "$TMP" "$TARGET"

      - name: Commit exact manual and self-clean all staging files
        shell: bash
        run: |
          set -euo pipefail
          TARGET='C_教务Teaching_Execution_当前代码精确施工总册_V2.1_20260816.md'
          WORKFLOW='.github/workflows/academic-c-materialize-manual-once.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$TARGET"
          git rm -r --ignore-unmatch -- \
            '.tmp/academic-c-manual.md.gz.b64' \
            '.tmp/academic-c-manual.parts' \
            '.tmp/academic-c-manual.correct' \
            '.tmp/academic-c-manual.correct.joined.b64' \
            "$WORKFLOW"
          git commit -m 'docs(academic-c): materialize exact V2.1 teaching-execution manual'
          git push origin HEAD:agent/academic-c-teaching-execution
