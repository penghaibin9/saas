name: Audit Academic Archive W1 DB Audit Seal 20260823

on:
  push:
    branches:
      - audit/academic-real-browser-20260823
    paths:
      - '.github/workflows/audit-academic-archive-w1-db-audit-seal-20260823.yml'

permissions:
  contents: read
  issues: write

jobs:
  strict-seal:
    name: repaired-head browser + direct MySQL + audit seal
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: academic_archive_w1_strict_e2e
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_archive_w1_strict_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_archive_w1_strict_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: academic_archive_w1_strict_e2e
      REDIS_URL: redis://127.0.0.1:6379/12
      REDIS_KEY_PREFIX: academic-archive-w1-strict
      JWT_SECRET: academic-archive-w1-strict-browser-only-not-production
      JWT_SECRET_KEY: academic-archive-w1-strict-browser-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      TARGET_SHA: 3ca83f8512a5b3a2ed0f9b6bf039d87de5e48b22
      BASELINE_SHA: 1c69336ea0728c5c6713c0c85b7275b06fca9ae1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ca83f8512a5b3a2ed0f9b6bf039d87de5e48b22
          fetch-depth: 0

      - name: Assert repaired exact HEAD and baseline ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" "$TARGET_SHA"
          git merge-base --is-ancestor 843bb02f93b52412e29f37b7e1a938ef6a96be05 "$TARGET_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend and migrate isolated MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head

      - name: Run repaired MySQL regression suite
        working-directory: backend
        run: |
          pytest -q \
            tests/test_stage_c3_correction_router_contract.py \
            tests/test_stage_c3_correction_end_to_end.py \
            tests/test_stage_c3_correction_reject.py

      - name: Build staff PC
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          node --test tests/academic-archive-correction-contract.test.mjs
          npm run build

      - name: Seed isolated prerequisite facts
        working-directory: backend
        run: |
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_academic_archive_correction_w1.py
          test -s ../e2e/academic-archive-correction-w1-fixture.json

      - name: Start backend
        run: |
          mkdir -p e2e/runtime-logs
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/archive-strict-backend.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/archive-strict-backend.log
          exit 1

      - name: Start staff PC
        run: |
          cd frontend
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/archive-strict-frontend.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5173/login >/dev/null && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/archive-strict-frontend.log
          exit 1

      - name: Install Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Execute all correction writes through real browser
        working-directory: e2e
        run: npx playwright test specs/academic-archive-correction-w1.spec.mjs --workers=1 --retries=0 --reporter=line

      - name: Direct MySQL and audit evidence seal
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from sqlalchemy import select
          from app.db.session import get_sessionmaker
          from app.models import AffairsAuditTrail, ArchiveManifest, PostArchiveCorrectionCase

          fixture = json.loads(Path('../e2e/academic-archive-correction-w1-fixture.json').read_text(encoding='utf-8'))
          tid = 1000000000000000911
          batch_id = int(fixture['batchId'])
          run_id = os.environ['GITHUB_RUN_ID']
          db = get_sessionmaker()()
          try:
              cases = db.scalars(select(PostArchiveCorrectionCase).where(
                  PostArchiveCorrectionCase.tenant_id == tid,
                  PostArchiveCorrectionCase.archive_batch_id == batch_id,
                  PostArchiveCorrectionCase.reason.like(f'%{run_id}%'),
                  PostArchiveCorrectionCase.is_deleted.is_(False),
              ).order_by(PostArchiveCorrectionCase.id)).all()
              assert len(cases) == 2, f'expected exactly 2 browser-created cases for run {run_id}, got {len(cases)}'
              applied = next((c for c in cases if c.status == 'APPLIED'), None)
              rejected = next((c for c in cases if c.status == 'REJECTED'), None)
              assert applied is not None and rejected is not None, [(c.id, c.status) for c in cases]
              assert applied.tenant_id == tid
              assert applied.created_by is not None and applied.updated_by is not None
              assert applied.second_approved_by is not None and applied.second_approved_by != applied.created_by
              assert applied.applied_at is not None
              assert applied.official_fact_type == 'ACADEMIC_GRADE'
              assert applied.official_fact_id is not None
              assert applied.resulting_manifest_id is not None
              assert rejected.tenant_id == tid
              assert rejected.created_by is not None and rejected.updated_by is not None
              assert rejected.rejected_by is not None and rejected.rejected_by != rejected.created_by
              assert rejected.rejected_at is not None and rejected.reject_reason
              assert rejected.second_approved_by is None
              assert rejected.applied_at is None
              assert rejected.official_fact_id is None
              assert rejected.resulting_manifest_id is None

              manifests = db.scalars(select(ArchiveManifest).where(
                  ArchiveManifest.tenant_id == tid,
                  ArchiveManifest.archive_batch_id == batch_id,
              ).order_by(ArchiveManifest.version_no)).all()
              assert [m.version_no for m in manifests] == [1, 2], [m.version_no for m in manifests]
              assert manifests[1].supersedes_id == manifests[0].id
              assert int(applied.resulting_manifest_id) == int(manifests[1].id)

              trails = db.scalars(select(AffairsAuditTrail).where(
                  AffairsAuditTrail.tenant_id == tid,
                  AffairsAuditTrail.biz_type == 'AA_ARCHIVE',
                  AffairsAuditTrail.biz_id == batch_id,
                  AffairsAuditTrail.action.in_([
                      'POST_ARCHIVE_CORRECTION_CREATE',
                      'POST_ARCHIVE_CORRECTION_APPLY',
                      'POST_ARCHIVE_CORRECTION_REJECT',
                  ]),
              ).order_by(AffairsAuditTrail.id)).all()
              by_case = {int(applied.id): set(), int(rejected.id): set()}
              relevant = []
              for t in trails:
                  detail = str(t.detail or '')
                  matched_case = None
                  for cid in by_case:
                      if f'caseId={cid}' in detail:
                          by_case[cid].add(t.action)
                          matched_case = cid
                          break
                  if matched_case is None:
                      continue
                  relevant.append(t)
                  assert t.operator, f'audit operator missing: action={t.action} case={matched_case}'
                  assert t.role_name, f'audit role missing: action={t.action} case={matched_case}'
                  assert t.occurred_at is not None
                  assert t.before_val is not None, f'audit before missing: action={t.action} case={matched_case}'
                  assert t.after_val is not None, f'audit after missing: action={t.action} case={matched_case}'
                  before = json.loads(t.before_val)
                  after = json.loads(t.after_val)
                  assert 'status' in before and 'status' in after

              assert by_case[int(applied.id)] == {'POST_ARCHIVE_CORRECTION_CREATE', 'POST_ARCHIVE_CORRECTION_APPLY'}, by_case
              assert by_case[int(rejected.id)] == {'POST_ARCHIVE_CORRECTION_CREATE', 'POST_ARCHIVE_CORRECTION_REJECT'}, by_case
              print(json.dumps({
                  'tenantId': tid,
                  'batchId': batch_id,
                  'browserRunId': run_id,
                  'cases': [{'id': int(c.id), 'status': c.status, 'createdBy': c.created_by, 'updatedBy': c.updated_by,
                             'secondApprovedBy': c.second_approved_by, 'rejectedBy': c.rejected_by,
                             'officialFactId': c.official_fact_id, 'resultingManifestId': c.resulting_manifest_id} for c in cases],
                  'manifestVersions': [m.version_no for m in manifests],
                  'audit': [{'id': int(t.id), 'action': t.action, 'operator': t.operator, 'role': t.role_name,
                             'hasBefore': t.before_val is not None, 'hasAfter': t.after_val is not None} for t in relevant],
              }, ensure_ascii=False))
          finally:
              db.close()
          PY

      - name: Upload strict evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-archive-w1-strict-${{ github.run_id }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/academic-archive-correction-w1-fixture.json
            e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish strict seal status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '## Archive W1 repaired strict DB/audit seal\n\nRun: `%s`\nBaseline main: `%s`\nRepair exact HEAD: `%s`\nStatus: **%s**\nURL: https://github.com/%s/actions/runs/%s\n' \
            '${{ github.run_id }}' "$BASELINE_SHA" "$TARGET_SHA" "$JOB_STATUS" '${{ github.repository }}' '${{ github.run_id }}' > /tmp/archive-strict.md
          gh issue comment 205 --repo '${{ github.repository }}' --body-file /tmp/archive-strict.md
