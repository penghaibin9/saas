name: Internship Route Audit

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'agent/internship-production-hardening-20260803'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DB_ENABLED: '0'
      FAST_TEST_SCHEMA: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inventory route permissions and upload bypasses
        run: |
          python - <<'PY'
          import inspect
          import json
          import re
          from fastapi.routing import APIRoute
          from app.main import app

          def strings_from_callable(fn):
              values = []
              for cell in getattr(fn, '__closure__', None) or ():
                  try:
                      value = cell.cell_contents
                  except ValueError:
                      continue
                  if isinstance(value, str):
                      values.append(value)
                  elif isinstance(value, (tuple, list, set)):
                      values.extend(item for item in value if isinstance(item, str))
              marker = getattr(fn, '__permission_code__', None)
              if marker:
                  values.append(marker)
              values.extend(getattr(fn, '__permission_codes__', ()) or ())
              return values

          def dependency_codes(dep):
              found = []
              call = getattr(dep, 'call', None)
              if call:
                  found.extend(code for code in strings_from_callable(call)
                               if code.startswith('internship.'))
              for child in getattr(dep, 'dependencies', ()) or ():
                  found.extend(dependency_codes(child))
              return sorted(set(found))

          rows = []
          for route in app.routes:
              if not isinstance(route, APIRoute):
                  continue
              if not route.path.startswith('/api/v1/internship'):
                  continue
              methods = sorted((route.methods or set()) - {'HEAD', 'OPTIONS'})
              codes = dependency_codes(route.dependant)
              rows.append({'methods': methods, 'path': route.path, 'codes': codes,
                           'endpoint': f'{route.endpoint.__module__}.{route.endpoint.__name__}'})
          rows.sort(key=lambda item: (item['path'], item['methods']))
          missing = [item for item in rows if not item['codes']]
          print('INTERNSHIP_ROUTE_COUNT', len(rows))
          print('INTERNSHIP_MISSING_PERMISSION_COUNT', len(missing))
          print('=== ROUTES WITHOUT DECLARATIVE PERMISSION ===')
          for item in missing:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))
          print('=== ALL ROUTES ===')
          for item in rows:
              print(json.dumps(item, ensure_ascii=False, sort_keys=True))
          PY
          echo '=== DIRECT UPLOAD READS IN INTERNSHIP ==='
          grep -RInE 'await[[:space:]]+[A-Za-z_][A-Za-z0-9_]*\.read\(' \
            app/modules/internship app/api/v1 app/student_portal 2>/dev/null \
            | grep -E 'internship|Internship' || true
