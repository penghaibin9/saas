name: 阶段A自动施工与权威验证

on:
  push:
    branches:
      - agent/miniapp-mp-weixin-release-hardening-20260729
    paths:
      - scripts/maintenance/apply_miniapp_stage_a.py
      - .github/workflows/miniapp-stage-a-autofix.yml

permissions:
  contents: write

concurrency:
  group: miniapp-stage-a-autofix
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: test
      JWT_SECRET: stage-a-authoritative-secret-at-least-32-bytes
      DB_ENABLED: "true"
      MOCK_LOGIN_ENABLED: "true"
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: "1"
      VITE_API_BASE_URL: https://api.hnyueke.com
      VITE_USE_MOCK: "false"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/miniapp-mp-weixin-release-hardening-20260729
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: 应用阶段A精确补丁
        run: python scripts/maintenance/apply_miniapp_stage_a.py

      - name: 公共文件中心禁区检查
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only HEAD --)
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -E '(^|/)(file-center|file_center)(/|$)|miniapp/src/services/fileApi\.js|miniapp/src/services/fileCenter\.js|miniapp/src/stores/uploadQueue\.js|miniapp/src/components/file-center/|upload|download|preview|attachment|material-version|cos|clamav|ImportJob|ExportJob|ArchiveJob'; then
            echo "阶段A触碰公共文件中心禁区"
            exit 1
          fi
          if printf '%s\n' "$CHANGED" | grep -E '^backend/alembic/versions/|^miniapp/src/pages\.json$'; then
            echo "阶段A禁止新增迁移或大改 pages.json"
            exit 1
          fi

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography

      - name: Python编译与移动端MySQL测试
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app tests
          mapfile -t TESTS < <(
            find tests -maxdepth 1 -type f \( -name 'test_mobile*.py' -o -name 'test_*miniapp*.py' \) | sort -u
          )
          printf 'mobile tests: %s\n' "${TESTS[*]}"
          pytest -q -p no:warnings "${TESTS[@]}" --durations=20

      - name: 安装小程序依赖
        working-directory: miniapp
        run: npm ci

      - name: 阶段A前端合同测试
        working-directory: miniapp
        run: npm test

      - name: H5生产构建
        working-directory: miniapp
        run: npm run build:h5

      - name: 微信生产构建
        working-directory: miniapp
        run: npm run build:mp-weixin:release

      - name: 固定演示凭据扫描
        working-directory: miniapp
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin

      - name: 代码差异检查
        run: git diff --check

      - name: 删除一次性施工器并精确提交
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/maintenance/apply_miniapp_stage_a.py
          rm -f .github/workflows/miniapp-stage-a-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/miniapp-mp-weixin-release.yml \
            backend/app/api/v1/mobile.py \
            backend/app/services/mobile_student_service.py \
            backend/app/services/mobile_teacher_service.py \
            backend/tests/test_mobile_stage_a_contracts.py \
            miniapp/package.json \
            miniapp/docs/mp-weixin-subpackage-candidates.md \
            miniapp/tests/stage-a-contract.test.mjs \
            miniapp/src/pages/student/home/index.vue \
            miniapp/src/pages/student/messages/index.vue \
            miniapp/src/pages/teacher/workbench/index.vue \
            miniapp/src/pages/teacher/todos/index.vue \
            miniapp/src/pages/teacher/risk-students/index.vue \
            miniapp/src/services/request.js \
            miniapp/src/services/realApi.js \
            miniapp/src/services/studentApi.js \
            miniapp/src/services/teacherApi.js \
            miniapp/src/stores/session.js \
            miniapp/src/stores/internshipContext.js \
            miniapp/src/utils/viewFreshness.js \
            scripts/maintenance/apply_miniapp_stage_a.py \
            .github/workflows/miniapp-stage-a-autofix.yml
          git diff --cached --name-only
          git commit -m "perf(miniapp): close stage A non-file P0 issues"
          git push origin HEAD:agent/miniapp-mp-weixin-release-hardening-20260729
