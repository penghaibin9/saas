name: Graduation S3 Native Handoff

on:
  push:
    branches:
      - audit/graduation-s3-native-handoff-20260827
    paths:
      - '.github/workflows/graduation-s3-native-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graduation-s3-native-handoff-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_EXACT_SHA: 5a86ff4fc58d97eabf2a3931d99074b8f1291716
  PRODUCT_API_BASE: https://api.hnyueke.com
  PRODUCT_HELP_CENTER: https://hnyueke.com/help
  EXPECTED_WECHAT_APPID: wxb569328a0dbf268b

jobs:
  native-handoff:
    name: Exact product SHA mp-weixin handoff only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_EXACT_SHA }}
          fetch-depth: 0

      - name: Assert exact product identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$PRODUCT_EXACT_SHA"
          echo "productExactSha=$ACTUAL"
          echo "runnerExactSha=${{ github.sha }}"

      - name: Diagnose public production API DNS TLS and health
        shell: bash
        run: |
          set +e
          HEALTH_URL="${PRODUCT_API_BASE}/health"
          CODE="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 20 \
            --output /tmp/s3-public-health.json \
            --write-out '%{http_code}' \
            "$HEALTH_URL")"
          RC=$?
          STATUS=FAIL
          if [ "$RC" = "0" ] && [ "$CODE" = "200" ] && grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' /tmp/s3-public-health.json; then
            STATUS=PASS
          elif [ "$RC" = "6" ]; then
            STATUS=BLOCKED_DNS
          elif [ "$RC" = "60" ]; then
            STATUS=BLOCKED_TLS
          else
            STATUS="FAIL_RC_${RC}_HTTP_${CODE:-000}"
          fi
          echo "S3_PUBLIC_API_HEALTH=$STATUS" | tee -a "$GITHUB_ENV"
          echo "curlRc=$RC httpCode=${CODE:-000} status=$STATUS"
          test -f /tmp/s3-public-health.json && cat /tmp/s3-public-health.json || true
          exit 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Build production-reachable mp-weixin package
        working-directory: miniapp
        env:
          VITE_API_BASE_URL: ${{ env.PRODUCT_API_BASE }}
          VITE_HELP_CENTER_URL: ${{ env.PRODUCT_HELP_CENTER }}
          VITE_USE_MOCK: 'false'
          WECHAT_APPID: ${{ env.EXPECTED_WECHAT_APPID }}
        run: |
          set -euo pipefail
          npm ci
          npm run build:mp-weixin:release
          node ../scripts/check/scan-fixed-demo-credentials.mjs dist/build/mp-weixin

      - name: Seal exact-head native handoff without claiming S3 PASS
        working-directory: miniapp
        env:
          RUNNER_EXACT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ../e2e/runtime/graduation-s3-native
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const crypto = require('crypto')

          const out = path.resolve('dist/build/mp-weixin')
          const runtime = path.resolve('../e2e/runtime/graduation-s3-native')
          const projectPath = path.join(out, 'project.config.json')
          const appPath = path.join(out, 'app.json')
          const reportPath = path.join(out, 'miniapp-package-report.json')
          const releasePath = path.join(out, 'RELEASE_INFO.txt')
          const envPath = path.join(out, 'config/env.js')

          for (const file of [projectPath, appPath, reportPath, releasePath, envPath]) {
            if (!fs.existsSync(file)) throw new Error(`missing native handoff file: ${file}`)
          }

          const project = JSON.parse(fs.readFileSync(projectPath, 'utf8'))
          const app = JSON.parse(fs.readFileSync(appPath, 'utf8'))
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
          const release = fs.readFileSync(releasePath, 'utf8')
          const envJs = fs.readFileSync(envPath, 'utf8')
          const publicApiHealth = process.env.S3_PUBLIC_API_HEALTH || 'UNKNOWN'
          const externalReady = publicApiHealth === 'PASS'

          if (project.compileType !== 'miniprogram') throw new Error(`compileType=${project.compileType}`)
          if (project.appid !== process.env.EXPECTED_WECHAT_APPID) throw new Error(`appid=${project.appid}`)
          if (project.setting?.urlCheck !== true) throw new Error('project.config urlCheck is not true')
          if (report.budgetPass !== true) throw new Error('miniapp package budget did not pass')
          if (!release.includes(`API: ${process.env.PRODUCT_API_BASE}`)) throw new Error('release info is not bound to production API')
          if (!envJs.includes(`VITE_API_BASE_URL:\"${process.env.PRODUCT_API_BASE}\"`)) throw new Error('compiled env missing production API')
          if (!envJs.includes('VITE_USE_MOCK:\"false\"')) throw new Error('compiled env is not mock=false')
          if (/VITE_API_BASE_URL:\"https?:\/\/(?:127\.0\.0\.1|localhost)/i.test(envJs)) throw new Error('compiled API points to loopback/dev host')
          if (/VITE_HELP_CENTER_URL:\"https?:\/\/(?:127\.0\.0\.1|localhost)/i.test(envJs)) throw new Error('compiled help center points to loopback/dev host')

          const pages = new Set(app.pages || [])
          for (const sub of (app.subPackages || app.subpackages || [])) {
            const root = String(sub.root || '').replace(/^\/+|\/+$/g, '')
            for (const p of (sub.pages || [])) pages.add([root, p].filter(Boolean).join('/'))
          }
          const requiredGraduationPages = [
            'pages/student/graduation/index',
            'pages/student/graduation/topics/index',
            'pages/student/graduation/taskbook/index',
            'pages/student/graduation/defense/index',
            'pages/teacher/graduation-guide/index',
            'pages/teacher/graduation-topics/index'
          ]
          const missing = requiredGraduationPages.filter((p) => !pages.has(p))
          if (missing.length) throw new Error(`missing graduation native pages: ${missing.join(', ')}`)

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name)
              return entry.isDirectory() ? walk(full) : [full]
            })
          }
          const files = walk(out).sort()
          const digestRows = files.map((file) => {
            const rel = path.relative(out, file).split(path.sep).join('/')
            const sha256 = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')
            return `${sha256}  ${rel}`
          })
          fs.writeFileSync(path.join(runtime, 'mp-weixin-files.sha256'), digestRows.join('\n') + '\n')

          const manifest = {
            gate: 'S3',
            module: 'GRADUATION',
            status: externalReady ? 'READY_FOR_NATIVE_ACCEPTANCE' : 'PACKAGE_READY_EXTERNAL_BLOCKER',
            productExactSha: process.env.PRODUCT_EXACT_SHA,
            runnerExactSha: process.env.RUNNER_EXACT_SHA,
            artifactType: 'mp-weixin-importable',
            apiBase: process.env.PRODUCT_API_BASE,
            productionApiHealth: publicApiHealth,
            helpCenterUrl: process.env.PRODUCT_HELP_CENTER,
            appId: project.appid,
            compileType: project.compileType,
            urlCheck: project.setting?.urlCheck === true,
            mockEnabled: false,
            packageBudgetPass: report.budgetPass === true,
            requiredGraduationPages,
            wechatServerDomainConfig: 'PENDING_PLATFORM_CONFIRMATION',
            privacyDeclaration: 'PENDING_PLATFORM_CONFIRMATION',
            nativeDevToolsEvidence: 'PENDING',
            studentPhysicalDeviceEvidence: 'PENDING',
            teacherPhysicalDeviceEvidence: 'PENDING',
            crossRoleGraduationEvidence: 'PENDING',
            releaseEligible: false,
            note: externalReady
              ? 'Exact-SHA production-bound mp-weixin package is ready for native acceptance. S3 remains OPEN until WeChat DevTools plus real student/teacher physical-device evidence is attached for this exact product SHA.'
              : `Exact-SHA package is built, but S3 remains externally blocked: production API health=${publicApiHealth}. DevTools import can proceed, but real-device network acceptance cannot close until public DNS/TLS/health is PASS.`
          }
          fs.writeFileSync(path.join(runtime, 's3-native-handoff.json'), JSON.stringify(manifest, null, 2) + '\n')

          const evidenceTemplate = {
            productExactSha: process.env.PRODUCT_EXACT_SHA,
            productionApiHealthAtBuild: publicApiHealth,
            devTools: {
              version: '',
              compileScreenshotOrVideo: '',
              compileErrors: 0,
              apiHostObserved: process.env.PRODUCT_API_BASE
            },
            studentDevice: {
              deviceModel: '',
              osVersion: '',
              wechatVersion: '',
              evidence: '',
              verifiedPages: ['毕业设计首页', '毕设选题', '毕设任务书', '答辩安排']
            },
            teacherDevice: {
              deviceModel: '',
              osVersion: '',
              wechatVersion: '',
              evidence: '',
              verifiedPages: ['毕设指导', '毕设选题审核']
            },
            crossRole: {
              tenant: '',
              batchOrStudentMarker: '',
              evidence: '',
              result: 'PENDING'
            },
            finalS3Decision: 'PENDING'
          }
          fs.writeFileSync(path.join(runtime, 's3-native-evidence-template.json'), JSON.stringify(evidenceTemplate, null, 2) + '\n')

          const checklist = `# Graduation S3 Native Acceptance Checklist\n\n` +
            `Product exact SHA: ${process.env.PRODUCT_EXACT_SHA}\n` +
            `Public API health at build time: ${publicApiHealth}\n\n` +
            `This package is ${manifest.status}, not S3 PASS.\n\n` +
            `1. Import miniapp/dist/build/mp-weixin into WeChat DevTools and confirm AppID ${project.appid}.\n` +
            `2. Compile with zero WXSS/appService errors and confirm requests target ${process.env.PRODUCT_API_BASE}.\n` +
            `3. On a real student device/account, open: 毕业设计首页 → 毕设选题 → 毕设任务书 → 答辩安排. Capture timestamped evidence.\n` +
            `4. On a real teacher device/account, open: 毕设指导 → 毕设选题审核. Capture timestamped evidence.\n` +
            `5. Use the same authorized tenant/batch/student marker to confirm at least one graduation fact projects consistently across teacher/student roles.\n` +
            `6. Attach DevTools + student-device + teacher-device evidence to PR #210 and record this exact SHA. Only then may S3 be marked PASS.\n` +
            (externalReady ? '' : `\nBLOCKER: production API health is ${publicApiHealth}. Do not mark S3 PASS until public DNS/TLS/health is PASS and real-device requests succeed.\n`)
          fs.writeFileSync(path.join(runtime, 'S3-NATIVE-ACCEPTANCE-CHECKLIST.md'), checklist)
          console.log(JSON.stringify(manifest, null, 2))
          NODE

      - name: Upload exact-SHA WeChat DevTools import package
        uses: actions/upload-artifact@v4
        with:
          name: graduation-s3-mp-weixin-${{ env.PRODUCT_EXACT_SHA }}
          path: |
            miniapp/dist/build/mp-weixin/
            e2e/runtime/graduation-s3-native/
          if-no-files-found: error
          retention-days: 14
