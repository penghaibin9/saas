name: pr231-final-isolated-verify

on:
  push:
    branches:
      - tmp/pr231-final-verify-20260828

permissions:
  contents: write

jobs:
  verify:
    if: "${{ github.event.head_commit.message == 'chore(pr231): run final isolated validation' }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/pr231-final-verify-20260828
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Apply previously isolated fixture corrections
        run: |
          git fetch origin tmp/pr231-residual-closeout-20260828
          git show origin/tmp/pr231-residual-closeout-20260828:.github/scripts/internship_residual_closeout.py > /tmp/internship_residual_closeout.py
          git show origin/tmp/pr231-residual-closeout-20260828:.github/scripts/internship_residual_patch2.py > /tmp/internship_residual_patch2.py
          python /tmp/internship_residual_closeout.py
          python /tmp/internship_residual_patch2.py
      - name: Apply final product ACL correction
        run: python ../.github/scripts/pr231_product_acl_patch.py
      - name: Syntax tenant ratchet and diff integrity
        run: |
          python -m py_compile \
            app/services/file_access_resolvers.py \
            app/modules/internship/services/internship_special_filing_service.py \
            tests/test_file_student_internship_acl.py \
            tests/test_internship_score_archive_guard.py \
            tests/test_internship_archive.py \
            tests/test_internship_v93_batch2_remaining_first_create.py \
            tests/test_internship_v93_special_filing_review_flow.py \
            tests/test_portal_internship.py \
            tests/test_internship_scope.py \
            tests/test_internship_enterprise_eval.py
          python scripts/audit_tenant_queries.py --gate
          git diff --check
      - name: Residual real MySQL regression
        run: |
          timeout 30m pytest -q -p no:warnings \
            tests/test_file_student_internship_acl.py \
            tests/test_internship_score_archive_guard.py \
            tests/test_internship_archive.py \
            tests/test_internship_v93_batch2_remaining_first_create.py \
            tests/test_internship_v93_special_filing_review_flow.py \
            tests/test_portal_internship.py \
            tests/test_internship_scope.py \
            tests/test_internship_enterprise_eval.py
      - name: Commit validated candidate on temp branch
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            backend/app/services/file_access_resolvers.py \
            backend/app/modules/internship/services/internship_special_filing_service.py \
            backend/tests/test_file_student_internship_acl.py \
            backend/tests/test_internship_score_archive_guard.py \
            backend/tests/test_internship_archive.py \
            backend/tests/test_internship_v93_batch2_remaining_first_create.py \
            backend/tests/test_internship_v93_special_filing_review_flow.py \
            backend/tests/test_portal_internship.py \
            backend/tests/test_internship_scope.py \
            backend/tests/test_internship_enterprise_eval.py
          git diff --cached --check
          git commit -m 'fix(internship): close remaining authoritative fixture and file ACL gaps'
          git push origin HEAD:tmp/pr231-final-verify-20260828
