name: PR25 repair merge identity

on:
  push:
    branches:
      - audit/file-capability-inventory
    paths:
      - .github/workflows/pr25-fix-merge-identity.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0

      - name: Add Git identity before merge
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/file-center-final-merge-closeout-v3.yml')
          source = path.read_text(encoding='utf-8')
          old = '''        run: |
          set -euo pipefail
          git fetch origin main
'''
          new = '''        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
'''
          if new not in source:
              if old not in source:
                  raise SystemExit('prepare merge anchor missing')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit repair and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr25-fix-merge-identity.yml
          git add .github/workflows/file-center-final-merge-closeout-v3.yml
          git diff --cached --check
          git commit -m "ci(pr25): configure merge identity before final audit"
          git push origin HEAD:audit/file-capability-inventory

      - name: Dispatch repaired final closeout
        run: |
          gh workflow run file-center-final-merge-closeout-v3.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref audit/file-capability-inventory
