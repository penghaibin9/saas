name: Graduation final Browser First audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/graduation-final-browser-audit-pr.yml'
      - 'e2e/specs/graduation-final-browser-audit.spec.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graduation-final-browser-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  final-browser-audit:
    name: exact SHA final reject-resubmit-approve / Chromium / MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/12
      REDIS_KEY_PREFIX: graduation-final-audit-20260823
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: graduation-final-audit-only-not-production
      JWT_SECRET_KEY: graduation-final-audit-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_EXPECTED_SHA: 1c69336ea0728c5c6713c0c85b7275b06fca9ae1

    steps:
      - name: Checkout product exact HEAD
        uses: actions/checkout@v4
        with:
          ref: 1c69336ea0728c5c6713c0c85b7275b06fca9ae1
          fetch-depth: 0

      - name: Assert exact product HEAD
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "PRODUCT_EXACT_HEAD=$ACTUAL"
          test "$ACTUAL" = "1c69336ea0728c5c6713c0c85b7275b06fca9ae1"

      - name: Checkout audit harness only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: audit-harness
          sparse-checkout: |
            e2e/specs/graduation-final-browser-audit.spec.mjs
          sparse-checkout-cone-mode: false

      - name: Inject only the audit spec into exact product tree
        run: |
          set -euo pipefail
          cp audit-harness/e2e/specs/graduation-final-browser-audit.spec.mjs e2e/specs/
          rm -rf audit-harness
          test "$(git rev-parse HEAD)" = "1c69336ea0728c5c6713c0c85b7275b06fca9ae1"
          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^e2e/specs/graduation-final-browser-audit.spec.mjs$' || true)"
          test -z "$bad"
          git status --short

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json

      - name: Install backend, migrate MySQL, seed IAM and tenants
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          alembic heads
          alembic upgrade head
          alembic current
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs e2e/test-results
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Bootstrap graduation accounts through real HTTP import
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py

      - name: Start staff PC
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend.pid

      - name: Start student PC
        env:
          VITE_BASE: /portal/
          VITE_API_BASE_URL: /
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd student-portal
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-portal.log 2>&1 &
          echo $! > ../e2e/runtime-logs/student-portal.pid

      - name: Wait for browser apps
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login; do
            ok=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              cat e2e/runtime-logs/*.log || true
              exit 1
            fi
          done

      - name: Apply runtime-only E2E-AUDIT-20260823 fixture prefix
        run: |
          python - <<'PY'
          from pathlib import Path
          edits = {
            'e2e/lib/api-fixture.mjs': [
              ('`PW-E2E-${runId}`', '`E2E-AUDIT-20260823-${runId}`'),
              ('`Playwright 毕设交互测试 ${runId}`', '`E2E-AUDIT-20260823 毕设批次 ${runId}`'),
              ('`Playwright 交互测试课题 ${runId}`', '`E2E-AUDIT-20260823 课题 ${runId}`'),
            ],
            'e2e/pages/graduation.page.mjs': [
              ('`Playwright 背景 ${suffix}：验证真实浏览器交互和数据持久化。`', '`E2E-AUDIT-20260823 背景 ${suffix}：验证真实浏览器交互和数据持久化。`'),
              ('`Playwright 计划 ${suffix}：学生提交、导师审核、管理员复核。`', '`E2E-AUDIT-20260823 计划 ${suffix}：学生提交、导师审核、管理员复核。`'),
              ('`Playwright 成果 ${suffix}：保留完整证据链。`', '`E2E-AUDIT-20260823 成果 ${suffix}：保留完整证据链。`'),
            ],
          }
          for raw, replacements in edits.items():
            path = Path(raw)
            text = path.read_text(encoding='utf-8')
            for old, new in replacements:
              assert old in text, (raw, old)
              text = text.replace(old, new)
            path.write_text(text, encoding='utf-8')
          PY
          bad="$(git status --porcelain | awk '{print $2}' | grep -v '^e2e/' || true)"
          test -z "$bad"
          git status --short

      - name: Install Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Real browser final reject-resubmit-approve journey
        id: pw
        continue-on-error: true
        working-directory: e2e
        run: npx playwright test specs/graduation-final-browser-audit.spec.mjs

      - name: Direct MySQL final, file-version and audit verification
        id: db
        if: always()
        continue-on-error: true
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from datetime import date, datetime
          from decimal import Decimal
          from pathlib import Path
          import pymysql

          def cv(v):
              if isinstance(v, (datetime, date)): return v.isoformat()
              if isinstance(v, Decimal): return str(v)
              if isinstance(v, bytes): return v.decode('utf-8', 'replace')
              return v

          conn = pymysql.connect(
              host='127.0.0.1', port=3306, user='root', password='e2e_root',
              database='student_lifecycle_e2e', charset='utf8mb4',
              cursorclass=pymysql.cursors.DictCursor,
          )
          with conn.cursor() as cur:
              cur.execute("SELECT id,tenant_id,gd_student_id,final_type,version,status,attachments_json,reviewer,review_comment,submit_at,review_time,active_key FROM t_gd_final ORDER BY id")
              finals = cur.fetchall()
              cur.execute("SELECT id,tenant_id,biz_type,biz_id,action,operator,role_name,detail,before_val,after_val,occurred_at,request_id,request_path,role_code FROM t_gd_audit_trail WHERE biz_type='FINAL' ORDER BY id")
              audits = cur.fetchall()
              cur.execute("SELECT id,tenant_id,file_name,sha256,biz_type,status,scan_status FROM t_file_object WHERE biz_type='GRADUATION_MATERIAL' ORDER BY id")
              files = cur.fetchall()
              cur.execute("SELECT id,tenant_id,file_id,biz_type,biz_id,asset_id,version_id,version_no,is_current,status FROM t_file_binding WHERE biz_type LIKE 'GRADUATION%%' ORDER BY id")
              bindings = cur.fetchall()
              cur.execute("SELECT id,tenant_id,asset_id,file_object_id,version_no,status,is_current FROM t_file_version ORDER BY id")
              versions = cur.fetchall()
          for row in finals + audits + files + bindings + versions:
              for k, v in list(row.items()): row[k] = cv(v)
          evidence = {
              'productExactHead': '1c69336ea0728c5c6713c0c85b7275b06fca9ae1',
              'finals': finals, 'audits': audits, 'files': files, 'bindings': bindings, 'versions': versions,
          }
          out = Path('../e2e/test-results/graduation-final-db-audit.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(evidence, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(evidence, ensure_ascii=False, indent=2))

          assert len(finals) >= 3, finals
          sid = finals[-1]['gd_student_id']
          rows = [f for f in finals if f['gd_student_id'] == sid]
          draft1 = next((f for f in rows if f['final_type'] == '初稿' and f['version'] == 'v1'), None)
          draft2 = next((f for f in rows if f['final_type'] == '初稿' and f['version'] == 'v2'), None)
          final1 = next((f for f in rows if f['final_type'] == '定稿' and f['version'] == 'v1'), None)
          assert draft1 and draft1['status'] == 'REJECTED', rows
          assert draft2 and draft2['status'] == 'APPROVED', rows
          assert final1 and final1['status'] == 'APPROVED', rows
          assert draft1['review_comment'] and 'E2E-AUDIT-20260823' in draft1['review_comment'], draft1
          assert not any(f.get('active_key') for f in (draft1, draft2, final1)), rows

          actions = [a['action'] for a in audits]
          assert actions.count('提交成果-初稿') >= 2, actions
          assert '批阅成果-退回修改' in actions, actions
          assert actions.count('批阅成果-通过') >= 2, actions
          assert '提交成果-定稿' in actions, actions
          for a in audits:
              assert a['tenant_id'] and a['operator'] and a['role_name'] and a['occurred_at'], a
              assert a['request_id'] and a['request_path'] and a['role_code'], a

          attachment_ids = []
          for f in (draft1, draft2, final1):
              raw = f['attachments_json']
              if isinstance(raw, str): raw = json.loads(raw)
              for x in raw or []:
                  attachment_ids.append(int(x.get('fileId') or x.get('id')) if isinstance(x, dict) else int(x))
          assert len(set(attachment_ids)) >= 3, attachment_ids
          file_by_id = {int(f['id']): f for f in files}
          for fid in set(attachment_ids):
              assert fid in file_by_id, (fid, files)
              assert file_by_id[fid]['sha256'], file_by_id[fid]
          bound = [b for b in bindings if int(b['file_id']) in set(attachment_ids)]
          assert len({int(b['version_id']) for b in bound if b.get('version_id')}) >= 3, bound
          version_ids = {int(b['version_id']) for b in bound if b.get('version_id')}
          version_rows = [v for v in versions if int(v['id']) in version_ids]
          assert len(version_rows) >= 3, version_rows
          assert any(v['status'] == 'REJECTED' for v in version_rows), version_rows
          assert sum(1 for v in version_rows if v['status'] == 'APPROVED') >= 2, version_rows
          PY

      - name: Enforce browser and DB evidence gates
        if: always()
        env:
          PW: ${{ steps.pw.outcome }}
          DB: ${{ steps.db.outcome }}
        run: |
          echo "playwright=$PW db=$DB"
          test "$PW" = success
          test "$DB" = success

      - name: Upload final audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graduation-final-browser-audit-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
