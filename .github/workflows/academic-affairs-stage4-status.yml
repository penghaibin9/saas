name: 教务第四阶段最终状态发布

on:
  workflow_run:
    workflows:
      - 教务第四阶段合并前最终验收
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    name: 发布第四阶段总闸门结论
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'integrate/academic-affairs-final-20260729'
    runs-on: ubuntu-latest
    steps:
      - name: 写入最终提交状态
        shell: bash
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          case "$CONCLUSION" in
            success)
              STATE=success
              DESC='第四阶段总闸门全部通过，保持 Draft 等待所有者决定'
              ;;
            cancelled)
              STATE=error
              DESC='第四阶段总闸门被取消'
              ;;
            *)
              STATE=failure
              DESC='第四阶段总闸门仍有未通过项'
              ;;
          esac
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"academic-affairs/stage4-final-acceptance\",\"description\":\"$DESC\",\"target_url\":\"$TARGET_URL\"}"
