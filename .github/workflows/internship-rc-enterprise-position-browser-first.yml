name: Internship RC IX-003 IX-005 Browser First

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/scripts/e2e_seed_internship_enterprise_position_sandbox.py'
      - 'backend/scripts/e2e_verify_internship_enterprise_position_db.py'
      - 'backend/app/modules/internship/services/internship_participant_service.py'
      - 'backend/app/modules/internship/services/internship_student_catalog_facade_service.py'
      - 'backend/app/modules/internship/services/internship_student_position_eligibility_service.py'
      - 'frontend/src/modules/internship/views/EnterpriseFormView.vue'
      - 'frontend/src/modules/internship/views/InternshipPositionDetailView.vue'
      - 'e2e/specs/internship-enterprise-position-lifecycle-audit.spec.mjs'
      - 'e2e/lib/internship-enterprise-position-browser.mjs'
      - '.github/actions/internship-e2e-*/**'
      - '.github/workflows/internship-rc-enterprise-position-browser-first.yml'
  workflow_dispatch:

concurrency:
  group: internship-rc-ix003-ix005-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ix-003-005:
    name: IX-003 IX-005 / real MySQL / Staff+Enterprise+Student browser
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/13
      REDIS_KEY_PREFIX: internship-rc-ix003-ix005
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: internship-rc-e2e-only-not-production
      JWT_SECRET_KEY: internship-rc-e2e-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_ENTERPRISE_BASE_URL: http://127.0.0.1:5202/enterprise
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact RC SHA
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "actual=$ACTUAL"
          echo "expected=$E2E_EXPECTED_SHA"
          test "$ACTUAL" = "$E2E_EXPECTED_SHA"

      - name: Prepare shared E2E toolchain
        uses: ./.github/actions/internship-e2e-toolchain
        with:
          node-cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json
            enterprise-portal/package-lock.json

      - name: Migrate isolated real MySQL
        uses: ./.github/actions/internship-e2e-mysql-migrate
        with:
          verify-schema-parity: 'true'

      - name: Bootstrap shared browser runtime
        uses: ./.github/actions/internship-e2e-browser-runtime

      - name: Seed IX-003 IX-005 prerequisites only
        working-directory: backend
        run: python scripts/e2e_seed_internship_enterprise_position_sandbox.py

      - name: Start shared browser applications
        uses: ./.github/actions/internship-e2e-app-start
        with:
          start-staff: 'true'
          start-student: 'true'
          start-enterprise: 'true'

      - name: Wait for all browser applications
        uses: ./.github/actions/internship-e2e-wait-apps
        with:
          urls: |
            http://127.0.0.1:5173/login
            http://127.0.0.1:5199/portal/login
            http://127.0.0.1:5202/enterprise/login

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Browser First IX-003 IX-005 only
        working-directory: e2e
        run: >-
          npx playwright test
          specs/internship-enterprise-position-lifecycle-audit.spec.mjs
          --workers=1

      - name: Upload IX-003 IX-005 HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-rc-ix003-ix005-html-${{ github.run_id }}
          path: e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload IX-003 IX-005 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-rc-ix003-ix005-evidence-${{ github.run_id }}
          path: e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload IX-003 IX-005 service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-rc-ix003-ix005-service-logs-${{ github.run_id }}
          path: e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
