name: Generate workflow runtime migration payload

on:
  push:
    branches: [agent/production-release-governance-20260807]
    paths:
      - '.github/workflows/_generate-workflow-runtime-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/production-release-governance-20260807
          fetch-depth: 0
      - name: Generate transformed workflow blobs outside workflow directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ops/workflow-migration
          mkdir -p ops/workflow-migration/blobs
          python - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import base64

          root = Path('.github/workflows')
          out = Path('ops/workflow-migration/blobs')
          generator = '_generate-workflow-runtime-migration.yml'
          rows = []
          replacements = (
              ('actions/checkout@v4', 'actions/checkout@v7'),
              ('actions/checkout@v5', 'actions/checkout@v7'),
              ('actions/checkout@v6', 'actions/checkout@v7'),
              ('actions/setup-node@v4', 'actions/setup-node@v7'),
              ('actions/setup-node@v5', 'actions/setup-node@v7'),
              ('actions/setup-node@v6', 'actions/setup-node@v7'),
              ('actions/setup-python@v5', 'actions/setup-python@v7'),
              ('actions/setup-python@v6', 'actions/setup-python@v7'),
              ('actions/upload-artifact@v4', 'actions/upload-artifact@v7'),
              ('actions/upload-artifact@v5', 'actions/upload-artifact@v7'),
              ('actions/upload-artifact@v6', 'actions/upload-artifact@v7'),
              ('actions/download-artifact@v4', 'actions/download-artifact@v8'),
              ('actions/download-artifact@v5', 'actions/download-artifact@v8'),
              ('actions/download-artifact@v6', 'actions/download-artifact@v8'),
              ('actions/download-artifact@v7', 'actions/download-artifact@v8'),
              ('node-version: "20"', 'node-version: "24"'),
              ("node-version: '20'", "node-version: '24'"),
              ('node-version: 20', 'node-version: 24'),
              ('node-version: "22"', 'node-version: "24"'),
              ("node-version: '22'", "node-version: '24'"),
              ('node-version: 22', 'node-version: 24'),
          )
          for path in sorted([*root.glob('*.yml'), *root.glob('*.yaml')]):
              if path.name == generator:
                  continue
              original = path.read_text(encoding='utf-8')
              transformed = original
              for old, new in replacements:
                  transformed = transformed.replace(old, new)
              payload = base64.b64encode(transformed.encode('utf-8')).decode('ascii')
              blob_path = out / f'{path.name}.b64'
              blob_path.write_text(payload + '\n', encoding='ascii')
              rows.append(f'{path.as_posix()}\tops/workflow-migration/blobs/{path.name}.b64\t{int(original != transformed)}')
          Path('ops/workflow-migration/manifest.tsv').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f'generated={len(rows)} changed={sum(int(row.rsplit(chr(9),1)[1]) for row in rows)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/workflow-migration
          git commit -m 'chore: materialize workflow runtime migration payload'
          git push origin HEAD:agent/production-release-governance-20260807
