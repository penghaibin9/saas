# exact-head evidence trigger after W6-2 bot-authored fix
name: Academic B W6 FCFS Peak MySQL

on:
  push:
    branches:
      - agent/academic-b-schedule-selection
    paths:
      - backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py
      - backend/tests/test_aa_selection_w6_fcfs_peak_mysql.py
      - .github/workflows/academic-b-w6-fcfs-peak-mysql.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-b-w6-fcfs-peak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fcfs-peak-mysql:
    name: 128 last-seat + 1k burst
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_ENV: test
      DB_ENABLED: 'true'
      MOCK_LOGIN_ENABLED: 'true'
      JWT_SECRET: academic-b-w6-fcfs-peak-secret-at-least-32-bytes
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_w6_fcfs?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_w6_fcfs?charset=utf8mb4
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: academic_b_w6_fcfs
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact W6-1 head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and migrate clean MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
      - name: Run only W6-1 FCFS peak contracts
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q -p no:warnings \
            tests/test_aa_selection_w6_fcfs_peak_mysql.py \
            --maxfail=1 \
            --junitxml=w6-fcfs-peak-junit.xml
      - name: Upload W6-1 JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-b-w6-fcfs-peak-junit-${{ github.sha }}
          path: backend/w6-fcfs-peak-junit.xml
          if-no-files-found: error
          retention-days: 14
