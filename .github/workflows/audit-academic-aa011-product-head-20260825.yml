name: Audit Academic AA-011 Product Head 20260825

on:
  pull_request:
    branches:
      - audit/academic-aa011-runner-base-20260825

permissions:
  contents: read

concurrency:
  group: audit-academic-aa011-product-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  selection-gold:
    name: clean product head / selection browser / MySQL concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: academic_aa011_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      RUNNER_BRANCH: audit/academic-aa011-runner-base-20260825
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_aa011_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_aa011_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: academic_aa011_e2e
      REDIS_URL: redis://127.0.0.1:6379/12
      REDIS_KEY_PREFIX: academic-aa011-final-rc
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '3'
      JWT_SECRET: academic-aa011-browser-only-not-production
      JWT_SECRET_KEY: academic-aa011-browser-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_MINIAPP_BASE_URL: http://localhost:5188
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout clean product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Assert exact clean product head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Checkout latest AA-011 audit harness
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RUNNER_BRANCH }}
          path: audit-harness
          fetch-depth: 1

      - name: Overlay audit-only AA-011 files
        run: |
          set -euo pipefail
          ACTUAL_RUNNER_SHA="$(git -C audit-harness rev-parse HEAD)"
          REMOTE_RUNNER_SHA="$(git -C audit-harness ls-remote origin "refs/heads/$RUNNER_BRANCH" | awk '{print $1}')"
          test -n "$REMOTE_RUNNER_SHA"
          test "$ACTUAL_RUNNER_SHA" = "$REMOTE_RUNNER_SHA"
          echo "AA-011 exact product SHA: $TARGET_SHA"
          echo "AA-011 exact runner SHA: $ACTUAL_RUNNER_SHA"
          cp audit-harness/backend/tests/test_audit_aa011_cross_tenant_selection.py backend/tests/test_audit_aa011_cross_tenant_selection.py
          cp audit-harness/backend/scripts/e2e_assert_academic_aa011_same_batch.py backend/scripts/e2e_assert_academic_aa011_same_batch.py
          cp audit-harness/e2e/specs/academic-aa011-staff-selection-browser.spec.mjs e2e/specs/academic-aa011-staff-selection-browser.spec.mjs
          cp audit-harness/e2e/specs/academic-aa011-student-same-batch-browser.spec.mjs e2e/specs/academic-aa011-student-same-batch-browser.spec.mjs
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json
            miniapp/package-lock.json
            e2e/package-lock.json

      - name: Fast AA-011 preflight
        run: |
          set -euo pipefail
          python -m py_compile backend/tests/test_audit_aa011_cross_tenant_selection.py
          python -m py_compile backend/scripts/e2e_assert_academic_aa011_same_batch.py
          node --check e2e/specs/academic-aa011-staff-selection-browser.spec.mjs
          node --check e2e/specs/academic-aa011-student-same-batch-browser.spec.mjs

      - name: Install backend and migrate isolated MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head

      - name: Run only AA-011 MySQL business and concurrency seals
        working-directory: backend
        env:
          MOCK_LOGIN_ENABLED: 'true'
        run: |
          set -euo pipefail
          pytest -q -p no:warnings \
            tests/test_aa_selection.py::test_s3_enroll_when_not_open_409 \
            tests/test_aa_selection.py::test_s4_capacity_full_409 \
            tests/test_aa_selection.py::test_s6_duplicate_enroll_409 \
            tests/test_aa_selection.py::test_s14_reselect_flow \
            tests/test_aa_selection.py::test_s15_conflict_report \
            tests/test_aa_selection.py::test_s16_selection_result_merged_into_schedule \
            tests/test_aa_selection_w6_fcfs_peak_mysql.py::test_w6_last_seat_128_contenders_never_oversell \
            tests/test_aa_selection_w6_roster_reconcile_mysql.py \
            tests/test_audit_aa011_cross_tenant_selection.py \
            --maxfail=1 \
            --junitxml=/tmp/academic-aa011-mysql.xml

      - name: Seed isolated tenant
        working-directory: backend
        run: python scripts/e2e_seed_playwright_tenants.py

      - name: Start real backend with mock login disabled
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend-aa011.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend-aa011.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend-aa011.log
          exit 1

      - name: Bootstrap real AA-011 browser accounts
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py

      - name: Seed authoritative selection term course task and student facts
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_seed_academic_b_selection.py
          python scripts/e2e_seed_academic_b_w5_selection.py
          test -s ../e2e/academic-b-w5-fixture.json

      - name: Install production-build and start Staff PC
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: ''
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend-aa011.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend-aa011.pid

      - name: Install production-build and start Student PC
        env:
          VITE_BASE: /portal/
          VITE_API_BASE_URL: /
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd student-portal
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-aa011.log 2>&1 &
          echo $! > ../e2e/runtime-logs/student-aa011.pid

      - name: Install dual-build and start Student Mini H5
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd miniapp
          npm ci --no-audit --no-fund
          npm run build:h5
          npm run build:mp-weixin
          nohup npm run dev:h5 > ../e2e/runtime-logs/mini-aa011.log 2>&1 &
          echo $! > ../e2e/runtime-logs/mini-aa011.pid

      - name: Wait for all AA-011 browser surfaces
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login http://localhost:5188/; do
            ok=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "Surface not ready: $url"
              cat e2e/runtime-logs/*.log
              exit 1
            fi
          done

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Staff PC create supply publish open through real buttons
        working-directory: e2e
        run: npx playwright test specs/academic-aa011-staff-selection-browser.spec.mjs --workers=1 --retries=0 --reporter=line

      - name: Same-batch Student PC and Student Mini real selection parity
        working-directory: e2e
        env:
          E2E_MINIAPP_BASE_URL: http://localhost:5188
        run: npx playwright test specs/academic-aa011-student-same-batch-browser.spec.mjs --workers=1 --retries=0 --reporter=line

      - name: Assert same-batch Direct MySQL final state
        working-directory: backend
        run: python scripts/e2e_assert_academic_aa011_same_batch.py

      - name: Upload AA-011 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-aa011-product-evidence-${{ env.TARGET_SHA }}
          path: |
            /tmp/academic-aa011-mysql.xml
            e2e/test-results/
            e2e/playwright-report/
            e2e/academic-b-w5-fixture.json
            e2e/academic-aa011-staff-browser-fixture.json
            e2e/academic-aa011-student-browser-outcome.json
            e2e/academic-aa011-same-batch-mysql-seal.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload AA-011 runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-aa011-product-logs-${{ env.TARGET_SHA }}
          path: e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
