name: Audit Academic AA-011 Product Head 20260825

on:
  push:
    branches:
      - audit/academic-aa011-runner-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-aa011-product-head-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aa011:
    name: exact product base / two-browser last-seat / MySQL roster truth
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: academic_aa011_e2e
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      CI: 'true'
      AA011_PRODUCT_SHA: 2308cb51947906886921530e26599f6c622b92be
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_aa011_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_aa011_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: academic_aa011_e2e
      REDIS_URL: redis://127.0.0.1:6379/13
      REDIS_KEY_PREFIX: academic-aa011
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: academic-aa011-browser-only-not-production
      JWT_SECRET_KEY: academic-aa011-browser-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_MINIAPP_BASE_URL: http://localhost:5188
    steps:
      - name: Checkout audit runner on exact product base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove runner is audit-only over AA-011 product exact-head
        run: |
          set -euo pipefail
          git cat-file -e "${AA011_PRODUCT_SHA}^{commit}"
          test "$(git merge-base "$AA011_PRODUCT_SHA" HEAD)" = "$AA011_PRODUCT_SHA"
          mapfile -t changed < <(git diff --name-only "$AA011_PRODUCT_SHA"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          allowed_re='^(\.github/workflows/audit-academic-aa011-product-head-20260825\.yml|backend/scripts/e2e_seed_academic_aa011_selection\.py|backend/scripts/e2e_assert_academic_aa011_selection\.py|e2e/specs/academic-aa011-selection-concurrency\.spec\.mjs)$'
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed_re ]] || { echo "non-audit file changed: $file"; exit 1; }
          done
          test "${#changed[@]}" -eq 4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json
            miniapp/package-lock.json

      - name: Fast AA-011 runner preflight
        run: |
          set -euo pipefail
          python -m py_compile \
            backend/scripts/e2e_seed_academic_aa011_selection.py \
            backend/scripts/e2e_assert_academic_aa011_selection.py
          node --check e2e/specs/academic-aa011-selection-concurrency.spec.mjs

      - name: Install backend and migrate isolated MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
          alembic current

      - name: Seed only isolated tenant and identity prerequisites
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py
          python scripts/e2e_seed_academic_b_selection.py
          python scripts/e2e_seed_academic_b_w5_selection.py
          python scripts/e2e_seed_academic_aa011_selection.py

      - name: Start real backend with two workers
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs backend/tmp
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2 > ../e2e/runtime-logs/backend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend.pid
          ok=''
          for i in {1..75}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            cat ../e2e/runtime-logs/backend.log
            exit 1
          fi

      - name: Install production-build and start Staff PC
        run: |
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend.pid

      - name: Install production-build and start Student PC
        env:
          VITE_BASE: /portal/
          VITE_API_BASE_URL: /
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd student-portal
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-portal.log 2>&1 &
          echo $! > ../e2e/runtime-logs/student-portal.pid

      - name: Install dual-build and start Student Mini H5
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd miniapp
          npm ci --no-audit --no-fund
          npm run build:h5
          npm run build:mp-weixin
          nohup npm run dev:h5 > ../e2e/runtime-logs/miniapp.log 2>&1 &
          echo $! > ../e2e/runtime-logs/miniapp.pid

      - name: Wait for three real browser surfaces
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login http://localhost:5188/; do
            ok=''
            for i in {1..75}; do
              if curl -fsS "$url" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "Application not ready: $url"
              cat e2e/runtime-logs/*.log
              exit 1
            fi
          done

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Execute AA-011 complete selection concurrency through real browser buttons
        working-directory: e2e
        run: npx playwright test specs/academic-aa011-selection-concurrency.spec.mjs --reporter=line

      - name: Direct MySQL capacity record and locked-roster seal
        working-directory: backend
        run: python scripts/e2e_assert_academic_aa011_selection.py

      - name: Upload AA-011 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-aa011-evidence-${{ env.AA011_PRODUCT_SHA }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/academic-aa011-runtime.json
            e2e/academic-aa011-prereq.json
            e2e/academic-b-w5-fixture.json
            backend/tmp/e2e_academic_aa011_db_evidence.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload AA-011 runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-aa011-logs-${{ env.AA011_PRODUCT_SHA }}
          path: e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
