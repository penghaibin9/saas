name: Academic D W0 RED evidence

on:
  push:
    branches:
      - agent/academic-d-graduation-delivery
    paths:
      - '.github/workflows/academic-d-w0-red-evidence.yml'

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      PYTHONUNBUFFERED: '1'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    steps:
      - name: Checkout exact pre-fix RED head
        uses: actions/checkout@v4
        with:
          ref: 875ab46ebdccc56324856f8125470f4846e0127e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Run exact D-W0 RED contract
        working-directory: backend
        run: pytest tests/test_aa_graduation_d_w0_contract.py -q -p no:warnings
