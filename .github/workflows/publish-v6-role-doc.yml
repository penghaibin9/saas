name: Publish V6 role permissions doc

on:
  push:
    branches:
      - agent/docs-system-management-v6
    paths:
      - .github/workflows/publish-v6-role-doc.yml

permissions:
  contents: write

concurrency:
  group: publish-v6-role-doc
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/docs-system-management-v6
          fetch-depth: 0
      - name: Materialize exact V6 document
        env:
          PAYLOAD_GZIP_BASE64: ""
          EXPECTED_SHA256: "d5cf7c9be0596332e15058502deec4b74414fbec268c32b8c0ce6edec579cc39"
          TARGET_PATH: "docs/03-业务模块设计/系统管理中心/03_学校角色权限矩阵_V6唯一代码执行版.md"
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(os.environ["PAYLOAD_GZIP_BASE64"]))
          actual = hashlib.sha256(raw).hexdigest()
          expected = os.environ["EXPECTED_SHA256"]
          if actual != expected:
              raise SystemExit(f"sha256 mismatch: {actual} != {expected}")
          path = Path(os.environ["TARGET_PATH"])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(raw)
          PY
      - name: Commit exact document and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "docs/03-业务模块设计/系统管理中心/03_学校角色权限矩阵_V6唯一代码执行版.md"
          git rm -- .github/workflows/publish-v6-role-doc.yml
          git diff --cached --check
          git commit -m "docs: publish V6 role permissions contract"
          git push origin HEAD:agent/docs-system-management-v6
