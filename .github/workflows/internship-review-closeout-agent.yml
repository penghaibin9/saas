name: Internship Review Closeout Agent

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: internship-review-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/internship-production-hardening-20260803'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review closeout patch
        run: python scripts/agent/apply_internship_review_closeout.py
      - name: Validate changed production contracts
        run: |
          python -m py_compile \
            backend/app/modules/internship/services/internship_student_service.py \
            backend/app/modules/internship/services/internship_complaint_service.py \
            backend/tests/test_internship_review_closeout_static.py \
            scripts/check/check-internship-production-contracts.py
          python scripts/check/check-internship-production-contracts.py
          git diff --check
      - name: Commit review closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/agent/apply_internship_review_closeout.py
          git add -u
          git add backend/tests/test_internship_review_closeout_static.py
          if git diff --cached --quiet; then
            echo 'review closeout already committed'
            exit 0
          fi
          git commit -m 'fix: close internship review bypass and confidentiality gaps'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
