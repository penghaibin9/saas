name: Audit Academic Status R3 20260823

on:
  push:
    branches:
      - audit/academic-real-browser-20260823
    paths:
      - '.github/workflows/audit-academic-status-r3-20260823.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: penghaibin9/saas
      FIX_REF: fix/academic-e2e-school-iam-bootstrap-20260823
      FIX_SHA: fc0791c79475184b264803c818bbf4ab92d845aa
    steps:
      - name: Publish latest audit statuses
        run: |
          set -euo pipefail
          sleep 5
          {
            echo '## 教务审计 R3 即时状态'
            echo
            echo '| Workflow | Branch | Run | Status | Conclusion | Head | URL |'
            echo '|---|---|---:|---|---|---|---|'
          } > /tmp/status.md
          workflows=(
            academic-b-w3-schedule-real-click.yml
            academic-b-w4-selection-real-click.yml
            academic-c-w2-teacher-today-browser.yml
            academic-b-w5-student-projection-real-click.yml
          )
          for wf in "${workflows[@]}"; do
            row="$(gh run list --repo "$REPO" --workflow "$wf" --branch "$FIX_REF" --event workflow_dispatch --limit 30 --json databaseId,status,conclusion,headSha,url --jq ".[] | select(.headSha == \"$FIX_SHA\") | [.databaseId,.status,(.conclusion // \"\"),.headSha,.url] | @tsv" | head -n1)"
            if [ -z "$row" ]; then
              echo "| $wf | $FIX_REF | - | NOT_FOUND | - | - | - |" >> /tmp/status.md
            else
              id="$(printf '%s' "$row" | cut -f1)"; st="$(printf '%s' "$row" | cut -f2)"; co="$(printf '%s' "$row" | cut -f3)"; hd="$(printf '%s' "$row" | cut -f4)"; url="$(printf '%s' "$row" | cut -f5)"
              echo "| $wf | $FIX_REF | $id | $st | ${co:--} | \`$hd\` | $url |" >> /tmp/status.md
            fi
          done
          for wf in audit-academic-archive-w1-db-audit-seal-20260823.yml audit-academic-formation-exact-head-20260823.yml; do
            row="$(gh run list --repo "$REPO" --workflow "$wf" --branch audit/academic-real-browser-20260823 --limit 20 --json databaseId,status,conclusion,headSha,url --jq '.[0] | [.databaseId,.status,(.conclusion // ""),.headSha,.url] | @tsv' 2>/dev/null || true)"
            if [ -z "$row" ]; then
              echo "| $wf | audit/academic-real-browser-20260823 | - | NOT_FOUND | - | - | - |" >> /tmp/status.md
            else
              id="$(printf '%s' "$row" | cut -f1)"; st="$(printf '%s' "$row" | cut -f2)"; co="$(printf '%s' "$row" | cut -f3)"; hd="$(printf '%s' "$row" | cut -f4)"; url="$(printf '%s' "$row" | cut -f5)"
              echo "| $wf | audit/academic-real-browser-20260823 | $id | $st | ${co:--} | \`$hd\` | $url |" >> /tmp/status.md
            fi
          done
          gh issue comment 205 --repo "$REPO" --body-file /tmp/status.md
          cat /tmp/status.md
