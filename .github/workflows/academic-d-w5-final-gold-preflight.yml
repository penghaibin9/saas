name: Academic D W5 Final Gold Preflight

on:
  push:
    branches:
      - agent/academic-d-graduation-delivery
    paths:
      - .github/workflows/academic-d-w5-final-gold-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-d-w5-final-gold-preflight
  cancel-in-progress: true

env:
  MAIN_SHA: 4b706f392bd4213edcf4fbf81e4c292f90028c12
  A_SHA: a85324f42de675ab3d8178afa8c83517e6d049c7
  B_SHA: 101517c434c67b824153df732af3eedfb81fa639
  C_SHA: 36e5f15ba987261f9db6a509f53dba2a0ac55d01
  INT_SHA: c2bc328e51f337629655156b96a6e8fe5130637a
  APP_ENV: test
  DB_ENABLED: "true"
  DB_DRIVER: mysql
  MOCK_LOGIN_ENABLED: "true"
  JWT_SECRET: academic-d-w5-final-gold-preflight-secret-20260817
  DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_d_w5_gold?charset=utf8mb4
  TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_d_w5_gold?charset=utf8mb4
  FAST_TEST_SCHEMA: "0"

jobs:
  exact-head-replay:
    name: A -> B -> C -> D -> INT exact-head replay
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: academic_d_w5_gold
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout exact D head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin five-line exact heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/agent/academic-a-semester-core:refs/remotes/origin/agent/academic-a-semester-core" \
            "+refs/heads/agent/academic-b-schedule-selection:refs/remotes/origin/agent/academic-b-schedule-selection" \
            "+refs/heads/agent/academic-c-teaching-execution:refs/remotes/origin/agent/academic-c-teaching-execution" \
            "+refs/heads/integration/academic-school-gold:refs/remotes/origin/integration/academic-school-gold"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/agent/academic-a-semester-core)" = "$A_SHA"
          test "$(git rev-parse origin/agent/academic-b-schedule-selection)" = "$B_SHA"
          test "$(git rev-parse origin/agent/academic-c-teaching-execution)" = "$C_SHA"
          test "$(git rev-parse origin/integration/academic-school-gold)" = "$INT_SHA"
          {
            echo "main=$MAIN_SHA"
            echo "a=$A_SHA"
            echo "b=$B_SHA"
            echo "c=$C_SHA"
            echo "d=$GITHUB_SHA"
            echo "int=$INT_SHA"
          } | tee /tmp/academic-d-w5-head-matrix.txt

      - name: Ephemeral A -> B -> C -> D -> INT integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "academic-d-w5-final-gold"
          git config user.email "academic-d-w5-final-gold@invalid.local"
          git switch --detach "$MAIN_SHA"
          : > /tmp/academic-d-w5-merge-ledger.txt
          merge_layer() {
            local layer="$1"
            local sha="$2"
            echo "[merge] $layer $sha" | tee -a /tmp/academic-d-w5-merge-ledger.txt
            if ! git merge --no-ff --no-edit "$sha"; then
              echo "[conflicts] $layer" | tee -a /tmp/academic-d-w5-merge-ledger.txt
              git diff --name-only --diff-filter=U | tee -a /tmp/academic-d-w5-merge-ledger.txt
              exit 1
            fi
            echo "[merged] $layer tree=$(git rev-parse HEAD^{tree}) commit=$(git rev-parse HEAD)" \
              | tee -a /tmp/academic-d-w5-merge-ledger.txt
            git diff --check HEAD^
          }
          merge_layer A "$A_SHA"
          merge_layer B "$B_SHA"
          merge_layer C "$C_SHA"
          merge_layer D "$GITHUB_SHA"
          merge_layer INT "$INT_SHA"
          git status --short
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install frozen backend
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean-tenant schema Gold
        working-directory: backend
        run: |
          set -euo pipefail
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
          alembic current | tee /tmp/academic-d-w5-alembic-current.txt

      - name: Verify W5 contract inventory exists after overlay
        working-directory: backend
        run: |
          set -euo pipefail
          files=(
            tests/test_aa_school_setup_program_post_confirm_pipeline_int.py
            tests/test_academic_int_ac4_schema_mysql.py
            tests/test_academic_int_c1_attendance_backfill_mysql.py
            tests/test_aa_selection_w6_roster_reconcile_mysql.py
            tests/test_aa_attendance_published_occurrence_contract.py
            tests/test_aa_graduation_d_w0_scope_guard.py
            tests/test_aa_archive_d_w1_authority_regressions.py
            tests/test_aa_semester_pilot_r11.py
            tests/test_aa_main_permission_middleware_compat.py
          )
          printf '%s\n' "${files[@]}" | tee /tmp/academic-d-w5-contract-inventory.txt
          for file in "${files[@]}"; do test -f "$file"; done

      - name: Migrated-tenant + authority + negative contracts
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q -p no:warnings \
            tests/test_aa_school_setup_program_post_confirm_pipeline_int.py \
            tests/test_academic_int_ac4_schema_mysql.py \
            tests/test_academic_int_c1_attendance_backfill_mysql.py \
            tests/test_aa_selection_w6_roster_reconcile_mysql.py \
            tests/test_aa_attendance_published_occurrence_contract.py \
            tests/test_aa_graduation_d_w0_scope_guard.py \
            tests/test_aa_archive_d_w1_authority_regressions.py \
            tests/test_aa_semester_pilot_r11.py \
            tests/test_aa_main_permission_middleware_compat.py \
            --maxfail=1 \
            --junitxml=/tmp/academic-d-w5-targeted.xml

      - name: Write fail-closed W5 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "w5_phase=PRE_GOLD_REPLAY"
            echo "d_source_commit=$GITHUB_SHA"
            echo "main_commit=$MAIN_SHA"
            echo "a_commit=$A_SHA"
            echo "b_commit=$B_SHA"
            echo "c_commit=$C_SHA"
            echo "int_commit=$INT_SHA"
            echo "clean_tenant_schema_attempted=true"
            echo "migrated_tenant_contracts_attempted=true"
            echo "permission_negative_contract_included=true"
            echo "datascope_negative_contract_included=true"
            echo "cross_tenant_sentinel_included=true"
            echo "r11_contract_included=true"
            echo "twenty_k_proven_on_w5_head=false"
            echo "outbox_recovery_proven_on_w5_head=false"
            echo "mysql_pitr_proven_on_w5_head=false"
            echo "fileobject_restore_proven_on_w5_head=false"
            echo "final_browser_gold_proven_on_w5_head=false"
            echo "w5_final_gold=false"
          } > /tmp/academic-d-w5-evidence.txt
          sha256sum /tmp/academic-d-w5-evidence.txt > /tmp/academic-d-w5-evidence.txt.sha256

      - name: Upload W5 pre-Gold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-d-w5-pre-gold-${{ github.sha }}
          path: |
            /tmp/academic-d-w5-head-matrix.txt
            /tmp/academic-d-w5-merge-ledger.txt
            /tmp/academic-d-w5-alembic-current.txt
            /tmp/academic-d-w5-contract-inventory.txt
            /tmp/academic-d-w5-targeted.xml
            /tmp/academic-d-w5-evidence.txt
            /tmp/academic-d-w5-evidence.txt.sha256
          if-no-files-found: warn
          retention-days: 30
