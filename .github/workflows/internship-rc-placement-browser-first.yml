name: Internship RC IX-009 Browser First

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/scripts/e2e_seed_internship_enterprise_position_sandbox.py'
      - 'backend/scripts/e2e_verify_internship_placement_db.py'
      - 'backend/app/modules/internship/services/internship_student_service.py'
      - 'backend/app/modules/internship/services/internship_match_service.py'
      - 'backend/app/modules/internship/services/internship_assignment_snapshot_authority.py'
      - 'backend/app/modules/internship/services/internship_student_selection_service.py'
      - 'backend/app/modules/internship/services/internship_student_selection_actions_service.py'
      - 'backend/app/modules/internship/services/internship_application_material_snapshot_service.py'
      - 'backend/app/modules/internship/services/internship_student_position_eligibility_service.py'
      - 'backend/app/modules/internship/schemas/internship_student.py'
      - 'backend/app/modules/internship/routers/internship_student.py'
      - 'frontend/src/modules/internship/views/AdminInternshipLayout.vue'
      - 'frontend/src/modules/internship/views/InternshipMatchListView.vue'
      - 'frontend/src/modules/internship/views/InternshipStudentListView.vue'
      - 'frontend/src/modules/internship/api/match.api.js'
      - 'frontend/src/modules/internship/api/internship-student.api.js'
      - 'frontend/src/modules/internship/pickerAdapters.js'
      - 'student-portal/src/views/internship/InternshipSelectionView.vue'
      - 'student-portal/src/views/internship/InternshipView.vue'
      - 'student-portal/src/services/internshipSelectionApi.js'
      - 'miniapp/src/pages/student/internship/index.vue'
      - 'miniapp/src/components/login/MiniLoginAuthPanel.vue'
      - 'e2e/specs/internship-placement-assignment-audit.spec.mjs'
      - '.github/actions/internship-e2e-*/**'
      - '.github/workflows/internship-rc-placement-browser-first.yml'
  workflow_dispatch:

concurrency:
  group: internship-rc-ix009-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ix-009:
    name: IX-009 / real MySQL / Staff+Student PC+Student Mini browser
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/14
      REDIS_KEY_PREFIX: internship-rc-ix009
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: internship-rc-ix009-e2e-only-not-production
      JWT_SECRET_KEY: internship-rc-ix009-e2e-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_ENTERPRISE_BASE_URL: http://127.0.0.1:5202/enterprise
      E2E_STUDENT_MINI_BASE_URL: http://127.0.0.1:5188
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact RC SHA
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "actual=$ACTUAL"
          echo "expected=$E2E_EXPECTED_SHA"
          test "$ACTUAL" = "$E2E_EXPECTED_SHA"

      - name: Prepare shared E2E toolchain
        uses: ./.github/actions/internship-e2e-toolchain
        with:
          node-cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json
            enterprise-portal/package-lock.json
            miniapp/package-lock.json

      - name: Migrate isolated real MySQL
        uses: ./.github/actions/internship-e2e-mysql-migrate
        with:
          verify-schema-parity: 'true'

      - name: Bootstrap shared browser runtime
        uses: ./.github/actions/internship-e2e-browser-runtime

      - name: Seed IX-009 batch/student prerequisites only
        working-directory: backend
        run: python scripts/e2e_seed_internship_enterprise_position_sandbox.py

      - name: Start shared browser applications
        uses: ./.github/actions/internship-e2e-app-start
        with:
          start-staff: 'true'
          start-student: 'true'
          start-enterprise: 'true'
          start-miniapp: 'true'
          miniapp-log-name: student-mini.log
          miniapp-pid-name: student-mini.pid

      - name: Wait for all browser applications
        run: |
          for url in \
            http://127.0.0.1:5173/login \
            http://127.0.0.1:5199/portal/login \
            http://127.0.0.1:5202/enterprise/login \
            http://127.0.0.1:5188/
          do
            ok=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "Application not ready: $url"
              cat e2e/runtime-logs/*.log
              exit 1
            fi
          done

      - name: Reassert Browser First runtime safety
        run: |
          set -euo pipefail
          test "$MOCK_LOGIN_ENABLED" = 'false'
          python - <<'PY'
          import os
          url = os.environ['DATABASE_URL'].lower()
          assert url.startswith('mysql')
          assert 'e2e' in url or 'test' in url
          assert 'prod' not in url and 'staging' not in url
          print('[ix-009] real MySQL + mock login disabled')
          PY

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Browser First IX-009 only
        working-directory: e2e
        run: >-
          npx playwright test
          specs/internship-placement-assignment-audit.spec.mjs
          --workers=1

      - name: Upload IX-009 HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-rc-ix009-html-${{ github.run_id }}
          path: e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload IX-009 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-rc-ix009-evidence-${{ github.run_id }}
          path: e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload IX-009 service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-rc-ix009-service-logs-${{ github.run_id }}
          path: e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
