name: Verification SMS policy hardening

on:
  push:
    branches:
      - feat/adaptive-login-captcha-20260805
    paths:
      - scripts/automation/harden_verification_sms_policy.py
      - .github/workflows/harden-verification-sms-policy.yml

permissions:
  contents: write

concurrency:
  group: verification-sms-policy-hardening
  cancel-in-progress: false

jobs:
  harden-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-login-captcha-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Apply audited SMS policy hardening
        run: python scripts/automation/harden_verification_sms_policy.py
      - name: Python syntax check
        run: python -m compileall -q backend/app backend/tests/test_auth_challenge_service.py
      - name: Backend regression tests
        working-directory: backend
        env:
          APP_ENV: test
          DEPLOYMENT_MODE: local
          DB_ENABLED: 'false'
          REDIS_URL: ''
          TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
          FAST_TEST_SCHEMA: '1'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests/test_auth_challenge_service.py -q -p no:warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Student portal checks
        working-directory: student-portal
        run: npm ci && npm run lint && npm test && npm run build
      - name: Commit hardened policy
        run: |
          rm -f scripts/automation/harden_verification_sms_policy.py .github/workflows/harden-verification-sms-policy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/student_portal/services/guardian_service.py \
                  backend/app/student_portal/router.py backend/app/core/config.py \
                  backend/tests/test_auth_challenge_service.py \
                  student-portal/src/router/index.js \
                  scripts/automation/harden_verification_sms_policy.py \
                  .github/workflows/harden-verification-sms-policy.yml
          git diff --cached --check
          git commit -m 'fix(auth): reserve verification SMS for password reset'
          git push origin HEAD:feat/adaptive-login-captcha-20260805
