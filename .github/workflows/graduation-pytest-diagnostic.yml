name: Graduation Pytest Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: graduation-pytest-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  graduation-pytest-diagnostic:
    if: github.head_ref == 'codex/student-affairs-leave-cutover-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_migration?charset=utf8mb4
      PYTHONUNBUFFERED: "1"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Run exact graduation pytest and capture log
        id: pytest
        working-directory: backend
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 35m pytest tests/test_graduation*.py -q -p no:warnings --durations=30 2>&1 | tee ../graduation-pytest-diagnostic.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graduation-pytest-diagnostic-log
          path: graduation-pytest-diagnostic.log
          retention-days: 2
      - name: Stop on pytest failure
        if: steps.pytest.outputs.status != '0'
        run: exit 1
