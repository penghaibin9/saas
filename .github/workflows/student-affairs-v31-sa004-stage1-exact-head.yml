name: Student Affairs V3.1 SA-004 Stage-1 exact-head

on:
  workflow_dispatch:
  push:
    branches:
      - audit/student-affairs-v31-final-runner-20260827
    paths:
      - '.github/workflows/student-affairs-v31-sa004-stage1-exact-head.yml'

permissions:
  contents: read

concurrency:
  group: student-affairs-v31-sa004-stage1
  cancel-in-progress: true

jobs:
  sa004-stage1:
    name: SA-004 Browser First / permissions / MySQL / real time gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_sa004_contract?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/15
      REDIS_KEY_PREFIX: student-affairs-v31-sa004-stage1
      JWT_SECRET: student-affairs-v31-sa004-stage1-secret-at-least-32-bytes
      JWT_SECRET_KEY: student-affairs-v31-sa004-stage1-secret-at-least-32-bytes
      PYTHONPATH: .
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_TARGET_SHA: 2019ca946ce2bc2c21dc9e76a8de0ce674c2d03d

    steps:
      - name: Checkout immutable runner
        uses: actions/checkout@v4
        with:
          ref: audit/student-affairs-v31-final-runner-20260827
          path: runner
          fetch-depth: 1

      - name: Checkout immutable product exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.E2E_TARGET_SHA }}
          path: app
          fetch-depth: 1

      - name: Assert exact product source
        run: |
          set -euo pipefail
          actual="$(git -C app rev-parse HEAD)"
          echo "tested_product_exact_sha=$actual"
          test "$actual" = "$E2E_TARGET_SHA"
          test -z "$(git -C app status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/student-portal/package-lock.json
            app/e2e/package-lock.json

      - name: Install backend and prepare isolated contract database
        working-directory: app/backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python - <<'PY'
          import pymysql
          db = pymysql.connect(host='127.0.0.1', port=3306, user='root', password='e2e_root', autocommit=True)
          try:
              with db.cursor() as cur:
                  cur.execute('CREATE DATABASE IF NOT EXISTS student_lifecycle_sa004_contract CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci')
          finally:
              db.close()
          print('SA004_CONTRACT_DB_READY')
          PY

      - name: Migrate real Browser database and publish IAM authority
        working-directory: app/backend
        run: |
          set -euo pipefail
          alembic upgrade head
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Run only current SA-004 changed contracts
        working-directory: app/backend
        run: |
          set -euo pipefail
          pytest -q -p no:warnings \
            tests/test_affairs_permission_codes.py::test_counselor_self_service_eval_only \
            tests/test_affairs_phase2_role_matrix.py \
            tests/test_affairs_funding_appeal_list_version.py \
            tests/test_affairs_four_end_ui_contract.py::test_funding_publicity_manual_confirm_keeps_optimistic_lock_version
          python - <<'PY'
          from app.services.system_role_shadow_service import expected_system_role_permissions
          codes = set(expected_system_role_permissions('COUNSELOR'))
          assert 'studentAffairs.funding.approve' in codes, sorted(codes)
          assert 'studentAffairs.funding.project.manage' not in codes, sorted(codes)
          assert 'studentAffairs.funding.publicity.manage' not in codes, sorted(codes)
          print('SA004_COUNSELOR_PERMISSION_BOUNDARY_PASS')
          PY

      - name: Re-converge real Browser database after isolated contracts
        working-directory: app/backend
        run: |
          set -euo pipefail
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend
        run: |
          set -euo pipefail
          mkdir -p app/e2e/runtime-logs
          cd app/backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Bootstrap canonical SA-004 identities and counselor scopes
        working-directory: app/backend
        run: python ../../runner/audit-tests/student-affairs-sa004-bootstrap-v3.py

      - name: Start official external scheduler
        run: |
          set -euo pipefail
          cd app/backend
          nohup python scripts/run_scheduled_jobs.py > ../e2e/runtime-logs/scheduler.log 2>&1 &
          echo $! > ../e2e/runtime-logs/scheduler.pid

      - name: Start real Staff PC and Student PC
        run: |
          set -euo pipefail
          cd app/frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          cd ../student-portal
          npm ci
          VITE_BASE=/portal/ VITE_API_BASE_URL=/ VITE_PROXY_TARGET=http://127.0.0.1:8000 nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-portal.log 2>&1 &

      - name: Wait for real browser applications
        run: |
          set -euo pipefail
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login; do
            ready=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ -z "$ready" ]; then
              echo "not ready: $url"
              cat app/e2e/runtime-logs/*.log || true
              exit 1
            fi
          done

      - name: Install Chromium and inject audited SA-004 Browser specs
        run: |
          set -euo pipefail
          cp runner/audit-tests/student-affairs-scholarship-config-browser-v3.spec.mjs app/e2e/specs/student-affairs-scholarship-config-browser-v3.spec.mjs
          cp runner/audit-tests/student-affairs-scholarship-browser-audit.spec.mjs app/e2e/specs/student-affairs-scholarship-browser-audit.spec.mjs
          cd app/e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser First - create real scholarship project and one-day batch
        working-directory: app/e2e
        run: npx playwright test specs/student-affairs-scholarship-config-browser-v3.spec.mjs

      - name: Direct MySQL - verify project and batch configuration truth
        working-directory: app/backend
        run: python ../../runner/audit-tests/student-affairs-sa004-verify-v3.py config

      - name: Browser First - scholarship journey to real publicity time gate
        working-directory: app/e2e
        run: npx playwright test specs/student-affairs-scholarship-browser-audit.spec.mjs

      - name: Direct MySQL - verify journey audit and real publicity wait
        working-directory: app/backend
        run: python ../../runner/audit-tests/student-affairs-sa004-verify-v3.py journey

      - name: Freeze immutable Stage-1 authority for legitimate Stage-2
        run: |
          set -euo pipefail
          if [ -f app/e2e/runtime-logs/scheduler.pid ]; then
            kill "$(cat app/e2e/runtime-logs/scheduler.pid)" 2>/dev/null || true
          fi
          mkdir -p state
          if ! command -v mysqldump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y default-mysql-client
          fi
          MYSQL_PWD=e2e_root mysqldump \
            -h 127.0.0.1 -P 3306 -uroot \
            --single-transaction --quick --skip-lock-tables --no-tablespaces \
            student_lifecycle_e2e > state/student_lifecycle_e2e.sql
          cp app/e2e/student-affairs-scholarship-config-v3-evidence.json state/
          cp app/e2e/student-affairs-scholarship-audit-evidence.json state/
          RUNNER_SHA="$(git -C runner rev-parse HEAD)" python - <<'PY'
          from datetime import timedelta
          import hashlib, json, os
          from pathlib import Path
          import pymysql

          evidence_path = Path('state/student-affairs-scholarship-audit-evidence.json')
          dump_path = Path('state/student_lifecycle_e2e.sql')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          app_id = int(evidence['applicationId'])
          batch_id = int(evidence['batchId'])
          appeal_id = int(evidence['appealId'])
          db = pymysql.connect(host='127.0.0.1', port=3306, user='root', password='e2e_root', database='student_lifecycle_e2e', charset='utf8mb4')
          try:
              with db.cursor() as cur:
                  cur.execute('SELECT student_id,status,publicity_at,version,workflow_instance_id FROM t_affairs_funding_application WHERE id=%s', (app_id,))
                  app = cur.fetchone()
                  assert app and app[1] == 'PUBLICITY' and app[2] is not None, app
                  cur.execute('SELECT publicity_days FROM t_affairs_funding_batch WHERE id=%s', (batch_id,))
                  days = max(1, int(cur.fetchone()[0] or 5))
                  due_at = app[2] + timedelta(days=days)
                  cur.execute('SELECT UTC_TIMESTAMP(6)')
                  frozen_at = cur.fetchone()[0]
                  assert due_at > frozen_at, (frozen_at, due_at)
                  cur.execute('SELECT status,result,open_key FROM t_affairs_funding_appeal WHERE id=%s', (appeal_id,))
                  assert cur.fetchone() == ('CLOSED', 'OVERRULED', None)
          finally:
              db.close()
          manifest = {
              'sourceRunId': os.environ['GITHUB_RUN_ID'],
              'productSha': os.environ['E2E_TARGET_SHA'],
              'runnerSha': os.environ['RUNNER_SHA'],
              'applicationId': str(app_id),
              'batchId': str(batch_id),
              'appealId': str(appeal_id),
              'studentId': str(app[0]),
              'workflowInstanceId': str(app[4] or ''),
              'preVersion': int(app[3]),
              'publicityAt': app[2].isoformat(),
              'publicityDays': days,
              'dueAt': due_at.isoformat(),
              'frozenAt': frozen_at.isoformat(),
              'dumpSha256': hashlib.sha256(dump_path.read_bytes()).hexdigest(),
              'evidenceSha256': hashlib.sha256(evidence_path.read_bytes()).hexdigest(),
              'stage1Result': 'TIME_GATED_PRECHECK_PASS'
          }
          Path('state/student-affairs-sa004-time-gate-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, sort_keys=True, indent=2), encoding='utf-8')
          print('SA004_TIME_GATE_FROZEN', json.dumps(manifest, ensure_ascii=False, sort_keys=True))
          PY

      - name: Reassert immutable product exact head
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"
          git -C app diff --exit-code
          git -C app diff --cached --exit-code

      - name: Upload immutable SA-004 Stage-1 time-gate authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-affairs-v31-sa004-stage1-${{ env.E2E_TARGET_SHA }}-${{ github.run_id }}
          path: |
            state/student_lifecycle_e2e.sql
            state/student-affairs-scholarship-config-v3-evidence.json
            state/student-affairs-scholarship-audit-evidence.json
            state/student-affairs-sa004-time-gate-manifest.json
            app/e2e/playwright-report/
            app/e2e/test-results/
            app/e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 7
