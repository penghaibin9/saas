name: PR219 Real Browser Grade V3 20260828

on:
  push:
    branches: [audit/pr219-real-browser-core-20260828]
    paths: ['.github/workflows/pr219-real-browser-grade-v3-20260828.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_SHA: 6457558e0951da62b53227f9fafd9eb292ad41a3
  HARNESS_REF: fix/academic-e2e-school-iam-bootstrap-20260823

jobs:
  real-click:
    name: Grade full lifecycle real Chromium + MySQL seal
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: academic_pr219_grade_v3
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_pr219_grade_v3?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_pr219_grade_v3?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: academic_pr219_grade_v3
      REDIS_URL: redis://127.0.0.1:6379/10
      REDIS_KEY_PREFIX: academic-pr219-grade-v3
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: academic-pr219-grade-v3-only-not-production
      JWT_SECRET_KEY: academic-pr219-grade-v3-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://localhost:8000/api/v1
      E2E_STAFF_BASE_URL: http://localhost:5173
      E2E_STUDENT_BASE_URL: http://localhost:5199/portal
      E2E_EXPECTED_SHA: 6457558e0951da62b53227f9fafd9eb292ad41a3
      SCHOOL_IAM_AUTHORITY_EXPECTED_SHA: 6457558e0951da62b53227f9fafd9eb292ad41a3
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout immutable PR219 product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Assert exact PR219 product tree before harness overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain)"
          echo "product_sha=$(git rev-parse HEAD)"

      - name: Overlay exactly three browser-test harness files
        shell: bash
        run: |
          set -euo pipefail
          git show origin/${HARNESS_REF}:backend/scripts/e2e_seed_academic_c_grade_browser.py > backend/scripts/e2e_seed_academic_c_grade_browser.py
          git show origin/${HARNESS_REF}:backend/scripts/e2e_assert_academic_c_grade_browser.py > backend/scripts/e2e_assert_academic_c_grade_browser.py
          git show origin/${HARNESS_REF}:e2e/specs/academic-c-grade-full-browser.spec.mjs > e2e/specs/academic-c-grade-full-browser.spec.mjs
          ACTUAL=$(git status --porcelain | awk '{print $2}' | sort)
          EXPECTED=$(printf '%s\n' \
            backend/scripts/e2e_assert_academic_c_grade_browser.py \
            backend/scripts/e2e_seed_academic_c_grade_browser.py \
            e2e/specs/academic-c-grade-full-browser.spec.mjs | sort)
          test "$ACTUAL" = "$EXPECTED"
          test -z "$(git status --porcelain -- backend/app frontend/src student-portal/src)"
          echo "$ACTUAL"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json
            e2e/package-lock.json

      - name: Validate overlay syntax only
        run: |
          set -euo pipefail
          python -m py_compile backend/scripts/e2e_seed_academic_c_grade_browser.py backend/scripts/e2e_assert_academic_c_grade_browser.py
          node --check e2e/specs/academic-c-grade-full-browser.spec.mjs

      - name: Install backend and migrate isolated MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head

      - name: Install production School IAM authority
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend-grade.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend-grade.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend-grade.log
          exit 1

      - name: Bootstrap real academic-affairs accounts
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_bootstrap_academic_affairs_accounts.py
          test -s tmp/e2e_academic_affairs_credentials.local.json

      - name: Seed grade prerequisites only
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_seed_academic_c_grade_browser.py
          test -s ../e2e/academic-c-grade-browser-fixture.json
          python - <<'PY'
          import json
          p = json.load(open('../e2e/academic-c-grade-browser-fixture.json', encoding='utf-8'))
          assert p['teachingTaskId'] and p['teachingClassId'] and p['courseName']
          print(json.dumps({k:p.get(k) for k in ('tenant','termId','teachingTaskId','teachingClassId','courseName')}, ensure_ascii=False))
          PY

      - name: Production-build and start staff PC same-site
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: /api/v1
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev -- --host 0.0.0.0 --port 5173 > ../e2e/runtime-logs/frontend-grade.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend-grade.pid

      - name: Production-build and start Student PC same-site
        env:
          VITE_BASE: /portal/
          VITE_API_BASE_URL: /
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd student-portal
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev -- --host 0.0.0.0 --port 5199 > ../e2e/runtime-logs/student-grade.log 2>&1 &
          echo $! > ../e2e/runtime-logs/student-grade.pid

      - name: Wait for both real browser surfaces
        run: |
          set -euo pipefail
          for url in http://localhost:5173/login http://localhost:5199/portal/login; do
            ok=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "Surface not ready: $url"
              cat e2e/runtime-logs/*.log
              exit 1
            fi
          done

      - name: Install real Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Execute complete grade lifecycle through real browser buttons
        working-directory: e2e
        run: npx playwright test specs/academic-c-grade-full-browser.spec.mjs --workers=1 --retries=0 --reporter=line

      - name: Direct MySQL projection todo and audit seal
        working-directory: backend
        run: python scripts/e2e_assert_academic_c_grade_browser.py

      - name: Prove product source remained exact after browser run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain -- backend/app frontend/src student-portal/src)"

      - name: Upload grade browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr219-grade-v3-evidence-${{ env.PRODUCT_SHA }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/academic-c-grade-browser-fixture.json
            backend/tmp/e2e_academic_c_grade_browser_db_evidence.json
            e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
