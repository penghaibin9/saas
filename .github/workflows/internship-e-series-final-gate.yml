name: Internship E-series Final Gate

on:
  pull_request:
    paths:
      - 'backend/app/modules/internship/**'
      - 'backend/app/models/internship*'
      - 'backend/tests/test_internship_e_series_final_mysql.py'
      - 'backend/tests/test_internship_enterprise_*.py'
      - 'backend/tests/test_internship_volunteer_*.py'
      - 'backend/tests/test_internship_placement_snapshot_mysql.py'
      - 'enterprise-portal/**'
      - 'student-portal/**'
      - 'miniapp/**'
      - '.github/workflows/internship-e-series-final-gate.yml'

permissions:
  contents: read

concurrency:
  group: internship-e-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  final-seal:
    name: real MySQL / cross-authority / hot-position / 20K / security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: test
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/internship_e_final?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/internship_e_final?charset=utf8mb4
      MOCK_LOGIN_ENABLED: 'false'
      JWT_SECRET: internship-e-final-only-not-production
      JWT_SECRET_KEY: internship-e-final-only-not-production
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: internship_e_final
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact integration candidate
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography pytest-timeout

      - name: Build exact fresh MySQL schema
        working-directory: backend
        run: |
          set -e
          mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"
          mysql -h 127.0.0.1 -uroot -proot -e \
            "ALTER DATABASE internship_e_final CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          test "$(python -m alembic heads | grep -c '(head)')" = "1"
          python -m alembic upgrade head
          python -m alembic current

      - name: E-series final real-MySQL seal
        working-directory: backend
        run: |
          timeout 22m pytest -vv -p no:warnings \
            tests/test_internship_e_series_final_mysql.py \
            tests/test_internship_volunteer_mysql_concurrency.py \
            tests/test_internship_volunteer_decision_mysql_lifecycle.py \
            tests/test_internship_placement_snapshot_mysql.py \
            --timeout=180 --timeout-method=signal --durations=25

      - name: E-series negative security and privacy seal
        working-directory: backend
        run: |
          pytest -q -p no:warnings \
            tests/test_internship_enterprise_access.py \
            tests/test_internship_enterprise_auth_context.py \
            tests/test_internship_enterprise_application_decision.py \
            tests/test_internship_application_resume_pdf.py \
            tests/test_internship_recruitment_window_guard.py \
            tests/test_internship_student_selection_post_submit_contract.py

      - name: Production authority and route contracts
        run: |
          python scripts/check/check-internship-production-contracts.py
          python scripts/check/check-internship-route-permissions.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: enterprise-portal/package-lock.json

      - name: Enterprise portal final contract build
        working-directory: enterprise-portal
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run lint
          npm run build
          node ../scripts/check/scan-fixed-demo-credentials.mjs dist
