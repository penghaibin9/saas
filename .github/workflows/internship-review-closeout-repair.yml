name: internship-review-closeout-repair

on:
  push:
    branches:
      - fix/internship-prelaunch-p1p2-20260828

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore(internship): run review closeout repair' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/internship-prelaunch-p1p2-20260828
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply review closeout patch
        run: python .github/scripts/fix_internship_review_closeout.py

      - name: Python syntax gate
        run: |
          python -m py_compile \
            backend/app/modules/internship/services/internship_participant_service.py \
            backend/app/modules/internship/services/internship_student_service.py

      - name: Static regression contracts
        run: |
          cd backend
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('tests/test_internship_prelaunch_static_contracts.py')
          spec = importlib.util.spec_from_file_location('prelaunch_contracts', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tests = sorted(name for name in dir(module) if name.startswith('test_'))
          for name in tests:
              getattr(module, name)()
              print(f'PASS {name}')
          print(f'{len(tests)} static contracts passed')
          PY

      - name: Targeted review invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          participant = Path('backend/app/modules/internship/services/internship_participant_service.py').read_text(encoding='utf-8')
          student = Path('backend/app/modules/internship/services/internship_student_service.py').read_text(encoding='utf-8')
          assert 'def _visible_participant_student_ids' in participant
          assert 'apply_internship_record_scope' in participant
          assert 'def _get_for_update' in student
          for name in ('set_status', 'set_eligibility', 'set_destination'):
              start = student.index(f'def {name}')
              end = student.find('\ndef ', start + 4)
              block = student[start:] if end < 0 else student[start:end]
              assert '_get_for_update(db, rec_id)' in block
              assert 'r.version = int(r.version or 0) + 1' in block
          print('review closeout invariants passed')
          PY

      - name: Diff hygiene gate
        run: git diff --check

      - name: Remove one-shot codemod
        run: rm .github/scripts/fix_internship_review_closeout.py

      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/scripts/fix_internship_review_closeout.py \
            backend/app/modules/internship/services/internship_participant_service.py \
            backend/app/modules/internship/services/internship_student_service.py \
            backend/tests/test_internship_prelaunch_static_contracts.py
          git diff --cached --check
          git commit -m 'fix(internship): preserve frozen roster and record concurrency'
          git push origin HEAD:fix/internship-prelaunch-p1p2-20260828
