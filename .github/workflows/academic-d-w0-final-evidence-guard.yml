name: Academic D W0 final evidence guard

on:
  push:
    branches:
      - agent/academic-d-graduation-delivery
    paths:
      - '.github/scripts/academic_d_w0_final_evidence_guard.py'
      - '.github/workflows/academic-d-w0-final-evidence-guard.yml'

permissions:
  contents: write

jobs:
  mysql-final-evidence-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-d-graduation-delivery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Apply immutable final evidence guard
        run: python .github/scripts/academic_d_w0_final_evidence_guard.py
      - name: Run W0 contract on MySQL
        working-directory: backend
        run: pytest -q -p no:warnings tests/test_graduation_d_w0_contract.py
      - name: Compile and diff integrity
        run: |
          python -m py_compile backend/app/modules/academic_affairs/services/academic_affairs_graduation_immutable_service.py
          git diff --check
      - name: Commit production guard and self-clean
        run: |
          rm .github/scripts/academic_d_w0_final_evidence_guard.py
          rm .github/workflows/academic-d-w0-final-evidence-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/modules/academic_affairs/services/academic_affairs_graduation_immutable_service.py backend/tests/test_graduation_d_w0_contract.py
          git add -u
          git diff --cached --check
          git commit -m 'fix(academic-d): validate immutable run evidence at final'
          git push origin HEAD:agent/academic-d-graduation-delivery
