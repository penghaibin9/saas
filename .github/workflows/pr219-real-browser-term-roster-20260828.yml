name: PR219 Real Browser Calendar Roster 20260828

on:
  push:
    branches: [audit/pr219-real-browser-core-20260828]
    paths: ['.github/workflows/pr219-real-browser-term-roster-20260828.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr219-real-browser-calendar-roster-20260828
  cancel-in-progress: true

env:
  PRODUCT_SHA: 6457558e0951da62b53227f9fafd9eb292ad41a3

jobs:
  calendar-roster-real-click:
    name: Calendar copy and registration real Chromium clicks
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: academic_pr219_d1d2_e2e
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_pr219_d1d2_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_pr219_d1d2_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: academic_pr219_d1d2_e2e
      REDIS_URL: redis://127.0.0.1:6379/11
      REDIS_KEY_PREFIX: academic-pr219-d1d2
      JWT_SECRET: academic-pr219-d1d2-browser-only-not-production
      JWT_SECRET_KEY: academic-pr219-d1d2-browser-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_EXPECTED_SHA: 6457558e0951da62b53227f9fafd9eb292ad41a3
      SCHOOL_IAM_AUTHORITY_EXPECTED_SHA: 6457558e0951da62b53227f9fafd9eb292ad41a3
    steps:
      - name: Checkout immutable PR219 product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0
      - name: Assert exact PR219 product head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          echo "browser_product_sha=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and migrate isolated MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
      - name: Replay production School IAM Authority
        working-directory: backend
        run: python scripts/bootstrap_control_plane_school_iam_authority.py
      - name: Seed tenant foundation
        working-directory: backend
        run: python scripts/e2e_seed_playwright_tenants.py
      - name: Seed real School IAM runtime fixture
        working-directory: backend
        run: python scripts/e2e_seed_control_plane_school_iam.py
      - name: Start backend
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1
      - name: Bootstrap authoritative academic admin identity and roster class
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py
      - name: Production-build and start staff PC
        run: |
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5173/login >/dev/null && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/frontend.log
          exit 1
      - name: Install real Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Execute calendar and registration visible-click flows
        working-directory: e2e
        run: |
          set -euo pipefail
          npx playwright test \
            specs/academic-affairs-term-calendar-convenience.spec.mjs \
            specs/academic-affairs-roster-registration-convenience.spec.mjs \
            --reporter=line
      - name: Upload calendar roster screenshots traces report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr219-calendar-roster-browser-evidence-${{ env.PRODUCT_SHA }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload calendar roster runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr219-calendar-roster-browser-logs-${{ env.PRODUCT_SHA }}
          path: e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
