name: 岗位实习完整一览表验收

on:
  workflow_dispatch:

jobs:
  ap07:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ap07_ci_only
          MYSQL_DATABASE: internship_ap07_test_ci
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pap07_ci_only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      PYTHONPATH: products/internship-platform/backend
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://root:ap07_ci_only@127.0.0.1:3306/internship_ap07_test_ci?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_KEY_PREFIX: internship-ap07-ci
      GAP09_MYSQL_ACCEPTANCE: "1"
      EXPECTED_ALEMBIC_REVISION: ix0036
      FILE_STORAGE_DIR: /tmp/internship-ap07-ci-files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: products/internship-platform/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装后端依赖并生成临时测试密钥
        run: |
          python -m pip install -r products/internship-platform/backend/requirements.txt
          python - <<'PY'
          import os, secrets
          from cryptography.fernet import Fernet
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('FIELD_ENCRYPTION_KEY='+Fernet.generate_key().decode()+'\n')
              output.write('SENSITIVE_SEARCH_HMAC_KEY='+secrets.token_hex(32)+'\n')
              output.write('JWT_SECRET='+secrets.token_hex(48)+'\n')
          PY
      - name: 核验版本并安装空测试库
        run: |
          python products/internship-platform/scripts/check_schema_revision_contract.py
          alembic -c products/internship-platform/backend/alembic.ini upgrade head
      - name: 核验一览表服务语法
        run: python -m py_compile products/internship-platform/backend/app/modules/internship/services/internship_student_service.py
      - name: 执行真实数据库一览表与表格验收
        run: |
          mkdir -p /tmp/internship-ap07-ci-evidence
          pytest -q products/internship-platform/backend/tests/test_yiyang_ap07_full_roster.py -W error::sqlalchemy.exc.SAWarning --junitxml=/tmp/internship-ap07-ci-evidence/roster.xml
          python - <<'PY'
          from xml.etree import ElementTree
          suites=ElementTree.parse('/tmp/internship-ap07-ci-evidence/roster.xml').getroot().iter('testsuite')
          totals={key:0 for key in ('tests','errors','failures','skipped')}
          for suite in suites:
              for key in totals: totals[key]+=int(suite.get(key,0))
          assert totals['tests']>=7 and all(totals[key]==0 for key in ('errors','failures','skipped')), totals
          PY
      - name: 执行现有电脑端页面行为检查
        run: node --test products/internship-platform/admin-web/tests/full-roster.behavior.test.mjs products/internship-platform/admin-web/tests/basic-info.behavior.test.mjs
      - name: 保留真实数据库验收结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-ap07-ci-results
          path: /tmp/internship-ap07-ci-evidence
          if-no-files-found: error
