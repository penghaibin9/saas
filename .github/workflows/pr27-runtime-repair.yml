name: PR27 verified runtime repair

on:
  push:
    branches:
      - codex/teacher-pc-v2-html-library
    paths:
      - .github/workflows/pr27-runtime-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/teacher-pc-v2-html-library
          fetch-depth: 0

      - name: Apply three verified template-boundary repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('docs/ui/teacher-pc-v2-html/shared')
          student = root / 'v2-student-affairs-workbench.js'
          internship = root / 'v2-internship-key.js'

          text = student.read_text(encoding='utf-8')
          leave_old = '</div></section>${kpis(['
          leave_new = '</div></section>`+kpis(['
          assert text.count(leave_old) == 1, text.count(leave_old)
          text = text.replace(leave_old, leave_new, 1)

          mental_marker = text.index('function mental()')
          mental_old = '</div>${kpis(['
          mental_new = '</div>`+kpis(['
          mental_index = text.find(mental_old, mental_marker)
          assert mental_index >= 0
          text = text[:mental_index] + mental_new + text[mental_index + len(mental_old):]
          student.write_text(text, encoding='utf-8')

          text = internship.read_text(encoding='utf-8')
          match_marker = text.index('function match()')
          match_old = '</section>${board(['
          match_new = '</section>`+board(['
          match_index = text.find(match_old, match_marker)
          assert match_index >= 0
          text = text[:match_index] + match_new + text[match_index + len(match_old):]
          internship.write_text(text, encoding='utf-8')
          PY

      - name: Verify native syntax
        run: |
          node --check docs/ui/teacher-pc-v2-html/shared/v2-student-affairs-workbench.js
          node --check docs/ui/teacher-pc-v2-html/shared/v2-internship-key.js

      - name: Commit verified repair and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ui/teacher-pc-v2-html/shared/v2-student-affairs-workbench.js
          git add docs/ui/teacher-pc-v2-html/shared/v2-internship-key.js
          git rm .github/workflows/pr27-runtime-repair.yml
          git commit -m "fix(prototype): restore native student affairs and internship scripts"
          git push origin HEAD:codex/teacher-pc-v2-html-library
