name: PR58 sync latest main

on:
  push:
    branches:
      - fix/backend-pytest-debt-20260810
    paths:
      - '.github/workflows/pr58-main-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main with audited conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='fix/backend-pytest-debt-20260810'
          git config user.name 'PR58 integration audit'
          git config user.email 'pr58-integration@invalid.local'
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "Integrating main=$MAIN_SHA"

          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts (%s):\n' "${#CONFLICTS[@]}"
            printf '%s\n' "${CONFLICTS[@]}"
            if [ "${#CONFLICTS[@]}" -ne 1 ] || [ "${CONFLICTS[0]}" != 'backend/tests/test_portal_guardian.py' ]; then
              echo 'Unexpected conflict set; refusing automatic resolution.'
              git merge --abort || true
              exit 1
            fi
            # Audited resolution: PR58 side is a strict semantic superset of main's
            # guardian security tests (OTP/login fail-closed, no existence oracle,
            # authorized read-only scope, GUARDIAN blocked from staff APIs).
            git checkout --ours -- backend/tests/test_portal_guardian.py
            git add backend/tests/test_portal_guardian.py
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain.'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          # One-shot audit helpers must not remain in the production PR tree.
          git rm -f .github/workflows/pr58-main-merge-probe.yml .github/workflows/pr58-main-sync.yml
          git add -A
          git commit -m "merge(main): sync latest main for PR58 final audit"
          git push origin "HEAD:$BRANCH"
