name: Student Affairs Sync Latest Main

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/student-affairs-sync-main.yml

permissions:
  contents: write

concurrency:
  group: student-affairs-sync-latest-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/student-affairs-p0-p1-closeout-20260803
      - name: Merge latest main into PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            echo "MERGE_CONFLICTS_BEGIN"
            git diff --name-only --diff-filter=U
            echo "MERGE_CONFLICTS_END"
            exit 1
          fi
          git push origin HEAD:audit/student-affairs-p0-p1-closeout-20260803
