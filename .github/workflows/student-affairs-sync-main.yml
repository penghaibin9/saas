name: Student Affairs Sync Main

on:
  push:
    branches:
      - codex/student-affairs-leave-cutover-20260727
  workflow_dispatch:

concurrency:
  group: student-affairs-sync-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/student-affairs-leave-cutover-20260727
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply repairs and sync main
        shell: bash
        run: |
          set +e
          echo "student-affairs-sync-revision=12"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f student-affairs-sync-error.txt student-affairs-main-conflicts.txt
          {
            set -euo pipefail
            python scripts/maintenance/fix_request_resolver_anchor.py
            python scripts/maintenance/repair_affairs_remaining_round5.py
            python scripts/maintenance/repair_affairs_sensitive_scope_round6.py
            python scripts/maintenance/repair_affairs_bigdata_round7.py
            python scripts/maintenance/fix_round8_whitespace_matching.py
            python scripts/maintenance/repair_affairs_runtime_tests_round8.py
            python scripts/maintenance/repair_affairs_funding_round9.py
            python scripts/maintenance/repair_affairs_cockpit_round10.py
            python scripts/maintenance/repair_affairs_residual_round11.py
            python -m compileall -q backend/app backend/tests backend/affairs_contract_test_support.py scripts/maintenance
            git add backend/app backend/tests backend/affairs_contract_test_support.py scripts/maintenance
            if ! git diff --cached --quiet; then
              git commit -m "fix(student-affairs): apply explicit contracts through round11"
            fi
            git fetch origin main
            set +e
            git merge --no-ff --no-commit origin/main
            merge_status=$?
            set -e
            if [ "$merge_status" -ne 0 ]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
              expected=("miniapp/src/services/request.js" "student-portal/src/services/request.js")
              if [ "${conflicts[*]}" != "${expected[*]}" ]; then
                printf 'Unexpected conflicts:\n%s\n' "${conflicts[*]}"
                exit 31
              fi
              git checkout --ours -- "${expected[@]}"
              python scripts/maintenance/resolve_student_affairs_request_conflicts.py
              git add "${expected[@]}" scripts/maintenance/resolve_student_affairs_request_conflicts.py
            fi
            node --check student-portal/src/services/request.js
            node --check miniapp/src/services/request.js
            git add -u
            git commit -m "chore(student-affairs): sync latest main and preserve request contracts"
          } 2>&1 | tee /tmp/student-affairs-sync.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            git merge --abort >/dev/null 2>&1 || true
            git reset --hard HEAD >/dev/null 2>&1 || true
            {
              echo "status=$status"
              echo "base=$(git rev-parse origin/main 2>/dev/null || true)"
              echo "head=$(git rev-parse HEAD)"
              echo "log_tail:"
              tail -n 360 /tmp/student-affairs-sync.log
            } > student-affairs-sync-error.txt
            git add student-affairs-sync-error.txt
            git commit -m "chore(student-affairs): record main sync failure"
          fi
          git push origin HEAD:codex/student-affairs-leave-cutover-20260727
