name: Student Affairs Sync Main

on:
  push:
    branches:
      - codex/student-affairs-leave-cutover-20260727
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/student-affairs-leave-cutover-20260727
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply pending contract repairs
        run: |
          set -euo pipefail
          python scripts/maintenance/repair_affairs_remaining_round5.py
          python -m compileall -q backend/app backend/tests backend/affairs_contract_test_support.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app backend/tests backend/affairs_contract_test_support.py scripts/maintenance
          if ! git diff --cached --quiet; then
            git commit -m "fix(student-affairs): apply remaining round5 contracts"
          fi
      - name: Merge latest main with deterministic conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rm -f --ignore-unmatch student-affairs-main-conflicts.txt
          set +e
          git merge --no-ff --no-commit origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=("miniapp/src/services/request.js" "student-portal/src/services/request.js")
            if [ "${conflicts[*]}" != "${expected[*]}" ]; then
              printf 'Unexpected conflicts:\n%s\n' "${conflicts[*]}"
              exit 1
            fi
            git checkout --ours -- "${expected[@]}"
            python scripts/maintenance/resolve_student_affairs_request_conflicts.py
            git add "${expected[@]}" scripts/maintenance/resolve_student_affairs_request_conflicts.py
          fi
          node --check student-portal/src/services/request.js
          node --check miniapp/src/services/request.js
          git add -u
          git commit -m "chore(student-affairs): sync latest main and preserve request contracts"
      - name: Push branch result
        run: git push origin HEAD:codex/student-affairs-leave-cutover-20260727
