name: PR58 main merge probe

on:
  push:
    branches:
      - fix/backend-pytest-debt-20260810
    paths:
      - '.github/workflows/pr58-main-merge-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe merge with latest main
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin main
          set +e
          git -c user.name='PR58 merge probe' -c user.email='pr58-probe@invalid.local' merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo '### Merge conflicts'
            git diff --name-only --diff-filter=U | tee /tmp/conflicts.txt
            echo '--- conflict stages ---'
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              echo "FILE: $path"
              git ls-files -u -- "$path"
            done < /tmp/conflicts.txt
            git merge --abort || true
            exit 1
          fi
          echo 'Merge probe = CLEAN'
          git status --short
          git merge --abort || git reset --hard HEAD
