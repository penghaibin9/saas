name: PR27 prototype freeze acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/ui/teacher-pc-v2-html/**'
      - 'frontend/src/config/navPlan.js'
      - 'frontend/src/config/navPlan.permission-contract.test.js'
      - 'frontend/tests/studentAffairs.permissionCatalog.test.mjs'
      - '.github/workflows/pr27-prototype-freeze-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser-freeze-acceptance:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chrome
            label: Linux Chrome 打印/宽表/键盘/敏感业务
          - os: windows-2022
            browser: edge
            label: Windows Edge 打印/宽表/键盘/敏感业务
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare diagnostic evidence
        shell: bash
        run: |
          mkdir -p acceptance-artifacts/${{ matrix.browser }}/source
          cp docs/ui/teacher-pc-v2-html/shared/v2-student-affairs-workbench.js \
            acceptance-artifacts/${{ matrix.browser }}/source/
          cp docs/ui/teacher-pc-v2-html/shared/v2-internship-key.js \
            acceptance-artifacts/${{ matrix.browser }}/source/

      - name: Apply verified acceptance-runner repair in validation workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/ui/teacher-pc-v2-html/tools/run-freeze-acceptance.mjs')
          text = path.read_text(encoding='utf-8')

          old_key = "          await page.keyboard.press(index % 3 === 0 ? 'Shift+Tab' : 'Tab')"
          new_key = """          if (index % 3 === 0) {
            await page.keyboard.down('Shift')
            await page.keyboard.press('Tab')
            await page.keyboard.up('Shift')
          } else {
            await page.keyboard.press('Tab')
          }"""
          if old_key in text:
            text = text.replace(old_key, new_key, 1)

          old_server = "    const raw = decodeURIComponent(String(request.url || '/').split('?')[0]).replace(/^\\/+/, '')\n    const target = path.resolve(ROOT, raw || 'index.html')"
          new_server = """    const raw = decodeURIComponent(String(request.url || '/').split('?')[0]).replace(/^\\/+/, '')
    if (raw === 'favicon.ico') {
      response.writeHead(204)
      response.end()
      return
    }
    const target = path.resolve(ROOT, raw || 'index.html')"""
          if old_server in text:
            text = text.replace(old_server, new_server, 1)

          assert "keyboard.press(index % 3 === 0 ? 'Shift+Tab'" not in text
          assert "await page.keyboard.down('Shift')" in text
          assert "raw === 'favicon.ico'" in text
          path.write_text(text, encoding='utf-8')
          PY
          node --check docs/ui/teacher-pc-v2-html/tools/run-freeze-acceptance.mjs

      - name: Check native shared-script syntax
        shell: bash
        run: |
          node --check docs/ui/teacher-pc-v2-html/shared/v2-student-affairs-workbench.js
          node --check docs/ui/teacher-pc-v2-html/shared/v2-internship-key.js

      - name: Install isolated browser driver
        shell: bash
        run: npm install --prefix .pr27-tools --no-package-lock --ignore-scripts puppeteer-core@24.16.0

      - name: Run cross-browser freeze acceptance
        shell: bash
        env:
          ACCEPTANCE_BROWSER: ${{ matrix.browser }}
          PUPPETEER_CORE_PATH: ${{ github.workspace }}/.pr27-tools/node_modules/puppeteer-core
        run: |
          node docs/ui/teacher-pc-v2-html/tools/run-freeze-acceptance.mjs \
            --report=acceptance-artifacts/${{ matrix.browser }}/report.json

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr27-freeze-acceptance-${{ matrix.browser }}
          path: acceptance-artifacts/${{ matrix.browser }}/
          if-no-files-found: error
          retention-days: 14
