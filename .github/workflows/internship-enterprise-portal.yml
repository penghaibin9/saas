name: Internship Enterprise Portal

on:
  push:
    branches:
      - agent/internship-e-a02-enterprise-portal
    paths:
      - "enterprise-portal/**"
      - ".github/workflows/internship-enterprise-portal.yml"
  pull_request:
    paths:
      - "enterprise-portal/**"
      - ".github/workflows/internship-enterprise-portal.yml"

permissions:
  contents: read

concurrency:
  group: enterprise-portal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    name: A02 targeted test + lint + build + browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: enterprise-portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install enterprise portal dependencies
        run: npm install --no-audit --no-fund
      - name: Capture generated dependency lock
        uses: actions/upload-artifact@v7
        with:
          name: a02-generated-package-lock
          path: enterprise-portal/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: A02 authority and UX contract tests
        run: npm test
      - name: Enterprise portal lint
        run: npm run lint
      - name: Enterprise portal production build
        run: npm run build
      - name: Scan fixed demo credentials
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: A02 targeted browser evidence
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a02-enterprise-portal-browser-evidence
          path: |
            enterprise-portal/test-results
            enterprise-portal/playwright-report
          if-no-files-found: ignore
          retention-days: 7
