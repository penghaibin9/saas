name: Internship Enterprise Portal

on:
  push:
    branches:
      - agent/internship-e-a02-enterprise-portal
    paths:
      - "enterprise-portal/**"
      - ".github/workflows/internship-enterprise-portal.yml"
  pull_request:
    paths:
      - "enterprise-portal/**"
      - ".github/workflows/internship-enterprise-portal.yml"

permissions:
  contents: write

concurrency:
  group: enterprise-portal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    name: A02 targeted test + lint + build + browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: enterprise-portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Detect dependency lock
        id: dependency-lock
        run: |
          if [ -f package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap enterprise portal dependencies
        if: steps.dependency-lock.outputs.present != 'true'
        run: npm install --no-audit --no-fund
      - name: Install locked enterprise portal dependencies
        if: steps.dependency-lock.outputs.present == 'true'
        run: npm ci --no-audit --no-fund
      - name: Commit generated dependency lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/internship-e-a02-enterprise-portal' && steps.dependency-lock.outputs.present != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build(internship-ui): lock enterprise portal dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: A02 authority and UX contract tests
        run: npm test
      - name: Enterprise portal lint
        run: npm run lint
      - name: Enterprise portal production build
        run: npm run build
      - name: Scan fixed demo credentials
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: A02 targeted browser evidence
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a02-enterprise-portal-browser-evidence
          path: |
            enterprise-portal/test-results
            enterprise-portal/playwright-report
          if-no-files-found: ignore
          retention-days: 7
