name: Internship Enterprise Portal

on:
  pull_request:
    paths:
      - "enterprise-portal/**"
      - ".github/workflows/internship-enterprise-portal.yml"

permissions:
  contents: read

concurrency:
  group: enterprise-portal-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targeted:
    name: A02 targeted test + lint + build + browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: enterprise-portal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: enterprise-portal/package-lock.json
      - name: Install locked enterprise portal dependencies
        run: npm ci --no-audit --no-fund
      - name: A02 authority and UX contract tests
        run: npm test
      - name: Enterprise portal lint
        run: npm run lint
      - name: Enterprise portal production build
        run: npm run build
      - name: Scan fixed demo credentials
        run: node ../scripts/check/scan-fixed-demo-credentials.mjs dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: A02 targeted browser evidence
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a02-enterprise-portal-browser-evidence
          path: |
            enterprise-portal/test-results
            enterprise-portal/playwright-report
          if-no-files-found: ignore
          retention-days: 7
