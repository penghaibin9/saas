name: Agent PR107 production review fixes

on:
  push:
    branches:
      - fix/system-audit-rbac-atomicity-20260813
    paths:
      - .github/workflows/agent-pr107-production-review-fixes.yml

permissions:
  contents: write

jobs:
  review-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_review
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_review
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_review
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Apply production review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Real low-frequency bug found in review: list expiry still called the retired helper name.
          replace_one(
              'backend/app/services/role_assignment_service.py',
              '            _record_expiry_audit(db, tid, touched, source="READ_LIST_ASSIGNMENTS")\n',
              '            _audit_expiry_in_session(db, tid, touched, source="READ_LIST_ASSIGNMENTS")\n',
          )

          # 2) Keep the internal revoke lookup tenant-scoped as well.
          replace_one(
              'backend/app/services/role_assignment_service.py',
              '    from app.models import UserRole\n\n    if row.status != VALIDITY_ACTIVE:\n',
              '    from app.core.tenant_scoped import tenant_get\n    from app.models import UserRole\n\n    if row.status != VALIDITY_ACTIVE:\n',
          )
          replace_one(
              'backend/app/services/role_assignment_service.py',
              '    link = db.get(UserRole, int(row.user_role_id))\n',
              '    link = tenant_get(db, UserRole, int(row.user_role_id), tenant_id=int(row.tenant_id))\n',
          )

          # 3) Remove harmless-but-dead critical-action typo caught by review.
          replace_one(
              'backend/app/services/audit_log.py',
              '    "ROLE_ASSIGNMENT_GRANH", "ROLE_ASSIGNMENT_REVOKE", "ROLE_ASSIGNMENT_TRANSFER",\n',
              '    "ROLE_ASSIGNMENT_REVOKE", "ROLE_ASSIGNMENT_TRANSFER",\n',
          )

          # 4) Serialize same-campaign external-channel enqueue so concurrent clicks stay idempotent.
          replace_one(
              'backend/app/services/message_ops_service.py',
              '            MessageCampaign.is_deleted.is_(False),\n        ))\n        if not camp:\n',
              '            MessageCampaign.is_deleted.is_(False),\n        ).with_for_update())\n        if not camp:\n',
          )

          # 5) Worker row reads must remain tenant-scoped even across claim/process sessions.
          replace_one(
              'backend/app/services/message_channel_delivery_service.py',
              "        row=db.get(MessageChannelDelivery,row_id); now=_now()\n",
              "        row=db.scalar(select(MessageChannelDelivery).where(\n            MessageChannelDelivery.id==row_id, MessageChannelDelivery.tenant_id==_tid(),\n            MessageChannelDelivery.is_deleted.is_(False),\n        )); now=_now()\n",
          )
          replace_one(
              'backend/app/services/message_channel_delivery_service.py',
              "                row=db.get(MessageChannelDelivery,row_id)\n                if not row or row.locked_by!=worker_id: continue\n",
              "                row=db.scalar(select(MessageChannelDelivery).where(\n                    MessageChannelDelivery.id==row_id, MessageChannelDelivery.tenant_id==_tid(),\n                    MessageChannelDelivery.is_deleted.is_(False),\n                ))\n                if not row or row.locked_by!=worker_id: continue\n",
          )

          # 6) PROCESSING lease recovery gets its own hot-path index.
          replace_one(
              'backend/app/models/message.py',
              '        Index("ix_msg_channel_delivery_claim", "tenant_id", "status", "next_retry_at", "id"),\n        Index("ix_msg_channel_delivery_campaign", "tenant_id", "campaign_id", "channel", "status"),\n',
              '        Index("ix_msg_channel_delivery_claim", "tenant_id", "status", "next_retry_at", "id"),\n        Index("ix_msg_channel_delivery_lease", "tenant_id", "status", "lease_expires_at", "id"),\n        Index("ix_msg_channel_delivery_campaign", "tenant_id", "campaign_id", "channel", "status"),\n',
          )
          replace_one(
              'backend/alembic/versions/msg_channel_delivery_20260813.py',
              '    op.create_index("ix_msg_channel_delivery_claim","t_message_channel_delivery",["tenant_id","status","next_retry_at","id"])\n    op.create_index("ix_msg_channel_delivery_campaign","t_message_channel_delivery",["tenant_id","campaign_id","channel","status"])\n',
              '    op.create_index("ix_msg_channel_delivery_claim","t_message_channel_delivery",["tenant_id","status","next_retry_at","id"])\n    op.create_index("ix_msg_channel_delivery_lease","t_message_channel_delivery",["tenant_id","status","lease_expires_at","id"])\n    op.create_index("ix_msg_channel_delivery_campaign","t_message_channel_delivery",["tenant_id","campaign_id","channel","status"])\n',
          )

          # 7) Permanent regression for the exact low-frequency expiry path that review caught.
          role_test = Path('backend/tests/test_role_assignment_validity.py')
          role_text = role_test.read_text(encoding='utf-8')
          marker = 'def test_list_assignments_expiry_writes_atomic_audit(db_mode):'
          if marker in role_text:
              raise SystemExit('role expiry review regression already exists')
          role_text += '''\n\n\ndef test_list_assignments_expiry_writes_atomic_audit(db_mode):\n    from app.models import SecurityAuditLog\n    from app.models.role_assignment import RoleAssignmentValidity\n    from sqlalchemy import select\n\n    _make_role("COUNSELOR")\n    user_id = _make_user("ras_list_expire_review")\n    granted = _grant(\n        user_id, "COUNSELOR", reason="列表读取到期回收复审",\n        expires_at=(datetime.now() + timedelta(days=1)).strftime("%Y-%m-%d %H:%M:%S"),\n        tenant_id=MAIN_TENANT_ID,\n    )\n    assignment_id = int(granted["assignmentId"])\n    with _session() as db:\n        row = db.get(RoleAssignmentValidity, assignment_id)\n        row.expires_at = datetime.now().replace(microsecond=0) - timedelta(minutes=1)\n        db.commit()\n\n    listed = ras.list_assignments(tenant_id=MAIN_TENANT_ID)\n    expired = [item for item in listed["list"] if item.get("assignmentId") == str(assignment_id)]\n    assert expired and expired[0]["status"] == "EXPIRED"\n    assert _user_role_status(user_id, "COUNSELOR") == "EXPIRED"\n    with _session() as db:\n        audit = db.scalars(select(SecurityAuditLog).where(\n            SecurityAuditLog.tenant_id == MAIN_TENANT_ID,\n            SecurityAuditLog.action == "ROLE_ASSIGNMENT_EXPIRE",\n        ).order_by(SecurityAuditLog.id.desc())).first()\n        assert audit is not None\n        assert (audit.detail_json or {}).get("source") == "READ_LIST_ASSIGNMENTS"\n'''
          role_test.write_text(role_text, encoding='utf-8')

          # 8) Permanent concurrent enqueue regression: one request creates, the other observes existing.
          msg_test = Path('backend/tests/test_message_channel_delivery.py')
          msg_text = msg_test.read_text(encoding='utf-8')
          marker = 'def test_concurrent_campaign_channel_enqueue_is_idempotent(db_mode):'
          if marker in msg_text:
              raise SystemExit('concurrent enqueue review regression already exists')
          msg_text += '''\n\n\ndef test_concurrent_campaign_channel_enqueue_is_idempotent(db_mode):\n    from concurrent.futures import ThreadPoolExecutor\n    from app.core.context import set_tenant\n    from app.db.session import get_sessionmaker\n    from app.models import MessageCampaign, MessageChannelDelivery, Tenant, UnifiedMessage\n    from app.services import message_ops_service\n\n    tid = 1000000000000011015\n    set_tenant({'tenantId': str(tid)})\n    db = get_sessionmaker()()\n    try:\n        if not db.get(Tenant, tid):\n            db.add(Tenant(id=tid, tenant_code='channel-race', school_name='channel-race', short_name='race', deploy_mode='SAAS', db_mode='SHARED', status='ACTIVE'))\n        camp = MessageCampaign(tenant_id=tid, title='race', content_plain='x', category='ANNOUNCEMENT', priority='NORMAL', status='PUBLISHED', source_kind='HUMAN', content_mode='SHARED', sender_user_id=7, publish_mode='IMMEDIATE', created_by=7)\n        db.add(camp); db.flush(); campaign_id = int(camp.id)\n        db.add_all([UnifiedMessage(tenant_id=tid, receiver_id=i, receiver_user_id=i, receiver_context_key='GLOBAL', campaign_id=campaign_id, title='x', status='UNREAD', created_by=7) for i in range(1, 101)])\n        db.commit()\n    finally:\n        db.close(); set_tenant(None)\n\n    actor = _actor(tid, 8, 'SCHOOL_ADMIN')\n    def run_once():\n        set_tenant({'tenantId': str(tid)})\n        try:\n            return message_ops_service.enqueue_channel_delivery(actor, str(campaign_id), channel='SMS')\n        finally:\n            set_tenant(None)\n\n    with ThreadPoolExecutor(max_workers=2) as pool:\n        results = list(pool.map(lambda _: run_once(), range(2)))\n    assert sorted(item['newQueuedCount'] for item in results) == [0, 100]\n    assert sorted(item['existingCount'] for item in results) == [0, 100]\n    set_tenant({'tenantId': str(tid)})\n    db = get_sessionmaker()()\n    try:\n        assert db.query(MessageChannelDelivery).filter_by(tenant_id=tid, campaign_id=campaign_id, channel='SMS').count() == 100\n    finally:\n        db.close(); set_tenant(None)\n\n\ndef test_channel_delivery_has_retry_and_lease_claim_indexes():\n    from app.models import MessageChannelDelivery\n    names = {idx.name for idx in MessageChannelDelivery.__table__.indexes}\n    assert 'ix_msg_channel_delivery_claim' in names\n    assert 'ix_msg_channel_delivery_lease' in names\n'''
          msg_test.write_text(msg_text, encoding='utf-8')
          PY

          python -m py_compile \
            backend/app/services/role_assignment_service.py \
            backend/app/services/audit_log.py \
            backend/app/services/message_ops_service.py \
            backend/app/services/message_channel_delivery_service.py \
            backend/app/models/message.py \
            backend/alembic/versions/msg_channel_delivery_20260813.py \
            backend/tests/test_role_assignment_validity.py \
            backend/tests/test_message_channel_delivery.py

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Fresh MySQL single-head migration
        working-directory: backend
        run: |
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head

      - name: Tenant isolation ratchet
        working-directory: backend
        run: python scripts/audit_tenant_queries.py --gate

      - name: Run production review regression set
        working-directory: backend
        run: |
          pytest -q -p no:warnings \
            tests/test_role_assignment_validity.py \
            tests/test_role_assignment_privilege_boundary.py \
            tests/test_critical_audit_atomicity.py \
            tests/test_message_channel_delivery.py \
            tests/test_message_lease_reclaim.py \
            tests/test_scheduler_tenant_effective_state.py \
            tests/test_browser_session_tab_isolation.py \
            --timeout=300 --timeout-method=signal

      - name: Real 20K recipient durable enqueue
        working-directory: backend
        run: |
          python - <<'PY'
          from app.core.context import set_tenant
          from app.db.session import get_sessionmaker
          from app.models import MessageCampaign, MessageChannelDelivery, Tenant, UnifiedMessage
          from app.services.message_channel_delivery_service import enqueue_campaign_channel_deliveries_in_db

          tid = 1000000000000011999
          set_tenant({'tenantId': str(tid)})
          db = get_sessionmaker()()
          try:
              db.add(Tenant(id=tid, tenant_code='channel-20k-review', school_name='20K消息生产复审', short_name='20k', deploy_mode='SAAS', db_mode='SHARED', status='ACTIVE'))
              camp = MessageCampaign(tenant_id=tid, title='20k review', content_plain='x', category='ANNOUNCEMENT', priority='NORMAL', status='PUBLISHED', source_kind='HUMAN', content_mode='SHARED', sender_user_id=1, publish_mode='IMMEDIATE', created_by=1)
              db.add(camp); db.flush()
              for start in range(1, 20001, 2000):
                  db.add_all([
                      UnifiedMessage(tenant_id=tid, receiver_id=i, receiver_user_id=i, receiver_context_key='GLOBAL', campaign_id=camp.id, title='x', status='UNREAD', created_by=1)
                      for i in range(start, min(start + 2000, 20001))
                  ])
                  db.flush()
              first = enqueue_campaign_channel_deliveries_in_db(db, camp, channel='SMS', created_by=1)
              db.commit()
              assert first['recipientCount'] == 20000, first
              assert first['newQueuedCount'] == 20000, first
              second = enqueue_campaign_channel_deliveries_in_db(db, camp, channel='SMS', created_by=1)
              db.commit()
              assert second['newQueuedCount'] == 0, second
              assert second['existingCount'] == 20000, second
              count = db.query(MessageChannelDelivery).filter_by(tenant_id=tid, campaign_id=camp.id, channel='SMS').count()
              assert count == 20000, count
              print({'recipientCount': 20000, 'storedCount': count, 'secondNew': second['newQueuedCount']})
          finally:
              db.close(); set_tenant(None)
          PY

      - name: Static security review guards
        run: |
          python - <<'PY'
          from pathlib import Path
          role = Path('backend/app/services/role_assignment_service.py').read_text(encoding='utf-8')
          audit = Path('backend/app/services/audit_log.py').read_text(encoding='utf-8')
          channel = Path('backend/app/services/message_channel_delivery_service.py').read_text(encoding='utf-8')
          ops = Path('backend/app/services/message_ops_service.py').read_text(encoding='utf-8')
          assert '_record_expiry_audit' not in role
          assert 'ROLE_ASSIGNMENT_GRANH' not in audit
          assert '.with_for_update()' in ops
          assert 'decrypt_field(user.phone_encrypted' in channel
          assert 'allow_legacy_plaintext=False' in channel
          assert "getattr(user, 'phone'" not in channel and 'getattr(user, "phone"' not in channel
          PY

      - name: Commit reviewed fixes and clean runner
        run: |
          rm .github/workflows/agent-pr107-production-review-fixes.yml
          git config user.name penghaibin9
          git config user.email penghaibin9@gmail.com
          git add \
            backend/app/services/role_assignment_service.py \
            backend/app/services/audit_log.py \
            backend/app/services/message_ops_service.py \
            backend/app/services/message_channel_delivery_service.py \
            backend/app/models/message.py \
            backend/alembic/versions/msg_channel_delivery_20260813.py \
            backend/tests/test_role_assignment_validity.py \
            backend/tests/test_message_channel_delivery.py \
            .github/workflows/agent-pr107-production-review-fixes.yml
          git diff --cached --check
          git commit -m "fix(review): close PR107 production edge cases"
          git push origin HEAD:fix/system-audit-rbac-atomicity-20260813
