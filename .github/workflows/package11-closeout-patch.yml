name: Package 11 closeout patch

on:
  push:
    branches:
      - agent/postmerge-production-blockers-20260805
    paths:
      - .github/workflows/package11-closeout-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/postmerge-production-blockers-20260805
          fetch-depth: 0

      - name: Apply fail-closed package 11 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          migration_path = Path("backend/alembic/versions/20260806_discipline_package11.py")
          source = migration_path.read_text(encoding="utf-8")

          marker = "\ndef _repair_service_students_and_projections() -> None:\n"
          if marker not in source:
              raise SystemExit("package11 migration repair marker not found")

          preflight = '''

def _preflight_service_students() -> None:
    """迁移前只做校验；发现跨业务共享台账重复时阻断，禁止自动软删。"""
    duplicate = op.get_bind().execute(sa.text("""
        SELECT tenant_id, student_id, COUNT(*) AS active_count
          FROM t_cs_service_student
         WHERE is_deleted = 0
           AND student_id IS NOT NULL
         GROUP BY tenant_id, student_id
        HAVING COUNT(*) > 1
         ORDER BY tenant_id, student_id
         LIMIT 1
    """)).mappings().first()
    if duplicate:
        raise RuntimeError(
            "package 11 preflight failed: duplicate active CsServiceStudent rows; "
            f"tenant_id={duplicate['tenant_id']}, "
            f"student_id={duplicate['student_id']}, "
            f"active_count={duplicate['active_count']}"
        )
'''
          source = source.replace(marker, preflight + marker, 1)

          repair_pattern = re.compile(
              r"def _repair_service_students_and_projections\(\) -> None:\n.*?"
              r"(?=    # 对所有已有处分主案补建真实 CsServiceStudent，禁止再借用 StudentProfile.id。)",
              re.S,
          )
          safe_repair_header = (
              "def _repair_service_students_and_projections() -> None:\n"
              "    # 只补建处分需要的服务学生台账，并只修复处分域投影；不改动其他业务域台账。\n"
          )
          source, count = repair_pattern.subn(safe_repair_header, source, count=1)
          if count != 1:
              raise SystemExit(f"unsafe service-student repair block replacement count={count}")

          upgrade_old = "    _require_mysql()\n    _create_tables()\n"
          upgrade_new = "    _require_mysql()\n    _preflight_service_students()\n    _create_tables()\n"
          if upgrade_old not in source:
              raise SystemExit("package11 upgrade marker not found")
          source = source.replace(upgrade_old, upgrade_new, 1)

          if "PACKAGE11_DUPLICATE_SERVICE_STUDENT" in source:
              raise SystemExit("global service-student soft-delete is still present")
          if source.count("_preflight_service_students()") != 2:
              raise SystemExit("service-student preflight definition/call count mismatch")
          migration_path.write_text(source, encoding="utf-8")

          guard_path = Path("backend/app/services/affairs_discipline_integrity_guard.py")
          guard = guard_path.read_text(encoding="utf-8")

          first_old = '''    existing = db.scalars(select(CsServiceStudent).where(
        CsServiceStudent.tenant_id == tenant_id,
        CsServiceStudent.student_id == student_id,
        CsServiceStudent.is_deleted.is_(False),
    ).order_by(CsServiceStudent.id).with_for_update()).first()
    if existing:
        return existing
'''
          first_new = '''    existing_rows = db.scalars(select(CsServiceStudent).where(
        CsServiceStudent.tenant_id == tenant_id,
        CsServiceStudent.student_id == student_id,
        CsServiceStudent.is_deleted.is_(False),
    ).order_by(CsServiceStudent.id).with_for_update()).all()
    if len(existing_rows) > 1:
        raise AppException("DATA_CONFLICT", "服务学生台账存在重复活动记录，请先完成数据治理")
    if existing_rows:
        return existing_rows[0]
'''
          if first_old not in guard:
              raise SystemExit("first service-student lookup block not found")
          guard = guard.replace(first_old, first_new, 1)

          second_old = '''        existing = db.scalars(select(CsServiceStudent).where(
            CsServiceStudent.tenant_id == tenant_id,
            CsServiceStudent.student_id == student_id,
            CsServiceStudent.is_deleted.is_(False),
        ).order_by(CsServiceStudent.id).with_for_update()).first()
        if existing:
            return existing
        raise AppException("DATA_CONFLICT", "服务学生台账并发创建失败，请重试")
'''
          second_new = '''        created_rows = db.scalars(select(CsServiceStudent).where(
            CsServiceStudent.tenant_id == tenant_id,
            CsServiceStudent.student_id == student_id,
            CsServiceStudent.is_deleted.is_(False),
        ).order_by(CsServiceStudent.id).with_for_update()).all()
        if len(created_rows) > 1:
            raise AppException("DATA_CONFLICT", "服务学生台账存在重复活动记录，请先完成数据治理")
        if created_rows:
            return created_rows[0]
        raise AppException("DATA_CONFLICT", "服务学生台账并发创建失败，请重试")
'''
          if second_old not in guard:
              raise SystemExit("post-insert service-student lookup block not found")
          guard = guard.replace(second_old, second_new, 1)
          guard_path.write_text(guard, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/alembic/versions/20260806_discipline_package11.py
          git add backend/app/services/affairs_discipline_integrity_guard.py
          git rm .github/workflows/package11-closeout-patch.yml
          git commit -m "fix(discipline): fail closed on duplicate service students"
          git push origin HEAD:agent/postmerge-production-blockers-20260805
