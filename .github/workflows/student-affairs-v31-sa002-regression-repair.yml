name: Student Affairs V3.1 SA-002 focused regression repair

on:
  push:
    branches:
      - audit/student-affairs-v31-final-runner-20260827
    paths:
      - '.github/workflows/student-affairs-v31-sa002-regression-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sa002-focused-regression:
    name: SA-002 permission / data-scope / privacy exact-node regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/13
      REDIS_KEY_PREFIX: student-affairs-v31-sa002-regression-repair
      JWT_SECRET: student-affairs-v31-sa002-regression-repair-only
      JWT_SECRET_KEY: student-affairs-v31-sa002-regression-repair-only
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      PRODUCT_EXACT_SHA: 2019ca946ce2bc2c21dc9e76a8de0ce674c2d03d

    steps:
      - name: Checkout immutable product exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_EXACT_SHA }}
          fetch-depth: 1

      - name: Assert immutable product exact head
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "tested_product_exact_sha=$ACTUAL"
          test "$ACTUAL" = "$PRODUCT_EXACT_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run only real SA-002 permission / scope / privacy nodes
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_affairs_aid.py::test_a5_sensitive_family_economy \
            tests/test_affairs_aid.py::test_a7_cross_class_403 \
            tests/test_affairs_aid.py::test_a8_counselor_review_scoped_to_counselor_review_node \
            | tee /tmp/sa002-focused-regression.log
          grep -Eq '3 passed' /tmp/sa002-focused-regression.log
          printf '%s\n' \
            "SA-002 focused regression repaired" \
            "productExactSha=$PRODUCT_EXACT_SHA" \
            "test_a5_sensitive_family_economy=PASS" \
            "test_a7_cross_class_403=PASS" \
            "test_a8_counselor_review_scoped_to_counselor_review_node=PASS" \
            > /tmp/sa002-focused-regression-summary.txt

      - name: Upload focused regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa002-focused-regression-${{ github.run_id }}
          path: |
            /tmp/sa002-focused-regression.log
            /tmp/sa002-focused-regression-summary.txt
          if-no-files-found: warn
