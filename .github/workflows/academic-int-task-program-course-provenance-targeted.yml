name: Academic INT Task ProgramCourse Provenance Targeted

on:
  push:
    branches:
      - tmp/academic-int-task-program-course-provenance-green-20260818
      - integration/academic-school-gold
    paths:
      - 'backend/alembic/versions/20260818_academic_int_task_program_course_provenance.py'
      - 'backend/app/models/academic_affairs.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_task_generation_service.py'
      - 'backend/app/modules/academic_affairs/services/academic_affairs_task_formation_provenance_service.py'
      - 'backend/tests/test_academic_int_task_program_course_provenance_contract.py'
      - 'backend/tests/test_academic_int_task_program_course_provenance_mysql.py'
      - '.github/workflows/academic-int-task-program-course-provenance-targeted.yml'

concurrency:
  group: academic-int-task-pc-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  task-program-course-provenance:
    name: Task ProgramCourse provenance sealed-head MySQL regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      APP_ENV: test
      SECRET_KEY: academic-int-task-pc-provenance-targeted
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove sealed provenance ancestry on exact head
        run: |
          set -euo pipefail
          SEALED="6bb48f1c055d8fd16fe9563ba4ea64c36ac15f9a"
          BASE="fc6029e0af973a679c3ecd9c9dae40dcc46c73ff"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "${SEALED}^{commit}"
          git merge-base --is-ancestor "$SEALED" HEAD
          test "$(git rev-list --count "${BASE}..${SEALED}")" = "1"
          if test "$GITHUB_SHA" = "$SEALED"; then
            test "$(git rev-parse HEAD^)" = "$BASE"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Prove direct-source contract and one live Alembic head
        working-directory: backend
        run: |
          set -euo pipefail
          FILE=alembic/versions/20260818_academic_int_task_program_course_provenance.py
          grep -F 'revision = "20260818_acad_int_task_pc_prov"' "$FILE"
          grep -F 'down_revision = "20260817_acad_int_program_series"' "$FILE"
          grep -F 'source_program_course_id' "$FILE"
          ! grep -Ei 'UPDATE[[:space:]]+t_aa_teaching_task|LEGACY-' "$FILE"
          grep -F 'source_program_course_id=program_course.id' app/modules/academic_affairs/services/academic_affairs_task_generation_service.py
          grep -F 'formation_mode=formation_mode' app/modules/academic_affairs/services/academic_affairs_task_generation_service.py
          ! grep -F 'resolve_program_for_scope' app/modules/academic_affairs/services/academic_affairs_task_formation_provenance_service.py
          HEADS="$(alembic heads)"
          echo "$HEADS"
          test "$(printf '%s\n' "$HEADS" | grep -c ' (head)')" = "1"

      - name: Fresh MySQL upgrade to current exact-head schema
        working-directory: backend
        run: |
          set -euo pipefail
          alembic upgrade head
          CURRENT="$(alembic current)"
          echo "$CURRENT"
          printf '%s\n' "$CURRENT" | grep -F ' (head)'

      - name: Run provenance and formation targeted regression on exact head
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_academic_int_task_program_course_provenance_contract.py \
            tests/test_academic_int_task_program_course_provenance_mysql.py \
            tests/test_aa_task_formation_inventory_w3.py \
            tests/test_aa_teaching_class_formation_projection_w3.py \
            tests/test_aa_teaching_class_public_formation_projection_w3.py
