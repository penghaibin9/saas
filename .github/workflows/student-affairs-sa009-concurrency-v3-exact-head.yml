name: Student Affairs SA-009 Concurrency V3 exact head

on:
  workflow_dispatch:
  push:
    branches:
      - audit/student-affairs-browser-runner-20260823
    paths:
      - 'audit-tests/student-affairs-sa009-concurrency-v3.py'
      - '.github/workflows/student-affairs-sa009-concurrency-v3-exact-head.yml'

permissions:
  contents: read

concurrency:
  group: student-affairs-sa009-concurrency-v3
  cancel-in-progress: true

jobs:
  sa009-concurrency:
    name: SA-009 / real same-bed concurrency + MySQL truth
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_sa009_concurrency
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_sa009_concurrency?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_sa009_concurrency?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_sa009_concurrency
      REDIS_URL: redis://127.0.0.1:6379/13
      REDIS_KEY_PREFIX: student-affairs-sa009-concurrency-v3
      JWT_SECRET: student-affairs-sa009-concurrency-v3-only
      JWT_SECRET_KEY: student-affairs-sa009-concurrency-v3-only
      PYTHONPATH: .
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_TARGET_SHA: d6e7b104409ce9208ed1d12c2a93121de5489276

    steps:
      - name: Checkout immutable audit runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: runner
          fetch-depth: 1

      - name: Checkout immutable application exact head
        uses: actions/checkout@v4
        with:
          ref: d6e7b104409ce9208ed1d12c2a93121de5489276
          path: app
          fetch-depth: 0

      - name: Assert exact heads and clean product source
        run: |
          set -euo pipefail
          echo "tested_app_head=$(git -C app rev-parse HEAD)"
          echo "audit_runner_head=$(git -C runner rev-parse HEAD)"
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"
          test -z "$(git -C app status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install backend and migrate dedicated SA-009 MySQL
        working-directory: app/backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          alembic upgrade head
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend
        run: |
          set -euo pipefail
          mkdir -p app/e2e/runtime-logs
          cd app/backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Run real concurrent same-bed checkin and verify MySQL truth
        working-directory: app/backend
        run: python ../../runner/audit-tests/student-affairs-sa009-concurrency-v3.py

      - name: Reassert immutable application commit
        if: always()
        run: |
          echo "tested_app_head=$(git -C app rev-parse HEAD)"
          echo "audit_runner_head=$(git -C runner rev-parse HEAD)"
          test "$(git -C app rev-parse HEAD)" = "$E2E_TARGET_SHA"
          test -z "$(git -C app status --porcelain)"

      - name: Upload SA-009 concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-affairs-sa009-concurrency-v3-${{ github.run_id }}
          path: |
            app/e2e/runtime-logs/backend.log
            app/e2e/runtime-logs/sa009-concurrency-evidence.json
          if-no-files-found: ignore
          retention-days: 7
