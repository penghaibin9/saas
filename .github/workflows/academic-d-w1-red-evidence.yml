name: Academic D W1 Archive RED evidence

on:
  push:
    branches:
      - agent/academic-d-graduation-delivery
    paths:
      - '.github/workflows/academic-d-w1-red-evidence.yml'

permissions:
  contents: read

jobs:
  archive-four-state-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact W1 RED head
        uses: actions/checkout@v4
        with:
          ref: a60aee73ab257a6591530c52fc970d29a832a3f8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run exact W1 RED contract
        working-directory: backend
        run: pytest tests/test_aa_archive_d_w1_contract.py -q -p no:warnings
