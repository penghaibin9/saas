name: Academic D W1 Archive RED evidence

on:
  push:
    branches:
      - agent/academic-d-graduation-delivery
    paths:
      - '.github/workflows/academic-d-w1-red-evidence.yml'

permissions:
  contents: read

jobs:
  archive-four-state-red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      PYTHONUNBUFFERED: '1'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    steps:
      - name: Checkout exact W1 RED head
        uses: actions/checkout@v4
        with:
          ref: a60aee73ab257a6591530c52fc970d29a832a3f8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run exact W1 RED contract
        working-directory: backend
        run: pytest tests/test_aa_archive_d_w1_contract.py -q -p no:warnings
