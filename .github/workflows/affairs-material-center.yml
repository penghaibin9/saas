name: Affairs material center

on:
  pull_request:
    paths:
      - 'backend/app/models/affairs_operations.py'
      - 'backend/app/models/affairs_attachment.py'
      - 'backend/app/models/affairs_archive.py'
      - 'backend/app/modules/student_affairs/**'
      - 'backend/app/services/affairs_attachment_service.py'
      - 'backend/app/services/affairs_archive_service.py'
      - 'backend/app/services/file_access_resolvers.py'
      - 'backend/app/api/v1/affairs_operations_api.py'
      - 'backend/app/api/v1/router.py'
      - 'backend/alembic/versions/0149_affairs_material_center.py'
      - 'backend/tests/test_affairs_material_center.py'
      - 'backend/tests/affairs_material_center_mysql_acceptance.py'
      - 'frontend/src/modules/studentAffairs/api/operations.api.js'
      - 'frontend/src/modules/studentAffairs/views/MaterialOperationsView.vue'
      - '.github/workflows/affairs-material-center.yml'
  push:
    branches:
      - feat/affairs-material-center
      - audit/file-capability-inventory
    paths:
      - 'backend/app/models/affairs_operations.py'
      - 'backend/app/models/affairs_attachment.py'
      - 'backend/app/models/affairs_archive.py'
      - 'backend/app/modules/student_affairs/**'
      - 'backend/app/services/affairs_attachment_service.py'
      - 'backend/app/services/affairs_archive_service.py'
      - 'backend/app/services/file_access_resolvers.py'
      - 'backend/app/api/v1/affairs_operations_api.py'
      - 'backend/app/api/v1/router.py'
      - 'backend/alembic/versions/0149_affairs_material_center.py'
      - 'backend/tests/test_affairs_material_center.py'
      - 'backend/tests/affairs_material_center_mysql_acceptance.py'
      - 'frontend/src/modules/studentAffairs/api/operations.api.js'
      - 'frontend/src/modules/studentAffairs/views/MaterialOperationsView.vue'
      - '.github/workflows/affairs-material-center.yml'

concurrency:
  group: affairs-material-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-contract:
    name: MySQL 补交版本 + 强敏感 + 真实档案 Manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      APP_ENV: test
      SECRET_KEY: stage5-affairs-material-center-secret
      FILE_SCAN_ENABLED: 'false'
      FILE_SCAN_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify single Alembic head and upgrade real MySQL
        working-directory: backend
        run: |
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
      - name: Compile phase 5 backend
        working-directory: backend
        run: |
          python -m py_compile \
            app/models/affairs_operations.py \
            app/models/affairs_attachment.py \
            app/models/affairs_archive.py \
            app/modules/student_affairs/services/affairs_material_center_service.py \
            app/modules/student_affairs/routers/affairs_material_center.py \
            app/services/affairs_attachment_service.py \
            app/services/affairs_archive_service.py \
            app/services/file_access_resolvers.py \
            app/api/v1/affairs_operations_api.py \
            app/api/v1/router.py \
            alembic/versions/0149_affairs_material_center.py \
            tests/test_affairs_material_center.py \
            tests/affairs_material_center_mysql_acceptance.py
      - name: Static frozen contracts
        working-directory: backend
        run: pytest tests/test_affairs_material_center.py -q -p no:warnings
      - name: Real MySQL resubmit, version, manifest and sensitivity acceptance
        working-directory: backend
        run: PYTHONPATH=. python tests/affairs_material_center_mysql_acceptance.py
      - name: Existing affairs material, archive and sensitive regressions
        working-directory: backend
        run: |
          candidates=(
            tests/test_affairs_operations.py
            tests/test_affairs_archive.py
            tests/test_affairs_attachment.py
            tests/test_affairs_mental.py
            tests/test_affairs_aid.py
          )
          existing=()
          for file in "${candidates[@]}"; do
            if [ -f "$file" ]; then existing+=("$file"); fi
          done
          printf 'Running: %s\n' "${existing[*]}"
          pytest "${existing[@]}" -q -p no:warnings --tb=short
      - name: Verify phase 5 schema and explicit routing
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          engine = create_engine(os.environ['DATABASE_URL'])
          inspector = inspect(engine)
          expected = {
              't_affairs_material_requirement': {'asset_id', 'sensitivity_level', 'material_scope'},
              't_affairs_material_submission': {'asset_id', 'file_version_id', 'binding_id', 'sensitivity_level'},
              't_affairs_attachment': {'asset_id', 'file_version_id', 'binding_id', 'sensitivity_level', 'source_channel'},
              't_affairs_archive_package': {'package_asset_id', 'package_version_id', 'manifest_id', 'manifest_revision', 'manifest_sha256'},
          }
          for table, required in expected.items():
              columns = {row['name'] for row in inspector.get_columns(table)}
              assert required <= columns, (table, required - columns)
          print('Stage 5 schema verified')
          PY
          python - <<'PY'
          from app.api.v1.router import api_router
          from fastapi.routing import APIRoute
          paths = {route.path for route in api_router.routes if isinstance(route, APIRoute)}
          required = {
              '/student-affairs/material-center',
              '/student-affairs/material-center/backfill',
              '/student-affairs/material-center/students/{student_id}/manifest',
              '/student-affairs/archive/packages/{package_id}/manifest',
              '/student-affairs/material-requirements',
              '/student-affairs/material-requirements/{requirement_id}/review',
              '/mobile/affairs/material-requirements',
              '/mobile/affairs/material-requirements/{requirement_id}/submissions',
          }
          assert required <= paths, required - paths
          print('Stage 5 explicit and legacy-compatible routes verified')
          PY

  management-pc:
    name: 管理 PC 材料与档案中心
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint and build
        working-directory: frontend
        run: |
          npm run lint
          npm run build
      - name: Verify public file and manifest contracts
        run: |
          grep -q "fileSdk" frontend/src/modules/studentAffairs/api/operations.api.js
          ! grep -q "requestBlob" frontend/src/modules/studentAffairs/api/operations.api.js
          grep -q "fileVersionId" frontend/src/modules/studentAffairs/views/MaterialOperationsView.vue
          grep -q "manifestSha256" frontend/src/modules/studentAffairs/views/MaterialOperationsView.vue
          grep -q "HIGHLY_SENSITIVE" frontend/src/modules/studentAffairs/views/MaterialOperationsView.vue
          grep -q "材料与档案中心" frontend/src/modules/studentAffairs/views/MaterialOperationsView.vue
