name: Audit Academic AA-008 Product Head 20260827

on:
  push:
    branches: [audit/academic-aa008-runner-20260827]
    paths:
      - '.github/workflows/audit-aa008-current-product.yml'

permissions:
  contents: read

concurrency:
  group: audit-academic-aa008-current-product
  cancel-in-progress: true

env:
  PRODUCT_SHA: 563906853c9d785f7c5a1b75d63a6a1a61d6e6e8

jobs:
  aa008:
    name: exact product / schedule real-click / browser seal
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: academic_b_w3_e2e
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      CI: 'true'
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_b_w3_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/academic_b_w3_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: academic_b_w3_e2e
      REDIS_URL: redis://127.0.0.1:6379/13
      REDIS_KEY_PREFIX: academic-aa008
      JWT_SECRET: academic-aa008-browser-only-not-production
      JWT_SECRET_KEY: academic-aa008-browser-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0
      - name: Assert exact product head
        run: test "$(git rev-parse HEAD)" = "${PRODUCT_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and migrate isolated browser database
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
      - name: Seed tenant foundation
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_seed_playwright_tenants.py
      - name: Start backend
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1
      - name: Bootstrap and verify academic-admin account
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py
      - name: Seed AA-008 schedule fixture
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/e2e_seed_academic_b_selection.py
          python scripts/e2e_seed_academic_b_w3_schedule.py
          test -s ../e2e/academic-b-w3-fixture.json
      - name: Install, production-build and start staff PC
        run: |
          set -euo pipefail
          cd frontend
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5173/login >/dev/null && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/frontend.log
          exit 1
      - name: Install Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run only AA-008 focused browser seal
        working-directory: e2e
        run: npx playwright test specs/academic-b-schedule-w3-final.spec.mjs --reporter=line
      - name: Upload AA-008 screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-aa008-evidence-${{ env.PRODUCT_SHA }}
          path: e2e/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload AA-008 service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-aa008-logs-${{ env.PRODUCT_SHA }}
          path: e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
