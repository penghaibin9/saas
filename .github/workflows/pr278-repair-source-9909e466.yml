# Temporary read-only verification utility for PR278. Remove before merge.
name: PR278 repair source snapshot

on:
  push:
    branches:
      - codex/academic-v5-responsibility-20260926
    paths:
      - .github/workflows/pr278-repair-source-9909e466.yml

permissions:
  contents: read

jobs:
  locked-python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated Python 3.12 with the repository's exact requirements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr278-python"
          docker pull python:3.12-slim-bookworm
          docker run --rm -v "$PWD/backend:/source:ro" -v "$RUNNER_TEMP/pr278-python:/output" python:3.12-slim-bookworm sh -ec '
            apt-get update -qq
            apt-get install -y --no-install-recommends gcc libc6-dev libexpat1 libffi8 libssl3 libsqlite3-0 libbz2-1.0 liblzma5 libzstd1 zlib1g
            python -m pip install --no-cache-dir -r /source/requirements.txt
            python -m pip check
            python --version > /output/VERSIONS.txt
            python -m pip freeze >> /output/VERSIONS.txt
            deps=$(ldd /usr/local/bin/python3.12 /usr/local/lib/libpython3.12.so.1.0 /usr/local/lib/python3.12/lib-dynload/*.so | awk "/=> \\// {print \$3}" | sort -u | grep -Ev "/(libc|libm|libpthread|libdl|librt|libresolv)\\.so")
            tar -chzf /output/python-runtime.tar.gz /usr/local $deps
            cd /output
            sha256sum python-runtime.tar.gz VERSIONS.txt > SHA256SUMS
          '
      - uses: actions/upload-artifact@v4
        with:
          name: pr278-locked-python-${{ github.sha }}
          path: ${{ runner.temp }}/pr278-python/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
