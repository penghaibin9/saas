# Temporary PR278 repair transport: creates content objects only, never updates a ref.
# Removed in the final atomic repair commit.
name: PR278 repair source snapshot

on:
  push:
    branches:
      - codex/academic-v5-responsibility-20260926
    paths:
      - .github/workflows/pr278-repair-source-9909e466.yml

permissions:
  contents: read

jobs:
  prepare-verified-blobs:
    if: github.repository == 'penghaibin9/saas' && github.ref == 'refs/heads/codex/academic-v5-responsibility-20260926'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify tested source and create ordinary file blobs without changing branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '7c61a38d9d099d8949dcae7024973547d7ae3f46'
          python3 - <<'PY'
          import base64, concurrent.futures, hashlib, json, lzma, os, pathlib, py_compile, subprocess, urllib.request
          repo = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']
          def api(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=data,
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)
          parts = ['1f17f3bdacbb82b2a01c8a0ee9f87016d35d0ff6', '160f0e740445cca301e14478a0bd307e6424d721',
                   '8ed11c14e12fd7b30eb64bdfacda103e1e15c479', '39f89b0108953c04edc93842daecd1bf5eb57f3c']
          compressed = b''
          for sha in parts:
              blob = api('/git/blobs/' + sha)
              assert blob['sha'] == sha
              value = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(value)).encode() + b'\0' + value).hexdigest() == sha
              compressed += value
          patch = lzma.decompress(compressed)
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '33eac753d0c2e1911693bc0a744d692000b99cccec7ace4c224d73d2ecb757e1', digest
          patch_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'validated.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(patch_path)], check=True)
          modified = subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')
          untracked = subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          names = sorted(set(modified + untracked) - {''})
          assert len(names) == 48, names
          path_digest = hashlib.sha256('\n'.join(names).encode()).hexdigest()
          assert path_digest == '3ea89ae3104f4fbc3e21b9f4729886cdecac07dd735681d936872f64df3c98c8', path_digest
          for name in names:
              if name.endswith('.py'):
                  py_compile.compile(name, doraise=True)
          subprocess.run(['git','diff','--check'], check=True)
          def create(name):
              value = pathlib.Path(name).read_bytes()
              value.decode('utf-8')
              sha = hashlib.sha1(b'blob ' + str(len(value)).encode() + b'\0' + value).hexdigest()
              result = api('/git/blobs', {'content': base64.b64encode(value).decode(), 'encoding': 'base64'})
              assert result['sha'] == sha, name
              return {'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha, 'sha256': hashlib.sha256(value).hexdigest()}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              files = list(pool.map(create, names))
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr278-verified'
          destination.mkdir()
          manifest = {'parent': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'patch_sha256': digest, 'path_set_sha256': path_digest, 'files': files}
          (destination / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'Verified {len(files)} file content objects. No branch, gate, or test result changed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr278-verified-blobs-${{ github.sha }}
          path: ${{ runner.temp }}/pr278-verified/
          retention-days: 1
          if-no-files-found: error
