name: File center stage 6-10 final closure

on:
  push:
    branches: [audit/file-capability-inventory]
    paths: ['.github/workflows/file-center-validation-report.yml']

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: file-center-stage6-10-final-closure
  cancel-in-progress: true

jobs:
  finalize-head:
    name: 合并 main、补齐输入并形成最终待验 HEAD
    runs-on: ubuntu-24.04
    outputs:
      final_sha: ${{ steps.final.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Merge main and apply exact closure patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main audit/file-capability-inventory
          git reset --hard origin/audit/file-capability-inventory
          git merge --no-ff --no-commit origin/main || true
          UNMERGED="$(git diff --name-only --diff-filter=U)"
          if [ -n "$UNMERGED" ]; then
            if [ "$UNMERGED" != "student-portal/src/layouts/PortalLayout.vue" ]; then
              echo "Unexpected merge conflicts:"
              echo "$UNMERGED"
              exit 1
            fi
            git checkout --theirs -- student-portal/src/layouts/PortalLayout.vue
          fi
          python - <<'PY'
          from pathlib import Path

          portal = Path('student-portal/src/layouts/PortalLayout.vue')
          source = portal.read_text(encoding='utf-8')
          if 'function toggleGraduationView()' not in source:
              button_anchor = '''          <button v-if="activeModulePath === 'internship'" class="sp-context-link" type="button" @click="toggleInternshipView">
            {{ route.name === 'internship-compliance' ? '返回实习工作台' : '上岗合规与安全教育' }}
          </button>
'''
              button = '''          <button v-if="activeModulePath === 'graduation'" class="sp-context-link" type="button" @click="toggleGraduationView">
            {{ route.name === 'graduation-material-library' ? '返回毕业设计工作台' : '我的材料库' }}
          </button>
'''
              function_anchor = '''function toggleInternshipView() {
  router.push(route.name === 'internship-compliance' ? '/internship' : '/internship/compliance')
}
'''
              function = '''function toggleGraduationView() {
  router.push(route.name === 'graduation-material-library' ? '/graduation' : '/graduation/materials')
}
'''
              if button_anchor not in source or function_anchor not in source:
                  raise SystemExit('PortalLayout V5 anchors missing')
              source = source.replace(button_anchor, button_anchor + button, 1)
              source = source.replace(function_anchor, function_anchor + function, 1)
          required = (
              'sp-theme__grid',
              'student-portal-theme-change',
              "activeModulePath === 'graduation'",
              'function toggleGraduationView()',
              "'/graduation/materials'",
          )
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit(f'PortalLayout contracts missing: {missing}')
          portal.write_text(source, encoding='utf-8')

          file_service_path = Path('backend/app/services/file_service.py')
          file_service = file_service_path.read_text(encoding='utf-8')
          import_anchor = 'from app.services.file_scan_constants import READY_SCAN_STATES, SCAN_NOT_REQUIRED, SCAN_PENDING\n'
          import_line = 'from app.services.file_storage_write_context import storage_write_scope\n'
          if import_line not in file_service:
              if import_anchor not in file_service:
                  raise SystemExit('file_service import anchor missing')
              file_service = file_service.replace(import_anchor, import_anchor + import_line, 1)
          upload_old = '        backend.persist(key, target)\n'
          upload_new = '        with storage_write_scope(biz_type):\n            backend.persist(key, target)\n'
          if upload_new not in file_service:
              if file_service.count(upload_old) != 1:
                  raise SystemExit('store_upload persist anchor must match exactly once')
              file_service = file_service.replace(upload_old, upload_new, 1)
          bytes_old = '    backend.persist(key, target)\n'
          bytes_new = '    with storage_write_scope(biz_type):\n        backend.persist(key, target)\n'
          if bytes_new not in file_service:
              if file_service.count(bytes_old) != 1:
                  raise SystemExit('store_bytes persist anchor must match exactly once')
              file_service = file_service.replace(bytes_old, bytes_new, 1)
          if file_service.count('with storage_write_scope(biz_type):') != 2:
              raise SystemExit('store_upload/store_bytes module quota scope count must be exactly two')
          file_service_path.write_text(file_service, encoding='utf-8')

          aggregate_path = Path('backend/app/models/__init__.py')
          aggregate = aggregate_path.read_text(encoding='utf-8')
          quota_import = 'from app.models.file_quota import FileStorageQuotaReservation  # noqa: F401\n'
          if quota_import not in aggregate:
              anchor = 'from app.models.file import FileObject  # noqa: F401\n'
              if anchor not in aggregate:
                  raise SystemExit('models aggregate file anchor missing')
              aggregate = aggregate.replace(anchor, anchor + quota_import, 1)
          aggregate_path.write_text(aggregate, encoding='utf-8')

          phase6_path = Path('backend/tests/graduation_material_center_mysql_acceptance.py')
          phase6 = phase6_path.read_text(encoding='utf-8')
          seed_start = phase6.index('            GraduationGuidance(')
          seed_end = phase6.index('            GraduationArchiveRecord(', seed_start)
          seed = '''            GraduationGuidance(
                tenant_id=TENANT_ID,
                gd_student_id=student.id,
                guidance_date=datetime.utcnow(),
                method="ONLINE",
                content="阶段六指导记录；下一步完成归档",
                issues="无",
                attachments_json=[],
            ),
            GraduationMidterm(
                tenant_id=TENANT_ID,
                gd_student_id=student.id,
                status="CHECKED_PASS",
                check_comment="进度 80%，检查通过，下一步完成定稿",
                conclusion="PASS",
                checked_at=datetime.utcnow(),
            ),
'''
          phase6_path.write_text(phase6[:seed_start] + seed + phase6[seed_end:], encoding='utf-8')
          PY
          python -m py_compile \
            backend/app/services/file_service.py \
            backend/app/models/__init__.py \
            backend/tests/graduation_material_center_mysql_acceptance.py
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Generate exact npm lock for official COS SDK
        working-directory: frontend
        run: npm install --save-exact cos-js-sdk-v5@1.10.1 --package-lock-only --ignore-scripts
      - name: Verify lock integrity and source contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const lock = JSON.parse(fs.readFileSync('frontend/package-lock.json', 'utf8'))
          const pkg = lock.packages && lock.packages['node_modules/cos-js-sdk-v5']
          if (!pkg || pkg.version !== '1.10.1') throw new Error('cos-js-sdk-v5 exact lock missing')
          if (!/^sha512-/.test(pkg.integrity || '')) throw new Error('cos-js-sdk-v5 integrity missing')
          if (!/^https:\/\/registry\.npmjs\.org\//.test(pkg.resolved || '')) throw new Error('cos-js-sdk-v5 registry URL missing')
          NODE
          grep -q "import COS from 'cos-js-sdk-v5'" frontend/src/services/file/cosBrowserSdk.js
          ! grep -q 'cdn.jsdelivr.net' frontend/src/services/file/cosBrowserSdk.js
      - name: Write stage 10 closure report and remove temporary orchestrator
        shell: bash
        run: |
          cat > docs/architecture/file-center-stage10-closure.md <<'EOF'
          # 公共文件中心阶段 6–10 收口报告

          ## 当前范围

          本报告对应 Draft PR #25 `audit/file-capability-inventory`。阶段 6–10 的仓库内施工已经收口到统一 FileObject、FileAsset/FileVersion/FileBinding、ImportJob/ExportJob、流式归档、COS 生产存储适配和租户存储治理。

          ## 仓库内最终门禁

          最终 HEAD 必须同时通过：

          - 能力清单、增量登记、严格调用扫描、旧上传合同和密钥扫描；
          - MySQL 8.0 单一 Alembic head，并升级到 `0154_file_storage_quota_reservation`；
          - 身份导入扫描后路径解析、配额 reservation、模块配额上下文、毕业设计和岗位实习流式归档测试；
          - 阶段 6–10 文件中心定向 pytest、真实 MySQL 验收和治理 worker；
          - 管理 PC lint/test/build、学生 PC lint/test/build、H5 与微信小程序生产构建。

          门禁结果由 PR #25 的“阶段 6–10 最终验收”评论和 GitHub Actions 运行记录作为权威证据，报告文件不伪造尚未执行的测试结果。

          ## 已冻结的关键合同

          - 普通上传、系统字节文件和路径型大型文件在物理写入前进入模块配额作用域；
          - COS 直传、服务器写入统一使用持久化 HELD reservation，完成后消费，失败、放弃或过期后释放；
          - 毕业设计和岗位实习归档使用流式 ZIP64、分块 SHA-256 与路径型 FileObject 写入，不整文件读入内存；
          - 身份导入先进入隔离和扫描，CLEAN 后才使用路径型 openpyxl 解析；
          - 业务 Router 不直接构造 FileResponse，统一使用带 no-store、nosniff 和审计的公共响应合同；
          - 管理 PC 使用精确锁定的 `cos-js-sdk-v5@1.10.1` npm 依赖，不在运行时加载 CDN，不保存永久密钥。

          ## 外部环境验收阻塞

          以下项目必须在真实腾讯云 COS 和生产域名环境执行，不能用 fake client 或单元测试冒充完成：

          1. 真实 STS 最小权限与过期行为；
          2. COS CORS 白名单；
          3. COS 生命周期策略；
          4. 服务端加密 SSE；
          5. 50MB 与 500MB 真实上传；
          6. 跨进程暂停、续传和取消；
          7. 真实跨租户对象隔离与越权验证。

          在上述外部验收完成前，PR 保持 Draft，不合并 main。
          EOF
          git rm -- .github/workflows/file-center-validation-report.yml
      - name: Commit final candidate HEAD
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            backend/app/models/__init__.py \
            backend/app/services/file_service.py \
            backend/tests/graduation_material_center_mysql_acceptance.py \
            docs/architecture/file-center-stage10-closure.md \
            frontend/package.json \
            frontend/package-lock.json \
            frontend/src/services/file/cosBrowserSdk.js \
            student-portal/src/App.vue \
            student-portal/src/layouts/PortalLayout.vue \
            student-portal/src/styles/v5-overrides.css \
            student-portal/src/styles/v5-polish.css \
            student-portal/src/views/home/HomeView.vue
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m "merge(main): finalize stage 6-10 file center closure"
          git push origin HEAD:audit/file-capability-inventory
      - id: final
        name: Resolve final candidate SHA
        run: |
          git fetch origin audit/file-capability-inventory
          echo "sha=$(git rev-parse origin/audit/file-capability-inventory)" >> "$GITHUB_OUTPUT"

  scan:
    needs: finalize-head
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.finalize-head.outputs.final_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - name: Inventory, strict call scan, contracts and secrets
        run: |
          git fetch origin main
          python scripts/audit_file_capabilities.py --check-schema
          python scripts/audit_file_capabilities.py --strict-baseline
          python scripts/check_new_file_capabilities.py --base-ref origin/main
          python scripts/audit_file_center_calls.py --strict --base-ref origin/main --json-report artifacts/file-center-call-scan.json
          test ! -e .github/workflows/file-center-validation-report.yml
          grep -q "from app.services.file_storage_write_context import storage_write_scope" backend/app/services/file_service.py
          test "$(grep -c 'with storage_write_scope(biz_type):' backend/app/services/file_service.py)" = "2"
          grep -q "with storage_write_scope(biz_type):" backend/app/services/generated_file_path_service.py
          grep -q "FileStorageQuotaReservation" backend/app/models/__init__.py
          grep -q "sp-theme__grid" student-portal/src/layouts/PortalLayout.vue
          grep -q "function toggleGraduationView()" student-portal/src/layouts/PortalLayout.vue
          grep -q "'/graduation/materials'" student-portal/src/layouts/PortalLayout.vue
          node - <<'NODE'
          const fs = require('fs')
          const lock = JSON.parse(fs.readFileSync('frontend/package-lock.json', 'utf8'))
          const pkg = lock.packages && lock.packages['node_modules/cos-js-sdk-v5']
          if (!pkg || pkg.version !== '1.10.1' || !/^sha512-/.test(pkg.integrity || '')) process.exit(1)
          NODE
          ! grep -R -n --include='*.js' --include='*.vue' --include='*.ts' '["'"'"'`]\/files\/upload' frontend/src student-portal/src miniapp/src
          ! grep -R -n --include='*.js' --include='*.vue' --include='*.ts' 'cdn.jsdelivr.net/npm/cos-js-sdk-v5\|COS_SECRET_ID\|COS_SECRET_KEY\|tmpSecretKey[[:space:]]*=' frontend/src student-portal/src miniapp/src
          ! grep -n '@router.post("/upload"' backend/app/api/v1/file.py
          grep -q '@router.post("", summary="上传文件（权威入口）")' backend/app/api/v1/files.py

  mysql:
    needs: finalize-head
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      APP_ENV: test
      SECRET_KEY: stage10-file-center-final-secret
      FILE_SCAN_ENABLED: 'false'
      FILE_SCAN_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ needs.finalize-head.outputs.final_sha }} }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - working-directory: backend
        run: pip install -r requirements.txt
      - name: Alembic 0154 and explicit new contracts
        working-directory: backend
        run: |
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
          alembic current | grep -q '0154_file_storage_quota_reservation'
          python -m compileall -q app tests
          pytest -q -p no:warnings \
            tests/test_file_identity_import_scan.py \
            tests/test_file_storage_quota_reservation.py \
            tests/test_file_storage_write_context.py \
            tests/test_file_streaming_archive_cutover.py
      - name: Stage 6-10 targeted pytest and real MySQL acceptances
        working-directory: backend
        run: |
          TARGETS=$(find tests -maxdepth 1 -type f \( \
            -name 'test_file*.py' -o \
            -name 'test_*material_center*.py' -o \
            -name 'test_*archive_manifest*.py' -o \
            -name 'test_data_exchange_job_center.py' -o \
            -name 'test_academic_file_exchange_center.py' -o \
            -name 'test_academic_export_compat.py' \
          \) | sort | tr '\n' ' ')
          test -n "$TARGETS"
          timeout 65m pytest $TARGETS -q -p no:warnings --durations=30
          python tests/file_access_mysql_acceptance.py
          python tests/file_scan_mysql_acceptance.py
          python tests/internship_material_center_mysql_acceptance.py
          python tests/graduation_material_center_mysql_acceptance.py
          python tests/affairs_material_center_mysql_acceptance.py
          python -m app.workers.file_governance_worker --once --tenant-id 90999 --dry-run

  admin:
    needs: finalize-head
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ needs.finalize-head.outputs.final_sha }} }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  student:
    needs: finalize-head
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: student-portal } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ needs.finalize-head.outputs.final_sha }} }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  miniapp:
    needs: finalize-head
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: miniapp } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ needs.finalize-head.outputs.final_sha }} }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run build:h5
      - run: npm run build:mp-weixin

  report:
    if: always()
    needs: [finalize-head, scan, mysql, admin, student, miniapp]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      FINALIZE: ${{ needs.finalize-head.result }}
      FINAL_SHA: ${{ needs.finalize-head.outputs.final_sha }}
      SCAN: ${{ needs.scan.result }}
      MYSQL: ${{ needs.mysql.result }}
      ADMIN: ${{ needs.admin.result }}
      STUDENT: ${{ needs.student.result }}
      MINIAPP: ${{ needs.miniapp.result }}
    steps:
      - name: Update Draft PR and write authoritative result
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/result.md <<EOF
          <!-- file-center-stage6-10-final-validation -->
          ## 阶段 6–10 最终验收（${FINAL_SHA:-$GITHUB_SHA}）

          | 门禁 | 结果 |
          |---|---|
          | 合并 main V5 / 材料库入口 / 模块配额作用域 / COS SDK lock / 删除临时编排 | ${FINALIZE} |
          | 能力清单 / 严格调用扫描 / 上传合同 / 密钥审计 | ${SCAN} |
          | MySQL 8 / Alembic 0154 / 新增合同 / 阶段 6–10 pytest / 真实验收 | ${MYSQL} |
          | 管理 PC lint / test / build | ${ADMIN} |
          | 学生 PC lint / test / build | ${STUDENT} |
          | H5 / 微信小程序生产构建 | ${MINIAPP} |

          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh pr comment 25 --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md

          if [ "$FINALIZE" = success ] && [ "$SCAN" = success ] && [ "$MYSQL" = success ] && [ "$ADMIN" = success ] && [ "$STUDENT" = success ] && [ "$MINIAPP" = success ]; then
            cat > /tmp/body.md <<EOF
          ## PR 定位

          本 PR 是全平台公共文件中心阶段 0–10 的唯一持续施工入口。

          - 分支：\`audit/file-capability-inventory\`
          - 最终仓库验收 HEAD：\`${FINAL_SHA}\`
          - 状态：Draft，未合并 main
          - main 学生门户 V5 已吸收，并保留毕业设计“我的材料库”入口
          - 临时验收编排文件已从最终 HEAD 删除

          ## 阶段 6–10 仓库内收口

          - [x] 毕业设计与岗位实习流式 ZIP64 归档，不整文件读入内存
          - [x] 教务导入导出统一 ImportJob / ExportJob 生命周期
          - [x] 身份导入先隔离扫描，CLEAN 后路径解析
          - [x] COS 直传、短时 STS、隔离分区和服务端加密合同
          - [x] 租户配额、持久化 reservation、保留策略、法律保留和两阶段清理
          - [x] 普通上传、store_bytes 与路径型大型文件均进入模块配额作用域
          - [x] 管理 PC 锁定 cos-js-sdk-v5@1.10.1，并在 package-lock 中保存 registry 与 integrity
          - [x] 旧上传别名退役、直接 FileResponse 收口、严格调用扫描与密钥扫描

          ## 最终仓库门禁

          - 能力清单 / 严格调用扫描 / 上传合同 / 密钥审计：success
          - MySQL 8.0 / Alembic 0154 / 阶段 6–10 pytest / 真实验收：success
          - 管理 PC lint / test / build：success
          - 学生 PC lint / test / build：success
          - H5 / 微信小程序生产构建：success

          ## 真实 COS 外部环境验收阻塞

          以下项目必须在真实腾讯云 COS 和生产域名环境执行，不能用 fake client 冒充：

          1. STS 最小权限与过期行为
          2. CORS 白名单
          3. 生命周期策略
          4. SSE 服务端加密
          5. 50MB 与 500MB 真实上传
          6. 跨进程暂停、续传和取消
          7. 真实跨租户对象隔离与越权验证

          在上述外部验收完成前，本 PR 继续保持 Draft，不合并 main。
          EOF
            gh pr edit 25 --repo "$GITHUB_REPOSITORY" \
              --title "Draft: 全平台公共文件中心（阶段 6–10 仓库内已收口，待真实 COS 验收）" \
              --body-file /tmp/body.md
          fi
