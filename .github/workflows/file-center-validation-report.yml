name: File center stage 6-10 validation report

on:
  push:
    branches: [audit/file-capability-inventory]
    paths: ['.github/workflows/file-center-validation-report.yml']

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: file-center-stage6-10-validation
  cancel-in-progress: true

jobs:
  prepare:
    name: 吸收 main V5 + 修正阶段 6 真实夹具
    runs-on: ubuntu-24.04
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0
      - name: Merge current main and preserve graduation material entry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-commit origin/main || true
          UNMERGED="$(git diff --name-only --diff-filter=U)"
          if [ -n "$UNMERGED" ]; then
            if [ "$UNMERGED" != "student-portal/src/layouts/PortalLayout.vue" ]; then
              echo "Unexpected merge conflicts:"
              echo "$UNMERGED"
              exit 1
            fi
            git checkout --theirs -- student-portal/src/layouts/PortalLayout.vue
          fi
          python - <<'PY'
          from pathlib import Path

          portal = Path('student-portal/src/layouts/PortalLayout.vue')
          source = portal.read_text(encoding='utf-8')
          if 'function toggleGraduationView()' not in source:
              button_anchor = '''          <button v-if="activeModulePath === 'internship'" class="sp-context-link" type="button" @click="toggleInternshipView">
            {{ route.name === 'internship-compliance' ? '返回实习工作台' : '上岗合规与安全教育' }}
          </button>
'''
              button = '''          <button v-if="activeModulePath === 'graduation'" class="sp-context-link" type="button" @click="toggleGraduationView">
            {{ route.name === 'graduation-material-library' ? '返回毕业设计工作台' : '我的材料库' }}
          </button>
'''
              function_anchor = '''function toggleInternshipView() {
  router.push(route.name === 'internship-compliance' ? '/internship' : '/internship/compliance')
}
'''
              function = '''function toggleGraduationView() {
  router.push(route.name === 'graduation-material-library' ? '/graduation' : '/graduation/materials')
}
'''
              if button_anchor not in source or function_anchor not in source:
                  raise SystemExit('PortalLayout V5 anchors missing')
              source = source.replace(button_anchor, button_anchor + button, 1)
              source = source.replace(function_anchor, function_anchor + function, 1)
          required = (
              'sp-theme__grid',
              'student-portal-theme-change',
              "activeModulePath === 'graduation'",
              'function toggleGraduationView()',
              "'/graduation/materials'",
          )
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit(f'PortalLayout contracts missing: {missing}')
          portal.write_text(source, encoding='utf-8')

          phase6_path = Path('backend/tests/graduation_material_center_mysql_acceptance.py')
          phase6 = phase6_path.read_text(encoding='utf-8')
          seed_start = phase6.index('            GraduationGuidance(')
          seed_end = phase6.index('            GraduationArchiveRecord(', seed_start)
          seed = '''            GraduationGuidance(
                tenant_id=TENANT_ID,
                gd_student_id=student.id,
                guidance_date=datetime.utcnow(),
                method="ONLINE",
                content="阶段六指导记录；下一步完成归档",
                issues="无",
                attachments_json=[],
            ),
            GraduationMidterm(
                tenant_id=TENANT_ID,
                gd_student_id=student.id,
                status="CHECKED_PASS",
                check_comment="进度 80%，检查通过，下一步完成定稿",
                conclusion="PASS",
                checked_at=datetime.utcnow(),
            ),
'''
          phase6_path.write_text(phase6[:seed_start] + seed + phase6[seed_end:], encoding='utf-8')
          PY
          python -m py_compile backend/tests/graduation_material_center_mysql_acceptance.py
          test -z "$(git diff --name-only --diff-filter=U)"
          git add -- \
            student-portal/src/App.vue \
            student-portal/src/layouts/PortalLayout.vue \
            student-portal/src/styles/v5-overrides.css \
            student-portal/src/styles/v5-polish.css \
            student-portal/src/views/home/HomeView.vue \
            backend/tests/graduation_material_center_mysql_acceptance.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "merge(main): absorb student portal V5 and current phase6 fixtures"
            git push origin HEAD:audit/file-capability-inventory
          else
            git merge --abort 2>/dev/null || true
          fi
      - id: head
        name: Resolve prepared branch HEAD
        run: |
          git fetch origin audit/file-capability-inventory
          echo "sha=$(git rev-parse origin/audit/file-capability-inventory)" >> "$GITHUB_OUTPUT"

  scan:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - name: Inventory, call scan and upload contract
        run: |
          python scripts/audit_file_capabilities.py --check-schema
          python scripts/audit_file_capabilities.py --strict-baseline
          python scripts/check_new_file_capabilities.py --base-ref origin/main
          python scripts/audit_file_center_calls.py --strict --base-ref origin/main --json-report artifacts/file-center-call-scan.json
          ! grep -R -n --include='*.js' --include='*.vue' --include='*.ts' '["'"'"'`]\/files\/upload' frontend/src student-portal/src miniapp/src
          ! grep -n '@router.post("/upload"' backend/app/api/v1/file.py
          grep -q '@router.post("", summary="上传文件（权威入口）")' backend/app/api/v1/files.py

  mysql:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      APP_ENV: test
      SECRET_KEY: stage10-file-center-validation-secret
      FILE_SCAN_ENABLED: 'false'
      FILE_SCAN_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
        with: { ref: audit/file-capability-inventory }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - working-directory: backend
        run: pip install -r requirements.txt
      - name: Migrations, compile and stage 6-10 tests
        working-directory: backend
        run: |
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
          python -m compileall -q app tests
          TARGETS=$(find tests -maxdepth 1 -type f \( \
            -name 'test_file*.py' -o \
            -name 'test_*material_center*.py' -o \
            -name 'test_*archive_manifest*.py' -o \
            -name 'test_data_exchange_job_center.py' -o \
            -name 'test_academic_file_exchange_center.py' -o \
            -name 'test_academic_export_compat.py' \
          \) | sort | tr '\n' ' ')
          test -n "$TARGETS"
          timeout 50m pytest $TARGETS -q -p no:warnings --durations=30
          python -m app.workers.file_governance_worker --once --tenant-id 90999 --dry-run

  admin:
    needs: prepare
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: audit/file-capability-inventory }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  student:
    needs: prepare
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: student-portal } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: audit/file-capability-inventory }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  miniapp:
    needs: prepare
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: miniapp } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: audit/file-capability-inventory }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run build:h5
      - run: npm run build:mp-weixin

  report:
    if: always()
    needs: [prepare, scan, mysql, admin, student, miniapp]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PREPARE: ${{ needs.prepare.result }}
      PREPARED_SHA: ${{ needs.prepare.outputs.head_sha }}
      SCAN: ${{ needs.scan.result }}
      MYSQL: ${{ needs.mysql.result }}
      ADMIN: ${{ needs.admin.result }}
      STUDENT: ${{ needs.student.result }}
      MINIAPP: ${{ needs.miniapp.result }}
    steps:
      - name: Write validation result to Draft PR 25
        run: |
          cat > /tmp/result.md <<EOF
          <!-- file-center-stage6-10-validation -->
          ## 阶段 6–10 最新验收（${PREPARED_SHA:-$GITHUB_SHA}）

          | 门禁 | 结果 |
          |---|---|
          | 吸收 main V5 / 阶段 6 夹具 | ${PREPARE} |
          | 能力清单 / 严格调用扫描 / 上传合同 | ${SCAN} |
          | MySQL 8 / Alembic / 阶段 6–10 pytest / 治理 worker | ${MYSQL} |
          | 管理 PC lint / test / build | ${ADMIN} |
          | 学生 PC lint / test / build | ${STUDENT} |
          | H5 / 微信小程序生产构建 | ${MINIAPP} |

          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh pr comment 25 --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
