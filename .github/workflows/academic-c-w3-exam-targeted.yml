name: Academic C W3 Exam Targeted

on:
  push:
    branches:
      - agent/academic-c-teaching-execution
    paths:
      - 'backend/app/modules/academic_affairs/services/academic_affairs_exam_print_service.py'
      - 'backend/app/modules/academic_affairs/routers/exam_incident_closure_router.py'
      - 'backend/tests/test_aa_exam_formal_print_contract.py'
      - 'backend/tests/test_aa_exam_formal_print_wiring_contract.py'
      - 'frontend/src/modules/academicAffairs/api/academic-exam-formal-print.api.js'
      - 'frontend/src/modules/academicAffairs/views/AaExamSeatingPrintView.vue'
      - 'frontend/tests/academic-exam-formal-print-source-contract.test.mjs'
      - 'miniapp/src/pages/student/academic-affairs/exam.vue'
      - 'miniapp/tests/academic-student-exam-source-contract.test.mjs'
      - '.github/workflows/academic-c-w3-exam-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-c-w3-exam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exam-formal-print:
    name: formal print projection / MySQL + frontend + student miniapp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      JWT_SECRET: academic-c-w3-exam-targeted-secret
      DB_ENABLED: 'true'
      MOCK_LOGIN_ENABLED: 'true'
      FAST_TEST_SCHEMA: '1'
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install cryptography
      - name: Compile C-W3 formal print projection
        working-directory: backend
        run: |
          python -m py_compile \
            app/modules/academic_affairs/services/academic_affairs_exam_print_service.py \
            app/modules/academic_affairs/routers/exam_incident_closure_router.py \
            tests/test_aa_exam_formal_print_contract.py \
            tests/test_aa_exam_formal_print_wiring_contract.py
      - name: C-W3 formal print exact contract on MySQL
        working-directory: backend
        run: |
          pytest -q \
            tests/test_aa_exam_formal_print_contract.py \
            tests/test_aa_exam_formal_print_wiring_contract.py \
            -p no:warnings --durations=10
      - name: C-W3 formal print frontend source contract
        working-directory: frontend
        run: node --test tests/academic-exam-formal-print-source-contract.test.mjs
      - name: C-W3 student exam source contract
        working-directory: miniapp
        run: node --test tests/academic-student-exam-source-contract.test.mjs
      - name: Prove formal print provider is read-only
        working-directory: backend
        run: |
          python - <<'PY'
          import inspect
          from app.modules.academic_affairs.services import academic_affairs_exam_print_service as svc
          source = inspect.getsource(svc.formal_room_print)
          forbidden = ('db.add(', 'db.flush(', 'db.commit(', 'resolve_versioned_roster', 'require_consumer_snapshot_current')
          bad = [value for value in forbidden if value in source]
          if bad:
              raise SystemExit('C-W3 formal print read-only invariant violated: ' + ', '.join(bad))
          print('C-W3 formal print read-only invariant=ok')
          PY
