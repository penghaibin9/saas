name: Academic B W6 Peak Admission Patch

on:
  push:
    branches: [agent/academic-b-schedule-selection]
    paths:
      - '.github/workflows/academic-b-w6-admission-patch.yml'

permissions:
  contents: write

concurrency:
  group: academic-b-w6-admission-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact patch head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Apply exact production patch and freeze completed W5 gates
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          final_path = Path('backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py')
          source = final_path.read_text(encoding='utf-8')

          old_imports = dedent('''\
          import importlib
          from datetime import datetime
          from types import SimpleNamespace
          ''')
          new_imports = dedent('''\
          import importlib
          from contextlib import contextmanager
          from datetime import datetime
          from threading import BoundedSemaphore, Lock
          from time import monotonic
          from types import SimpleNamespace
          ''')
          assert source.count(old_imports) == 1, 'W6 admission import anchor drifted'
          source = source.replace(old_imports, new_imports, 1)

          base_anchor = dedent('''\
          _base = importlib.import_module(
              ".academic_affairs_selection_service",
              package=__package__,
          )
          ''')
          admission = dedent('''\
          _base = importlib.import_module(
              ".academic_affairs_selection_service",
              package=__package__,
          )

          # W6 peak admission is process-local backpressure, never the business authority.
          # Each process owns its SQLAlchemy pool, so the process gate is sized from that
          # pool and intentionally leaves overflow headroom for EffectiveGrade/read sessions
          # and unrelated requests. Cross-process correctness remains MySQL row locking.
          from app.core.config import get_settings as _get_settings

          _db_settings = _get_settings()
          _selection_pool_total = max(
              1,
              int(_db_settings.DB_POOL_SIZE or 1) + int(_db_settings.DB_MAX_OVERFLOW or 0),
          )
          _selection_process_limit = max(
              1,
              min(
                  int(_db_settings.DB_POOL_SIZE or 1),
                  max(1, _selection_pool_total // 2),
              ),
          )
          _SELECTION_ENROLL_PROCESS_GATE = BoundedSemaphore(_selection_process_limit)
          _SELECTION_ENROLL_STRIPES = tuple(Lock() for _ in range(64))
          _SELECTION_ADMISSION_TIMEOUT_SECONDS = max(
              10.0,
              min(30.0, float(_db_settings.DB_POOL_TIMEOUT or 5) * 6.0),
          )


          @contextmanager
          def _selection_course_admission(selection_course_id: int):
              """Bound hot-key fan-in before DB checkout; MySQL remains final authority."""
              course_id = int(selection_course_id)
              stripe = _SELECTION_ENROLL_STRIPES[course_id % len(_SELECTION_ENROLL_STRIPES)]
              deadline = monotonic() + _SELECTION_ADMISSION_TIMEOUT_SECONDS
              if not stripe.acquire(timeout=_SELECTION_ADMISSION_TIMEOUT_SECONDS):
                  raise AppException(
                      "SELECTION_BUSY",
                      "当前课程选课请求繁忙，请稍后重试",
                      details={"selectionCourseId": str(course_id)},
                      http_status=429,
                  )
              process_acquired = False
              try:
                  remaining = max(0.0, deadline - monotonic())
                  process_acquired = _SELECTION_ENROLL_PROCESS_GATE.acquire(timeout=remaining)
                  if not process_acquired:
                      raise AppException(
                          "SELECTION_BUSY",
                          "当前选课请求繁忙，请稍后重试",
                          details={"selectionCourseId": str(course_id)},
                          http_status=429,
                      )
                  yield
              finally:
                  if process_acquired:
                      _SELECTION_ENROLL_PROCESS_GATE.release()
                  stripe.release()
          ''')
          assert source.count(base_anchor) == 1, 'W6 admission base anchor drifted'
          source = source.replace(base_anchor, admission, 1)

          enroll_anchor = dedent('''\
          def student_enroll(user, body):
              from app.models import AaSelectionBatch, AaSelectionCourse, AaSelectionRecord
          ''')
          guarded = dedent('''\
          def student_enroll(user, body):
              """Peak-safe public command; admission happens before any DB connection checkout."""
              selection_course_id = int(body.selectionCourseId)
              with _selection_course_admission(selection_course_id):
                  return _student_enroll_guarded(user, body)


          def _student_enroll_guarded(user, body):
              from app.models import AaSelectionBatch, AaSelectionCourse, AaSelectionRecord
          ''')
          assert source.count(enroll_anchor) == 1, 'W6 student_enroll anchor drifted'
          source = source.replace(enroll_anchor, guarded, 1)
          final_path.write_text(source, encoding='utf-8')

          # Completed W5 evidence remains manually re-runnable but must not consume W6 runners.
          workflow_paths = [
              Path('.github/workflows/academic-b-w5-student-projection-contract.yml'),
              Path('.github/workflows/academic-b-w5-student-projection-mysql.yml'),
              Path('.github/workflows/academic-b-w5-student-projection-real-click.yml'),
          ]
          for path in workflow_paths:
              text = path.read_text(encoding='utf-8')
              start = text.index('on:\n')
              marker = '\npermissions:' if '\npermissions:' in text[start:] else '\nconcurrency:'
              end = text.index(marker, start)
              text = text[:start] + 'on:\n  workflow_dispatch:\n' + text[end:]
              path.write_text(text, encoding='utf-8')

          w6_path = Path('.github/workflows/academic-b-w6-fcfs-peak-mysql.yml')
          w6 = w6_path.read_text(encoding='utf-8')
          old_paths = dedent('''\
              - backend/tests/test_aa_selection_w6_fcfs_peak_mysql.py
              - .github/workflows/academic-b-w6-fcfs-peak-mysql.yml
          ''')
          new_paths = dedent('''\
              - backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py
              - backend/tests/test_aa_selection_w6_fcfs_peak_mysql.py
              - .github/workflows/academic-b-w6-fcfs-peak-mysql.yml
          ''')
          assert w6.count(old_paths) == 1, 'W6 peak workflow path anchor drifted'
          w6_path.write_text(w6.replace(old_paths, new_paths, 1), encoding='utf-8')
          PY
          python -m py_compile backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py
          git diff --check
      - name: Audit patch scope
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 5
          printf '%s\n' "${changed[@]}" | grep -qx 'backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py'
          printf '%s\n' "${changed[@]}" | grep -qx '.github/workflows/academic-b-w5-student-projection-contract.yml'
          printf '%s\n' "${changed[@]}" | grep -qx '.github/workflows/academic-b-w5-student-projection-mysql.yml'
          printf '%s\n' "${changed[@]}" | grep -qx '.github/workflows/academic-b-w5-student-projection-real-click.yml'
          printf '%s\n' "${changed[@]}" | grep -qx '.github/workflows/academic-b-w6-fcfs-peak-mysql.yml'
      - name: Commit production patch and self-clean helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py \
            .github/workflows/academic-b-w5-student-projection-contract.yml \
            .github/workflows/academic-b-w5-student-projection-mysql.yml \
            .github/workflows/academic-b-w5-student-projection-real-click.yml \
            .github/workflows/academic-b-w6-fcfs-peak-mysql.yml
          git rm .github/workflows/academic-b-w6-admission-patch.yml
          git commit -m 'fix(academic-b): bound selection hot-key DB fan-in'
          git push origin HEAD:agent/academic-b-schedule-selection
