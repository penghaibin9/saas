name: Academic B W1 batch preflight and admin UI once

on:
  push:
    branches: [agent/academic-b-schedule-selection]
    paths:
      - '.github/workflows/academic-b-w1-batch-preflight-once.yml'

permissions:
  contents: write

env:
  APP_ENV: test
  DB_ENABLED: 'true'
  MOCK_LOGIN_ENABLED: 'true'
  JWT_SECRET: academic-b-w1-batch-preflight-secret-at-least-32-bytes
  DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_w1?charset=utf8mb4
  TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/academic_b_w1?charset=utf8mb4

jobs:
  construct:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: academic_b_w1
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-b-schedule-selection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply W1 batch-preflight backend and admin UI slice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          preflight = Path('backend/app/modules/academic_affairs/services/academic_affairs_selection_preflight_service.py')
          preflight.write_text('''"""B-W1 SelectionPreflight: pure-read lifecycle validation shared by commands and UI.\n\nThis module never commits, audits, changes capacity, or changes selection/roster state.\nW2/W4 extend evidence with ScopeHead/Task identity; W1 only freezes current lifecycle/config truth.\n"""\nfrom __future__ import annotations\n\nimport json\n\nfrom app.core.exceptions import AppException\nfrom app.services.db_service import _tid\n\n_EXPECTED = {\n    "PUBLISH": "DRAFT",\n    "OPEN": "PUBLISHED",\n    "CLOSE": "OPEN",\n    "LOCK": "CLOSED",\n}\n\n\ndef _block(code, message, owner_role="ACADEMIC_ADMIN", how_to_resolve=None, **details):\n    row = {\n        "code": code,\n        "message": message,\n        "ownerRole": owner_role,\n        "howToResolve": how_to_resolve or message,\n    }\n    if details:\n        row["details"] = details\n    return row\n\n\ndef _strict_object(raw, *, code, label, batch_id, blockers):\n    if raw in (None, ""):\n        return {}\n    try:\n        value = json.loads(raw) if isinstance(raw, str) else raw\n    except (TypeError, ValueError, json.JSONDecodeError):\n        blockers.append(_block(\n            code,\n            f"{label}JSON损坏",\n            how_to_resolve=f"修复批次{label}配置后重新预检",\n            batchId=str(batch_id),\n        ))\n        return None\n    if not isinstance(value, dict):\n        blockers.append(_block(\n            code,\n            f"{label}格式错误，必须是对象",\n            how_to_resolve=f"将批次{label}改为对象结构后重新预检",\n            batchId=str(batch_id),\n        ))\n        return None\n    return value\n\n\ndef evaluate_batch(db, batch, action: str) -> dict:\n    """Pure read. Return lifecycle blockers and existing roster validation for LOCK."""\n    from app.models import AaSelectionCourse\n\n    action = str(action or "").strip().upper()\n    if action not in _EXPECTED:\n        raise AppException("VALIDATION_ERROR", "preflight action仅支持PUBLISH/OPEN/CLOSE/LOCK")\n\n    blockers = []\n    expected = _EXPECTED[action]\n    if str(batch.status or "").upper() != expected:\n        blockers.append(_block(\n            "SELECTION_STATE_MISMATCH",\n            f"当前状态{batch.status or 'UNKNOWN'}不可执行{action}",\n            how_to_resolve=f"仅{expected}状态可执行{action}",\n            expectedStatus=expected,\n            actualStatus=str(batch.status or ""),\n        ))\n    if not getattr(batch, "term_id", None):\n        blockers.append(_block(\n            "SELECTION_TERM_MISSING",\n            "选课批次未绑定正式学期",\n            how_to_resolve="返回批次配置并绑定正式termId",\n        ))\n\n    _strict_object(\n        getattr(batch, "apply_scope_json", None),\n        code="SELECTION_SCOPE_CONFIG_INVALID",\n        label="适用范围",\n        batch_id=batch.id,\n        blockers=blockers,\n    )\n    _strict_object(\n        getattr(batch, "rule_json", None),\n        code="SELECTION_RULE_CONFIG_INVALID",\n        label="选课规则",\n        batch_id=batch.id,\n        blockers=blockers,\n    )\n\n    course_count = None\n    if action in {"PUBLISH", "OPEN"}:\n        courses = db.query(AaSelectionCourse).filter(\n            AaSelectionCourse.tenant_id == _tid(),\n            AaSelectionCourse.batch_id == int(batch.id),\n            AaSelectionCourse.status == "OPEN",\n            AaSelectionCourse.is_deleted.is_(False),\n        ).all()\n        course_count = len(courses)\n        if not courses:\n            blockers.append(_block(\n                "SELECTION_COURSE_EMPTY",\n                "批次未配置有效可选课程",\n                how_to_resolve="至少添加一门有效可选课程后重新预检",\n            ))\n        invalid = [row for row in courses if int(row.capacity or 0) <= 0\n                   or int(row.min_capacity or 0) < 0\n                   or int(row.min_capacity or 0) > int(row.capacity or 0)]\n        if invalid:\n            blockers.append(_block(\n                "SELECTION_CAPACITY_INVALID",\n                f"有{len(invalid)}门课程容量或开班下限配置无效",\n                how_to_resolve="修复课程容量/开班下限后重新预检",\n                selectionCourseIds=[str(row.id) for row in invalid],\n            ))\n\n    roster_validation = None\n    if action == "LOCK" and str(batch.status or "").upper() == "CLOSED":\n        from .academic_affairs_teaching_roster_service import validate_selection_lock\n        roster_validation = validate_selection_lock(db, batch)\n        for issue in list(roster_validation.get("issues") or []):\n            blockers.append(_block(\n                str(issue.get("code") or "SELECTION_ROSTER_INVALID"),\n                str(issue.get("message") or "正式名单校验未通过"),\n                how_to_resolve="处置该名单问题后重新预检",\n                selectionCourseId=str(issue.get("courseId") or ""),\n            ))\n\n    return {\n        "allowed": not blockers,\n        "action": action,\n        "batchId": str(batch.id),\n        "status": str(batch.status or ""),\n        "expectedStatus": expected,\n        "courseCount": course_count,\n        "blockers": blockers,\n        "allowedActions": [action] if not blockers else ["VIEW"],\n        "_rosterValidation": roster_validation,\n    }\n\n\ndef public_result(result: dict) -> dict:\n    return {key: value for key, value in result.items() if not key.startswith("_")}\n\n\ndef require_batch_action(db, batch, action: str) -> dict:\n    result = evaluate_batch(db, batch, action)\n    if not result["allowed"]:\n        first = result["blockers"][0]\n        raise AppException(\n            "DATA_CONFLICT",\n            first["message"],\n            details={"preflight": public_result(result)},\n            http_status=409,\n        )\n    return result\n''', encoding='utf-8')

          final = 'backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py'
          replace_once(final,
              'from . import academic_affairs_selection_decision_trace as selection_trace\n',
              'from . import academic_affairs_selection_decision_trace as selection_trace\nfrom . import academic_affairs_selection_preflight_service as batch_preflight_svc\n')
          replace_once(final,
              '''        _base._guard_batch_writable(db, batch)\n        if batch.status != _base._BATCH_DRAFT:\n''',
              '''        _base._guard_batch_writable(db, batch)\n        batch_preflight_svc.require_batch_action(db, batch, "PUBLISH")\n        if batch.status != _base._BATCH_DRAFT:\n''')
          marker = '\n\ndef publish_batch(user, batch_id) -> dict:\n'
          addition = '''\n\ndef batch_preflight(user, batch_id, action: str) -> dict:\n    """Admin-visible pure lifecycle preflight; archived-term/config failures become blockers, not writes."""\n    from app.models import AaSelectionBatch\n\n    with _base._core.session() as db:\n        _base._core._ctx(user, db)\n        batch = db.query(AaSelectionBatch).filter(\n            AaSelectionBatch.id == int(batch_id),\n            AaSelectionBatch.tenant_id == _base._core._tid(),\n            AaSelectionBatch.is_deleted.is_(False),\n        ).first()\n        if not batch:\n            raise not_found("选课批次不存在")\n        result = batch_preflight_svc.evaluate_batch(db, batch, action)\n        try:\n            _base._guard_batch_writable(db, batch)\n        except AppException as exc:\n            result["blockers"].insert(0, {\n                "code": str(getattr(exc, "code", "") or "SELECTION_TERM_NOT_WRITABLE"),\n                "message": str(getattr(exc, "message", "") or str(exc)),\n                "ownerRole": "ACADEMIC_ADMIN",\n                "howToResolve": "处理学期归档/只读状态后重新预检",\n            })\n            result["allowed"] = False\n            result["allowedActions"] = ["VIEW"]\n        return batch_preflight_svc.public_result(result)\n\n\ndef open_batch(user, batch_id) -> dict:\n    from app.models import AaSelectionBatch\n    with _base._core.session() as db:\n        _base._core._require_manage_scope(_base._core._ctx(user, db))\n        batch = db.query(AaSelectionBatch).filter(\n            AaSelectionBatch.id == int(batch_id),\n            AaSelectionBatch.tenant_id == _base._core._tid(),\n            AaSelectionBatch.is_deleted.is_(False),\n        ).with_for_update().first()\n        if not batch:\n            raise not_found("选课批次不存在")\n        _base._guard_batch_writable(db, batch)\n        batch_preflight_svc.require_batch_action(db, batch, "OPEN")\n        batch.status = _base._BATCH_OPEN\n        _base._core._audit(db, batch.id, "SELECTION_BATCH_OPEN", "开选；preflight=PASS")\n        db.commit()\n        return _base._core._batch_dto(batch)\n\n\ndef close_batch(user, batch_id) -> dict:\n    from app.models import AaSelectionBatch\n    with _base._core.session() as db:\n        _base._core._require_manage_scope(_base._core._ctx(user, db))\n        batch = db.query(AaSelectionBatch).filter(\n            AaSelectionBatch.id == int(batch_id),\n            AaSelectionBatch.tenant_id == _base._core._tid(),\n            AaSelectionBatch.is_deleted.is_(False),\n        ).with_for_update().first()\n        if not batch:\n            raise not_found("选课批次不存在")\n        _base._guard_batch_writable(db, batch)\n        batch_preflight_svc.require_batch_action(db, batch, "CLOSE")\n        batch.status = _base._BATCH_CLOSED\n        _base._core._audit(db, batch.id, "SELECTION_BATCH_CLOSE", "截止选课；preflight=PASS")\n        db.commit()\n        return _base._core._batch_dto(batch)\n'''
          replace_once(final, marker, addition + marker)
          replace_once(final,
              '''        _base._guard_batch_writable(db, batch)\n        if batch.status != _base._BATCH_CLOSED:\n            raise _base._core._invalid("仅已关闭选课批次可锁定名单")\n        validation = validate_selection_lock(db, batch)\n''',
              '''        _base._guard_batch_writable(db, batch)\n        if batch.status != _base._BATCH_CLOSED:\n            raise _base._core._invalid("仅已关闭选课批次可锁定名单")\n        preflight = batch_preflight_svc.require_batch_action(db, batch, "LOCK")\n        validation = preflight.get("_rosterValidation") or validate_selection_lock(db, batch)\n''')

          router = 'backend/app/modules/academic_affairs/routers/academic_selection_final_router.py'
          replace_once(router, 'from fastapi import APIRouter, Depends, Path\n', 'from fastapi import APIRouter, Depends, Path, Query\n')
          replace_once(router,
              '''@router.post("/selection/batches/{batchId}/publish", summary="发布批次（最终服务）")\n''',
              '''@router.get("/selection/batches/{batchId}/preflight", summary="批次生命周期预检（纯读）")\ndef sel_batch_preflight(\n    batchId: int = Path(...),\n    action: str = Query(..., pattern="^(PUBLISH|OPEN|CLOSE|LOCK)$"),\n    user=Depends(require_permission(base._SEL_VIEW)),\n):\n    return base.success(selection_final.batch_preflight(user, batchId, action))\n\n\n@router.post("/selection/batches/{batchId}/publish", summary="发布批次（最终服务）")\n''')

          api = 'frontend/src/modules/academicAffairs/api/academic-affairs.api.js'
          replace_once(api,
              '''  createBatch(body) { return call(() => request(`${BASE}/selection/batches`, { method: 'POST', body })) },\n  publishBatch(id) { return call(() => request(`${BASE}/selection/batches/${id}/publish`, { method: 'POST' })) },\n''',
              '''  createBatch(body) { return call(() => request(`${BASE}/selection/batches`, { method: 'POST', body })) },\n  batchPreflight(id, action) { return call(() => request(`${BASE}/selection/batches/${id}/preflight`, { params: { action } })) },\n  publishBatch(id) { return call(() => request(`${BASE}/selection/batches/${id}/publish`, { method: 'POST' })) },\n''')

          view = 'frontend/src/modules/academicAffairs/views/AaSelectionConsoleView.vue'
          replace_once(view,
              '''          </section>\n\n          <section class="aasel-metrics" aria-label="批次关键指标">\n''',
              '''          </section>\n\n          <AppInlineAlert\n            v-if="preflight && !preflight.allowed"\n            class="aasel-preflight-alert"\n            type="danger"\n            :description="preflightMessage(preflight)"\n          />\n\n          <section class="aasel-metrics" aria-label="批次关键指标">\n''')
          replace_once(view,
              '''      confirmVisible: false, confirmTitle: '', confirmMessage: '', pendingAction: null,\n      rounds: [], drawResult: null,\n''',
              '''      confirmVisible: false, confirmTitle: '', confirmMessage: '', pendingAction: null,\n      preflight: null, preflightLoading: false,\n      rounds: [], drawResult: null,\n''')
          replace_once(view,
              '''    nextActionFor(status) { return _NEXT[status] || '查看批次详情' },\n''',
              '''    nextActionFor(status) { return _NEXT[status] || '查看批次详情' },\n    lifecycleAction(status) { return { DRAFT: 'PUBLISH', PUBLISHED: 'OPEN', OPEN: 'CLOSE', CLOSED: 'LOCK' }[status] || '' },\n    preflightMessage(result) {\n      const blockers = (result && result.blockers) || []\n      if (!blockers.length) return '当前动作预检未通过，请刷新后重试。'\n      return blockers.map((item) => `${item.message}${item.howToResolve ? `；处理：${item.howToResolve}` : ''}`).join('；')\n    },\n    async refreshPreflight() {\n      const action = this.lifecycleAction(this.current && this.current.status)\n      if (!this.current || !action) { this.preflight = null; return null }\n      this.preflightLoading = true\n      const res = await api.batchPreflight(this.current.batchId, action)\n      this.preflightLoading = false\n      this.preflight = res.code === 0 ? res.data : { allowed: false, blockers: [{ message: res.message || '预检失败' }] }\n      return this.preflight\n    },\n''')
          replace_once(view,
              '''    async select(b) {\n      this.current = b\n      this.drawResult = null\n      await this.refreshDetail()\n    },\n''',
              '''    async select(b) {\n      this.current = b\n      this.drawResult = null\n      this.preflight = null\n      await this.refreshDetail()\n      await this.refreshPreflight()\n    },\n''')
          replace_once(view,
              '''    lifecycle(fn, label) {\n      this.confirmTitle = label\n      this.confirmMessage = `确认对批次「${this.current.batchName}」执行「${label}」？`\n      this.pendingAction = async () => {\n        const res = await api[fn](this.current.batchId)\n        if (res.code === 0) { toast.success(label + '成功'); this.current = res.data; await this.load(); await this.refreshDetail() }\n        else toast.error(res.message)\n      }\n      this.confirmVisible = true\n    },\n''',
              '''    async lifecycle(fn, label) {\n      const action = { publishBatch: 'PUBLISH', openBatch: 'OPEN', closeBatch: 'CLOSE', lockBatch: 'LOCK' }[fn]\n      if (action) {\n        const checked = await this.refreshPreflight()\n        if (!checked || !checked.allowed) {\n          toast.error(this.preflightMessage(checked))\n          return\n        }\n      }\n      this.confirmTitle = label\n      this.confirmMessage = `确认对批次「${this.current.batchName}」执行「${label}」？`\n      this.pendingAction = async () => {\n        const res = await api[fn](this.current.batchId)\n        if (res.code === 0) { toast.success(label + '成功'); this.current = res.data; await this.load(); await this.refreshDetail(); await this.refreshPreflight() }\n        else toast.error(res.message)\n      }\n      this.confirmVisible = true\n    },\n''')
          replace_once(view,
              '''.aasel-detail { min-width: 0; display: grid; gap: 14px; }\n''',
              '''.aasel-detail { min-width: 0; display: grid; gap: 14px; }\n.aasel-preflight-alert { margin: 0; }\n''')

          Path('backend/tests/test_aa_selection_batch_preflight_w1.py').write_text('''from __future__ import annotations\n\nimport inspect\nfrom datetime import datetime, timedelta\n\nTID = 1000000000000000001\nBASE = "/api/v1/academic-affairs"\n\n\ndef _admin(client):\n    data = client.post("/api/v1/auth/mock-login", json={"loginName": "school_admin01", "password": "any"}).json()["data"]\n    return {"Authorization": f"Bearer {data['accessToken']}"}\n\n\ndef _seed(db_mode):\n    from app.db.session import get_sessionmaker\n    from app.models import AaCourse, AaTerm\n    db = get_sessionmaker()()\n    try:\n        term = AaTerm(tenant_id=TID, year_code="2028-2029", term_no=1, term_name="W1预检学期",\n                      start_date=datetime.utcnow() - timedelta(days=5),\n                      end_date=datetime.utcnow() + timedelta(days=120), status="PUBLISHED", is_current=False)\n        course = AaCourse(tenant_id=TID, course_code="W1P101", course_name="W1预检课程", credit=2, status="ENABLED")\n        db.add_all([term, course]); db.flush()\n        ids = (term.id, course.id)\n        db.commit()\n        return ids\n    finally:\n        db.close()\n\n\ndef test_batch_preflight_is_pure_source_contract():\n    from app.modules.academic_affairs.services import academic_affairs_selection_preflight_service as svc\n    source = inspect.getsource(svc.evaluate_batch)\n    for token in ["db.commit(", "db.add(", ".update(", "_audit("]:\n        assert token not in source, token\n    assert "validate_selection_lock" in source\n\n\ndef test_publish_open_close_share_preflight_and_lock_uses_roster_validation():\n    from app.modules.academic_affairs.services import academic_affairs_selection_final_service as final\n    for fn, action in [(final.publish_batch, "PUBLISH"), (final.open_batch, "OPEN"), (final.close_batch, "CLOSE"), (final.lock_batch, "LOCK")]:\n        source = inspect.getsource(fn)\n        assert f'require_batch_action(db, batch, "{action}")' in source\n\n\ndef test_admin_preflight_blocks_empty_then_allows_configured_publish(client, db_mode):\n    term_id, course_id = _seed(db_mode)\n    admin = _admin(client)\n    created = client.post(f"{BASE}/selection/batches", headers=admin, json={"batchName": "W1纯预检", "termId": str(term_id)})\n    assert created.status_code == 200, created.text\n    batch_id = created.json()["data"]["batchId"]\n\n    blocked = client.get(f"{BASE}/selection/batches/{batch_id}/preflight?action=PUBLISH", headers=admin)\n    assert blocked.status_code == 200, blocked.text\n    payload = blocked.json()["data"]\n    assert payload["allowed"] is False\n    assert "SELECTION_COURSE_EMPTY" in {item["code"] for item in payload["blockers"]}\n\n    added = client.post(f"{BASE}/selection/batches/{batch_id}/courses", headers=admin,\n                        json={"courseId": str(course_id), "capacity": 30, "minCapacity": 0})\n    assert added.status_code == 200, added.text\n    ready = client.get(f"{BASE}/selection/batches/{batch_id}/preflight?action=PUBLISH", headers=admin)\n    assert ready.status_code == 200, ready.text\n    assert ready.json()["data"]["allowed"] is True\n    assert ready.json()["data"]["allowedActions"] == ["PUBLISH"]\n\n    published = client.post(f"{BASE}/selection/batches/{batch_id}/publish", headers=admin)\n    assert published.status_code == 200, published.text\n    open_pre = client.get(f"{BASE}/selection/batches/{batch_id}/preflight?action=OPEN", headers=admin)\n    assert open_pre.status_code == 200 and open_pre.json()["data"]["allowed"] is True\n    opened = client.post(f"{BASE}/selection/batches/{batch_id}/open", headers=admin)\n    assert opened.status_code == 200, opened.text\n    close_pre = client.get(f"{BASE}/selection/batches/{batch_id}/preflight?action=CLOSE", headers=admin)\n    assert close_pre.status_code == 200 and close_pre.json()["data"]["allowed"] is True\n''', encoding='utf-8')

          Path('frontend/tests/academic-b-selection-preflight-contract.test.mjs').write_text('''import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport { readFile } from 'node:fs/promises'\n\nconst apiUrl = new URL('../src/modules/academicAffairs/api/academic-affairs.api.js', import.meta.url)\nconst viewUrl = new URL('../src/modules/academicAffairs/views/AaSelectionConsoleView.vue', import.meta.url)\n\ntest('B-W1 admin lifecycle consumes backend preflight before command', async () => {\n  const api = await readFile(apiUrl, 'utf8')\n  const view = await readFile(viewUrl, 'utf8')\n  assert.match(api, /batchPreflight\(id, action\)/)\n  assert.match(view, /await this\.refreshPreflight\(\)/)\n  assert.match(view, /if \(!checked \|\| !checked\.allowed\)/)\n  assert.match(view, /preflightMessage\(preflight\)/)\n  assert.match(view, /PUBLISH.*OPEN.*CLOSE.*LOCK/s)\n  const lifecycle = view.slice(view.indexOf('async lifecycle(fn, label)'), view.indexOf('openAddCourse()', view.indexOf('async lifecycle(fn, label)'))\n  assert.ok(lifecycle.indexOf('refreshPreflight') < lifecycle.indexOf('this.confirmTitle = label'))\n  assert.ok(lifecycle.indexOf('refreshPreflight') < lifecycle.indexOf('api[fn]'))\n})\n''', encoding='utf-8')
          PY
      - name: Install backend and migrate clean MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
      - name: W1 backend targeted contracts
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q -p no:warnings \
            tests/test_aa_selection_preflight_w1.py \
            tests/test_aa_selection_batch_preflight_w1.py \
            tests/test_stage_d_selection_trace.py \
            tests/test_aa_selection_student_guard.py \
            --maxfail=1
      - name: W1 frontend contract and production build
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/stage-d-selection-console-contract.test.mjs tests/academic-b-selection-preflight-contract.test.mjs
          npm run build
      - name: Commit validated W1 phase2 without racing branch writers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            backend/app/modules/academic_affairs/services/academic_affairs_selection_preflight_service.py \
            backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py \
            backend/app/modules/academic_affairs/routers/academic_selection_final_router.py \
            backend/tests/test_aa_selection_batch_preflight_w1.py \
