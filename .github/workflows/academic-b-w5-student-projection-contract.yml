name: Academic B W5 Student Projection Contract

on:
  push:
    branches:
      - agent/academic-b-schedule-selection
    paths:
      - backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py
      - backend/tests/test_aa_selection_student_projection_contract.py
      - .github/workflows/academic-b-w5-student-projection-contract.yml
  workflow_dispatch:

concurrency:
  group: academic-b-w5-student-projection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  projection-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Assert exact W5 contract head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted test dependency
        run: python -m pip install -q pytest
      - name: Run only B-W5 projection contract
        run: python -m pytest backend/tests/test_aa_selection_student_projection_contract.py -q
