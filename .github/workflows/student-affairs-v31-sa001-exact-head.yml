name: Student Affairs V3.1 SA-001 exact-head

on:
  push:
    branches:
      - audit/student-affairs-v31-final-runner-20260827
    paths:
      - '.github/workflows/student-affairs-v31-sa001-exact-head.yml'
      - 'audit-tests/student-affairs-leave-browser-audit.spec.mjs'
      - 'audit-tests/student-affairs-leave-browser-hardening.spec.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-affairs-v31-sa001-exact-head
  cancel-in-progress: true

env:
  PRODUCT_EXACT_SHA: 2019ca946ce2bc2c21dc9e76a8de0ce674c2d03d
  CI: 'true'
  APP_ENV: test
  DEPLOYMENT_MODE: local
  DB_ENABLED: 'true'
  DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
  TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
  DB_HOST: 127.0.0.1
  DB_PORT: '3306'
  DB_USER: root
  DB_PASSWORD: e2e_root
  DB_NAME: student_lifecycle_e2e
  REDIS_URL: redis://127.0.0.1:6379/14
  REDIS_KEY_PREFIX: student-affairs-v31-sa001
  JWT_SECRET: student-affairs-v31-sa001-only
  JWT_SECRET_KEY: student-affairs-v31-sa001-only
  PYTHONPATH: .
  MOCK_LOGIN_ENABLED: 'false'
  SMS_ENABLED: 'false'
  SCHEDULER_MODE: external
  E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
  E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
  E2E_STAFF_BASE_URL: http://127.0.0.1:5173
  E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal

jobs:
  sa001:
    name: SA-001 leave / Browser First / MySQL / audit / XLSX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout final audit runner
        uses: actions/checkout@v4
        with:
          ref: audit/student-affairs-v31-final-runner-20260827
          path: runner
          fetch-depth: 1

      - name: Checkout immutable product exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_EXACT_SHA }}
          path: app
          fetch-depth: 0

      - name: Assert immutable product exact head
        run: |
          set -euo pipefail
          ACTUAL="$(git -C app rev-parse HEAD)"
          echo "productExactSha=$ACTUAL"
          test "$ACTUAL" = "$PRODUCT_EXACT_SHA"
          test -z "$(git -C app status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/student-portal/package-lock.json

      - name: Install backend and migrate isolated MySQL
        working-directory: app/backend
        run: |
          pip install -r requirements.txt
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade head
          python scripts/bootstrap_control_plane_school_iam_authority.py
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start real backend
        run: |
          mkdir -p app/e2e/runtime-logs app/audit-evidence
          cd app/backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Bootstrap official identities and counselor scope
        working-directory: app/backend
        run: |
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py
          python scripts/e2e_bootstrap_affairs_counselor_ci.py
          python - <<'PY'
          import scripts.e2e_bootstrap_affairs_counselor_ci as ci
          from scripts.e2e_bootstrap_student_affairs_accounts import CLASS_A, CLASS_B, _req, ensure_counselor_assignment, ensure_org, list_users, login_admin

          token = login_admin()
          org = ensure_org(token)
          assert CLASS_A in org.get('classIds', {}), org
          assert CLASS_B in org.get('classIds', {}), org
          result = ensure_counselor_assignment(token, int(org['classIds'][CLASS_A]))
          assert result.get('configured') is True, result

          ci.LOGIN_NAME = 'e2e_counselor_b'
          ci.DISPLAY_NAME = 'E2E辅导员B'
          ci.CLASS = CLASS_B
          def import_counselor_b(token: str) -> None:
              receipt = ci._canonical_import(token, kind='teachers', content=ci.build_counselor_xlsx(), idempotency_namespace='e2e-affairs-counselor-b')
              print('[SA-001] counselor-b import', receipt.get('id') or receipt.get('jobId') or 'confirmed')
          ci.import_counselor = import_counselor_b
          assert ci.main() == 0

          token = login_admin()
          org = ensure_org(token)
          users = list_users(token)
          counselor_b = users.get('e2e_counselor_b')
          assert counselor_b, users.keys()
          class_b_id = int(org['classIds'][CLASS_B])
          listed = _req('GET', '/student-affairs/counselor-assignments', token=token, params={'classId': class_b_id, 'pageSize': 100})
          items = ((listed.get('data') or {}).get('items') or [])
          active = next((x for x in items if x.get('status') == 'ACTIVE' and x.get('dutyType') == 'PRIMARY' and int(x.get('userId') or 0) == int(counselor_b['id'])), None)
          if not active:
              created = _req('POST', '/student-affairs/counselor-assignments', token=token, body={'classId': class_b_id, 'userId': int(counselor_b['id']), 'dutyType': 'PRIMARY', 'reason': 'SA-001 V3.1 wrong-counselor scope baseline'})
              assert created.get('code') == 0, created
          PY

      - name: Start official scheduler and real PC apps
        run: |
          cd app/backend
          nohup python scripts/run_scheduled_jobs.py > ../e2e/runtime-logs/scheduler.log 2>&1 &
          cd ../frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          cd ../student-portal
          npm ci
          VITE_BASE=/portal/ VITE_API_BASE_URL=/ VITE_PROXY_TARGET=http://127.0.0.1:8000 nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-portal.log 2>&1 &

      - name: Wait for real browser applications
        run: |
          for url in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login; do
            ok=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "Application not ready: $url"
              cat app/e2e/runtime-logs/*.log
              exit 1
            fi
          done

      - name: Install Chromium and inject SA-001 specs outside product commit
        run: |
          cp runner/audit-tests/student-affairs-leave-browser-audit.spec.mjs app/e2e/specs/student-affairs-leave-browser-audit.spec.mjs
          cp runner/audit-tests/student-affairs-leave-browser-hardening.spec.mjs app/e2e/specs/student-affairs-leave-browser-hardening.spec.mjs
          cd app/e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Run SA-001 Browser First journey
        working-directory: app/e2e
        run: npx playwright test specs/student-affairs-leave-browser-audit.spec.mjs

      - name: Verify SA-001 MySQL and append-only audit chain
        working-directory: app/backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pymysql
          evidence = json.loads(Path('../e2e/student-affairs-audit-evidence.json').read_text(encoding='utf-8'))
          leave_id = int(evidence['leaveId'])
          conn = pymysql.connect(host='127.0.0.1', port=3306, user='root', password='e2e_root', database='student_lifecycle_e2e', charset='utf8mb4')
          with conn.cursor() as cur:
              cur.execute('SELECT affairs_status,status,version,reason FROM t_cs_leave WHERE id=%s', (leave_id,))
              row = cur.fetchone()
              assert row and row[0] == 'CLOSED' and row[1] == 'APPROVED' and int(row[2]) >= 5, row
              assert row[3] == evidence['revisedReason'], (row, evidence)
              cur.execute("SELECT action FROM t_affairs_audit_trail WHERE biz_type='LEAVE' AND biz_id=%s ORDER BY id", (leave_id,))
              actions = [str(x[0]).upper() for x in cur.fetchall()]
              assert any('RETURN' in x for x in actions), actions
              assert any('RESUBMIT' in x for x in actions), actions
              assert any('APPROV' in x for x in actions), actions
              assert any('CANCEL' in x or 'CLOSE' in x for x in actions), actions
          conn.close()
          print('[SA-001 EVIDENCE]', json.dumps(evidence, ensure_ascii=False))
          PY

      - name: Run SA-001 permission attacks and real XLSX journey
        working-directory: app/e2e
        run: npx playwright test specs/student-affairs-leave-browser-hardening.spec.mjs

      - name: Verify downloaded XLSX and hardening persistence
        working-directory: app/backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pymysql
          from openpyxl import load_workbook
          main = json.loads(Path('../e2e/student-affairs-audit-evidence.json').read_text(encoding='utf-8'))
          hard = json.loads(Path('../e2e/student-affairs-leave-hardening-evidence.json').read_text(encoding='utf-8'))
          main_id = int(hard['mainLeaveId'])
          scope_id = int(hard['scopeLeaveId'])
          job_id = str(hard['exportJobId'])
          conn = pymysql.connect(host='127.0.0.1', port=3306, user='root', password='e2e_root', database='student_lifecycle_e2e', charset='utf8mb4')
          with conn.cursor() as cur:
              cur.execute('SELECT affairs_status,version,reason FROM t_cs_leave WHERE id=%s', (main_id,))
              row = cur.fetchone(); assert row and row[0] == 'CLOSED', row
              assert int(row[1]) == int(hard['mainVersionBefore']) == int(hard['mainVersionAfter']), (row, hard)
              assert row[2] == main['revisedReason'], row
              cur.execute('SELECT affairs_status,reason FROM t_cs_leave WHERE id=%s', (scope_id,))
              scope = cur.fetchone(); assert scope and scope[0] == 'REJECTED' and scope[1] == hard['scopeReason'], scope
              cur.execute("SELECT action FROM t_affairs_audit_trail WHERE action='EXPORT_REQUESTED' AND detail LIKE %s", (f'%jobId={job_id}%',))
              assert cur.fetchall(), job_id
          conn.close()
          xlsx = Path('../e2e/student-affairs-leave-ledger.xlsx')
          assert xlsx.exists() and xlsx.stat().st_size > 1000, xlsx
          wb = load_workbook(xlsx, read_only=True, data_only=True)
          assert wb.active.max_row >= 2
          print('[SA-001 XLSX]', xlsx, wb.active.max_row, wb.active.max_column)
          PY

      - name: Write exact-head closure marker
        if: success()
        run: |
          cat > app/audit-evidence/v3-closure-sa-001.json <<JSON
          {
            "code": "SA-001",
            "productExactSha": "$PRODUCT_EXACT_SHA",
            "browserFirst": true,
            "status": "REAL_PASS_CANDIDATE",
            "evidence": {
              "browserJourney": true,
              "permissionNegative": true,
              "mysqlTruth": true,
              "appendOnlyAudit": true,
              "xlsxOpened": true
            },
            "workflowRun": "$GITHUB_RUN_ID"
          }
          JSON

      - name: Upload SA-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-affairs-v31-sa001-${{ env.PRODUCT_EXACT_SHA }}
          path: |
            app/audit-evidence
            app/e2e/student-affairs-*-evidence.json
            app/e2e/student-affairs-leave-ledger.xlsx
            app/e2e/test-results
            app/e2e/playwright-report
            app/e2e/runtime-logs
          if-no-files-found: warn
          retention-days: 14
