name: Audit Academic H5 SameSite R3 20260823

on:
  push:
    branches:
      - audit/academic-real-browser-20260823
    paths:
      - '.github/workflows/audit-academic-iam-fix-r2-20260823.yml'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: penghaibin9/saas
      FIX_REF: fix/academic-e2e-school-iam-bootstrap-20260823
      FIX_SHA: 8425a6b03186aae0b110e1de4646b7ccb6416c47
      AUDITED_SHA: 1c69336ea0728c5c6713c0c85b7275b06fca9ae1
      ARCHIVE_REPAIR_SHA: 843bb02f93b52412e29f37b7e1a938ef6a96be05
    steps:
      - name: Assert exact repair tip and ancestry
        run: |
          set -euo pipefail
          actual="$(gh api repos/$REPO/git/ref/heads/$FIX_REF --jq .object.sha)"
          test "$actual" = "$FIX_SHA"
          gh api repos/$REPO/compare/$AUDITED_SHA...$FIX_SHA --jq '.status' | grep -qx ahead
          gh api repos/$REPO/compare/$ARCHIVE_REPAIR_SHA...$FIX_SHA --jq '.status' | grep -Eq '^(ahead|identical)$'

      - name: Dispatch exact-head Teacher and Student browser gates
        run: |
          set -euo pipefail
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          : > /tmp/runs.tsv
          for wf in academic-c-w2-teacher-today-browser.yml academic-b-w5-student-projection-real-click.yml; do
            gh workflow run "$wf" --repo "$REPO" --ref "$FIX_REF"
            id=''
            for _ in {1..60}; do
              id="$(gh run list --repo "$REPO" --workflow "$wf" --branch "$FIX_REF" --event workflow_dispatch --limit 30 --json databaseId,headSha,createdAt --jq ".[] | select(.headSha == \"$FIX_SHA\" and .createdAt >= \"$start\") | .databaseId" | head -n1)"
              [ -n "$id" ] && break
              sleep 2
            done
            echo "$wf|${id:-MISSING}" >> /tmp/runs.tsv
          done
          cat /tmp/runs.tsv

      - name: Wait and publish R3 evidence
        if: always()
        run: |
          set +e
          {
            echo '## H5 SameSite R3 exact-head 真实浏览器复验'
            echo
            echo "Audited product base: \`$AUDITED_SHA\`"
            echo "Repair exact HEAD: \`$FIX_SHA\`"
            echo 'Security invariant: SameSite=Strict unchanged; only test H5/API host topology aligned.'
            echo
            echo '| Workflow | Run | Conclusion | Head | URL |'
            echo '|---|---:|---|---|---|'
          } > /tmp/result.md
          overall=0
          if [ ! -s /tmp/runs.tsv ]; then overall=1; fi
          while IFS='|' read -r wf id; do
            if [ "$id" = MISSING ]; then
              echo "| $wf | - | MISSING | - | - |" >> /tmp/result.md
              overall=1
              continue
            fi
            gh run watch "$id" --repo "$REPO" --exit-status >/tmp/watch-$id.log 2>&1
            rc=$?
            row="$(gh run view "$id" --repo "$REPO" --json conclusion,status,headSha,url --jq '[.conclusion,.status,.headSha,.url] | @tsv')"
            co="$(printf '%s' "$row" | cut -f1)"; st="$(printf '%s' "$row" | cut -f2)"; hd="$(printf '%s' "$row" | cut -f3)"; url="$(printf '%s' "$row" | cut -f4)"
            state="${co:-$st}"
            [ "$rc" -eq 0 ] && [ "$state" = success ] || overall=1
            echo "| $wf | $id | $state | \`$hd\` | $url |" >> /tmp/result.md
          done < /tmp/runs.tsv
          gh issue comment 205 --repo "$REPO" --body-file /tmp/result.md
          cat /tmp/result.md
          exit "$overall"
