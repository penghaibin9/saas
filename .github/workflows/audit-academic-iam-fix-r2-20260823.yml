name: Audit Academic H5 SameSite R3 20260823

on:
  push:
    branches:
      - audit/academic-real-browser-20260823
    paths:
      - '.github/workflows/audit-academic-iam-fix-r2-20260823.yml'

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  patch-rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: penghaibin9/saas
      FIX_REF: fix/academic-e2e-school-iam-bootstrap-20260823
      AUDITED_SHA: 1c69336ea0728c5c6713c0c85b7275b06fca9ae1
      ARCHIVE_REPAIR_SHA: 843bb02f93b52412e29f37b7e1a938ef6a96be05
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FIX_REF }}
          fetch-depth: 0

      - name: Assert safe repair ancestry and scope
        id: base
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          echo "current_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor "$AUDITED_SHA" HEAD
          git merge-base --is-ancestor "$ARCHIVE_REPAIR_SHA" HEAD
          files="$(git diff --name-only "$AUDITED_SHA"...HEAD)"
          printf '%s\n' "$files"
          printf '%s\n' "$files" | while read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/academic-b-w3-schedule-real-click.yml|\
              .github/workflows/academic-b-w4-selection-real-click.yml|\
              .github/workflows/academic-c-w2-teacher-today-browser.yml|\
              .github/workflows/academic-b-w5-student-projection-real-click.yml|\
              .github/workflows/audit-academic-h5-samesite-fix-20260823.yml|\
              backend/scripts/bootstrap_control_plane_school_iam_authority.py|\
              backend/app/modules/academic_affairs/services/academic_affairs_archive_core_service.py|\
              backend/app/modules/academic_affairs/services/academic_affairs_archive_manifest_service.py|\
              backend/app/modules/academic_affairs/services/academic_affairs_archive_correction_review_service.py|\
              backend/tests/test_stage_c3_correction_end_to_end.py|\
              backend/tests/test_stage_c3_correction_reject.py) ;;
              *) echo "Unexpected repair-scope file: $f"; exit 1 ;;
            esac
          done

      - name: Keep H5 browser refresh same-site without weakening cookies
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          targets = [
              Path('.github/workflows/academic-c-w2-teacher-today-browser.yml'),
              Path('.github/workflows/academic-b-w5-student-projection-real-click.yml'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              pairs = [
                  ('E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1', 'E2E_API_BASE_URL: http://localhost:8000/api/v1'),
                  ('VITE_API_BASE_URL: http://127.0.0.1:8000', 'VITE_API_BASE_URL: http://localhost:8000'),
              ]
              for old, new in pairs:
                  if text.count(old) != 1 or text.count(new) != 0:
                      raise SystemExit(f'{path}: unsafe replacement state for {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = 2
          grep -q 'E2E_MINIAPP_BASE_URL: http://localhost:5188' .github/workflows/academic-c-w2-teacher-today-browser.yml
          grep -q 'E2E_MINIAPP_BASE_URL: http://localhost:5188' .github/workflows/academic-b-w5-student-projection-real-click.yml
          grep -q 'E2E_API_BASE_URL: http://localhost:8000/api/v1' .github/workflows/academic-c-w2-teacher-today-browser.yml
          grep -q 'E2E_API_BASE_URL: http://localhost:8000/api/v1' .github/workflows/academic-b-w5-student-projection-real-click.yml

      - name: Commit harness-only origin alignment
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/academic-c-w2-teacher-today-browser.yml .github/workflows/academic-b-w5-student-projection-real-click.yml
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 2
          git commit -m 'test(academic): keep H5 refresh E2E same-site'
          git push origin HEAD:"$FIX_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch Teacher and Student real browser reruns
        env:
          FIX_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          : > /tmp/runs.tsv
          for wf in academic-c-w2-teacher-today-browser.yml academic-b-w5-student-projection-real-click.yml; do
            gh workflow run "$wf" --repo "$REPO" --ref "$FIX_REF"
            id=''
            for _ in {1..50}; do
              id="$(gh run list --repo "$REPO" --workflow "$wf" --branch "$FIX_REF" --event workflow_dispatch --limit 30 --json databaseId,headSha,createdAt --jq ".[] | select(.headSha == \"$FIX_SHA\" and .createdAt >= \"$start\") | .databaseId" | head -n1)"
              [ -n "$id" ] && break
              sleep 2
            done
            echo "$wf|${id:-MISSING}" >> /tmp/runs.tsv
          done
          cat /tmp/runs.tsv

      - name: Wait and publish evidence
        if: always()
        env:
          FIX_SHA: ${{ steps.commit.outputs.sha }}
          START_SHA: ${{ steps.base.outputs.current_sha }}
        run: |
          set +e
          {
            echo '## H5 SameSite R3 真实浏览器复验'
            echo
            echo "Audited product base: \`$AUDITED_SHA\`"
            echo "Repair start SHA: \`${START_SHA:-MISSING}\`"
            echo "Repair result SHA: \`${FIX_SHA:-MISSING}\`"
            echo 'Security invariant: backend SameSite=Strict unchanged; only E2E host topology aligned.'
            echo
            echo '| Workflow | Run | Conclusion | Head | URL |'
            echo '|---|---:|---|---|---|'
          } > /tmp/result.md
          overall=0
          if [ ! -s /tmp/runs.tsv ]; then overall=1; fi
          while IFS='|' read -r wf id; do
            if [ "$id" = MISSING ]; then
              echo "| $wf | - | MISSING | - | - |" >> /tmp/result.md
              overall=1
              continue
            fi
            gh run watch "$id" --repo "$REPO" --exit-status >/tmp/watch-$id.log 2>&1
            rc=$?
            row="$(gh run view "$id" --repo "$REPO" --json conclusion,status,headSha,url --jq '[.conclusion,.status,.headSha,.url] | @tsv')"
            co="$(printf '%s' "$row" | cut -f1)"; st="$(printf '%s' "$row" | cut -f2)"; hd="$(printf '%s' "$row" | cut -f3)"; url="$(printf '%s' "$row" | cut -f4)"
            state="${co:-$st}"
            [ "$rc" -eq 0 ] && [ "$state" = success ] || overall=1
            echo "| $wf | $id | $state | \`$hd\` | $url |" >> /tmp/result.md
          done < /tmp/runs.tsv
          gh issue comment 205 --repo "$REPO" --body-file /tmp/result.md
          cat /tmp/result.md
          exit "$overall"
