name: Graduation Material Closeout Apply

on:
  push:
    branches:
      - fix/graduation-material-closeout-p0-review
    paths:
      - .github/workflows/graduation-material-closeout-apply.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: graduation-material-closeout-apply
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/graduation-material-closeout-p0-review' || github.ref_name == 'fix/graduation-material-closeout-p0-review'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      PYTHONUNBUFFERED: "1"
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graduation-material-closeout-p0-review
          fetch-depth: 0

      - name: Diagnose inherited conftest encoding corruption
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/tests/conftest.py')
          data = p.read_bytes()
          print('bytes=', len(data), 'nul_count=', data.count(b'\x00'))
          for bom in (b'\xff\xfe', b'\xfe\xff', b'\xef\xbb\xbf'):
              positions = [i for i in range(len(data)) if data.startswith(bom, i)]
              print('bom', bom.hex(), positions[:20], 'count=', len(positions))
          nul = [i for i, b in enumerate(data) if b == 0]
          print('nul_first=', nul[:40], 'nul_last=', nul[-40:])
          try:
              data.decode('utf-8')
              print('utf8=strict-ok')
          except UnicodeDecodeError as exc:
              print('utf8_error=', exc.start, exc.end, exc.reason)
              lo, hi = max(0, exc.start - 120), min(len(data), exc.end + 240)
              print('hex_context=', data[lo:hi].hex())
              print('replace_context=', data[lo:hi].decode('utf-8', errors='replace'))
          PY

      - name: Apply audited graduation material fixes
        run: |
          set -euo pipefail
          python scripts/apply_graduation_material_closeout_fix.py
          python scripts/patch_graduation_phase6_contract.py
          git diff --check
          python -m compileall -q \
            backend/app/api/v1/mobile_graduation_material_center.py \
            backend/app/core/graduation_permissions.py \
            backend/app/modules/graduation/materials \
            backend/app/modules/graduation/routers/graduation_material_center.py \
            backend/app/modules/graduation/routers/graduation_material_sensitive_router.py \
            backend/tests/test_graduation_material_closeout_regressions.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography

      - name: Run graduation material regression tests
        working-directory: backend
        run: |
          pytest -q \
            tests/test_graduation_material_closeout_regressions.py \
            tests/test_graduation_material_center_phase6.py

      - name: Commit validated fixes to repair branch
        run: |
          set -euo pipefail
          rm -f \
            scripts/apply_graduation_material_closeout_fix.py \
            scripts/patch_graduation_phase6_contract.py \
            .github/workflows/graduation-material-closeout-apply.yml
          git config user.name "graduation-closeout-bot"
          git config user.email "graduation-closeout-bot@users.noreply.github.com"
          git add -- \
            backend/app/api/v1/mobile_graduation_material_center.py \
            backend/app/core/graduation_permissions.py \
            backend/app/modules/graduation/materials/command_service.py \
            backend/app/modules/graduation/materials/export_service.py \
            backend/app/modules/graduation/materials/query_service.py \
            backend/app/modules/graduation/materials/rule_service.py \
            backend/app/modules/graduation/materials/snapshot_service.py \
            backend/app/modules/graduation/routers/graduation_material_center.py \
            backend/app/modules/graduation/routers/graduation_material_sensitive_router.py \
            backend/tests/test_graduation_material_center_phase6.py \
            backend/tests/test_graduation_material_closeout_regressions.py \
            frontend/src/modules/graduation/api/graduation-material-center.api.js \
            student-portal/src/views/graduation/GraduationWorkbenchView.vue \
            miniapp/src/pages/student/graduation/index.vue \
            scripts/apply_graduation_material_closeout_fix.py \
            scripts/patch_graduation_phase6_contract.py \
            .github/workflows/graduation-material-closeout-apply.yml
          git diff --cached --check
          git commit -m "fix(graduation): close material security and archive regressions"
          git push origin HEAD:fix/graduation-material-closeout-p0-review
