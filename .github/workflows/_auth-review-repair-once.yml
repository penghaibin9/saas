name: Auth review repair once

on:
  push:
    branches: ["feat/adaptive-login-captcha-20260805"]
    paths:
      - ".github/workflows/_auth-review-repair-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-login-captcha-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply reviewed fixes
        run: python scripts/_auth_review_repair_once.py
      - name: Validate repaired files
        run: |
          cd student-portal
          npm ci
          npm test
          npm run lint
          cd ..
          python -m py_compile backend/scripts/_seed_login_accounts_only.py scripts/e2e/auth_login_redis_click.py
          git diff --check
      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-portal/src/services/request.js student-portal/tests/auth-error-details.test.mjs backend/scripts/_seed_login_accounts_only.py scripts/e2e/auth_login_redis_click.py .github/workflows/auth-login-redis-e2e.yml .github/workflows/_auth-review-repair-once.yml scripts/_auth_review_repair_once.py
          git commit -m "fix(auth): preserve captcha errors and expand login E2E"
          git push origin HEAD:feat/adaptive-login-captcha-20260805
