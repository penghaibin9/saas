name: Auth review repair once

on:
  push:
    branches: ["feat/adaptive-login-captcha-20260805"]
    paths:
      - ".github/workflows/_auth-review-repair-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-login-captcha-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply reviewed fixes and broaden E2E coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          request_path = Path('student-portal/src/services/request.js')
          text = request_path.read_text(encoding='utf-8')
          old = """function authError(message = '登录已失效，请重新登录') {
            const e = new Error(message)
            e.status = 401
            e.code = 401001
            e.biz = true
            return e
          }"""
          new = """function authError(message = '登录已失效，请重新登录', payload = null, status = 401) {
            const e = new Error(message)
            e.status = status
            e.code = 401001
            e.biz = true
            if (payload && typeof payload === 'object') {
              e.bizCode = payload.bizCode
              e.details = payload.details
              e.traceId = payload.traceId
            }
            return e
          }"""
          if old not in text:
              raise SystemExit('authError target not found')
          text = text.replace(old, new, 1)
          old = """  if (isUnauthorized(res, payload)) {
            if (auth && !_retried && !path.startsWith('/auth/')) {
              await refreshOnce()
              return request(path, { method, body, auth, params, query, _retried: true })
            }
            clearSession()
            throw authError((payload && payload.message) || undefined)
          }"""
          new = """  if (isUnauthorized(res, payload)) {
            if (auth && !_retried && !path.startsWith('/auth/')) {
              await refreshOnce()
              return request(path, { method, body, auth, params, query, _retried: true })
            }
            if (auth) clearSession()
            throw authError((payload && payload.message) || undefined, payload, res.status)
          }"""
          if old not in text:
              raise SystemExit('401 target not found')
          request_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('student-portal/tests/auth-error-details.test.mjs')
          test_path.write_text("""import test from 'node:test'\nimport assert from 'node:assert/strict'\n\ntest('public login 401 preserves captcha bizCode and details', async () => {\n  const previousFetch = globalThis.fetch\n  globalThis.fetch = async () => ({\n    status: 401,\n    json: async () => ({\n      code: 401001,\n      bizCode: 'CAPTCHA_REQUIRED',\n      message: '请输入验证码',\n      details: { captchaRequired: true, scene: 'PASSWORD_LOGIN' },\n      traceId: 'trace-captcha'\n    })\n  })\n  try {\n    const mod = await import(`../src/services/request.js?captcha-test=${Date.now()}`)\n    await assert.rejects(\n      () => mod.request('/auth/login', { method: 'POST', auth: false, body: { loginName: 'student' } }),\n      (error) => {\n        assert.equal(error.code, 401001)\n        assert.equal(error.bizCode, 'CAPTCHA_REQUIRED')\n        assert.deepEqual(error.details, { captchaRequired: true, scene: 'PASSWORD_LOGIN' })\n        assert.equal(error.traceId, 'trace-captcha')\n        return true\n      }\n    )\n  } finally {\n    globalThis.fetch = previousFetch\n  }\n})\n""", encoding='utf-8')

          seed_path = Path('backend/scripts/_seed_login_accounts_only.py')
          seed = seed_path.read_text(encoding='utf-8')
          marker = 'DEMO_TID = 1000000000000000003\n'
          insert = ('PLATFORM_TID = 1000000000000000001\n'
                    'PLATFORM_CODE = "platform"\n'
                    'PLATFORM_NAME = "跃科 SaaS 运营平台"\n'
                    'PLATFORM_SHORT_NAME = "运营平台"\n'
                    + marker)
          if 'PLATFORM_TID = ' not in seed:
              if marker not in seed:
                  raise SystemExit('seed constants target not found')
              seed = seed.replace(marker, insert, 1)
          accounts_marker = 'ACCOUNTS = [\n'
          platform_account = ('ACCOUNTS = [\n'
                              '    (PLATFORM_TID, PLATFORM_CODE, PLATFORM_NAME, PLATFORM_SHORT_NAME, '
                              '"platform_admin", "平台管理员", "PLATFORM_SUPER_ADMIN"),\n')
          if '"platform_admin"' not in seed:
              if accounts_marker not in seed:
                  raise SystemExit('accounts target not found')
              seed = seed.replace(accounts_marker, platform_account, 1)
          seed_path.write_text(seed, encoding='utf-8')

          e2e = r'''"""真实浏览器登录验收：四端页面 → FastAPI → MySQL → Redis 验证码单次消费。"""
          from __future__ import annotations

          import json
          import os
          import traceback
          from pathlib import Path

          import redis
          from playwright.sync_api import Page, expect, sync_playwright

          BASE_URL = os.environ.get("E2E_BASE_URL", "http://127.0.0.1:5173").rstrip("/")
          STUDENT_BASE_URL = os.environ.get("E2E_STUDENT_BASE_URL", "http://127.0.0.1:5199").rstrip("/")
          MINI_BASE_URL = os.environ.get("E2E_MINI_BASE_URL", "http://127.0.0.1:5200").rstrip("/")
          REDIS_URL = os.environ.get("REDIS_URL", "redis://127.0.0.1:6379/15")
          ARTIFACT_DIR = Path(os.environ.get("E2E_ARTIFACT_DIR", "artifacts/auth-login-e2e"))
          ARTIFACT_DIR.mkdir(parents=True, exist_ok=True)


          def _login_response(response) -> bool:
              return response.request.method == "POST" and response.url.endswith("/api/v1/auth/login")


          def _captcha_response(response) -> bool:
              return response.request.method == "POST" and response.url.endswith("/api/v1/auth/captcha")


          def _payload(response) -> dict:
              value = response.json()
              if not isinstance(value, dict) or "code" not in value:
                  raise AssertionError(f"接口响应结构异常：{value!r}")
              return value


          def _click_login(page: Page, button_name: str) -> dict:
              with page.expect_response(_login_response, timeout=15_000) as info:
                  page.get_by_text(button_name, exact=True).click()
              return _payload(info.value)


          def _captcha_from_refresh(page: Page, trigger, redis_client) -> tuple[str, str]:
              with page.expect_response(_captcha_response, timeout=15_000) as info:
                  trigger.click()
              payload = _payload(info.value)
              data = payload.get("data")
              if not isinstance(data, dict):
                  raise AssertionError(f"验证码接口 data 异常：{payload!r}")
              captcha_id = str(data.get("captchaId") or "")
              captcha_code = str(data.get("devCode") or "")
              if not captcha_id or len(captcha_code) != 6 or not captcha_code.isdigit():
                  raise AssertionError("测试环境未返回 6 位 devCode")
              keys = list(redis_client.scan_iter(match=f"*auth:captcha:{captcha_id}"))
              if len(keys) != 1:
                  raise AssertionError(f"验证码提交前 Redis 应恰有 1 个挑战键，实际 {keys!r}")
              return captcha_id, captcha_code


          def _assert_consumed(redis_client, captcha_id: str) -> None:
              if list(redis_client.scan_iter(match=f"*auth:captcha:{captcha_id}")):
                  raise AssertionError("验证码提交后仍存在于 Redis，未完成单次消费")


          def _teacher_pc(browser, redis_client) -> dict:
              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              page.goto(f"{BASE_URL}/login", wait_until="networkidle", timeout=30_000)
              expect(page.get_by_role("heading", name="教师 / 管理人员登录")).to_be_visible()
              page.get_by_text("切换学校或填写学校编码", exact=True).click()
              page.locator("#staff-tenant").fill("demo-school")
              page.locator("#staff-account").fill("admin")
              page.locator("#staff-password").fill("wrong-password")
              page.get_by_label("我已阅读并同意学校提供的用户协议与隐私政策").check()
              wrong = []
              for _ in range(2):
                  payload = _click_login(page, "进入教师工作台")
                  if payload.get("code") == 0:
                      raise AssertionError("错误密码被意外接受")
                  wrong.append(payload.get("bizCode"))
                  expect(page.get_by_role("alert")).to_be_visible()
              captcha_input = page.locator("#login-captcha")
              expect(captcha_input).to_be_visible(timeout=10_000)
              captcha_id, code = _captcha_from_refresh(page, page.locator('button[title="点击换一张"]'), redis_client)
              captcha_input.fill(code)
              page.locator("#staff-password").fill("123456")
              payload = _click_login(page, "进入教师工作台")
              if payload.get("code") != 0:
                  raise AssertionError(f"教师/管理 PC 登录失败：{payload!r}")
              page.wait_for_url("**/workbench**", timeout=15_000)
              token = page.evaluate("sessionStorage.getItem('gx_pc_token_v1') || ''")
              if not token or token.count(".") != 2:
                  raise AssertionError("教师/管理 PC 未写入 access token")
              _assert_consumed(redis_client, captcha_id)
              page.screenshot(path=str(ARTIFACT_DIR / "teacher-pc-success.png"), full_page=True)
              page.close()
              return {"ok": True, "wrongAttemptBizCodes": wrong}


          def _platform_pc(browser, redis_client) -> dict:
              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              page.goto(f"{BASE_URL}/platform-login", wait_until="networkidle", timeout=30_000)
              expect(page.get_by_role("heading", name="进入 SaaS 运营平台")).to_be_visible()
              page.locator('input[autocomplete="username"]').fill("platform_admin")
              page.locator('input[autocomplete="username"]').press("Tab")
              expect(page.locator("#platform-captcha")).to_be_visible(timeout=10_000)
              page.locator('input[autocomplete="current-password"]').fill("123456")
              captcha_id, code = _captcha_from_refresh(page, page.locator('button[title="点击换一张"]'), redis_client)
              page.locator("#platform-captcha").fill(code)
              payload = _click_login(page, "登录运营平台")
              if payload.get("code") != 0:
                  raise AssertionError(f"平台 PC 登录失败：{payload!r}")
              page.wait_for_url("**/admin/platform/overview**", timeout=15_000)
              token = page.evaluate("sessionStorage.getItem('gx_pc_token_v1') || ''")
              if not token or token.count(".") != 2:
                  raise AssertionError("平台 PC 未写入 access token")
              _assert_consumed(redis_client, captcha_id)
              page.screenshot(path=str(ARTIFACT_DIR / "platform-pc-success.png"), full_page=True)
              page.close()
              return {"ok": True}


          def _student_pc(browser, redis_client) -> dict:
              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              page.goto(f"{STUDENT_BASE_URL}/portal/login", wait_until="networkidle", timeout=30_000)
              expect(page.get_by_role("heading", name="学生登录")).to_be_visible()
              page.locator("#student-account").fill("student")
              page.locator("#student-password").fill("wrong-password")
              page.get_by_text("切换学校或填写学校编码", exact=True).click()
              page.locator("#student-tenant").fill("demo-school")
              page.get_by_label("我已阅读并同意学校提供的用户协议与隐私政策").check()
              wrong = []
              for _ in range(2):
                  payload = _click_login(page, "进入学生服务门户")
                  if payload.get("code") == 0:
                      raise AssertionError("学生 PC 错误密码被接受")
                  wrong.append(payload.get("bizCode"))
              captcha_input = page.locator("#student-login-captcha")
              expect(captcha_input).to_be_visible(timeout=10_000)
              captcha_id, code = _captcha_from_refresh(page, page.locator('button[title="点击换一张"]'), redis_client)
              captcha_input.fill(code)
              page.locator("#student-password").fill("123456")
              payload = _click_login(page, "进入学生服务门户")
              if payload.get("code") != 0:
                  raise AssertionError(f"学生 PC 登录失败：{payload!r}")
              page.wait_for_url("**/portal/home**", timeout=20_000)
              token = page.evaluate("localStorage.getItem('sp_token_v1') || ''")
              if not token or token.count(".") != 2:
                  raise AssertionError("学生 PC 未写入 access token")
              _assert_consumed(redis_client, captcha_id)
              page.screenshot(path=str(ARTIFACT_DIR / "student-pc-success.png"), full_page=True)
              page.close()
              return {"ok": True, "wrongAttemptBizCodes": wrong}


          def _mini_h5(browser, redis_client, entry: str, account: str, button_text: str, expected_path: str) -> dict:
              page = browser.new_page(viewport={"width": 430, "height": 920})
              page.goto(f"{MINI_BASE_URL}/#/pages/login/{entry}/index", wait_until="networkidle", timeout=40_000)
              heading = "教师端登录" if entry == "teacher" else "学生端登录"
              expect(page.get_by_text(heading, exact=True)).to_be_visible(timeout=15_000)
              fields = page.locator("input")
              if fields.count() < 2:
                  raise AssertionError(f"{heading} 未找到账号密码输入框")
              fields.nth(0).fill(account)
              fields.nth(1).fill("wrong-password")
              page.locator(".agreement__box").click()
              wrong = []
              for _ in range(2):
                  payload = _click_login(page, button_text)
                  if payload.get("code") == 0:
                      raise AssertionError(f"{heading} 错误密码被接受")
                  wrong.append(payload.get("bizCode"))
              expect(page.locator(".captcha-row")).to_be_visible(timeout=10_000)
              captcha_id, code = _captcha_from_refresh(page, page.locator(".captcha-row__image"), redis_client)
              captcha_input = page.locator(".captcha-row__input input")
              if captcha_input.count() == 0:
                  captcha_input = page.locator("input.captcha-row__input")
              captcha_input.fill(code)
              fields.nth(1).fill("123456")
              payload = _click_login(page, button_text)
              if payload.get("code") != 0:
                  raise AssertionError(f"{heading} 登录失败：{payload!r}")
              page.wait_for_url(f"**{expected_path}**", timeout=25_000)
              _assert_consumed(redis_client, captcha_id)
              page.screenshot(path=str(ARTIFACT_DIR / f"mini-{entry}-success.png"), full_page=True)
              page.close()
              return {"ok": True, "wrongAttemptBizCodes": wrong}


          def run() -> dict:
              redis_client = redis.Redis.from_url(REDIS_URL, decode_responses=True)
              if redis_client.ping() is not True:
                  raise AssertionError("Redis PING 失败")
              result = {}
              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch(headless=True)
                  try:
                      result["teacherPc"] = _teacher_pc(browser, redis_client)
                      result["platformPc"] = _platform_pc(browser, redis_client)
                      result["studentPc"] = _student_pc(browser, redis_client)
                      result["studentMiniH5"] = _mini_h5(browser, redis_client, "student", "student", "进入学生首页", "pages/student/home/index")
                      result["teacherMiniH5"] = _mini_h5(browser, redis_client, "teacher", "teacher", "进入教师工作台", "pages/teacher/workbench/index")
                  except Exception:
                      (ARTIFACT_DIR / "traceback.txt").write_text(traceback.format_exc(), encoding="utf-8")
                      raise
                  finally:
                      browser.close()
                      redis_client.close()
              result["ok"] = all(item.get("ok") for item in result.values() if isinstance(item, dict))
              (ARTIFACT_DIR / "result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
              return result


          if __name__ == "__main__":
              print(json.dumps(run(), ensure_ascii=False, indent=2))
          '''
          # The raw literal above is indented by the workflow heredoc; normalize it.
          import textwrap
          Path('scripts/e2e/auth_login_redis_click.py').write_text(textwrap.dedent(e2e), encoding='utf-8')

          workflow = r'''name: Auth Login Redis E2E

          on:
            push:
              branches: ["**"]
              paths:
                - "backend/app/api/v1/auth.py"
                - "backend/app/services/auth_challenge_service.py"
                - "backend/app/services/auth_service_db.py"
                - "backend/app/core/redis_client.py"
                - "backend/app/core/token_store.py"
                - "backend/scripts/check_production_redis.py"
                - "backend/scripts/_seed_login_accounts_only.py"
                - "backend/tests/test_auth_challenge_service.py"
                - "backend/tests/test_auth_captcha_redis_fail_closed.py"
                - "frontend/src/views/LoginView.vue"
                - "frontend/src/views/PlatformLoginView.vue"
                - "frontend/src/components/auth/LoginCaptcha.vue"
                - "frontend/src/services/http/client.js"
                - "student-portal/src/views/login/LoginView.vue"
                - "student-portal/src/services/request.js"
                - "student-portal/tests/auth-error-details.test.mjs"
                - "miniapp/src/components/login/MiniLoginAuthPanel.vue"
                - "miniapp/src/services/request.js"
                - "scripts/e2e/auth_login_redis_click.py"
                - "deploy/auth-redis.production.env.example"
                - "deploy/start-backend-production.sh"
                - ".github/workflows/auth-login-redis-e2e.yml"
            pull_request:
              branches: ["**"]
              paths:
                - "backend/app/api/v1/auth.py"
                - "backend/app/services/auth_challenge_service.py"
                - "backend/app/services/auth_service_db.py"
                - "backend/app/core/redis_client.py"
                - "backend/app/core/token_store.py"
                - "backend/scripts/check_production_redis.py"
                - "backend/scripts/_seed_login_accounts_only.py"
                - "backend/tests/test_auth_challenge_service.py"
                - "backend/tests/test_auth_captcha_redis_fail_closed.py"
                - "frontend/src/views/LoginView.vue"
                - "frontend/src/views/PlatformLoginView.vue"
                - "frontend/src/components/auth/LoginCaptcha.vue"
                - "frontend/src/services/http/client.js"
                - "student-portal/src/views/login/LoginView.vue"
                - "student-portal/src/services/request.js"
                - "student-portal/tests/auth-error-details.test.mjs"
                - "miniapp/src/components/login/MiniLoginAuthPanel.vue"
                - "miniapp/src/services/request.js"
                - "scripts/e2e/auth_login_redis_click.py"
                - "deploy/auth-redis.production.env.example"
                - "deploy/start-backend-production.sh"
                - ".github/workflows/auth-login-redis-e2e.yml"
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: auth-login-redis-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            auth-login-redis-e2e:
              name: 五入口真实登录点击 + Redis 单次消费
              runs-on: ubuntu-latest
              timeout-minutes: 45
              services:
                mysql:
                  image: mysql:8.0
                  env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: auth_login_e2e
                  ports:
                    - 3306:3306
                  options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=15
                redis:
                  image: redis:7-alpine
                  ports:
                    - 6379:6379
                  options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=5s
                    --health-timeout=3s
                    --health-retries=20
              env:
                APP_ENV: test
                DEPLOYMENT_MODE: local
                DEBUG: "false"
                DB_ENABLED: "true"
                DB_DRIVER: mysql
                DB_HOST: 127.0.0.1
                DB_PORT: "3306"
                DB_NAME: auth_login_e2e
                DB_USER: root
                DB_PASSWORD: root
                TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/auth_login_e2e?charset=utf8mb4
                REDIS_URL: redis://127.0.0.1:6379/15
                REDIS_KEY_PREFIX: auth-login-e2e
                REDIS_CONNECT_TIMEOUT: "2"
                REDIS_SOCKET_TIMEOUT: "2"
                SCHEDULER_MODE: external
                MOCK_LOGIN_ENABLED: "false"
                JWT_SECRET: auth-login-e2e-only-secret-20260805-at-least-32
                CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5199,http://localhost:5199,http://127.0.0.1:5200,http://localhost:5200
                VITE_PROXY_TARGET: http://127.0.0.1:8000
                VITE_API_BASE_URL: http://127.0.0.1:8000
                VITE_USE_MOCK: "false"
                E2E_BASE_URL: http://127.0.0.1:5173
                E2E_STUDENT_BASE_URL: http://127.0.0.1:5199
                E2E_MINI_BASE_URL: http://127.0.0.1:5200
                E2E_ARTIFACT_DIR: artifacts/auth-login-e2e
              steps:
                - uses: actions/checkout@v4

                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                    cache: pip
                    cache-dependency-path: backend/requirements.txt

                - uses: actions/setup-node@v4
                  with:
                    node-version: "20"
                    cache: npm
                    cache-dependency-path: |
                      frontend/package-lock.json
                      student-portal/package-lock.json
                      miniapp/package-lock.json

                - name: 安装后端与浏览器依赖
                  run: |
                    python -m pip install --upgrade pip
                    pip install -r backend/requirements.txt
                    pip install playwright
                    python -m playwright install --with-deps chromium

                - name: 认证、Redis 与学生错误合同专项测试
                  run: |
                    cd backend
                    pytest tests/test_auth_challenge_service.py tests/test_auth_captcha_redis_fail_closed.py -q -p no:warnings
                    cd ../student-portal
                    npm ci
                    npm test

                - name: 验证生产 Redis 缺失时拒绝启动
                  run: |
                    if env -u REDIS_URL APP_ENV=production DEPLOYMENT_MODE=production python backend/scripts/check_production_redis.py; then
                      echo "❌ 未配置 REDIS_URL 时生产闸门错误放行"
                      exit 1
                    fi
                    echo "✅ 未配置 REDIS_URL 时已按预期拒绝"

                - name: 验证生产 Redis 启动闸门
                  env:
                    APP_ENV: production
                    DEPLOYMENT_MODE: production
                    ALLOW_LOCAL_REDIS_IN_PRODUCTION: "true"
                  run: python backend/scripts/check_production_redis.py

                - name: 初始化真实 MySQL 登录账号
                  run: |
                    python backend/scripts/init_mysql_db.py
                    python backend/scripts/_seed_login_accounts_only.py

                - name: 启动 FastAPI
                  run: |
                    cd backend
                    nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/auth-backend.log 2>&1 &
                    for i in {1..60}; do
                      if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
                      sleep 1
                    done
                    cat /tmp/auth-backend.log
                    exit 1

                - name: 启动管理 PC、学生 PC 与小程序 H5
                  run: |
                    cd frontend
                    npm ci
                    nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/auth-frontend.log 2>&1 &
                    cd ../student-portal
                    nohup npm run dev -- --host 127.0.0.1 --port 5199 > /tmp/auth-student.log 2>&1 &
                    cd ../miniapp
                    npm ci
                    nohup npm run dev:h5 -- --host 127.0.0.1 --port 5200 > /tmp/auth-mini.log 2>&1 &
                    for target in http://127.0.0.1:5173/login http://127.0.0.1:5199/portal/login http://127.0.0.1:5200/; do
                      ready=false
                      for i in {1..90}; do
                        if curl -fsS "$target" >/dev/null; then ready=true; break; fi
                        sleep 1
                      done
                      if [ "$ready" != true ]; then
                        echo "service not ready: $target"
                        cat /tmp/auth-frontend.log || true
                        cat /tmp/auth-student.log || true
                        cat /tmp/auth-mini.log || true
                        exit 1
                      fi
                    done

                - name: 五入口浏览器真实输入并点击登录
                  run: python scripts/e2e/auth_login_redis_click.py

                - name: 失败时输出服务日志
                  if: failure()
                  run: |
                    echo "===== backend ====="; cat /tmp/auth-backend.log || true
                    echo "===== frontend ====="; cat /tmp/auth-frontend.log || true
                    echo "===== student ====="; cat /tmp/auth-student.log || true
                    echo "===== mini ====="; cat /tmp/auth-mini.log || true

                - name: 上传点击验收证据
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: auth-login-redis-e2e-${{ github.run_id }}
                    path: artifacts/auth-login-e2e
                    if-no-files-found: warn
                    retention-days: 14
          '''
          Path('.github/workflows/auth-login-redis-e2e.yml').write_text(textwrap.dedent(workflow), encoding='utf-8')
          Path('.github/workflows/_auth-review-repair-once.yml').unlink()
          PY

      - name: Validate repaired student contract
        run: |
          cd student-portal
          npm ci
          npm test
          npm run lint
          cd ..
          python -m py_compile backend/scripts/_seed_login_accounts_only.py scripts/e2e/auth_login_redis_click.py
          git diff --check

      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add student-portal/src/services/request.js student-portal/tests/auth-error-details.test.mjs backend/scripts/_seed_login_accounts_only.py scripts/e2e/auth_login_redis_click.py .github/workflows/auth-login-redis-e2e.yml .github/workflows/_auth-review-repair-once.yml
          git commit -m "fix(auth): preserve captcha errors and expand login E2E"
          git push origin HEAD:feat/adaptive-login-captcha-20260805
