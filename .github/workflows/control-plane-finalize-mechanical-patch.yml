name: Control Plane finalize mechanical patch

on:
  push:
    branches:
      - integration/control-plane-option-b-20260815
    paths:
      - '.github/workflows/control-plane-finalize-mechanical-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-self-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/control-plane-option-b-20260815

      - name: Mechanically converge identity upload reads
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/modules/system_admin/routers/system_bundle.py')
          text = path.read_text(encoding='utf-8')
          assert text.count('b"".join(chunks)') == 2, 'expected exactly two legacy whole-upload joins'

          old_mixed_start = '    from app.services.identity_import_file_service import MAX_FILE_BYTES, create_batch, parse_xlsx\n'
          start = text.index(old_mixed_start, text.index('async def identity_import_validate_file('))
          end_marker = '    parsed = parse_xlsx(b"".join(chunks), file.filename or "")\n'
          end = text.index(end_marker, start) + len(end_marker)
          mixed = '''    from app.services.identity_import_file_service import MAX_FILE_BYTES, create_batch, parse_xlsx
              from app.services.identity_import_service import preview_identity_import
              from app.services.xlsx_util import read_safe_upload
              content = await read_safe_upload(
                  file,
                  max_bytes=MAX_FILE_BYTES,
                  too_large_code="FILE_TOO_LARGE",
                  too_large_message="导入文件超过 20MB 上限，请拆分后重试",
              )
              parsed = parse_xlsx(content, file.filename or "")
          '''
          # Dedent exactly eight spaces introduced by the YAML heredoc source block above.
          mixed = '\n'.join(line[8:] if line.startswith('        ') else line for line in mixed.splitlines()) + '\n'
          text = text[:start] + mixed + text[end:]

          helper_start = text.index('def _identity_import_upload(file: UploadFile, parser):\n')
          helper_end_marker = '    return parser(b"".join(chunks), file.filename or "")\n'
          helper_end = text.index(helper_end_marker, helper_start) + len(helper_end_marker)
          helper = '''async def _identity_import_upload(file: UploadFile, parser):
              """两个专用入口共用受限 XLSX 上传读取与业务解析。"""
              from app.services.identity_import_file_service import MAX_FILE_BYTES
              from app.services.xlsx_util import read_safe_upload
              content = await read_safe_upload(
                  file,
                  max_bytes=MAX_FILE_BYTES,
                  too_large_code="FILE_TOO_LARGE",
                  too_large_message="导入文件超过 20MB 上限，请拆分后重试",
              )
              return parser(content, file.filename or "")
          '''
          helper = '\n'.join(line[8:] if line.startswith('        ') else line for line in helper.splitlines()) + '\n'
          text = text[:helper_start] + helper + text[helper_end:]

          for old, new in (
              ('    parsed = _identity_import_upload(file, parse_student_xlsx)\n',
               '    parsed = await _identity_import_upload(file, parse_student_xlsx)\n'),
              ('    parsed = _identity_import_upload(file, parse_teacher_xlsx)\n',
               '    parsed = await _identity_import_upload(file, parse_teacher_xlsx)\n'),
          ):
              assert text.count(old) == 1, f'unexpected call-site count for {old.strip()}'
              text = text.replace(old, new, 1)

          assert 'b"".join(chunks)' not in text
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile backend/app/modules/system_admin/routers/system_bundle.py
          python scripts/audit_file_center_calls.py --strict --base-ref origin/main --json-report /tmp/file-center-call-scan.json

      - name: Commit exact mechanical patch and remove one-shot workflow
        run: |
          rm .github/workflows/control-plane-finalize-mechanical-patch.yml
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/control-plane-finalize-mechanical-patch.yml backend/app/modules/system_admin/routers/system_bundle.py "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/system_admin/routers/system_bundle.py .github/workflows/control-plane-finalize-mechanical-patch.yml
          git diff --cached --check
          git commit -m "fix(file-center): converge identity upload reads"
          git push origin HEAD:integration/control-plane-option-b-20260815
