name: PR39 exact status-contract hotfix

on:
  push:
    branches:
      - audit/student-affairs-p0-p1-closeout-20260803
    paths:
      - .github/workflows/pr39-restore-status-contracts.yml

permissions:
  contents: write

jobs:
  patch-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/student-affairs-p0-p1-closeout-20260803
          fetch-depth: 0

      - name: Restore formal service constants exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          activity = Path('backend/app/services/affairs_activity_service.py')
          text = activity.read_text(encoding='utf-8')
          marker = '_MAX_CREDIT = Decimal("9999.99")\n'
          replacement = (
              '_MAX_CREDIT = Decimal("9999.99")\n'
              '_VOL_LABEL = {"PENDING": "待认定", "CONFIRMED": "已认定", "REJECTED": "已驳回"}\n'
              'VOL_CATEGORY = "ZHIYUAN"\n'
          )
          if '_VOL_LABEL = {' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('activity constant anchor is not unique')
              text = text.replace(marker, replacement, 1)
          if text.count('_VOL_LABEL = {') != 1 or text.count('VOL_CATEGORY = "ZHIYUAN"') != 1:
              raise SystemExit('activity constants are not singular')
          activity.write_text(text, encoding='utf-8')

          funding = Path('backend/app/services/affairs_funding_ext_service.py')
          text = funding.read_text(encoding='utf-8')
          marker = '_MAX_AMOUNT = Decimal("999999999999.99")\n'
          replacement = (
              '_MAX_AMOUNT = Decimal("999999999999.99")\n'
              '_L_LOAN = {"REGISTERED": "已登记", "RECEIPT": "回执已传", "VERIFIED": "已核对", "CONFIRMED": "已确认"}\n'
              '_LOAN_NEXT = {"REGISTERED": "RECEIPT", "RECEIPT": "VERIFIED", "VERIFIED": "CONFIRMED"}\n'
          )
          if '_L_LOAN = {' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('loan constant anchor is not unique')
              text = text.replace(marker, replacement, 1)
          if text.count('_L_LOAN = {') != 1 or text.count('_LOAN_NEXT = {') != 1:
              raise SystemExit('loan constants are not singular')
          funding.write_text(text, encoding='utf-8')
          PY

          python -m py_compile \
            backend/app/services/affairs_activity_service.py \
            backend/app/services/affairs_funding_ext_service.py

      - name: Commit only the exact hotfix and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr39-restore-status-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/services/affairs_activity_service.py \
            backend/app/services/affairs_funding_ext_service.py \
            .github/workflows/pr39-restore-status-contracts.yml
          git diff --cached --check
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "fix(affairs): restore volunteer and loan status contracts"
          git push origin HEAD:audit/student-affairs-p0-p1-closeout-20260803
