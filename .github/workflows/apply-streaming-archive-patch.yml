name: Apply streaming archive cutover

on:
  push:
    branches:
      - audit/file-capability-inventory
    paths:
      - .github/workflows/apply-streaming-archive-patch.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0
      - name: Replace obsolete in-memory package implementations
        run: |
          python - <<'PY'
          from pathlib import Path

          graduation = Path('backend/app/modules/graduation/services/graduation_material_center_service.py')
          source = graduation.read_text(encoding='utf-8')
          start = source.index('def _manifest_entries(')
          end = source.index('def resolve_material_download(', start)
          replacement = '''def build_student_package(gd_student_id: int, user: dict) -> dict:
              """旧内部调用兼容：委托阶段 6 权威 ExportJob，不再同步内存打包。"""
              from app.modules.graduation.services import graduation_material_delivery_service as delivery

              with session() as db:
                  student = db.get(GraduationStudent, int(gd_student_id))
                  if not student or student.is_deleted or student.tenant_id != _tid():
                      raise not_found("毕业设计学生不存在")
                  assert_student_access(db, student, "archive.package")
                  batch_id = int(student.batch_id or 0)
              job = delivery.create_export_job(
                  batch_id=batch_id, scope_type="STUDENT", scope_value=str(gd_student_id), user=user,
              )
              return delivery.run_export_job(int(job["id"]), user)


          def build_batch_package(batch_id: int, user: dict) -> dict:
              """旧内部调用兼容：委托阶段 6 权威批次 ExportJob。"""
              from app.modules.graduation.services import graduation_material_delivery_service as delivery

              job = delivery.create_export_job(
                  batch_id=int(batch_id), scope_type="BATCH", scope_value="", user=user,
              )
              return delivery.run_export_job(int(job["id"]), user)


          '''
          graduation.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

          internship = Path('backend/app/modules/internship/services/internship_material_center_service.py')
          source = internship.read_text(encoding='utf-8')
          start = source.index('def build_versioned_package(')
          end = source.index('def revoke_manifests(', start)
          replacement = '''def build_versioned_package(internship_id, user=None) -> dict:
              """委托流式归档实现；冻结 Manifest 仍是唯一事实来源。"""
              from app.modules.internship.services.internship_streaming_package_service import (
                  build_versioned_package as stream_package,
              )

              return stream_package(internship_id, user=user)


          '''
          internship.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY
          python -m compileall -q \
            backend/app/modules/graduation/services/graduation_material_center_service.py \
            backend/app/modules/internship/services/internship_material_center_service.py \
            backend/app/modules/internship/services/internship_streaming_package_service.py \
            backend/app/services/generated_file_path_service.py \
            backend/app/services/streaming_archive_service.py
          python scripts/audit_file_center_calls.py --strict --base-ref origin/main
      - name: Commit exact cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backend/app/modules/graduation/services/graduation_material_center_service.py \
            backend/app/modules/internship/services/internship_material_center_service.py
          git diff --cached --check
          git commit -m "fix(file-center): cut archive packaging over to streaming paths"
          git push origin HEAD:audit/file-capability-inventory
