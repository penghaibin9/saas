name: Academic D W0 UI sync

on:
  push:
    branches:
      - agent/academic-d-graduation-delivery
    paths:
      - '.github/workflows/academic-d-w0-ui-sync.yml'

permissions:
  contents: write

jobs:
  sync-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-d-graduation-delivery
          fetch-depth: 0
      - name: Apply deterministic D-W0 UI patch
        run: python .academic-d-w0-ui-patch.py
      - name: Run graduation audit console contract
        run: node --test frontend/tests/stage-d-graduation-audit-console-contract.test.mjs
      - name: Commit synchronized UI and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/modules/academicAffairs/views/AaGraduationAuditConsoleView.vue frontend/tests/stage-d-graduation-audit-console-contract.test.mjs
          git rm .academic-d-w0-ui-patch.py .github/workflows/academic-d-w0-ui-sync.yml
          git commit -m 'fix(academic-d): block abnormal graduation final in UI'
          git push origin HEAD:agent/academic-d-graduation-delivery
