name: Internship material center

on:
  pull_request:
    paths:
      - 'backend/app/models/file.py'
      - 'backend/app/modules/internship/services/internship_material_center_*.py'
      - 'backend/app/modules/internship/routers/internship_material_center.py'
      - 'backend/app/api/v1/route_registration.py'
      - 'backend/alembic/versions/0148_internship_material_center.py'
      - 'backend/tests/test_internship_material_center.py'
      - 'backend/tests/internship_material_center_mysql_acceptance.py'
      - 'frontend/src/modules/internship/api/material-center.api.js'
      - 'frontend/src/modules/internship/views/InternshipMaterialCenterView.vue'
      - 'frontend/src/modules/internship/routes.js'
      - '.github/workflows/internship-material-center.yml'
  push:
    branches:
      - audit/file-capability-inventory
    paths:
      - 'backend/app/models/file.py'
      - 'backend/app/modules/internship/services/internship_material_center_*.py'
      - 'backend/app/modules/internship/routers/internship_material_center.py'
      - 'backend/app/api/v1/route_registration.py'
      - 'backend/alembic/versions/0148_internship_material_center.py'
      - 'backend/tests/test_internship_material_center.py'
      - 'backend/tests/internship_material_center_mysql_acceptance.py'
      - 'frontend/src/modules/internship/api/material-center.api.js'
      - 'frontend/src/modules/internship/views/InternshipMaterialCenterView.vue'
      - 'frontend/src/modules/internship/routes.js'
      - '.github/workflows/internship-material-center.yml'

concurrency:
  group: internship-material-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-contract:
    name: MySQL 资产版本 + 归档清单 + 安全优先路由
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      APP_ENV: test
      SECRET_KEY: stage4-internship-material-center-secret
      FILE_SCAN_ENABLED: 'false'
      FILE_SCAN_REQUIRED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify single Alembic head and upgrade real MySQL
        working-directory: backend
        run: |
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
      - name: Compile phase 4 backend
        working-directory: backend
        run: |
          python -m py_compile \
            app/models/file.py \
            app/modules/internship/services/internship_material_center_service.py \
            app/modules/internship/services/internship_material_center_facade.py \
            app/modules/internship/routers/internship_material_center.py \
            app/api/v1/route_registration.py \
            alembic/versions/0148_internship_material_center.py \
            tests/test_internship_material_center.py \
            tests/internship_material_center_mysql_acceptance.py
      - name: Static frozen contracts
        working-directory: backend
        run: pytest tests/test_internship_material_center.py -q -p no:warnings
      - name: Real MySQL asset version and manifest acceptance
        working-directory: backend
        run: python tests/internship_material_center_mysql_acceptance.py
      - name: Verify schema and safety route ordering
        working-directory: backend
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          import os
          engine = create_engine(os.environ['DATABASE_URL'])
          inspector = inspect(engine)
          tables = set(inspector.get_table_names())
          required = {'t_file_asset', 't_file_version', 't_archive_manifest', 't_archive_manifest_item'}
          assert required <= tables, required - tables
          columns = {row['name'] for row in inspector.get_columns('t_file_binding')}
          assert {'asset_id', 'version_id', 'module_code', 'student_id',
                  'data_scope_snapshot_json', 'invalidated_at'} <= columns
          print('Stage 4 schema verified')
          PY
          python - <<'PY'
          from app.api.v1.route_registration import register_internship_routes
          from fastapi import APIRouter
          router = APIRouter()
          register_internship_routes(router, {'intern': []})
          matching = [
              (route.path, sorted(route.methods or []), route.endpoint.__module__)
              for route in router.routes
              if route.path in {
                  '/internship/agreements/{agreement_id}/school-confirm',
                  '/internship/insurances/{insurance_id}/verify',
                  '/internship/process-reports/{report_id}/review',
                  '/internship/archive/{internship_id}/archive',
                  '/internship/archive/{internship_id}/package',
                  '/internship/archive/{internship_id}/revoke',
              }
          ]
          first_by_path = {}
          for path, methods, module in matching:
              first_by_path.setdefault(path, module)
          assert first_by_path
          assert all(module.endswith('internship_material_center') for module in first_by_path.values()), first_by_path
          print('Stage 4 safety-first routing verified')
          PY

  frontend-contract:
    name: 管理 PC 材料与证据中心
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint and build
        working-directory: frontend
        run: |
          npm run lint
          npm run build
      - name: Verify material center production contract
        run: |
          test -f frontend/src/modules/internship/views/InternshipMaterialCenterView.vue
          test -f frontend/src/modules/internship/api/material-center.api.js
          grep -q "material-center" frontend/src/modules/internship/routes.js
          grep -q "fileSdk" frontend/src/modules/internship/views/InternshipMaterialCenterView.vue
          grep -q "versionId" frontend/src/modules/internship/views/InternshipMaterialCenterView.vue
          grep -q "manifestSha256" frontend/src/modules/internship/views/InternshipMaterialCenterView.vue
