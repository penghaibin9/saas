name: Agent Source Snapshot PR38

on:
  push:
    branches:
      - fix/main-pytest-fixture-corruption
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source
        run: |
          tar --exclude=.git --exclude='**/node_modules' --exclude='**/dist' -czf /tmp/saas-pr38-source.tar.gz .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: saas-pr38-source
          path: /tmp/saas-pr38-source.tar.gz
          retention-days: 1
