name: PR25 final authoritative merge closeout

on:
  push:
    branches:
      - audit/file-capability-inventory
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr25-final-authoritative-merge-closeout
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      APP_ENV: test
      SECRET_KEY: pr25-final-authoritative-closeout-secret
      FILE_SCAN_ENABLED: 'false'
      FILE_SCAN_REQUIRED: 'false'
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: prepare
        name: Merge latest main and prepare exact audited tree
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main > /tmp/merge.log 2>&1
          merge_code=$?
          set -e
          if [ "$merge_code" -gt 1 ]; then
            cat /tmp/merge.log
            exit "$merge_code"
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          for file in "${conflicts[@]}"; do
            case "$file" in
              frontend/src/modules/system/components/ImportDialog.vue|\
              frontend/src/modules/system/system.routes.js|\
              frontend/src/modules/system/systemManagementCatalog.js|\
              frontend/src/modules/system/views/SystemStudentImportView.vue|\
              frontend/src/modules/system/views/SystemTeacherImportView.vue|\
              student-portal/src/layouts/PortalLayout.vue)
                git checkout --ours -- "$file"
                git add -- "$file"
                ;;
              *)
                echo "Unexpected merge conflict: $file"
                exit 1
                ;;
            esac
          done
          test -z "$(git diff --name-only --diff-filter=U)"

          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/graduation_material_center_mysql_acceptance.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('            GraduationMidterm(')
          end = source.index('            GraduationArchiveRecord(', start)
          block = source[start:end]
          for obsolete in (
              '                progress="80%",\n',
              '                issues="无",\n',
              '                next_plan="完成定稿",\n',
          ):
              block = block.replace(obsolete, '')
          source = source[:start] + block + source[end:]
          path.write_text(source, encoding='utf-8')
          PY
          git add -- backend/tests/graduation_material_center_mysql_acceptance.py
          git rm -f .github/workflows/pr25-midterm-fixture-block-fix.yml || true

          grep -q "path: 'accounts/staff'" frontend/src/modules/system/system.routes.js
          grep -q "path: 'data-exchange'" frontend/src/modules/system/system.routes.js
          grep -q "path: 'file-storage-governance'" frontend/src/modules/system/system.routes.js
          grep -q "教职工导入" frontend/src/modules/system/systemManagementCatalog.js
          grep -q "我的材料库" student-portal/src/layouts/PortalLayout.vue
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' \
            frontend/src/modules/system student-portal/src/layouts \
            backend/tests/graduation_material_center_mysql_acceptance.py
          git diff --check

      - uses: actions/setup-python@v5
        if: steps.prepare.outcome == 'success'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        if: steps.prepare.outcome == 'success'
        with:
          node-version: '24'

      - id: backend_install
        name: Install backend dependencies
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (cd backend && pip install -r requirements.txt) > /tmp/backend_install.log 2>&1
          code=$?
          exit "$code"

      - id: migrate
        name: Compile and migrate real MySQL
        if: steps.backend_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (cd backend && \
            python -m compileall -q app tests && \
            test "$(alembic heads | wc -l | tr -d ' ')" = "1" && \
            alembic upgrade head && \
            alembic current) > /tmp/migrate.log 2>&1
          code=$?
          exit "$code"

      - id: scan
        name: Run strict inventory and authorization contracts
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (python scripts/audit_file_capabilities.py --check-schema && \
            python scripts/audit_file_capabilities.py --strict-baseline && \
            python scripts/check_new_file_capabilities.py --base-ref origin/main && \
            python scripts/audit_file_center_calls.py --strict --base-ref origin/main && \
            node scripts/check/check-file-client-contract.mjs) > /tmp/scan.log 2>&1
          code=$?
          exit "$code"

      - id: backend_tests
        name: Run complete stage 6-10 MySQL regression
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (cd backend && pytest -q -p no:warnings --durations=30 \
            tests/test_academic_export_compat.py \
            tests/test_academic_file_exchange_center.py \
            tests/test_affairs_material_center.py \
            tests/test_data_exchange_job_center.py \
            tests/test_file_access_service.py \
            tests/test_file_center_cos_production.py \
            tests/test_file_center_frontend_cos_supply_chain.py \
            tests/test_file_center_stage10_closure.py \
            tests/test_file_identity_import_scan.py \
            tests/test_file_p0_authz.py \
            tests/test_file_scan_clamav.py \
            tests/test_file_scan_state.py \
            tests/test_file_storage.py \
            tests/test_file_storage_governance.py \
            tests/test_file_storage_quota_reservation.py \
            tests/test_file_storage_write_context.py \
            tests/test_file_streaming_archive_cutover.py \
            tests/test_graduation_material_center_phase6.py \
            tests/test_internship_material_center.py && \
            python -m app.workers.file_governance_worker --once --tenant-id 90999 --dry-run) > /tmp/backend_tests.log 2>&1
          code=$?
          exit "$code"

      - id: admin_pc
        name: Admin PC lint test build
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (cd frontend && npm ci && npm run lint && npm test && npm run build) > /tmp/admin_pc.log 2>&1
          code=$?
          exit "$code"

      - id: student_pc
        name: Student PC lint test build
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (cd student-portal && npm ci && npm run lint && npm test && npm run build) > /tmp/student_pc.log 2>&1
          code=$?
          exit "$code"

      - id: miniapp
        name: Miniapp test H5 and WeChat builds
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (cd miniapp && npm ci && npm test && npm run build:h5 && npm run build:mp-weixin) > /tmp/miniapp.log 2>&1
          code=$?
          exit "$code"

      - id: commit
        name: Commit only after every gate is green
        if: >-
          steps.prepare.outcome == 'success' &&
          steps.backend_install.outcome == 'success' &&
          steps.migrate.outcome == 'success' &&
          steps.scan.outcome == 'success' &&
          steps.backend_tests.outcome == 'success' &&
          steps.admin_pc.outcome == 'success' &&
          steps.student_pc.outcome == 'success' &&
          steps.miniapp.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git commit -m "merge: sync main and close PR25 final audit"
          git push origin HEAD:audit/file-capability-inventory
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report exact result to PR 25
        if: always()
        shell: bash
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          BACKEND_INSTALL: ${{ steps.backend_install.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          SCAN: ${{ steps.scan.outcome }}
          BACKEND_TESTS: ${{ steps.backend_tests.outcome }}
          ADMIN_PC: ${{ steps.admin_pc.outcome }}
          STUDENT_PC: ${{ steps.student_pc.outcome }}
          MINIAPP: ${{ steps.miniapp.outcome }}
          COMMIT_RESULT: ${{ steps.commit.outcome }}
          FINAL_SHA: ${{ steps.commit.outputs.final_sha }}
        run: |
          audited_sha="${FINAL_SHA:-$GITHUB_SHA}"
          {
            echo '<!-- pr25-final-authoritative-merge-closeout -->'
            echo '## PR #25 最终合并前审计'
            echo
            echo "Audited SHA: ${audited_sha}"
            echo
            echo '| 门禁 | 结果 |'
            echo '|---|---|'
            echo "| 合入最新 main / 精确冲突收口 / 夹具校正 | ${PREPARE} |"
            echo "| 后端依赖 | ${BACKEND_INSTALL} |"
            echo "| MySQL / Alembic / 编译 | ${MIGRATE} |"
            echo "| 能力清单 / 严格调用扫描 / 授权合同 | ${SCAN} |"
            echo "| 阶段 6–10 MySQL 回归 / 治理 worker | ${BACKEND_TESTS} |"
            echo "| 管理 PC lint / test / build | ${ADMIN_PC} |"
            echo "| 学生 PC lint / test / build | ${STUDENT_PC} |"
            echo "| H5 / 微信小程序 test / build | ${MINIAPP} |"
            echo "| 全绿后提交合并树 | ${COMMIT_RESULT} |"
            echo
            for item in merge backend_install migrate scan backend_tests admin_pc student_pc miniapp; do
              file="/tmp/${item}.log"
              if [ -s "$file" ]; then
                echo "<details><summary>${item} 日志末尾</summary>"
                echo
                echo '```text'
                tail -n 100 "$file"
                echo '```'
                echo '</details>'
              fi
            done
            echo
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/pr25-final-audit.md
          gh pr comment 25 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr25-final-audit.md

      - name: Enforce final green state
        if: always()
        shell: bash
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          BACKEND_INSTALL: ${{ steps.backend_install.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          SCAN: ${{ steps.scan.outcome }}
          BACKEND_TESTS: ${{ steps.backend_tests.outcome }}
          ADMIN_PC: ${{ steps.admin_pc.outcome }}
          STUDENT_PC: ${{ steps.student_pc.outcome }}
          MINIAPP: ${{ steps.miniapp.outcome }}
          COMMIT_RESULT: ${{ steps.commit.outcome }}
        run: |
          test "$PREPARE" = success
          test "$BACKEND_INSTALL" = success
          test "$MIGRATE" = success
          test "$SCAN" = success
          test "$BACKEND_TESTS" = success
          test "$ADMIN_PC" = success
          test "$STUDENT_PC" = success
          test "$MINIAPP" = success
          test "$COMMIT_RESULT" = success
