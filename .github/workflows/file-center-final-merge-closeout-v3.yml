# PR #25 final merge audit trigger; no workflow logic change.
name: File center final merge closeout v3

on:
  push:
    branches:
      - audit/file-capability-inventory
    paths:
      - .github/workflows/file-center-final-merge-closeout-v3.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: file-center-streaming-scan-closeout
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_ENABLED: 'true'
      DB_DRIVER: mysql
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      APP_ENV: test
      SECRET_KEY: file-center-final-merge-closeout-v3-secret
      FILE_SCAN_ENABLED: 'false'
      FILE_SCAN_REQUIRED: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/file-capability-inventory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - id: patch
        name: Apply final production fixes
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/patch.log 2>&1
          from pathlib import Path

          def extract_scripts(path: str) -> list[str]:
              raw = Path(path).read_text(encoding='utf-8')
              marker = "          python - <<'PY'\n"
              end_marker = "\n          PY\n"
              scripts = []
              cursor = 0
              while True:
                  start = raw.find(marker, cursor)
                  if start < 0:
                      break
                  start += len(marker)
                  end = raw.find(end_marker, start)
                  if end < 0:
                      raise RuntimeError(f'unclosed Python patch in {path}')
                  lines = raw[start:end].splitlines()
                  scripts.append("\n".join(
                      line[10:] if line.startswith("          ") else line
                      for line in lines
                  ))
                  cursor = end + len(end_marker)
              return scripts

          # Apply the path-based XLSX changes, excluding the old ClamAV anchor section.
          streaming = extract_scripts('.github/workflows/file-center-streaming-scan-closeout.yml')
          if not streaming:
              raise RuntimeError('streaming production patch is missing')
          streaming_code = streaming[0].split('          # 6) ClamAV protocol response', 1)[0]
          if streaming_code == streaming[0]:
              streaming_code = streaming[0].split('# 6) ClamAV protocol response', 1)[0]
          exec(compile(streaming_code, 'streaming-xlsx-production-patch', 'exec'), {})

          # Replace the complete ClamAV response body by function-range, not a fragile text anchor.
          clamav_path = Path('backend/app/services/clamav_client.py')
          clamav = clamav_path.read_text(encoding='utf-8')
          fn_start = clamav.index('    @staticmethod\n    def _read_response(')
          fn_end = clamav.index('\n    def command(', fn_start)
          replacement = '''    @staticmethod
    def _read_response(sock: socket.socket, limit: int = 64 * 1024) -> str:
        response = bytearray()
        while len(response) < limit:
            try:
                part = sock.recv(min(4096, limit - len(response)))
            except OSError as exc:
                raise ClamAVUnavailable(f"ClamAV read failed: {exc}") from exc
            if not part:
                break
            response.extend(part)
            if b"\\0" in part or b"\\n" in part:
                break
        return response.rstrip(b"\\0\\r\\n").decode("utf-8", errors="replace")
'''
          clamav_path.write_text(clamav[:fn_start] + replacement + clamav[fn_end:], encoding='utf-8')

          # Apply the four MySQL root-cause fixes.
          final_scripts = extract_scripts('.github/workflows/file-center-final-red-closeout.yml')
          if len(final_scripts) < 2:
              raise RuntimeError('MySQL root-cause patch is missing')
          exec(compile(final_scripts[1], 'mysql-production-patch', 'exec'), {})

          # Update the authorization contract checker to follow the authoritative facade + implementation split.
          checker_path = Path('scripts/check/check-file-client-contract.mjs')
          checker = checker_path.read_text(encoding='utf-8')
          old_decl = "const fileService = read('backend/app/services/file_service.py')\n"
          new_decl = "const fileServiceFacade = read('backend/app/services/file_service.py')\nconst fileServiceImplementation = read('backend/app/services/file_service_legacy.py')\n"
          if old_decl in checker:
              checker = checker.replace(old_decl, new_decl, 1)
          old_assert = "mustInclude(fileService, 'authorize_file_object(', 'legacy file service must delegate DB authorization to resolver registry.')\n"
          new_assert = "mustInclude(fileServiceFacade, 'from app.services import file_service_legacy as _legacy', 'file service facade must delegate to the frozen implementation.')\nmustInclude(fileServiceFacade, 'with storage_write_scope(biz_type):', 'file service facade must preserve module-scoped quota reservation.')\nmustInclude(fileServiceImplementation, 'authorize_file_object(', 'file service implementation must delegate DB authorization to resolver registry.')\n"
          if old_assert in checker:
              checker = checker.replace(old_assert, new_assert, 1)
          required = [
              "const fileServiceFacade = read('backend/app/services/file_service.py')",
              "const fileServiceImplementation = read('backend/app/services/file_service_legacy.py')",
              "mustInclude(fileServiceImplementation, 'authorize_file_object('",
          ]
          missing = [item for item in required if item not in checker]
          if missing:
              raise RuntimeError(f'authorization checker update incomplete: {missing}')
          checker_path.write_text(checker, encoding='utf-8')

          print('all final production patches applied')
          PY
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - id: install
        name: Install backend dependencies
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (cd backend && pip install -r requirements.txt) > /tmp/install.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - id: migrate
        name: Compile and migrate MySQL to 0154
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (cd backend && \
            python -m compileall -q app tests && \
            test "$(alembic heads | wc -l | tr -d ' ')" = "1" && \
            alembic upgrade head && \
            alembic current | grep -q '0154_file_storage_quota_reservation') > /tmp/migrate.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - id: scan
        name: Run strict scanners and authorization contract
        if: steps.migrate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (python scripts/audit_file_capabilities.py --check-schema && \
            python scripts/audit_file_capabilities.py --strict-baseline && \
            python scripts/check_new_file_capabilities.py --base-ref origin/main && \
            python scripts/audit_file_center_calls.py --strict --base-ref origin/main && \
            node scripts/check/check-file-client-contract.mjs) > /tmp/scan.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - id: tests
        name: Run complete stage 6-10 MySQL regression
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (cd backend && pytest -q -p no:warnings --durations=30 \
            tests/test_academic_export_compat.py \
            tests/test_academic_file_exchange_center.py \
            tests/test_affairs_material_center.py \
            tests/test_data_exchange_job_center.py \
            tests/test_file_access_service.py \
            tests/test_file_center_cos_production.py \
            tests/test_file_center_frontend_cos_supply_chain.py \
            tests/test_file_center_stage10_closure.py \
            tests/test_file_identity_import_scan.py \
            tests/test_file_p0_authz.py \
            tests/test_file_scan_clamav.py \
            tests/test_file_scan_state.py \
            tests/test_file_storage.py \
            tests/test_file_storage_governance.py \
            tests/test_file_storage_quota_reservation.py \
            tests/test_file_storage_write_context.py \
            tests/test_file_streaming_archive_cutover.py \
            tests/test_graduation_material_center_phase6.py \
            tests/test_internship_material_center.py && \
            python -m app.workers.file_governance_worker --once --tenant-id 90999 --dry-run) > /tmp/tests.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Commit only after every gate passes
        id: commit
        if: steps.patch.outcome == 'success' && steps.install.outcome == 'success' && steps.migrate.outcome == 'success' && steps.scan.outcome == 'success' && steps.tests.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/file-center-streaming-scan-closeout.yml
          git rm .github/workflows/file-center-final-red-closeout.yml
          git rm .github/workflows/file-center-final-red-diagnostic.yml
          git rm .github/workflows/file-center-final-red-diagnostic-v2.yml
          git rm .github/workflows/file-center-final-merge-closeout-v3.yml
          git add -- \
            backend/app/services/xlsx_util.py \
            backend/app/services/excel/pipeline.py \
            backend/app/services/excel/__init__.py \
            backend/app/services/clamav_client.py \
            backend/app/services/storage/cos.py \
            backend/app/services/file_storage_quota_reservation_service.py \
            backend/app/modules/academic_affairs/services/academic_affairs_service.py \
            backend/app/modules/academic_affairs/services/academic_file_exchange_service.py \
            backend/app/modules/academic_affairs/services/academic_export_compat_service.py \
            backend/tests/graduation_material_center_mysql_acceptance.py \
            scripts/check/check-file-client-contract.mjs
          git diff --cached --check
          git commit -m "fix(file-center): close final merge audit blockers"
          git push origin HEAD:audit/file-capability-inventory

      - name: Report exact result to PR 25
        if: always()
        shell: bash
        env:
          PATCH: ${{ steps.patch.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          SCAN: ${{ steps.scan.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
        run: |
          {
            echo '<!-- file-center-final-merge-closeout-v3 -->'
            echo '## 文件中心合并前收口（第三轮）'
            echo
            echo '| 环节 | 结果 |'
            echo '|---|---|'
            echo "| 应用生产修复 | ${PATCH} |"
            echo "| 安装依赖 | ${INSTALL} |"
            echo "| MySQL 升级到 0154 | ${MIGRATE} |"
            echo "| 严格扫描和授权合同 | ${SCAN} |"
            echo "| 阶段 6–10 完整测试 | ${TESTS} |"
            echo "| 全绿后提交代码 | ${COMMIT} |"
            echo
            for item in patch install migrate scan tests; do
              file="/tmp/${item}.log"
              if [ -s "$file" ]; then
                echo "<details><summary>${item} 日志末尾</summary>"
                echo
                echo '```text'
                tail -n 120 "$file"
                echo '```'
                echo '</details>'
              fi
            done
            echo
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/result.md
          gh pr comment 25 --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
