name: Control Plane School IAM E2E

on:
  workflow_dispatch:
  push:
    branches:
      - integration/control-plane-option-b-20260815
    paths:
      - 'backend/app/core/effective_access.py'
      - 'backend/app/core/permission_catalog.py'
      - 'backend/app/core/permissions.py'
      - 'backend/app/modules/system_admin/**'
      - 'backend/app/services/permission_bundle_service.py'
      - 'backend/app/services/system_role_shadow_service.py'
      - 'backend/scripts/e2e_seed_control_plane_school_iam.py'
      - 'backend/scripts/e2e_seed_control_plane_role_projection.py'
      - 'frontend/src/modules/system/**'
      - 'frontend/src/config/adminMenu.js'
      - 'frontend/src/layouts/BasePortalLayout.vue'
      - 'frontend/src/security/permissionGate.js'
      - 'frontend/tests/admin-menu-custom-role-projection.test.mjs'
      - 'frontend/tests/approval-route-permission-gate.test.mjs'
      - 'frontend/tests/control-plane-v2-platform-access-contract.test.mjs'
      - 'e2e/specs/system-role-security-change.spec.mjs'
      - 'e2e/specs/system-effective-access.spec.mjs'
      - 'e2e/specs/control-plane-role-menu-projection.spec.mjs'
      - 'shared/contracts/navigation-surface-contract.json'
      - 'shared/contracts/permission-catalog.json'
      - '.github/workflows/control-plane-school-iam-e2e.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/app/core/effective_access.py'
      - 'backend/app/core/permission_catalog.py'
      - 'backend/app/core/permissions.py'
      - 'backend/app/modules/system_admin/**'
      - 'backend/app/services/permission_bundle_service.py'
      - 'backend/app/services/system_role_shadow_service.py'
      - 'backend/scripts/e2e_seed_control_plane_school_iam.py'
      - 'backend/scripts/e2e_seed_control_plane_role_projection.py'
      - 'frontend/src/modules/system/**'
      - 'frontend/src/config/adminMenu.js'
      - 'frontend/src/layouts/BasePortalLayout.vue'
      - 'frontend/src/security/permissionGate.js'
      - 'frontend/tests/admin-menu-custom-role-projection.test.mjs'
      - 'frontend/tests/approval-route-permission-gate.test.mjs'
      - 'frontend/tests/control-plane-v2-platform-access-contract.test.mjs'
      - 'e2e/specs/system-role-security-change.spec.mjs'
      - 'e2e/specs/system-effective-access.spec.mjs'
      - 'e2e/specs/control-plane-role-menu-projection.spec.mjs'
      - 'shared/contracts/navigation-surface-contract.json'
      - 'shared/contracts/permission-catalog.json'
      - '.github/workflows/control-plane-school-iam-e2e.yml'

permissions:
  contents: read

concurrency:
  group: control-plane-school-iam-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  APP_ENV: test
  DEPLOYMENT_MODE: local
  TRUSTED_PROXY_IPS: 127.0.0.1/32
  DB_ENABLED: 'true'
  DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/control_plane_school_iam_e2e?charset=utf8mb4
  TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/control_plane_school_iam_e2e?charset=utf8mb4
  DB_HOST: 127.0.0.1
  DB_PORT: '3306'
  DB_USER: root
  DB_PASSWORD: e2e_root
  DB_NAME: control_plane_school_iam_e2e
  REDIS_URL: redis://127.0.0.1:6379/14
  REDIS_KEY_PREFIX: control-plane-school-iam-e2e
  REDIS_CONNECT_TIMEOUT: '2'
  REDIS_SOCKET_TIMEOUT: '2'
  JWT_SECRET: control-plane-school-iam-e2e-only
  JWT_SECRET_KEY: control-plane-school-iam-e2e-only
  SECRET_KEY: control-plane-school-iam-e2e-only-secret-key
  MOCK_LOGIN_ENABLED: 'false'
  SMS_ENABLED: 'false'
  SCHEDULER_MODE: external
  E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
  E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
  E2E_STAFF_BASE_URL: http://127.0.0.1:5173
  E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
  E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DEPLOYED_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  school-iam-e2e:
    name: Exact-head school IAM browser + API E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: control_plane_school_iam_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Exact branch HEAD assertion
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "actual=$ACTUAL"
          echo "expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Strict B8 permission/catalog reconciliation
        run: |
          set -euo pipefail
          mkdir -p artifacts/control-plane
          python scripts/check/check-permission-catalog.py --strict-legacy --write artifacts/control-plane/school-iam-permission-catalog.json

      - name: Install backend and verify exact schema
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python -m py_compile scripts/e2e_seed_control_plane_school_iam.py
          python -m py_compile scripts/e2e_seed_control_plane_role_projection.py
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
          alembic current
          pytest tests/test_playwright_artifact_safety.py -q -p no:warnings

      - name: Seed base school identities
        working-directory: backend
        run: python scripts/e2e_seed_playwright_tenants.py

      - name: Seed school-IAM prerequisites only
        working-directory: backend
        run: python scripts/e2e_seed_control_plane_school_iam.py

      - name: Verify published-template runtime before school E2E
        working-directory: backend
        run: |
          python - <<'PY'
          from app.core.permissions import ROLE_PERMISSIONS
          from app.db.session import get_sessionmaker
          from app.services.system_role_shadow_service import active_tenant_permission_codes, published_system_role_permissions
          assert '*' in ROLE_PERMISSIONS['SCHOOL_ADMIN']
          codes = set(active_tenant_permission_codes())
          db = get_sessionmaker()()
          try:
              runtime = set(published_system_role_permissions(db, 'SCHOOL_ADMIN'))
          finally:
              db.close()
          assert len(codes) > 400
          assert runtime == codes
          assert '*' not in runtime
          assert not any(c.startswith('platform.') or c.startswith('enterprise.') for c in codes)
          print(f'school_assignable_universe={len(codes)} wildcard_runtime_retired=true')
          PY

      - name: Start backend
        run: |
          set -euo pipefail
          mkdir -p e2e/runtime-logs
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Install and start staff PC
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/frontend.log
          exit 1

      - name: Validate E2E syntax before browser install
        working-directory: e2e
        run: |
          node --check specs/system-role-security-change.spec.mjs
          node --check specs/system-effective-access.spec.mjs
          node --check specs/control-plane-role-menu-projection.spec.mjs
          node --test ../frontend/tests/admin-menu-custom-role-projection.test.mjs
          node --test ../frontend/tests/approval-route-permission-gate.test.mjs
          node --test ../frontend/tests/control-plane-v2-platform-access-contract.test.mjs

      - name: Install Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run authority-named school IAM E2E
        working-directory: e2e
        run: |
          npx playwright test \
            specs/system-role-security-change.spec.mjs \
            specs/system-effective-access.spec.mjs \
            --workers=1

      - name: Validate and freeze school IAM evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ['E2E_EXPECTED_SHA']
          role = json.loads(Path('e2e/test-results/system-role-security-change-evidence.json').read_text(encoding='utf-8'))
          access = json.loads(Path('e2e/test-results/system-effective-access-evidence.json').read_text(encoding='utf-8'))
          fixture = json.loads(Path('e2e/runtime-fixtures/control-plane-school-iam.json').read_text(encoding='utf-8'))
          for item in (role, access, fixture):
              assert item['headSha'] == expected, (item.get('headSha'), expected)

          assert role['realBrowserLogin'] is True
          assert role['canonicalCustomRoleClone'] is True
          assert role['canonicalRoleAssignment'] is True
          assert role['beforeReasonCode'] == 'PERMISSION_DENIED'
          assert role['reviewRuntimeUnchanged'] is True
          assert role['activationReasonCode'] == 'RESOURCE_CONTEXT_REQUIRED'
          assert role['activationRuntimeMaterialized'] is True
          assert role['activationRevisionDelta'] == 1
          assert role['rollbackReasonCode'] == 'PERMISSION_DENIED'
          assert role['rollbackRevisionDelta'] == 2
          assert role['pinnedAutomaticUpgrade'] is False

          assert access['realDemoSchoolLogin'] is True
          assert access['realUnentitledSchoolLogin'] is True
          assert access['demoSchoolAdminIamReason'] == 'RESOURCE_CONTEXT_REQUIRED'
          assert access['ordinaryTeacherReason'] == 'PERMISSION_DENIED'
          assert access['enterprisePermissionReason'] == 'PERMISSION_NOT_SCHOOL_ASSIGNABLE'
          assert access['platformPermissionReason'] == 'PERMISSION_NOT_SCHOOL_ASSIGNABLE'
          assert access['crossTenantHttpStatus'] in (403, 404)
          assert access['unentitledSchoolAdminReason'] == 'MODULE_NOT_ENTITLED'
          assert access['schoolAdminExplicitPermissionCount'] == fixture['tenantPermissionUniverseCount']
          assert access['schoolAdminExplicitPermissionCount'] > 400

          artifact = {
              'schemaVersion': 1,
              'card': 'CTRL-B8-SCHOOL-FULL-E2E',
              'headSha': expected,
              'legacySchoolAdminWildcardShadowStillPresent': True,
              'legacyWildcardRuntimeReachable': False,
              'runtimeSchoolAdminWildcardStillPresent': False,
              'runtimeSchoolAdminWildcardRetired': True,
              'tenantPermissionUniverseCount': fixture['tenantPermissionUniverseCount'],
              'roleSecurityChange': role,
              'effectiveAccess': access,
              'goldCandidate': True,
          }
          target = Path('artifacts/control-plane/school-iam-full-e2e.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(artifact, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(artifact, ensure_ascii=False, sort_keys=True))
          PY

      - name: Seed real W12 role-projection browser sessions
        working-directory: backend
        run: python scripts/e2e_seed_control_plane_role_projection.py

      - name: Build and start exact-head production staff PC
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          cd frontend
          npm run build
          nohup npm run preview -- --host 127.0.0.1 --port 5174 > ../e2e/runtime-logs/frontend-production.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend-production.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5174/workbench >/dev/null; then exit 0; fi
            sleep 2
          done
          cat ../e2e/runtime-logs/frontend-production.log
          exit 1

      - name: Run W12 production role/menu projection matrix
        working-directory: e2e
        env:
          E2E_STAFF_BASE_URL: http://127.0.0.1:5174
        run: npx playwright test specs/control-plane-role-menu-projection.spec.mjs --workers=1 --retries=0

      - name: Validate W12 role/menu projection evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ['E2E_EXPECTED_SHA']
          evidence = json.loads(Path('e2e/test-results/control-plane-role-projection-evidence.json').read_text(encoding='utf-8'))
          role_security = json.loads(Path('e2e/test-results/system-role-security-change-evidence.json').read_text(encoding='utf-8'))
          effective_access = json.loads(Path('e2e/test-results/system-effective-access-evidence.json').read_text(encoding='utf-8'))
          expected_roles = {
              'SCHOOL_ADMIN', 'SYS_ADMIN', 'ACADEMIC_ADMIN', 'COLLEGE_ADMIN',
              'ACADEMIC_TEACHER', 'STUDENT_AFFAIRS', 'COUNSELOR', 'INTERN_MENTOR',
              'GRADUATION_ADMIN', 'E2E_CUSTOM_MENU', 'PLATFORM_COMMERCIAL',
              'PLATFORM_OPERATIONS', 'PLATFORM_SECURITY_AUDITOR',
              'PLATFORM_SUPER_ADMIN',
          }
          assert evidence['headSha'] == expected
          assert evidence['realSignedBrowserSessions'] is True
          assert evidence['mockSuccess'] is False
          assert evidence['roleCount'] == 14
          roles = evidence['roles']
          assert {item['roleCode'] for item in roles} == expected_roles
          required = {
              'realBrowserRefresh', 'menuVisible', 'menuHidden', 'realClick',
              'directUrlDenied', 'positiveApiAllowed', 'crossPlaneDenied',
              'crossTenantDenied',
          }
          for item in roles:
              assert all(item.get(key) is True for key in required), item
              assert item.get('dataScope'), item
          root = next(item for item in roles if item['roleCode'] == 'PLATFORM_SUPER_ADMIN')
          assert root['productIamRootBrowser'] is True
          assert root['productIamTemplateVisible'] is True
          assert root['roleTemplatePublishMfa'] is True
          assert root['roleTemplateMenuImpact'] is True
          assert root['staleTemplateVersionDenied'] is True
          assert root['roleTemplatePinnedCustomUnaffected'] is True
          assert root['customRoleSaveAndRelog'] is True
          assert root['customRoleStaleVersionDenied'] is True
          assert root['legacyPermissionReadOnlyPreserved'] is True
          assert root['accessExplainFinalDecision'] is True
          school_admin = next(item for item in roles if item['roleCode'] == 'SCHOOL_ADMIN')
          assert school_admin['schoolAdminProductIamDenied'] is True
          assert role_security['headSha'] == expected
          assert effective_access['headSha'] == expected

          journeys = [
              {
                  'id': 'IAM-GJ-01',
                  'name': 'Product IAM root browser and school-plane denial',
                  'assertions': ['productIamRootBrowser', 'productIamTemplateVisible', 'schoolAdminProductIamDenied'],
              },
              {
                  'id': 'IAM-GJ-02',
                  'name': 'RoleTemplate draft impact MFA publish and stale-write denial',
                  'assertions': ['roleTemplatePublishMfa', 'roleTemplateMenuImpact', 'staleTemplateVersionDenied'],
              },
              {
                  'id': 'IAM-GJ-03',
                  'name': 'Pinned custom role remains unchanged after template publish',
                  'assertions': ['roleTemplatePinnedCustomUnaffected'],
              },
              {
                  'id': 'IAM-GJ-04',
                  'name': 'Custom role save stale 409 cache invalidation and password relog',
                  'assertions': ['customRoleSaveAndRelog', 'customRoleStaleVersionDenied'],
              },
              {
                  'id': 'IAM-GJ-05',
                  'name': 'Legacy permission is visible and preserved read-only',
                  'assertions': ['legacyPermissionReadOnlyPreserved'],
              },
              {
                  'id': 'IAM-GJ-06',
                  'name': 'DataScope and cross-tenant effective-access separation',
                  'assertions': ['allRolesHaveDataScope', 'crossTenantDenied', 'moduleEntitlementDenied'],
              },
              {
                  'id': 'IAM-GJ-07',
                  'name': 'Platform duties school roles menu and API cross-plane isolation',
                  'assertions': ['fourteenRealRoles', 'allCrossPlaneDenied', 'allDirectUrlsDenied'],
              },
              {
                  'id': 'IAM-GJ-08',
                  'name': 'Access Explain returns an auditable final decision',
                  'assertions': ['accessExplainFinalDecision', 'roleSecurityActivationAndRollback'],
              },
          ]
          golden = {
              'schemaVersion': 1,
              'card': 'CTRL-IAM-W12-GOLDEN-JOURNEYS',
              'headSha': expected,
              'journeyCount': len(journeys),
              'allSealed': True,
              'evidenceAuthority': ['REAL_BROWSER', 'REAL_API', 'MYSQL', 'REDIS_SESSION_ROTATION'],
              'journeys': [{**item, 'status': 'L4_SEALED'} for item in journeys],
          }

          target = Path('artifacts/control-plane/iam-role-menu-projection-w12.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          golden_target = Path('artifacts/control-plane/iam-golden-journeys-w12.json')
          golden_target.write_text(json.dumps(golden, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps({'headSha': expected, 'roleCount': len(roles), 'w12': 'L4_SEALED'}, sort_keys=True))
          PY

      - name: Re-check wildcard retirement after E2E
        working-directory: backend
        run: |
          python - <<'PY'
          from app.db.session import get_sessionmaker
          from app.services.system_role_shadow_service import active_tenant_permission_codes, published_system_role_permissions
          db = get_sessionmaker()()
          try:
              runtime = set(published_system_role_permissions(db, 'SCHOOL_ADMIN'))
          finally:
              db.close()
          assert runtime == set(active_tenant_permission_codes())
          assert '*' not in runtime
          PY

      - name: Upload school IAM Gold candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-school-iam-e2e-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/control-plane/school-iam-full-e2e.json
            artifacts/control-plane/school-iam-permission-catalog.json
            artifacts/control-plane/iam-role-menu-projection-w12.json
            artifacts/control-plane/iam-golden-journeys-w12.json
            e2e/test-results/
            e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
