name: PR264 integration preparation (not a release gate)
on:
  push:
    branches: [codex/academic-affairs-delivery-20260907]
    paths: [.github/workflows/pr264-repair-inspect.yml]
permissions:
  contents: write
concurrency:
  group: pr264-repair-inspection
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'penghaibin9/saas' && github.ref == 'refs/heads/codex/academic-affairs-delivery-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAIN_SHA: b9ef56ff4e29fc76679c590964b7b3273c32d7f2
    steps:
      - name: Fetch frozen integration recipe and current exact head
        shell: bash
        run: |
          set -euo pipefail
          git init -q
          git remote add origin https://github.com/penghaibin9/saas.git
          git fetch --quiet --no-tags origin "$GITHUB_SHA" "$MAIN_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name PR264-Repair
          git config user.email pr264-repair@users.noreply.github.com
          python -m pip install --quiet PyYAML==6.0.3
          python - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          raw=subprocess.check_output(['git','show','2a88cf3a91d28c12cc8245ad6e6f0ce326eb3ebf:.github/workflows/pr264-repair-inspect.yml']).decode()
          steps=yaml.safe_load(raw)['jobs']['prepare']['steps']
          names={'Reconcile the fourteen reviewed conflicts without discarding either business delivery':'merge', 'Regenerate derived navigation from the merged sources':'generate', 'Run complete frontend unit suite on the integration candidate':'units', 'Publish inspectable Git objects only (never update any branch)':'publish'}
          for step in steps:
              if step.get('name') not in names: continue
              script=step['run']
              if names[step['name']]=='merge':
                  old="r'^<<<<<<< .*\\n(.*?)^=======\\n(.*?)^>>>>>>> .*\\n'"
                  new="r'^<<<<<<< [^\\n]*\\n(.*?)^=======\\n(.*?)^>>>>>>> [^\\n]*\\n'"
                  assert script.count(old)==1
                  script=script.replace(old,new)
              Path('/tmp/pr264-'+names[step['name']]+'.sh').write_text(script)
          PY
          git -c core.quotePath=false merge --no-commit --no-ff "$MAIN_SHA" || test -n "$(git diff --name-only --diff-filter=U)"
          bash /tmp/pr264-merge.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Generate merged source contracts
        run: bash /tmp/pr264-generate.sh
      - name: Full frontend unit suite on integration candidate
        id: units
        run: bash /tmp/pr264-units.sh
      - name: Preserve inspectable candidate objects without moving the branch
        if: always() && steps.units.outputs.exit_code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          UNIT_EXIT: ${{ steps.units.outputs.exit_code }}
        run: bash /tmp/pr264-publish.sh
      - name: Archive exact tracked candidate source and test log
        if: always() && steps.units.outputs.exit_code != ''
        run: |
          git archive --format=tar "$(git write-tree)" | gzip > /tmp/pr264-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.units.outputs.exit_code != ''
        with:
          name: pr264-integration-source-${{ github.sha }}
          path: |
            /tmp/pr264-source.tar.gz
            /tmp/pr264-frontend-tests.log
          retention-days: 3
          if-no-files-found: error
