jobs:
  employment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: employment_ci_only
          MYSQL_DATABASE: internship_employment_test_ci
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pemployment_ci_only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      PYTHONPATH: products/internship-platform/backend
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://root:employment_ci_only@127.0.0.1:3306/internship_employment_test_ci?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_KEY_PREFIX: internship-employment-ci
      GAP09_MYSQL_ACCEPTANCE: "1"
      EXPECTED_ALEMBIC_REVISION: ix0036
      FILE_STORAGE_DIR: /tmp/internship-employment-ci-files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend and generate ephemeral test keys
        run: |
          python -m pip install -r products/internship-platform/backend/requirements.txt
          python - <<'PY'
          import os, secrets
          from cryptography.fernet import Fernet
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('FIELD_ENCRYPTION_KEY='+Fernet.generate_key().decode()+'\n')
              output.write('SENSITIVE_SEARCH_HMAC_KEY='+secrets.token_hex(32)+'\n')
              output.write('JWT_SECRET='+secrets.token_hex(48)+'\n')
          PY
      - name: 安装签到中文水印字库
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Migrate isolated MySQL and verify current revision
        run: |
          python products/internship-platform/scripts/check_schema_revision_contract.py
          python products/internship-platform/scripts/check_w2_import_closure.py
          pytest -q products/internship-platform/backend/tests/test_standalone_import_closure.py
          alembic -c products/internship-platform/backend/alembic.ini upgrade head
      - name: Exercise normal-role employment, archives, basic facts, attachments, notices and write transactions
        run: |
          mkdir -p /tmp/internship-employment-ci-evidence
          pytest --noconftest -q products/internship-platform/backend/tests/test_xlsx_stream_bounds.py products/internship-platform/backend/tests/test_file_office_mime_unit.py products/internship-platform/backend/tests/test_internship_material_collection_unit.py products/internship-platform/backend/tests/test_material_shared_wiring_unit.py products/internship-platform/backend/tests/test_report_pagination_wiring_unit.py products/internship-platform/backend/tests/test_shared_file_scan_and_org_scope_unit.py products/internship-platform/backend/tests/test_teacher_guidance_batch_receipt_unit.py --junitxml=/tmp/internship-employment-ci-evidence/unit-regressions.xml
          pytest -q products/internship-platform/backend/tests/test_checkin_coordinate_mysql.py products/internship-platform/backend/tests/test_checkin_watermark_layout.py products/internship-platform/backend/tests/test_teacher_checkin_photo_mysql.py --junitxml=/tmp/internship-employment-ci-evidence/checkin-photo.xml
          pytest -q products/internship-platform/backend/tests/test_teacher_checkin_fence_mysql.py products/internship-platform/backend/tests/test_teacher_checkin_rule_contract.py --junitxml=/tmp/internship-employment-ci-evidence/teacher-checkin-fence.xml
          pytest -q products/internship-platform/backend/tests/test_teacher_checkin_history_mysql.py --junitxml=/tmp/internship-employment-ci-evidence/teacher-checkin-history.xml
          pytest -q products/internship-platform/backend/tests/test_material_submission_mysql.py products/internship-platform/backend/tests/test_internship_insurance_detail.py --junitxml=/tmp/internship-employment-ci-evidence/material-submission.xml
          pytest -q products/internship-platform/backend/tests/test_yiyang_tm05_review_scope_mysql.py -W error::sqlalchemy.exc.SAWarning --junitxml=/tmp/internship-employment-ci-evidence/teacher-application-scope.xml
          pytest --noconftest -q products/internship-platform/backend/tests/test_internship_change_resubmit_mysql.py products/internship-platform/backend/tests/test_internship_mobile_consent_mysql.py products/internship-platform/backend/tests/test_internship_insurance_renewal_mysql.py products/internship-platform/backend/tests/test_internship_student_agreement_pdf_mysql.py -W error::sqlalchemy.exc.SAWarning --junitxml=/tmp/internship-employment-ci-evidence/change-consent.xml
          python - <<'PY'
          from xml.etree import ElementTree
          suites=list(ElementTree.parse('/tmp/internship-employment-ci-evidence/change-consent.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests',0)) for s in suites)==13
          assert all(int(s.get(k,0))==0 for s in suites for k in ('errors','failures','skipped'))
          PY
          pytest --noconftest -q products/internship-platform/backend/tests/test_score_report_source_rules.py products/internship-platform/backend/tests/test_student_support_feedback_unit.py products/internship-platform/backend/tests/test_student_feedback_file_access_unit.py products/internship-platform/backend/tests/test_student_makeup_file_access_unit.py products/internship-platform/backend/tests/test_internship_change_history.py products/internship-platform/backend/tests/test_change_export.py --junitxml=/tmp/internship-employment-ci-evidence/core-flow-new-rules.xml
          python - <<'PY'
