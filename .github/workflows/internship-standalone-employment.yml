          python - <<'PY'
          from xml.etree import ElementTree
          suites=list(ElementTree.parse('/tmp/internship-employment-ci-evidence/teacher-guidance-story.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests',0)) for s in suites)==25
