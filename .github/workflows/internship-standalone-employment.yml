          PY
          pytest --noconftest -q products/internship-platform/backend/tests/test_security_file_regressions.py::FileSecurityTest::test_largest_legal_report_can_reserve_its_last_attachment products/internship-platform/backend/tests/test_security_file_regressions.py::FileSecurityTest::test_temp_count_and_bytes_include_inflight_reservations products/internship-platform/backend/tests/test_security_file_regressions.py::FileSecurityTest::test_reservation_is_committed_with_expiry_before_return products/internship-platform/backend/tests/test_security_file_regressions.py::FileSecurityTest::test_upload_reserves_before_bytes_when_full products/internship-platform/backend/tests/test_report_attachment_quota_mysql.py::test_two_connections_compete_for_last_legal_report_attachment_slot --junitxml=/tmp/internship-employment-ci-evidence/report-attachment-quota.xml
