          suites=list(ElementTree.parse('/tmp/internship-employment-ci-evidence/core-flow-new-rules.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests',0)) for s in suites)==50
          assert all(int(s.get(k,0))==0 for s in suites for k in ('errors','failures','skipped'))
          PY
          pytest --noconftest -q products/internship-platform/backend/tests/test_score_report_source_mysql.py products/internship-platform/backend/tests/test_student_application_catalog_mysql.py products/internship-platform/backend/tests/test_student_support_story_mysql.py products/internship-platform/backend/tests/test_student_feedback_context_mysql.py products/internship-platform/backend/tests/test_student_makeup_context_story_mysql.py products/internship-platform/backend/tests/test_change_export_mysql.py --junitxml=/tmp/internship-employment-ci-evidence/core-flow-new-mysql.xml
          python - <<'PY'
          from xml.etree import ElementTree
          suites=list(ElementTree.parse('/tmp/internship-employment-ci-evidence/core-flow-new-mysql.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests',0)) for s in suites)==24
