          PY
          pytest --noconftest -q products/internship-platform/backend/tests/test_report_count_rules.py products/internship-platform/backend/tests/test_report_count_consistency_mysql.py products/internship-platform/backend/tests/test_internship_application_filters_mysql.py --junitxml=/tmp/internship-employment-ci-evidence/report-application-contracts.xml
          python - <<'PY'
          from xml.etree import ElementTree
          suites=list(ElementTree.parse('/tmp/internship-employment-ci-evidence/report-application-contracts.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests',0)) for s in suites)==32
          assert all(int(s.get(k,0))==0 for s in suites for k in ('errors','failures','skipped'))
          PY
          pytest --noconftest -q products/internship-platform/backend/tests/test_teacher_todo_report_projection.py products/internship-platform/backend/tests/test_enterprise_member_admin_unit.py products/internship-platform/backend/tests/test_enterprise_member_onboarding_mysql.py products/internship-platform/backend/tests/test_internship_existing_member_invite.py products/internship-platform/backend/tests/test_student_handoff_mysql.py products/internship-platform/backend/tests/test_position_readiness_mysql.py --junitxml=/tmp/internship-employment-ci-evidence/handoff-members.xml
          python - <<'PY'
