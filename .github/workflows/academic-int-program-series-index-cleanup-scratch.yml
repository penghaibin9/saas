name: Academic INT Program Series Index Cleanup Scratch

on:
  push:
    branches:
      - tmp/academic-int-program-series-index-cleanup-scratch-20260818
    paths:
      - '.github/workflows/academic-int-program-series-index-cleanup-scratch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact candidate guard and cleanup
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "002b361cbf5a53a91a2bf8a7c08834e4f9d3d3d5"
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/models/academic_affairs.py')
          text = path.read_text(encoding='utf-8')
          old = '''    series_key: Mapped[str | None] = mapped_column(\n        String(64), nullable=True, index=True,\n        comment="Stable Program series identity; unresolved historical rows stay NULL",\n    )\n'''
          new = '''    series_key: Mapped[str | None] = mapped_column(\n        String(64), nullable=True,\n        comment="Stable Program series identity; unresolved historical rows stay NULL",\n    )\n'''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- backend/app/models/academic_affairs.py

      - name: Commit model-only cleanup to scratch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/models/academic_affairs.py
          test "$(git diff --cached --name-only)" = "backend/app/models/academic_affairs.py"
          git commit -m "build(academic-int): align Program series ORM with Alembic"
          git push origin HEAD:tmp/academic-int-program-series-index-cleanup-scratch-20260818
