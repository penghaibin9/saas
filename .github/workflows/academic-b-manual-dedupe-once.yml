name: Academic B exact manual overlap recovery once

on:
  push:
    branches: [agent/academic-b-schedule-selection]
    paths:
      - '.github/workflows/academic-b-manual-dedupe-once.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-b-schedule-selection
          fetch-depth: 0
      - name: Recover exact source by removing adjacent duplicated context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          parts_dir = Path('.tmp/academic-b-manual.text-parts')
          files = sorted(p for p in parts_dir.iterdir() if p.is_file())
          assert len(files) == 9, [p.name for p in files]
          chunks = [p.read_bytes() for p in files]
          out = bytearray(chunks[0])
          overlaps = []
          for i, chunk in enumerate(chunks[1:], 1):
              max_k = min(len(out), len(chunk), 20000)
              found = 0
              # choose the largest exact suffix/prefix overlap; old parts were cut with read-context overlap.
              for k in range(max_k, 0, -1):
                  if out[-k:] == chunk[:k]:
                      found = k
                      break
              overlaps.append(found)
              out.extend(chunk[found:])
          digest = hashlib.sha256(out).hexdigest()
          print('overlaps=', overlaps)
          print('size=', len(out), 'sha256=', digest)
          assert len(out) == 341157, len(out)
          assert digest == 'b78af9dbdc1da5067a7cd1fc05e32f1121d5662e9661bc6f46eb4d7dc0d02999', digest
          target = Path('docs/06-开发施工与质量验收/施工总册/B_教务Schedule_Selection_当前代码精确施工总册_V2.1_20260816.md')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(out)
          PY
      - name: Commit exact manual and remove all transport residue
        shell: bash
        run: |
          set -euo pipefail
          TARGET='docs/06-开发施工与质量验收/施工总册/B_教务Schedule_Selection_当前代码精确施工总册_V2.1_20260816.md'
          test "$(wc -c < "$TARGET" | tr -d ' ')" = '341157'
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = 'b78af9dbdc1da5067a7cd1fc05e32f1121d5662e9661bc6f46eb4d7dc0d02999'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$TARGET"
          git rm -r --ignore-unmatch -- \
            .tmp/academic-b-manual.md.gz.b64 \
            .tmp/academic-b-manual.parts \
            .tmp/academic-b-manual.text-parts \
            .github/workflows/academic-b-materialize-manual-once.yml \
            .github/workflows/academic-b-manual-dedupe-once.yml
          git commit -m 'docs(academic-b): add exact V2.1 construction manual'
          git push origin HEAD:agent/academic-b-schedule-selection
