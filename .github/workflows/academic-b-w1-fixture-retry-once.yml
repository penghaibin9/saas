name: Academic B W1 canonical fixture retry once

on:
  push:
    branches: [agent/academic-b-schedule-selection]
    paths:
      - '.github/workflows/academic-b-w1-fixture-retry-once.yml'

permissions:
  contents: write

env:
  APP_ENV: test
  DB_ENABLED: 'true'
  MOCK_LOGIN_ENABLED: 'true'
  JWT_SECRET: academic-b-w1-canonical-fixture-secret-at-least-32-bytes
  DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4
  TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test?charset=utf8mb4

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/academic-b-schedule-selection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reapply W1 patch and repair only the invalid fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/academic-b-w1-construction-once.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if 'name: Apply W1 fail-closed and pure-preflight patch' in line)
          run_at = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
          body = []
          for line in source[run_at + 1:]:
              if line.startswith('      - name:'):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/w1-apply.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash /tmp/w1-apply.sh
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/tests/test_aa_selection_preflight_w1.py')
          text = p.read_text(encoding='utf-8')
          old = 'student_status="ENROLLED"'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'student_status="REGISTERED"', 1), encoding='utf-8')
          PY
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run W1 targeted contracts on real MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          pytest -q -p no:warnings \
            tests/test_aa_selection_preflight_w1.py \
            tests/test_stage_d_selection_trace.py \
            tests/test_aa_selection_student_guard.py \
            --maxfail=1
      - name: Commit validated W1 slice and remove temporary runners
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            backend/app/modules/academic_affairs/services/academic_affairs_selection_service.py \
            backend/app/modules/academic_affairs/services/academic_affairs_selection_core_service.py \
            backend/app/modules/academic_affairs/services/academic_affairs_selection_final_service.py \
            backend/app/modules/academic_affairs/routers/academic_selection_final_router.py \
            backend/tests/test_aa_selection_preflight_w1.py
          git rm --ignore-unmatch -- \
            .github/workflows/academic-b-w1-construction-once.yml \
            .github/workflows/academic-b-w1-mysql-rerun-once.yml \
            .github/workflows/academic-b-w1-fixture-retry-once.yml
          git commit -m 'fix(academic-b): make selection validation fail closed'
          git push origin HEAD:agent/academic-b-schedule-selection
