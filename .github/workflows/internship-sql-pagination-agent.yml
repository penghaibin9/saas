name: Internship SQL Pagination Agent

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: internship-sql-pagination-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/internship-production-hardening-20260803'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply SQL pagination patch
        run: |
          if [ -f scripts/agent/apply_internship_sql_pagination.py ]; then
            python scripts/agent/apply_internship_sql_pagination.py
          else
            echo 'pagination patch script already consumed'
          fi
      - name: Validate patched files
        run: |
          python -m py_compile \
            backend/app/modules/internship/services/internship_leave_service.py \
            backend/app/modules/internship/services/internship_makeup_service.py \
            backend/app/modules/internship/services/internship_insurance_service.py \
            backend/app/modules/internship/services/internship_application_service.py \
            backend/tests/test_internship_sql_pagination_static.py
          git diff --check
      - name: Commit pagination changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/agent/apply_internship_sql_pagination.py
          git add -u
          if [ -f backend/tests/test_internship_sql_pagination_static.py ]; then
            git add backend/tests/test_internship_sql_pagination_static.py
          fi
          if git diff --cached --quiet; then
            echo 'pagination patch already committed'
            exit 0
          fi
          git commit -m 'perf: paginate internship ledgers in MySQL'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
