name: Internship RC IX-011 Browser First

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/scripts/e2e_seed_internship_agreement_sandbox.py'
      - 'backend/scripts/e2e_verify_internship_agreement_db.py'
      - 'backend/app/api/v1/route_registration.py'
      - 'backend/app/modules/internship/routers/internship_agreement_document.py'
      - 'backend/app/modules/internship/services/internship_agreement_service.py'
      - 'backend/app/modules/internship/services/internship_agreement_template_service.py'
      - 'backend/app/student_portal/internship_router.py'
      - 'backend/tests/test_internship_agreement_document_route_registration.py'
      - 'frontend/src/modules/internship/views/AgreementView.vue'
      - 'frontend/src/modules/internship/views/AgreementDetailView.vue'
      - 'frontend/src/modules/internship/api/agreement.api.js'
      - 'student-portal/src/views/internship/InternshipView.vue'
      - 'student-portal/src/services/internshipCoreApi.js'
      - 'miniapp/src/pages/student/internship/agreement/index.vue'
      - 'miniapp/src/pages/teacher/agreement-confirm/index.vue'
      - 'miniapp/src/services/internshipApi.js'
      - 'miniapp/src/services/studentApi.js'
      - 'e2e/specs/internship-agreement-lifecycle-audit.spec.mjs'
      - '.github/actions/internship-e2e-*/**'
      - '.github/workflows/internship-rc-agreement-browser-first.yml'
  workflow_dispatch:

concurrency:
  group: internship-rc-ix011-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ix-011:
    name: IX-011 / real MySQL / Staff+Student PC+Student+Teacher Mini browser
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/13
      REDIS_KEY_PREFIX: internship-rc-ix011
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: internship-rc-ix011-e2e-only-not-production
      JWT_SECRET_KEY: internship-rc-ix011-e2e-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_STUDENT_MINI_BASE_URL: http://127.0.0.1:5188
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact RC SHA
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "actual=$ACTUAL"
          echo "expected=$E2E_EXPECTED_SHA"
          test "$ACTUAL" = "$E2E_EXPECTED_SHA"

      - name: Prepare shared E2E toolchain
        uses: ./.github/actions/internship-e2e-toolchain
        with:
          node-cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json
            miniapp/package-lock.json

      - name: Seal agreement PDF route contract
        working-directory: backend
        run: pytest tests/test_internship_agreement_document_route_registration.py -q -p no:warnings

      - name: Migrate isolated real MySQL
        uses: ./.github/actions/internship-e2e-mysql-migrate
        with:
          verify-schema-parity: 'true'

      - name: Bootstrap shared browser runtime
        uses: ./.github/actions/internship-e2e-browser-runtime

      - name: Seed IX-011 prerequisites only
        working-directory: backend
        run: python scripts/e2e_seed_internship_agreement_sandbox.py

      - name: Start shared browser applications
        uses: ./.github/actions/internship-e2e-app-start
        with:
          start-staff: 'true'
          start-student: 'true'
          start-miniapp: 'true'
          miniapp-log-name: miniapp.log
          miniapp-pid-name: miniapp.pid

      - name: Wait for all browser applications
        uses: ./.github/actions/internship-e2e-wait-apps
        with:
          urls: |
            http://127.0.0.1:5173/login
            http://127.0.0.1:5199/portal/login
            http://127.0.0.1:5188/

      - name: Reassert Browser First runtime safety
        run: |
          set -euo pipefail
          test "$MOCK_LOGIN_ENABLED" = 'false'
          python - <<'PY'
          import os
          url = os.environ['DATABASE_URL'].lower()
          assert url.startswith('mysql')
          assert 'e2e' in url or 'test' in url
          assert 'prod' not in url and 'staging' not in url
          print('[ix-011] real MySQL + mock login disabled')
          PY

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Browser First IX-011 only
        working-directory: e2e
        run: >-
          npx playwright test
          specs/internship-agreement-lifecycle-audit.spec.mjs
          --workers=1

      - name: Upload IX-011 browser artifacts
        if: always()
        uses: ./.github/actions/internship-e2e-upload-artifacts
        with:
          artifact-prefix: internship-rc-ix011
