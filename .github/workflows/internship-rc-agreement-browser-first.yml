name: Internship RC IX-011 Browser First

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/scripts/e2e_seed_internship_agreement_sandbox.py'
      - 'backend/scripts/e2e_verify_internship_agreement_db.py'
      - 'backend/app/modules/internship/services/internship_agreement_service.py'
      - 'backend/app/modules/internship/services/internship_agreement_template_service.py'
      - 'backend/app/student_portal/internship_router.py'
      - 'frontend/src/modules/internship/views/AgreementView.vue'
      - 'frontend/src/modules/internship/views/AgreementDetailView.vue'
      - 'frontend/src/modules/internship/api/agreement.api.js'
      - 'student-portal/src/views/internship/InternshipView.vue'
      - 'student-portal/src/services/internshipCoreApi.js'
      - 'miniapp/src/pages/student/internship/agreement/index.vue'
      - 'miniapp/src/pages/teacher/agreement-confirm/index.vue'
      - 'miniapp/src/services/internshipApi.js'
      - 'miniapp/src/services/studentApi.js'
      - 'e2e/specs/internship-agreement-lifecycle-audit.spec.mjs'
      - '.github/workflows/internship-rc-agreement-browser-first.yml'
  workflow_dispatch:

concurrency:
  group: internship-rc-ix011-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ix-011:
    if: github.event_name != 'pull_request' || github.head_ref == 'fix/internship-final-rc-20260824'
    name: IX-011 / real MySQL / Staff+Student PC+Student+Teacher Mini browser
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root
          MYSQL_DATABASE: student_lifecycle_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      CI: 'true'
      PYTHONPATH: .
      APP_ENV: test
      DEPLOYMENT_MODE: local
      TRUSTED_PROXY_IPS: 127.0.0.1/32
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:e2e_root@127.0.0.1:3306/student_lifecycle_e2e?charset=utf8mb4
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: e2e_root
      DB_NAME: student_lifecycle_e2e
      REDIS_URL: redis://127.0.0.1:6379/13
      REDIS_KEY_PREFIX: internship-rc-ix011
      REDIS_CONNECT_TIMEOUT: '2'
      REDIS_SOCKET_TIMEOUT: '2'
      JWT_SECRET: internship-rc-ix011-e2e-only-not-production
      JWT_SECRET_KEY: internship-rc-ix011-e2e-only-not-production
      MOCK_LOGIN_ENABLED: 'false'
      SMS_ENABLED: 'false'
      SCHEDULER_MODE: external
      E2E_ALLOW_DESTRUCTIVE_TESTS: 'true'
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_STAFF_BASE_URL: http://127.0.0.1:5173
      E2E_STUDENT_BASE_URL: http://127.0.0.1:5199/portal
      E2E_STUDENT_MINI_BASE_URL: http://127.0.0.1:5188
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact RC SHA
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "actual=$ACTUAL"
          echo "expected=$E2E_EXPECTED_SHA"
          test "$ACTUAL" = "$E2E_EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            student-portal/package-lock.json
            miniapp/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrate isolated real MySQL
        working-directory: backend
        run: |
          set -euo pipefail
          HEADS=$(python -m alembic heads | grep -c '(head)')
          python -m alembic heads
          test "$HEADS" = '1'
          mysql -h 127.0.0.1 -uroot -pe2e_root -e \
            "ALTER DATABASE student_lifecycle_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          python -m alembic upgrade head
          python -m alembic current
          python ../scripts/check/check-migrated-schema-parity.py

      - name: Replay production School IAM Authority
        working-directory: backend
        run: python scripts/bootstrap_control_plane_school_iam_authority.py

      - name: Seed isolated tenants and School IAM
        working-directory: backend
        run: |
          python scripts/e2e_seed_playwright_tenants.py
          python scripts/e2e_seed_control_plane_school_iam.py

      - name: Start backend
        run: |
          mkdir -p e2e/runtime-logs
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../e2e/runtime-logs/backend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/backend.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat ../e2e/runtime-logs/backend.log
          exit 1

      - name: Import interaction accounts
        working-directory: backend
        run: |
          python scripts/e2e_bootstrap_graduation_accounts_ci.py
          python scripts/e2e_reset_graduation_passwords.py
          python scripts/e2e_verify_graduation_accounts.py

      - name: Seed IX-011 prerequisites only
        working-directory: backend
        run: python scripts/e2e_seed_internship_agreement_sandbox.py

      - name: Install and start Staff PC
        run: |
          cd frontend
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../e2e/runtime-logs/frontend.log 2>&1 &
          echo $! > ../e2e/runtime-logs/frontend.pid

      - name: Install and start Student PC
        env:
          VITE_BASE: /portal/
          VITE_API_BASE_URL: /
          VITE_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          cd student-portal
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5199 > ../e2e/runtime-logs/student-portal.log 2>&1 &
          echo $! > ../e2e/runtime-logs/student-portal.pid

      - name: Install and start Student+Teacher Mini H5
        env:
          VITE_USE_MOCK: 'false'
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          cd miniapp
          npm ci
          nohup npm run dev:h5 -- --host 127.0.0.1 --port 5188 > ../e2e/runtime-logs/miniapp.log 2>&1 &
          echo $! > ../e2e/runtime-logs/miniapp.pid

      - name: Wait for all browser applications
        run: |
          for url in \
            http://127.0.0.1:5173/login \
            http://127.0.0.1:5199/portal/login \
            http://127.0.0.1:5188/
          do
            ok=''
            for i in {1..60}; do
              if curl -fsS "$url" >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "Application not ready: $url"
              cat e2e/runtime-logs/*.log
              exit 1
            fi
          done

      - name: Reassert Browser First runtime safety
        run: |
          set -euo pipefail
          test "$MOCK_LOGIN_ENABLED" = 'false'
          python - <<'PY'
          import os
          url = os.environ['DATABASE_URL'].lower()
          assert url.startswith('mysql')
          assert 'e2e' in url or 'test' in url
          assert 'prod' not in url and 'staging' not in url
          print('[ix-011] real MySQL + mock login disabled')
          PY

      - name: Install Playwright Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Browser First IX-011 only
        working-directory: e2e
        run: >-
          npx playwright test
          specs/internship-agreement-lifecycle-audit.spec.mjs
          --workers=1

      - name: Upload IX-011 HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-rc-ix011-html-${{ github.run_id }}
          path: e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload IX-011 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-rc-ix011-evidence-${{ github.run_id }}
          path: e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload IX-011 service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-rc-ix011-service-logs-${{ github.run_id }}
          path: e2e/runtime-logs/
          if-no-files-found: warn
          retention-days: 14
