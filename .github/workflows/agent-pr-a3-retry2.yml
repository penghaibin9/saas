name: Agent PR-A3 retry2

on:
  push:
    branches:
      - fix/system-audit-rbac-atomicity-20260813

permissions:
  contents: write

concurrency:
  group: agent-pr-a3-retry2
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: test
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: '1'
      FILE_STORAGE_PROVIDER: local
      LOCAL_UPLOAD_DIR: /tmp/saas-ci-uploads
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/system-audit-rbac-atomicity-20260813
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Reapply A3 and fix proven red roots
        shell: bash
        run: |
          python - <<'PY'
          import ast, base64, zlib
          from pathlib import Path

          src = Path('.github/workflows/agent-pr-a3-one-shot.yml').read_text(encoding='utf-8')
          payload_line = next(line.strip() for line in src.splitlines() if line.strip().startswith('payload = '))
          payload = ast.literal_eval(payload_line.split('=', 1)[1].strip())
          raw = base64.b64decode(payload)
          script = zlib.decompress(raw[10:-8], -zlib.MAX_WBITS)
          Path('.agent_patch_a3.py').write_bytes(script)
          PY
          python .agent_patch_a3.py
          python - <<'PY'
          from pathlib import Path

          audit = Path('backend/app/services/audit_log.py')
          text = audit.read_text(encoding='utf-8')
          actions = [
              'ROLE_ASSIGNMENT_GRANT',
              'ROLE_ASSIGNMENT_REVOKE',
              'ROLE_ASSIGNMENT_TRANSFER',
              'ROLE_ASSIGNMENT_REVIEW',
              'ROLE_ASSIGNMENT_EXPIRE',
          ]
          set_start = text.index('CRITICAL_ACTIONS = frozenset({')
          set_end = text.index('})', set_start)
          block = text[set_start:set_end]
          missing = [a for a in actions if f'"{a}"' not in block]
          if missing:
              text = text[:set_end] + ''.join(f'    "{a}",\n' for a in missing) + text[set_end:]
              audit.write_text(text, encoding='utf-8')

          tests = Path('backend/tests/test_role_assignment_validity.py')
          text = tests.read_text(encoding='utf-8')
          helper_start = text.index('def _ensure_tenant(')
          helper_end = text.index('\n\ndef ', helper_start)
          helper = text[helper_start:helper_end]
          if 'tenant_code="demo"' in helper:
              helper = helper.replace('tenant_code="demo"', 'tenant_code=f"demo-{int(tenant_id)}"', 1)
          elif 'tenant_code=f"demo-{int(tenant_id)}"' not in helper:
              raise SystemExit('tenant fixture no longer has the expected tenant_code field')
          text = text[:helper_start] + helper + text[helper_end:]
          tests.write_text(text, encoding='utf-8')

          service = Path('backend/app/services/role_assignment_service.py')
          text = service.read_text(encoding='utf-8')
          stale = '_record_expiry_audit(db, tid, touched, source="READ_EFFECTIVE_ASSIGNMENTS")'
          canonical = '_audit_expiry_in_session(db, tid, touched, source="READ_EFFECTIVE_ASSIGNMENTS")'
          if stale in text:
              text = text.replace(stale, canonical, 1)
          elif canonical not in text:
              raise SystemExit('expiry audit call no longer matches either expected form')
          service.write_text(text, encoding='utf-8')
          PY
      - name: Compile A3 Python
        run: |
          python -m py_compile \
            backend/app/services/audit_log.py \
            backend/app/services/db_service.py \
            backend/app/services/role_assignment_service.py \
            backend/tests/test_role_assignment_validity.py \
            backend/tests/test_audit_fail_closed_actions.py
      - name: Run A3 MySQL lifecycle and audit contracts
        working-directory: backend
        run: |
          pytest \
            tests/test_role_assignment_privilege_boundary.py \
            tests/test_role_assignment_validity.py \
            tests/test_critical_audit_atomicity.py \
            tests/test_audit_fail_closed_actions.py \
            tests/test_audit_evidence_integrity.py \
            -q -p no:warnings
      - name: Commit exact A3 scope and remove staging workflows
        shell: bash
        run: |
          rm .agent_patch_a3.py \
             .github/workflows/agent-pr-a3-one-shot.yml \
             .github/workflows/agent-pr-a3-retry.yml \
             .github/workflows/agent-pr-a3-retry2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/services/audit_log.py \
            backend/app/services/db_service.py \
            backend/app/services/role_assignment_service.py \
            backend/tests/test_role_assignment_validity.py \
            backend/tests/test_audit_fail_closed_actions.py \
            .github/workflows/agent-pr-a3-one-shot.yml \
            .github/workflows/agent-pr-a3-retry.yml \
            .github/workflows/agent-pr-a3-retry2.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(rbac): make role assignment lifecycle atomic"
          git push origin HEAD:fix/system-audit-rbac-atomicity-20260813
