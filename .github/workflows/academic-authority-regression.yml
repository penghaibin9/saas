name: Academic authority MySQL regressions
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/modules/academic_affairs/**'
      - 'backend/app/models/academic_affairs.py'
      - 'backend/app/services/org_*.py'
      - 'backend/app/core/academic_term_authority_lock.py'
      - 'backend/alembic/versions/**'
      - 'backend/tests/test_aa_*.py'
      - '.github/workflows/academic-authority-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academic-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mysql-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: academic_test_only
          MYSQL_DATABASE: student_lifecycle_academic_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pacademic_test_only" --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      APP_ENV: test
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://root:academic_test_only@127.0.0.1:3306/student_lifecycle_academic_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://root:academic_test_only@127.0.0.1:3306/student_lifecycle_academic_test?charset=utf8mb4
      FAST_TEST_SCHEMA: '1'
      SCHEDULER_MODE: external
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install frozen dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Require one migration head and upgrade fresh MySQL
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          mkdir -p /tmp/academic-regression
          git rev-parse HEAD | tee /tmp/academic-regression/head.txt
          python - <<'PY'
          import pymysql
          connection = pymysql.connect(host='127.0.0.1', user='root', password='academic_test_only')
          with connection.cursor() as cursor:
              cursor.execute('SET GLOBAL log_bin_trust_function_creators = 1')
          connection.close()
          PY
          (cd backend && python -m alembic heads) | tee /tmp/academic-regression/heads.log
          test "$(grep -c '(head)' /tmp/academic-regression/heads.log)" -eq 1
          (cd backend && python -m alembic upgrade head) 2>&1 | tee /tmp/academic-regression/migration.log
          python scripts/check/check-migrated-schema-parity.py
      - name: Verify additive columns on migrated schema before test fixtures reset data
        run: |
          PYTHONPATH=backend python - <<'PY'
          from sqlalchemy import create_engine, inspect
          import os
          engine = create_engine(os.environ['DATABASE_URL'])
          cols = {c['name']: c for c in inspect(engine).get_columns('t_aa_class_adjustment_request')}
          assert cols['from_class_ids']['type'].length == 500
          assert cols['check_result_json']['type'].length == 2000
          assert cols['from_class_ids_expanded']['nullable']
          assert cols['check_result_expanded']['nullable']
          print('Fresh Alembic schema preserves both N-1 VARCHAR columns and nullable evidence expansion.')
          engine.dispose()
          PY
      - name: Run real MySQL organization and term regressions (ORM-reset fixtures)
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          cd backend
          pytest -q -p no:warnings --junitxml=/tmp/academic-regression/results.xml \
            tests/test_aa_term_current_mysql.py \
            tests/test_aa_orgs.py tests/test_aa_orgs_tier1_r2.py \
            tests/test_aa_org_adjustment_roundtrip.py tests/test_aa_org_adjustment_expand_contract.py \
            tests/test_org_master_governance.py tests/test_aa_classroom_bulk.py \
            tests/test_aa_student_portal_design_tokens.py tests/test_tenant_scoped_helpers.py \
            2>&1 | tee /tmp/academic-regression/pytest.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: academic-authority-${{ github.run_id }}
          path: /tmp/academic-regression/
          retention-days: 7
          if-no-files-found: warn
