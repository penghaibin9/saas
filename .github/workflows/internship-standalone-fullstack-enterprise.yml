name: Internship Standalone Fullstack Enterprise Browser

on:
  workflow_dispatch:
  push:
    branches:
      - feat/internship-standalone-yiyang-v1
    paths:
      - "products/internship-platform/backend/app/**"
      - "products/internship-platform/backend/alembic/**"
      - "products/internship-platform/enterprise-web/src/**"
      - "products/internship-platform/enterprise-web/e2e-fullstack-enterprise/**"
      - "products/internship-platform/enterprise-web/playwright.fullstack-enterprise.config.mjs"
      - "products/internship-platform/scripts/seed_fullstack_enterprise_browser_ci.py"
      - ".github/workflows/internship-standalone-fullstack-enterprise.yml"

jobs:
  fullstack-enterprise:
    name: Real MySQL backend + enterprise Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: enterprise_root
          MYSQL_DATABASE: internship_enterprise_fullstack
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -penterprise_root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      PYTHONPATH: products/internship-platform/backend
      APP_ENV: ci
      DATABASE_URL: mysql+pymysql://root:enterprise_root@127.0.0.1:3306/internship_enterprise_fullstack?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_KEY_PREFIX: internship-standalone:fullstack-enterprise
      JWT_SECRET: standalone-fullstack-enterprise-jwt-secret-20260929
      SENSITIVE_SEARCH_HMAC_KEY: standalone-fullstack-enterprise-hmac-key
      EXPECTED_ALEMBIC_REVISION: ix0023
      FILE_STORAGE_DIR: /tmp/internship-fullstack-enterprise-files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: products/internship-platform/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: products/internship-platform/enterprise-web/package-lock.json

      - name: Install backend and seed real enterprise context
        run: |
          python -m pip install -r products/internship-platform/backend/requirements.txt
          alembic -c products/internship-platform/backend/alembic.ini upgrade head
          python products/internship-platform/scripts/seed_fullstack_enterprise_browser_ci.py

      - name: Install enterprise frontend
        working-directory: products/internship-platform/enterprise-web
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: products/internship-platform/enterprise-web
        run: npx playwright install --with-deps chromium

      - name: Start real standalone FastAPI
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/internship-enterprise-api.log 2>&1 &
          echo $! > /tmp/internship-enterprise-api.pid
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/tmp/internship-enterprise-ready.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/internship-enterprise-api.log
            exit 1
          fi
          cat /tmp/internship-enterprise-ready.json

      - name: Run no-mock enterprise Chromium journey
        working-directory: products/internship-platform/enterprise-web
        run: npx playwright test -c playwright.fullstack-enterprise.config.mjs

      - name: Upload full-stack enterprise evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internship-standalone-fullstack-enterprise-evidence
          path: products/internship-platform/enterprise-web/test-results-fullstack-enterprise
          if-no-files-found: error
          retention-days: 14

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/internship-enterprise-api.pid ]; then
            kill "$(cat /tmp/internship-enterprise-api.pid)" 2>/dev/null || true
          fi
          if [ -f /tmp/internship-enterprise-api.log ]; then
            tail -n 200 /tmp/internship-enterprise-api.log
          fi
