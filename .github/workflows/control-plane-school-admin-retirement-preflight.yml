name: Control Plane SCHOOL_ADMIN Retirement Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - integration/control-plane-option-b-20260815
    paths:
      - 'backend/app/core/school_admin_permission_resolver.py'
      - 'backend/app/services/system_role_shadow_service.py'
      - 'backend/scripts/check_control_plane_school_admin_retirement_preflight.py'
      - 'backend/tests/test_control_plane_school_admin_retirement_preflight.py'
      - 'shared/contracts/control-plane/school-admin-wildcard-retirement.json'
      - 'shared/contracts/permission-catalog.json'
      - 'shared/contracts/permission-catalog-b8-concrete.json'
      - '.github/workflows/control-plane-school-admin-retirement-preflight.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/app/core/school_admin_permission_resolver.py'
      - 'backend/app/services/system_role_shadow_service.py'
      - 'backend/scripts/check_control_plane_school_admin_retirement_preflight.py'
      - 'backend/tests/test_control_plane_school_admin_retirement_preflight.py'
      - 'shared/contracts/control-plane/school-admin-wildcard-retirement.json'
      - 'shared/contracts/permission-catalog.json'
      - 'shared/contracts/permission-catalog-b8-concrete.json'
      - '.github/workflows/control-plane-school-admin-retirement-preflight.yml'

permissions:
  contents: read

concurrency:
  group: control-plane-school-admin-retirement-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  DB_ENABLED: 'true'
  DB_DRIVER: mysql
  MOCK_LOGIN_ENABLED: 'false'
  JWT_SECRET: control-plane-school-admin-retirement-preflight-secret
  SECRET_KEY: control-plane-school-admin-retirement-preflight-secret
  DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/control_plane_school_admin_retirement?charset=utf8mb4
  TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/control_plane_school_admin_retirement?charset=utf8mb4
  SCHOOL_ADMIN_RETIREMENT_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SCHOOL_ADMIN_RETIREMENT_EVIDENCE_PATH: ../artifacts/control-plane/school-admin-retirement-preflight.json

jobs:
  mysql-retirement-preflight:
    name: Exact-head MySQL SCHOOL_ADMIN retirement preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: control_plane_school_admin_retirement
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Exact branch HEAD assertion
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "actual=$ACTUAL"
          echo "expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Strict concrete Permission Catalog reconciliation
        run: |
          set -euo pipefail
          mkdir -p artifacts/control-plane
          python scripts/check/check-permission-catalog.py --strict-legacy --write artifacts/control-plane/school-admin-retirement-permission-catalog.json

      - name: Install backend and migrate exact schema
        working-directory: backend
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
          alembic current
          python -m py_compile app/core/school_admin_permission_resolver.py
          python -m py_compile scripts/check_control_plane_school_admin_retirement_preflight.py

      - name: Run retirement preflight contracts
        working-directory: backend
        run: |
          pytest -q \
            tests/test_control_plane_b8_shadow.py \
            tests/test_control_plane_school_admin_retirement_preflight.py \
            --disable-warnings

      - name: Run exact-head retirement preflight proof
        working-directory: backend
        run: PYTHONPATH=. python scripts/check_control_plane_school_admin_retirement_preflight.py

      - name: Validate frozen preflight evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          data = json.loads(Path('artifacts/control-plane/school-admin-retirement-preflight.json').read_text(encoding='utf-8'))
          proof = data['preflight']
          assert data['schemaVersion'] == 2
          assert data['card'] == 'CTRL-B8-WILDCARD-RETIREMENT-PREFLIGHT'
          assert data['headSha'] == expected
          assert data['legacySchoolAdminWildcardShadowBaselinePresent'] is True
          assert data['runtimeCutoverState'] == 'NOT_EVALUATED_BY_PREFLIGHT'
          assert data['snapshotReady'] is True
          assert proof['exactSnapshot'] is True
          assert proof['explicitPermissionCount'] == proof['tenantPermissionUniverseCount']
          assert proof['explicitPermissionCount'] > 400
          assert proof['containsRuntimeWildcard'] is False
          assert proof['platformPermissionCount'] == 0
          assert proof['enterprisePermissionCount'] == 0
          assert proof['dbFailurePolicy'] == 'FAIL_CLOSED'
          assert data['shadow']['zeroUnexplainedDrift'] is True
          print(json.dumps(data, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload retirement preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-school-admin-retirement-preflight-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/control-plane/school-admin-retirement-preflight.json
            artifacts/control-plane/school-admin-retirement-permission-catalog.json
          if-no-files-found: warn
          retention-days: 14
