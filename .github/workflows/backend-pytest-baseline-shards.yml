name: Backend pytest debt baseline - 4 shards

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-debt-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-shard:
    name: Backend baseline shard ${{ matrix.shard }}/4
    if: github.head_ref == 'fix/backend-pytest-debt-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/student_lifecycle_test
      FAST_TEST_SCHEMA: "1"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_lifecycle_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography
      - name: Build stable shard manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          python ../scripts/check/list_pytest_shard.py \
            --tests-dir tests \
            --shard-count 4 \
            --shard-index "${{ matrix.shard }}" \
            > "test-results/shard-targets-${{ matrix.shard }}.txt"
          COUNT=$(wc -l < "test-results/shard-targets-${{ matrix.shard }}.txt" | tr -d ' ')
          test "$COUNT" -gt 0
          echo "Shard ${{ matrix.shard }} contains $COUNT test files"
      - name: Run isolated MySQL pytest shard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TARGETS < "test-results/shard-targets-${{ matrix.shard }}.txt"
          XML="test-results/backend-shard-${{ matrix.shard }}.xml"
          RAW_LOG="test-results/pytest-shard-${{ matrix.shard }}.raw.log"
          set +e
          timeout 50m pytest "${TARGETS[@]}" -q -p no:warnings --durations=30 \
            --junitxml="$XML" >"$RAW_LOG" 2>&1
          PYTEST_EXIT=$?
          set -e
          printf '%s\n' "$PYTEST_EXIT" > "test-results/pytest-exit-${{ matrix.shard }}.txt"

          SANITIZE_EXIT=0
          if [ -f "$XML" ]; then
            python ../scripts/check/sanitize_pytest_junit.py "$XML" || SANITIZE_EXIT=$?
          fi
          rm -f "$RAW_LOG"
          if [ "$SANITIZE_EXIT" -ne 0 ]; then
            echo "JUnit sanitization failed for shard ${{ matrix.shard }}"
            exit "$SANITIZE_EXIT"
          fi
          echo "Shard ${{ matrix.shard }} pytest exit code: $PYTEST_EXIT"
      - name: Upload sanitized shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-shard-${{ matrix.shard }}
          path: |
            backend/test-results/backend-shard-${{ matrix.shard }}.xml
            backend/test-results/shard-targets-${{ matrix.shard }}.txt
            backend/test-results/pytest-exit-${{ matrix.shard }}.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve real shard outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS_FILE="test-results/pytest-exit-${{ matrix.shard }}.txt"
          if [ ! -f "$STATUS_FILE" ]; then
            echo "Missing pytest exit status for shard ${{ matrix.shard }}"
            exit 2
          fi
          STATUS=$(cat "$STATUS_FILE")
          if [ "$STATUS" = "0" ]; then
            exit 0
          fi
          if [ "$STATUS" = "1" ]; then
            echo "Shard ${{ matrix.shard }} contains test failures/errors; audit job will classify them."
            exit 1
          fi
          echo "Shard ${{ matrix.shard }} had pytest infrastructure exit code $STATUS"
          exit 2

  aggregate-baseline:
    name: Merge 4 shards and compare main ledger
    if: always() && github.head_ref == 'fix/backend-pytest-debt-20260810'
    needs: backend-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*
          path: .audit-artifacts
          merge-multiple: true
      - name: Audit merged shard result
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/backend-baseline-audit
          set +e
          python scripts/check/audit_backend_shard_results.py \
            --artifact-dir .audit-artifacts \
            --baseline scripts/check/backend-known-failures-main.txt \
            --backend-root backend \
            --output-dir test-results/backend-baseline-audit \
            --expected-shards 4
          AUDIT_EXIT=$?
          set -e
          printf '%s\n' "$AUDIT_EXIT" > test-results/backend-baseline-audit/audit-exit.txt
          if [ -f test-results/backend-baseline-audit/backend-baseline-audit.md ]; then
            cat test-results/backend-baseline-audit/backend-baseline-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload merged baseline audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-baseline-audit
          path: test-results/backend-baseline-audit
          if-no-files-found: error
          retention-days: 14
      - name: Preserve audit outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATUS_FILE="test-results/backend-baseline-audit/audit-exit.txt"
          if [ ! -f "$STATUS_FILE" ]; then
            echo "Baseline audit did not produce an exit status"
            exit 2
          fi
          exit "$(cat "$STATUS_FILE")"
