name: 教务R11真实学期试点闸门

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/alembic/versions/0129_aa_roster_consumer_snapshot.py'
      - 'backend/alembic/versions/0130_aa_dynamic_grade_stats_snapshot.py'
      - 'backend/alembic/versions/0131_aa_real_semester_pilot.py'
      - 'backend/app/models/academic_affairs_roster_consumer.py'
      - 'backend/app/models/academic_affairs_r10.py'
      - 'backend/app/models/academic_affairs_r11.py'
      - 'backend/app/modules/academic_affairs/**'
      - 'backend/tests/test_aa_roster_consumers_r9.py'
      - 'backend/tests/test_aa_dynamic_grade_evidence_snapshot_r10.py'
      - 'backend/tests/test_aa_semester_pilot_r11.py'
      - 'frontend/src/modules/academicAffairs/**'
      - 'student-portal/**'
      - 'miniapp/src/pages/student/academic-affairs/**'
      - 'miniapp/src/pages/teacher/academic-affairs/**'
      - '.github/workflows/academic-affairs-r11.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-affairs-r11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-r11:
    name: R11后端 · MySQL真实证据门禁
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: saas_test
          MYSQL_USER: saas
          MYSQL_PASSWORD: saas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_ENABLED: 'true'
      DATABASE_URL: mysql+pymysql://saas:saas@127.0.0.1:3306/saas_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://saas:saas@127.0.0.1:3306/saas_test?charset=utf8mb4
      JWT_SECRET: ci-academic-affairs-r11-secret
      MOCK_LOGIN_ENABLED: 'false'
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Python语法与导入编译
        working-directory: backend
        run: python -m compileall -q app tests
      - name: Alembic单一head与R11迁移链
        working-directory: backend
        run: |
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
      - name: R9-R11关键合同
        working-directory: backend
        run: >-
          pytest -q
          tests/test_aa_roster_consumers_r9.py
          tests/test_aa_dynamic_grade_evidence_snapshot_r10.py
          tests/test_aa_semester_pilot_r11.py
          --maxfail=1

  teacher-pc-r11:
    name: R11管理PC · test + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  student-pc-r11:
    name: R11学生PC · lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: student-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: student-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  miniapp-r11:
    name: R11微信端 · H5 + 微信构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run build:h5
      - run: npm run build:mp-weixin
