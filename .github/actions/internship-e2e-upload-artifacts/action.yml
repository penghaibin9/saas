name: Internship E2E Upload Artifacts
description: Upload the standard Playwright report, browser evidence, and service logs for an internship acceptance gate.

inputs:
  artifact-prefix:
    description: Exact artifact name prefix used by the calling gate.
    required: true

runs:
  using: composite
  steps:
    - name: Upload Playwright HTML report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-prefix }}-html-${{ github.run_id }}
        path: e2e/playwright-report/
        if-no-files-found: warn
        retention-days: 14

    - name: Upload browser evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-prefix }}-evidence-${{ github.run_id }}
        path: e2e/test-results/
        if-no-files-found: warn
        retention-days: 14

    - name: Upload service logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-prefix }}-service-logs-${{ github.run_id }}
        path: e2e/runtime-logs/
        if-no-files-found: warn
        retention-days: 14
