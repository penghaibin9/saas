  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

        if (/总览|统计|报表|进度/.test(text)) return &#x27;先选择批次、学院、专业或阶段口径，再点待办或异常数字下钻；需要处理时进入对应学生或业务记录。&#x27;;
        if (/批次列表|时间轴|规则配置|材料模板|任务书模板|开题模板/.test(text)) return &#x27;先确认适用批次和专业范围，再维护日期、规则或模板；保存后检查校验，启用/发布后才供后续节点引用。&#x27;;
        if (/学生名单|未选题学生|资格认定/.test(text)) return &#x27;按批次、专业、班级或姓名筛选学生，打开详情核对资格与当前阶段；发现异常后转选题、导师或风险模块处理。&#x27;;
        if (/题目列表|待审核题目/.test(text)) return &#x27;教师先申报题目与容量，管理员从待审核列表核对内容、专业和附件；通过后进入可选题目池，退回必须写原因。&#x27;;
        if (/选题|志愿|匹配|容量冲突|题目调整/.test(text)) return &#x27;先选当前选题轮次，核对学生志愿、题目容量和导师意见；确认匹配或审批变更后，返回学生进度检查阶段是否推进。&#x27;;
        if (/导师|学生分配|分配冲突/.test(text)) return &#x27;先筛未分配学生和可用导师，检查专业、题目和剩余容量；确认分配后由导师确认，冲突项先调整再进入任务书。&#x27;;
        if (/任务书|指导记录|中期检查|规范流程/.test(text)) return &#x27;打开学生过程记录，按当前阶段下达/确认任务书、登记指导或完成中期检查；整改学生必须补交并复查后才能向后推进。&#x27;;
        if (/开题/.test(text)) return &#x27;从待批阅开题进入详情，核对研究背景、方案、计划、成果和附件；填写评语后通过或退回，退回学生修改后再次提交。&#x27;;
        if (/成果|查重|评阅|互查/.test(text)) return &#x27;先核对成果版本和附件，再完成导师批阅、查重和独立评阅；不合格退回整改，全部通过后才能进入答辩。&#x27;;
        if (/答辩|成绩|专家|申诉/.test(text)) return &#x27;先核对答辩组、时间地点、学生和专家回避，再录入并确认评分；系统核算总成绩后复核发布，异议进入申诉复核。&#x27;;
        if (/预警|归档/.test(text)) return &#x27;先处理在途风险或材料缺项，归档清单全部满足后提交审核；归档完成后以只读查询、导出和审计追溯为主。&#x27;;
        return `进入“毕业设计中心 → ${moduleName} → ${item}”，先确认当前批次、学生和阶段，再按页面主按钮办理，最后返回列表核对状态。`;
      }

      function renderRoles() {
        const host = root.querySelector(&#x27;#gd-role-bar&#x27;);
        host.querySelectorAll(&#x27;button&#x27;).forEach(b =&gt; b.remove());
        roles.forEach(role =&gt; {
          const b = document.createElement(&#x27;button&#x27;);
          b.type = &#x27;button&#x27;;
          b.className = `btn${role === activeRole ? &#x27; btn-primary&#x27; : &#x27;&#x27;}`;
          b.setAttribute(&#x27;aria-pressed&#x27;, String(role === activeRole));
          b.textContent = role;
          b.addEventListener(&#x27;click&#x27;, () =&gt; { activeRole = role; renderRoles(); renderQuickPath(); renderMap(); });
          host.appendChild(b);
        });
      }

      function renderQuickPath() {
        const host = root.querySelector(&#x27;#gd-quick-path&#x27;);
        host.innerHTML = &#x27;&lt;span class=&quot;quick-label&quot;&gt;常用路径：&lt;/span&gt;&#x27;;
        rolePaths[activeRole].forEach(([id,label]) =&gt; {
          const wrap = document.createElement(&#x27;span&#x27;);
          wrap.className = &#x27;quick-step&#x27;;
          const b = document.createElement(&#x27;button&#x27;);
          b.type = &#x27;button&#x27;;
          b.className = &#x27;btn btn-ghost&#x27;;
          b.textContent = label;
          b.addEventListener(&#x27;click&#x27;, () =&gt; selectModule(id));
          wrap.appendChild(b);
          host.appendChild(wrap);
        });
      }

      function renderMap() {
        const host = root.querySelector(&#x27;#gd-phase-flow&#x27;);
        host.innerHTML = &#x27;&#x27;;
        phaseData.forEach(phase =&gt; {
          const section = document.createElement(&#x27;section&#x27;);
          section.className = &#x27;phase&#x27;;
          const head = document.createElement(&#x27;div&#x27;);
          head.className = &#x27;phase-head&#x27;;
          head.innerHTML = `&lt;div class=&quot;phase-title&quot;&gt;&lt;span class=&quot;phase-no&quot;&gt;${phase.no}&lt;/span&gt;&lt;strong&gt;${phase.name}&lt;/strong&gt;&lt;/div&gt;&lt;span class=&quot;text-muted&quot;&gt;${phase.ids.length} 个模块&lt;/span&gt;`;
          const desc = document.createElement(&#x27;div&#x27;);
          desc.className = &#x27;phase-desc&#x27;;
          desc.textContent = phase.desc;
          const group = document.createElement(&#x27;div&#x27;);
          group.className = &#x27;phase-modules&#x27;;
          phase.ids.forEach(id =&gt; {
            const m = byId[id];
            const relevant = activeRole === &#x27;全部&#x27; || (roleModules[activeRole] || []).includes(id);
            const b = document.createElement(&#x27;button&#x27;);
            b.type = &#x27;button&#x27;;
            b.className = `btn module-btn${id === activeModule ? &#x27; btn-primary&#x27; : &#x27;&#x27;}${relevant ? &#x27;&#x27; : &#x27; is-dimmed&#x27;}`;
            b.setAttribute(&#x27;aria-pressed&#x27;, String(id === activeModule));
            b.textContent = `${m.name} · ${m.items.length}`;
            b.addEventListener(&#x27;click&#x27;, () =&gt; selectModule(id));
            group.appendChild(b);
          });
          section.append(head,desc,group);
          host.appendChild(section);
        });
      }

      function selectModule(id) {
        activeModule = id;
        renderMap();
        renderDetail();
        root.querySelector(&#x27;#gd-detail&#x27;).scrollIntoView({ behavior:&#x27;smooth&#x27;, block:&#x27;start&#x27; });
      }

      function renderDetail() {
        const m = byId[activeModule];
        const p = phaseData.find(x =&gt; x.ids.includes(activeModule));
        const q = profiles[activeModule];
        root.querySelector(&#x27;#gd-module-title&#x27;).textContent = m.name;
        root.querySelector(&#x27;#gd-module-phase&#x27;).textContent = `${p.no} ${p.name}`;
        root.querySelector(&#x27;#gd-module-purpose&#x27;).textContent = q.purpose;
        root.querySelector(&#x27;#gd-module-roles&#x27;).textContent = q.roles;
        root.querySelector(&#x27;#gd-module-when&#x27;).textContent = q.when;
        root.querySelector(&#x27;#gd-module-entry&#x27;).textContent = `毕业设计中心 → ${m.name}`;
        root.querySelector(&#x27;#gd-module-next&#x27;).textContent = q.next;
        root.querySelector(&#x27;#gd-sample-source&#x27;).textContent = q.sampleSource;
        root.querySelector(&#x27;#gd-safety&#x27;).textContent = `注意：${q.safety}`;
        root.querySelector(&#x27;#gd-leaf-count&#x27;).textContent = `共 ${m.items.length} 项`;

        const steps = root.querySelector(&#x27;#gd-module-steps&#x27;);
        steps.innerHTML = &#x27;&#x27;;
        q.steps.forEach((step,index) =&gt; {
          const li = document.createElement(&#x27;li&#x27;);
          const span = document.createElement(&#x27;span&#x27;);
          span.className = &#x27;step-label&#x27;;
          span.textContent = `${index + 1}. ${step}`;
          li.appendChild(span);
          steps.appendChild(li);
        });

        const sample = root.querySelector(&#x27;#gd-sample-grid&#x27;);
        sample.innerHTML = &#x27;&#x27;;
        q.fields.forEach(([key,value]) =&gt; {
          const row = document.createElement(&#x27;div&#x27;);
          row.className = &#x27;sample-row&#x27;;
          const k = document.createElement(&#x27;span&#x27;);
          k.className = &#x27;sample-key&#x27;;
          k.textContent = key;
          const v = document.createElement(&#x27;span&#x27;);
          v.textContent = value;
          row.append(k,v);
          sample.appendChild(row);
        });

        const chain = root.querySelector(&#x27;#gd-state-chain&#x27;);
        chain.innerHTML = &#x27;&#x27;;
        q.states.forEach((state,index) =&gt; {
          const node = document.createElement(&#x27;span&#x27;);
          node.className = &#x27;state-node&#x27;;
          node.textContent = state;
          chain.appendChild(node);
          if (index &lt; q.states.length - 1) {
            const arrow = document.createElement(&#x27;span&#x27;);
            arrow.className = &#x27;state-arrow&#x27;;
            arrow.textContent = &#x27;→&#x27;;
            chain.appendChild(arrow);
          }
        });

        const list = root.querySelector(&#x27;#gd-leaf-list&#x27;);
        list.innerHTML = &#x27;&#x27;;
        m.items.forEach((item,index) =&gt; {
          const li = document.createElement(&#x27;li&#x27;);
          li.className = &#x27;leaf&#x27;;
          const name = document.createElement(&#x27;div&#x27;);
          name.className = &#x27;leaf-name&#x27;;
          name.innerHTML = `&lt;span class=&quot;leaf-index&quot;&gt;${String(index + 1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;span&gt;${item}&lt;/span&gt;`;
          const use = document.createElement(&#x27;p&#x27;);
          use.className = &#x27;leaf-use&#x27;;
          use.textContent = usageFor(item,m.name);
          li.append(name,use);
          list.appendChild(li);
        });
      }

      renderRoles();
      renderQuickPath();
      renderMap();
      renderDetail();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
